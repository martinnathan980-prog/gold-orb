<script>
// ============================================================
// NEXUS PLM — fiche complète (panneau latéral).
//
// Chaque sous-ensemble n'affiche que les champs de SON type : une structure
// boîte montre sa géométrie et ses deux familles de composants, un harnais
// son PN et sa référence, une plaquette ses mots-clés. Rien n'est rendu
// « au cas où ». La boîte, elle, porte ses boutons, voyants, interrupteurs.
//
// Les champs d'édition sont relus par data-champ / data-ligne : aucun
// identifiant construit à partir d'une donnée, donc aucun nom de colonne
// ou d'ID ne peut casser un sélecteur.
// ============================================================

function estMultiBoite(champ) { return (Store.config.multiBoite || []).indexOf(champ) !== -1; }

// ------------------------------------------------------------
// Briques d'affichage
// ------------------------------------------------------------
function pucesHtml(valeurs, actionSuppr, donnees, editable, classe) {
  if (!valeurs.length) return '<span class="vide">Aucun</span>';
  return valeurs.map(function (v) {
    const suppr = editable
      ? '<button type="button" class="puce-suppr" aria-label="Retirer ' + esc(v) + '"' +
        dataAttrs(Object.assign({ action: actionSuppr, valeur: v }, donnees)) + '>&times;</button>'
      : '';
    return '<span class="puce ' + (classe || '') + '">' + esc(v) + suppr + '</span>';
  }).join('');
}

function apercuImageHtml(valeur, classe) {
  const url = urlMiniature(valeur);
  if (!url) return '';
  return '<button type="button" class="vignette ' + (classe || '') + '"' +
         dataAttrs({ action: 'agrandir-image', url: url }) +
         ' aria-label="Agrandir l\'image"><img src="' + esc(url) + '" alt="" loading="lazy"></button>';
}

function ligneHtml(libelle, contenu, aide) {
  return '<div class="ligne">' +
           '<div class="ligne-cle">' + esc(libelle) +
             (aide ? '<span class="ligne-aide">' + esc(aide) + '</span>' : '') + '</div>' +
           '<div class="ligne-val">' + contenu + '</div>' +
         '</div>';
}

function saisieHtml(champ, valeur, classe, ligneId) {
  const base = ' class="saisie ' + classe + '" data-champ="' + esc(champ.cle) + '"' +
               (ligneId ? ' data-ligne="' + esc(ligneId) + '"' : '');
  if (champ.genre === GENRE.LONG) {
    return '<textarea' + base + ' rows="3">' + esc(valeur) + '</textarea>';
  }
  if (champ.genre === GENRE.NOMBRE) {
    return '<input type="text" inputmode="decimal"' + base + ' value="' + esc(valeur) + '">';
  }
  return '<input type="text"' + base +
         (champ.liste ? ' list="' + esc(champ.liste) + '"' : '') +
         ' value="' + esc(valeur) + '">';
}

/**
 * Bloc d'un champ à valeurs multiples : puces + ajout, sans passer en édition.
 * Une liste FERMÉE (champ.options) se choisit dans un menu, on ne tape pas.
 */
function blocMultiHtml(champ, valeurs, editable, actionAjout, actionSuppr, donnees, classe) {
  let ajout = '';
  if (editable && champ.options) {
    // Liste fermée : choisir, c'est vouloir. L'ajout se fait au choix, il n'y
    // a rien à confirmer derrière.
    const restantes = champ.options.filter(function (o) {
      return !valeurs.some(function (v) { return normaliserTexte(v) === normaliserTexte(o); });
    });
    ajout = restantes.length
      ? '<div class="ajout-multi">' +
          '<select class="saisie-multi saisie-multi-seule"' +
            dataAttrs(Object.assign({ ajout: actionAjout }, donnees)) +
            ' aria-label="Ajouter à ' + esc(champ.libelle) + '">' +
            '<option value="">Ajouter ' + esc(champ.libelle.toLowerCase()) + '…</option>' +
            restantes.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') +
          '</select>' +
        '</div>'
      : '';
  } else if (editable) {
    // Champ libre : le bouton reste, mais Entrée suffit, et choisir une
    // suggestion de la liste ajoute directement.
    ajout = '<div class="ajout-multi">' +
        '<input type="text" class="saisie-multi"' +
          (champ.liste ? ' list="' + esc(champ.liste) + '"' : '') +
          dataAttrs(Object.assign({ ajout: actionAjout }, donnees)) +
          ' placeholder="Ajouter…" aria-label="Ajouter à ' + esc(champ.libelle) + '">' +
        '<button type="button" class="btn-mini"' +
          dataAttrs(Object.assign({ action: actionAjout }, donnees)) + '>Ajouter</button>' +
      '</div>';
  }
  return '<div class="ligne ligne-bloc">' +
           '<div class="ligne-cle">' + esc(champ.libelle) +
             (champ.aide ? '<span class="ligne-aide">' + esc(champ.aide) + '</span>' : '') + '</div>' +
           '<div class="ligne-val">' +
             '<div class="puces">' + pucesHtml(valeurs, actionSuppr, donnees, editable, classe) + '</div>' +
             ajout +
           '</div>' +
         '</div>';
}

/**
 * Composants à trois niveaux, en colonnes : fonction, norme, référence.
 * Toujours éditable, comme toute liste : on ajoute et on retire sans passer
 * la fiche en mode édition.
 */
function blocComposantsHtml(champ, valeur, cible) {
  const composants = listeComposants(valeur);
  const categorie = champ.categorie || 'composant';
  const donnees = { portee: cible.portee, id: cible.id, champ: champ.cle };

  const lignes = composants.length
    ? composants.map(function (c) {
        const cellule = function (niveau, texte) {
          return texte
            ? '<span class="niveau-' + niveau + '">' + esc(texte) + '</span>'
            : '<span class="niveau-' + niveau + ' niveau-vide">non précisé</span>';
        };
        return '<div class="composant">' +
          cellule('fonction', c.fonction) + cellule('norme', c.norme) + cellule('reference', c.reference) +
          '<button type="button" class="puce-suppr" aria-label="Retirer ' + esc(libelleComposant(c)) + '"' +
            dataAttrs(Object.assign({ action: 'supprimer-composant', valeur: c.brut }, donnees)) +
          '>&times;</button>' +
        '</div>';
      }).join('')
    : '<p class="composants-vide">Aucun composant. Ajoutez-en un ci-dessous, ou depuis le catalogue.</p>';

  const saisie = function (niveau, texte) {
    return '<input type="text" class="saisie-composant" data-niveau="' + niveau + '"' +
           dataAttrs(donnees) + ' list="list-' + niveau + '-' + esc(categorie) + '"' +
           ' placeholder="' + esc(texte) + '" aria-label="' + esc(texte) + '">';
  };

  return '<div class="ligne ligne-bloc">' +
    '<div class="ligne-cle">' + esc(champ.libelle) +
      (champ.aide ? '<span class="ligne-aide">' + esc(champ.aide) + '</span>' : '') + '</div>' +
    '<div class="ligne-val">' +
      '<div class="composants">' +
        '<div class="composants-entete"><span>Fonction</span><span>Norme</span><span>Référence</span><span></span></div>' +
        lignes +
      '</div>' +
      '<div class="ajout-composant">' +
        saisie('fonction', 'Fonction') + saisie('norme', 'Norme') + saisie('reference', 'Référence') +
        '<button type="button" class="btn-mini"' +
          dataAttrs(Object.assign({ action: 'ajouter-composant' }, donnees)) + '>Ajouter</button>' +
      '</div>' +
      '<div class="composants-outils">' +
        '<button type="button" class="btn-lien"' +
          dataAttrs(Object.assign({ action: 'ouvrir-catalogue', categorie: categorie }, donnees)) +
          '>Choisir dans le catalogue</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ------------------------------------------------------------
// Bloc « Général » de la boîte
// ------------------------------------------------------------
function blocBoiteHtml(boite) {
  const edition = Store.enEditionBoite;
  const pn = boite[CLE_PN()];

  // Pas de duplication ici : une boîte se duplique depuis la liste.
  const actions = edition
    ? boutonHtml('sauver-boite', {}, 'Enregistrer', 'btn-valider') +
      boutonHtml('annuler-boite', {}, 'Annuler', 'btn-neutre')
    : boutonHtml('editer-boite', {}, 'Éditer', 'btn-neutre') +
      boutonHtml('supprimer-boite', { pn: pn }, 'Supprimer', 'btn-danger');

  let html = '<section class="bloc bloc-general">' +
    '<header class="bloc-tete">' +
      '<h3>Boîte</h3>' +
      '<div class="bloc-actions"><span id="spin-boite" class="zone-spin"></span>' + actions + '</div>' +
    '</header>';

  if (!edition) html += apercuImageHtml(boite['Image'], 'vignette-large');

  Store.headersBoites.forEach(function (cle) {
    const valeur = boite[cle];
    const regle = CHAMPS_BOITE[cle] || {};
    const genre = regle.genre ||
      (cle.toLowerCase().indexOf('image') !== -1 ? GENRE.IMAGE :
       cle.toLowerCase().indexOf('comment') !== -1 ? GENRE.LONG :
       estMultiBoite(cle) ? GENRE.MULTI : GENRE.TEXTE);

    if (genre === GENRE.COMPOSANTS) {
      html += blocComposantsHtml({ cle: cle, libelle: cle, categorie: regle.categorie, aide: regle.aide },
                                 valeur, { portee: 'boite', id: null });
      return;
    }
    if (genre === GENRE.MULTI) {
      // Le porteur se choisit dans la liste fermée des porteurs Airbus Helicopters.
      const champ = { cle: cle, libelle: cle, liste: regle.liste || null,
                      options: regle.ferme ? porteursConnus() : null };
      html += blocMultiHtml(champ, valeursMulti(valeur), true,
                            'ajouter-multi-boite', 'supprimer-multi-boite', { champ: cle },
                            regle.ferme ? 'puce-porteur' : '');
      return;
    }

    const champ = { cle: cle, libelle: genre === GENRE.IMAGE ? 'Image (URL)' : cle,
                    genre: genre === GENRE.LONG ? GENRE.LONG : GENRE.TEXTE,
                    liste: regle.liste || null };

    if (edition) { html += ligneHtml(champ.libelle, saisieHtml(champ, valeur, 'champ-boite')); return; }
    if (genre === GENRE.IMAGE) return;         // déjà présentée en vignette
    html += ligneHtml(champ.libelle, valeurLisibleHtml(valeur));
  });

  return html + '</section>';
}

function valeurLisibleHtml(valeur) {
  const t = txt(valeur);
  return t === '-' ? '<span class="vide">—</span>' : esc(t).replace(/\n/g, '<br>');
}

function boutonHtml(action, donnees, libelle, classe) {
  return '<button type="button" class="btn-action ' + (classe || '') + '"' +
         dataAttrs(Object.assign({ action: action }, donnees)) + '>' + esc(libelle) + '</button>';
}

// ------------------------------------------------------------
// Bloc d'un sous-ensemble — piloté par son type
// ------------------------------------------------------------
function blocNomHtml(ligne) {
  const id = ligne[CLE_NOM()];
  const type = typeDe(ligne);
  const edition = !!Store.enEditionNom[id];

  const actions = edition
    ? boutonHtml('sauver-nom', { id: id }, 'Enregistrer', 'btn-valider') +
      boutonHtml('annuler-nom', { id: id }, 'Annuler', 'btn-neutre')
    : boutonHtml('comparer-nom', { id: id }, 'Équivalences', 'btn-accent') +
      boutonHtml('editer-nom', { id: id }, 'Éditer', 'btn-neutre') +
      boutonHtml('supprimer-nom', { id: id }, 'Supprimer', 'btn-danger');

  let html = '<section class="bloc bloc-' + type.teinte + '">' +
    '<header class="bloc-tete">' +
      '<div class="bloc-identite">' +
        '<span class="pastille-type ' + type.teinte + '">' + type.icone + '</span>' +
        '<div>' +
          '<h3>' + esc(type.libelle) + '</h3>' +
          '<p class="bloc-pn">' + esc(txt(ligne['PN du type'], 'sans PN')) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="bloc-actions"><span id="spin-nom-' + esc(id) + '" class="zone-spin"></span>' +
        actions + '</div>' +
    '</header>';

  if (edition) {
    html += ligneHtml('Type', saisieHtml({ cle: 'Type', genre: GENRE.TEXTE, liste: 'list-Type' },
                                         ligne['Type'], 'champ-nom', id),
                      'change la fiche affichée');
  }

  // Réemploi : la même pièce est-elle montée ailleurs ?
  const ailleurs = boitesUtilisant(ligne['PN du type'], ligne[CLE_PN()]);
  if (ailleurs.length) {
    html += '<div class="usages">' +
      '<span class="usages-titre">Aussi montée dans</span>' +
      ailleurs.map(function (pn) {
        return '<button type="button" class="usage-lien"' +
               dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
      }).join('') +
    '</div>';
  }

  if (!edition) html += apercuImageHtml(ligne['Image'], '');

  // Seuls les champs du type : c'est tout l'intérêt du registre.
  champsDuType(type).forEach(function (champ) {
    const valeur = ligne[champ.cle];

    if (champ.genre === GENRE.COMPOSANTS) {
      html += blocComposantsHtml(champ, valeur, { portee: 'nom', id: id });
      return;
    }

    if (champ.genre === GENRE.MULTI) {
      html += blocMultiHtml(champ, valeursMulti(valeur), true,
                            'ajouter-multi-nom', 'supprimer-multi-nom',
                            { id: id, champ: champ.cle });
      return;
    }

    if (champ.genre === GENRE.MOTS_CLES) {
      html += blocMultiHtml(champ, motsCles(valeur), true,
                            'ajouter-multi-nom', 'supprimer-multi-nom',
                            { id: id, champ: champ.cle }, 'puce-motcle');
      return;
    }

    if (champ.genre === GENRE.IMAGE) {
      if (edition) html += ligneHtml('Image (URL)', saisieHtml(champ, valeur, 'champ-nom', id));
      return;
    }

    if (edition) {
      html += ligneHtml(champ.libelle, saisieHtml(champ, valeur, 'champ-nom', id), champ.aide);
      return;
    }
    html += ligneHtml(champ.libelle, valeurLisibleHtml(valeur), champ.aide);
  });

  return html + '</section>';
}

// ------------------------------------------------------------
// Boîte complète
// ------------------------------------------------------------
function ficheHtml(boite) {
  if (!boite) {
    return '<div class="etat-vide">' +
             '<p>Cette boîte n\'existe plus.</p>' +
             '<p class="etat-vide-aide">Fermez le panneau : la liste est à jour.</p>' +
           '</div>';
  }

  const lignes = boite.nomenclature || [];
  const parType = new Map();
  lignes.forEach(function (l) {
    const t = typeDe(l);
    if (!parType.has(t.cle)) parType.set(t.cle, []);
    parType.get(t.cle).push(l);
  });

  const sommaire = parType.size
    ? '<nav class="sommaire" aria-label="Composition">' +
        Array.from(parType.entries()).map(function (e) {
          const t = typeParCle(e[0]);
          return '<span class="sommaire-item ' + t.teinte + '">' + t.icone + ' ' +
                 esc(t.libelle) + ' <b>' + e[1].length + '</b></span>';
        }).join('') +
      '</nav>'
    : '';

  return sommaire +
         blocBoiteHtml(boite) +
         lignes.map(blocNomHtml).join('') +
         '<div class="fiche-pied">' +
           boutonHtml('nouveau-sous-ensemble', {}, '+ Ajouter un sous-ensemble', 'btn-principal') +
         '</div>';
}

function rendreFiche() {
  const boite = boiteCourante();
  definirTexte('slideOverTitle', boite ? txt(boite[CLE_PN()]) : 'Fiche');
  const sous = parId('slideOverSousTitre');
  if (sous) {
    sous.textContent = boite
      ? txt(boite['Fonction'], 'sans fonction') + ' · ' +
        (boite.nomenclature || []).length + ' sous-ensemble(s)'
      : '';
  }
  definirHtml('slideOverBody', ficheHtml(boite));
}

// ------------------------------------------------------------
// Lecture des champs d'édition
// ------------------------------------------------------------
function lireChamps(classe, ligneId) {
  const modifs = {};
  document.querySelectorAll('.' + classe).forEach(function (el) {
    if (ligneId !== undefined && el.dataset.ligne !== String(ligneId)) return;
    modifs[el.dataset.champ] = el.value;
  });
  return modifs;
}

function lireSaisieMulti(champ, ligneId) {
  let trouve = null;
  document.querySelectorAll('.saisie-multi').forEach(function (el) {
    if (trouve) return;
    if (el.dataset.champ !== champ) return;
    if (ligneId !== undefined && el.dataset.id !== String(ligneId)) return;
    trouve = el;
  });
  if (!trouve) return '';
  const valeur = trouve.value.trim();
  trouve.value = '';
  return valeur;
}

/** Les trois champs d'un composant en cours de saisie -> { fonction, norme, reference } | null. */
function lireSaisieComposant(champ, ligneId) {
  const c = { fonction: '', norme: '', reference: '' };
  const trouves = [];
  document.querySelectorAll('.saisie-composant').forEach(function (el) {
    if (el.dataset.champ !== champ) return;
    if (ligneId !== undefined && ligneId !== null && el.dataset.id !== String(ligneId)) return;
    if (!ligneId && el.dataset.id) return;
    c[el.dataset.niveau] = el.value.trim();
    trouves.push(el);
  });
  if (!c.fonction) return null;
  trouves.forEach(function (el) { el.value = ''; });
  return c;
}
</script>
