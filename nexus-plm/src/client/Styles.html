<style>
/* ============================================================
   NEXUS PLM — design system.

   Typographie choisie pour le sujet : IBM Plex Sans (conçue pour la
   documentation technique), IBM Plex Mono pour les PN — un numéro de pièce
   est de la donnée, il se lit en chasse fixe et s'aligne en colonne —,
   Archivo pour les titres, plus resserrée et plus industrielle.

   Les couleurs de TYPE (structure / harnais / plaquette) sont sémantiques :
   elles encodent une information, elles ne décorent pas, et elles sont
   distinctes de la couleur d'accent.
   ============================================================ */

:root {
  color-scheme: light;

  /* Neutres légèrement bleutés, accordés à l'accent — un gris pur sonnerait
     par défaut plutôt que choisi. */
  --sol: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --surface-3: #eef1f7;
  --encre: #101a2b;
  --encre-2: #3d4b60;
  --encre-3: #6b7a91;
  --trait: #dde3ed;
  --trait-fort: #c3cddd;

  --marine: #0d1b2a;
  --marine-2: #17293f;
  --accent: #0b5fd0;
  --accent-encre: #0a4fae;
  --accent-voile: #e8f0fd;
  --accent-trait: #bcd5f7;

  --vert: #15803d;   --vert-voile: #e7f6ec;  --vert-trait: #b7e3c5;
  --ambre: #b45309;  --ambre-voile: #fdf3e3; --ambre-trait: #f2d9a8;
  --rouge: #c02626;  --rouge-voile: #fdeaea; --rouge-trait: #f3c2c2;

  /* Types de sous-ensembles */
  --t-structure: #3f5f9e; --t-structure-voile: #eaf0fa;
  --t-harnais:   #a2622a; --t-harnais-voile:   #fbf1e6;
  --t-plaquette: #0f766e; --t-plaquette-voile: #e4f4f2;
  --t-autre:     #6d5595; --t-autre-voile:     #f1ecf8;

  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 24px; --e-6: 32px; --e-7: 48px;
  --large: 1460px;

  --ombre-1: 0 1px 2px rgba(16,26,43,.06), 0 2px 8px rgba(16,26,43,.04);
  --ombre-2: 0 4px 12px rgba(16,26,43,.08), 0 12px 32px rgba(16,26,43,.07);
  --ombre-3: 0 18px 48px rgba(16,26,43,.18);

  --police: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --police-titre: "Archivo", "IBM Plex Sans", -apple-system, sans-serif;
  --police-data: "IBM Plex Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
}

:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) { color-scheme: dark; }
}

/* Thème sombre : on ne redéfinit QUE les jetons, jamais un composant, pour
   qu'aucune couleur n'existe uniquement derrière une media query. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sol: #0d1420;
    --surface: #151d2b;
    --surface-2: #1a2433;
    --surface-3: #212c3d;
    --encre: #e7edf7;
    --encre-2: #b3c0d4;
    --encre-3: #8595ac;
    --trait: #273345;
    --trait-fort: #35455c;

    --marine: #0a111c;
    --marine-2: #162232;
    --accent: #6aa8ff;
    --accent-encre: #9cc5ff;
    --accent-voile: #16273f;
    --accent-trait: #2d4a72;

    --vert: #5cc98a;   --vert-voile: #14301f;  --vert-trait: #245c3a;
    --ambre: #e8ab5a;  --ambre-voile: #332413; --ambre-trait: #6b4a1e;
    --rouge: #f28080;  --rouge-voile: #3a1a1a; --rouge-trait: #6e2f2f;

    --t-structure: #8fb0e8; --t-structure-voile: #1a263c;
    --t-harnais:   #e0a877; --t-harnais-voile:   #33241a;
    --t-plaquette: #5cc9bd; --t-plaquette-voile: #123330;
    --t-autre:     #b39ede; --t-autre-voile:     #261f38;

    --ombre-1: 0 1px 2px rgba(0,0,0,.4);
    --ombre-2: 0 4px 14px rgba(0,0,0,.45);
    --ombre-3: 0 18px 48px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --sol: #0d1420;
  --surface: #151d2b;
  --surface-2: #1a2433;
  --surface-3: #212c3d;
  --encre: #e7edf7;
  --encre-2: #b3c0d4;
  --encre-3: #8595ac;
  --trait: #273345;
  --trait-fort: #35455c;

  --marine: #0a111c;
  --marine-2: #162232;
  --accent: #6aa8ff;
  --accent-encre: #9cc5ff;
  --accent-voile: #16273f;
  --accent-trait: #2d4a72;

  --vert: #5cc98a;   --vert-voile: #14301f;  --vert-trait: #245c3a;
  --ambre: #e8ab5a;  --ambre-voile: #332413; --ambre-trait: #6b4a1e;
  --rouge: #f28080;  --rouge-voile: #3a1a1a; --rouge-trait: #6e2f2f;

  --t-structure: #8fb0e8; --t-structure-voile: #1a263c;
  --t-harnais:   #e0a877; --t-harnais-voile:   #33241a;
  --t-plaquette: #5cc9bd; --t-plaquette-voile: #123330;
  --t-autre:     #b39ede; --t-autre-voile:     #261f38;

  --ombre-1: 0 1px 2px rgba(0,0,0,.4);
  --ombre-2: 0 4px 14px rgba(0,0,0,.45);
  --ombre-3: 0 18px 48px rgba(0,0,0,.6);
}

/* ---------------- socle ---------------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--sol);
  color: var(--encre);
  font-family: var(--police);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--police-titre); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.enveloppe { max-width: var(--large); margin-inline: auto; padding-inline: var(--e-4); }
.vide { color: var(--encre-3); font-size: 13px; }

/* ---------------- en-tête ---------------- */
.entete {
  background: linear-gradient(168deg, var(--marine) 0%, var(--marine-2) 100%);
  color: #fff;
  padding-block: var(--e-4) var(--e-5);
  border-bottom: 1px solid var(--trait);
}
.entete-corps {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--e-4); flex-wrap: wrap; margin-bottom: var(--e-5);
}
.marque { display: flex; align-items: center; gap: var(--e-3); }
.marque-sigle {
  font-size: 22px; color: #7fb2ff; line-height: 1;
  display: grid; place-items: center; width: 40px; height: 40px;
  border: 1px solid rgba(127,178,255,.35); border-radius: var(--r-m);
  background: rgba(127,178,255,.1);
}
.marque h1 { font-size: 21px; font-weight: 800; color: #fff; letter-spacing: .02em; }
.marque p { font-size: 12px; color: #93b4df; margin-top: 1px; }

.entete-outils { display: flex; gap: var(--e-2); flex-wrap: wrap; }
.btn-entete {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.09); color: #fff;
  border: 1px solid rgba(255,255,255,.18); border-radius: var(--r-s);
  padding: 7px 13px; font-size: 13px; font-weight: 500; transition: background .15s;
}
.btn-entete:hover { background: rgba(255,255,255,.18); }
.btn-entete-fort { background: var(--accent); border-color: transparent; font-weight: 600; }
.btn-entete-fort:hover { background: #0a4fae; }
.badge-compte {
  background: rgba(255,255,255,.2); border-radius: 20px;
  padding: 0 6px; font-size: 11px; font-variant-numeric: tabular-nums;
}

/* ---------------- indicateurs ---------------- */
.indicateurs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--e-3); margin: 0; position: relative;
}
.indicateur {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--r-m); padding: var(--e-3) var(--e-4);
}
.indicateur dt { font-size: 11px; color: #93b4df; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.indicateur dd {
  margin: 2px 0 0; font-family: var(--police-titre); font-size: 27px; font-weight: 700;
  color: #fff; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.indicateur-valide { border-color: rgba(92,201,138,.3); background: rgba(92,201,138,.08); }
.indicateur-detail { font-size: 12px; color: #7fdba3; font-weight: 600; }
.indicateurs-portee {
  grid-column: 1 / -1; font-size: 11px; color: #7f9dc4;
  text-align: right; margin-top: calc(var(--e-1) * -1);
}

/* ---------------- recherche et filtres ---------------- */
.contenu { padding-block: var(--e-5) var(--e-7); }

.barre-recherche {
  display: flex; gap: var(--e-2); align-items: stretch; flex-wrap: wrap;
  margin-top: calc(var(--e-6) * -1 - 6px); margin-bottom: var(--e-4);
}
.champ-recherche {
  flex: 1 1 320px; display: flex; align-items: center; gap: var(--e-2);
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: var(--r-m); padding: 0 var(--e-3); box-shadow: var(--ombre-2);
}
.champ-recherche:focus-within { border-color: var(--accent); }
.champ-recherche-icone { color: var(--encre-3); font-size: 18px; }
.champ-recherche input {
  flex: 1; border: 0; background: transparent; color: var(--encre);
  padding: 13px 0; font-size: 14px; outline: none; min-width: 0;
}
.raccourci {
  border: 1px solid var(--trait); border-radius: 5px; padding: 1px 6px;
  font-size: 11px; color: var(--encre-3); background: var(--surface-3);
  font-family: var(--police-data);
}

.filtres-type { display: flex; flex-wrap: wrap; gap: var(--e-2); margin-bottom: var(--e-3); }
.jeton {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: 20px; padding: 5px 12px; font-size: 12.5px; font-weight: 500;
  color: var(--encre-2); transition: .15s;
}
.jeton:hover { border-color: var(--trait-fort); }
.jeton-compte { font-variant-numeric: tabular-nums; color: var(--encre-3); font-size: 11.5px; }
.jeton.actif { color: #fff; border-color: transparent; }
.jeton.actif .jeton-compte { color: rgba(255,255,255,.75); }
.jeton.type-structure.actif { background: var(--t-structure); }
.jeton.type-harnais.actif   { background: var(--t-harnais); }
.jeton.type-plaquette.actif { background: var(--t-plaquette); }
.jeton.type-autre.actif     { background: var(--t-autre); }

.filtres-actifs { display: flex; flex-wrap: wrap; gap: var(--e-2); align-items: center; }
.filtres-actifs:not(:empty) { margin-bottom: var(--e-3); }
.filtre-jeton {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-voile); color: var(--accent-encre);
  border: 1px solid var(--accent-trait); border-radius: 20px;
  padding: 4px 6px 4px 12px; font-size: 12.5px; font-weight: 500;
}
.filtre-jeton button {
  border: 0; background: transparent; color: inherit; font-size: 15px;
  line-height: 1; padding: 0 4px; opacity: .7;
}
.filtre-jeton button:hover { opacity: 1; }
.filtre-bilan { font-size: 12.5px; color: var(--encre-3); margin-left: auto; font-variant-numeric: tabular-nums; }

.barre-liste {
  display: flex; gap: var(--e-3); align-items: center; justify-content: space-between;
  flex-wrap: wrap; margin-bottom: var(--e-4);
}
.onglets { display: flex; gap: var(--e-2); overflow-x: auto; padding-bottom: 4px; flex: 1 1 auto; }
.onglets::-webkit-scrollbar { height: 3px; }
.onglets::-webkit-scrollbar-thumb { background: var(--trait-fort); border-radius: 3px; }
.onglet {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: transparent; border: 1px solid transparent; border-radius: var(--r-s);
  padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--encre-2);
}
.onglet:hover { background: var(--surface-3); }
.onglet-compte {
  background: var(--surface-3); border-radius: 20px; padding: 0 6px;
  font-size: 11px; font-variant-numeric: tabular-nums; color: var(--encre-3);
}
.onglet.actif { background: var(--marine); border-color: var(--marine); color: #fff; }
.onglet.actif .onglet-compte { background: rgba(255,255,255,.18); color: #fff; }

.tri { display: inline-flex; align-items: center; gap: var(--e-2); font-size: 12.5px; color: var(--encre-3); }
.tri-select {
  background: var(--surface); color: var(--encre); border: 1px solid var(--trait);
  border-radius: var(--r-s); padding: 6px 10px; font-size: 13px;
}

.chargement {
  display: flex; align-items: center; justify-content: center; gap: var(--e-3);
  padding: var(--e-7) 0; color: var(--encre-3);
}

/* ---------------- grille de cartes ---------------- */
.grille {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: var(--e-4);
}
.carte {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: var(--r-l); box-shadow: var(--ombre-1);
  transition: box-shadow .18s, border-color .18s, transform .18s;
}
.carte:hover { box-shadow: var(--ombre-2); border-color: var(--trait-fort); transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .carte { transition: none; } .carte:hover { transform: none; } }

.carte-visuel { display: block; border: 0; padding: 0; background: none; width: 100%; }
.carte-image {
  display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%;
  object-fit: contain; background: var(--surface-3);
  border-bottom: 1px solid var(--trait);
}
.carte-image-absente {
  display: grid; place-items: center;
  font-family: var(--police-titre); font-size: 30px; font-weight: 800;
  color: var(--trait-fort); letter-spacing: .06em;
}
.carte-corps { display: flex; flex-direction: column; gap: var(--e-3); padding: var(--e-4); flex: 1; }
.carte-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-2); }
.carte-pn {
  font-family: var(--police-data); font-size: 16px; font-weight: 600;
  color: var(--accent); word-break: break-all; line-height: 1.3;
}
.carte-fonction {
  font-size: 12px; font-weight: 600; color: var(--encre-3);
  text-transform: uppercase; letter-spacing: .06em; margin-top: -8px;
}
.carte-vide { font-size: 12.5px; color: var(--encre-3); font-style: italic; }

.statut {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 8px; border-radius: 5px; white-space: nowrap; border: 1px solid;
}
.status-valide   { background: var(--vert-voile);  color: var(--vert);  border-color: var(--vert-trait); }
.status-etude    { background: var(--ambre-voile); color: var(--ambre); border-color: var(--ambre-trait); }
.status-obsolete { background: var(--rouge-voile); color: var(--rouge); border-color: var(--rouge-trait); }

.composition { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.composition li {
  display: flex; align-items: center; gap: var(--e-2);
  font-size: 12.5px; color: var(--encre-2);
  padding: 5px 9px; border-radius: var(--r-s); border-left: 3px solid;
}
.composition li b { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
.composition .type-structure { background: var(--t-structure-voile); border-color: var(--t-structure); }
.composition .type-harnais   { background: var(--t-harnais-voile);   border-color: var(--t-harnais); }
.composition .type-plaquette { background: var(--t-plaquette-voile); border-color: var(--t-plaquette); }
.composition .type-autre     { background: var(--t-autre-voile);     border-color: var(--t-autre); }

.carte-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--e-3); margin: 0; font-size: 12.5px; }
.carte-meta dt { color: var(--encre-3); }
.carte-meta dd { margin: 0; text-align: right; font-family: var(--police-data); font-size: 12px; color: var(--encre-2); word-break: break-word; }
.carte-actions { display: flex; gap: var(--e-2); margin-top: auto; padding-top: var(--e-2); }
.carte-actions > * { flex: 1; }

/* ---------------- boutons ---------------- */
.btn-principal, .btn-neutre, .btn-accent, .btn-mini, .btn-lien, .btn-action {
  border-radius: var(--r-s); border: 1px solid transparent;
  font-weight: 600; transition: .15s; text-align: center;
}
.btn-principal { background: var(--marine); color: #fff; padding: 9px 16px; font-size: 13px; }
.btn-principal:hover { background: var(--marine-2); }
.btn-neutre { background: var(--surface); color: var(--encre); border-color: var(--trait); padding: 8px 14px; font-size: 13px; }
.btn-neutre:hover { background: var(--surface-3); border-color: var(--trait-fort); }
.btn-accent { background: var(--accent-voile); color: var(--accent-encre); border-color: var(--accent-trait); padding: 9px 16px; font-size: 13px; }
.btn-accent:hover { background: var(--accent-trait); }
.btn-mini { background: var(--surface-3); color: var(--encre-2); padding: 5px 11px; font-size: 12px; border-color: var(--trait); }
.btn-mini:hover { background: var(--trait); }
.btn-lien { background: none; border: 0; color: var(--accent); padding: 4px 6px; font-size: 12.5px; text-decoration: underline; }
.btn-action { padding: 5px 11px; font-size: 12px; }
.btn-valider { background: var(--vert); color: #fff; }
.btn-danger  { background: var(--rouge-voile); color: var(--rouge); border-color: var(--rouge-trait); }
.btn-danger:hover { background: var(--rouge); color: #fff; }

/* ---------------- panneau (fiche) ---------------- */
.panneau {
  width: min(720px, 100vw) !important;
  background: var(--sol); color: var(--encre);
  border-left: 1px solid var(--trait);
}
.panneau-tete {
  background: var(--surface); border-bottom: 1px solid var(--trait);
  box-shadow: var(--ombre-1); align-items: flex-start; gap: var(--e-3);
}
.panneau-tete .offcanvas-title {
  font-family: var(--police-data); font-size: 17px; font-weight: 600;
  color: var(--accent); word-break: break-all;
}
.panneau-sous { font-size: 12.5px; color: var(--encre-3); margin-top: 2px; }
.panneau-actions { display: flex; align-items: center; gap: var(--e-2); flex-shrink: 0; }
.offcanvas-body { padding: var(--e-4); }

.sommaire { display: flex; flex-wrap: wrap; gap: var(--e-2); margin-bottom: var(--e-4); }
.sommaire-item {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px;
  border: 1px solid;
}
.sommaire-item b { font-variant-numeric: tabular-nums; }
.sommaire-item.type-structure { background: var(--t-structure-voile); color: var(--t-structure); border-color: var(--t-structure); }
.sommaire-item.type-harnais   { background: var(--t-harnais-voile);   color: var(--t-harnais);   border-color: var(--t-harnais); }
.sommaire-item.type-plaquette { background: var(--t-plaquette-voile); color: var(--t-plaquette); border-color: var(--t-plaquette); }
.sommaire-item.type-autre     { background: var(--t-autre-voile);     color: var(--t-autre);     border-color: var(--t-autre); }

.bloc {
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: var(--r-m); padding: var(--e-4); margin-bottom: var(--e-3);
  box-shadow: var(--ombre-1);
}
.bloc-general { border-top: 3px solid var(--accent); }
.bloc-type-structure { border-top: 3px solid var(--t-structure); }
.bloc-type-harnais   { border-top: 3px solid var(--t-harnais); }
.bloc-type-plaquette { border-top: 3px solid var(--t-plaquette); }
.bloc-type-autre     { border-top: 3px solid var(--t-autre); }

.bloc-tete {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--e-3); padding-bottom: var(--e-3); margin-bottom: var(--e-3);
  border-bottom: 1px solid var(--trait); flex-wrap: wrap;
}
.bloc-tete h3 { font-size: 14px; font-weight: 700; }
.bloc-identite { display: flex; gap: var(--e-3); align-items: center; }
.bloc-pn { font-family: var(--police-data); font-size: 12.5px; color: var(--encre-3); word-break: break-all; }
.pastille-type {
  display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0;
  border-radius: var(--r-s); font-size: 15px; border: 1px solid;
}
.pastille-type.type-structure { background: var(--t-structure-voile); color: var(--t-structure); border-color: var(--t-structure); }
