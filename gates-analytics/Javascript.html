<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  function ech(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/\x3C/g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(v) {
    return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  }
  function nb(n) { return n.toLocaleString('fr-FR'); }

  /* ============================================================
     SEMAINES ISO
     ============================================================ */
  function lundiDeLaSemaine(annee, semaine) {
    var jan4 = new Date(Date.UTC(annee, 0, 4));
    var jour = jan4.getUTCDay() || 7;
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jour + 1 + (semaine - 1) * 7);
    return lundi;
  }
  function etiquetteISO(d) {
    var t = new Date(d.getTime());
    var jour = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - jour);
    var debut = Date.UTC(t.getUTCFullYear(), 0, 1);
    var s = Math.ceil(((t.getTime() - debut) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-S' + (s < 10 ? '0' : '') + s;
  }
  /** « 2026-S34 » -> le lundi de cette semaine. null si le libellé est illisible. */
  function lundiDeLibelle(libelle) {
    var m = /^\s*(\d{4})\s*-?\s*[sS]\s*(\d{1,2})\s*$/.exec(String(libelle || ''));
    if (!m) return null;
    var s = parseInt(m[2], 10);
    if (s < 1 || s > 53) return null;
    return lundiDeLaSemaine(parseInt(m[1], 10), s);
  }

  /* ============================================================
     LES QUATRE ETATS
     << A faire >> est une valeur saisie ; << vide >> est une cellule
     non renseignee. Les confondre masquerait un defaut de saisie.
     ============================================================ */
  /* « libelle » compte des plans (« 63 Terminés »), « court » qualifie un plan
     (« À faire → Terminé ») : le pluriel n'a pas sa place dans le second. */
  var ETATS = [
    { cle: 'termine', libelle: 'Terminés',   court: 'Terminé',   couleur: 'var(--fait)',   teinte: '#286b45' },
    { cle: 'encours', libelle: 'En cours',   court: 'En cours',  couleur: 'var(--cours)',  teinte: '#bf7f14' },
    { cle: 'afaire',  libelle: 'À faire',    court: 'À faire',   couleur: 'var(--afaire)', teinte: '#71716a' },
    { cle: 'vide',    libelle: 'Non renseignés', court: 'Non renseigné', couleur: 'transparent', teinte: 'var(--filet-fort)', hachure: true }
  ];
  /* Les deux fonds soutenus portent du blanc, l'ambre garde l'encre du texte :
     c'est le couple valide par le controle de contraste. */
  function encreSegment(cle) {
    if (cle === 'termine' || cle === 'afaire') return 'var(--sur-plein)';
    return cle === 'encours' ? 'var(--sur-ambre)' : 'var(--encre)';
  }
  var ETAT_PAR_CLE = {};
  ETATS.forEach(function (e) { ETAT_PAR_CLE[e.cle] = e; });

  /* ⚠ Cette fonction existe à l'identique côté serveur (Code.gs) : le serveur
     s'en sert pour archiver les relevés, le client pour les compteurs filtrés.
     Toute modification doit être reportée des deux côtés. */
  function classer(valeur) {
    var s = norm(valeur);
    if (s === '' || s === '-') return 'vide';
    if (s.indexOf('a faire') !== -1 || s === 'non commence') return 'afaire';
    var n = parseFloat(s.replace(/[\s%]/g, '').replace(',', '.'));
    if (!isNaN(n)) {
      if (n >= 100) return 'termine';
      if (n <= 0) return 'afaire';
      return 'encours';
    }
    if (/(termine|acheve|cloture|solde|fini|ok)/.test(s)) return 'termine';
    return 'encours';
  }
  function pourcentDe(p) {
    var c = classer(p.avancement);
    if (c === 'termine') return 100;
    if (c === 'vide' || c === 'afaire') return 0;
    var n = parseFloat(norm(p.avancement).replace(/[\s%]/g, '').replace(',', '.'));
    return isNaN(n) ? 50 : n;
  }

  /* ============================================================
     REFERENCES UD
     Une référence s'écrit RACINE + INDICE + REVISION : HEL0225A017 001 A.
     La racine (3 lettres, 4 chiffres, A, 3 chiffres) est l'identité du plan ;
     l'indice (3 chiffres) et la révision (une lettre) bougent quand le plan
     est réémis. Deux relevés successifs ne portent alors plus la même chaîne
     pour le même plan : comparer les chaînes telles quelles ferait de chaque
     réémission un « disparu » plus un « nouveau ».
     ============================================================ */
  var FORME_UD = /^([A-Z]{3})(\d{4})A(\d{3})(\d{3})([A-Z])$/;
  /** Tolérant aux séparateurs (-, _, espace, point, /) et à la casse. Une
      référence hors format garde sa forme entière — épurée — comme racine. */
  function analyserUD(ref) {
    var brut = String(ref == null ? '' : ref).trim().toUpperCase();
    var m = FORME_UD.exec(brut.replace(/[-_\s.\/]+/g, ''));
    if (!m) return { racine: brut, indice: '', revision: '', valide: false };
    return { racine: m[1] + m[2] + 'A' + m[3], indice: m[4], revision: m[5], valide: true };
  }
  /* Le rang d'une émission : sert à choisir, entre deux candidates de même
     racine, la plus proche de celle qui a disparu. */
  function rangUD(ud) { return Number(ud.indice) * 26 + (ud.revision.charCodeAt(0) - 65); }
  /* Exposée pour la batterie : une fonction pure se vérifie cas par cas. */
  window.__analyserUD = analyserUD;

  /* Compare deux cartes plan par plan { ref: avancement } et rend les
     événements : 'change' (même référence, autre état), 'nouveau', 'disparu'
     et 'indice'. Les références qui ne se retrouvent pas telles quelles sont
     appariées par racine : une racine partie d'un côté et revenue de l'autre
     sous un autre indice est le même plan réémis. Quand plusieurs candidates
     se présentent, la plus proche par indice puis révision l'emporte ; les
     autres restent nouvelles ou disparues. Une référence hors format n'a pas
     de racine au sens propre : elle n'est jamais appariée. */
  function apparier(avant, apres) {
    var a = Object.prototype.hasOwnProperty;
    var evenements = [], partis = {}, venus = {};
    Object.keys(apres).forEach(function (ref) {
      if (a.call(avant, ref)) {
        var ea = classer(avant[ref]), eb = classer(apres[ref]);
        if (ea !== eb) evenements.push({ ref: ref, type: 'change', avant: ea, apres: eb });
        return;
      }
      var ud = analyserUD(ref);
      if (ud.valide) (venus[ud.racine] = venus[ud.racine] || []).push({ ref: ref, rang: rangUD(ud) });
      else evenements.push({ ref: ref, type: 'nouveau', apres: classer(apres[ref]) });
    });
    Object.keys(avant).forEach(function (ref) {
      if (a.call(apres, ref)) return;
      var ud = analyserUD(ref);
      if (ud.valide) (partis[ud.racine] = partis[ud.racine] || []).push({ ref: ref, rang: rangUD(ud) });
      else evenements.push({ ref: ref, type: 'disparu', avant: classer(avant[ref]) });
    });
    Object.keys(venus).forEach(function (racine) {
      var paires = [];
      (partis[racine] || []).forEach(function (p) {
        venus[racine].forEach(function (v) { paires.push({ p: p, v: v, d: Math.abs(v.rang - p.rang) }); });
      });
      paires.sort(function (x, y) { return (x.d - y.d) || (x.p.rang - y.p.rang) || (x.v.rang - y.v.rang); });
      paires.forEach(function (pr) {
        if (pr.p.pris || pr.v.pris) return;
        pr.p.pris = pr.v.pris = true;
        evenements.push({ ref: pr.v.ref, type: 'indice', ancienne: pr.p.ref,
                          avant: classer(avant[pr.p.ref]), apres: classer(apres[pr.v.ref]) });
      });
      venus[racine].forEach(function (v) {
        if (!v.pris) evenements.push({ ref: v.ref, type: 'nouveau', apres: classer(apres[v.ref]) });
      });
    });
    Object.keys(partis).forEach(function (racine) {
      partis[racine].forEach(function (p) {
        if (!p.pris) evenements.push({ ref: p.ref, type: 'disparu', avant: classer(avant[p.ref]) });
      });
    });
    return evenements;
  }

  /* ============================================================
     ANCIENNETE
     Dimension derivee de la colonne de date : un plan cree il y a longtemps
     et toujours pas termine est celui sur lequel il faut se pencher.
     ============================================================ */
  var MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                    'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  /* Une date de création brute ferait autant de groupes que de jours : on
     regroupe au mois, ce qui se lit et se compare. */
  /* Une date arrive telle que le classeur l'affiche : « 16/07/2020 » sur une
     feuille française, « 2020-07-16 » (avec ou sans heure) ailleurs. Ne lire
     qu'un seul des deux ordres reviendrait à ne jamais trouver l'ancienneté
     sur la moitié des exports — sans que rien ne le signale. */
  function anneeEtMois(valeur) {
    var t = String(valeur == null ? '' : valeur).trim();
    var iso = /^(\d{4})[-\/.](\d{1,2})/.exec(t);
    if (iso) {
      var mi = Number(iso[2]);
      return mi >= 1 && mi <= 12 ? { annee: Number(iso[1]), mois: mi } : null;
    }
    var fr = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(t);
    if (!fr) return null;
    var an = Number(fr[3]);
    if (an < 100) an += an < 70 ? 2000 : 1900;
    /* Jour puis mois, comme en France — sauf si le premier nombre dépasse
       douze : il est alors forcément le jour, et l'autre le mois. */
    var a = Number(fr[1]), b = Number(fr[2]);
    var mois = a > 12 ? b : (b > 12 ? a : b);
    return mois >= 1 && mois <= 12 ? { annee: an, mois: mois } : null;
  }
  /* Écart en mois entre une date de cellule et une date de référence.
     `null` quand la cellule ne porte pas de date lisible. */
  function moisEntre(valeur, reference) {
    var v = anneeEtMois(valeur);
    if (!v) return null;
    return (reference.getUTCFullYear() - v.annee) * 12 +
           (reference.getUTCMonth() + 1 - v.mois);
  }
  /* Exposée pour la batterie : une fonction pure se vérifie directement, cas
     par cas, plutôt que devinée à travers l'interface. */
  window.__anneeEtMois = anneeEtMois;
  function moisDe(valeur) {
    var v = anneeEtMois(valeur);
    return v ? MOIS_COURT[v.mois - 1] + ' ' + v.annee : '\u2014';
  }
  function rangMois(nom) {
    if (nom === '\u2014') return -1;
    var bout = nom.split(' ');
    return Number(bout[1]) * 12 + MOIS_COURT.indexOf(bout[0]);
  }

  var ORDRE_ANCIENNETE = ['moins d’un mois', '1 à 3 mois', '3 à 6 mois', 'plus de 6 mois'];
  function ancienneteDepuis(valeur, reference) {
    var mois = moisEntre(valeur, reference);
    if (mois === null) return '—';
    if (mois >= 6) return 'plus de 6 mois';
    if (mois >= 3) return '3 à 6 mois';
    if (mois >= 1) return '1 à 3 mois';
    return 'moins d’un mois';
  }

  /* Un relevé : les comptes globaux, les comptes par dimension, et
     l'avancement plan par plan quand on veut pouvoir faire le comparatif. */
  function releveDepuis(plans, i, clesDim, valeurDe, avecPlans) {
    var r = { i: i, total: plans.length, termine: 0, encours: 0, afaire: 0, vide: 0, groupes: {}, plans: null };
    clesDim.forEach(function (d) { r.groupes[d] = {}; });
    plans.forEach(function (p) {
      r[p._etat]++;
      clesDim.forEach(function (d) {
        var v = String(valeurDe(p, d) || '—');
        if (!r.groupes[d][v]) r.groupes[d][v] = { total: 0, termine: 0 };
        r.groupes[d][v].total++;
        if (p._etat === 'termine') r.groupes[d][v].termine++;
      });
    });
    if (avecPlans) {
      r.plans = {};
      plans.forEach(function (p) { r.plans[p.reference] = p.avancement; });
    }
    return r;
  }

    });

    RELEVES_SRC = (src.releves || []).filter(function (r) { return r && lundiDeLibelle(r.semaine); });
    RELEVES_SRC.sort(function (a, b) { return lundiDeLibelle(a.semaine) - lundiDeLibelle(b.semaine); });
    BASE = RELEVES_SRC.length ? lundiDeLibelle(RELEVES_SRC[0].semaine)
                              : lundiDeLibelle(etiquetteISO(new Date()));
    AUJ = RELEVES_SRC.length ? indexDe(RELEVES_SRC[RELEVES_SRC.length - 1].semaine) : 0;
    afficherSemaine();

    /* Les dimensions du bloc « Avancement FWD par… » : les colonnes que le
       serveur a jugées catégorielles, plus le mois s'il a trouvé une date.
       L'ordre vient de la source quand elle le donne : une liste fixée à la
       main doit s'afficher dans l'ordre demandé, pas dans celui des colonnes. */
    CLES_DIM = (src.clesDim && src.clesDim.length
        ? src.clesDim.filter(function (c) { return PAR_CLE[c]; })
        : COLONNES.filter(function (c) { return c.dim; }).map(function (c) { return c.cle; }))
      .concat(CLE_DATE ? ['_mois'] : []);

    CLE_DOMAINE = (src.cleDomaine && PAR_CLE[src.cleDomaine]) ? src.cleDomaine : null;
    CLES_ESSENTIELLES = (src.clesEssentielles || []).filter(function (c) { return PAR_CLE[c]; });
    /* Sur un export de dix colonnes, une « vue essentielle » n'apporte rien :
       le choix ne vaut que s'il y a vraiment deux vues distinctes. */
    VAUT_ESSENTIELLES = CLES_ESSENTIELLES.length >= 2 &&
                        CLES_ESSENTIELLES.length < COLONNES.length - 3;
    /* Le libellé d'un plan : la première colonne de texte long, pour que le
       journal dise autre chose qu'une référence. */
    CLE_LIBELLE = null;
    for (var i = 0; i < COLONNES.length; i++) {
      if (!COLONNES[i].fige && /large/.test(COLONNES[i].classe || '')) { CLE_LIBELLE = COLONNES[i].cle; break; }
    }

    /* HISTORIQUE
       L'export ne contient que l'état du jour : on ne sait pas quand un plan
       est passé à 100 %. L'historique ne peut donc pas être reconstitué —
       il s'accumule, un relevé par semaine. Le dernier est recalculé à partir
       de la feuille pour que la page colle toujours à ce qu'on y lit. */
    RELEVES = RELEVES_SRC.map(function (r) {
      return {
        i: indexDe(r.semaine),
        total: r.total, termine: r.termine, encours: r.encours, afaire: r.afaire, vide: r.vide,
        groupes: r.groupes || {}, plans: r.plans || null
      };
    });
    var vivant = releveDepuis(PLANS, AUJ, CLES_DIM, valeurDim, true);
    var dernier = RELEVES[RELEVES.length - 1];
    // Le dernier relevé archivé garde son état plan par plan : c'est lui qui
    // sert de point de comparaison si la feuille a bougé depuis.
    if (dernier && dernier.i === AUJ) {
      if (RELEVES.length > 1 && !RELEVES[RELEVES.length - 2].plans) {
        RELEVES[RELEVES.length - 2].plans = dernier.plans;
      }
      RELEVES[RELEVES.length - 1] = vivant;
    } else {
      RELEVES.push(vivant);
    }
    /* Plusieurs imports dans la même semaine ne font qu'un point : le dernier
       de la semaine l'emporte. Sinon le graphique afficherait trois relevés
       serrés puis rien pendant quinze jours. */
    var parSemaine = {};
    RELEVES.forEach(function (r) { parSemaine[r.i] = r; });
    RELEVES = Object.keys(parSemaine)
      .map(function (k) { return parSemaine[k]; })
      .sort(function (a, b) { return a.i - b.i; });

    DERNIER = RELEVES[RELEVES.length - 1];
    $('import').textContent = 'Dernier import : semaine ' + etiquette(DERNIER.i).slice(5) + ' · ' +
      RELEVES.length + (RELEVES.length > 1 ? ' relevés archivés' : ' relevé archivé');

    /* Ce qui a bougé entre les deux derniers imports, plan par plan. Le
       comparatif affiché en découle, restreint au périmètre courant. */
    EVENEMENTS_IMPORT = evenementsImport();

    /* Les jalons viennent uniquement de la source : la configuration du
       classeur dans l'add-on, des dates posées en dur dans la démonstration. */
    jalons = jalonsDe(src.jalons);

    DIMENSIONS = CLES_DIM
      .filter(function (c) { return c !== '_mois' && PAR_CLE[c]; })
      .map(function (c) { return PAR_CLE[c]; })
      .concat(CLE_DATE ? [{ cle: '_mois', titre: PAR_CLE[CLE_DATE].titre + ' (par mois)' }] : [])
      .sort(function (a, b) { return a.titre.localeCompare(b.titre, 'fr'); });
    TITRE_DIM = {};
    DIMENSIONS.forEach(function (d) { TITRE_DIM[d.cle] = d.titre; });

    ORDRE_FEUILLE = COLONNES.map(function (c) { return c.cle; });

    PLAN_PAR_REF = {};
    PLAN_PAR_RACINE = {};
    PLANS.forEach(function (p) { PLAN_PAR_REF[p.reference] = p; PLAN_PAR_RACINE[p._racine] = p; });
    MEMO_DERIVE = {};
    JOURNAL = construireJournal();
    SEMAINE_FIN = semainesDeFin();

    /* Ce dont l'exemple a besoin pour se fabriquer : la vraie « aujourd'hui ». */
    if (!src.exemple) { RELEVES_REELS = RELEVES; AUJ_REEL = AUJ; BASE_REELLE = BASE; }

    CONTRATS = (Array.isArray(src.contrats) ? src.contrats : [])
      .filter(function (c) { return c && c.id !== undefined && c.id !== null && c.id !== ''; })
      .map(function (c) { return { id: String(c.id), nom: String(c.nom || c.id) }; });
    CONTRAT = (src.contrat !== undefined && src.contrat !== null && src.contrat !== '')
      ? String(src.contrat) : (CONTRATS.length ? CONTRATS[0].id : '');

    remettreVue();
    rendrePerimetre();
    COMPARATIF = comparatif();
    afficherContrat();
    refleterVue();
    $('bulle').dataset.visible = 'false';
  }

  /* La « vue » : ce que le lecteur a posé sur la page. Les filtres, la
     sélection, le périmètre et le cadrage appartiennent à une source et
     repartent de zéro avec elle — on ouvre toujours sur « Tout » ; la
     disposition — dimension, colonnes, tris, vue du tableau — est une
     préférence qui traverse les sources, tant que la nouvelle la permet. */
  function remettreVue() {
    var avant = vue;
    vue = {
      recherche: '', etat: '', filtres: {},
      groupe: null, refs: null, refsLibelle: '',
      vides: {}, perimetre: '', reconduits: false,
      journal: '', journalOuverts: {}, groupesTout: false,
      aideFin: false,
      exemple: !!SRC.exemple,
      fen: { debut: 0, span: 28 },
      /* L'ordre de la feuille, sans exception : tout le monde doit voir le même
         tableau que l'export. Le verrouillage à gauche s'adapte à cet ordre
         plutôt que l'inverse. Et le tableau s'ouvre complet : c'est l'extract.
         La vue essentielle est là pour l'autre besoin. */
      ordre: ORDRE_FEUILLE.slice(),
      /* Les colonnes cachées : la mécanique interne de la vue essentielle,
         jamais une préférence. */
      cachees: {},
      tri: { cle: 'reference', asc: true },
      dimCritique: (SRC.dimParDefaut && CLES_DIM.indexOf(SRC.dimParDefaut) !== -1) ? SRC.dimParDefaut : (CLES_DIM[0] || ''),
      triGroupe: { cle: null, asc: false },
      /* Le filtre de la colonne de gauche du bloc : un texte cherché dans le
         nom des groupes. Ni mémorisé, ni conservé d'une dimension à l'autre. */
      filtreGroupe: '',
      /* Deux vues du tableau, et rien entre les deux : « toutes » montre l'export
         tel quel, dans son ordre ; « essentielle » ne garde que ce qu'on regarde. */
      vueTable: 'toutes'
    };
    if (!avant) return;
    appliquerDisposition(avant);
    vue.vueTable = avant.vueTable === 'essentielle' ? 'essentielle' : 'toutes';
    if (vue.vueTable === 'essentielle') appliquerVueTable();
  }

  /* Les commandes fixes de la page reflètent la vue : le champ de recherche,
     les interrupteurs du journal, du tableau et du mode. */
  function refleterVue() {
    $('recherche').value = vue.recherche;
    $('filtre-groupe').value = vue.filtreGroupe;
    document.querySelectorAll('#filtre-journal button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.journal === vue.journal));
    });
    document.querySelectorAll('#vue-tableau button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.vueTable));
    });
    afficherMode();
  }

  /* Le bandeau du haut dit dans quel mode on est. La phrase dit exactement ce
     qui est fabriqué : l'historique, pas les plans. Une phrase qui exagère se
     fait prendre en défaut et on ne croit plus rien. */
  function afficherMode() {
    var actif = !!vue.exemple;
    document.body.dataset.exemple = String(actif);
    document.querySelectorAll('#mode-donnees button').forEach(function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.mode === 'exemple') === actif));
    });
    $('mot-mode').innerHTML = actif
      ? '\x3Cb>Historique fabriqué\x3C/b> — un aperçu de ce que la page montrera quand les relevés se seront accumulés.'
      : '';
  }

  /* Le sélecteur de contrat et le rappel du contrat courant sous le titre.
     Avec un seul contrat, ni l'un ni l'autre n'a quelque chose à dire. */
  function afficherContrat() {
    var plusieurs = CONTRATS.length > 1;
    var courant = CONTRATS.filter(function (c) { return c.id === CONTRAT; })[0];
    var sel = $('select-contrat');
    $('choix-contrat').hidden = !plusieurs;
    sel.innerHTML = CONTRATS.map(function (c) {
      return '\x3Coption value="' + ech(c.id) + '">' + ech(c.nom) + '\x3C/option>';
    }).join('');
    sel.value = CONTRAT;
    sel.disabled = false;
    $('etat-contrat').textContent = '';
    $('contrat-courant').hidden = !plusieurs;
    $('nom-contrat').textContent = courant ? courant.nom : CONTRAT;
  }

  /* ------------------------------------------------------------
     RYTHME
     La saisie est irrégulière : une semaine on solde un lot entier,
     la suivante rien. Une moyenne sur six semaines mesure donc surtout
     la date du dernier lot, pas la cadence réelle.
     On calcule à la place TOUS les rythmes soutenus observés — depuis le
     premier relevé, depuis le deuxième, etc. jusqu'au dernier intervalle —
     et on en garde l'étendue. Chaque borne est un rythme qui a réellement
     tenu sur une période réelle ; l'écart entre les deux, c'est l'irrégularité
     elle-même, rendue visible au lieu d'être moyennée.
     ------------------------------------------------------------ */
  function rythmes(pts) {
    if (!pts || pts.length < 2) return null;
    var premier = pts[0], dernier = pts[pts.length - 1];
    var semaines = dernier.i - premier.i;
    if (semaines <= 0) return null;
    return {
      central: (dernier.termine - premier.termine) / semaines,
      gagnes: dernier.termine - premier.termine,
      semaines: semaines,
      n: pts.length
    };
  }

  /** Semaine d'arrivée à un rythme donné, ou null si ce rythme ne mène nulle part. */
  function semaineFin(atteint, total, rythme) {
    if (!rythme || rythme <= 0) return null;
    return AUJ + Math.ceil((total - atteint) / rythme);
  }

  /* Ce qui a bougé entre les deux derniers imports. Invisible à l'œil nu
     sur 186 lignes, et c'est pourtant la question de chaque semaine. */
  /* On compte les passages d'un état à l'autre, avec les mots des quatre états :
     « passés en terminé » et non « ont avancé ». */
  /* Les références sont appariées par racine (voir apparier) : un plan réémis
     va dans « changements d'indice », sous sa nouvelle référence — et aussi
     dans le lot de son état d'arrivée s'il en a changé au passage, car il
     est alors bien passé en terminé, ou en cours. Le passage à « vide » n'est
     pas un lot : une cellule effacée n'est pas un progrès à annoncer. */
  function evenementsImport() {
    if (RELEVES.length < 2) return null;
    var avant = RELEVES[RELEVES.length - 2].plans;
    if (!avant || !DERNIER.plans) return null;
    return apparier(avant, DERNIER.plans);
  }
  /* Le comparatif affiché : les mêmes événements, restreints au périmètre. */
  function comparatif() {
    if (!EVENEMENTS_IMPORT) return null;
    var d = { termine: [], encours: [], afaire: [], nouveaux: [], disparus: [], indice: [], reemissions: [] };
    EVENEMENTS_IMPORT.filter(dansPerimetreEvt).forEach(function (e) {
      if (e.type === 'nouveau') { d.nouveaux.push(e.ref); return; }
      if (e.type === 'disparu') { d.disparus.push(e.ref); return; }
      if (e.type === 'indice') { d.indice.push(e.ref); d.reemissions.push({ ref: e.ref, ancienne: e.ancienne }); }
      if (e.avant !== e.apres && d[e.apres]) d[e.apres].push(e.ref);
    });
    return d;
  }

  /* ----------------------------------------------------------
     Mémoire locale : cadrage et disposition survivent
     à la fermeture de l'onglet. Elle est globale : la même
     disposition suit le lecteur d'un contrat à l'autre.
     ---------------------------------------------------------- */
  /* Les seules cles de tri acceptees pour le bloc par groupe : une preference
     relue d'un ancien stockage ne doit pas pouvoir injecter n'importe quoi. */
  var TRIS_GROUPE = ['nom', 'total', 'pct', 'requis', 'tension', 'fin'];
  var CLE_PREFS = 'suivi-fwd:v1';
  var minuteurPrefs = null;
  function sauverPrefs() {
    try {
      localStorage.setItem(CLE_PREFS, JSON.stringify({
        fen: vue.fen,
        dimCritique: vue.dimCritique, ordre: vue.ordre, tri: vue.tri,
        triGroupe: vue.triGroupe
      }));
    } catch (e) { /* navigation privée ou stockage bloqué : sans conséquence */ }
  }
  function planifierSauvegarde() {
    clearTimeout(minuteurPrefs);
    minuteurPrefs = setTimeout(sauverPrefs, 400);
  }
  /* La disposition — dimension, ordre des colonnes du tableau, tris — se relit
     d'un stockage ou d'une vue précédente. Elle est validée contre la source
     courante : une colonne disparue ou une clé inconnue ne passe pas. Les
     colonnes cachées ne sont PAS une préférence : elles ne sont que la
     mécanique de la vue essentielle. Un ancien stockage qui en porte encore
     (« cachees ») est ignoré — rien ne peut masquer une colonne à l'ouverture. */
  function appliquerDisposition(pref) {
    if (pref.dimCritique && CLES_DIM.indexOf(pref.dimCritique) !== -1) vue.dimCritique = pref.dimCritique;
    if (Array.isArray(pref.ordre)) {
      // On ne garde que les colonnes encore presentes, et on ajoute les nouvelles.
      var valides = pref.ordre.filter(function (k) { return PAR_CLE[k]; });
      COLONNES.forEach(function (c) { if (valides.indexOf(c.cle) === -1) valides.push(c.cle); });
      vue.ordre = valides;
    }
    if (pref.tri && PAR_CLE[pref.tri.cle]) vue.tri = { cle: pref.tri.cle, asc: !!pref.tri.asc };
    if (pref.triGroupe && TRIS_GROUPE.indexOf(pref.triGroupe.cle) !== -1) {
      vue.triGroupe = { cle: pref.triGroupe.cle, asc: !!pref.triGroupe.asc };
    }
  }
  function chargerPrefs() {
    try {
      var brut = localStorage.getItem(CLE_PREFS);
      if (!brut) return;
      var pref = JSON.parse(brut);
      if (!pref || typeof pref !== 'object') return;
      /* Un ancien stockage pouvait contenir des jalons : ils ne font plus
         foi, les jalons viennent de la configuration. On les ignore. */
      if (pref.fen && typeof pref.fen.debut === 'number' && typeof pref.fen.span === 'number') {
        vue.fen = { debut: pref.fen.debut, span: pref.fen.span };
      }
      appliquerDisposition(pref);
    } catch (e) { /* preferences illisibles : on repart des valeurs par defaut */ }
  }

  /* ============================================================ SELECTION */
  function selection() {
    var q = norm(vue.recherche);
    var cols = Object.keys(vue.filtres).filter(function (k) { return vue.filtres[k]; });
    return PLANS.filter(function (p) {
      if (!dansPerimetre(p)) return false;
      if (vue.etat && p._etat !== vue.etat) return false;
      if (vue.groupe && String(valeurDim(p, vue.groupe.dim)) !== vue.groupe.val) return false;
      if (vue.refs && !vue.refs[p.reference]) return false;
      if (vue.reconduits && !estReconduit(p)) return false;
      for (var kv in vue.vides) {
        if (vue.vides[kv] && String(p[kv] == null ? '' : p[kv]).trim() !== '') return false;
      }
      for (var k = 0; k < cols.length; k++) {
        if (norm(p[cols[k]]).indexOf(norm(vue.filtres[cols[k]])) === -1) return false;
      }
      if (q && norm(COLONNES.map(function (c) { return p[c.cle]; }).join(' ')).indexOf(q) === -1) return false;
      return true;
    });
  }
  /* Un plan « reconduit » : déjà terminé, mais créé il y a si longtemps qu'il
     ne vient pas de cette campagne. On ne l'a pas soldé, on en a hérité — et il
     gonfle le pourcentage d'avancement sans rien dire de l'effort réel. */
  var MOIS_RECONDUIT = 12;
  function estReconduit(p) {
    if (p._etat !== 'termine' || !CLE_DATE) return false;
    var mois = moisEntre(p[CLE_DATE], dateDe(AUJ));
    return mois !== null && mois >= MOIS_RECONDUIT;
  }

  function compte(liste) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0 };
    liste.forEach(function (p) { c[p._etat]++; });
    c.total = liste.length;
    c.pct = c.total ? Math.round((c.termine / c.total) * 100) : 0;
    return c;
  }
  /* Les filtres « libres » — recherche, état, groupe, lot, colonnes — ne
     s'appliquent qu'aux plans du jour : un compte archivé ne se refiltre pas.
     Le périmètre, lui, se dérive des cartes plan par plan et suit l'historique ;
     filtreActif() réunit les deux pour ce qui se voit à l'écran. */
  function filtreLibre() {
    return !!(vue.recherche || vue.etat || vue.groupe || vue.refs || vue.reconduits ||
      Object.keys(vue.filtres).some(function (k) { return vue.filtres[k]; }) ||
      Object.keys(vue.vides).some(function (k) { return vue.vides[k]; }));
  }
  function filtreActif() { return !!vue.perimetre || filtreLibre(); }

  /* ============================================================
     PÉRIMÈTRE
     La colonne de domaine (BASE/OPTION, PERSO…) découpe les plans en
     familles qu'on suit séparément. Le périmètre choisi en haut de page
     restreint tout : la sélection du jour, le comparatif, le journal, et les
     séries historiques — dérivées relevé par relevé de la carte plan par plan
     archivée, croisée avec le domaine COURANT de chaque plan. L'onglet
     Historique, lui, n'est jamais réécrit.
     ============================================================ */
  function domaineDe(p) {
    var v = CLE_DOMAINE ? String(p[CLE_DOMAINE] == null ? '' : p[CLE_DOMAINE]).trim() : '';
    return v || '\u2014';
  }
  function dansPerimetre(p) { return !vue.perimetre || domaineDe(p) === vue.perimetre; }
  /* Un événement du journal appartient au périmètre si le plan qu'il concerne
     — retrouvé par référence ou par racine — en fait partie aujourd'hui. Un
     plan disparu dont on ne connaît plus le domaine n'apparaît qu'en « Tout ». */
  function dansPerimetreEvt(e) {
    if (!vue || !vue.perimetre) return true;
    var p = planDeRef(e.ref);
    return !!p && domaineDe(p) === vue.perimetre;
  }
  /* Les plans du périmètre : la population de référence des comptes. */
  function population() { return vue.perimetre ? PLANS.filter(dansPerimetre) : PLANS; }

  /* Les comptes d'un relevé restreints à un périmètre, tirés de sa carte plan
     par plan : le total, les terminés, et — si une dimension est demandée —
     les mêmes par valeur. Un relevé sans carte ne donne rien : on ne devine
     pas. Mémorisé par relevé : la courbe se redessine à chaque glissement. */
  var MEMO_DERIVE = {};
  function comptesDerives(rel, perimetre, dim) {
    var cle = rel.i + '|' + perimetre + '|' + (dim || '');
    if (MEMO_DERIVE[cle]) return MEMO_DERIVE[cle];
    var c = { total: 0, termine: 0, groupes: {} };
    Object.keys(rel.plans || {}).forEach(function (ref) {
      var p = planDeRef(ref);
      if (!p || domaineDe(p) !== perimetre) return;
      var fini = classer(rel.plans[ref]) === 'termine';
      c.total++;
      if (fini) c.termine++;
      if (!dim) return;
      var v = String(valeurDim(p, dim) || '\u2014');
      if (!c.groupes[v]) c.groupes[v] = { total: 0, termine: 0 };
      c.groupes[v].total++;
      if (fini) c.groupes[v].termine++;
    });
    MEMO_DERIVE[cle] = c;
    return c;
  }

  /* Le sélecteur du haut : « Tout », puis une puce par domaine avec son
     compte de plans. Reconstruit à chaque source ; seul l'état pressé bouge
     ensuite. Sans colonne de domaine, il se tait. */
  function rendrePerimetre() {
    var zone = $('perimetre');
    if (!CLE_DOMAINE) { zone.hidden = true; $('choix-perimetre').innerHTML = ''; return; }
    var comptes = {};
    PLANS.forEach(function (p) { var d = domaineDe(p); comptes[d] = (comptes[d] || 0) + 1; });
    var valeurs = Object.keys(comptes).sort(function (a, b) {
      if (a === '\u2014') return 1;
      if (b === '\u2014') return -1;
      return a.localeCompare(b, 'fr', { numeric: true });
    });
    var titre = PAR_CLE[CLE_DOMAINE].titre;
    var puces = [{ val: '', nom: 'Tout', n: PLANS.length,
                   aide: 'Suivre tous les plans, quel que soit le ' + titre.toLowerCase() }]
      .concat(valeurs.map(function (v) {
        return { val: v, nom: libelleGroupe(v), n: comptes[v],
                 aide: 'Ne suivre que les plans dont ' + titre + ' vaut \u00ab\u00a0' + v + '\u00a0\u00bb' };
      }));
    $('choix-perimetre').innerHTML = puces.map(function (x) {
      return '\x3Cbutton type="button" data-perimetre="' + ech(x.val) + '" aria-pressed="' +
        (vue.perimetre === x.val) + '" title="' + ech(x.aide) + '">' +
        ech(x.nom) + '\x3Cspan class="n">' + nb(x.n) + '\x3C/span>\x3C/button>';
    }).join('');
    zone.hidden = false;
  }
  function refleterPerimetre() {
    document.querySelectorAll('#choix-perimetre button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.perimetre === vue.perimetre));
    });
  }


  /* ============================================================ AVANCEMENT */

  /* Chaque chiffre se cale au centre de son segment de barre : la ligne devient
     la légende de la barre au lieu d'une rangée régulière. Les segments minces
     produisant des étiquettes qui se touchent, on les écarte après mesure
     plutôt que de deviner les largeurs à l'avance. */
  /* Les segments vides ne sont pas rendus : on releve les coupures reelles
     dans le DOM plutot que de les recalculer a partir des pourcentages. */
  function placerFilets() {
    var zone = $('filets'), barre = $('barre');
    if (!zone || !barre) return;
    var segs = Array.prototype.slice.call(barre.children);
    if (segs.length < 2 || window.matchMedia('(max-width: 680px)').matches) {
      zone.innerHTML = '';
      return;
    }
    var base = barre.getBoundingClientRect();
    zone.innerHTML = segs.slice(0, -1).map(function (seg) {
      var r = seg.getBoundingClientRect();
      return '\x3Ci style="left:' + (r.right - base.left + 1).toFixed(1) + 'px">\x3C/i>';
    }).join('');
  }

  function alignerEtats(c) {
    placerFilets();
    var zone = $('etats');
    var boutons = Array.prototype.slice.call(zone.querySelectorAll('.etat-btn'));
    if (!boutons.length) return;
    if (window.matchMedia('(max-width: 680px)').matches) {
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    var largeur = zone.getBoundingClientRect().width;
    if (!largeur || !c.total) return;

    var cumul = 0;
    var cibles = ETATS.map(function (e) {
      var part = (c[e.cle] / c.total) * largeur;
      var centre = cumul + part / 2;
      cumul += part;
      return centre;
    });

    // Placement au centre, puis on pousse vers la droite ce qui se chevauche…
    var gauches = boutons.map(function (b, i) { return cibles[i] - b.offsetWidth / 2; });
    for (var i = 1; i < boutons.length; i++) {
      var mini = gauches[i - 1] + boutons[i - 1].offsetWidth + 4;
      if (gauches[i] < mini) gauches[i] = mini;
    }
    // …puis on recale vers la gauche si le dernier sort du cadre.
    var debord = gauches[boutons.length - 1] + boutons[boutons.length - 1].offsetWidth - largeur;
    for (var k = boutons.length - 1; k >= 0 && debord > 0; k--) {
      gauches[k] -= debord;
      debord = k > 0 ? Math.max(0, (gauches[k - 1] + boutons[k - 1].offsetWidth + 4) - gauches[k]) : 0;
    }
    boutons.forEach(function (b, i) { b.style.left = Math.max(0, gauches[i]).toFixed(1) + 'px'; });
  }

  function rendreAvancement(liste) {
    var c = compte(liste);
    /* Sous un périmètre seul, la phrase le nomme ; dès qu'un autre filtre
       s'ajoute, c'est une sélection. */
    $('phrase').innerHTML = '\x3Cb>' + nb(c.termine) + '\x3C/b> sur ' + nb(c.total) + ' plans terminés' +
      (filtreLibre() ? ' dans la sélection'
                     : (vue.perimetre ? ' dans le périmètre ' + ech(vue.perimetre) : ''));

    /* Le pourcentage se lit dans la barre : les chiffres du dessous n'ont plus
       qu'un sens possible, un nombre de plans. */
    $('barre').innerHTML = ETATS.map(function (e) {
      if (!c[e.cle]) return '';
      var part = (c[e.cle] / (c.total || 1)) * 100;
      var texte = part >= 6 ? Math.round(part) + '\u202f%' : '';
      return e.hachure
        ? '\x3Cspan class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
        : '\x3Cspan style="width:' + part.toFixed(2) + '%;background:' + e.couleur +
          ';color:' + encreSegment(e.cle) + '">' + texte + '\x3C/span>';
    }).join('');

    $('etats').innerHTML = ETATS.map(function (e) {
      var pastille = e.hachure
        ? '\x3Cspan class="pastille hachure">\x3C/span>'
        : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
      var actif = vue.etat === e.cle;
      return '\x3Cbutton class="etat-btn" type="button" data-etat="' + e.cle + '" style="--teinte:' + e.teinte +
        '" aria-pressed="' + actif + '" title="' + (actif ? 'Retirer le filtre' : 'N\u2019afficher que ces plans') + '">' +
        '\x3Cspan class="etat-haut">' + pastille + ech(e.libelle) + '\x3C/span>' +
        '\x3Cspan class="etat-n">' + nb(c[e.cle]) + '\x3C/span>\x3C/button>';
    }).join('');

    requestAnimationFrame(function () { alignerEtats(c); });
  }

  /* ============================================================ GRAPHIQUE */
  /* Série affichée : l'historique global, ou celui d'un groupe quand une ligne
     du bloc « Avancement FWD par… » est sélectionnée. Un filtre libre (recherche,
     colonne) ne peut pas s'appliquer rétroactivement à des comptes déjà archivés :
     dans ce cas le graphique reste sur l'ensemble, et le dit.
     Sous un périmètre, les comptes archivés ne servent plus : la série est
     dérivée, relevé par relevé, de la carte plan par plan — les plans de la
     carte qui appartiennent au périmètre aujourd'hui, et ceux d'entre eux
     classés terminés. Un relevé sans carte est écarté, et la note le dit. */
  function serieAffichee() {
    var groupe = (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) ? vue.groupe : null;
    var per = vue.perimetre;
    var pts, ecartes = 0;
    if (per) {
      pts = [];
      RELEVES.forEach(function (r) {
        if (!r.plans) { ecartes++; return; }
        var c = comptesDerives(r, per, groupe ? groupe.dim : null);
        var g = groupe ? (c.groupes[groupe.val] || { total: 0, termine: 0 }) : c;
        pts.push({ i: r.i, total: g.total, termine: g.termine });
      });
      if (!pts.length) pts.push({ i: AUJ, total: 0, termine: 0 });
    } else if (groupe) {
      pts = RELEVES.map(function (r) {
        var g = r.groupes[groupe.dim] && r.groupes[groupe.dim][groupe.val];
        return { i: r.i, total: g ? g.total : 0, termine: g ? g.termine : 0 };
      });
    } else {
      pts = RELEVES.map(function (r) { return { i: r.i, total: r.total, termine: r.termine }; });
    }
    var portee = groupe
      ? 'de ' + groupe.val + (per ? ' dans le périmètre ' + per : '')
      : (per ? 'du périmètre ' + per : null);
    return { pts: pts, portee: portee, partiel: filtreLibre(), ecartes: ecartes };
  }

  var L = 980, mG = 36, mD = 58, plotH = 160, ecart = 15, bandeH = 32, mBas = 24;
  var mHaut = 44, H = mHaut + plotH + ecart + bandeH + mBas;
  var HAUTEUR_ETIQUETTE = 17;
  var LARGEUR = L - mG - mD;
  var MAX_IDX = 104;                       // deux ans de visibilite maximum
  var derniereAnalyse = null;

  function bornerFenetre() {
    var f = vue.fen;
    f.span = Math.max(8, Math.min(f.span, MAX_IDX + 1));
    f.debut = Math.max(0, Math.min(f.debut, MAX_IDX - f.span + 1));
  }

  function rendreGraphique(liste) {
    bornerFenetre();
    var vueSerie = serieAffichee();
    var pts = vueSerie.pts;
    var dernier = pts[pts.length - 1];
    var total = Math.max(dernier.total, 1);
    var atteint = dernier.termine;
    var restants = total - atteint;
    var ryt = rythmes(pts);
    var vitesse = ryt ? ryt.central : 0;
    var projIdx = semaineFin(atteint, total, vitesse);

    var note = vueSerie.portee
      ? 'Historique ' + vueSerie.portee + ' · ' + pts.length + ' relevés' +
        (vueSerie.partiel ? ' · les autres filtres ne s’appliquent pas à l’historique' : '')
      : (vueSerie.partiel
          ? 'Historique de l’ensemble des plans : les relevés archivés ne peuvent pas être refiltrés.'
          : RELEVES.length + ' relevés depuis le premier import');
    if (vueSerie.ecartes) {
      note += ' · ' + vueSerie.ecartes + ' relevé' + (vueSerie.ecartes > 1 ? 's' : '') +
        ' sans détail plan par plan, hors périmètre';
    }
    $('note-graphe').textContent = note;
    var prochain = jalons.filter(function (j) { return j.i > AUJ; }).sort(function (a, b) { return a.i - b.i; })[0];

    var d0 = vue.fen.debut, span = vue.fen.span, d1 = d0 + span - 1;
    var pasX = LARGEUR / (span - 1);
    var x = function (i) { return mG + pasX * (i - d0); };

    /* Deux jalons proches ecrivaient l'un sur l'autre. On calcule l'emprise de
       chaque etiquette, puis on les repartit sur le plus petit nombre de
       niveaux ou aucune ne touche sa voisine. */
    var places = [];
    if (AUJ >= d0 && AUJ <= d1) {
      var xAuj = mG + pasX * (AUJ - d0);
      places.push({ aujourdhui: true, jx: xAuj, xa: xAuj - 72, xb: xAuj - 4 });
    }
    jalons.forEach(function (j, idx) {
      if (j.i < d0 || j.i > d1) return;
      var jx = x(j.i);
      var largeur = j.texte.length * 6.1 + 34;
      var versGauche = jx + largeur + 14 > L - mD;
      places.push({ j: j, idx: idx, jx: jx, largeur: largeur, versGauche: versGauche,
                    xa: versGauche ? jx - largeur - 4 : jx + 4,
                    xb: versGauche ? jx - 4 : jx + largeur + 4 });
    });
    places.sort(function (a, b) { return a.xa - b.xa; });
    var finDeNiveau = [];
    places.forEach(function (pl) {
      var n = 0;
      while (n < finDeNiveau.length && pl.xa < finDeNiveau[n] + 10) n++;
      pl.niveau = n;
      finDeNiveau[n] = pl.xb;
    });
    var niveaux = Math.max(1, finDeNiveau.length);
    mHaut = 26 + niveaux * HAUTEUR_ETIQUETTE;
    H = mHaut + plotH + ecart + bandeH + mBas;

    var y = function (v) { return mHaut + plotH - (v / total) * plotH; };
    var yBande = mHaut + plotH + ecart;
    var basTotal = yBande + bandeH;

    var s = ['\x3Csvg class="graphe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Plans termines par semaine, historique et projection">'];
    s.push('\x3Cdefs>\x3CclipPath id="zoneTracee">\x3Crect x="' + mG + '" y="' + (mHaut - 12) + '" width="' + LARGEUR + '" height="' + (plotH + 16) + '"/>\x3C/clipPath>\x3C/defs>');

    var pas = total <= 25 ? 5 : total <= 60 ? 20 : 50;
    for (var v = 0; v < total; v += pas) {
      if (total - v < pas * 0.5) continue;
      s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
      s.push('\x3Ctext class="grad" x="' + (mG - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + '\x3C/text>');
    }
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(total).toFixed(1) + '" y2="' + y(total).toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
    s.push('\x3Ctext class="grad" x="' + (L - mD + 8) + '" y="' + (y(total) + 3.5).toFixed(1) + '">' + nb(total) + '\x3C/text>');

    // Tout ce qui peut sortir du cadre est decoupe a la zone tracee.
    s.push('\x3Cg clip-path="url(#zoneTracee)">');

    var visibles = pts.filter(function (pt) { return pt.i >= d0 - 2 && pt.i <= d1 + 2; });
    if (visibles.length === 1) {
      s.push('\x3Ccircle cx="' + x(visibles[0].i).toFixed(1) + '" cy="' + y(visibles[0].termine).toFixed(1) +
             '" r="4.5" fill="var(--fait)"/>');
    }
    if (visibles.length > 1) {
      var chemin = visibles.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.termine).toFixed(1); }).join(' ');
      var xa = x(visibles[0].i).toFixed(1), xb = x(visibles[visibles.length - 1].i).toFixed(1);
      s.push('\x3Cpath d="' + chemin + ' L' + xb + ' ' + y(0).toFixed(1) + ' L' + xa + ' ' + y(0).toFixed(1) + ' Z" fill="var(--fait)" opacity=".11"/>');
      s.push('\x3Cpath d="' + chemin + '" fill="none" stroke="var(--fait)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
      visibles.forEach(function (pt) {
        if (pt.i === dernier.i) return;
        s.push('\x3Ccircle cx="' + x(pt.i).toFixed(1) + '" cy="' + y(pt.termine).toFixed(1) +
               '" r="3" fill="var(--surface)" stroke="var(--fait)" stroke-width="1.6"/>');
      });
    }

    var horsClip = [];
    var enRetard = false, requis = null;
    if (prochain && restants > 0) {
      requis = restants / (prochain.i - AUJ);
      enRetard = vitesse <= 0 || requis > vitesse;
      var cr = enRetard ? 'var(--alerte)' : 'var(--fait)';
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(prochain.i).toFixed(1) + ' ' + y(total).toFixed(1) + '" fill="none" stroke="' + cr + '" stroke-width="1.6"/>');
      s.push('\x3Ccircle cx="' + x(prochain.i).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="' + cr + '"/>');
    }

    if (projIdx !== null) {
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(projIdx).toFixed(1) + ' ' + y(total).toFixed(1) +
             '" fill="none" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/>');
      if (projIdx >= d0 && projIdx <= d1) {
        s.push('\x3Ccircle cx="' + x(projIdx).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="none" stroke="var(--fait)" stroke-width="1.6"/>');
        var xp = Math.max(mG + 22, Math.min(x(projIdx), L - mD - 22));
        // Sous le plafond plutot qu'au-dessus : au-dessus, elle tombait dans la
        // bande des jalons et se superposait a leurs etiquettes.
        horsClip.push('\x3Ctext class="grad" x="' + xp.toFixed(1) + '" y="' + (y(total) + 16).toFixed(1) +
                      '" text-anchor="middle">' + etiquette(projIdx) + '\x3C/text>');
      }
      if (prochain && enRetard) {
        var auJalon = atteint + vitesse * (prochain.i - AUJ);
        var manque = Math.round(total - auJalon);
        if (manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
          var xj = x(prochain.i), y1 = y(auJalon), y2 = y(total);
          s.push('\x3Cline x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
          s.push('\x3Ctext class="grad" x="' + (xj + 7).toFixed(1) + '" y="' + ((y1 + y2) / 2 + 4).toFixed(1) + '" fill="var(--alerte)" font-weight="500">-' + manque + '\x3C/text>');
        }
      }
    }
    s.push('\x3C/g>');
    horsClip.forEach(function (t) { s.push(t); });

    if (AUJ >= d0 && AUJ <= d1) {
      s.push('\x3Cline x1="' + x(AUJ).toFixed(1) + '" x2="' + x(AUJ).toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--encre-3)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      s.push('\x3Ctext class="grad" x="' + (x(AUJ) - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="end">aujourd’hui\x3C/text>');
      s.push('\x3Ccircle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(atteint).toFixed(1) + '" r="4.5" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      s.push('\x3Ctext class="grad" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (y(atteint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500">' + atteint + '\x3C/text>');
    }

    /* Jalons : un trait, un triangle, une étiquette. Rien à saisir ni à
       déplacer — ils viennent de la configuration, l'outil ne fait que les
       montrer. Le survol de la semaine dessous passe par la bande cliquable,
       comme partout ailleurs sur le graphique. */
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      var critique = prochain && j.i === prochain.i && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-3)';
      var yBase = mHaut - 8 - pl.niveau * HAUTEUR_ETIQUETTE;   // haut du trait pour ce niveau
      var yTexte = yBase - 5;
      var xTexte = pl.versGauche ? jx - 10 : jx + 10;

      s.push('\x3Cg class="jalon" data-jalon="' + idx + '" role="img" aria-label="Jalon ' + ech(j.texte) + ' en ' + etiquette(j.i) + '">');
      s.push('\x3Ctitle>' + ech(j.texte) + ' \u2014 ' + etiquette(j.i) + '\x3C/title>');
      s.push('\x3Cline x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + basTotal.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="2 3"/>');
      s.push('\x3Cpath d="M' + jx.toFixed(1) + ' ' + yBase.toFixed(1) + ' l-4 -5.5 l8 0 Z" fill="' + couleur + '"/>');
      s.push('\x3Ctext class="jalon-texte" x="' + xTexte.toFixed(1) + '" y="' + yTexte.toFixed(1) + '" text-anchor="' + (pl.versGauche ? 'end' : 'start') + '" fill="' + couleur + '">' + ech(j.texte) + '\x3C/text>');
      s.push('\x3C/g>');
    });

    if (!prochain && d1 > AUJ + 2) {
      var xv = x(AUJ + Math.round((d1 - AUJ) / 2));
      s.push('\x3Ctext class="grad" x="' + xv.toFixed(1) + '" y="' + (mHaut + plotH * 0.86).toFixed(1) +
             '" text-anchor="middle">Aucun jalon \u00e0 venir\x3C/text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < pts.length; k5++) {
      var dSem = pts[k5].i - pts[k5 - 1].i;
      if (dSem <= 0) continue;
      var parSem = (pts[k5].termine - pts[k5 - 1].termine) / dSem;
      for (var w = pts[k5 - 1].i + 1; w <= pts[k5].i; w++) taux.push({ i: w, v: parSem });
    }
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, t.v); });
    var lb = Math.min(15, pasX * 0.62);
    s.push('\x3Ctext class="grad" x="' + mG + '" y="' + (yBande - 3).toFixed(1) + '">terminés par semaine\x3C/text>');
    taux.forEach(function (t) {
      if (t.i < d0 || t.i > d1 || t.v <= 0) return;
      var h = (t.v / maxSem) * bandeH;
      s.push('\x3Crect x="' + (x(t.i) - lb / 2).toFixed(1) + '" y="' + (yBande + bandeH - h).toFixed(1) +
             '" width="' + lb.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--fait)" opacity=".42"/>');
    });
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + basTotal.toFixed(1) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    var saut = Math.max(1, Math.ceil(span / 11));
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && k3 !== AUJ) continue;
      var lib = etiquette(k3);
      s.push('\x3Ctext class="grad" x="' + x(k3).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             (lib.indexOf('2026-') === 0 ? lib.slice(5) : lib) + '\x3C/text>');
    }

    /* Le point d'une semaine se cherche par son indice, pas par sa position
       dans la série : une semaine sans relevé n'a pas de point. */
    var ptParI = {};
    pts.forEach(function (pt) { ptParI[pt.i] = pt; });
    for (var k4 = d0; k4 <= d1; k4++) {
      var ptK = ptParI[k4];
      /* Une bande par semaine : elle porte le survol (bulle) et se lit au
         clavier, mais n'est plus un bouton — rien ne se pose sur le graphique. */
      s.push('\x3Crect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (plotH + ecart + bandeH + 6).toFixed(1) + '" fill="transparent" tabindex="0" role="img" data-i="' + k4 + '" ' +
             'aria-label="' + etiquette(k4) +
             (k4 > AUJ ? ' (à venir)' : (ptK ? ' : ' + ptK.termine + ' terminés' : ' : pas de relevé')) + '"/>');
    }

    s.push('\x3C/svg>');
    $('zone-graphe').innerHTML = s.join('');

    var items = ['\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="var(--fait)" stroke-width="2.2"/>\x3C/svg>' +
      '\x3Cspan title="Nombre de plans pass\u00e9s \u00e0 100 %, cumul\u00e9 semaine apr\u00e8s semaine.">r\u00e9alis\u00e9\x3C/span>\x3C/span>'];
    if (ryt && restants > 0) {
      var explication = ryt.gagnes + ' plans termin\u00e9s en ' + ryt.semaines + ' semaines entre le premier ' +
        'et le dernier relev\u00e9, soit ' + vitesse.toFixed(1).replace('.', ',') + ' par semaine. ' +
        (projIdx !== null
          ? 'Les ' + restants + ' restants demandent ' + (projIdx - AUJ) + ' semaines de plus.'
          : 'Aucun plan sold\u00e9 sur la p\u00e9riode : pas de fin pr\u00e9visible.');
      items.push('\x3Cspan class="legende-item">\x3Csvg width="22" height="8" aria-hidden="true">' +
        '\x3Cline x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".65"/>\x3C/svg>' +
        '\x3Cspan title="' + explication + '">au rythme moyen (' + vitesse.toFixed(1).replace('.', ',') + '/sem.)' +
        (projIdx !== null ? ' \u2192 fin vers ' + etiquette(projIdx) : ' \u2014 pas de fin pr\u00e9visible') +
        '\x3C/span>\x3C/span>');
    }
    if (requis !== null) {
      items.push('\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6"/>\x3C/svg>' +
        '\x3Cspan title="' + restants + ' plans restants \u00e0 solder en ' + (prochain.i - AUJ) +
        ' semaines. Rouge si ce rythme d\u00e9passe le rythme actuel.">' +
        'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb : ' +
        requis.toFixed(1).replace('.', ',') + '/sem.\x3C/span>\x3C/span>');
    }
    $('legende').innerHTML = items.join('');

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0 };
    majBoutonsZoom();
    planifierSauvegarde();
  }

  function majBoutonsZoom() {
    var boutons = document.querySelectorAll('.commandes-graphe .segmente button');
    for (var i = 0; i < boutons.length; i++) {
      var v = Number(boutons[i].dataset.span);
      boutons[i].setAttribute('aria-pressed', String(v === vue.fen.span));
    }
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  function reglerSpan(span) {
    vue.fen.span = span || spanTout();
    vue.fen.debut = span ? Math.max(0, AUJ - Math.round(vue.fen.span * 0.45)) : 0;
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;

  /* Le seul geste du graphique : le panoramique. Il part de n'importe quel
     point du cadre, frise des jalons et marge du bas comprises — le curseur
     y promet la main partout. Un clic net ne fait rien. */
  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    glisse = { x0: e.clientX, debut0: vue.fen.debut, bouge: false };
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    var span1 = Math.max(8, Math.min(MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));
    rendreGraphique(selection());
  }, { passive: false });

  cadreGraphe.addEventListener('pointermove', function (e) {
    if (!glisse) return;
    var dx = e.clientX - glisse.x0;
    if (Math.abs(dx) > 4) glisse.bouge = true;
    if (!glisse.bouge) return;
    var semaines = dx / pxParSemaine();
    cadreGraphe.dataset.glisse = 'true';
    var nd = Math.round(glisse.debut0 - semaines);
    if (nd !== vue.fen.debut) { vue.fen.debut = nd; rendreGraphique(selection()); }
  });

  function finGlisse() {
    if (!glisse) return;
    glisse = null;
    cadreGraphe.dataset.glisse = 'false';
  }
  cadreGraphe.addEventListener('pointerup', finGlisse);
  cadreGraphe.addEventListener('pointercancel', finGlisse);

  /* Infobulle */
  cadreGraphe.addEventListener('mousemove', function (e) {
    if (glisse && glisse.bouge) { $('bulle').dataset.visible = 'false'; return; }
    if (!e.target.closest || !e.target.closest('.zone-clic')) { $('bulle').dataset.visible = 'false'; return; }
    var i = indexSousCurseur(e.clientX);
    var a = derniereAnalyse;
    if (i === null || !a) return;
    var bulle = $('bulle');
    var k = -1;
    for (var q = 0; q < a.pts.length; q++) if (a.pts[q].i === i) k = q;
    if (k !== -1) {
      var pt = a.pts[k];
      var gagne = k > 0 ? pt.termine - a.pts[k - 1].termine : null;
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">Relevé du ' + etiquette(i) + '\x3C/div>' +
        '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille" style="background:var(--fait)">\x3C/span>terminés\x3Cspan class="n">' +
          nb(pt.termine) + ' / ' + nb(pt.total) + '\x3C/span>\x3C/div>' +
        (gagne !== null ? '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille sans">\x3C/span>depuis le précédent\x3Cspan class="n">' +
          (gagne > 0 ? '+' : '') + nb(gagne) + '\x3C/span>\x3C/div>' : '') +
        comptesDeLaSemaine(i);
    } else {
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">' + etiquette(i) + '\x3C/div>\x3Cdiv class="bulle-ligne">' +
        (i > AUJ ? 'À venir' : 'Pas de relevé cette semaine-là') + '\x3C/div>';
    }
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  /* Sous les deux lignes de tête, le résumé de la semaine. « +6 » ne dit pas
     ce qui s'est passé : la bulle reprend les comptes du journal — passages,
     nouveaux, disparus, changements d'indice — une ligne par compte non nul,
     et rien d'autre : le journal, dessous, donne le détail. Quand la courbe
     est celle d'un groupe, les comptes se limitent aux plans de ce groupe. */
  var LIGNES_BULLE = [
    { cle: 'termine', un: 'passé en terminé',   des: 'passés en terminé' },
    { cle: 'encours', un: 'passé en cours',     des: 'passés en cours' },
    { cle: 'afaire',  un: 'repassé à faire',    des: 'repassés à faire' },
    { cle: 'vide',    un: 'effacé',             des: 'effacés' },
    { cle: 'nouveau', un: 'nouveau',            des: 'nouveaux' },
    { cle: 'disparu', un: 'disparu',            des: 'disparus' },
    { cle: 'indice',  un: 'changement d’indice', des: 'changements d’indice' }
  ];
  function comptesDeLaSemaine(i) {
    var sem = JOURNAL.filter(function (s) { return s.i === i; })[0];
    if (!sem) return '';
    var evts = sem.evenements.filter(dansPerimetreEvt);
    if (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) {
      evts = evts.filter(function (e) {
        var p = planDeRef(e.ref);
        return p && String(valeurDim(p, vue.groupe.dim)) === vue.groupe.val;
      });
    }
    var c = comptesEvenements(evts);
    var lignes = LIGNES_BULLE.filter(function (l) { return c[l.cle]; }).map(function (l) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleDe(l.cle) + (c[l.cle] > 1 ? l.des : l.un) +
        '\x3Cspan class="n">' + nb(c[l.cle]) + '\x3C/span>\x3C/div>';
    });
    return lignes.length ? '\x3Cdiv class="bulle-comptes">' + lignes.join('') + '\x3C/div>' : '';
  }

  cadreGraphe.addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  document.querySelector('.commandes-graphe .segmente').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-span]');
    if (b) reglerSpan(Number(b.dataset.span));
  });

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y
     laisse aucune trace tant que les autres avancent. On projette donc
     chaque groupe a SON rythme, et on regarde lequel arrive le dernier.
     ============================================================ */
  var FENETRE = 6;

  /* L'explication ne vaut que chiffree : on reprend une ligne reelle du bloc et
     on y refait le calcul pas a pas, plutot qu'un exemple invente. */
  function panneauAide(rangs, prochain, semainesJalon) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restants > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    function d(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
    /* Dans l'exemple, un rythme arrondi au dixieme ne redonnerait pas la date
       affichee : on garde deux decimales, sans zero inutile. */
    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

    var h = '\x3Cdiv class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment la fin estimée est calculée">';
    h += '\x3Ch3>D’où vient la fin estimée ?\x3C/h3>';
    h += '\x3Cp>GATES ne donne qu’une photo du jour, sans historique. On archive donc un relevé à chaque import, ' +
         'puis on compare le premier au dernier et on prolonge la pente en ligne droite.\x3C/p>';
    h += '\x3Cdiv class="aide-formule">' +
         'rythme   = (terminés aujourd’hui − terminés au 1\x3Csup>er\x3C/sup> relevé) ÷ semaines écoulées\n' +
         'restants = total − terminés aujourd’hui\n' +
         '\x3Cb>fin      = semaine actuelle + arrondi supérieur(restants ÷ rythme)\x3C/b>' +
         '\x3C/div>';

    if (ex) {
      var depart = ex.termine - ex.rythme.gagnes;
      var sem = ex.fin - AUJ;
      h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Exemple — ' + ech(TITRE_DIM[vue.dimCritique].replace(/ \(.*\)$/, '')) +
           ' ' + ech(ex.nom) + ', au dernier import\x3C/span>' +
           'rythme   = (' + ex.termine + ' − ' + depart + ') ÷ ' + ex.rythme.semaines + ' sem. = ' +
           d2(ex.vitesse) + ' plan par semaine\n' +
           'restants = ' + ex.total + ' − ' + ex.termine + ' = ' + ex.restants + ' plans\n' +
           '\x3Cb>fin      = ' + ex.restants + ' ÷ ' + d2(ex.vitesse) + ' = ' + sem + ' semaines → ' +
           etiquette(AUJ) + ' + ' + sem + ' = ' + etiquette(ex.fin) + '\x3C/b>' +
           '\x3C/div>';
      if (prochain && semainesJalon > 0) {
        h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Et les deux colonnes voisines, sur la même ligne\x3C/span>' +
             'à solder/sem. = restants ÷ semaines avant le jalon\n' +
             '              = ' + ex.restants + ' ÷ ' + semainesJalon + ' = ' + d(ex.requis) +
             ' → affiché ' + Math.ceil(ex.requis) + ' (on n’achève pas un demi-plan)\n' +
             'effort        = à solder/sem. ÷ rythme actuel\n' +
             '              = ' + d(ex.requis) + ' ÷ ' + d2(ex.vitesse) + ' = ×' + d(ex.tension) +
             (ex.tension > 1 ? '  → il faut aller ' + d(ex.tension) + ' fois plus vite qu’aujourd’hui'
                             : '  → le rythme actuel suffit') +
             '\x3C/div>';
      }
    } else {
      h += '\x3Cp>Aucun groupe de la sélection n’a de rythme exploitable pour l’instant : ' +
           'il faut au moins deux relevés et un plan terminé entre les deux.\x3C/p>';
    }

    h += '\x3Cp>Un groupe qui n’a rien soldé depuis le premier relevé n’a pas de rythme : sa fin reste « — ». ' +
         'La date se recalcule à chaque import et peut reculer — ce n’est pas un engagement, ' +
         'c’est ce que dit le rythme tenu jusqu’ici.\x3C/p>';
    return h + '\x3C/div>';
  }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc
     TOUTES ses références, en deux paquets : ce qui n'est pas terminé — à
     faire, non renseigné, en cours, dans cet ordre, parce que c'est là qu'il
     y a quelque chose à faire — puis ce qui est soldé. Dans chaque paquet,
     les références se suivent dans l'ordre numérique. Rien n'est tronqué :
     un « et N autres » qui ne s'ouvre pas ne sert à personne. */
  function listeUD(r) {
    var ordre = { afaire: 0, vide: 1, encours: 2, termine: 3 };
    var plans = (r.plans || []).slice().sort(function (a, b) {
      return (ordre[a._etat] - ordre[b._etat]) || a.reference.localeCompare(b.reference, 'fr', { numeric: true });
    });
    if (!plans.length) return '';
    function jeton(p) {
      var e = ETAT_PAR_CLE[p._etat];
      var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
      return '\x3Cbutton class="jeton-ud" type="button" data-ud="' + ech(p.reference) +
        '" title="' + ech(e.court + (quoi ? ' — ' + quoi : '')) + '">' +
        pastilleDe(p._etat) + ech(p.reference) + '\x3C/button>';
    }
    function paquet(titre, liste) {
      if (!liste.length) return '';
      return '\x3Cdiv class="sous-groupe">\x3Ch4 class="sous-titre">' + titre +
        '\x3Cspan class="n">(' + nb(liste.length) + ')\x3C/span>\x3C/h4>' +
        '\x3Cdiv class="grille">' + liste.map(jeton).join('') + '\x3C/div>\x3C/div>';
    }
    var restants = plans.filter(function (p) { return p._etat !== 'termine'; });
    var termines = plans.filter(function (p) { return p._etat === 'termine'; });
    return '\x3Cdiv class="groupe-refs">\x3Cdiv class="entete">' +
      '\x3Cspan>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (restants.length ? ' · \x3Cb>' + nb(restants.length) + '\x3C/b> pas encore terminé' + (restants.length > 1 ? 's' : '')
                       : ' · tout est soldé') +
      '\x3C/span>\x3Cspan>cliquez une référence pour la retrouver dans le tableau\x3C/span>\x3C/div>' +
      paquet('Pas encore terminés', restants) +
      paquet('Terminés', termines) +
      '\x3C/div>';
  }

  /* Le filtre de la colonne de gauche : les groupes dont le nom — tel qu'il
     s'affiche, donc « Oui » pour « true » — contient le texte tapé. */
  function retenuParFiltreGroupe(r) {
    var q = norm(vue.filtreGroupe);
    if (!q) return true;
    return norm(libelleGroupe(r.nom)).indexOf(q) !== -1 || norm(r.nom).indexOf(q) !== -1;
  }
  /* Le champ suit la dimension : « Filtrer les ATA… », « Filtrer les mois… ». */
  function libellerFiltreGroupe(dim) {
    var quoi = dim === '_mois' ? 'mois'
             : dim === '_anciennete' ? 'tranches'
             : (TITRE_DIM[dim] || 'groupes').replace(/ \(.*\)$/, '');
    $('filtre-groupe').placeholder = 'Filtrer les ' + quoi + '…';
    $('filtre-groupe').setAttribute('aria-label', 'Filtrer les ' + quoi);
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    var prochain = jalons.filter(function (j) { return j.i > AUJ; })
      .sort(function (a, b) { return a.i - b.i; })[0];

    // Répartition : état du jour, filtrée comme le reste de la page.
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [] };
      groupes[k].total++;
      groupes[k][p._etat]++;
      groupes[k].plans.push(p);
    });

    /* Rythme : il vient des relevés archivés, qui portent sur l'ensemble des
       plans du groupe. Un comptage déjà figé ne peut pas être refiltré — sauf
       par le périmètre, qui se dérive de la carte plan par plan de chaque
       relevé, comme la courbe ; un relevé sans carte est alors écarté. */
    var per = vue.perimetre;
    var relevesRythme = per ? RELEVES.filter(function (rel) { return !!rel.plans; }) : RELEVES;

    var semainesJalon = prochain ? prochain.i - AUJ : 0;
    var rangs = Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      var restants = g.total - g.termine;
      // Même méthode que la courbe : l'étendue des rythmes réellement tenus.
      var serieGroupe = relevesRythme.map(function (rel) {
        var gr = per ? comptesDerives(rel, per, dim).groupes[k]
                     : (rel.groupes[dim] && rel.groupes[dim][k]);
        return { i: rel.i, termine: gr ? gr.termine : 0 };
      });
      var rg = rythmes(serieGroupe);
      var vitesse = rg ? rg.central : 0;
      return {
        rythme: rg,
        nom: g.nom, total: g.total, restants: restants, vitesse: vitesse, plans: g.plans,
        termine: g.termine, encours: g.encours, afaire: g.afaire, vide: g.vide,
        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restants === 0 ? AUJ : semaineFin(g.termine, g.total, vitesse),
        // L'effort demandé : combien il faut solder par semaine pour tenir le
        // jalon, et par quel facteur cela dépasse le rythme actuel du groupe.
        requis: semainesJalon > 0 ? restants / semainesJalon : 0,
        tension: (semainesJalon > 0 && vitesse > 0) ? (restants / semainesJalon) / vitesse : Infinity
      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      if (cle === 'total') return r.total;
      if (cle === 'pct') return r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'tension') return r.vitesse > 0 ? r.tension : Infinity;
      if (cle === 'fin') return r.fin === null ? Infinity : r.fin;
      return 0;
    }
    var tg = vue.triGroupe;
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {
        var x = cleTri(a, tg.cle), y = cleTri(b, tg.cle);
        if (typeof x === 'string') {
          // Les codes ATA sont des nombres ecrits en texte : on les compare comme tels.
          var nx = parseFloat(x), ny = parseFloat(y);
          if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return (nx - ny) * signe;
          return x.localeCompare(y, 'fr', { numeric: true }) * signe;
        }
        if (x === y) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        // Infinity des deux cotes : egalite, on retombe sur le nom.
        if (!isFinite(x) && !isFinite(y)) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        return (x < y ? -1 : 1) * signe;
      });
    } else {
      rangs.sort(function (a, b) {
        if ((a.restants === 0) !== (b.restants === 0)) return a.restants === 0 ? 1 : -1;
        if (prochain) return b.tension - a.tension;
        if ((a.fin === null) !== (b.fin === null)) return a.fin === null ? -1 : 1;
        return (b.fin || 0) - (a.fin || 0);
      });
    }

    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    $('titre-groupe').textContent = 'Avancement FWD par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '');
    $('indice-dim').textContent = NOTE_DIM(dim);
    libellerFiltreGroupe(dim);

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucun plan dans la sélection.\x3C/div>';
      $('compte-groupes').textContent = '';
      return;
    }

    /* Le filtre de la colonne de gauche ne touche qu'à ce bloc : les lignes
       qu'il écarte restent comptées partout ailleurs. Le compte dit combien
       restent sur combien tant qu'il agit. */
    var tous = rangs.length;
    rangs = rangs.filter(retenuParFiltreGroupe);
    $('compte-groupes').textContent = rangs.length === tous ? '' : nb(rangs.length) + ' sur ' + nb(tous);

    function fleche(cle) {
      if (!tg || tg.cle !== cle) return '';
      return '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
    }
    function entete(cle, libelle, titre, classe) {
      var actif = !!(tg && tg.cle === cle);
      return '\x3Cspan class="' + (classe || '') + '">\x3Cbutton type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +
        (titre ? ' title="' + ech(titre) + '"' : '') + '>' + ech(libelle) + fleche(cle) + '\x3C/button>';
    }

    function aide(quoi) {
      return '\x3Cbutton type="button" class="aide" data-aide="1" aria-expanded="' + (!!vue.aideFin) +
        '" aria-controls="panneau-fin" title="Comment ' + ech(quoi) + ' se calcule">?\x3C/button>';
    }

    var html = '\x3Cdiv class="critique-tete">' +
      entete('nom', TITRE_DIM[dim].replace(/ \(.*\)$/, ''), TITRE_DIM[dim]) + '\x3C/span>' +
      entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '\x3C/span>' +
      entete('pct', 'répartition FWD', 'Trier par part de plans terminés.', 'a-gauche') + '\x3C/span>' +
      entete('fin', 'fin estimée', 'Date d’arrivée si le rythme actuel se maintient.') + aide('la fin estimée') + '\x3C/span>' +
      (prochain
        ? entete('tension', 'effort demandé', 'Ce qu\'il faudrait solder chaque semaine pour tenir le jalon, comparé au rythme réellement tenu.') + aide('l’effort demandé') + '\x3C/span>'
        : entete('tension', 'rythme actuel', 'Plans terminés par semaine depuis le premier relevé.') + aide('le rythme actuel') + '\x3C/span>') +
      '\x3C/div>';

    if (vue.aideFin) html += panneauAide(rangs, prochain, semainesJalon);

    /* Toutes les lignes sont là — « Date création par mois » peut en faire
       quatre-vingts — mais le bloc a une hauteur : on descend dedans au lieu
       de pousser le reste de la page vers le bas. */
    html += rangs.map(function (r) {
      var actif = vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom;

      /* Le pourcentage s'ecrit dans le segment quand il y tient ; en dessous
         il reste dans l'infobulle plutot que d'etre rogne. */
      var barre = ETATS.map(function (e) {
        if (!r[e.cle]) return '';
        var part = (r[e.cle] / r.total) * 100;
        var texte = part >= 11 ? Math.round(part) + ' %' : '';
        var encre = encreSegment(e.cle);
        return e.hachure
          ? '\x3Cspan class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
          : '\x3Cspan style="width:' + part.toFixed(2) + '%;background:' + e.couleur + ';color:' + encre + '">' + texte + '\x3C/span>';
      }).join('');

      /* Une seule colonne d'appoint : l'effort demandé quand un jalon fixe une
         échéance, le rythme réellement tenu sinon. « À solder par semaine » a
         été retiré : personne ne suivait un nombre par semaine. */
      var col2;
      if (!prochain) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme actuel">\x3Cspan class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? r.vitesse.toFixed(1).replace('.', ',') + '/sem.' : 'rien de soldé') +
          '\x3C/span>\x3C/span>';
      } else if (r.restants === 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart">tout est soldé\x3C/span>\x3C/span>';
      } else if (r.vitesse <= 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart arret">rien de soldé\x3Csmall>aucun rythme\x3C/small>\x3C/span>\x3C/span>';
      } else {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé" title="' + r.restants +
          ' plans restants à répartir sur ' + semainesJalon + ' semaines, soit ' +
          r.requis.toFixed(1).replace('.', ',') + ' par semaine.">\x3Cspan class="v critique-ecart">' +
          (r.tension > 1 ? '\x3Cb class="tard">×' + r.tension.toFixed(1).replace('.', ',') + '\x3C/b>'
                         : '×' + r.tension.toFixed(1).replace('.', ',')) +
          '\x3Csmall>rythme ' + r.vitesse.toFixed(1).replace('.', ',') + '/sem.\x3C/small>\x3C/span>\x3C/span>';
      }

      // --- colonne chiffree 3 : la date d'arrivee au rythme actuel
      var texteFin = r.restants === 0 ? 'soldé' : (r.fin === null ? '—' : etiquette(r.fin));
      var col3 = '\x3Cspan class="critique-date' + (r.fin === null && r.restants !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" title="' +
        (r.restants === 0 ? 'Plus rien à solder dans ce groupe.'
          : r.fin === null ? 'Aucun plan terminé depuis le premier relevé : pas de rythme, donc pas de date.'
          : r.restants + ' plans restants à ' + r.vitesse.toFixed(1).replace('.', ',') +
            ' par semaine, soit ' + (r.fin - AUJ) + ' semaines.') +
        '">\x3Cspan class="v">' + texteFin + '\x3C/span>\x3C/span>';

      return '\x3Cbutton class="critique-ligne" type="button" data-groupe="' + ech(r.nom) + '" aria-pressed="' + !!actif +
        '" title="' + r.termine + ' terminés, ' + r.encours + ' en cours, ' + r.afaire + ' à faire, ' +
        r.vide + ' non renseignés — cliquez pour voir lesquels">' +
        '\x3Cspan class="critique-nom">' + ech(libelleGroupe(r.nom)) + '\x3C/span>' +
        '\x3Cspan class="critique-total" data-libelle="plans">' + r.total + '\x3C/span>' +
        '\x3Cspan class="critique-barre">' + barre + '\x3C/span>' +
        col3 + col2 + '\x3C/button>' +
        (actif ? listeUD(r) : '');
    }).join('');

    if (!rangs.length) {
      html += '\x3Cdiv class="vide-message">Aucun groupe ne contient « ' + ech(vue.filtreGroupe.trim()) +
        ' ». Échap vide le filtre.\x3C/div>';
    }

    /* toggle et non className : le conteneur porte aussi « defile-liste »,
