  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/skin.css">

  <!-- =====================================================================
       La page des porteurs. La galerie, la fiche, le comparateur et le

       et dans porteurs.js : rien n'est déclaré ici.
       ===================================================================== -->
</head>

<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="site-entete">
    <div class="site-entete__interieur">
      <a class="site-logo" href="index.html">ETII <span>HUB</span></a>
      <nav class="site-nav" aria-label="Navigation principale">
        <ul class="site-nav__liste">
          <li><a href="index.html">Tableau de bord</a></li>
          <li><a href="porteurs.html" aria-current="page">Porteurs</a></li>
          <li><a href="etiia.html" data-pole="ETIIA">ETIIA</a></li>
          <li><a href="etiie.html" data-pole="ETIIE">ETIIE</a></li>

      </button>

        <span class="bascule-theme__icone bascule-theme__icone--clair" aria-hidden="true">☾</span>

        <span class="bascule-theme__libelle">Thème sombre</span>

  <main id="contenu" tabindex="-1">

    <!-- La une : le titre en très grand, un ornement, le résumé de la
         flotte (calculé par porteurs-page.js). Derrière, en filigrane, un
         Fenestron — le rotor arrière caréné de la maison, dix pales à
         espacement inégal — qui tourne très lentement (décoratif). -->
    <div class="page-tete page-tete--une page-tete--porteurs">
      <svg class="page-une__rotor page-une__rotor--fenestron" viewBox="-200 -200 400 400" aria-hidden="true" focusable="false">
        <circle r="196" class="page-une__graduation"/>
        <circle r="174"/>
        <circle r="152"/>
        <circle r="34"/>
        <circle r="15"/>
        <g class="page-une__stators">
          <path d="M 36 -2 L 150 -8"/>
          <path d="M 36 -2 L 150 -8" transform="rotate(120)"/>
          <path d="M 36 -2 L 150 -8" transform="rotate(240)"/>
        </g>
        <g class="page-une__pales">
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(30)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(68)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(104)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(138)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(176)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(212)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(247)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(285)"/>
          <path d="M 34 -6 Q 92 -12 150 -7 L 150 5 Q 92 4 34 6 Z" transform="rotate(322)"/>
        </g>
      </svg>
      <div class="conteneur page-entete page-une">
        <h1 class="page-une__titre">Porteurs</h1>
        <span class="page-une__ornement" aria-hidden="true"></span>
        <p class="page-une__sous-titre" id="porteurs-resume">La flotte suivie par le service.</p>
      </div>
    </div>
    <!-- Le bandeau collant : les marchés dans la galerie ; sur une fiche, le
         retour à la galerie et les appareils voisins (porteurs.js). -->
    <div class="page-sommaire porteurs-bandeau__cadre" id="bandeau-porteurs"></div>

    <div class="conteneur porteurs__page">
      <div id="zone-porteurs"></div>
    </div>
  </main>

  <footer class="site-pied">
    <div class="site-pied__interieur">
      <p class="site-pied__marque"><span class="site-pied__nom">ETII <span>Hub</span></span> Le portail du service, tenu par ses équipes.</p>
      <p class="site-pied__liens">

      <p class="site-pied__mention">
        <span aria-hidden="true">●</span>
        Toutes les données de ce site sont fictives

  <div class="toasts" data-toasts role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="assets/js/porteurs-page.js"></script>
