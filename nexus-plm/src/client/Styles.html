<style>
/* ============================================================
   NEXUS PLM — design system.
   Les couleurs sont des variables : elles étaient répétées en dur dans une
   quarantaine de règles et dans des attributs style= au fil du HTML.
   ============================================================ */
:root {
  --fond: #f5f5f7;
  --surface: #ffffff;
  --encre: #1c1c1e;
  --encre-douce: #86868b;
  --bordure: #e5e5ea;
  --bordure-forte: #d1d1d6;

  --marine: #0b132b;
  --marine-clair: #1c2541;
  --accent: #0071e3;
  --accent-doux: #f0f4f8;
  --accent-bordure: #cce4fc;
  --bleu-pale: #8cb0d9;

  --succes: #2e7d32;   --succes-fond: #e8f5e9;   --succes-bordure: #c8e6c9;
  --attente: #f57f17;  --attente-fond: #fff8e1;  --attente-bordure: #ffecb3;
  --danger: #c62828;   --danger-fond: #ffebee;   --danger-bordure: #ffcdd2;
  --rouge-vif: #ff3b30; --vert-vif: #34c759;

  --rayon: 16px;
  --rayon-sm: 10px;
  --largeur-max: 1400px;
  --ombre: 0 4px 15px rgba(0,0,0,.04);
  --ombre-forte: 0 16px 30px rgba(0,0,0,.08);
}

body {
  background: var(--fond);
  color: var(--encre);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* .max-width-xl était utilisée dans le HTML mais définie NULLE PART, et
   n'existe pas dans Bootstrap : les conteneurs étaient pleine largeur. */
.max-width-xl { max-width: var(--largeur-max); margin-inline: auto; }

/* ---------- Bandeau ---------- */
.hero-panel {
  background: linear-gradient(135deg, var(--marine) 0%, var(--marine-clair) 100%);
  padding: 50px 0 40px; color: #fff; border-bottom: 4px solid var(--accent);
}
.page-title {
  font-size: clamp(28px, 5vw, 38px); font-weight: 900; letter-spacing: -1px;
  margin-bottom: 5px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.3);
}
.page-subtitle {
  font-size: 13px; font-weight: 700; color: var(--bleu-pale);
  text-transform: uppercase; letter-spacing: 2px;
}

/* ---------- Indicateurs ---------- */
.kpi-row { display: flex; gap: 20px; margin-top: 30px; justify-content: center; flex-wrap: wrap; }
.kpi-card {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--rayon); padding: 15px 25px; text-align: center;
  min-width: 200px; flex: 1 1 200px; max-width: 280px; backdrop-filter: blur(10px);
}
.kpi-val { font-size: clamp(26px, 4vw, 36px); font-weight: 800; color: #fff; line-height: 1; }
.kpi-label {
  font-size: 11px; font-weight: 700; color: var(--bleu-pale);
  text-transform: uppercase; margin-top: 6px; letter-spacing: .5px;
}

/* ---------- Recherche ---------- */
.control-container { margin-top: -25px; margin-bottom: 30px; }
.control-bar {
  background: rgba(255,255,255,.95); backdrop-filter: blur(20px);
  border-radius: var(--rayon); padding: 10px; box-shadow: var(--ombre-forte);
  border: 1px solid var(--bordure); display: flex; align-items: center;
  gap: 8px; flex-wrap: wrap;
}
.apple-input {
  background: transparent; border: none; padding: 12px 20px; font-size: 15px;
  flex: 1 1 240px; outline: none; font-weight: 500; color: inherit;
}

/* ---------- Onglets ---------- */
.function-tabs { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 20px; }
.function-tabs::-webkit-scrollbar { height: 4px; }
.function-tabs::-webkit-scrollbar-thumb { background: var(--bordure-forte); border-radius: 4px; }
.tab-pill {
  background: var(--surface); border: 1px solid var(--bordure-forte); color: var(--encre-douce);
  font-size: 14px; font-weight: 700; padding: 8px 20px; border-radius: 20px;
  cursor: pointer; transition: .2s; white-space: nowrap;
}
.tab-pill:hover { background: #f0f0f5; }
.tab-pill.active { background: var(--marine); color: #fff; border-color: var(--marine); }
.tab-count {
  font-size: 11px; background: rgba(0,0,0,.1); padding: 2px 6px;
  border-radius: 10px; margin-left: 6px; color: inherit;
}

/* ---------- Tuiles ---------- */
.product-card {
  background: var(--surface); border-radius: var(--rayon); padding: 24px;
  box-shadow: var(--ombre); height: 100%; display: flex; flex-direction: column;
  transition: .2s; border: 1px solid var(--bordure);
}
.product-card:hover {
  transform: translateY(-4px); box-shadow: var(--ombre-forte); border-color: var(--bordure-forte);
}
.card-image {
  width: 100%; height: 180px; object-fit: contain; background: var(--fond);
  border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--bordure);
}
.pn-title {
  font-size: 22px; font-weight: 800; color: var(--accent); margin: 0;
  letter-spacing: -.5px; word-break: break-word;
}
.status-badge {
  font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 8px;
  border-radius: 6px; display: inline-block; white-space: nowrap;
}
.status-valide   { background: var(--succes-fond);  color: var(--succes);  border: 1px solid var(--succes-bordure); }
.status-etude    { background: var(--attente-fond); color: var(--attente); border: 1px solid var(--attente-bordure); }
.status-obsolete { background: var(--danger-fond);  color: var(--danger);  border: 1px solid var(--danger-bordure); }

.internal-list-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid #f0f0f2;
}
.internal-list-row:last-child { border-bottom: none; }
.internal-list-row.meta-top  { border-top: 1px dashed var(--bordure); margin-top: 8px; }
.internal-list-row.meta-last { border-bottom: none; }
.internal-type { font-size: 13px; font-weight: 700; }
.internal-pn {
  font-size: 13px; font-family: SFMono-Regular, Consolas, monospace;
  font-weight: 600; color: var(--encre-douce); text-align: right; word-break: break-word;
}

.btn-primary-apple {
  background: var(--marine); color: #fff; border-radius: var(--rayon-sm); font-size: 13px;
  font-weight: 600; border: none; padding: 10px 16px; width: 100%; margin-top: auto; transition: .2s;
}
.btn-primary-apple:hover { background: var(--marine-clair); color: #fff; }
.btn-compare {
  background: var(--accent-doux); color: var(--accent); border-radius: var(--rayon-sm);
  font-size: 13px; font-weight: 700; border: none; padding: 10px 16px; width: 100%; margin-top: 8px;
}

/* ---------- Panneau latéral ---------- */
.offcanvas {
  /* 650px en dur débordait sur mobile malgré le meta viewport */
  width: min(650px, 100vw) !important;
  border-radius: 20px 0 0 20px; background: var(--fond); border-left: 1px solid var(--bordure);
}
.component-block {
  background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 20px;
  box-shadow: var(--ombre); border: 1px solid var(--bordure);
}
.bloc-titre { word-break: break-word; }

.detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
.detail-key { font-size: 12px; color: var(--encre-douce); font-weight: 600; width: 35%; flex-shrink: 0; margin: 0; }
.detail-value { font-size: 13px; font-weight: 600; text-align: left; flex-grow: 1; word-break: break-word; }
.edit-input {
  background: var(--accent-doux); border: 1px solid var(--accent-bordure); padding: 8px 12px;
  border-radius: 8px; font-size: 13px; width: 100%; font-weight: 600; color: var(--encre);
  flex-grow: 1; box-sizing: border-box;
}
.apercu-image { display: block; max-width: 120px; border-radius: 8px; margin-top: 6px; }

.btn-action-sm { font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: none; }
.btn-edit { background: var(--fond); color: var(--encre); }
.btn-save { background: var(--vert-vif); color: #fff; }
.btn-delete { background: var(--rouge-vif); color: #fff; }
.btn-compare-sm { background: #e8f4fd; color: var(--accent); border: 1px solid #bce0fd; }

.std-chip {
  display: inline-flex; align-items: center; background: var(--accent-doux);
  border: 1px solid var(--accent-bordure); padding: 4px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: var(--accent); margin: 0 6px 6px 0;
}
.std-del { margin-left: 8px; cursor: pointer; color: var(--encre-douce); font-size: 14px; font-weight: bold; }
.std-del:hover { color: var(--rouge-vif); }
.bloc-std { background: #fafafa; border-radius: 12px; padding: 15px; border-top: 1px solid var(--bordure); margin-top: 8px; }
.btn-ajout-std { font-size: 11px; font-weight: 700; border-radius: 8px; }
.btn-ajout-se { border-radius: 12px; }

.btn-new-boite {
  position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: #fff;
  width: 56px; height: 56px; border-radius: 28px; font-size: 24px; line-height: 1;
  box-shadow: 0 10px 25px rgba(0,0,0,.3); border: none; z-index: 1000;
}

.mini-spinner {
  display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,.1);
  border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .mini-spinner { animation: none; }
  .product-card { transition: none; }
}

/* ---------- Comparateur ---------- */
.analyze-row { font-size: 13px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
.analyze-icon { font-size: 14px; margin-top: 1px; font-weight: 700; }
.etat-ok { color: var(--succes); }
.etat-partiel { color: var(--attente); }
.etat-diff { color: var(--rouge-vif); }
.etat-inconnu { color: var(--encre-douce); }
.analyze-content { flex-grow: 1; word-break: break-word; }

.ensembles { margin: 10px 0 16px; }
.bloc-ensemble { padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; }
.bloc-ensemble-titre { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
.bloc-ensemble-corps { font-size: 12px; }
.ensemble-ok       { background: #f0fdf4; border: 1px solid #bbf7d0; }
.ensemble-ok .bloc-ensemble-titre, .ensemble-ok .bloc-ensemble-corps { color: #166534; }
.ensemble-manquant { background: #fffbeb; border: 1px solid #fef08a; }
.ensemble-manquant .bloc-ensemble-titre, .ensemble-manquant .bloc-ensemble-corps { color: #92400e; }
.ensemble-plus     { background: #f8fafc; border: 1px solid #e2e8f0; }
.ensemble-plus .bloc-ensemble-titre, .ensemble-plus .bloc-ensemble-corps { color: #475569; }

.score-pastille {
  background: var(--accent-doux); color: var(--accent); border-radius: 8px;
  padding: 6px 14px; font-weight: 800; text-align: center; white-space: nowrap;
}
.score-pastille span {
  display: block; font-size: 10px; font-weight: 600;
  color: var(--encre-douce); text-transform: uppercase;
}
.couverture-alerte {
  background: var(--attente-fond); border: 1px solid var(--attente-bordure);
  color: #92400e; font-size: 12px; font-weight: 600;
  padding: 6px 10px; border-radius: 8px; margin-bottom: 12px;
}

.multi-search-pill {
  display: inline-flex; align-items: center; background: var(--surface);
  border: 1px solid var(--bordure); padding: 6px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600; margin: 4px;
}
.multi-search-pill .del { margin-left: 10px; cursor: pointer; color: var(--rouge-vif); font-weight: bold; }

.ligne-catalogue {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--bordure); cursor: pointer;
}
.ligne-catalogue:hover { background: var(--accent-doux); }

/* ---------- Messages ---------- */
.bandeau {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: min(620px, calc(100vw - 32px)); padding: 14px 20px; border-radius: 12px;
  font-size: 14px; font-weight: 600; z-index: 2000;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); display: none;
}
.bandeau-erreur { background: var(--rouge-vif); color: #fff; }
.bandeau-succes { background: var(--vert-vif); color: #fff; }
.bandeau-info   { background: var(--marine); color: #fff; }
</style>
