<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  /* L'ouverture, chronométrée (débrief 23 : « le site est très très long à
     charger »). Le premier repère est pris ici, en tête du Javascript ; les
     suivants après le décodage des données, quand la synthèse est peinte,
     puis quand tout l'est. Le pied de page en tire une ligne, et le classeur
     les reçoit avec l'ouverture comptée — sans nom ni adresse. */
  var CHRONO = window.performance && typeof performance.now === 'function'
    ? function () { return performance.now(); } : function () { return Date.now(); };
  var T0 = CHRONO(), D0 = Date.now();
  var CHRONOS = { debut: T0 };
  try { performance.mark('suivi-fwd:debut'); } catch (e) { /* sans repères */ }
  function marquer(nom) {
    CHRONOS[nom] = CHRONO();
    try { performance.mark('suivi-fwd:' + nom); } catch (e) { /* un navigateur sans repères : le chrono suffit */ }
  }
  /* La plus longue tâche de l'ouverture : celle qui fige l'écran le plus longtemps. */
  var TACHE_LONGUE = 0, GUETTEUR_TACHES = null;
  try {
    if (window.PerformanceObserver) {
      GUETTEUR_TACHES = new PerformanceObserver(function (liste) {
        liste.getEntries().forEach(function (e) { if (e.duration > TACHE_LONGUE) TACHE_LONGUE = e.duration; });
      });
      GUETTEUR_TACHES.observe({ type: 'longtask', buffered: true });
    }
  } catch (e) { GUETTEUR_TACHES = null; /* sans observateur : la mesure n'est pas faite, rien d'autre ne change */ }
  /* L'ouverture en deux temps — la synthèse d'abord, le reste juste après.
     window.SUIVI_FWD_DIFFERER = false, posé avant la page, la rend d'un seul
     bloc, comme avant : c'est ce que la batterie de tests attend. */
  var DIFFERER = window.SUIVI_FWD_DIFFERER !== false;
  /* La livraison de ce fichier, posée par la construction (tests/split-
     prototype.js). « source » : la page seule, la démonstration ou le
     chargeur — un seul fichier, rien à comparer. */
  var EDITION = '0e5f128';
  /* Le filet du démarrage (débrief 17). Une erreur AVANT la fin du démarrage
     — le plus souvent un élément que l'Index d'une autre livraison n'a pas,
     dès les premières lignes qui branchent les boutons — s'affiche en tête de
     page au lieu de laisser le squelette vide. Posé ici, il couvre tout le
     fichier ; les fonctions qu'il appelle sont hissées (voir « LIVRAISON ET
     PANNE », en fin de fichier). L'erreur, elle, reste une erreur. */
  var DEMARRAGE_FINI = false;
  window.addEventListener('error', function (ev) {
    if (DEMARRAGE_FINI || !ev || ev.message === 'Script error.') return;
    if (ev.filename && /\.js(\?|#|$)/.test(ev.filename)) return;     // un script de Google, pas la page
    montrerPanne(ev.error || { name: 'Erreur', message: ev.message }, ecartsDeLivraison(window.SUIVI_FWD_DONNEES));
  });
  /* Le fichier collé deux fois, sans tout effacer : la seconde copie ne
     démarre pas, elle le dit. Une copie d'avant, qui ne s'annonce pas, se
     compte une fois la page chargée. */
  if (window.SUIVI_FWD_DEMARREE) { DEMARRAGE_FINI = true; montrerDoublon(); return; }
  window.SUIVI_FWD_DEMARREE = true;
  document.addEventListener('DOMContentLoaded', function () {
    var copies = 0;
    for (var i = 0; i < document.scripts.length; i++) {
      if ((document.scripts[i].text || '').indexOf('function chargerSource(') !== -1) copies++;
    }
    if (copies > 1) montrerDoublon();
  });
  function ech(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/\x3C/g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /* Minuscules, sans accents, sans espaces superflus — la même réduction que
     normaliser() côté serveur (Code.gs), espaces internes comprises : un
     « Non commencé » collé depuis Excel avec une espace insécable doit se
     classer pareil des deux côtés. L'accentuation ne s'enlève que si le
     navigateur sait le faire : String.prototype.normalize est postérieur à
     ES5, et sans lui la page doit s'afficher quand même. */
  /* La même valeur donne toujours la même réduction : la colonne suivie n'a
     qu'une dizaine de valeurs distinctes, et norm() en voyait des centaines
     de milliers par ouverture (débrief 23). Une valeur courte se retient ;
     un texte long — une ligne entière, pour la recherche — se calcule. */
  var MEMO_NORM = Object.create(null), N_MEMO_NORM = 0;
  function norm(v) {
    var s = String(v == null ? '' : v);
    if (s.length > 64) return reduireTexte(s);
    var r = MEMO_NORM[s];
    if (r !== undefined) return r;
    r = reduireTexte(s);
    if (++N_MEMO_NORM > 50000) { MEMO_NORM = Object.create(null); N_MEMO_NORM = 1; }
    MEMO_NORM[s] = r;
    return r;
  }
  function reduireTexte(s) {
    s = s.toLowerCase();
    if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return s.replace(/\s+/g, ' ').trim();
  }
  /* Un seul format de nombre, fabriqué une fois : n.toLocaleString('fr-FR')
     en refaisait un à chaque appel. Le résultat est le même, par définition
     (ECMA-402 : toLocaleString construit ce même Intl.NumberFormat). */
  var FORMAT_NOMBRE = window.Intl && Intl.NumberFormat ? new Intl.NumberFormat('fr-FR') : null;
  function nb(n) { return FORMAT_NOMBRE && typeof n === 'number' ? FORMAT_NOMBRE.format(n) : n.toLocaleString('fr-FR'); }
  /* Faire défiler jusqu'à un élément : le dictionnaire d'options est récent,
     pas la méthode — un navigateur ancien reçoit l'appel d'origine. */
  function defilerVers(el, options) {
    if (!el || !el.scrollIntoView) return;
    try { el.scrollIntoView(options); } catch (e) { el.scrollIntoView(true); }
  }

  /* ============================================================
     DÉBRIEF 27 — TROIS AIDES COMMUNES À TOUTES LES SECTIONS
     garderFocus, annoncer, TIRET_VIDE. Chaque section s'en sert pour ses
     propres commandes (voir le cahier du débrief 27).
     ============================================================ */

  /* garderFocus(redessiner, zone) — redessiner une partie de la page sans
     jeter le focus clavier (un tri, une semaine dépliée, une tuile pressée
     le renvoyaient tout en haut de la page).
     Avant : on note l'élément qui a le focus, s'il est dans « zone » (un
     élément ou son id ; toute la page si elle est omise). On appelle
     redessiner(). Après : si le focus est tombé sur le corps de la page
     (l'élément a été remplacé ou caché), on le rend au « même » élément du
     nouveau rendu — retrouvé par son id, sinon par une clé stable (voir
     CLES_FOCUS : data-cle, data-etat, data-semaine, data-trig…), de même
     balise et de même classe, dans la même partie de la page ; sinon au
     plus proche équivalent : un élément de même sorte dans le plus proche
     ancêtre resté dans la page (la croix du filtre suivant), à défaut le
     titre de la section (rendu focalisable, tabindex=-1). Jamais le corps
     de la page. Si redessiner() a posé le focus ailleurs exprès (une fiche
     qui s'ouvre sur son titre), on n'y touche pas.
     Renvoie ce que renvoie redessiner(). Exemple :
       garderFocus(function () { rendreCritique(liste); }, 'zone-critique'); */
  var CLES_FOCUS = ['data-trig', 'data-tri', 'data-tri-seconde', 'data-filtre', 'data-etat', 'data-semaine',
    'data-ata', 'data-col', 'data-groupe', 'data-passage', 'data-perimetre', 'data-retirer', 'data-plan-rapp',
    'data-ref-plan', 'data-plan', 'data-ud', 'data-vide', 'data-lot', 'data-jalon', 'data-span', 'data-indicateur',
    'data-base', 'data-vue', 'data-onglet', 'data-chapitre', 'data-aide', 'data-arret-groupe', 'data-aller-contrat',
    'data-ref', 'data-id', 'data-email', 'data-admin', 'data-cle', 'data-i'];
  function focusVisible(el) {
    return !!el && !el.disabled && el.getClientRects().length > 0 && !el.closest('[hidden], [inert]');
  }
  function echAttr(v) { return String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
  function empreinteFocus(el) {
    var g = { el: el, id: el.id || '', tag: el.tagName.toLowerCase(), classe: el.classList[0] || '', cle: null, ancetres: [] };
    for (var i = 0; i < CLES_FOCUS.length; i++) {
      if (el.hasAttribute(CLES_FOCUS[i])) { g.cle = [CLES_FOCUS[i], el.getAttribute(CLES_FOCUS[i])]; break; }
    }
    for (var a = el.parentElement; a && a !== document.body; a = a.parentElement) g.ancetres.push(a);
    return g;
  }
  /* Le titre d'une section, rendu focalisable : là où va le focus quand
     plus rien de semblable n'existe. */
  function titreFocalisable(sec) {
    var t = sec && (sec.querySelector('h2') || sec.querySelector('.phrase') || sec.querySelector('.surtitre:not([aria-hidden="true"])'));
    if (t && !t.hasAttribute('tabindex')) t.setAttribute('tabindex', '-1');
    return t && focusVisible(t) ? t : null;
  }
  function retrouverFocus(g, racine) {
    var dans = racine || document;
    if (g.id) { var parId = document.getElementById(g.id); if (focusVisible(parId)) return parId; }
    var vivants = g.ancetres.filter(function (a) { return document.contains(a); });
    if (g.cle) {
      var memes = [].filter.call(dans.querySelectorAll(g.tag + '[' + g.cle[0] + '="' + echAttr(g.cle[1]) + '"]'), function (c) {
        return focusVisible(c) && (!g.classe || c.classList.contains(g.classe));
      });
      for (var i = 0; i < vivants.length && memes.length > 1; i++) {
        for (var k = 0; k < memes.length; k++) if (vivants[i].contains(memes[k])) return memes[k];
      }
      if (memes.length) return memes[0];
    }
    var sorte = g.tag + (g.classe ? '.' + g.classe : '');
    for (var j = 0; j < vivants.length; j++) {
      var a = vivants[j];
      var pareil = [].filter.call(a.querySelectorAll(sorte), focusVisible)[0];
      if (pareil) return pareil;
      /* On ne cherche pas « un bouton pareil » au-delà de sa section : il
         serait n'importe où dans la page. */
      if (a.matches('section, dialog, nav, .panneau, .filtres-actifs, .bandeau-mode')) {
        var t = a.matches('section, .panneau') ? titreFocalisable(a) : null;
        if (t) return t;
        break;
      }
    }
    /* Plus rien de la section : le titre de celle que le sommaire marque
       comme lue, ou de la première. */
    var lu = document.querySelector('#sommaire-liste a[aria-current]');
    var sec = lu ? document.getElementById((lu.getAttribute('href') || '').slice(1)) : document.querySelector('section.panneau');
    return titreFocalisable(sec) || titreFocalisable(document.querySelector('section.panneau'));
  }
  function garderFocus(redessiner, zone) {
    var racine = typeof zone === 'string' ? $(zone) : (zone || null);
    var actif = document.activeElement;
    var g = actif && actif !== document.body && actif !== document.documentElement &&
      (!racine || racine.contains(actif)) ? empreinteFocus(actif) : null;
    var res = redessiner();
    var maintenant = document.activeElement;
    if (g && (!maintenant || maintenant === document.body || (maintenant === g.el && !focusVisible(g.el)))) {
      var cible = retrouverFocus(g, racine && document.contains(racine) ? racine : null);
      if (cible) { try { cible.focus({ preventScroll: true }); } catch (e) { cible.focus(); } }
    }
    return res;
  }

  /* annoncer(texte) — dire un changement de résultat aux lecteurs d'écran,
     poliment, sans rien montrer : « 12 plans affichés sur 634 », « Contrat
     THS chargé », « Tableau trié par RPT, ordre croissant ». Une seule zone
     pour toute la page (#annonce : role="status", visuellement masquée,
     posée dans la page dès l'ouverture). Les appels rapprochés — chaque
     frappe d'une recherche — se regroupent : seul le dernier est dit,
     400 ms après le dernier appel. Le texte est vidé puis réécrit, pour
     qu'un même message répété soit redit. annoncer('') annule ce qui
     attendait. */
  var ANNONCE = { minuteur: 0 };
  function annoncer(texte) {
    var zone = $('annonce');
    if (!zone) {
      zone = document.createElement('div');
      zone.id = 'annonce'; zone.className = 'masque';
      zone.setAttribute('role', 'status'); zone.setAttribute('aria-live', 'polite'); zone.setAttribute('aria-atomic', 'true');
      document.body.appendChild(zone);
    }
    clearTimeout(ANNONCE.minuteur);
    if (!texte) return;
    ANNONCE.minuteur = setTimeout(function () {
      zone.textContent = '';
      ANNONCE.minuteur = setTimeout(function () { zone.textContent = String(texte); }, 60);
    }, 400);
  }
  /* Pour la batterie de tests : les mêmes aides, appelées de l'extérieur. */
  window.__garderFocus = garderFocus;
  window.__annoncer = annoncer;

  /* Une case sans valeur (débrief 27, B22) : « — » en gris tertiaire, la
     même partout (voir .tiret-vide). */
  var TIRET_VIDE = '\x3Cspan class="tiret-vide">\u2014\x3C/span>';

  /* Débrief 27 (lot H, P-F12, D9) : la raison d'une commande ou d'une entrée
     indisponible (aria-disabled), montrée juste sous elle au clic, au
     toucher ou au clavier — jamais au seul survol — et dite aux lecteurs
     d'écran. Elle s'en va au geste suivant, à Échap, au défilement ou après
     six secondes. */
  var RAISON = { el: null, minuteur: 0 };
  function montrerRaison(cible, texte) {
    if (!cible || !texte) return;
    var b = RAISON.el;
    if (!b) {
      b = RAISON.el = document.createElement('div');
      b.className = 'raison-indispo'; b.id = 'raison-indispo';
      document.body.appendChild(b);
    }
    b.textContent = texte;
    b.hidden = false;
    var r = cible.getBoundingClientRect();
    b.style.left = Math.max(16, Math.min(r.left, window.innerWidth - b.offsetWidth - 16)) + 'px';
    b.style.top = Math.round(r.bottom + 8) + 'px';
    annoncer(texte);
    clearTimeout(RAISON.minuteur);
    RAISON.minuteur = setTimeout(cacherRaison, 6000);
  }
  function cacherRaison() {
    clearTimeout(RAISON.minuteur);
    if (RAISON.el && !RAISON.el.hidden) RAISON.el.hidden = true;
  }
  document.addEventListener('pointerdown', function (e) {
    if (RAISON.el && !RAISON.el.hidden && !(e.target.closest && e.target.closest('[aria-disabled="true"]'))) cacherRaison();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cacherRaison(); });
  window.addEventListener('scroll', function () { if (RAISON.el && !RAISON.el.hidden) cacherRaison(); }, { passive: true });

  /* ============================================================
     LES MESURES DE LA PAGE, UNE FOIS PAR IMAGE (débrief 23)
     Lire une taille juste après avoir écrit dans la page oblige le
     navigateur à tout remettre en page sur-le-champ : à l'ouverture, sur un
     poste chargé, près d'une seconde s'y perdait. Les mesures — le sommaire,
     le fondu des rangées qui débordent, l'ombre et les colonnes figées du
     tableau, les chiffres sous la barre, la colonne du nom des groupes — se
     font donc ensemble, juste avant l'image suivante : les lectures
     d'abord, puis les écritures. Ce qu'elles posent est le même qu'avant.
     ============================================================ */
  var MESURES = { prevu: false, travaux: {}, rangees: [] };
  function aMesurer(travail) {
    MESURES.travaux[travail] = true;
    prevoirMesures();
  }
  function prevoirMesures() {
    if (MESURES.prevu) return;
    MESURES.prevu = true;
    if (window.requestAnimationFrame) requestAnimationFrame(mesurerMaintenant);
    else setTimeout(mesurerMaintenant, 16);
  }
  /* Appelée par l'image suivante, ou tout de suite par un geste qui relit
     la page juste après l'avoir redessinée (une ligne du bloc qui garde sa
     place sous le pointeur). */
  function mesurerMaintenant() {
    if (!MESURES.prevu) return;
    MESURES.prevu = false;
    var t = MESURES.travaux, rangees = MESURES.rangees;
    MESURES.travaux = {}; MESURES.rangees = [];
    /* Les panneaux présents d'abord : ils font la largeur du sommaire. */
    if (t.chapitres) {
      poserChapitresPresents();
      if (rangees.indexOf(LISTE_SOMMAIRE) === -1) rangees.push(LISTE_SOMMAIRE);
    }
    var ecritures = [];
    if (t.hautSommaire) ecritures.push(lireHautSommaire());
    if (t.ombre) ecritures.push(lireOmbre());
    rangees.forEach(function (r) { ecritures.push(lireDebord(r)); });
    ecritures.forEach(function (ecrire) { if (ecrire) ecrire(); });
    /* Ceux qui mesurent ce qu'ils viennent de poser : chacun à son tour. */
    if (t.barre) alignerSousBarre('barre', 'filets', 'etats');
    if (t.sticky) poserColonnesFigees();
    if (t.colonneNom) poserColonneNom();
    if (t.chapitres) majSommaire();
  }
  /* Exposée pour la batterie : la même réduction que le serveur, vérifiable
     cas par cas (espace insécable, accents, espaces multiples). */
  window.__norm = norm;
  /* « 7 » → « 07 » : String.prototype.padStart n'existe pas en ES5. */
  function deuxChiffres(n) { return (n < 10 ? '0' : '') + n; }

  /* ============================================================
     SEMAINES ISO
     ============================================================ */
  function lundiDeLaSemaine(annee, semaine) {
    var jan4 = new Date(Date.UTC(annee, 0, 4));
    var jour = jan4.getUTCDay() || 7;
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jour + 1 + (semaine - 1) * 7);
    return lundi;
  }
  function etiquetteISO(d) {
    /* Minuit UTC d'abord : avec une heure dans la date, le quantième du jeudi
       devient fractionnaire et Math.ceil bascule d'une semaine — visible
       toutes les semaines des années qui commencent un vendredi (2027). */
    var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    var jour = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - jour);
    var debut = Date.UTC(t.getUTCFullYear(), 0, 1);
    var s = Math.ceil(((t.getTime() - debut) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-S' + (s < 10 ? '0' : '') + s;
  }
  /** « 2026-S34 » -> le lundi de cette semaine. null si le libellé est illisible. */
  function lundiDeLibelle(libelle) {
    var m = /^\s*(\d{4})\s*-?\s*[sS]\s*(\d{1,2})\s*$/.exec(String(libelle || ''));
    if (!m) return null;
    var s = parseInt(m[2], 10);
    if (s < 1 || s > 53) return null;
    return lundiDeLaSemaine(parseInt(m[1], 10), s);
  }

  /* ============================================================
     LES QUATRE ETATS
     << A faire >> est une valeur saisie ; << vide >> est une cellule
     non renseignee. Les confondre masquerait un defaut de saisie.
     ============================================================ */
  /* « libelle » compte des plans (« 63 Terminés »), « court » qualifie un plan
     (« À faire → Terminé ») : le pluriel n'a pas sa place dans le second. */
  var ETATS = [
    { cle: 'termine', libelle: 'Validés',   court: 'Validé',   couleur: 'var(--fait)',   teinte: 'var(--fait)', encre: 'var(--sur-plein)' },
    { cle: 'encours', libelle: 'En cours',   court: 'En cours',  couleur: 'var(--v-cours-1)',  teinte: 'var(--v-cours-1)', encre: 'var(--v-cours-1-encre)' },
    { cle: 'afaire',  libelle: 'À faire',    court: 'À faire',   couleur: 'var(--v-afaire-1)', teinte: 'var(--v-afaire-1)', encre: 'var(--v-afaire-1-encre)' },
    { cle: 'vide',    libelle: 'Non renseignés', court: 'Non renseigné', couleur: 'transparent', teinte: 'var(--filet-fort)', hachure: true }
  ];
  var ETAT_PAR_CLE = {};
  ETATS.forEach(function (e) { ETAT_PAR_CLE[e.cle] = e; });

  /* ⚠ Le COUPLE norm() + classer() existe à l'identique côté serveur
     (normaliser() + classerFWD() dans Code.gs) : le serveur s'en sert pour
     archiver les relevés, le client pour les compteurs filtrés. Toute
     modification de l'un OU de l'autre doit être reportée des deux côtés,
     sinon le dernier point de la courbe ne vaut plus la barre du jour. */
  /* Les valeurs qui veulent dire « fini » (CONFIG.VALEURS_FINIES) et « pas
     commencé » (CONFIG.VALEURS_A_FAIRE), transmises par le paquet. Comparées
     entières, sans accents ni accord : « Validée » est « Validé », « Non
     validé » ne l'est pas. */
  function sansAccord(s) { return s.replace(/(?:ee?s?|s)$/, ''); }
  function formesDeclarees(liste, defaut) {
    return (Array.isArray(liste) && liste.length ? liste : defaut)
      .map(function (v) { return sansAccord(norm(v)); }).filter(function (v) { return v !== ''; });
  }
  var VALEURS_FINIES_N = ['valid'], VALEURS_A_FAIRE_N = [], VALEURS_FINIES_DITES = ['Validé'];
  /* Le classement d'une valeur, retenu (débrief 23) : il ne dépend que de
     la valeur et des mots déclarés, et chargerSource() l'oublie quand
     ceux-ci changent. */
  var MEMO_CLASSER = Object.create(null), N_MEMO_CLASSER = 0;
  function classer(valeur) {
    var cle = String(valeur == null ? '' : valeur);
    if (cle.length > 64) return classerBrut(cle);
    var r = MEMO_CLASSER[cle];
    if (r !== undefined) return r;
    r = classerBrut(cle);
    if (++N_MEMO_CLASSER > 50000) { MEMO_CLASSER = Object.create(null); N_MEMO_CLASSER = 1; }
    MEMO_CLASSER[cle] = r;
    return r;
  }
  function oublierClassements() { MEMO_CLASSER = Object.create(null); N_MEMO_CLASSER = 0; }
  function classerBrut(valeur) {
    var s = norm(valeur);
    if (s === '' || s === '-' || s === 'empty') return 'vide';
    /* Un numéro devant l'état (« 3 - Validé », « 1. En cours ») ne compte pas. */
    var t = s.replace(/^\d+\s*[-.)]\s*/, '');
    var k = sansAccord(t);
    if (VALEURS_FINIES_N.indexOf(k) !== -1) return 'termine';
    if (VALEURS_A_FAIRE_N.indexOf(k) !== -1) return 'afaire';
    if (/\ba (faire|traiter)\b/.test(t) || /^(non|pas) commence/.test(t)) return 'afaire';
    /* Un nombre, seul : un pourcentage. « 3 - Validé » ou une date n'en sont pas. */
    if (/^-?\d+(?:[.,]\d+)?\s*%?$/.test(s)) {
      var n = parseFloat(s.replace(/[\s%]/g, '').replace(',', '.'));
      if (n >= 100) return 'termine';
      if (n <= 0) return 'afaire';

         plutôt que l'inverse. Et le tableau s'ouvre complet : c'est l'extract.
         La vue essentielle est là pour l'autre besoin. */
      ordre: ORDRE_FEUILLE.slice(),
      /* Les colonnes cachées : la mécanique interne de la vue essentielle,
         jamais une préférence. */
      cachees: {},
      tri: { cle: 'reference', asc: true },
      dimCritique: (SRC.dimParDefaut && CLES_DIM.indexOf(SRC.dimParDefaut) !== -1) ? SRC.dimParDefaut : (CLES_DIM[0] || ''),
      triGroupe: { cle: null, asc: false },
      /* Le filtre de la colonne de gauche du bloc : un texte cherché dans le
         nom des groupes et dans la référence de leurs plans. Ni mémorisé, ni
         conservé d'une dimension à l'autre. */
      filtreGroupe: '',
      /* Les deux rangées de pastilles (débrief 18) : la valeur comptée dans
         le bloc par groupe, et celle que suit la courbe — une clé de valeur,
         '' pour « Tout » et pour « les validés ». Locales, jamais
         mémorisées : elles repartent à zéro avec le contrat et l'avancement. */
      valeurBloc: '', valeurGraphe: '',
      /* La tuile qu'un clic sur « N à l'arrêt » d'un groupe a posée lui-même
         (sous une valeur du bloc) : son second clic la retire avec la
         sélection. Oubliée dès qu'un autre geste touche à la tuile ou à la
         sélection de plans — sinon il retirerait une tuile pressée à la main. */
      etatParArret: '',
      /* Deux vues du tableau, et rien entre les deux : « toutes » montre l'export
         tel quel, dans son ordre ; « essentielle » ne garde que ce qu'on regarde. */
      vueTable: 'toutes'
    };
    vue.fen = cadrageParDefaut();
    if (!avant) return;
    appliquerDisposition(avant);
    vue.vueTable = avant.vueTable === 'essentielle' ? 'essentielle' : 'toutes';
    if (vue.vueTable === 'essentielle') appliquerVueTable();
    if (avant.seconde && avant.seconde.vueTable === 'essentielle') vue.seconde.vueTable = 'essentielle';
  }

  /* Les commandes fixes de la page reflètent la vue : le champ de recherche,
     les interrupteurs du journal, du tableau et du mode. */
  function refleterVue() {
    $('recherche').value = vue.recherche;
    $('filtre-groupe').value = vue.filtreGroupe;
    $('recherche-journal').value = vue.rechercheJournal;
    $('recherche-rapp').value = vue.rechercheRapp;

      b.setAttribute('aria-pressed', String(b.dataset.journal === vue.journal));
    });
    document.querySelectorAll('#vue-tableau button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.vueTable));
    });
    $('recherche-seconde').value = vue.seconde.recherche;
    document.querySelectorAll('#vue-seconde button').forEach(function (b) {

    });

  }

  /* Le bandeau du haut : hors du classeur, la page le dit — c'est une
     démonstration ; devant le classeur, il ne dit rien, sauf ce que le
     classeur a à dire quand il n'a rien pu rendre. */
  function afficherMode() {
    $('mot-mode').innerHTML = SERVEUR ? '' : '\x3Cb>Démonstration\x3C/b> — trois contrats fictifs ; devant votre classeur, la page montre vos données.';
    var message = SRC && SRC.message ? String(SRC.message) : '';
    /* Débrief 26 : des plans, mais tous à part (« S » ou quantité 0) : on
       le dit, et le tableau les montre — ce n'est pas un classeur vide. */
    if (!message && SERVEUR && !PLANS.length && ANCIENS.length) {
      message = 'Tous les plans de cet onglet sont écartés (anciens « S » ou quantité 0) : aucun ne compte. Ils restent visibles, grisés, dans le tableau des plans.';
    }
    $('alerte-source').hidden = !message;
    $('alerte-source').textContent = message;
    /* Un classeur sans plans : la page le dit, et dit le geste, au lieu
       d'afficher des sections vides. */
    var vide = SERVEUR && !PLANS.length && !ANCIENS.length;
    document.body.dataset.vide = String(vide);
    /* Le panneau est masqué dans le balisage : sans le Javascript, il ne
       doit pas se lire (débrief 17). Ici seulement, il se montre. */
    if ($('classeur-vide')) $('classeur-vide').hidden = !vide;
  }

  /* Le sélecteur de contrat et le rappel du contrat courant sous le titre.
     Avec un seul contrat, ni l'un ni l'autre n'a quelque chose à dire. */
  /* Débrief 26 : on choisit le contrat, puis — s'il en a plusieurs — la
     tranche. Les contrats dans l'ordre du classeur, chacun avec ses tranches
     ([{ nom, cle, membres: [{ id, libelle }] }]) ; le contrat lui-même, sans
     nom de tranche, est la « Tranche 1 » de sa famille (« Tranche
     principale » si une autre s'appelle déjà ainsi). */
  function famillesDeContrats() {
    var familles = [], parCle = {};
    CONTRATS.forEach(function (c) {
      var cle = norm(c.contrat);
      var f = parCle[cle];
      if (!f) { f = parCle[cle] = { nom: c.contrat, cle: cle, membres: [] }; familles.push(f); }
      f.membres.push({ id: c.id, tranche: c.tranche });
    });
    familles.forEach(function (f) {
      var dejaUn = f.membres.some(function (m) { return norm(m.tranche) === 'tranche 1'; });
      f.membres.forEach(function (m) { m.libelle = m.tranche || (dejaUn ? 'Tranche principale' : 'Tranche 1'); });
      f.membres.sort(function (a, b) {
        if (!a.tranche !== !b.tranche) return a.tranche ? 1 : -1;
        return COMPARER_REF(a.libelle, b.libelle);
      });
    });
    return familles;
  }
  function familleCourante(familles) {
    return (familles || famillesDeContrats()).filter(function (f) { return f.membres.some(function (m) { return m.id === CONTRAT; }); })[0] || null;
  }
  function afficherContrat() {
    var plusieurs = CONTRATS.length > 1;
    var familles = famillesDeContrats(), courante = familleCourante(familles);
    var sel = $('select-contrat'), selT = $('select-tranche');
    $('choix-contrat').hidden = !plusieurs;
    /* Une option par contrat : sa valeur est la tranche qu'on ouvre en le
       choisissant — l'affichée pour le contrat courant, la première sinon. */
    sel.innerHTML = familles.map(function (f) {
      return '\x3Coption value="' + ech(f === courante ? CONTRAT : f.membres[0].id) + '">' + ech(f.nom) + '\x3C/option>';
    }).join('');
    sel.value = CONTRAT;
    /* Une famille d'une seule tranche nommée (« HDK Tranche 2 » sans « HDK ») le dit aussi. */
    var tranches = !!courante && (courante.membres.length > 1 || !!courante.membres[0].tranche);
    /* Débrief 27 (lot H, B7) : dès qu'un contrat du classeur a des tranches,
       la case « Tranche » garde sa place pour tous — un contrat sans tranche
       y lit « unique », son menu (qui n'aurait rien à proposer) caché : la
       barre ne glisse plus de 170 px sous le pointeur entre HDK et THS. */
    $('choix-tranche').hidden = !familles.some(function (f) { return f.membres.length > 1 || !!f.membres[0].tranche; });
    selT.hidden = !tranches;
    $('tranche-unique').hidden = tranches;
    selT.innerHTML = tranches ? courante.membres.map(function (m) {
      return '\x3Coption value="' + ech(m.id) + '">' + ech(m.libelle) + '\x3C/option>';
    }).join('') : '';
    if (tranches) selT.value = CONTRAT;
    /* Débrief 27 (lot H) : la vue d'ensemble n'a de sens qu'avec plusieurs
       contrats. */
    $('voir-ensemble').hidden = !plusieurs;
    /* Débrief 27 (lot H, A-F4) : un contrat en route — la page se réécrit
       pendant l'attente (avancement, vue d'ensemble) : les menus gardent le
       contrat demandé, jamais celui d'avant. */
    if (ATTENTE_CONTRAT) { refleterAttenteMenus(); return; }
    sel.disabled = selT.disabled = false;
    $('etat-contrat').textContent = '';
  }
  /* Débrief 27 (lot H, A-F10, P-F11) : le nom d'un contrat partout où une
     seule tranche est en jeu — « HDK › Tranche 1 » quand le contrat a
     plusieurs tranches, « THS » sinon. */
  function nomAffiche(id) {
    var familles = CONTRATS ? famillesDeContrats() : [];
    for (var i = 0; i < familles.length; i++) {
      for (var k = 0; k < familles[i].membres.length; k++) {
        var m = familles[i].membres[k];
        if (m.id === id) return familles[i].membres.length > 1 || m.tranche ? familles[i].nom + ' \u203a ' + m.libelle : familles[i].nom;
      }
    }
    return id === undefined || id === null ? '' : String(id);
  }
  /* Les deux listes grisées pendant un chargement, puis remises au contrat affiché. */
  function griserContrat(oui) { $('select-contrat').disabled = $('select-tranche').disabled = !!oui; }
  function remettreContrat() {
    griserContrat(false);
    $('select-contrat').value = CONTRAT;
    if (!$('choix-tranche').hidden && !$('select-tranche').hidden) $('select-tranche').value = CONTRAT;
  }

  /* ------------------------------------------------------------
     RYTHME
     Un seul rythme, lu sur la même série que la courbe : le rythme tenu,
     les plans terminés gagnés du premier au dernier relevé, divisés par les
     semaines écoulées. Il lisse les semaines irrégulières — un lot soldé
     d'un coup, puis rien. (Débrief 15 : un second rythme, sur les quatre
     dernières semaines, faisait « trop de rythme » ; il est retiré.)
     ------------------------------------------------------------ */
  function rythmes(pts) {
    if (!pts || pts.length < 2) return null;
    var premier = pts[0], dernier = pts[pts.length - 1];
    var semaines = dernier.i - premier.i;
    if (semaines <= 0) return null;
    return {
      central: (dernier.termine - premier.termine) / semaines,
      gagnes: dernier.termine - premier.termine,
      semaines: semaines,
      n: pts.length
    };
  }

  /* Le point de départ de toute projection : la semaine où l'on est — celle
     où se comptent les jours de la fiche —, jamais avant le dernier relevé.
     Chaque semaine archivée, c'est la même. Quand l'archivage a du retard,
     les semaines restantes se comptent quand même d'aujourd'hui : le temps
     qui reste ne s'allonge pas parce qu'on n'a pas archivé. */
  function semaineDepart() { return Math.max(AUJ, semaineDAujourdhui()); }

  /** Semaine d'arrivée à un rythme donné, ou null si ce rythme ne mène nulle part. */
  function semaineFin(atteint, total, rythme) {
    if (!rythme || rythme <= 0) return null;
    return semaineDepart() + Math.ceil((total - atteint) / rythme);
  }

  /* Ce qui a bougé entre les deux derniers imports. Invisible à l'œil nu
     sur 186 lignes, et c'est pourtant la question de chaque semaine. */
  /* On compte les passages d'un état à l'autre, avec les mots des quatre états :
     « passés en terminé » et non « ont avancé ». */
  /* Les références sont appariées par racine (voir apparier) : un plan réémis
     va dans « changements d'indice », sous sa nouvelle référence — et aussi
     dans le lot de son état d'arrivée s'il en a changé au passage, car il
     est alors bien passé en terminé, ou en cours. Le passage à « vide » n'est
     pas un lot : une cellule effacée n'est pas un progrès à annoncer. */
  function evenementsImport() {
    if (RELEVES.length < 2) return null;
    var avant = RELEVES[RELEVES.length - 2].plans;
    if (!avant || !DERNIER.plans) return null;
    return apparier(avant, DERNIER.plans);
  }
  /* Le résumé d'une liste d'événements, dans les mots du journal : une ligne
     par valeur d'arrivée — « 20 passés à « Validé » », « 3 passés à « Non
     renseigné » » —, les reculs, les changements d'indice, les nouveaux, les
     disparus. Le journal, la bulle du graphique et la vue d'ensemble le
     lisent : une même semaine s'y dit avec les mêmes mots, dans
     le même ordre, avec les mêmes nombres. Chaque événement compte une
     fois : un plan réémis sous « changement d'indice », même s'il change
     d'état au passage (sa ligne du journal montre l'état avant et après) ;
     un recul sous « reculs », pas parmi les « passés à … ». */
  function lignesResume(evts) {
    var parArrivee = {}, arrivees = [], reculs = [], indice = [], nouveaux = [], disparus = [];
    evts.forEach(function (e) {
      if (e.type === 'nouveau') { nouveaux.push(e.ref); return; }
      if (e.type === 'disparu') { disparus.push(e.ref); return; }
      if (estReemission(e)) { indice.push(e.ref); return; }
      if (estRecul(e)) { reculs.push(e.ref); return; }
      if (e.type !== 'change' || !e.cApres) return;
      if (!parArrivee[e.cApres]) {
        parArrivee[e.cApres] = { cle: e.cApres, libelle: e.vApres, famille: e.apres, refs: [] };
        arrivees.push(parArrivee[e.cApres]);
      }
      parArrivee[e.cApres].refs.push(e.ref);
    });
    var lignes = arrivees.map(function (v) {
      return { cle: v.cle, famille: v.famille, libelle: v.libelle, refs: v.refs, n: v.refs.length, passage: true,
               un: 'passé à « ' + v.libelle + ' »', des: 'passés à « ' + v.libelle + ' »' };
    });
    if (reculs.length) lignes.push({ cle: 'reculs', refs: reculs, n: reculs.length, un: 'recul', des: 'reculs' });
    if (indice.length) lignes.push({ cle: 'indice', refs: indice, n: indice.length, un: 'changement d\u2019indice', des: 'changements d\u2019indice' });
    if (nouveaux.length) lignes.push({ cle: 'nouveaux', refs: nouveaux, n: nouveaux.length, un: 'nouveau', des: 'nouveaux' });
    if (disparus.length) lignes.push({ cle: 'disparus', refs: disparus, n: disparus.length, un: 'disparu', des: 'disparus' });
    return lignes;
  }
  /* La clé d'une sorte de ligne, la même d'une semaine à l'autre : c'est elle
     qui donne sa colonne dans le journal. */
  function cleResume(l) { return l.passage ? 'v:' + l.cle : l.cle; }
  /* L'ordre des lignes, le même partout — comparatif, journal, bulle — : de
     la sorte la plus fréquente à la plus rare, sur tout l'historique du
     périmètre (débrief 14 : « de gauche à droite, de là où il y en a le
     plus ») — le nombre de semaines où elle apparaît, puis le nombre de
     plans. Le journal range ainsi ses colonnes pleines à gauche et les
     rares à droite ; une ligne qui n'a qu'une case ne coupe plus le tableau
     en deux. À égalité, l'ordre des familles : les passages (terminé, en
     cours, à faire, non renseigné), les reculs, les changements d'indice,
     les nouveaux, les disparus. */
  var ORDRE_RESUME = {};
  var RANG_BASE_LIGNE = { reculs: 4, indice: 5, nouveaux: 6, disparus: 7 };
  function rangBaseLigne(l) { return l.passage ? RANG_FAMILLE[l.famille] : RANG_BASE_LIGNE[l.cle]; }
  function frequencesResume() {
    var cle = (vue && vue.perimetre) || '';
    if (ORDRE_RESUME[cle]) return ORDRE_RESUME[cle];
    var f = {};
    journalAffiche().forEach(function (sem) {
      lignesResume(sem.evenements).forEach(function (l) {
        var k = cleResume(l);
        f[k] = f[k] || { semaines: 0, plans: 0 };
        f[k].semaines++;
        f[k].plans += l.n;
      });
    });
    return (ORDRE_RESUME[cle] = f);
  }
  function comparerLignes(la, lb) {
    var f = frequencesResume(), fa = f[cleResume(la)] || { semaines: 0, plans: 0 }, fb = f[cleResume(lb)] || { semaines: 0, plans: 0 };
    return (fb.semaines - fa.semaines) || (fb.plans - fa.plans) || (rangBaseLigne(la) - rangBaseLigne(lb)) ||
      COMPARER_REF(la.libelle || la.cle, lb.libelle || lb.cle);
  }
  function resumeEvenements(evts) {
    return lignesResume(evts).sort(comparerLignes);
  }
  /* La pastille d'une ligne du résumé : la couleur de la valeur, le rouge
     des reculs, le violet de l'indice, rien pour les nouveaux et les
     disparus. */
  function pastilleResume(l) {
    if (l.passage) return pastilleValeur(l.cle, l.famille);
    if (l.cle === 'reculs') return '\x3Cspan class="pastille recul">\x3C/span>';
    if (l.cle === 'nouveaux') return '\x3Cspan class="pastille nouveau">\x3C/span>';
    if (l.cle === 'disparus') return '\x3Cspan class="pastille disparu">\x3C/span>';
    return pastilleDe(l.cle === 'indice' ? 'indice' : 'sans');
  }
  /* Ce qui a changé au dernier relevé, restreint au périmètre, résumé comme
     une semaine du journal : la colonne « Depuis le relevé précédent » de la
     vue d'ensemble. (La bande du même nom sous la barre est retirée au
     débrief 15 : la courbe et le journal le disent.) */
  function comparatif() {
    if (!EVENEMENTS_IMPORT) return null;
    var evts = EVENEMENTS_IMPORT.filter(dansPerimetreEvt);
    return {
      lignes: resumeEvenements(evts),
      reemissions: evts.filter(estReemission).map(function (e) { return { ref: e.ref, ancienne: e.ancienne, type: e.type }; }),
      reculs: evts.filter(estRecul).map(function (e) { return { ref: e.ref, avant: e.vAvant, apres: e.vApres }; })
    };
  }

  /* ============================================================
     RAPPROCHEMENT AVEC UNE SECONDE BASE
     Une autre base suit les mêmes plans sous une autre structure : d'autres
     intitulés, d'autres conventions d'écriture. La source décrit la
     correspondance — { nom, cleReference, lignes, colonnes } — et la page
     rapproche les deux par racine + solution, pour qu'un plan réémis d'un
     côté reste le même plan. Un plan présent dans la seconde base est un
     plan créé, donc terminé : le verdict croise cette présence avec
     l'avancement d'ici (classer()) — d'accord quand les deux disent terminé,
     à vérifier quand l'un le dit et pas l'autre. Sans description dans la
     source, il n'y a rien à rapprocher et la section n'existe pas.
     ============================================================ */
  /* Les lots du rapprochement, dans l'ordre de lecture : d'abord ce qui va,
     puis ce qui diffère, puis ce qui manque de chaque côté, puis ce qui
     attend. « § » se remplace par le nom de la seconde base. `segment` est
     la catégorie de la pastille (et de la part de l'anneau), `atterrit` la
     base où le tableau bascule : ce qui n'existe que d'un côté y emmène, le
     reste laisse l'interrupteur où il est. */
  var LOTS_RAPPROCHEMENT = [
    { cle: 'accord',   libelle: 'validés et dans §',        segment: 'accord',   atterrit: '' },
    { cle: 'emission', libelle: 'autre indice',              segment: 'emission', atterrit: '' },
    { cle: 'avance',   libelle: 'dans §, pas validés ici',  segment: 'avance',   atterrit: '' },
    { cle: 'manque',   libelle: 'validés, absents de §',    segment: 'manque',   atterrit: 'ici' },
    { cle: 'attente',  libelle: 'pas encore dans §',         segment: 'attente',  atterrit: 'ici' },
    { cle: 'seul',     libelle: 'seulement dans §',          segment: 'seul',     atterrit: 'la' }
  ];
  /* Les lots de plans d'ici : une seule catégorie par plan (parPlan), la clé
     du lot ; « seul » compte des lignes de là. */
  var LOTS_PLANS = ['accord', 'emission', 'avance', 'manque', 'attente'];
  function compteLotRapp(cle) {
    if (!RAPPROCHEMENT) return 0;
    if (cle === 'seul') return RAPPROCHEMENT.seul.length;
    var n = 0;
    Object.keys(RAPPROCHEMENT.parPlan).forEach(function (ref) { if (RAPPROCHEMENT.parPlan[ref] === cle) n++; });
    return n;
  }
  function nomSeconde() {
    return String((SRC && SRC.rapprochement && SRC.rapprochement.nom) || 'la seconde base');
  }

  /* La référence d'une ligne de la seconde base : une colonne qui la porte
     entière, ou plusieurs qu'on recompose — NAME (racine), SOL. (solution) et
     Cust.V (indice) dans SEE. Un extract Excel rend volontiers « 1 » pour
     « 001 » : la solution se remet sur trois chiffres, l'indice en capitale. */
  function refDeLigne(rap, l) {
    var cle = rap.cleReference;
    if (!Array.isArray(cle)) return String(l[cle] == null ? '' : l[cle]).trim();
    var parts = cle.map(function (k) { return String(l[k] == null ? '' : l[k]).trim(); });
    if (parts.length === 3) {
      if (/^\d{1,3}$/.test(parts[1])) parts[1] = ('00' + parts[1]).slice(-3);
      parts[2] = parts[2].toUpperCase();
    }
    /* Recomposer, c'est aussi décaler le A : SEE l'écrit un cran trop tôt
       — trois chiffres avant lui au lieu de quatre — et c'est la référence
       de GATES qu'on montre. */
    return remettreLeA(parts.join('').toUpperCase());
  }
  /* Les cases à cocher d'un extract : TRUE / FALSE, VRAI / FAUX, oui / non… */
  var VRAI = /^(true|vrai|oui|yes|x|✓|☑)$/i, FAUX = /^(false|faux|non|no|☐)$/i;
  function estBooleen(v) { var t = String(v == null ? '' : v).trim(); return VRAI.test(t) || FAUX.test(t); }
  function estVrai(v) { return VRAI.test(String(v == null ? '' : v).trim()); }
  /**
   * Rapproche `plans` (ceux du périmètre) des lignes de la seconde base.
   * Rend null sans description exploitable. Sinon :
   *   accord   [plan]                  — terminé ici, présent là sous le même indice ;
   *   emission [{ plan, ref_la }]      — terminé ici, présent là sous un autre indice ;
   *   avance   [plan]                  — présent là, mais pas terminé ici ;
   *   manque   [plan]                  — terminé ici, absent de là ;
   *   attente  [plan]                  — pas terminé ici, absent de là : rien d'anormal ;
   *   seul     [ligne]                 — là, et aucun plan du contrat sous cette racine ;
   *   parPlan  { référence: lot }      — un seul lot par plan ;
   *   lignes   [{ ligne, ref, ud, i, cat, plan }] — chaque ligne de là avec
   *            son verdict (le lot de son plan, ou seul / hors / vide).
   *   nbPlans, nbLignes, nbTermines, total (ce qu'il y a à vérifier).
   */
  function rapprocher(rap, plans) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) return null;
    /* Les lignes de la seconde base par racine + solution : une ligne dont
       la référence est illisible garde sa chaîne entière comme racine. */
    var parRacine = Object.create(null), lignes = [];
    rap.lignes.forEach(function (l, i) {
      if (!l || typeof l !== 'object') return;
      var ref = refDeLigne(rap, l), ud = analyserUD(ref);
      var e = { ligne: l, ref: ref, ud: ud, i: i, cat: 'vide', plan: null };
      lignes.push(e);
      if (!ud.racine) return;
      var cle = cleAppariement(ud);

     plutôt que de deviner les largeurs à l'avance. */
  /* Les segments vides ne sont pas rendus : on releve les coupures reelles
     dans le DOM plutot que de les recalculer a partir des pourcentages. */
  /* Sous une barre, les filets prolongent ses coupures et chaque bouton se
     centre sous son segment — la barre d'avancement et celle du rapprochement
     partagent ce dessin. Les centres se lisent sur les rectangles réels des
     segments (data-cle), donc les largeurs minimales et le blanc avant
     « seulement là » sont honorés ; un bouton dont le compte vaut 0 n'a pas
     de segment : il se cale au bord droit du précédent. Puis on pousse vers
     la droite ce qui se chevauche, et on recale vers la gauche si le dernier
     sort du cadre. Sous 680 px, les boutons passent en grille : rien à poser. */
  function alignerSousBarre(idBarre, idFilets, idEtats) {
    var barre = $(idBarre), filets = $(idFilets), zone = $(idEtats);
    if (!barre || !zone) return;
    var segs = Array.prototype.slice.call(barre.querySelectorAll('span[data-cle]'));
    var boutons = Array.prototype.slice.call(zone.querySelectorAll('button[data-cle]'));
    if (filets) filets.innerHTML = '';
    zone.style.gridTemplateColumns = '';
    if (!boutons.length) return;
    if (window.matchMedia('(max-width: 680px)').matches || barre.offsetParent === null) {
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    var base = barre.getBoundingClientRect();
    var largeur = zone.getBoundingClientRect().width;
    if (!largeur || !base.width) return;
    /* Quand les boutons, mis bout à bout, ne tiennent plus dans la rangée,
       les pousser ne suffit plus : ils passent en grille, comme sur un petit
       écran, plutôt que de se recouvrir. */
    zone.classList.remove('en-legende');         // mesurer les boutons libres, pas étirés par la légende
    /* Plus de quatre valeurs, ou un segment trop fin pour porter son
       étiquette — deux plans sur six cents : aligner chaque chiffre sous son
       segment ne dit plus rien, les étiquettes se poussent et les filets se
       perdent. La page passe alors en légende : une carte par valeur, dans
       l'ordre de la barre, et le survol relie la carte à son segment. */
    var etroit = segs.some(function (seg) { return seg.getBoundingClientRect().width < 36; });
    var besoin = boutons.reduce(function (t, b) { return t + b.offsetWidth; }, 0) + 4 * (boutons.length - 1);
    /* Une sélection vide (« zzzz » cherché, une tuile contraire) : plus un
       seul segment sous lequel caler les chiffres — ils s'empilaient tous au
       bord gauche, l'un sur l'autre. Ils passent en légende, eux aussi. */
    if (boutons.length > 4 || etroit || besoin > largeur || !segs.length) {
      zone.classList.add('en-legende');
      boutons.forEach(function (b) { b.style.left = ''; });
      /* Débrief 19 : toutes les cartes sur une seule ligne — les sept valeurs
         de GATES tiennent dans la largeur de la page. Débrief 27 (B10) : tant
         que chacune garde 150 px, de quoi écrire PWD_IN_PROGRESS en entier ;
         au-delà, des rangées équilibrées (4 + 3 à 1024 px, plutôt que 5 + 2),
         et un code trop long passe à la ligne après un « _ », jamais coupé. */
      var n = boutons.length;
      var parLigne = Math.max(1, Math.min(n, Math.floor((largeur + 8) / (150 + 8))));
      var rangs = Math.ceil(n / parLigne);
      zone.style.gridTemplateColumns = 'repeat(' + Math.ceil(n / rangs) + ', minmax(0, 1fr))';
      return;
    }
    /* Un filet par coupure — sauf après un segment trop étroit pour que le
       trait dise encore quelque chose : entre trois plans et cinq, il ne
       ferait que hachurer les nombres. */
    if (filets && segs.length > 1) {
      filets.innerHTML = segs.slice(0, -1).map(function (seg) {
        var r = seg.getBoundingClientRect();
        if (r.width < 14) return '';
        return '\x3Ci style="left:' + (r.right - base.left + 1).toFixed(1) + 'px">\x3C/i>';
      }).join('');
    }
    var centreDe = {}, bordDe = {};
    segs.forEach(function (seg) {
      var r = seg.getBoundingClientRect();
      centreDe[seg.dataset.cle] = (r.left + r.right) / 2 - base.left;
      bordDe[seg.dataset.cle] = r.right - base.left;
    });
    var bord = 0;
    var cibles = boutons.map(function (b) {
      var c = centreDe[b.dataset.cle];
      if (c === undefined) return bord;
      bord = bordDe[b.dataset.cle];
      return c;
    });
    var gauches = boutons.map(function (b, i) { return cibles[i] - b.offsetWidth / 2; });
    /* Le premier se cale au bord AVANT qu'on pousse les suivants : poussés
       depuis une position hors du cadre, puis le premier ramené à 0, ils le
       recouvraient. */
    gauches[0] = Math.max(0, gauches[0]);
    for (var i = 1; i < boutons.length; i++) {
      var mini = gauches[i - 1] + boutons[i - 1].offsetWidth + 4;
      if (gauches[i] < mini) gauches[i] = mini;
    }
    var debord = gauches[boutons.length - 1] + boutons[boutons.length - 1].offsetWidth - largeur;
    for (var k = boutons.length - 1; k >= 0 && debord > 0; k--) {
      gauches[k] -= debord;
      debord = k > 0 ? Math.max(0, (gauches[k - 1] + boutons[k - 1].offsetWidth + 4) - gauches[k]) : 0;
    }
    boutons.forEach(function (b, i) { b.style.left = Math.max(0, gauches[i]).toFixed(1) + 'px'; });
  }

  /* Une part lisible même petite : « 0,3 % » plutôt que « 0 % ». */
  function partDite(n, total) {
    if (!n || !total) return '0\u202f%';

  function rendreAvancement(liste) {

    var parValeur = {};

       19) : sous BASE/OPTION, une tuile « TO_TREAT 0 » ne filtrerait rien.
       Les autres filtres (une tuile pressée, la recherche) ne retirent
       aucune tuile : on passe d'une valeur à l'autre d'un clic ; la tuile
       pressée reste toujours. */
    var dansPortee = {};
    PLANS.forEach(function (p) {
      if (!dansPerimetre(p)) return;
      if (vue.groupe && String(valeurDim(p, vue.groupe.dim) || '\u2014') !== vue.groupe.val) return;
      dansPortee[cleValeur(p[CLE_SUIVIE])] = true;
    });
    $('etats').innerHTML = VALEURS_COLONNE.filter(function (v) { return dansPortee[v.cle] || vue.etat === v.cle; }).map(function (v) {
      var pastille = v.hachure
        ? '\x3Cspan class="pastille hachure">\x3C/span>'

        '" style="--teinte:' + v.teinte +
        '" aria-pressed="' + actif + '" title="' + (actif ? 'Retirer le filtre' : 'N\u2019afficher que ces plans') + '">' +
        '\x3Cspan class="etat-haut">' + pastille + '\x3Cspan class="libelle">' + ech(v.libelle).replace(/_/g, '_\x3Cwbr>') + '\x3C/span>\x3C/span>' +
        '\x3Cspan class="etat-n">' + nb(parValeur[v.cle] || 0) + '\x3C/span>' +
        '\x3Cspan class="etat-pct">' + partDite(parValeur[v.cle] || 0, c.total) + '\x3C/span>\x3C/button>';

  }

  /* ============================================================ GRAPHIQUE */

     du bloc « Avancement FWD par… » est sélectionnée. Un filtre libre (recherche,
     colonne) ne peut pas s'appliquer rétroactivement à des comptes déjà archivés :
     dans ce cas le graphique reste sur l'ensemble, et le dit.
     Sous un périmètre, les comptes archivés ne servent plus : la série est
     dérivée, relevé par relevé, de la carte plan par plan — les plans de la

  /* La série d'une portée, relevé après relevé : le total et les terminés
     d'un périmètre (« » : tous les plans) et, s'il est donné, d'un groupe.

     dérivent de la carte plan par plan de chaque relevé — un relevé sans

        var g = groupe ? (c.groupes[groupe.val] || { total: 0, termine: 0 }) : c;

         mois de création » n'en est pas (débrief 15 : la courbe d'un mois

      pts = RELEVES.map(function (r) {

        var g = gs && gs[groupe.val];

    }

  }
  function groupeAffiche() {
    return (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) ? vue.groupe : null;
  }
  function serieAffichee() {
    var groupe = groupeAffiche();

    var serie = serieDe(per, groupe), pts = serie.pts, ecartes = serie.ecartes;

  /* La courbe d'une valeur (débrief 18) : relevé après relevé, combien de
     plans de la portée du graphique — son périmètre, le groupe choisi —
     portent cette valeur. Tirée de la carte plan par plan de chaque relevé ;
     un relevé archivé sans carte est écarté, et la note le dit. Les comptes

  /* La rangée du graphique : les valeurs de la colonne, dans l'ordre des

     sa pilule qui tient ce rôle ; sinon un premier bouton « Validés ». Une
     valeur qu'aucun relevé de la portée n'a portée n'a pas de pilule
     (débrief 19). Sans relevé gardé plan par plan, ou sans autre courbe que
     celle des validés, la rangée s'efface. */
  /* Les valeurs « d'hier » de la courbe : portées par des relevés, plus par
     aucun plan aujourd'hui — « TO_TREAT » tombé à zéro est justement ce

     couleur de leur mot (couleurConnue). Refaites à chaque rangée. */

  function rendreFiltreValeurGraphe() {

               titre: defaut ? 'Les plans « ' + v.libelle + ' », relevé après relevé, avec le rythme tenu, la fin estimée et l\u2019échéance'
                    : !aujourdhui ? 'Plus aucun plan n\u2019est « ' + v.libelle + ' » ; combien l\u2019étaient, relevé après relevé'

    });

    items = items.filter(function (x) { return x.cle === ''; }).concat(items.filter(function (x) { return x.cle !== ''; }));
    /* Aucune valeur ne veut dire « validé » — le concept harnais avant son

       de pilule pour elle. La courbe des validés est celle qu'on voit quand
       aucune n'est pressée, et un second clic sur la pilule pressée y
       revient. Plusieurs valeurs « validé » : un premier bouton les réunit. */
    var premier = finies.length > 1 ? { libelle: 'Validés', pastille: pastilleDe('termine'),
      titre: 'Les plans validés, relevé après relevé, avec le rythme tenu, la fin estimée et l\u2019échéance' } : null;
    if (!finies.length) items.forEach(function (x) { x.titre += ' \u2014 un second clic revient à la courbe des validés'; });

    z.innerHTML = autres ? boutonsPastilles('valeur-graphe', vue.valeurGraphe, items, premier) : '';

  /* La couleur d'une courbe de valeur : celle de sa pastille ; le gris de

  function couleurCourbe(v) { return !v ? 'var(--fait)' : v.hachure ? 'var(--encre-3)' : v.couleur; }

  /* Un groupe du bloc, nommé comme partout : sa dimension et sa valeur —
     « ATA 24 », « Séquence 600 ». */
  function nomGroupe(g) {
    return ((TITRE_DIM[g.dim] || '').replace(/ \(.*\)$/, '') + ' ' + libelleGroupe(g.val)).trim();
  }

  /* Une échelle qui se lit : quatre traits au plus, à des valeurs rondes —

  function pasDEchelle(total) {
    var candidats = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
    for (var i = 0; i < candidats.length; i++) if (total / candidats[i] <= 4.5) return candidats[i];

  /* L et la hauteur du tracé se refont à chaque dessin, à la largeur du

  var L = 980, mG = 36, mD = 72, plotH = 176, ecart = 16, bandeH = 30, mBas = 34;
  var mHaut = 44, H = mHaut + plotH + ecart + bandeH + mBas;
  var HAUTEUR_ETIQUETTE = 23;   // un niveau de marqueurs (rayon 10) et son interligne
  var LARGEUR = L - mG - mD;
  var MAX_IDX = 104;                       // deux ans, ou un an au-delà d'aujourd'hui : voir chargerSource()
  var derniereAnalyse = null;
  /* Largeur d'un mot du graphique (« fin … », « manque … », « aujourd'hui »),
     en 11 px — la police des mots du dessin (svg.graphe text). Mesurée, pas
     devinée : sur un cadre étroit, chaque pixel décide si le mot tient à
     côté d'un trait. Tant que la police se charge encore, une marge de 8 %
     (la police de secours n'a pas tout à fait la même chasse) ; à défaut de
     mesure, 0,6 em par signe, plus large que tout. */
  var mesureMots = null, policeAttendue = false, redessinPolices = false;
  /* Une police est-elle là ? Demandé une fois par police, jusqu'à l'arrivée
     des polices (débrief 23) : document.fonts.check() se demandait pour
     chaque mot du dessin. */
  var POLICES_VERIFIEES = {};
  function largeurMot(mot, gras) {
    try { if (!mesureMots) mesureMots = document.createElement('canvas').getContext('2d'); } catch (e) { mesureMots = null; }
    if (!mesureMots) return String(mot).length * 6.6;
    var police = (gras ? '500 ' : '') + '11px "IBM Plex Sans", sans-serif';
    var chargee = POLICES_VERIFIEES[police];
    if (chargee === undefined) {
      try { chargee = !document.fonts || document.fonts.check(police); } catch (e) { chargee = false; }
      POLICES_VERIFIEES[police] = chargee;
    }
    if (!chargee) policeAttendue = true;
    /* La largeur d'un même mot, dans la même police, se mesure une fois ;
       l'arrivée des polices oublie tout (POLICES_VERIFIEES aussi). */
    var cle = police + '\u0001' + chargee + '\u0001' + mot, w = LARGEURS_MOTS[cle];
    if (w !== undefined) return w;
    mesureMots.font = police;
    w = Math.ceil(mesureMots.measureText(String(mot)).width * (chargee ? 1 : 1.08)) + 1;
    if (++N_LARGEURS_MOTS > 2000) { LARGEURS_MOTS = {}; N_LARGEURS_MOTS = 1; }
    LARGEURS_MOTS[cle] = w;
    return w;
  }
  var LARGEURS_MOTS = {}, N_LARGEURS_MOTS = 0;

  /* Débrief 20 : le graphique se dessinait sur 980 unités puis se laissait
     réduire — ses mots tombaient à 3,5 px sur un téléphone, à 7 px dans une
     demi-fenêtre au bureau. Il se dessine désormais à la largeur réelle de
     son cadre, une unité pour un pixel : les polices gardent leur taille.
     Le redessin à chaque changement de taille de la fenêtre existait déjà.
     La hauteur du tracé suit la largeur, dans des bornes : sur un
     téléphone il ne devient pas plus haut que large, sur un grand écran il
     garde à peu près la hauteur qu'il avait une fois agrandi. */
  /* Un rendu complet mesure le cadre en tête, avant d'écrire quoi que ce
     soit dans la page (rendreEtat) : lue au milieu, la largeur forçait une
     mise en page de tout ce qui venait d'être écrit (débrief 23). */
  var GRAPHE_MESURE = false;
  function mesurerGraphique() {
    var w = $('zone-graphe').clientWidth;
    L = w > 0 ? Math.max(280, Math.round(w)) : 980;
    LARGEUR = L - mG - mD;
    plotH = Math.min(200, Math.max(120, Math.round(L * 0.27)));
  }

  function bornerFenetre() {
    var f = vue.fen;
    f.span = Math.max(8, Math.min(f.span, MAX_IDX + 1));
    f.debut = Math.max(0, Math.min(f.debut, MAX_IDX - f.span + 1));
  }

  function rendreGraphique(liste) {
    bornerFenetre();
    if (!GRAPHE_MESURE) mesurerGraphique();
    policeAttendue = false;
    var vg = rendreFiltreValeurGraphe();
    var vueSerie = serieAffichee();
    var pts = vueSerie.pts;
    var dernier = pts[pts.length - 1];
    var total = Math.max(dernier.total, 1);
    var atteint = dernier.termine;
    var restants = total - atteint;
    var ryt = rythmes(pts);
    var vitesse = ryt ? ryt.central : 0;
    /* Tout validé : rien à projeter. semaineFin rendrait la semaine en
       cours, et la courbe dirait « fin S40 » sur un groupe déjà fini. */
    var projIdx = restants > 0 ? semaineFin(atteint, total, vitesse) : null;
    /* Sous une valeur choisie (débrief 18), la courbe la suit : son compte,
       relevé après relevé, à sa couleur, sur une échelle à sa mesure. Le
       rythme, la fin estimée et l'échéance restent ceux des validés : ils
       ne se dessinent pas sur elle. */
    var vVal = vg ? (valeurDeCle(vg) || HIER_GRAPHE[vg] || null) : null;
    var serieV = vVal ? serieValeur(vg) : null;
    var trace = vVal ? serieV.pts : pts;
    var dernierT = trace[trace.length - 1];
    var coul = couleurCourbe(vVal);
    var haut = total;
    if (vVal) {
      var maxV = 1, maxT = 1;
      trace.forEach(function (pt) { maxV = Math.max(maxV, pt.termine); maxT = Math.max(maxT, pt.total); });
      var pasV = pasDEchelle(maxV);
      haut = Math.max(maxV, Math.min(maxT, Math.ceil(maxV / pasV) * pasV));
    }

    /* Combien de relevés, et de quand à quand : les mêmes mots que le pied. */
    /* L'extract du jour, pas encore archivé, est le dernier point sans être
       un relevé : il se dit à part. */
    var n1 = trace.length - (EXTRAIT_EN_PLUS ? 1 : 0);
    var bornes = n1 > 1 ? ', de ' + semaineDite(trace[0].i) + ' à ' + semaineDite(trace[n1 - 1].i)
                        : (n1 ? ', ' + semaineDite(trace[0].i) : '');
    var releves = (n1 ? n1 + (n1 > 1 ? ' relevés' : ' relevé') + bornes : '') +
      (EXTRAIT_EN_PLUS ? (n1 ? ', puis ' : '') + 'l’extract du jour en ' + semaineDite(trace[trace.length - 1].i) + ', pas encore archivé' : '');
    var note = vueSerie.portee
      ? 'Historique · ' + vueSerie.portee + ' · ' + releves +
        (vueSerie.partiel ? ' · les autres filtres ne s’appliquent pas à l’historique' : '')
      : (vueSerie.partiel
          ? 'Historique de l’ensemble des plans : un relevé archivé ne se refiltre pas.'
          : releves);
    var ecartes = vVal ? serieV.ecartes : vueSerie.ecartes;
    if (ecartes) {
      note += ' · ' + ecartes + ' relevé' + (ecartes > 1 ? 's' : '') +
        ' sans détail plan par plan, ' + (vVal ? 'hors de cette courbe' : 'hors périmètre');
    }
    if (vVal) note = 'Plans « ' + vVal.libelle + ' » · ' + note;
    if (RELEVES_IDENTIQUES.length && JOURNAL.length) {
      note += ' · ' + RELEVES_IDENTIQUES.map(function (i) { return semaineDite(i); }).join(', ') +
        /* Un constat, pas un reproche : la page est lue par tous (débrief 17). */
        ' : aucun changement depuis le relevé d\u2019avant, plan par plan';
    }
    $('note-graphe').textContent = note;
    var prochain = prochainJalon();
    /* L'échéance se lit sur la portée du graphique : son périmètre, et le
       groupe choisi dans le bloc s'il y en a un — la même formule que la
       fiche et le bloc (bilanEcheance). */
    var bilan = prochain ? bilanEcheance(prochain, groupeAffiche()) : null;
    var depart = semaineDepart();

    var d0 = vue.fen.debut, span = vue.fen.span, d1 = d0 + span - 1;
    var pasX = LARGEUR / (span - 1);
    var x = function (i) { return mG + pasX * (i - d0); };

    /* Les jalons se marquent d'un numéro, 1 à 5, tous sur une même rangée
       en tête du graphique — jamais étagés, jamais de texte collé : la
       légende, dessous, les nomme. Deux jalons trop proches (deux semaines
       voisines) se serrent l'un contre l'autre sur la rangée ; le trait
       pointillé part toujours de la vraie semaine, et un court trait le
       relie au numéro quand celui-ci a dû s'écarter. */
    var ESPACE_MARQUEURS = 23;   // un diamètre de 20 px et un jour de 3 px
    var places = [];
    var xAuj = null;
    if (AUJ >= d0 && AUJ <= d1) xAuj = mG + pasX * (AUJ - d0);
    var dernierCx = -Infinity;
    jalons.map(function (j, idx) { return { j: j, idx: idx }; })
      .filter(function (o) { return o.j.i >= d0 && o.j.i <= d1; })
      .sort(function (a, b) { return a.j.i - b.j.i || a.idx - b.idx; })
      .forEach(function (o) {
        var jx = x(o.j.i), cx = Math.max(jx, dernierCx + ESPACE_MARQUEURS);
        places.push({ j: o.j, idx: o.idx, jx: jx, cx: cx, niveau: 0 });
        dernierCx = cx;
      });
    /* Sur un cadre étroit, la rangée poussée vers la droite sortirait du
       tracé et toucherait « 640 plans » : elle se resserre alors depuis le
       bord droit, chaque numéro relié à sa semaine par son court trait. */
    for (var q0 = places.length - 1; q0 >= 0; q0--) {
      var borneCx = q0 === places.length - 1 ? L - mD - 10 : places[q0 + 1].cx - ESPACE_MARQUEURS;
      if (places[q0].cx > borneCx) places[q0].cx = borneCx;
    }
    /* Le mot « aujourd'hui » s'écrit à gauche de son trait, dans la même
       rangée ; s'il y croiserait un numéro, il passe au-dessus. Quand le
       trait est trop près du bord gauche pour lui, il s'écrit à droite. */
    var niveauAuj = 0;
    var motAuj = AUJ === semaineDAujourdhui() ? 'aujourd’hui' : 'dernier relevé';
    var aujADroite = false;
    if (xAuj !== null) {
      var wAuj = largeurMot(motAuj) + 6;
      aujADroite = xAuj - wAuj < 2;
      var motG = aujADroite ? xAuj + 4 : xAuj - wAuj, motD = aujADroite ? xAuj + wAuj : xAuj - 4;
      if (places.some(function (pl) { return pl.cx + 11 > motG && pl.cx - 11 < motD; })) niveauAuj = 1;
      places.push({ aujourdhui: true, jx: xAuj, niveau: niveauAuj });
    }
    mHaut = 26 + (1 + niveauAuj) * HAUTEUR_ETIQUETTE;
    H = mHaut + plotH + ecart + bandeH + mBas;

    var y = function (v) { return mHaut + plotH - (v / haut) * plotH; };
    var yBande = mHaut + plotH + ecart;
    var basTotal = yBande + bandeH;

    var s = ['\x3Csvg class="graphe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="' +
      (vVal ? ech('Plans « ' + vVal.libelle + ' », relevé après relevé') : 'Plans validés par semaine, historique et projection') + '">'];
    s.push('\x3Cdefs>\x3CclipPath id="zoneTracee">\x3Crect x="' + mG + '" y="' + (mHaut - 12) + '" width="' + LARGEUR + '" height="' + (plotH + 16) + '"/>\x3C/clipPath>\x3C/defs>');

    /* L'échelle se lit d'un coup d'œil : des valeurs rondes, quatre traits au
       plus, le plafond à part et nommé. */
    var pas = pasDEchelle(haut);
    for (var v = 0; v < haut; v += pas) {
      if (haut - v < pas * 0.5) continue;
      s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
      s.push('\x3Ctext class="grad" x="' + (mG - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + nb(v) + '\x3C/text>');
    }
    /* Sous une valeur, le haut de l'échelle n'est pas le total des plans :
       il se lit à gauche, comme les autres traits. */
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(haut).toFixed(1) + '" y2="' + y(haut).toFixed(1) + '" stroke="var(--filet' + (vVal ? '' : '-fort') + ')" stroke-width="1"/>');
    s.push(vVal ? '\x3Ctext class="grad" x="' + (mG - 8) + '" y="' + (y(haut) + 3.5).toFixed(1) + '" text-anchor="end">' + nb(haut) + '\x3C/text>'
                : '\x3Ctext class="grad" x="' + (L - mD + 8) + '" y="' + (y(total) + 3.5).toFixed(1) + '">' + nb(total) + ' plans\x3C/text>');

    // Tout ce qui peut sortir du cadre est decoupe a la zone tracee.
    s.push('\x3Cg clip-path="url(#zoneTracee)">');

    var visibles = trace.filter(function (pt) { return pt.i >= d0 - 2 && pt.i <= d1 + 2; });
    if (visibles.length === 1) {
      s.push('\x3Ccircle cx="' + x(visibles[0].i).toFixed(1) + '" cy="' + y(visibles[0].termine).toFixed(1) +
             '" r="4.5" fill="' + coul + '"/>');
    }
    if (visibles.length > 1) {
      var chemin = visibles.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.termine).toFixed(1); }).join(' ');
      var xa = x(visibles[0].i).toFixed(1), xb = x(visibles[visibles.length - 1].i).toFixed(1);
      s.push('\x3Cpath d="' + chemin + ' L' + xb + ' ' + y(0).toFixed(1) + ' L' + xa + ' ' + y(0).toFixed(1) + ' Z" fill="' + coul + '" opacity=".09"/>');
      /* « Non renseigné » n'a pas de couleur à lui, mais une texture : sa
         courbe se trace en tirets, comme sa hachure — son gris est celui
         d'« À traiter » (débrief 22). */
      s.push('\x3Cpath class="courbe" d="' + chemin + '" fill="none" stroke="' + coul + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' +
             (vVal && vVal.hachure ? ' stroke-dasharray="6 4"' : '') + '/>');
      /* Un point par relevé, plein, cerclé de la couleur du fond pour rester
         lisible sur la courbe ; discret quand les relevés se serrent. */
      var rayon = visibles.length > 40 ? 2 : 3;
      visibles.forEach(function (pt) {
        if (pt.i === dernierT.i) return;
        s.push('\x3Ccircle cx="' + x(pt.i).toFixed(1) + '" cy="' + y(pt.termine).toFixed(1) +
               '" r="' + rayon + '" fill="' + coul + '" stroke="var(--surface)" stroke-width="2"/>');
      });
    }

    var horsClip = [];
    var enRetard = !!bilan && bilan.enRetard;
    var requis = bilan && bilan.restants > 0 ? bilan.requis : null;
    /* La droite « requis » et le « manque » ne se tracent que sur la courbe
       des plans que l'échéance demande. Sur « Tout », un jalon BASE/OPTION
       ne se lit pas sur la courbe de tous les plans — la projection de tous
       passerait au-dessus d'un objectif qui n'est pas le sien : la légende
       donne son rythme requis et mène à son périmètre. */
    var surLaCourbe = !vVal && !!bilan && (bilan.domaine || '') === (vue.perimetre || '');
    /* Où poser un mot sur la courbe sans qu'un trait le barre (débrief 20 :
       « fin S8 » écrit en travers du pointillé du jalon 4). Parmi quelques
       places candidates, la première qui ne croise ni le trait d'un jalon
       ou du dernier relevé, ni un autre mot, ni une droite tracée, et qui
       tient dans le cadre ; à défaut, celle qui gêne le moins. Un trait de
       jalon pèse plus lourd qu'une droite : le fond du mot cache la droite,
       mais un jalon caché sous « fin … » se lirait « fin = jalon ». */
    var traitsX = places.map(function (pl) { return pl.jx; });
    var droites = [], boites = [];
    if (!vVal) boites.push({ g: L - mD + 6, d: L - mD + 10 + largeurMot(nb(total) + ' plans'), h: y(total) - 9, b: y(total) + 5 });
    function coupe(bx, sg) {
      var n = Math.max(20, Math.ceil(Math.max(Math.abs(sg[2] - sg[0]), Math.abs(sg[3] - sg[1])) / 3));
      for (var t = 0; t <= n; t++) {
        var px = sg[0] + (sg[2] - sg[0]) * t / n, py = sg[1] + (sg[3] - sg[1]) * t / n;
        if (px > bx.g && px < bx.d && py > bx.h && py < bx.b) return true;
      }
      return false;
    }
    function gene(bx, dMax, gMin) {
      var n = 0;
      traitsX.forEach(function (tx) { if (tx > bx.g - 1 && tx < bx.d + 1) n += 10; });
      droites.forEach(function (sg) { if (coupe(bx, sg)) n += 2; });
      boites.forEach(function (o) { if (seCoupent(bx, o)) n += 20; });
      if (bx.g < (gMin === undefined ? mG - 5 : gMin) || bx.d > dMax) n += 50;   // la boîte compte 3 px de fond de chaque côté
      return n;
    }
    /* Une candidate : ses lignes (une ou deux), son point d'ancrage et sa
       ligne de base. Sa boîte compte la marge du fond, 3 px tout autour.
       dMax et gMin : jusqu'où elle peut aller à droite et à gauche. */
    function noterMots(candidats, dMax, gMin) {
      candidats.forEach(function (c, k) {
        var w = Math.max.apply(null, c.lignes.map(function (l) { return largeurMot(l, c.gras); }));
        var g = c.ancre === 'end' ? c.x - w : c.ancre === 'middle' ? c.x - w / 2 : c.x;
        c.boite = { g: g - 3, d: g + w + 3, h: c.base - 11, b: c.base + 4 + 13 * (c.lignes.length - 1) };
        c.gene = gene(c.boite, dMax, gMin) + (c.malus || 0) + k * 0.01;
      });
      return candidats;
    }
    function placerMot(candidats, dMax, gMin) {
      var meilleur = null;
      noterMots(candidats, dMax, gMin).forEach(function (c) { if (!meilleur || c.gene < meilleur.gene) meilleur = c; });
      boites.push(meilleur.boite);
      return meilleur;
    }
    function seCoupent(a, o) { return o.g < a.d && a.g < o.d && o.h < a.b && a.h < o.b; }
    /* Sur deux lignes, un espace finit la première : le mot se lit d'un
       tenant (« manque 176 ») pour un lecteur d'écran. */
    function texteMot(c, attrs) {
      return '\x3Ctext class="grad' + (attrs.cls ? ' ' + attrs.cls : '') + '" x="' + c.x.toFixed(1) + '" y="' + c.base.toFixed(1) + '" text-anchor="' + c.ancre + '"' + (attrs.plus || '') + '>' +
        (attrs.titre || '') + (c.lignes.length > 1
          ? c.lignes.map(function (l, k) { return '\x3Ctspan x="' + c.x.toFixed(1) + '"' + (k ? ' dy="13"' : '') + '>' + l + (k < c.lignes.length - 1 ? ' ' : '') + '\x3C/tspan>'; }).join('')
          : c.lignes[0]) + '\x3C/text>';
    }
    /* Un fond plein sous le mot, pas seulement un liseré : le liseré
       épouse les lettres et laissait passer, entre les mots, le pointillé
       de la projection ou d'un jalon. Il déborde le mot de 3 px. */
    function fondMot(c) {
      return '\x3Crect class="fond-mot" x="' + c.boite.g.toFixed(1) + '" y="' + (c.boite.h + 1).toFixed(1) + '" width="' + (c.boite.d - c.boite.g).toFixed(1) +
        '" height="' + (c.boite.b - c.boite.h - 1).toFixed(1) + '" rx="3" fill="var(--surface)"/>';
    }

    /* Entre le dernier relevé et la semaine en cours, rien n'a été relevé :
       un trait plat, fin, avant que les projections ne partent d'aujourd'hui. */
    if (depart > AUJ && !vVal) {
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(depart).toFixed(1) + ' ' + y(atteint).toFixed(1) +
             '" fill="none" stroke="var(--encre-3)" stroke-width="1" stroke-dasharray="2 3"/>');
      /* D'où partent les projections, dit sous le point : la semaine en
         cours, que le dernier relevé n'a pas encore rattrapée. */
      if (depart >= d0 && depart <= d1) {
        /* Débrief 26 : près de zéro, « aujourd'hui » sous le point tombait
           sur le nom de la bande des semaines (« validés par semaine »),
           posé plus tard : sa ligne est réservée le temps de choisir, et le
           mot passe au-dessus du point s'il le faut. */
        var zoneBande = { g: mG - 11, d: L - 2, h: yBande - 14, b: yBande + 1 };
        boites.push(zoneBande);
        var cDep = placerMot([{ lignes: ['aujourd’hui'], x: x(depart) + 3, base: y(atteint) + 15, ancre: 'start' },
                              { lignes: ['aujourd’hui'], x: x(depart) + 3, base: y(atteint) - 8, ancre: 'start', malus: 1 }], L - 2);
        boites.splice(boites.indexOf(zoneBande), 1);
        if (cDep.gene >= 10 || cDep.base < y(atteint)) horsClip.push(fondMot(cDep));
        horsClip.push(texteMot(cDep, { cls: 'repere-depart' }));
      }
    }
    /* La droite « requis » monte de ce qui est terminé à ce que le jalon
       demande : tous les plans de la courbe quand le jalon vaut pour eux, les
       seuls plans de son périmètre sinon (sur « Tout », un jalon BASE/OPTION
       ne demande pas les PERSO). */
    var cible = bilan ? atteint + bilan.restants : total;
    if (requis !== null && surLaCourbe && prochain.i > depart) {
      var cr = enRetard ? 'var(--alerte)' : 'var(--fait)';
      s.push('\x3Cpath d="M' + x(depart).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(prochain.i).toFixed(1) + ' ' + y(cible).toFixed(1) + '" fill="none" stroke="' + cr + '" stroke-width="1.6"/>');
      s.push('\x3Ccircle cx="' + x(prochain.i).toFixed(1) + '" cy="' + y(cible).toFixed(1) + '" r="3.4" fill="' + cr + '"/>');
      droites.push([x(depart), y(atteint), x(prochain.i), y(cible)]);
    }

    var finVisible = false;
    if (projIdx !== null && !vVal) {
      var xP = x(projIdx), yP = y(total);
      s.push('\x3Cpath d="M' + x(depart).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + xP.toFixed(1) + ' ' + yP.toFixed(1) +
             '" fill="none" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/>');
      droites.push([x(depart), y(atteint), xP, yP]);
      if (projIdx >= d0 && projIdx <= d1) {
        /* Le bout de la projection : un losange plein, du vert du réalisé.
           Le petit cercle creux d'avant se confondait avec le numéro d'un
           jalon hors périmètre, posé sur son trait à la hauteur du total —
           on lisait « jalon 5 atteint ». */
        s.push('\x3Cpath class="fin-projection" d="M' + xP.toFixed(1) + ' ' + (yP - 4.5).toFixed(1) + ' L' + (xP + 4.5).toFixed(1) + ' ' + yP.toFixed(1) +
               ' L' + xP.toFixed(1) + ' ' + (yP + 4.5).toFixed(1) + ' L' + (xP - 4.5).toFixed(1) + ' ' + yP.toFixed(1) + ' Z" fill="var(--fait)" stroke="var(--surface)" stroke-width="1.2"/>');
        boites.push({ g: xP - 5, d: xP + 5, h: yP - 5, b: yP + 5 });
        finVisible = true;
      }
    }
    /* « fin S9 · mars 2027 » sous le plafond plutôt qu'au-dessus :
       au-dessus, il tombait dans la rangée des jalons. Centré sous le
       losange, à sa droite ou à sa gauche ; sinon sur deux lignes à sa
       droite (« fin S9 », « mars 2027 »), ou en court (« fin S9 ») : la
       semaine entière reste dans le survol de la légende. */
    var candFin = null;
    if (finVisible) {
      var parts = semaineDite(projIdx).split(' · ');
      var motLong = ['fin ' + semaineDite(projIdx)], court = ['fin ' + parts[0]];
      var deux = parts.length > 1 ? ['fin ' + parts[0], parts[1]] : motLong;
      candFin = [
        { lignes: motLong, x: xP, base: yP + 18, ancre: 'middle' },
        { lignes: motLong, x: xP + 7, base: yP + 18, ancre: 'start' },
        { lignes: motLong, x: xP - 7, base: yP + 18, ancre: 'end' },
        { lignes: deux, x: xP + 7, base: yP + 18, ancre: 'start', malus: 1 },
        { lignes: deux, x: xP - 7, base: yP + 18, ancre: 'end', malus: 1 },
        { lignes: court, x: xP + 7, base: yP + 18, ancre: 'start', malus: 3 },
        { lignes: court, x: xP - 7, base: yP + 18, ancre: 'end', malus: 3 },
        { lignes: court, x: xP, base: yP + 18, ancre: 'middle', malus: 3 },
        /* Une ligne plus bas, en dernier recours : sur un cadre serré (un an
           au téléphone), le jalon, « manque N » et la fin tiennent dans
           quelques pixels, et la rangée du haut n'a plus de place libre. */
        { lignes: court, x: xP - 7, base: yP + 31, ancre: 'end', malus: 6 },
        { lignes: court, x: xP + 7, base: yP + 31, ancre: 'start', malus: 6 },
        { lignes: court, x: xP, base: yP + 31, ancre: 'middle', malus: 6 }
      ];
    }
    /* Ce qui manquerait le jour de l'échéance, au rythme tenu — le même
       nombre que la fiche. Un trait sous le point visé, et le mot. */
    var candMq = null;
    if (bilan && surLaCourbe && enRetard && bilan.manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
      var xj = x(prochain.i), y1 = y(Math.max(0, cible - bilan.manque)), y2 = y(cible);
      s.push('\x3Cline x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
      /* Hors du cadre découpé, à droite du trait, ou à gauche quand la
         droite est prise — le bord du tracé, ou le trait d'un jalon voisin
         (débrief 20 : « manque 176 » barré par les jalons 2 et 3 sur un
         écran moyen). Un liseré de la couleur du fond le garde lisible sur
         les courbes ; un fond plein quand un trait le croise malgré tout. */
      var motManque = 'manque ' + nb(bilan.manque), baseManque = (y1 + y2) / 2 + 4;
      /* Sur un cadre étroit, s'il ne tient d'aucun côté, il passe sur deux
         lignes (« manque », « 176 »), plus étroites. */
      candMq = [{ lignes: [motManque], x: xj + 7, base: baseManque, ancre: 'start', gras: true },
                { lignes: [motManque], x: xj - 7, base: baseManque, ancre: 'end', gras: true },
                { lignes: ['manque', nb(bilan.manque)], x: xj + 7, base: baseManque - 6, ancre: 'start', gras: true, malus: 1 },
                { lignes: ['manque', nb(bilan.manque)], x: xj - 7, base: baseManque - 6, ancre: 'end', gras: true, malus: 1 }];
    }
    /* « fin … » et « manque N » se cherchent une place ensemble (relecture
       du débrief 20). Posés l'un après l'autre, le premier prenait la
