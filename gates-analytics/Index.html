<!-- Les données sont posées dans la page au moment où le modèle est évalué :
     pas d'écran de chargement, pas d'aller-retour. -->
<script>
  window.SUIVI_FWD_DONNEES = <?!= donneesJSONPourPage() ?>;

  /* Pont vers le classeur : la page demande le paquet d'un autre contrat sans
     se recharger. Le rappel reçoit le paquet, ou null si le classeur n'a pas
     répondu — la page garde alors le contrat courant et le dit. */
  window.SUIVI_FWD_API = {
    chargerContrat: function (id, cb) {
      try {
        google.script.run
          .withSuccessHandler(cb)
          .withFailureHandler(function (e) {
            console.error('Contrat non chargé :', e && e.message);
            cb(null);
          })
          .getDonneesPourClient(id);
      } catch (e) { cb(null); /* page ouverte hors classeur : sans conséquence */ }
    }
  };
</script>

<div class="page">

  <div class="filtres-actifs" id="filtres-actifs" hidden></div>

  <div class="bandeau-mode" id="bandeau-mode">

         propre historique. Le mécanisme reste, pour la batterie. -->
    <span class="segmente" id="mode-donnees" role="group" aria-label="Source des données" hidden>
      <button type="button" data-mode="reel" aria-pressed="true">Données réelles</button>
      <button type="button" data-mode="exemple" aria-pressed="false">Exemple</button>

    <span class="mot-mode" id="mot-mode"></span>
    <!-- Le message du classeur quand il n'a rien pu rendre — feuille vide,

    <span class="mot-mode alerte-source" id="alerte-source" role="alert" hidden></span>
    <span class="choix-contrat" id="choix-contrat" hidden>
      <label for="select-contrat">Contrat</label>

      <span class="attente" id="etat-contrat" role="status" aria-live="polite"></span>
    </span>
  </div>

  <!-- Le titre, seul, au centre : rien ne lui vole sa zone. Le contrat n'est

    </div>

    <div class="section-tete section-journal">

  <!-- Un seul tableau, deux bases : l'interrupteur GATES | SEE bascule de

  <!-- Le rapprochement, sous les tableaux : deux bases face à face. Deux
