      s.push('\x3Ctext class="jalon-texte" x="' + (jx + 14).toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="start" fill="' + couleur + '">' + ech(j.texte) + '\x3C/text>');
      s.push('\x3C/g>');
    });

    if (!prochain && d1 > AUJ + 2) {
      var xv = x(AUJ + Math.round((d1 - AUJ) / 2));
      s.push('\x3Ctext class="grad" x="' + xv.toFixed(1) + '" y="' + (mHaut + plotH * 0.86).toFixed(1) +
             '" text-anchor="middle">Aucun jalon \u00e0 venir' +
             (jalonsAVenirAilleurs() ? ' dans ce p\u00e9rim\u00e8tre' : '') + '\x3C/text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < pts.length; k5++) {
      var dSem = pts[k5].i - pts[k5 - 1].i;
      if (dSem <= 0) continue;
      var parSem = (pts[k5].termine - pts[k5 - 1].termine) / dSem;
      for (var w = pts[k5 - 1].i + 1; w <= pts[k5].i; w++) taux.push({ i: w, v: parSem });
    }
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, t.v); });
    var lb = Math.min(14, Math.max(2, pasX - 2));
    s.push('\x3Ctext class="grad" x="' + mG + '" y="' + (yBande - 3).toFixed(1) + '">terminés par semaine\x3C/text>');
    taux.forEach(function (t) {
      if (t.i < d0 || t.i > d1 || t.v <= 0) return;
      var h = Math.max(1.5, (t.v / maxSem) * bandeH);
      var rx = Math.min(2, lb / 2, h / 2);
      var xg = x(t.i) - lb / 2, yh = yBande + bandeH - h, yb = yBande + bandeH;
      s.push('\x3Cpath d="M' + xg.toFixed(1) + ' ' + yb.toFixed(1) + ' V' + (yh + rx).toFixed(1) +
             ' Q' + xg.toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + rx).toFixed(1) + ' ' + yh.toFixed(1) +
             ' H' + (xg + lb - rx).toFixed(1) + ' Q' + (xg + lb).toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + lb).toFixed(1) + ' ' + (yh + rx).toFixed(1) +
             ' V' + yb.toFixed(1) + ' Z" fill="var(--r4)"/>');
    });
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + basTotal.toFixed(1) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    var saut = Math.max(1, Math.ceil(span / 11));
    var anneeEcrite = '';
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && k3 !== AUJ) continue;
      // La semaine d'aujourd'hui s'écrit toujours ; une graduation régulière trop proche lui cède la place.
      if (k3 !== AUJ && Math.abs(k3 - AUJ) * pasX < 34) continue;
      var lib = etiquette(k3);
      var annee = lib.slice(0, 4), semaine = lib.slice(5);
      s.push('\x3Ctext class="grad" x="' + x(k3).toFixed(1) + '" y="' + (H - 19) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             semaine + '\x3C/text>');
      /* L'année n'encombre pas chaque graduation : une fois, puis à chaque
         changement. */
      if (annee !== anneeEcrite) {
        s.push('\x3Ctext class="annee" x="' + x(k3).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + annee + '\x3C/text>');
        anneeEcrite = annee;
      }
    }

    /* Le point d'une semaine se cherche par son indice, pas par sa position
       dans la série : une semaine sans relevé n'a pas de point. */
    var ptParI = {};
    pts.forEach(function (pt) { ptParI[pt.i] = pt; });
    for (var k4 = d0; k4 <= d1; k4++) {
      var ptK = ptParI[k4];
      /* Une bande par semaine : elle porte le survol (bulle) et son libellé
         pour les lecteurs d'écran. Ni bouton ni focus : rien ne se pose sur
         le graphique, et un clic n'y dessine plus de contour. */
      s.push('\x3Crect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (plotH + ecart + bandeH + 6).toFixed(1) + '" fill="transparent" role="img" data-i="' + k4 + '" ' +
             'aria-label="' + etiquette(k4) +
             (k4 > AUJ ? ' (à venir)' : (ptK ? ' : ' + ptK.termine + ' terminés' : ' : pas de relevé')) + '"/>');
    }

    s.push('\x3C/svg>');
    $('zone-graphe').innerHTML = s.join('');
    var svgGraphe = $('zone-graphe').querySelector('svg.graphe');
    svgGraphe.__ajusterJalons = function () { ajusterTextesJalons(svgGraphe, mG, L - mD, xAuj); };
    svgGraphe.__ajusterJalons();
    guetterLesPolices();

    var items = ['\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="var(--fait)" stroke-width="2.2"/>\x3C/svg>' +
      '\x3Cspan title="Nombre de plans pass\u00e9s \u00e0 100 %, cumul\u00e9 semaine apr\u00e8s semaine.">r\u00e9alis\u00e9\x3C/span>\x3C/span>'];
    if (ryt && restants > 0) {
      var explication = ryt.gagnes + ' plans termin\u00e9s en ' + ryt.semaines + ' semaines entre le premier ' +
        'et le dernier relev\u00e9, soit ' + vitesse.toFixed(1).replace('.', ',') + ' par semaine. ' +
        (projIdx !== null
          ? 'Les ' + restants + ' restants demandent ' + (projIdx - AUJ) + ' semaines de plus.'
          : 'Aucun plan sold\u00e9 sur la p\u00e9riode : pas de fin pr\u00e9visible.');
      items.push('\x3Cspan class="legende-item">\x3Csvg width="22" height="8" aria-hidden="true">' +
        '\x3Cline x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".65"/>\x3C/svg>' +
        '\x3Cspan title="' + explication + '">au rythme moyen (' + vitesse.toFixed(1).replace('.', ',') + '/sem.)' +
        (projIdx !== null ? ' \u2192 fin vers ' + etiquette(projIdx) : ' \u2014 pas de fin pr\u00e9visible') +
        '\x3C/span>\x3C/span>');
    }
    if (requis !== null) {
      items.push('\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6"/>\x3C/svg>' +
        '\x3Cspan title="' + restants + ' plans restants \u00e0 solder en ' + (prochain.i - AUJ) +
        ' semaines. Rouge si ce rythme d\u00e9passe le rythme actuel.">' +
        'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb : ' +
        requis.toFixed(1).replace('.', ',') + '/sem.\x3C/span>\x3C/span>');
    }
    $('legende').innerHTML = items.join('');
    /* La légende des jalons : chaque numéro en clair, sa semaine, son
       périmètre ; en retrait hors périmètre, en rouge s'il est l'échéance
       manquée. Survoler un jalon ici l'éclaire sur le graphique. */
    $('legende-jalons').innerHTML = jalons.length ? '\x3Cspan class="legende-jalons-mot">Jalons\x3C/span>\x3Cdiv class="legende-jalons-grille">' + jalons.map(function (j, idx) {
      var hors = !jalonDansPerimetre(j), rouge = prochain && j.i === prochain.i && !hors && enRetard;
      var horsFenetre = j.i < d0 || j.i > d1;   // dans la légende, mais pas dans la fenêtre affichée
      return '\x3Cspan class="legende-jalon' + (hors ? ' hors-perimetre' : '') + (rouge ? ' critique' : '') + (horsFenetre ? ' hors-fenetre' : '') +
        '" data-jalon="' + idx + '" tabindex="0" title="' +
        ech(j.texte) + ' \u2014 ' + etiquette(j.i) + (j.perimetre ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) : '') +
        (hors ? ' \u2014 hors du p\u00e9rim\u00e8tre choisi' : '') + (horsFenetre ? ' \u2014 hors de la fen\u00eatre affich\u00e9e' : '') + '">' +
        '\x3Cb class="num">' + (idx + 1) + '\x3C/b>\x3Cspan class="mot">' + ech(j.texte) + '\x3C/span>' +
        '\x3Cspan class="quand">' + etiquette(j.i) + (j.perimetre ? ' \u00b7 ' + ech(j.perimetre) : '') + (horsFenetre ? ' \u00b7 hors fen\u00eatre' : '') + '\x3C/span>\x3C/span>';
    }).join('') + '\x3C/div>' : '';

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0 };
    majBoutonsZoom();
    planifierSauvegarde();
  }

  /* « Tout » n'a pas de largeur fixe : il est pressé quand la fenêtre est
     exactement celle qu'il donnerait, et qu'aucun préréglage fixe ne l'est. */
  function majBoutonsZoom() {
    var boutons = document.querySelectorAll('.commandes-graphe .segmente button');
    var fixe = false;
    for (var i = 0; i < boutons.length; i++) {
      if (Number(boutons[i].dataset.span) === vue.fen.span) fixe = true;
    }
    for (var k = 0; k < boutons.length; k++) {
      var v = Number(boutons[k].dataset.span);
      boutons[k].setAttribute('aria-pressed', String(v ? v === vue.fen.span : !fixe && vue.fen.span === spanTout()));
    }
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  function reglerSpan(span) {
    vue.fen.span = span || spanTout();
    vue.fen.debut = span ? Math.max(0, AUJ - Math.round(vue.fen.span * 0.45)) : 0;
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;

  /* Le seul geste du graphique : le panoramique. Il part de n'importe quel
     point du cadre, frise des jalons et marge du bas comprises — le curseur
     y promet la main partout. Un clic net ne fait rien. */
  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    glisse = { x0: e.clientX, debut0: vue.fen.debut, bouge: false };
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    var span1 = Math.max(8, Math.min(MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));
    rendreGraphique(selection());
  }, { passive: false });

  cadreGraphe.addEventListener('pointermove', function (e) {
    if (!glisse) return;
    var dx = e.clientX - glisse.x0;
    if (Math.abs(dx) > 4) glisse.bouge = true;
    if (!glisse.bouge) return;
    var semaines = dx / pxParSemaine();
    cadreGraphe.dataset.glisse = 'true';
    var nd = Math.round(glisse.debut0 - semaines);
    if (nd !== vue.fen.debut) { vue.fen.debut = nd; rendreGraphique(selection()); }
  });

  function finGlisse() {
    if (!glisse) return;
    glisse = null;
    cadreGraphe.dataset.glisse = 'false';
  }
  cadreGraphe.addEventListener('pointerup', finGlisse);
  cadreGraphe.addEventListener('pointercancel', finGlisse);

  /* Infobulle */
  cadreGraphe.addEventListener('mousemove', function (e) {
    if (glisse && glisse.bouge) { $('bulle').dataset.visible = 'false'; return; }
    if (!e.target.closest || !e.target.closest('.zone-clic')) { $('bulle').dataset.visible = 'false'; return; }
    var i = indexSousCurseur(e.clientX);
    var a = derniereAnalyse;
    if (i === null || !a) return;
    var bulle = $('bulle');
    var k = -1;
    for (var q = 0; q < a.pts.length; q++) if (a.pts[q].i === i) k = q;
    if (k !== -1) {
      var pt = a.pts[k];
      var gagne = k > 0 ? pt.termine - a.pts[k - 1].termine : null;
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">Relevé du ' + etiquette(i) + '\x3C/div>' +
        '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille" style="background:var(--fait)">\x3C/span>terminés\x3Cspan class="n">' +
          nb(pt.termine) + ' / ' + nb(pt.total) + '\x3C/span>\x3C/div>' +
        (gagne !== null ? '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille sans">\x3C/span>depuis le précédent\x3Cspan class="n">' +
          (gagne > 0 ? '+' : '') + nb(gagne) + '\x3C/span>\x3C/div>' : '') +
        comptesDeLaSemaine(i);
    } else {
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">' + etiquette(i) + '\x3C/div>\x3Cdiv class="bulle-ligne">' +
        (i > AUJ ? 'À venir' : 'Pas de relevé cette semaine-là') + '\x3C/div>';
    }
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  /* Sous les deux lignes de tête, le résumé de la semaine. « +6 » ne dit pas
     ce qui s'est passé : la bulle reprend les comptes du journal — passages,
     nouveaux, disparus, changements d'indice — une ligne par compte non nul,
     et rien d'autre : le journal, dessous, donne le détail. Quand la courbe
     est celle d'un groupe, les comptes se limitent aux plans de ce groupe. */
  var LIGNES_BULLE = [
    { cle: 'termine', un: 'passé en terminé',   des: 'passés en terminé' },
    { cle: 'encours', un: 'passé en cours',     des: 'passés en cours' },
    { cle: 'afaire',  un: 'repassé à faire',    des: 'repassés à faire' },
    { cle: 'vide',    un: 'effacé',             des: 'effacés' },
    { cle: 'nouveau', un: 'nouveau',            des: 'nouveaux' },
    { cle: 'disparu', un: 'disparu',            des: 'disparus' },
    { cle: 'indice',  un: 'changement d’indice', des: 'changements d’indice' }
  ];
  function comptesDeLaSemaine(i) {
    var sem = JOURNAL.filter(function (s) { return s.i === i; })[0];
    if (!sem) return '';
    var evts = sem.evenements.filter(dansPerimetreEvt);
    if (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) {
      evts = evts.filter(function (e) {
        var p = planDeRef(e.ref);
        return p && String(valeurDim(p, vue.groupe.dim)) === vue.groupe.val;
      });
    }
    var c = comptesEvenements(evts);
    var lignes = LIGNES_BULLE.filter(function (l) { return c[l.cle]; }).map(function (l) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleDe(l.cle) + (c[l.cle] > 1 ? l.des : l.un) +
        '\x3Cspan class="n">' + nb(c[l.cle]) + '\x3C/span>\x3C/div>';
    });
    return lignes.length ? '\x3Cdiv class="bulle-comptes">' + lignes.join('') + '\x3C/div>' : '';
  }

  cadreGraphe.addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  document.querySelector('.commandes-graphe .segmente').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-span]');
    if (b) reglerSpan(Number(b.dataset.span));
  });

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y
     laisse aucune trace tant que les autres avancent. On projette donc
     chaque groupe a SON rythme, et on regarde lequel arrive le dernier.
     ============================================================ */
  var FENETRE = 6;

  /* L'explication ne vaut que chiffree : on reprend une ligne reelle du bloc et
     on y refait le calcul pas a pas, plutot qu'un exemple invente. */
  function panneauAide(rangs, prochain, semainesJalon) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restants > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    function d(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
    /* Dans l'exemple, un rythme arrondi au dixieme ne redonnerait pas la date
       affichee : on garde deux decimales, sans zero inutile. */
    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

    var h = '\x3Cdiv class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment la fin estimée est calculée">';
    h += '\x3Ch3>D’où vient la fin estimée ?\x3C/h3>';
    h += '\x3Cp>GATES ne donne qu’une photo du jour, sans historique. On archive donc un relevé à chaque import, ' +
         'puis on compare le premier au dernier et on prolonge la pente en ligne droite.\x3C/p>';
    h += '\x3Cdiv class="aide-formule">' +
         'rythme   = (terminés aujourd’hui − terminés au 1\x3Csup>er\x3C/sup> relevé) ÷ semaines écoulées\n' +
         'restants = total − terminés aujourd’hui\n' +
         '\x3Cb>fin      = semaine actuelle + arrondi supérieur(restants ÷ rythme)\x3C/b>' +
         '\x3C/div>';

    if (ex) {
      var depart = ex.termine - ex.rythme.gagnes;
      var sem = ex.fin - AUJ;
      h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Exemple — ' + ech(TITRE_DIM[vue.dimCritique].replace(/ \(.*\)$/, '')) +
           ' ' + ech(ex.nom) + ', au dernier import\x3C/span>' +
           'rythme   = (' + ex.termine + ' − ' + depart + ') ÷ ' + ex.rythme.semaines + ' sem. = ' +
           d2(ex.vitesse) + ' plan par semaine\n' +
           'restants = ' + ex.total + ' − ' + ex.termine + ' = ' + ex.restants + ' plans\n' +
           '\x3Cb>fin      = ' + ex.restants + ' ÷ ' + d2(ex.vitesse) + ' = ' + sem + ' semaines → ' +
           etiquette(AUJ) + ' + ' + sem + ' = ' + etiquette(ex.fin) + '\x3C/b>' +
           '\x3C/div>';
      if (prochain && semainesJalon > 0) {
        h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Et les deux colonnes voisines, sur la même ligne\x3C/span>' +
             'à solder/sem. = restants ÷ semaines avant le jalon\n' +
             '              = ' + ex.restants + ' ÷ ' + semainesJalon + ' = ' + d(ex.requis) +
             ' → affiché ' + Math.ceil(ex.requis) + ' (on n’achève pas un demi-plan)\n' +
             'effort        = à solder/sem. ÷ rythme actuel\n' +
             '              = ' + d(ex.requis) + ' ÷ ' + d2(ex.vitesse) + ' = ×' + d(ex.tension) +
             (ex.tension > 1 ? '  → il faut aller ' + d(ex.tension) + ' fois plus vite qu’aujourd’hui'
                             : '  → le rythme actuel suffit') +
             '\x3C/div>';
      }
    } else {
      h += '\x3Cp>Aucun groupe de la sélection n’a de rythme exploitable pour l’instant : ' +
           'il faut au moins deux relevés et un plan terminé entre les deux.\x3C/p>';
    }

    h += '\x3Cp>Un groupe qui n’a rien soldé depuis le premier relevé n’a pas de rythme : sa fin reste « — ». ' +
         'La date se recalcule à chaque import et peut reculer — ce n’est pas un engagement, ' +
         'c’est ce que dit le rythme tenu jusqu’ici.\x3C/p>';
    return h + '\x3C/div>';
  }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc
     TOUTES ses références, en deux paquets : ce qui n'est pas terminé — à
     faire, non renseigné, en cours, dans cet ordre, parce que c'est là qu'il
     y a quelque chose à faire — puis ce qui est soldé. Dans chaque paquet,
     les références se suivent dans l'ordre numérique. Rien n'est tronqué :
     un « et N autres » qui ne s'ouvre pas ne sert à personne. */
  function listeUD(r) {
    var ordre = { afaire: 0, vide: 1, encours: 2, termine: 3 };
    var plans = (r.plans || []).slice().sort(function (a, b) {
      return (ordre[a._etat] - ordre[b._etat]) || a.reference.localeCompare(b.reference, 'fr', { numeric: true });
    });
    if (!plans.length) return '';
    function jeton(p) {
      var e = ETAT_PAR_CLE[p._etat];
      var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
      return '\x3Cbutton class="jeton-ud" type="button" data-ud="' + ech(p.reference) +
        '" title="' + ech(e.court + (quoi ? ' — ' + quoi : '')) + '">' +
        pastilleDe(p._etat) + ech(p.reference) + '\x3C/button>';
    }
    function paquet(titre, liste) {
      if (!liste.length) return '';
      return '\x3Cdiv class="sous-groupe">\x3Ch4 class="sous-titre">' + titre +
        '\x3Cspan class="n">(' + nb(liste.length) + ')\x3C/span>\x3C/h4>' +
        '\x3Cdiv class="grille">' + liste.map(jeton).join('') + '\x3C/div>\x3C/div>';
    }
    var restants = plans.filter(function (p) { return p._etat !== 'termine'; });
    var termines = plans.filter(function (p) { return p._etat === 'termine'; });
    return '\x3Cdiv class="groupe-refs">\x3Cdiv class="entete">' +
      '\x3Cspan>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (restants.length ? ' · \x3Cb>' + nb(restants.length) + '\x3C/b> pas encore terminé' + (restants.length > 1 ? 's' : '')
                       : ' · tout est soldé') +
      '\x3C/span>\x3Cspan class="legende-etats" role="group" aria-label="Légende des pastilles">' + ETATS.map(function (et) {
        return '\x3Cspan>' + pastilleDe(et.cle) + ech(et.court) + '\x3C/span>';
      }).join('') + '\x3C/span>\x3Cspan>cliquez une référence pour la retrouver dans le tableau\x3C/span>\x3C/div>' +
      paquet('Pas encore terminés', restants) +
      paquet('Terminés', termines) +
      '\x3C/div>';
  }

  /* Le filtre de la colonne de gauche : les groupes dont le nom — tel qu'il
     s'affiche, donc « Oui » pour « true » — contient le texte tapé. */
  function retenuParFiltreGroupe(r) {
    var q = norm(vue.filtreGroupe);
    if (!q) return true;
    return norm(libelleGroupe(r.nom)).indexOf(q) !== -1 || norm(r.nom).indexOf(q) !== -1;
  }
  /* Le champ suit la dimension : « Filtrer les ATA… », « Filtrer les mois… ». */
  function libellerFiltreGroupe(dim) {
    var quoi = dim === '_mois' ? 'mois'
             : dim === '_anciennete' ? 'tranches'
             : (TITRE_DIM[dim] || 'groupes').replace(/ \(.*\)$/, '');
    $('filtre-groupe').placeholder = 'Filtrer les ' + quoi + '…';
    $('filtre-groupe').setAttribute('aria-label', 'Filtrer les ' + quoi);
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    /* L'échéance — le jalon qui pilote l'effort demandé sous le périmètre
       choisi — se pose d'abord, quoi que le bloc affiche ensuite : elle ne
       dépend ni de la sélection ni de la colonne analysée. */
    var prochain = prochainJalon();
    $('zone-critique').setAttribute('data-jalon', prochain ? prochain.texte : '');
    /* Aucune colonne à analyser — source vide, ou feuille sans catégorie
       reconnue : le bloc le dit au lieu de chercher un titre qui n'existe pas. */
    if (!dim || !TITRE_DIM[dim]) {
      $('titre-groupe').textContent = 'Avancement FWD';
      $('indice-dim').textContent = '';
      $('compte-groupes').textContent = '';
      libellerFiltreGroupe(dim);
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucune colonne à analyser dans cette source.\x3C/div>';
      return;
    }

    // Répartition : état du jour, filtrée comme le reste de la page.
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [] };
      groupes[k].total++;
      groupes[k][p._etat]++;
      groupes[k].plans.push(p);
    });

    /* Rythme : il vient des relevés archivés, qui portent sur l'ensemble des
       plans du groupe. Un comptage déjà figé ne peut pas être refiltré — sauf
       par le périmètre, qui se dérive de la carte plan par plan de chaque
       relevé, comme la courbe ; un relevé sans carte est alors écarté. */
    var per = vue.perimetre;
    var relevesRythme = per ? RELEVES.filter(function (rel) { return !!rel.plans; }) : RELEVES;

    var semainesJalon = prochain ? prochain.i - AUJ : 0;
    var rangs = Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      var restants = g.total - g.termine;
      // Même méthode que la courbe : l'étendue des rythmes réellement tenus.
      var serieGroupe = relevesRythme.map(function (rel) {
        var gr = per ? comptesDerives(rel, per, dim).groupes[k]
                     : (rel.groupes[dim] && rel.groupes[dim][k]);
        return { i: rel.i, termine: gr ? gr.termine : 0 };
      });
      var rg = rythmes(serieGroupe);
      var vitesse = rg ? rg.central : 0;
      return {
        rythme: rg,
        nom: g.nom, total: g.total, restants: restants, vitesse: vitesse, plans: g.plans,
        termine: g.termine, encours: g.encours, afaire: g.afaire, vide: g.vide,
        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restants === 0 ? AUJ : semaineFin(g.termine, g.total, vitesse),
        // L'effort demandé : combien il faut solder par semaine pour tenir le
        // jalon, et par quel facteur cela dépasse le rythme actuel du groupe.
        requis: semainesJalon > 0 ? restants / semainesJalon : 0,
        tension: (semainesJalon > 0 && vitesse > 0) ? (restants / semainesJalon) / vitesse : Infinity
      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      if (cle === 'total') return r.total;
      if (cle === 'pct') return r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'tension') return r.vitesse > 0 ? r.tension : Infinity;
      if (cle === 'fin') return r.fin === null ? Infinity : r.fin;
      return 0;
    }
    var tg = vue.triGroupe;
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {
        var x = cleTri(a, tg.cle), y = cleTri(b, tg.cle);
        if (typeof x === 'string') {
          // Les codes ATA sont des nombres ecrits en texte : on les compare comme tels.
          var nx = parseFloat(x), ny = parseFloat(y);
          if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return (nx - ny) * signe;
          return x.localeCompare(y, 'fr', { numeric: true }) * signe;
        }
        if (x === y) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        // Infinity des deux cotes : egalite, on retombe sur le nom.
        if (!isFinite(x) && !isFinite(y)) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        return (x < y ? -1 : 1) * signe;
      });
    } else {
      rangs.sort(function (a, b) {
        if ((a.restants === 0) !== (b.restants === 0)) return a.restants === 0 ? 1 : -1;
        if (prochain) return b.tension - a.tension;
        if ((a.fin === null) !== (b.fin === null)) return a.fin === null ? -1 : 1;
        return (b.fin || 0) - (a.fin || 0);
      });
    }

    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    $('titre-groupe').textContent = 'Avancement FWD par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '');
    $('indice-dim').textContent = NOTE_DIM(dim);
    libellerFiltreGroupe(dim);

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucun plan dans la sélection.\x3C/div>';
      $('compte-groupes').textContent = '';
      return;
    }

    /* Le filtre de la colonne de gauche ne touche qu'à ce bloc : les lignes
       qu'il écarte restent comptées partout ailleurs. Le compte dit combien
       restent sur combien tant qu'il agit. */
    var tous = rangs.length;
    rangs = rangs.filter(retenuParFiltreGroupe);
    $('compte-groupes').textContent = rangs.length === tous ? '' : nb(rangs.length) + ' sur ' + nb(tous);

    function fleche(cle) {
      if (!tg || tg.cle !== cle) return '';
      return '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
    }
    function entete(cle, libelle, titre, classe) {
      var actif = !!(tg && tg.cle === cle);
      return '\x3Cspan class="' + (classe || '') + '">\x3Cbutton type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +
        (titre ? ' title="' + ech(titre) + '"' : '') + '>' + ech(libelle) + fleche(cle) + '\x3C/button>';
    }

    function aide(quoi) {
      return '\x3Cbutton type="button" class="aide" data-aide="1" aria-expanded="' + (!!vue.aideFin) +
        '" aria-controls="panneau-fin" title="Comment ' + ech(quoi) + ' se calcule">?\x3C/button>';
    }

    var html = '\x3Cdiv class="critique-tete">' +
      entete('nom', TITRE_DIM[dim].replace(/ \(.*\)$/, ''), TITRE_DIM[dim]) + '\x3C/span>' +
      entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '\x3C/span>' +
      entete('pct', 'répartition FWD', 'Trier par part de plans terminés.', 'a-gauche') + '\x3C/span>' +
      entete('fin', 'fin estimée', 'Date d’arrivée si le rythme actuel se maintient.') + aide('la fin estimée') + '\x3C/span>' +
      (prochain
        ? entete('tension', 'effort demandé', 'Ce qu\'il faudrait solder chaque semaine pour tenir \u00ab\u00a0' + prochain.texte + '\u00a0\u00bb (' + etiquette(prochain.i) + '), comparé au rythme réellement tenu.') + aide('l’effort demandé') + '\x3C/span>'
        : entete('tension', 'rythme actuel', 'Plans terminés par semaine depuis le premier relevé.') + aide('le rythme actuel') + '\x3C/span>') +
      '\x3C/div>';

    if (vue.aideFin) html += panneauAide(rangs, prochain, semainesJalon);

    /* Toutes les lignes sont là — « Date création par mois » peut en faire
       quatre-vingts — mais le bloc a une hauteur : on descend dedans au lieu
       de pousser le reste de la page vers le bas. */
    html += rangs.map(function (r) {
      var actif = vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom;

      /* Le pourcentage s'ecrit dans le segment quand il y tient ; en dessous
         il reste dans l'infobulle plutot que d'etre rogne. */
      var barre = ETATS.map(function (e) {
        if (!r[e.cle]) return '';
        var part = (r[e.cle] / r.total) * 100;
        var texte = part >= 11 ? Math.round(part) + ' %' : '';
        var encre = encreSegment(e.cle);
        return e.hachure
          ? '\x3Cspan class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
          : '\x3Cspan style="width:' + part.toFixed(2) + '%;background:' + e.couleur + ';color:' + encre + '">' + texte + '\x3C/span>';
      }).join('');

      /* Une seule colonne d'appoint : l'effort demandé quand un jalon fixe une
         échéance, le rythme réellement tenu sinon. « À solder par semaine » a
         été retiré : personne ne suivait un nombre par semaine. */
      var col2;
      if (!prochain) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme actuel">\x3Cspan class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? r.vitesse.toFixed(1).replace('.', ',') + '/sem.' : 'rien de soldé') +
          '\x3C/span>\x3C/span>';
      } else if (r.restants === 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart">tout est soldé\x3C/span>\x3C/span>';
      } else if (r.vitesse <= 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart arret">rien de soldé\x3Csmall>aucun rythme\x3C/small>\x3C/span>\x3C/span>';
      } else {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé" title="' + r.restants +
          ' plans restants à répartir sur ' + semainesJalon + ' semaines, soit ' +
          r.requis.toFixed(1).replace('.', ',') + ' par semaine.">\x3Cspan class="v critique-ecart">' +
          (r.tension > 1 ? '\x3Cb class="tard">×' + r.tension.toFixed(1).replace('.', ',') + '\x3C/b>'
                         : '×' + r.tension.toFixed(1).replace('.', ',')) +
          '\x3Csmall>rythme ' + r.vitesse.toFixed(1).replace('.', ',') + '/sem.\x3C/small>\x3C/span>\x3C/span>';
      }

      // --- colonne chiffree 3 : la date d'arrivee au rythme actuel
      var texteFin = r.restants === 0 ? 'soldé' : (r.fin === null ? '—' : etiquette(r.fin));
      var col3 = '\x3Cspan class="critique-date' + (r.fin === null && r.restants !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" title="' +
        (r.restants === 0 ? 'Plus rien à solder dans ce groupe.'
          : r.fin === null ? 'Aucun plan terminé depuis le premier relevé : pas de rythme, donc pas de date.'
          : r.restants + ' plans restants à ' + r.vitesse.toFixed(1).replace('.', ',') +
            ' par semaine, soit ' + (r.fin - AUJ) + ' semaines.') +
        '">\x3Cspan class="v">' + texteFin + '\x3C/span>\x3C/span>';

      return '\x3Cbutton class="critique-ligne" type="button" data-groupe="' + ech(r.nom) + '" aria-pressed="' + !!actif +
        '" title="' + r.termine + ' terminés, ' + r.encours + ' en cours, ' + r.afaire + ' à faire, ' +
        r.vide + ' non renseignés — cliquez pour voir lesquels">' +
        '\x3Cspan class="critique-nom">' + ech(libelleGroupe(r.nom)) + '\x3C/span>' +
        '\x3Cspan class="critique-total" data-libelle="plans">' + r.total + '\x3C/span>' +
        '\x3Cspan class="critique-barre">' + barre + '\x3C/span>' +
        col3 + col2 + '\x3C/button>' +
        (actif ? listeUD(r) : '');
    }).join('');

    if (!rangs.length) {
      html += '\x3Cdiv class="vide-message">Aucun groupe ne contient « ' + ech(vue.filtreGroupe.trim()) +
        ' ». Échap vide le filtre.\x3C/div>';
    }

    /* toggle et non className : le conteneur porte aussi « defile-liste »,
       qui lui donne sa hauteur et sa barre de défilement. */
    $('zone-critique').classList.toggle('sans-jalon', !prochain);
    $('zone-critique').innerHTML = html;
  }

  /* L'ordre du sélecteur est celui que donne la source : quand la liste est
     fixée à la main, c'est l'ordre demandé qui compte, pas celui de la feuille. */
  /* Le sélecteur est rangé par ordre alphabétique : on y cherche un nom, pas
     une position dans la feuille. */
  /* Deux dimensions viennent de la même colonne de date et se confondent
     facilement : on dit laquelle répond à quelle question. */
  function NOTE_DIM(dim) {
    var titreDate = CLE_DATE && PAR_CLE[CLE_DATE] ? PAR_CLE[CLE_DATE].titre.toLowerCase() : 'date de création';
    if (dim === '_anciennete') {
      return 'Depuis combien de temps le plan existe, en quatre tranches calculées sur « ' + titreDate +
        ' ». Répond à « qu\u2019est-ce qui traîne depuis longtemps ? ».';
    }
    if (dim === '_mois') {
      return 'Le mois où le plan a été créé, un groupe par mois, rangés dans l\u2019ordre du temps. ' +
        'Répond à « de quelle vague vient ce lot ? » \u2014 l\u2019ancienneté, elle, regroupe en tranches.';
    }
    if (dim === 'avancement') {
      return 'La valeur brute de la colonne d\u2019avancement, telle qu\u2019elle est saisie : ' +
        'd\u2019un coup d\u2019\u0153il, toutes les façons de l\u2019écrire, donc les saisies qui divergent.';
    }
    return '';
  }

  /* DIMENSIONS et TITRE_DIM sont dérivés de la source dans chargerSource(). */
  function remplirDims() {
    $('dim-critique').innerHTML = DIMENSIONS.map(function (d) {
      return '\x3Coption value="' + d.cle + '">' + ech(d.titre) + '\x3C/option>';
    }).join('');
    $('dim-critique').value = vue.dimCritique;
  }

  /* ============================================================ TABLEAU */
  function visibles() {
    return vue.ordre.filter(function (k) { return !vue.cachees[k]; }).map(function (k) { return PAR_CLE[k]; });
  }
  /* Combien de colonnes restent collees a gauche : tout ce qui precede la
     reference, plus elle. Dans l'ordre de la feuille la reference arrive en
     deuxieme ; en vue essentielle elle ouvre le tableau. Le calcul suit
     l'ordre affiche au lieu de le supposer. */
  function nbFigees(cols) {
    for (var i = 0; i < cols.length; i++) if (cols[i].fige) return i + 1;
    return 0;
  }
  function classeFige(i, n) {
    if (i >= n) return '';
    return i === n - 1 ? 'col-fige fige-fin' : 'col-fige';
  }
  function rendreEntetes() {
    var cols = visibles();
    var nFige = nbFigees(cols);
    /* Un groupe a cheval sur la limite du bloc fige est coupe en deux : la
       moitie collee garde le libelle, la suite le laisse vide pour que la
       bande se lise d'un trait. */
    var groupes = [];
    cols.forEach(function (c, i) {
      var colle = i < nFige;
      var d = groupes[groupes.length - 1];
      if (d && d.nom === c.groupe && d.fige === colle) d.n++;
      else groupes.push({ nom: c.groupe, n: 1, fige: colle, debut: i, suite: !!(d && d.nom === c.groupe) });
    });
    var html = '\x3Ctr class="groupes">' + groupes.map(function (g) {
      var cl = g.fige ? (g.debut + g.n === nFige ? 'col-fige fige-fin' : 'col-fige') : '';
      return '\x3Cth colspan="' + g.n + '" data-debut="' + g.debut + '"' + (cl ? ' class="' + cl + '"' : '') +
        '>' + ech(g.suite ? '' : g.nom) + '\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="titres">' + cols.map(function (c, i) {
      var actif = vue.tri.cle === c.cle;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (vue.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      var poignee = c.fige ? '' : '\x3Cspan class="poignee" aria-hidden="true">\x3Csvg width="7" height="12" viewBox="0 0 7 12" fill="currentColor">' +
        '\x3Ccircle cx="1.6" cy="2" r="1.1"/>\x3Ccircle cx="5.4" cy="2" r="1.1"/>\x3Ccircle cx="1.6" cy="6" r="1.1"/>' +
        '\x3Ccircle cx="5.4" cy="6" r="1.1"/>\x3Ccircle cx="1.6" cy="10" r="1.1"/>\x3Ccircle cx="5.4" cy="10" r="1.1"/>\x3C/svg>\x3C/span>';
      var cl = classeFige(i, nFige);
      return '\x3Cth scope="col" data-cle="' + c.cle + '"' + (cl ? ' class="' + cl + '"' : '') +
        (c.fige ? '' : ' draggable="true"') +
        ' aria-sort="' + (actif ? (vue.tri.asc ? 'ascending' : 'descending') : 'none') + '">' +
        poignee + '\x3Cbutton type="button" data-tri="' + c.cle + '">' + ech(c.titre) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="filtres">' + cols.map(function (c, i) {
      var val = vue.filtres[c.cle] || '';
      var cl = classeFige(i, nFige);
      return '\x3Cth' + (cl ? ' class="' + cl + '"' : '') + '>\x3Cinput type="text" data-filtre="' + c.cle + '" value="' + ech(val) +
        '" placeholder="filtrer" data-actif="' + (!!val) + '" aria-label="Filtrer ' + ech(c.titre) + '">\x3C/th>';
    }).join('') + '\x3C/tr>';
    $('tete-tableau').innerHTML = html;
    ajusterSticky();
  }
  function ajusterSticky() {
    requestAnimationFrame(function () {
      var g = document.querySelector('.groupes'), t = document.querySelector('.titres'), f = document.querySelector('.filtres');
      if (!g || !t || !f) return;
      var hg = g.getBoundingClientRect().height;
      var ht = t.getBoundingClientRect().height;
      t.querySelectorAll('th').forEach(function (th) { th.style.top = hg + 'px'; });
      f.querySelectorAll('th').forEach(function (th) { th.style.top = (hg + ht) + 'px'; });

      /* On mesure les colonnes collees et on les pose les unes apres les
         autres. Sans ce cumul, la deuxieme viendrait recouvrir la premiere. */
      var tetes = t.querySelectorAll('th');
      var gauche = [], cumul = 0;
      for (var i = 0; i < tetes.length; i++) {
        if (!tetes[i].classList.contains('col-fige')) break;
        gauche.push(cumul);
        cumul += tetes[i].getBoundingClientRect().width;
      }
      if (!gauche.length) return;
      g.querySelectorAll('th.col-fige').forEach(function (th) {
        var d = parseInt(th.dataset.debut, 10) || 0;
        th.style.left = (gauche[d] || 0) + 'px';
      });
      var lignes = [t, f].concat(Array.prototype.slice.call(document.querySelectorAll('#corps-tableau tr')));
      lignes.forEach(function (ligne) {
        var n = 0;
        ligne.querySelectorAll('.col-fige').forEach(function (c) {
          c.style.left = (gauche[n] == null ? 0 : gauche[n]) + 'px';
          n++;
        });
      });
    });
  }
  function rendreCorps(liste) {
    var cols = visibles();
    /* Le lot « seulement dans la seconde base » n'a aucun plan ici : le
       tableau de GATES le dit, et propose l'autre côté. La barre du haut, elle,
       montre toujours la sélection — ce lot n'est pas un filtre sur les plans. */
    if (vue.lotLa && RAPPROCHEMENT) {
      var nLa = RAPPROCHEMENT.seul.length, nomLa = nomSeconde();
      $('corps-tableau').innerHTML = '\x3Ctr>\x3Ctd colspan="' + cols.length + '">\x3Cdiv class="vide-message">Ces ' + nb(nLa) +
        (nLa > 1 ? ' lignes n’ont pas de plan dans GATES. ' : ' ligne n’a pas de plan dans GATES. ') +
        '\x3Cbutton class="lien-doux" type="button" data-aller-base="la">Les voir dans ' + ech(nomLa) + '\x3C/button>\x3C/div>\x3C/td>\x3C/tr>';
      $('compte').textContent = '0 plan sur ' + nb(population().length);
      majOmbre();
      return;
    }
    var rangs = liste.slice().sort(function (a, b) {
      var k = vue.tri.cle, sens = vue.tri.asc ? 1 : -1;
      if (k === 'avancement') return (a._pct - b._pct) * sens || a.reference.localeCompare(b.reference);
      var va = String(a[k] == null ? '' : a[k]), vb = String(b[k] == null ? '' : b[k]);
      if (va === '' && vb === '') return 0;
      if (va === '') return 1;
      if (vb === '') return -1;
      return va.localeCompare(vb, 'fr', { numeric: true, sensitivity: 'base' }) * sens;
    });

    if (!rangs.length) {
      $('corps-tableau').innerHTML = '\x3Ctr>\x3Ctd colspan="' + cols.length + '">\x3Cdiv class="vide-message">Aucun plan ne correspond aux filtres.\x3C/div>\x3C/td>\x3C/tr>';
      $('compte').textContent = '0 plan';
      majOmbre();
      return;
    }

    var nFige = nbFigees(cols);
    $('corps-tableau').innerHTML = rangs.map(function (p) {
      return '\x3Ctr>' + cols.map(function (c, i) {
        var fige = classeFige(i, nFige);
        if (c.cle === 'avancement') {
          var e = ETAT_PAR_CLE[p._etat];
          var past = e.hachure ? '\x3Cspan class="pastille hachure">\x3C/span>'
            : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
          return '\x3Ctd class="' + fige + '">\x3Cspan class="etat-cellule">' + past +
            (p.avancement ? '\x3Cspan class="num">' + ech(p.avancement) + '\x3C/span>' : '\x3Cspan class="doux">non renseigné\x3C/span>') +
            '\x3C/span>\x3C/td>';
        }
        var val = p[c.cle];
        var classes = (c.classe + ' ' + fige).trim();
        if (val === '' || val == null) return '\x3Ctd class="' + classes + ' doux">-\x3C/td>';
        var titre = c.classe.indexOf('large') !== -1 ? ' title="' + ech(val) + '"' : '';
        return '\x3Ctd class="' + classes + '"' + titre + '>' + ech(val) + '\x3C/td>';
      }).join('') + '\x3C/tr>';
    }).join('');

    /* « sur N » : N est la population du périmètre, pas la feuille entière. */
    var base = population().length;
    $('compte').textContent = nb(rangs.length) + (rangs.length > 1 ? ' plans' : ' plan') +
      (rangs.length !== base ? ' sur ' + nb(base) : '');
    ajusterSticky();
    majOmbre();
  }
  /* Seule la colonne d'avancement FWD interesse le suivi : une cellule vide
     ailleurs n'est pas un defaut a traquer. */
  var COLONNE_SUIVIE = 'avancement';
  /* Ce qui a bougé depuis l'import précédent. Sur 186 lignes, personne ne
     peut le voir à l'œil ; c'est pourtant la question de chaque semaine. */
  /* « un » et « des » : le libellé s'accorde au compte — « 1 passé en
     terminé », « 20 passés en terminé ». */
  var LOTS_DELTA = [
    { cle: 'termine',  un: 'passé en terminé',    des: 'passés en terminé',    etat: 'termine' },
    { cle: 'encours',  un: 'passé en cours',      des: 'passés en cours',      etat: 'encours' },
    { cle: 'afaire',   un: 'passé à faire',       des: 'passés à faire',       etat: 'afaire' },
    { cle: 'nouveaux', un: 'nouveau',             des: 'nouveaux',             etat: null },
    { cle: 'disparus', un: 'disparu',             des: 'disparus',             etat: null },
    { cle: 'indice',   un: 'changement d’indice', des: 'changements d’indice', etat: null }
  ];
  function libelleLot(l, n) { return n > 1 ? l.des : l.un; }

  function rendreComparatif() {
    var zone = $('comparatif');
    if (!COMPARATIF) {
      zone.innerHTML = '\x3Cspan>Premier import : le comparatif appara\u00eetra au prochain.\x3C/span>';
      return;
    }
    var morceaux = LOTS_DELTA.filter(function (l) { return COMPARATIF[l.cle].length; }).map(function (l) {
      var actif = vue.refsLibelle === l.cle;
      var n = COMPARATIF[l.cle].length;
      var pastille = l.etat || l.cle === 'indice' ? pastilleDe(l.etat || l.cle) : '';
      return '\x3Cbutton class="puce-delta" type="button" data-delta="' + l.cle +
        '" aria-pressed="' + actif + '">' +
        pastille + '\x3Cb>' + nb(n) + '\x3C/b> ' + libelleLot(l, n) + '\x3C/button>';
    });
    zone.innerHTML = '\x3Cspan>Depuis l\u2019import du ' + etiquette(RELEVES[RELEVES.length - 2].i) + ' :\x3C/span>' +
      (morceaux.length ? morceaux.join('') : '\x3Cspan>aucun changement.\x3C/span>');
  }

  /* ============================================================
     JOURNAL DES CHANGEMENTS
     Chaque relevé archivé garde l'avancement plan par plan. Comparer deux
     relevés successifs donne, semaine par semaine, qui a bougé et dans quel
     sens — la seule chose que l'export du jour ne dira jamais.
     ============================================================ */
  /* PLAN_PAR_REF, PLAN_PAR_RACINE et JOURNAL sont dérivés dans
     chargerSource(). Les événements d'une semaine viennent d'apparier() :
     un plan réémis y est un changement d'indice, pas un disparu plus un nouveau. */
  function construireJournal() {
    var journal = [];
    for (var k = 1; k < RELEVES.length; k++) {
      var avant = RELEVES[k - 1].plans, apres = RELEVES[k].plans;
      if (!avant || !apres) continue;
      var evenements = apparier(avant, apres);
      if (evenements.length) journal.push({ i: RELEVES[k].i, evenements: evenements });
    }
    return journal.reverse();          // la semaine la plus récente en tête
  }

  /* Le plan derrière une référence, même ancienne : une référence qui n'est
     plus dans la feuille se retrouve par sa racine et sa solution — c'est le
     même plan, réémis sous un autre indice depuis. */
  function planDeRef(ref) {
    return PLAN_PAR_REF[ref] || PLAN_PAR_RACINE[clePlan(analyserUD(ref))] || null;
  }

  /* Le filtre du journal : un état d'arrivée, ou « indice » — la même case
     que dans les comptes, pour que le filtre montre exactement ce que le
     résumé compte. Un changement d'indice ne se range que sous « indice » ;
     les nouveaux, les disparus et les effacés ne se voient que sous « Tout ». */
  function retenuParJournal(e, filtre) {
    if (!filtre) return true;
    if (filtre === 'indice') return e.type === 'indice';
    if (e.type === 'nouveau' || e.type === 'disparu' || estReemission(e)) return false;
    return e.apres === filtre;
  }
  /* Les comptes d'une liste d'événements, avec les mots du journal et de la
     bulle : passages par état d'arrivée, nouveaux, disparus, changements
     d'indice. Une case par événement, pour que la somme des comptes soit le
     nombre de lignes : un plan réémis compte sous « changement d'indice »,
     même s'il change d'état au passage — sa ligne montre l'état avant et après. */
  function comptesEvenements(evts) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0, nouveau: 0, disparu: 0, indice: 0 };
    evts.forEach(function (e) {
      if (e.type === 'nouveau') { c.nouveau++; return; }
      if (e.type === 'disparu') { c.disparu++; return; }
      if (estReemission(e)) { c.indice++; return; }
      c[e.apres]++;
    });
    return c;
  }

  /* La pastille d'un état — ou, hors des états, le violet du changement
     d'indice et la pastille transparente qui tient la place des autres. */
  function pastilleDe(cle) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '\x3Cspan class="pastille ' + (cle === 'indice' ? 'indice' : 'sans') + '">\x3C/span>';
    return e.hachure
      ? '\x3Cspan class="pastille hachure">\x3C/span>'
      : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
  }
  function etiqEtat(cle, role) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '';
    return '\x3Cspan class="etiq-etat ' + (role || '') + '">' + pastilleDe(cle) + ech(e.court) + '\x3C/span>';
  }

  var MAX_JOURNAL = 12;                // lignes affichées avant « voir tout »

  /* Le journal affiché : sous un périmètre, seuls les événements des plans
     qui en font partie ; une semaine qui n'en a plus disparaît. */
  function journalAffiche() {
    if (!vue.perimetre) return JOURNAL;
    return JOURNAL.map(function (sem) {
      return { i: sem.i, evenements: sem.evenements.filter(dansPerimetreEvt) };
    }).filter(function (sem) { return sem.evenements.length > 0; });
  }

  function rendreJournal() {
    var zone = $('zone-journal');
    if (!JOURNAL.length) {
      zone.innerHTML = '\x3Cdiv class="journal-vide">Le journal se remplira au deuxième archivage : ' +
        'il faut deux relevés pour savoir ce qui a bougé entre les deux.\x3C/div>';
      return;
    }
    var journal = journalAffiche();
    if (!journal.length) {
      zone.innerHTML = '\x3Cdiv class="journal-vide">Aucun changement dans le périmètre ' +
        ech(vue.perimetre) + '.\x3C/div>';
      return;
    }
    var filtre = vue.journal;
    var visibles = 0;
    var html = journal.map(function (sem) {
      var evts = sem.evenements.filter(function (e) { return retenuParJournal(e, filtre); });
      if (!evts.length) return '';
      /* La première semaine RENDUE — pas la plus récente du journal, qui peut
         n'avoir rien à montrer sous le filtre courant. */
      var premiere = visibles++ === 0;

      var parType = comptesEvenements(evts);
      /* « passés en en cours » ne se dit pas : chaque état a sa tournure.
         Et chaque compte est un bouton : cliquer « 4 terminés » n'affiche plus
         que ceux-là, pour toutes les semaines à la fois. */
      var resume = [];
      ETATS.forEach(function (et) {
        var n = parType[et.cle];
        if (!n) return;
        var pluriel = n > 1 ? 's' : '';
        var mot;
        if (et.cle === 'termine')      mot = 'terminé' + pluriel;
        else if (et.cle === 'encours') mot = 'passé' + pluriel + ' en cours';
        else if (et.cle === 'afaire')  mot = 'repassé' + pluriel + ' à faire';
        else {
          /* Une cellule effacée n'est pas un passage qu'on filtre : un compte,
             comme les nouveaux et les disparus. */
          resume.push('\x3Cspan class="doux-compte">' + pastilleDe('vide') + '\x3Cb>' + nb(n) + '\x3C/b> effacé' + pluriel + '\x3C/span>');
          return;
        }
        resume.push('\x3Cbutton class="compte-passage" type="button" data-passage="' + et.cle +
          '" aria-pressed="' + (vue.journal === et.cle) + '" title="N\u2019afficher que ces passages, sur toutes les semaines">' +
          pastilleDe(et.cle) + '\x3Cb>' + nb(n) + '\x3C/b> ' + ech(mot) + '\x3C/button>');
      });
      if (parType.indice) {
        resume.push('\x3Cbutton class="compte-passage" type="button" data-passage="indice" aria-pressed="' +
          (vue.journal === 'indice') + '" title="N\u2019afficher que les changements d\u2019indice, sur toutes les semaines">' +
          pastilleDe('indice') + '\x3Cb>' + nb(parType.indice) + '\x3C/b> changement' + (parType.indice > 1 ? 's' : '') + ' d\u2019indice\x3C/button>');
      }
      if (parType.nouveau) resume.push('\x3Cspan class="doux-compte">\x3Cb>' + nb(parType.nouveau) + '\x3C/b> nouveau' + (parType.nouveau > 1 ? 'x' : '') + '\x3C/span>');
      if (parType.disparu) resume.push('\x3Cspan class="doux-compte">\x3Cb>' + nb(parType.disparu) + '\x3C/b> disparu' + (parType.disparu > 1 ? 's' : '') + '\x3C/span>');
      /* La ligne de couleur de la semaine : une part par compte, dans l'ordre
         du résumé, sur la largeur d'une petite jauge. */
      var totalSem = ['termine', 'encours', 'afaire', 'vide', 'indice', 'nouveau', 'disparu']
        .reduce(function (t, k) { return t + (parType[k] || 0); }, 0);
      var jauge = totalSem ? '\x3Cspan class="mini-jauge" aria-hidden="true">' +
        ['termine', 'encours', 'afaire', 'vide', 'indice', 'nouveau', 'disparu'].map(function (k) {
          if (!parType[k]) return '';
          var e = ETAT_PAR_CLE[k];
          var style = 'width:' + (100 * parType[k] / totalSem).toFixed(1) + '%' + (e && !e.hachure ? ';background:' + e.couleur : '');
          return '\x3Cspan class="' + k + '" style="' + style + '">\x3C/span>';
        }).join('') + '\x3C/span>' : '';

      // La première semaine affichée s'ouvre d'elle-même : c'est celle qu'on vient voir.
      var ouvert = vue.journalOuverts[sem.i] !== undefined ? vue.journalOuverts[sem.i] : premiere;
      var limite = vue.journalOuverts['tout' + sem.i] ? evts.length : MAX_JOURNAL;

      /* Rangées par état d'arrivée, puis par référence : « terminé, terminé,
         terminé, à faire, à faire » se lit, « en vrac » ne se lit pas. Les
         changements d'indice ouvrent la liste : rares, et c'est l'événement
         qu'on doit reconnaître — relégués derrière « voir les N autres », ils
         seraient les seuls invisibles sans clic. Les nouveaux et les disparus
         ferment la marche. */
      var rangEtat = { termine: 0, encours: 1, afaire: 2, vide: 3 };
      var rangType = { indice: -1, nouveau: 5, disparu: 6 };
      evts = evts.slice().sort(function (a, b) {
        var ra = rangType[a.type] !== undefined ? rangType[a.type] : rangEtat[a.apres];
        var rb = rangType[b.type] !== undefined ? rangType[b.type] : rangEtat[b.apres];
        return (ra - rb) || a.ref.localeCompare(b.ref, 'fr', { numeric: true });
      });

      var lignes = evts.slice(0, limite).map(function (e) {
        var plan = planDeRef(e.ref);
        var quoi = plan && CLE_LIBELLE ? String(plan[CLE_LIBELLE] || '') : '';
        var vers = e.type === 'nouveau'
          ? '\x3Cspan class="vers">\x3Cspan class="etiq-etat avant">nouveau\x3C/span>' +
            '\x3Cspan class="fleche-etat">\u2192\x3C/span>' + etiqEtat(e.apres, 'apres') + '\x3C/span>'
          : e.type === 'disparu'
            ? '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant') +
              '\x3Cspan class="fleche-etat">\u2192\x3C/span>\x3Cspan class="etiq-etat apres">retiré\x3C/span>\x3C/span>'
            : '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant') +
              '\x3Cspan class="fleche-etat">\u2192\x3C/span>' + etiqEtat(e.apres, 'apres') + '\x3C/span>';
        /* Une réémission se lit « ANCIENNE → NOUVELLE », puis l'état avant et
           après : le même plan sous deux références, et ce qu'il est devenu. */
        var reference = estReemission(e)
          ? '\x3Cspan class="ref ref-indice">\x3Cspan class="ancienne">' + ech(e.ancienne) + '\x3C/span>' +
            '\x3Cspan class="nouvelle">\u2192 ' + ech(e.ref) + '\x3C/span>\x3C/span>'
          : '\x3Cspan class="ref">' + ech(e.ref) + '\x3C/span>';
        return '\x3Cli>\x3Cbutton class="journal-ligne' + (estReemission(e) ? ' reemission ' + e.type : '') +
          '" type="button" data-ref="' + ech(e.ref) + '" data-type="' + e.type +
          '" title="N’afficher que ce plan dans le tableau">' + reference +
          '\x3Cspan class="quoi">' + ech(quoi) + '\x3C/span>' + vers + '\x3C/button>\x3C/li>';
      }).join('');

      var reste = evts.length - limite;
      if (reste > 0) {
        lignes += '\x3Cli>\x3Cbutton class="journal-plus" type="button" data-tout="' + sem.i + '">' +
          'voir les ' + nb(reste) + ' autres\x3C/button>\x3C/li>';
      }

      return '\x3Cdiv class="journal-semaine">' +
        '\x3Cspan class="journal-tete">' +
        '\x3Cbutton class="journal-plier" type="button" data-semaine="' + sem.i + '" aria-expanded="' + ouvert +
        '" aria-label="Plier ou d\u00e9plier la semaine ' + etiquette(sem.i) + '">' +
        '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' +
        '\x3Cspan class="sem">' + etiquette(sem.i) + '\x3C/span>\x3C/button>' +
        '\x3Cspan class="resume">' + resume.join('') + '\x3C/span>' + jauge + '\x3C/span>' +
        (ouvert ? '\x3Cul class="journal-liste">' + lignes + '\x3C/ul>' : '') +
        '\x3C/div>';
    }).join('');

    zone.innerHTML = html || '\x3Cdiv class="journal-vide">Aucun changement de ce type dans l’historique.\x3C/div>';
  }

  /* ============================================================
     APERÇU
     Avec un seul relevé, le graphique n'a rien à tracer et personne ne voit
     à quoi servira la page. Un bouton fabrique donc un historique fictif à
     partir des comptes du jour — sous bandeau, pour qu'il soit impossible de
     le prendre pour du réel.
     ============================================================ */
  /* Un relevé complet à partir d'une carte plan par plan — les mêmes comptes,
     globaux et par dimension, que releveDepuis() tire des plans vivants. Les
     relevés fabriqués ont ainsi tout ce qu'ont les relevés archivés : la
     courbe d'un groupe, son rythme et sa fin estimée marchent à l'identique. */
  function releveDeCarte(semaine, carte) {
    var r = { semaine: semaine, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, groupes: {}, plans: carte };
    CLES_DIM.forEach(function (d) { r.groupes[d] = {}; });
    Object.keys(carte).forEach(function (ref) {
      var etat = classer(carte[ref]);
      r.total++;
      r[etat]++;
      /* Une ancienne référence retrouve son plan par la racine. */
      var p = planDeRef(ref);
      if (!p) return;
      CLES_DIM.forEach(function (d) {
        var v = String(valeurDim(p, d) || '—');
        if (!r.groupes[d][v]) r.groupes[d][v] = { total: 0, termine: 0 };
        r.groupes[d][v].total++;
        if (etat === 'termine') r.groupes[d][v].termine++;
      });
    });
    return r;
  }

  /* Neuf semaines d'historique fictif, en semaines réelles : la dernière est
     la vraie « aujourd'hui », les autres remontent d'une semaine chacune.
     Les terminés montent régulièrement jusqu'aux comptes du jour ; et les
     cartes portent, de façon déterministe par rang de plan, tout ce que le
     journal sait reconnaître — sinon l'exemple ne montrerait que des
     « passés en terminé », et la chef n'y verrait jamais un changement
     d'indice :
       · des retours en arrière : un plan en cours aujourd'hui était terminé
         jusqu'à la semaine dernière (→ passé en cours), un plan à faire était
         en cours (→ repassé à faire) ;
       · des plans apparus : absents des cartes anciennes (→ nouveaux) ;
       · des plans disparus : présents dans les cartes anciennes sous une
         référence que la feuille ne porte plus (→ disparus) ;
       · des réémissions : pour trois plans à référence UD valide, les cartes
         anciennes portent l'indice précédent (→ changements d'indice, par
         appariement de racine).
     Les écarts sont posés sur la dernière transition pour que le comparatif
     « depuis l'import » les montre tous, et quelques-uns plus tôt pour que
     le journal en ait à plusieurs semaines. */
  function relevesDExemple() {
    var c = compte(PLANS);
    var semaines = 8;
    var retours = {}, apparus = {}, reemis = {}, disparus = [];
    var nbReemis = 0;
    PLANS.forEach(function (p, i) {
      if (p._etat === 'encours' && i % 53 === 7) retours[p.reference] = { avant: 'Terminé', jusque: semaines - 1 };
      else if (p._etat === 'afaire' && i % 59 === 11) retours[p.reference] = { avant: 'En cours', jusque: semaines - 1 };
      if (i === 3 || i === 11) apparus[p.reference] = semaines - 1;
      else if (i === 19) apparus[p.reference] = semaines - 4;
      var ud = analyserUD(p.reference);
      if (ud.valide && ud.indice !== 'A' && nbReemis < 3 && i % 7 === 2) {
        reemis[p.reference] = { ancienne: ud.racine + ud.solution + String.fromCharCode(ud.indice.charCodeAt(0) - 1),
                                jusque: nbReemis === 0 ? semaines - 1 : semaines - 3 - nbReemis };
        nbReemis++;
      }
      /* Une référence que la feuille ne porte plus : les trois lettres
         changées, elle ne partage sa racine avec aucun plan — jamais appariée. */
      if (i === 5 || i === 13) disparus.push('XXX' + p.reference.slice(3));
    });
    var faux = [];
    for (var k = 0; k <= semaines; k++) {
      var part = 0.25 + (0.75 * k) / semaines;      // montée régulière jusqu'à aujourd'hui
      var termine = Math.round(c.termine * part);
      /* Un avancement plan par plan, sinon le journal resterait vide et
         l'exemple ne montrerait que la moitié de ce que fera la page. */
      var carte = {};
      var atteint = 0;
      PLANS.forEach(function (p) {
        var ref = p.reference;
        if (apparus[ref] !== undefined && k <= apparus[ref]) return;
        var valeur = (p._etat === 'termine' && atteint++ >= termine) ? 'En cours' : p.avancement;
        if (retours[ref] && k <= retours[ref].jusque) valeur = retours[ref].avant;
        carte[(reemis[ref] && k <= reemis[ref].jusque) ? reemis[ref].ancienne : ref] = valeur;
      });
      if (k < semaines) disparus.forEach(function (ref) { carte[ref] = 'En cours'; });
      faux.push(releveDeCarte(etiquetteISO(dateDeBase(BASE_REELLE, AUJ_REEL - semaines + k)), carte));
    }
    return faux;
  }

  /* Le mode « Exemple » est une source comme une autre : la source réelle,
     avec l'historique fabriqué à la place de l'archivé. Elle passe par
     chargerSource() comme le reste — c'est ce qui garantit que l'exemple
     montre exactement ce que la page fera, ni plus ni moins. */
  function basculerExemple(actif) {
    if (actif === !!vue.exemple) return;
    chargerSource(actif ? exempleDe(SRC_REELLE) : SRC_REELLE);
    remplirDims();
    rendre();
  }

  /* L'exemple d'une source réelle. Devant des plans, c'est leur historique
     fabriqué : les plans restent les vrais, seule la courbe est inventée.
     Devant un classeur qui n'a rien donné — pas encore d'onglet, feuille
     vide —, c'est la démonstration entière, trois contrats fictifs : la page
     se montre au lieu de s'ouvrir vide, et dit pourquoi. */
  function exempleDe(reelle) {
    if (!reelle.plans.length) return demonstration(jeuDExemple(), reelle.message);
    var exemple = {};
    Object.keys(reelle).forEach(function (k) { exemple[k] = reelle[k]; });
    exemple.releves = relevesDExemple();
    exemple.exemple = true;
    return exemple;
  }

  /* Un jeu d'exemple marqué comme démonstration, avec ce que le classeur
     avait à dire — c'est la raison d'être là. */
  function demonstration(jeu, message) {
    jeu.exemple = true;
    jeu.demonstration = true;
    jeu.message = message || '';
    return jeu;
  }

  /* L'interrupteur vit en haut de page : il porte sur tout, pas sur un bloc.
     Au premier import il montre ce que la page dira plus tard ; après, il sert
     encore à l'expliquer à quelqu'un. */
  document.querySelector('#mode-donnees').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    basculerExemple(b.dataset.mode === 'exemple');
  });

  /* Le périmètre porte sur toute la page : un clic, et tout se recalcule —
     comparatif compris. Cliquer la puce déjà pressée ne change rien. */
  $('choix-perimetre').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-perimetre]');
    if (!b || b.dataset.perimetre === vue.perimetre) return;
    vue.perimetre = b.dataset.perimetre;
    rendre();
  });

  /* ============================================================
     CHANGEMENT DE CONTRAT
     Dans l'add-on, le paquet du contrat demandé vient du classeur par le pont
     SUIVI_FWD_API ; seule, la page fabrique le jeu d'exemple correspondant.
     Dans les deux cas la nouvelle source passe par chargerSource() : le
     cadrage et les filtres repartent de zéro, la disposition est conservée.
     ============================================================ */
  var demandeContrat = 0;
  function changerContrat(id) {
    if (!id || id === CONTRAT) return;
    var sel = $('select-contrat'), etat = $('etat-contrat');
    var demande = ++demandeContrat;
    function poser(paquet) {
      if (demande !== demandeContrat) return;        // une demande plus récente a pris le relais
      if (!paquet || !paquet.plans || !paquet.plans.length) {
        sel.disabled = false;
        sel.value = CONTRAT;
        etat.textContent = paquet && paquet.message ? paquet.message : 'Contrat impossible à charger.';
        return;
      }
      /* Sous la démonstration, le contrat suivant est fictif lui aussi, et
         la source réelle — vide — n'est pas touchée. */
      if (SRC && SRC.demonstration) {
        chargerSource(demonstration(paquet, SRC.message));
        remplirDims();
        rendre();
        return;
      }
      /* En mode « Exemple », le nouveau contrat arrive en exemple aussi —
         son historique fabriqué à lui — au lieu de rebasculer sans un mot
         sur les données réelles. */
      var exemple = !!vue.exemple;
      chargerSource(paquet);
      if (exemple) { basculerExemple(true); return; }
      remplirDims();
      rendre();
    }
    if (API && API.chargerContrat && !(SRC && SRC.demonstration)) {
      sel.disabled = true;
      etat.textContent = 'Chargement…';
      API.chargerContrat(id, poser);
    } else {
      poser(jeuDExemple(id));
    }
  }
  $('select-contrat').addEventListener('change', function (e) { changerContrat(e.target.value); });


  /* ============================================================
     LES DEUX VUES DU TABLEAU

     « Toutes les colonnes » : l'export tel quel, toutes les colonnes, dans
     l'ordre de la feuille. C'est la vue de référence — celle sur laquelle tout
     le monde parle de la même chose.

     « Vue essentielle » : la poignée de colonnes qu'on regarde vraiment, dans
     l'ordre voulu.

     Rien entre les deux, et chacune se retrouve à l'identique en revenant.
     ============================================================ */
  /* ORDRE_FEUILLE est dérivé de la source dans chargerSource(). */
  function appliquerVueTable() {
    if (vue.vueTable === 'essentielle') {
      var garder = {};
      CLES_ESSENTIELLES.forEach(function (c) { garder[c] = true; });
      vue.cachees = {};
      COLONNES.forEach(function (c) { if (!garder[c.cle]) vue.cachees[c.cle] = true; });
      vue.ordre = CLES_ESSENTIELLES.slice()
        .concat(ORDRE_FEUILLE.filter(function (c) { return CLES_ESSENTIELLES.indexOf(c) === -1; }));
    } else {
      vue.cachees = {};
      vue.ordre = ORDRE_FEUILLE.slice();
    }
  }

  /* ============================================================
     FILTRES ACTIFS
     On clique un périmètre, un état, un groupe, une ligne du journal… et plus
     personne ne sait ce qui reste posé. Le bandeau nomme chaque filtre et
     donne sa croix ; il colle en haut de la page, donc la sortie est toujours
     à portée.
     ============================================================ */
  function filtresPoses() {
    var liste = [];
    /* Le périmètre d'abord : c'est le plus large, et il se retire comme les autres. */
    if (vue.perimetre) liste.push({ cle: 'perimetre', mot: 'Périmètre', valeur: vue.perimetre });
    if (vue.etat) liste.push({ cle: 'etat', mot: 'État', valeur: ETAT_PAR_CLE[vue.etat].libelle });
    if (vue.groupe) {
      liste.push({
        cle: 'groupe',
        mot: TITRE_DIM[vue.groupe.dim] || 'Groupe',
        valeur: libelleGroupe(vue.groupe.val)
      });
    }
    if (vue.refs) {
      var n = Object.keys(vue.refs).length;
      /* Un lot du comparatif se nomme par son libellé, pas par sa clé — et au
         pluriel : le bandeau nomme une catégorie, il ne compte pas. */
      var lot = LOTS_DELTA.filter(function (l) { return l.cle === vue.refsLibelle; })[0];
      /* Un lot de la comparaison se nomme par la phrase même du verdict :
         le jeton redit ce qu'on vient de cliquer, mot pour mot. */
      var lotRapp = LOTS_RAPPROCHEMENT.filter(function (l) { return 'rapprochement:' + l.cle === vue.refsLibelle; })[0];
      if (lotRapp) liste.push({ cle: 'refs', mot: 'Comparaison', valeur: phraseLot(lotRapp.cle, compteLotRapp(lotRapp.cle), nomSeconde()) });
      else liste.push({ cle: 'refs', mot: 'Sélection', valeur: lot ? lot.des : (vue.refsLibelle || (n + ' plans')) });
    }
    if (vue.lotLa) {
      var lotLa = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === vue.lotLa; })[0];
      if (lotLa) liste.push({ cle: 'lotLa', mot: 'Comparaison', valeur: phraseLot(lotLa.cle, compteLotRapp(lotLa.cle), nomSeconde()) });
    }
    Object.keys(vue.vides).forEach(function (k) {
      if (vue.vides[k]) liste.push({ cle: 'vide:' + k, mot: PAR_CLE[k].titre, valeur: 'non renseigné' });
    });
    Object.keys(vue.filtres).forEach(function (k) {
      if (vue.filtres[k]) liste.push({ cle: 'filtre:' + k, mot: PAR_CLE[k].titre, valeur: vue.filtres[k] });
    });
    if (vue.recherche) liste.push({ cle: 'recherche', mot: 'Recherche', valeur: vue.recherche });
    /* La recherche dans le tableau de là, posée par un clic sur une référence
       seulement là : elle se voit et se retire comme les autres. */
    if (RAPPROCHEMENT && vue.seconde.recherche) liste.push({ cle: 'rechercheLa', mot: 'Recherche dans ' + nomSeconde(), valeur: vue.seconde.recherche });
    return liste;
  }

  function retirerFiltre(cle) {
    if (cle === 'etat') vue.etat = '';
    else if (cle === 'perimetre') vue.perimetre = '';
    else if (cle === 'groupe') vue.groupe = null;
    else if (cle === 'refs') { vue.refs = null; vue.refsLibelle = ''; }
    else if (cle === 'lotLa') vue.lotLa = null;
    else if (cle === 'recherche') { vue.recherche = ''; $('recherche').value = ''; }
    else if (cle === 'rechercheLa') { vue.seconde.recherche = ''; $('recherche-seconde').value = ''; }
    else if (cle.indexOf('vide:') === 0) delete vue.vides[cle.slice(5)];
    else if (cle.indexOf('filtre:') === 0) delete vue.filtres[cle.slice(7)];
  }

  function toutEffacer() {
    vue.recherche = ''; vue.etat = ''; vue.filtres = {}; vue.groupe = null; vue.vides = {};
    vue.refs = null; vue.refsLibelle = '';
    vue.perimetre = '';
    vue.lotLa = null;
    vue.base = 'ici';
    vue.seconde.recherche = ''; $('recherche-seconde').value = '';
    $('recherche').value = '';
  }

  function rendreFiltresActifs() {
    var zone = $('filtres-actifs');
    var poses = filtresPoses();
    zone.hidden = !poses.length;
    if (!poses.length) { zone.innerHTML = ''; return; }
    zone.innerHTML = '\x3Cspan class="mot">Filtres\x3C/span>' +
      poses.map(function (f) {
        return '\x3Cspan class="jeton">' + (f.mot ? ech(f.mot) + ' : ' : '') +
          '\x3Cb>' + ech(f.valeur) + '\x3C/b>' +
          '\x3Cbutton class="x" type="button" data-retirer="' + ech(f.cle) +
          '" aria-label="Retirer ce filtre" title="Retirer ce filtre">×\x3C/button>\x3C/span>';
      }).join('') +
      '\x3Cbutton class="tout-effacer" type="button" id="tout-effacer">Tout effacer\x3C/button>';
  }

  function rendreIncomplets() {
    var col = PAR_CLE[COLONNE_SUIVIE];
    var plans = population();
    var n = 0;
    for (var i = 0; i < plans.length; i++) {
      if (String(plans[i][COLONNE_SUIVIE] == null ? '' : plans[i][COLONNE_SUIVIE]).trim() === '') n++;
    }
    /* Sans colonne d'avancement reconnue (le serveur prévient, la page
       s'affiche tout en « non renseigné »), il n'y a rien à filtrer. */
    if (!col || !n) { $('incomplets').innerHTML = ''; return; }
    $('incomplets').innerHTML =
      '\x3Cbutton class="puce-vide" type="button" data-vide="' + COLONNE_SUIVIE + '" aria-pressed="' + !!vue.vides[COLONNE_SUIVIE] +
      '" title="N\u2019afficher que les plans dont ' + ech(col.titre) + ' est vide">' +
      ech(col.titre) + ' non renseign\u00e9 \x3Cb>' + nb(n) + '\x3C/b>\x3C/button>';
  }

  function majOmbre() {
    var d = $('defile');
    $('cadre-tableau').dataset.deborde = (d.scrollWidth - d.clientWidth - d.scrollLeft) > 4 ? 'true' : 'false';
  }

  /* La section « Comparaison des bases de données » : une phrase, deux
     cercles, six verdicts, puis plan par plan. Historiquement : une phrase, quatre compteurs, la
     liste dépliable de ce qui n'est pas dans le tableau, le détail des écarts.
     Absente quand la source ne décrit aucune seconde base. */
  function pastilleVerdict(cat) {
    var classe = { accord: 'accord', emission: 'indice', avance: 'avance', manque: 'manque', attente: 'attente', seul: 'seul' }[cat];
    if (!classe) return '\x3Cspan class="pastille sans">\x3C/span>';
    return '\x3Cspan class="pastille ' + classe + '">\x3C/span>';
  }
  var MOT_VERDICT = {
    accord: 'Terminé dans GATES, connu de SEE',
    emission: 'Le même plan, sous un autre indice',
    avance: 'Connu de SEE, mais pas terminé dans GATES',
    seul: 'Aucun plan de GATES sous cette racine'
  };
  /* Le titre d'un segment ou la ligne de tête d'une bulle : le compte et le mot. */
  function motLotRapp(cle, n, nom) {
    var pl = n > 1;
    if (cle === 'accord') return nb(n) + (pl ? ' terminés et dans ' : ' terminé et dans ') + nom;
    if (cle === 'emission') return nb(n) + ' sous un autre indice';
    if (cle === 'avance') return nb(n) + ' dans ' + nom + (pl ? ' sans être terminés ici' : ' sans être terminé ici');
    if (cle === 'manque') return nb(n) + (pl ? ' terminés absents de ' : ' terminé absent de ') + nom;
    if (cle === 'attente') return nb(n) + ' pas encore dans ' + nom;
    return nb(n) + (pl ? ' lignes seulement dans ' : ' ligne seulement dans ') + nom;
  }
  function rendreRapprochement() {
    var zone = $('rapprochement');
    if (!RAPPROCHEMENT) { zone.hidden = true; return; }
    zone.hidden = false;
    var R = RAPPROCHEMENT, rap = SRC.rapprochement, nom = nomSeconde();
    /* Le titre suffit : la phrase et le compte redisaient ce que la figure
       et les verdicts montrent, et personne ne les lisait. */
    $('titre-rapprochement').textContent = 'Comparaison des bases de données';

    /* Les comptes : un plan d'ici dans une seule case, et à part ce que la
       seconde base est seule à connaître. */
    var comptes = {};
    LOTS_RAPPROCHEMENT.forEach(function (l) { comptes[l.cle] = compteLotRapp(l.cle); });
    var nP = R.nbPlans, nSeuls = comptes.seul;

    /* La figure : deux cercles, ce qu'ils ont en commun au milieu — avec un
       anneau pour la part de plans d'accord — et ce que chacun est seul à
       connaître sur les côtés. À la première apparition d'une source,
       l'anneau se trace sous les yeux du lecteur — quand la section entre
       dans l'écran, pas avant. */
    var figure = $('venn-rapprochement');
    figure.innerHTML = figureRapprochement(comptes, R, nom, !!vue.perimetre);
    if (ANIMER_FIGURE) { ANIMER_FIGURE = false; animerALApparition(figure); }
    var membres = LOTS_RAPPROCHEMENT.filter(function (l) { return comptes[l.cle] && l.cle !== 'seul'; })
      .map(function (l) { return motLotRapp(l.cle, comptes[l.cle], nom); });
    figure.setAttribute('aria-label', 'Comparaison GATES / ' + nom + ' : ' +
      (membres.length ? membres.join(', ') + ', sur ' + nb(nP) + (nP > 1 ? ' plans' : ' plan') : 'aucun plan') +
      (nSeuls ? ' ; ' + motLotRapp('seul', nSeuls, nom) : '') + '.');

    /* Les verdicts : une ligne par lot, le nombre puis la phrase. Un lot
       à 0 se lit mais ne se clique pas — la colonne sert aussi de légende. */
    var actif = lotRappActif();
    $('verdicts-rapprochement').innerHTML = LOTS_RAPPROCHEMENT.map(function (l) {
      var n = comptes[l.cle], presse = !!n && actif === l.cle;
      return '\x3Cbutton class="verdict" type="button" data-cle="' + l.cle + '" data-rapp="' + l.cle + '" data-atterrit="' + l.atterrit +
        '" aria-pressed="' + presse + '"' + (n ? '' : ' disabled') + '>' +
        pastilleVerdict(l.segment) + '\x3Cspan class="verdict-n">' + nb(n) + '\x3C/span>' +
        '\x3Cspan class="verdict-mot">' + ech(phraseLot(l.cle, n, nom)) + '\x3C/span>\x3C/button>';
    }).join('');

    rendreListeRapprochement(comptes, nom);
  }

  /* Plan par plan, sous les cercles : les lots dans l'ordre des priorités —
     ce qu'il faut regarder d'abord (terminés que la seconde base ignore,
     connus d'elle mais pas terminés ici, autre indice, seulement là), puis
     ce qui va (pas encore là, d'accord), replié. Une ligne par plan : la
     référence, l'état GATES, ce que la seconde base en dit. */
  var ORDRE_LISTE_RAPP = ['manque', 'avance', 'emission', 'seul', 'attente', 'accord'];
  /* Le tri des références se rejoue à chaque rendu : un comparateur
     construit une fois (Intl.Collator, quand le navigateur l'a) coûte vingt
     fois moins que localeCompare avec ses options à chaque paire. */
  var COMPARER_REF = (window.Intl && Intl.Collator)
    ? new Intl.Collator('fr', { numeric: true, sensitivity: 'base' }).compare
    : function (a, b) { return a.localeCompare(b, 'fr', { numeric: true, sensitivity: 'base' }); };
  var DEPLIES_PAR_DEFAUT = { manque: true, avance: true, emission: true, seul: true };
  function groupeRappOuvert(cle) {
    return vue.plisRapp[cle] !== undefined ? !!vue.plisRapp[cle] : !!DEPLIES_PAR_DEFAUT[cle];
  }
  /* Les rangées d'un lot. Pour un plan d'ici : sa référence, son état, et
     ce que la seconde base en dit — absent, présent, ou sous quel indice.
     Pour une ligne seulement là : sa référence recomposée, et la valeur de
     sa première colonne de référence (NAME), qui sert à la retrouver dans le
     tableau de là. */
  function rangeesLotRapp(cle) {
    var R = RAPPROCHEMENT, rap = SRC.rapprochement;
    if (cle === 'seul') {
      var premiere = Array.isArray(rap.cleReference) ? rap.cleReference[0] : rap.cleReference;
      return R.lignes.filter(function (e) { return e.cat === 'seul'; }).map(function (e) {
        return { ref: e.ref, plan: null, la: String(e.ligne[premiere] == null ? '' : e.ligne[premiere]).trim() || e.ref, see: 'présent' };
      });
    }
    if (cle === 'emission') {
      return R.emission.map(function (x) {
        return { ref: x.plan.reference, plan: x.plan, vers: x.indice_la, see: 'sous l\u2019indice ' + x.indice_la + ' (' + x.ref_la + ')' };
      });
    }
