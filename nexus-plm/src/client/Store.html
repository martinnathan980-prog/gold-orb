<script>
// ============================================================
// NEXUS PLM — état de l'application. Aucun accès au DOM.
//
// Adressage par clé métier (PN Global, ID_Ligne), jamais par position de
// tableau : un index se périme dès qu'une ligne est supprimée ailleurs.
// ============================================================

const CLE_REGLAGES = 'nexus-plm.reglages.v1';

const Store = {
  boites: [],
  nomenclature: [],
  headersBoites: [],
  headersNom: [],
  config: { multiBoite: [], multiNom: [], lectureSeuleNom: [], statuts: [], porteurs: [] },
  catalogue: [],
  // Cible du catalogue ouvert : où ranger le composant choisi.
  cibleCatalogue: null,
  // Comparaison affichée : { sorte, cle, portee }.
  comparaison: null,

  pnCourant: null,
  idNomCourant: null,
  ongletActif: 'Toutes',
  recherche: '',
  filtreComposants: [],
  filtreTypes: [],
  filtreStatut: null,        // un statut, ou rien
  // Deux espaces, deux bases. L'espace « boîtes » et ses trois lectures ;
  // l'espace « composants », qui a ses propres filtres et ne partage rien.
  espace: 'boites',          // 'boites' ou 'composants'
  vueMode: 'boites',         // dans l'espace boîtes : 'boites', 'pieces', 'standardisation'
  compo: { recherche: '', famille: null, fonction: null, norme: null,
           etat: null, emploi: null, tri: 'emploi',
           vue: 'liste' },        // 'liste', 'matrice' (par porteur) ou 'carte'
  tri: 'pn',
  enEditionBoite: false,
  enEditionNom: {},

  // Réglages d'équivalence, modifiables en direct depuis la comparaison.
  // Les poids sont des PARTS : leur somme vaut toujours 100 sur les critères
  // actifs. Bouger un curseur redistribue les autres.
  poids: {},
  criteresActifs: {},
  seuilEquivalence: 15,
  reglagesDetaille: false,   // les curseurs, repliés derrière l'engrenage
  resultatDeplie: null,      // le candidat dont on regarde le détail
  ficheComposant: null,      // { categorie, fonction } quand le panneau sert les composants
  branchesDepliees: {},      // les sous-ensembles ouverts dans la fiche, par ID_Ligne
  pileFiches: [],            // d'où l'on vient dans le panneau : [{ pn } | { composant }]

  // Charge utile de la dernière suppression, conservée pour l'annulation.
  derniereSuppression: null,

  _texteRecherche: new Map()
};

function CLE_NOM() { return 'ID_Ligne'; }
function CLE_PN()  { return 'PN Global'; }

/** Les porteurs proposés : ceux du serveur, sinon ceux du registre. */
function porteursConnus() {
  const liste = Store.config && Array.isArray(Store.config.porteurs) ? Store.config.porteurs : [];
  return liste.length ? liste.slice() : PORTEURS.slice();
}

// ------------------------------------------------------------
// Réglages : par défaut ceux du registre, puis ce que l'utilisateur a choisi
// ------------------------------------------------------------
function poidsParDefaut() {
  const tout = {};
  PORTEES.forEach(function (p) {
    tout[p.cle] = {};
    p.criteres.forEach(function (c) { tout[p.cle][c.cle] = c.poids; });
  });
  return tout;
}

function actifsParDefaut() {
  const tout = {};
  PORTEES.forEach(function (p) {
    tout[p.cle] = p.criteres.map(function (c) { return c.cle; });
  });
  return tout;
}

function porteeParCle(cle) {
  return PORTEES.find(function (p) { return p.cle === cle; }) || PORTEES[0];
}

/**
 * Tant que les réglages n'ont pas été chargés, TOUS les critères comptent.
 * L'ancien repli — une liste vide — donnait un score de 0 sur tout, sans
 * message : un classement d'équivalences entièrement à zéro se lit comme
 * « rien ne se ressemble », alors que c'est « rien n'a été comparé ».
 */
function clesActives(portee) {
  const liste = Store.criteresActifs[portee];
  return Array.isArray(liste) ? liste
                              : porteeParCle(portee).criteres.map(function (c) { return c.cle; });
}

function criteresActifs(portee) {
  const liste = clesActives(portee);
  // On respecte l'ordre du registre, pas celui des clics.
  return porteeParCle(portee).criteres.filter(function (c) {
    return liste.indexOf(c.cle) !== -1;
  });
}

function critereEstActif(portee, cle) {
  return clesActives(portee).indexOf(cle) !== -1;
}

/**
 * La table des parts d'une portée, créée à la demande. Comme pour les
 * critères actifs, l'état initial de Store est vide : tout ce qui touche aux
 * poids avant le chargement des réglages plantait sur un objet absent.
 */
function tablePoids(portee) {
  if (!Store.poids[portee]) {
    Store.poids[portee] = {};
    porteeParCle(portee).criteres.forEach(function (c) { Store.poids[portee][c.cle] = c.poids; });
  }
  return Store.poids[portee];
}

/**
 * Ramène la somme des parts actives à exactement 100.
 * L'écart d'arrondi est absorbé par la part la plus grande, pour qu'aucun
 * total affiché ne fasse 99 ou 101 %.
 */
function normaliserPoids(portee) {
  const actifs = criteresActifs(portee);
  const table = tablePoids(portee);
  if (!actifs.length) return;
  if (actifs.length === 1) { table[actifs[0].cle] = 100; return; }

  let somme = actifs.reduce(function (t, c) { return t + Math.max(0, Number(table[c.cle]) || 0); }, 0);
  if (somme <= 0) {
    const part = Math.floor(100 / actifs.length);
    actifs.forEach(function (c) { table[c.cle] = part; });
  } else {
    actifs.forEach(function (c) {
      table[c.cle] = Math.round((Math.max(0, Number(table[c.cle]) || 0) / somme) * 100);
    });
  }
  const total = actifs.reduce(function (t, c) { return t + table[c.cle]; }, 0);
  if (total !== 100) {
    const plusGrand = actifs.reduce(function (a, b) {
      return table[a.cle] >= table[b.cle] ? a : b;
    });
    table[plusGrand.cle] += 100 - total;
  }
}

/**
 * Fixe la part d'un critère et redistribue le reste sur les autres,
 * proportionnellement à ce qu'ils valaient. Le total reste à 100.
 */
function reglerPoids(portee, cle, valeur) {
  const actifs = criteresActifs(portee);
  const table = tablePoids(portee);
  const voulue = Math.max(0, Math.min(100, Math.round(Number(valeur) || 0)));

  if (actifs.length <= 1) { if (actifs.length) table[actifs[0].cle] = 100; return; }

  const autres = actifs.filter(function (c) { return c.cle !== cle; });
  const resteAvant = autres.reduce(function (t, c) { return t + Math.max(0, Number(table[c.cle]) || 0); }, 0);
  const resteApres = 100 - voulue;

  if (resteAvant > 0) {
    autres.forEach(function (c) {
      table[c.cle] = (Math.max(0, Number(table[c.cle]) || 0) / resteAvant) * resteApres;
    });
  } else {
    autres.forEach(function (c) { table[c.cle] = resteApres / autres.length; });
  }
  table[cle] = voulue;

  // Arrondis : on répartit sans toucher à la valeur que l'utilisateur vient
  // de poser, sinon le curseur « glisserait » sous le doigt.
  autres.forEach(function (c) { table[c.cle] = Math.round(table[c.cle]); });
  const total = actifs.reduce(function (t, c) { return t + table[c.cle]; }, 0);
  if (total !== 100 && autres.length) {
    const plusGrand = autres.reduce(function (a, b) {
      return table[a.cle] >= table[b.cle] ? a : b;
    });
    table[plusGrand.cle] = Math.max(0, table[plusGrand.cle] + (100 - total));
  }
}

function activerCritere(portee, cle) {
  if (critereEstActif(portee, cle)) return;
  Store.criteresActifs[portee] = clesActives(portee).concat([cle]);
  // Le nouveau critère prend une part équitable, prise sur les autres.
  const actifs = criteresActifs(portee);
  reglerPoids(portee, cle, Math.round(100 / actifs.length));
  enregistrerReglages();
}

function desactiverCritere(portee, cle) {
  const restants = clesActives(portee).filter(function (c) { return c !== cle; });
  if (!restants.length) return false;          // on ne retire pas le dernier
  Store.criteresActifs[portee] = restants;
  tablePoids(portee)[cle] = 0;
  normaliserPoids(portee);
  enregistrerReglages();
  return true;
}

/**
 * Les parts d'un favori, ramenées à 100 % exactement. Elles sont écrites en
 * relatif dans le registre — c'est plus lisible — donc on les normalise ici
 * plutôt que d'exiger que chaque favori totalise déjà 100.
 */
function normaliserFavori(favori) {
  const cles = Object.keys(favori.poids);
  const somme = cles.reduce(function (t, c) { return t + Math.max(0, favori.poids[c]); }, 0);
  const sortie = {};
  if (!cles.length || somme <= 0) return sortie;

  cles.forEach(function (c) {
    sortie[c] = Math.round((Math.max(0, favori.poids[c]) / somme) * 100);
  });
  // L'arrondi est absorbé par la plus grosse part : le total fait 100 pile.
  const total = cles.reduce(function (t, c) { return t + sortie[c]; }, 0);
  if (total !== 100) {
    const plusGrand = cles.reduce(function (a, b) { return sortie[a] >= sortie[b] ? a : b; });
    sortie[plusGrand] += 100 - total;
  }
  return sortie;
}

/**
 * Pose un favori : les critères qu'il nomme deviennent les critères retenus,
 * avec ses parts. Les autres sont écartés — c'est le sens d'un favori, il dit
 * aussi ce qui ne compte PAS.
 */
function appliquerFavori(portee, cle) {
  const favori = (favorisDe(portee) || []).find(function (f) { return f.cle === cle; });
  if (!favori) return false;
  const parts = normaliserFavori(favori);
  const cles = Object.keys(parts);
  if (!cles.length) return false;

  Store.criteresActifs[portee] = porteeParCle(portee).criteres
    .filter(function (c) { return parts[c.cle] !== undefined; })
    .map(function (c) { return c.cle; });

  const table = tablePoids(portee);
  porteeParCle(portee).criteres.forEach(function (c) {
    table[c.cle] = parts[c.cle] !== undefined ? parts[c.cle] : 0;
  });
  normaliserPoids(portee);
  enregistrerReglages();
  return true;
}

function reinitialiserPoids() {
  Store.poids = poidsParDefaut();
  Store.criteresActifs = actifsParDefaut();
  Store.seuilEquivalence = 15;
  PORTEES.forEach(function (p) { normaliserPoids(p.cle); });
  enregistrerReglages();
}

function enregistrerReglages() {
  try {
    localStorage.setItem(CLE_REGLAGES, JSON.stringify({
      poids: Store.poids, actifs: Store.criteresActifs,
      seuil: Store.seuilEquivalence, tri: Store.tri, vue: Store.vueMode,
      espace: Store.espace, vueComposants: Store.compo.vue
    }));
  } catch (e) { /* navigation privée, stockage refusé : sans gravité */ }
}

function chargerReglages() {
  Store.poids = poidsParDefaut();
  Store.criteresActifs = actifsParDefaut();
  try {
    const brut = localStorage.getItem(CLE_REGLAGES);
    if (brut) {
      const lu = JSON.parse(brut);
      // Fusion et non remplacement : un critère ajouté depuis garde sa valeur
      // par défaut au lieu de disparaître.
      if (lu && lu.poids) {
        Object.keys(Store.poids).forEach(function (portee) {
          if (!lu.poids[portee]) return;
          Object.keys(Store.poids[portee]).forEach(function (c) {
            const v = lu.poids[portee][c];
            if (typeof v === 'number' && isFinite(v) && v >= 0) Store.poids[portee][c] = v;
          });
        });
      }
      if (lu && lu.actifs) {
        Object.keys(Store.criteresActifs).forEach(function (portee) {
          const liste = lu.actifs[portee];
          if (!Array.isArray(liste) || !liste.length) return;
          const connus = porteeParCle(portee).criteres.map(function (c) { return c.cle; });
          const filtre = liste.filter(function (c) { return connus.indexOf(c) !== -1; });
          if (filtre.length) Store.criteresActifs[portee] = filtre;
        });
      }
      if (typeof lu.seuil === 'number') Store.seuilEquivalence = lu.seuil;
      if (typeof lu.tri === 'string') Store.tri = lu.tri;
      if (['boites', 'pieces', 'standardisation'].indexOf(lu.vue) !== -1) Store.vueMode = lu.vue;
      if (['boites', 'composants'].indexOf(lu.espace) !== -1) Store.espace = lu.espace;
      if (VUES_COMPOSANTS.some(function (v) { return v.cle === lu.vueComposants; })) {
        Store.compo.vue = lu.vueComposants;
      }
    }
  } catch (e) { /* réglages illisibles : on repart des valeurs par défaut */ }
  PORTEES.forEach(function (p) { normaliserPoids(p.cle); });
}

function poidsModifies() {
  const defautPoids = poidsParDefaut();
  const defautActifs = actifsParDefaut();
  const changeActifs = Object.keys(defautActifs).some(function (p) {
    return defautActifs[p].length !== (Store.criteresActifs[p] || []).length;
  });
  const changePoids = Object.keys(defautPoids).some(function (p) {
    return Object.keys(defautPoids[p]).some(function (c) {
      return Number(Store.poids[p][c]) !== Number(defautPoids[p][c]);
    });
  });
  return changeActifs || changePoids || Store.seuilEquivalence !== 15;
}

// ------------------------------------------------------------
// Chargement et rattachement
// ------------------------------------------------------------
function chargerDonnees(reponse) {
  Store.boites = reponse.boites || [];
  Store.nomenclature = reponse.nomenclature || [];
  Store.headersBoites = reponse.headersBoites || [];
  Store.headersNom = reponse.headersNom || [];
  if (reponse.config) Store.config = reponse.config;
  reconstruireLiens();
}

function reconstruireLiens() {
  const parPn = new Map();
  Store.boites.forEach(function (b) {
    b.nomenclature = [];
    parPn.set(String(b[CLE_PN()]).trim(), b);
  });
  Store.nomenclature.forEach(function (n) {
    n._type = typeDe(n);                       // résolu une fois, pas à chaque rendu
    const parent = parPn.get(String(n[CLE_PN()]).trim());
    if (parent) parent.nomenclature.push(n);
  });
  Store._texteRecherche.clear();
}

// ------------------------------------------------------------
// Mises à jour ciblées : le serveur ne renvoie que ce qui a changé
// ------------------------------------------------------------
function appliquerBoite(boite, pnPrecedent) {
  if (!boite) return;
  const ancien = String(pnPrecedent || boite[CLE_PN()]).trim();
  const idx = Store.boites.findIndex(function (b) {
    return String(b[CLE_PN()]).trim() === ancien;
  });
  if (idx === -1) Store.boites.push(boite); else Store.boites[idx] = boite;

  if (pnPrecedent && String(pnPrecedent).trim() !== String(boite[CLE_PN()]).trim()) {
    Store.nomenclature.forEach(function (n) {
      if (String(n[CLE_PN()]).trim() === ancien) n[CLE_PN()] = boite[CLE_PN()];
    });
    if (Store.pnCourant === pnPrecedent) Store.pnCourant = boite[CLE_PN()];
  }
  reconstruireLiens();
}

function appliquerNom(ligne) {
  if (!ligne) return;
  const id = String(ligne[CLE_NOM()]).trim();
  const idx = Store.nomenclature.findIndex(function (n) {
    return String(n[CLE_NOM()]).trim() === id;
  });
  if (idx === -1) Store.nomenclature.push(ligne); else Store.nomenclature[idx] = ligne;
  reconstruireLiens();
}

function retirerNom(id) {
  const cible = String(id).trim();
  Store.nomenclature = Store.nomenclature.filter(function (n) {
    return String(n[CLE_NOM()]).trim() !== cible;
  });
  delete Store.enEditionNom[cible];
  reconstruireLiens();
}

function retirerBoite(pn) {
  const cible = String(pn).trim();
  Store.boites = Store.boites.filter(function (b) {
    return String(b[CLE_PN()]).trim() !== cible;
  });
  Store.nomenclature = Store.nomenclature.filter(function (n) {
    return String(n[CLE_PN()]).trim() !== cible;
  });
  if (Store.pnCourant === pn) Store.pnCourant = null;
  reconstruireLiens();
}

// ------------------------------------------------------------
// Accès
// ------------------------------------------------------------
function boiteParPn(pn) {
  const cible = String(pn).trim();
  return Store.boites.find(function (b) {
    return String(b[CLE_PN()]).trim() === cible;
  }) || null;
}

function nomParId(id) {
  const cible = String(id).trim();
  return Store.nomenclature.find(function (n) {
    return String(n[CLE_NOM()]).trim() === cible;
  }) || null;
}

function boiteCourante() { return boiteParPn(Store.pnCourant); }

// ------------------------------------------------------------
// Recherche : index sur les VALEURS seules.
// L'ancienne version cherchait dans la sérialisation JSON, donc aussi dans
// les noms de colonnes : « image » ou « commentaires » ramenaient tout.
// ------------------------------------------------------------
function texteRecherche(boite) {
  const cle = String(boite[CLE_PN()]).trim();
  if (Store._texteRecherche.has(cle)) return Store._texteRecherche.get(cle);

  const morceaux = [];
  const ajouter = function (objet) {
    Object.keys(objet).forEach(function (k) {
      if (k === 'nomenclature' || k.charAt(0) === '_') return;
      const v = objet[k];
      if (v !== null && v !== undefined && v !== '') morceaux.push(String(v));
    });
  };
  ajouter(boite);
  (boite.nomenclature || []).forEach(function (l) {
    ajouter(l);
    morceaux.push(typeDe(l).libelle);          // le type résolu est cherchable
  });

  const texte = normaliserTexte(morceaux.join(' \n '));
  Store._texteRecherche.set(cle, texte);
  return texte;
}

function correspond(boite, requete) {
  const q = normaliserTexte(requete);
  if (!q) return true;
  const texte = texteRecherche(boite);
  return q.split(/\s+/).every(function (mot) { return texte.indexOf(mot) !== -1; });
}

/** Tous les composants d'une boîte, ceux de la boîte et ceux de ses structures. */
function composantsDeBoite(boite) {
  const tous = [];
  champsComposants().forEach(function (ch) {
    if (ch.portee === 'boite') {
      listeComposants(boite[ch.cle]).forEach(function (c) { tous.push(c); });
    } else {
      (boite.nomenclature || []).forEach(function (n) {
        if (typeDe(n).cle !== ch.portee) return;
        listeComposants(n[ch.cle]).forEach(function (c) { tous.push(c); });
      });
    }
  });
  return tous;
}

function contientTousComposants(boite, composants) {
  if (!composants.length) return true;
  const presents = composantsDeBoite(boite).map(function (c) { return normaliserTexte(libelleComposant(c)); });
  return composants.every(function (terme) {
    const t = normaliserTexte(terme);
    return presents.some(function (s) { return s.indexOf(t) !== -1; });
  });
}

function contientTypes(boite, types) {
  if (!types.length) return true;
  const presents = new Set((boite.nomenclature || []).map(function (n) { return typeDe(n).cle; }));
  return types.every(function (t) { return presents.has(t); });
}

function aLeStatut(boite, statut) {
  if (!statut) return true;
  return normaliserStatut(boite['Statut']) === normaliserStatut(statut);
}

// ------------------------------------------------------------
// Tri
// ------------------------------------------------------------
const TRIS = {
  pn:       { libelle: 'PN croissant',        fn: function (a, b) { return String(a[CLE_PN()]).localeCompare(String(b[CLE_PN()]), 'fr', { numeric: true }); } },
  fonction: { libelle: 'Fonction',            fn: function (a, b) { return String(a['Fonction']).localeCompare(String(b['Fonction']), 'fr') || String(a[CLE_PN()]).localeCompare(String(b[CLE_PN()]), 'fr'); } },
  statut:   { libelle: 'Statut',              fn: function (a, b) { return rangStatut(a['Statut']) - rangStatut(b['Statut']) || String(a[CLE_PN()]).localeCompare(String(b[CLE_PN()]), 'fr'); } },
  taille:   { libelle: 'Nb de sous-ensembles', fn: function (a, b) { return (b.nomenclature || []).length - (a.nomenclature || []).length; } }
};

function rangStatut(s) {
  const n = normaliserTexte(s);
  if (n === 'valide') return 0;
  if (n === 'en etude') return 1;
  return 2;
}

// ------------------------------------------------------------
// Vue courante : un seul filtrage dont tout dérive
// ------------------------------------------------------------
function calculerVue() {
  const visibles = Store.boites.filter(function (b) {
    return contientTousComposants(b, Store.filtreComposants) &&
           contientTypes(b, Store.filtreTypes) &&
           aLeStatut(b, Store.filtreStatut) &&
           correspond(b, Store.recherche);
  }).sort((TRIS[Store.tri] || TRIS.pn).fn);

  const parFonction = new Map();
  visibles.forEach(function (b) {
    const f = txt(b['Fonction'], 'NON CLASSÉ');
    if (!parFonction.has(f)) parFonction.set(f, []);
    parFonction.get(f).push(b);
  });

  // Onglet devenu orphelin : on ne laisse pas l'utilisateur bloqué sur
  // « aucune boîte » alors que des résultats existent ailleurs.
  const onglet = (Store.ongletActif !== 'Toutes' && !parFonction.has(Store.ongletActif))
                 ? 'Toutes' : Store.ongletActif;
  Store.ongletActif = onglet;

  return {
    visibles: visibles, parFonction: parFonction, onglet: onglet,
    aAfficher: onglet === 'Toutes' ? visibles : (parFonction.get(onglet) || []),
    filtre: !!(Store.recherche || Store.filtreComposants.length || Store.filtreTypes.length ||
               Store.filtreStatut)
  };
}

const SEUIL_DOUBLON = 95;      // en deçà, deux PN proches ne sont pas un doublon
// Le balayage est quadratique : il faut un plafond. L'ancien, 400 paires,
// correspondait à 29 sous-ensembles du même type — toute base réelle passait
// dessous et l'indicateur restait muet. Mesuré : 21 000 paires ≈ 0,6 s, ce qui
// tient pour une action déclenchée au clic. Au-delà, on le dit et on renvoie
// vers le filtrage, car le balayage suit la sélection courante.
const PLAFOND_PAIRES = 21000;

/**
 * Indicateurs orientés RÉUTILISATION : c'est la question que pose l'outil.
 * Compter les lignes n'apprend rien ; savoir combien de pièces servent déjà
 * dans plusieurs boîtes, et combien de PN distincts désignent visiblement la
 * même chose, dit où il y a du travail.
 */
function calculerKpi(liste) {
  const refs = new Set();
  const boitesParPiece = new Map();
  let nbLignes = 0;

  liste.forEach(function (b) {
    const pn = String(b[CLE_PN()]).trim();
    if (pn) refs.add(pn);
    (b.nomenclature || []).forEach(function (n) {
      nbLignes++;
      const piece = String(n['PN du type'] || '').trim();
      if (!piece) return;
      refs.add(piece);
      if (!boitesParPiece.has(piece)) boitesParPiece.set(piece, new Set());
      boitesParPiece.get(piece).add(pn);
    });
  });

  let reutilisees = 0;
  boitesParPiece.forEach(function (boites) { if (boites.size > 1) reutilisees++; });

  const valides = liste.filter(function (b) { return estValide(b['Statut']); }).length;
  return {
    nbBoites: liste.length,
    refsUniques: refs.size,
    nbLignes: nbLignes,
    nbPieces: boitesParPiece.size,
    reutilisees: reutilisees,
    pctReutilisees: boitesParPiece.size
      ? Math.round((reutilisees / boitesParPiece.size) * 100) : 0,
    nbValides: valides,
    pctValides: liste.length ? Math.round((valides / liste.length) * 100) : 0
  };
}

/**
 * Paires de pièces de même type, de PN différents, que les critères courants
 * jugent très proches. Recalculé quand la pondération change : l'indicateur
 * suit les réglages, il ne vit pas sa vie.
 */
function compterDoublonsProbables(liste) {
  const pnVisibles = new Set(liste.map(function (b) { return String(b[CLE_PN()]).trim(); }));
  const parType = new Map();

  Store.nomenclature.forEach(function (n) {
    if (!pnVisibles.has(String(n[CLE_PN()]).trim())) return;
    const cle = typeDe(n).cle;
    if (!parType.has(cle)) parType.set(cle, []);
    parType.get(cle).push(n);
  });

  let total = 0;
  parType.forEach(function (lignes) { total += (lignes.length * (lignes.length - 1)) / 2; });
  if (total > PLAFOND_PAIRES) return { nombre: null, paires: [], tronque: true };

  const paires = [];
  parType.forEach(function (lignes) {
    for (let i = 0; i < lignes.length; i++) {
      for (let j = i + 1; j < lignes.length; j++) {
        const a = String(lignes[i]['PN du type'] || '').trim();
        const b = String(lignes[j]['PN du type'] || '').trim();
        if (!a || !b || normaliserTexte(a) === normaliserTexte(b)) continue;
        const r = comparerSousEnsembles(lignes[i], lignes[j]);
        if (r.mesurable && r.score >= SEUIL_DOUBLON) {
          paires.push({ a: lignes[i], b: lignes[j], score: r.score, type: typeDe(lignes[i]) });
        }
      }
    }
  });
  paires.sort(function (x, y) { return y.score - x.score; });
  return { nombre: paires.length, paires: paires, tronque: false };
}

/**
 * Où une pièce est-elle montée ? C'est la question que pose un outil de
 * réemploi, et elle n'avait pas de réponse directe.
 */
function boitesUtilisant(pnPiece, saufBoite) {
  const cible = normaliserTexte(pnPiece);
  if (!cible) return [];
  const vues = new Set();
  Store.nomenclature.forEach(function (n) {
    if (normaliserTexte(n['PN du type']) !== cible) return;
    const b = String(n[CLE_PN()]).trim();
    if (saufBoite && b === String(saufBoite).trim()) return;
    vues.add(b);
  });
  return Array.from(vues).sort(function (a, b) { return a.localeCompare(b, 'fr'); });
}

/**
 * LA BASE DE COMPOSANTS
 *
 * C'est une base à part entière, pas une lecture de la base des boîtes. Elle
 * réunit DEUX sources qui ne se recouvrent pas :
 *   — le catalogue : ce qu'on a le droit de monter ;
 *   — les montages réels : ce qu'on monte effectivement.
 *
 * Leur différence est l'information la plus utile de la page. Un composant
 * monté mais absent du catalogue est une pièce non maîtrisée ; un composant
 * au catalogue que personne ne monte est un référencement qui dort.
 *
 * Un composant est identifié par sa catégorie et ses trois niveaux : deux
 * références différentes sont deux composants.
 */
const ETAT_COMPOSANT = {
  COURANT:   'courant',    // au catalogue, et monté
  DORMANT:   'dormant',    // au catalogue, jamais monté
  HORS:      'hors'        // monté, absent du catalogue
};

function cleComposant(categorie, c) {
  return categorie + '|' + normaliserTexte(c.fonction) + '|' +
         normaliserTexte(c.norme) + '|' + normaliserTexte(c.reference);
}

function baseComposants(liste) {
  const base = new Map();

  const entree = function (categorie, c) {
    const cle = cleComposant(categorie, c);
    if (!base.has(cle)) {
      base.set(cle, {
        cle: cle, categorie: categorie,
        fonction: c.fonction || '', norme: c.norme || '', reference: c.reference || '',
        designation: '', auCatalogue: false,
        montages: 0, boites: [], porteurs: new Set(), portees: new Set(),
        parPorteur: {}       // porteur -> boîtes qui la montent (pour la matrice)
      });
    }
    return base.get(cle);
  };

  // 1. Le catalogue : le référentiel de ce qu'on a le droit de monter.
  (Store.catalogue || []).forEach(function (ligne) {
    const c = composantDepuisCatalogue(ligne);
    if (!c.fonction && !c.norme && !c.reference) return;
    const e = entree(CATEGORIES_COMPOSANT[c.categorie] ? c.categorie : 'composant', c);
    e.auCatalogue = true;
    if (c.designation) e.designation = c.designation;
  });

  // 2. Les montages réels, dans les boîtes et dans leurs sous-ensembles.
  const recenser = function (categorie, texte, pnBoite, porteurs, portee) {
    listeComposants(texte).forEach(function (c) {
      if (!c.fonction && !c.norme && !c.reference) return;
      const e = entree(categorie, c);
      e.montages++;
      e.portees.add(portee);
      if (e.boites.indexOf(pnBoite) === -1) e.boites.push(pnBoite);
      // Une boîte sans porteur compte quand même : elle va dans une colonne à part.
      const lesPorteurs = valeursMulti(porteurs);
      (lesPorteurs.length ? lesPorteurs : ['']).forEach(function (p) {
        e.porteurs.add(p);
        if (!e.parPorteur[p]) e.parPorteur[p] = [];
        if (e.parPorteur[p].indexOf(pnBoite) === -1) e.parPorteur[p].push(pnBoite);
      });
    });
  };

  (liste || []).forEach(function (b) {
    const pnBoite = String(b[CLE_PN()]).trim();
    const porteurs = b['Porteur'];

    Object.keys(CHAMPS_BOITE).forEach(function (cle) {
      const regle = CHAMPS_BOITE[cle];
      if (regle.genre !== GENRE.COMPOSANTS) return;
      recenser(regle.categorie || 'composant', b[cle], pnBoite, porteurs, 'Boîte');
    });

    (b.nomenclature || []).forEach(function (n) {
      const type = typeDe(n);
      champsDuType(type).forEach(function (champ) {
        if (champ.genre !== GENRE.COMPOSANTS) return;
        recenser(champ.categorie || 'composant', n[champ.cle], pnBoite, porteurs, type.libelle);
      });
    });
  });

  return Array.from(base.values()).map(function (e) {
    e.boites.sort(function (a, b) { return a.localeCompare(b, 'fr', { numeric: true }); });
    e.nbBoites = e.boites.length;
    e.porteurs = Array.from(e.porteurs).filter(Boolean)
      .sort(function (a, b) { return a.localeCompare(b, 'fr'); });
    e.portees = Array.from(e.portees).sort();
    e.etat = !e.auCatalogue ? ETAT_COMPOSANT.HORS
           : e.nbBoites === 0 ? ETAT_COMPOSANT.DORMANT
           : ETAT_COMPOSANT.COURANT;
    return e;
  });
}

/**
 * L'arbre de la base : famille → fonction → norme → références.
 * C'est l'ordre dans lequel on cherche une pièce — on sait ce qu'on veut
 * faire avant de savoir sous quelle norme le chercher.
 */
function arbreComposants(composants) {
  const familles = new Map();

  composants.forEach(function (c) {
    if (!familles.has(c.categorie)) {
      familles.set(c.categorie, {
        cle: c.categorie,
        libelle: (CATEGORIES_COMPOSANT[c.categorie] || CATEGORIES_COMPOSANT.composant).libelle,
        aide: (CATEGORIES_COMPOSANT[c.categorie] || CATEGORIES_COMPOSANT.composant).aide,
        fonctions: new Map(), references: 0, montages: 0, boites: new Set()
      });
    }
    const f = familles.get(c.categorie);
    f.references++; f.montages += c.montages;
    c.boites.forEach(function (b) { f.boites.add(b); });

    const cleF = normaliserTexte(c.fonction) || '\u0000';
    if (!f.fonctions.has(cleF)) {
      f.fonctions.set(cleF, {
        libelle: c.fonction || 'Fonction non précisée',
        normes: new Map(), references: 0, montages: 0, boites: new Set()
      });
    }
    const fo = f.fonctions.get(cleF);
    fo.references++; fo.montages += c.montages;
    c.boites.forEach(function (b) { fo.boites.add(b); });

    const cleN = normaliserTexte(c.norme) || '\u0000';
    if (!fo.normes.has(cleN)) {
      fo.normes.set(cleN, { libelle: c.norme || 'sans norme', lignes: [], montages: 0 });
    }
    const no = fo.normes.get(cleN);
    no.lignes.push(c);
    no.montages += c.montages;
  });

  const parEmploi = function (a, b) { return b.montages - a.montages; };
  const parNom = function (a, b) { return a.libelle.localeCompare(b.libelle, 'fr'); };

  return Array.from(familles.values())
    .map(function (f) {
      f.nbBoites = f.boites.size;
      f.fonctions = Array.from(f.fonctions.values()).map(function (fo) {
        fo.nbBoites = fo.boites.size;
        fo.normes = Array.from(fo.normes.values()).map(function (no) {
          no.lignes.sort(function (a, b) {
            return b.nbBoites - a.nbBoites ||
                   String(a.reference).localeCompare(String(b.reference), 'fr', { numeric: true });
          });
          // Une norme servie par plusieurs références, c'est de la dispersion.
          no.dispersee = no.lignes.filter(function (l) { return l.nbBoites > 0; }).length > 1;
          return no;
        }).sort(parEmploi);
        // Plusieurs normes pour une fonction : dispersion d'un cran au-dessus.
        // Plusieurs normes n'est PAS une dispersion : deux normes différentes
        // ont en général leur raison. La dispersion se juge sous une même norme.
        fo.dispersee = fo.normes.some(function (n) { return n.dispersee; });
        return fo;
      }).sort(function (a, b) { return parEmploi(a, b) || parNom(a, b); });
      return f;
    })
    // L'ordre du registre : composants de boîte, mécanique, routing.
    .sort(function (a, b) {
      const ordre = Object.keys(CATEGORIES_COMPOSANT);
      return ordre.indexOf(a.cle) - ordre.indexOf(b.cle);
    });
}

/** Le bilan de la base, pour la bande de tête de l'espace. */
function bilanComposants(composants) {
  const normes = new Set(), fonctions = new Set();
  let montages = 0, isoles = 0, dormants = 0, hors = 0, montes = 0;
  composants.forEach(function (c) {
    if (c.norme) normes.add(normaliserTexte(c.norme));
    if (c.fonction) fonctions.add(normaliserTexte(c.fonction));
    montages += c.montages;
    if (c.nbBoites > 0) montes++;
    if (c.nbBoites === 1) isoles++;
    if (c.etat === ETAT_COMPOSANT.DORMANT) dormants++;
    if (c.etat === ETAT_COMPOSANT.HORS) hors++;
  });
  return { references: composants.length, normes: normes.size, fonctions: fonctions.size,
           montages: montages, isoles: isoles, dormants: dormants, hors: hors, montes: montes };
}

/**
 * Le filtrage propre à l'espace Composants. Il ne partage rien avec celui
 * des boîtes : on n'y cherche pas la même chose.
 */
function composantsFiltres(liste) {
  const f = Store.compo;
  const q = normaliserTexte(f.recherche);
  return baseComposants(liste).filter(function (c) {
    if (f.famille && c.categorie !== f.famille) return false;
    if (f.fonction && normaliserTexte(c.fonction) !== normaliserTexte(f.fonction)) return false;
    if (f.norme && normaliserTexte(c.norme) !== normaliserTexte(f.norme)) return false;
    if (f.etat && c.etat !== f.etat) return false;
    if (f.emploi === 'isole' && c.nbBoites !== 1) return false;
    if (f.emploi === 'partage' && c.nbBoites < 2) return false;
    if (!q) return true;
    return normaliserTexte([c.fonction, c.norme, c.reference, c.designation].join(' ')).indexOf(q) !== -1;
  });
}

function filtreComposantActif() {
  const f = Store.compo;
  return !!(f.recherche || f.famille || f.fonction || f.norme || f.etat || f.emploi);
}

/** Les trois lectures de l'espace Composants. */
const VUES_COMPOSANTS = [
  { cle: 'liste',   libelle: 'Liste',        aide: 'Une fonction par ligne, triable' },
  { cle: 'matrice', libelle: 'Par porteur',  aide: 'Qui monte quoi, programme par programme' },
  { cle: 'carte',   libelle: 'Carte',        aide: 'Toute la base en une image' }
];

/**
 * Les porteurs dans l'ordre du registre, puis les inconnus par ordre
 * alphabétique, et la colonne « sans porteur » en dernier si elle sert.
 */
function ordonnerPorteurs(presents) {
  const liste = Array.from(presents);
  const rang = function (p) {
    if (p === '') return 1e6;
    const i = PORTEURS.indexOf(p);
    return i === -1 ? 1e5 : i;
  };
  return liste.sort(function (a, b) { return rang(a) - rang(b) || a.localeCompare(b, 'fr'); });
}

/**
 * LA MATRICE D'EMPLOI
 *
 * Une ligne par groupe (une fonction, ou une référence), une colonne par
 * porteur, et dans chaque case le nombre de boîtes de ce porteur qui montent
 * le groupe. C'est la question de la communalité entre programmes : le H160
 * monte-t-il les mêmes colliers que le H145 ? Un groupe est { libelle, lignes }
 * où lignes sont des composants de la base.
 */
function matriceEmploi(groupes) {
  const presents = new Set();
  groupes.forEach(function (g) {
    g.lignes.forEach(function (c) {
      Object.keys(c.parPorteur || {}).forEach(function (p) { presents.add(p); });
    });
  });
  const porteurs = ordonnerPorteurs(presents);
  let maxi = 0;

  const lignes = groupes.map(function (g) {
    const toutes = new Set();
    const cellules = porteurs.map(function (p) {
      const boites = new Set();
      g.lignes.forEach(function (c) {
        ((c.parPorteur || {})[p] || []).forEach(function (b) { boites.add(b); toutes.add(b); });
      });
      if (boites.size > maxi) maxi = boites.size;
      return { porteur: p, n: boites.size,
               boites: Array.from(boites).sort(function (a, b) {
                 return a.localeCompare(b, 'fr', { numeric: true });
               }) };
    });
    return { groupe: g, cellules: cellules, total: toutes.size };
  });

  return { porteurs: porteurs, lignes: lignes, maxi: maxi };
}

/**
 * LA CARTE DE LA BASE — un treemap
 *
 * Chaque fonction est une tuile dont l'aire est le nombre de boîtes qui la
 * montent, rangée dans la région de sa famille. Les grandes tuiles sont ce
 * qui compte ; celles qui se dispersent sont marquées. Les fonctions au
 * catalogue que personne ne monte n'ont pas d'aire : elles sont listées à part.
 *
 * Coordonnées dans un repère de `largeur` × `hauteur` unités : la vue les
 * convertit en pourcentages, la carte suit la largeur disponible sans mesure.
 */
function carteComposants(fonctions, largeur, hauteur) {
  largeur = largeur || 1000; hauteur = hauteur || 620;
  const BANDEAU = 24;      // la hauteur du libellé de famille, en unités
  const MARGE = 3;

  const dormantes = fonctions.filter(function (f) { return f.nbBoites === 0; });
  const parFamille = new Map();
  fonctions.forEach(function (f) {
    if (f.nbBoites === 0) return;
    if (!parFamille.has(f.categorie)) {
      const cat = CATEGORIES_COMPOSANT[f.categorie] || CATEGORIES_COMPOSANT.composant;
      parFamille.set(f.categorie, { cle: f.categorie, libelle: cat.libelle, fonctions: [], poids: 0, boites: new Set() });
    }
    const fam = parFamille.get(f.categorie);
    fam.fonctions.push(f);
    fam.poids += f.nbBoites;
    f.boites.forEach(function (b) { fam.boites.add(b); });
  });

  const familles = Array.from(parFamille.values())
    .sort(function (a, b) { return b.poids - a.poids || a.libelle.localeCompare(b.libelle, 'fr'); });
  const regions = squarifier(familles.map(function (f) { return f.poids; }),
                             { x: 0, y: 0, w: largeur, h: hauteur });

  familles.forEach(function (fam, i) {
    fam.rect = regions[i];
    fam.nbBoites = fam.boites.size;
    fam.fonctions.sort(function (a, b) { return b.nbBoites - a.nbBoites || a.libelle.localeCompare(b.libelle, 'fr'); });
    const interieur = {
      x: fam.rect.x + MARGE, y: fam.rect.y + BANDEAU,
      w: Math.max(0, fam.rect.w - 2 * MARGE), h: Math.max(0, fam.rect.h - BANDEAU - MARGE)
    };
    const tuiles = squarifier(fam.fonctions.map(function (f) { return f.nbBoites; }), interieur);
    fam.tuiles = fam.fonctions.map(function (f, j) { return { fonction: f, rect: tuiles[j] }; });
  });

  return { familles: familles, dormantes: dormantes, largeur: largeur, hauteur: hauteur };
}

/**
 * Treemap « squarified » (Bruls, Huizing, van Wijk) : on remplit le
 * rectangle par rangées le long de son petit côté, en n'ajoutant une tuile à
 * la rangée courante que si elle n'en dégrade pas le pire rapport
 * largeur/hauteur. Les poids doivent être triés décroissants ; on renvoie un
 * rectangle par poids, dans l'ordre reçu.
 */
function squarifier(poids, rect) {
  const sorties = poids.map(function () { return { x: rect.x, y: rect.y, w: 0, h: 0 }; });
  const total = poids.reduce(function (t, p) { return t + (p > 0 ? p : 0); }, 0);
  const aire = rect.w * rect.h;
  if (!total || aire <= 0) return sorties;
  const echelle = aire / total;
  const items = poids.map(function (p, i) { return { i: i, a: p > 0 ? p * echelle : 0 }; })
                     .filter(function (it) { return it.a > 0; });

  let x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  let rangee = [];

  const somme = function (r) { return r.reduce(function (t, it) { return t + it.a; }, 0); };
  const pire = function (r, cote) {
    const s = somme(r);
    if (!s || !cote) return Infinity;
    let mx = 0, mn = Infinity;
    r.forEach(function (it) { if (it.a > mx) mx = it.a; if (it.a < mn) mn = it.a; });
    return Math.max((cote * cote * mx) / (s * s), (s * s) / (cote * cote * mn));
  };
  const poser = function (r) {
    const s = somme(r);
    if (w >= h) {              // une colonne, le long de la hauteur
      const cw = h ? s / h : 0; let cy = y;
      r.forEach(function (it) { const ch = cw ? it.a / cw : 0; sorties[it.i] = { x: x, y: cy, w: cw, h: ch }; cy += ch; });
      x += cw; w = Math.max(0, w - cw);
    } else {                   // une rangée, le long de la largeur
      const ch = w ? s / w : 0; let cx = x;
      r.forEach(function (it) { const cw = ch ? it.a / ch : 0; sorties[it.i] = { x: cx, y: y, w: cw, h: ch }; cx += cw; });
      y += ch; h = Math.max(0, h - ch);
    }
  };

  items.forEach(function (it) {
    const cote = Math.min(w, h);
    if (!rangee.length) { rangee.push(it); return; }
    if (pire(rangee, cote) >= pire(rangee.concat([it]), cote)) { rangee.push(it); return; }
    poser(rangee);
    rangee = [it];
  });
  if (rangee.length) poser(rangee);
  return sorties;
}

/**
 * LE PLAN DE CONVERGENCE d'une fonction : parmi ses références montées, la
 * cible est la plus répandue ; les boîtes à modifier sont celles qui montent
 * une autre référence. `lignes` sont des composants de la base.
 */
function planConvergence(lignes) {
  const montees = lignes.filter(function (c) { return c.nbBoites > 0; });
  if (montees.length < 2) return null;
  const cible = montees.slice().sort(function (a, b) {
    return b.nbBoites - a.nbBoites ||
           String(a.reference).localeCompare(String(b.reference), 'fr', { numeric: true });
  })[0];
  const aModifier = new Set();
  montees.forEach(function (c) {
    if (c === cible) return;
    c.boites.forEach(function (b) { aModifier.add(b); });
  });
  return {
    cible: cible,
    autres: montees.filter(function (c) { return c !== cible; }),
    aModifier: Array.from(aModifier).sort(function (a, b) { return a.localeCompare(b, 'fr', { numeric: true }); }),
    economie: montees.length - 1      // les références qu'on cesserait de faire vivre
  };
}


/**
 * L'inventaire des PIÈCES vu depuis les boîtes affichées : un PN de pièce,
 * son type, et toutes les boîtes qui la montent. C'est la question que pose
 * un outil de réemploi, prise par l'autre bout — la grille répond « que
 * contient cette boîte », celle-ci répond « où sert cette pièce ».
 */
function inventairePieces(liste) {
  const parPiece = new Map();
  liste.forEach(function (b) {
    const pnBoite = String(b[CLE_PN()]).trim();
    (b.nomenclature || []).forEach(function (n) {
      const pn = String(n['PN du type'] || '').trim();
      if (!pn) return;                       // une pièce sans PN n'est pas suivie
      const cle = normaliserTexte(pn) + '|' + typeDe(n).cle;
      if (!parPiece.has(cle)) {
        parPiece.set(cle, { pn: pn, type: typeDe(n), boites: [], lignes: [] });
      }
      const e = parPiece.get(cle);
      e.lignes.push(n);
      if (e.boites.indexOf(pnBoite) === -1) e.boites.push(pnBoite);
    });
  });

  return Array.from(parPiece.values())
    .map(function (e) {
      e.boites.sort(function (a, b) { return a.localeCompare(b, 'fr', { numeric: true }); });
      e.nombre = e.boites.length;
      return e;
    })
    // Les plus réutilisées d'abord : c'est l'information qu'on vient chercher.
    .sort(function (a, b) {
      return b.nombre - a.nombre ||
             a.type.libelle.localeCompare(b.type.libelle, 'fr') ||
             a.pn.localeCompare(b.pn, 'fr', { numeric: true });
    });
}

/**
 * Toutes les familles de composants de la base affichée, regroupées par
 * catégorie et fonction, puis par norme, puis par référence.
 *
 * C'est la question du réemploi posée un cran plus bas que les pièces :
 * combien de références différentes fait-on vivre pour la même chose ?
 */
function famillesComposants(liste) {
  const familles = new Map();

  liste.forEach(function (b) {
    const pnBoite = String(b[CLE_PN()]).trim();
    champsComposants().forEach(function (ch) {
      const porteurs = ch.portee === 'boite'
        ? [b]
        : (b.nomenclature || []).filter(function (n) { return typeDe(n).cle === ch.portee; });

      porteurs.forEach(function (o) {
        listeComposants(o[ch.cle]).forEach(function (c) {
          if (!c.fonction) return;            // sans fonction, pas de famille

          const cleF = ch.categorie + '|' + normaliserTexte(c.fonction);
          if (!familles.has(cleF)) {
            familles.set(cleF, { categorie: ch.categorie, fonction: c.fonction, normes: new Map() });
          }
          const f = familles.get(cleF);

          const cleN = normaliserTexte(c.norme);
          if (!f.normes.has(cleN)) f.normes.set(cleN, { norme: c.norme, references: new Map() });
          const n = f.normes.get(cleN);

          const cleR = normaliserTexte(c.reference);
          if (!n.references.has(cleR)) n.references.set(cleR, { reference: c.reference, boites: new Set() });
          n.references.get(cleR).boites.add(pnBoite);
        });
      });
    });
  });

  return familles;
}

/**
 * Ce qui se DISPERSE : plusieurs références montées pour le même composant
 * SOUS UNE MÊME NORME. Deux normes différentes pour un même composant ne
 * sont pas une dispersion — elles ont en général leur raison — et on ne
 * propose pas de les fondre. Une famille = un composant + une norme.
 * Chacune est une convergence possible ; les plus dispersées d'abord, ce
 * sont elles qui coûtent le plus à faire vivre.
 */
function opportunitesStandardisation(liste) {
  const sorties = [];

  famillesComposants(liste).forEach(function (f) {
    f.normes.forEach(function (n) {
      const references = Array.from(n.references.values()).map(function (r) {
        return { reference: r.reference, nbBoites: r.boites.size,
                 boites: Array.from(r.boites).sort(function (a, b) {
                   return a.localeCompare(b, 'fr', { numeric: true });
                 }) };
      }).sort(function (a, b) {
        return b.nbBoites - a.nbBoites ||
               String(a.reference).localeCompare(String(b.reference), 'fr', { numeric: true });
      });
      // Une seule référence sous cette norme : rien à faire converger.
      if (references.length <= 1) return;

      // La cible : la référence la plus montée. Les boîtes à modifier :
      // celles qui en montent une autre. C'est le coût concret.
      const cible = references[0];
      const aModifier = new Set();
      references.forEach(function (r) {
        if (r === cible) return;
        r.boites.forEach(function (b) { aModifier.add(b); });
      });
      const boites = new Set();
      references.forEach(function (r) { r.boites.forEach(function (b) { boites.add(b); }); });

      sorties.push({
        categorie: f.categorie, fonction: f.fonction, norme: n.norme,
        references: references, nbReferences: references.length,
        nbBoites: boites.size, cible: cible,
        aModifier: Array.from(aModifier).sort(function (a, b) { return a.localeCompare(b, 'fr', { numeric: true }); })
      });
    });
  });

  return sorties.sort(function (a, b) {
    return b.nbReferences - a.nbReferences || b.nbBoites - a.nbBoites ||
           a.fonction.localeCompare(b.fonction, 'fr') ||
           String(a.norme).localeCompare(String(b.norme), 'fr', { numeric: true });
  });
}

/**
 * Le bilan de la standardisation : si chaque norme dispersée convergeait
 * vers sa référence la plus montée, combien de références cesserait-on de
 * faire vivre, et combien de boîtes faudrait-il modifier ?
 */
function bilanStandardisation(familles) {
  const boites = new Set();
  let references = 0;
  familles.forEach(function (f) {
    references += f.nbReferences;
    f.aModifier.forEach(function (b) { boites.add(b); });
  });
  return {
    familles: familles.length,
    references: references,
    apres: familles.length,               // une référence par norme dispersée
    economie: references - familles.length,
    boites: boites.size
  };
}

/** Répartition des sous-ensembles par type, pour la barre de filtres. */
function repartitionTypes() {
  const compte = new Map();
  Store.nomenclature.forEach(function (n) {
    const t = typeDe(n);
    compte.set(t.cle, (compte.get(t.cle) || 0) + 1);
  });
  return Object.keys(TYPES)
    .map(function (k) { return { type: TYPES[k], nombre: compte.get(k) || 0 }; })
    .filter(function (e) { return e.nombre > 0; });
}

// ------------------------------------------------------------
// Catalogue et composants
// ------------------------------------------------------------
function tousLesComposants() {
  const ensemble = new Set();
  Store.catalogue.forEach(function (c) {
    const f = libelleComposant(composantDepuisCatalogue(c));
    if (f) ensemble.add(f);
  });
  Store.boites.forEach(function (b) {
    composantsDeBoite(b).forEach(function (c) { ensemble.add(libelleComposant(c)); });
  });
  return Array.from(ensemble).sort();
}

/** Vocabulaire de mots-clés déjà employé, pour l'autocomplétion. */
function tousLesMotsCles() {
  const ensemble = new Set();
  Store.nomenclature.forEach(function (n) {
    motsCles(n['Mots-clés']).forEach(function (m) { ensemble.add(m); });
  });
  return Array.from(ensemble).sort(function (a, b) { return a.localeCompare(b, 'fr'); });
}

const CATALOGUE_MAX = 30;

/**
 * Conserve l'index RÉEL : c'est lui qui est passé au clic.
 * Filtré par catégorie : on ne propose pas une colonnette pour une boîte,
 * ni un bouton poussoir pour une structure.
 */
function filtrerCatalogue(requete, categorie) {
  const q = normaliserTexte(requete);
  const tous = Store.catalogue
    .map(function (c, index) { return { composant: c, index: index, structure: composantDepuisCatalogue(c) }; })
    .filter(function (e) {
      if (categorie && e.structure.categorie !== categorie) return false;
      if (!q) return true;
      const cible = normaliserTexte(libelleComposant(e.structure) + ' ' + e.structure.designation);
      return cible.indexOf(q) !== -1;
    });
  return { affiches: tous.slice(0, CATALOGUE_MAX), total: tous.length };
}
