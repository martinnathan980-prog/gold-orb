<script>
// ============================================================
// NEXUS — composants à trois niveaux.
//
// Un composant n'est plus une chaîne libre : il se décrit en trois niveaux
// de précision croissante, et l'équivalence les parcourt dans l'ordre.
//
//   1. FONCTION   — ce que c'est : bouton poussoir, interrupteur, colonnette
//   2. NORME      — la norme qui le définit : ECS 7251, ASNE 0567, NSA 5512
//   3. RÉFÉRENCE  — le modèle exact chez le fabricant
//
// Dans la feuille, une cellule porte une ligne par composant, au format
//   Fonction | Norme | Référence
// Les anciennes écritures « Type | Sous-type (Norme) » restent lisibles.
//
// Trois catégories, selon l'endroit :
//   - COMPOSANT   : boutons, voyants, interrupteurs — au niveau de la BOÎTE
//   - MECANIQUE   : colonnettes, entretoises, tout ce qui est dur — STRUCTURE
//   - ELECTRIQUE  : colliers, embases, ce qui tient les câbles — STRUCTURE
// ============================================================

const CATEGORIES_COMPOSANT = {
  composant:  { cle: 'composant',  libelle: 'Composants de boîte',    aide: 'boutons, voyants, interrupteurs, relais' },
  mecanique:  { cle: 'mecanique',  libelle: 'Composants mécaniques',    aide: 'colonnettes, entretoises, équerres, inserts, visserie' },
  electrique: { cle: 'electrique', libelle: 'Composants routing', aide: 'colliers, embases, passe-fils, gaines — la tenue du câblage' }
};

// Les trois niveaux, du plus large au plus précis. Leurs parts se règlent
// dans la pondération : elles totalisent toujours 100 %.
const NIVEAUX = [
  { cle: 'fonction',  libelle: 'Fonction',  poids: 20, aide: 'ce que c\'est',
    classe: 'niveau-fonction' },
  { cle: 'norme',     libelle: 'Norme',     poids: 30, aide: 'ce qui le définit',
    classe: 'niveau-norme' },
  { cle: 'reference', libelle: 'Référence', poids: 50, aide: 'le modèle exact',
    classe: 'niveau-reference' }
];

const NIVEAUX_DEFAUT = {};
NIVEAUX.forEach(function (n) { NIVEAUX_DEFAUT[n.cle] = n.poids; });

/** Part courante d'un niveau. Un niveau écarté ne vaut plus rien. */
function poidsNiveau(cle) {
  if (typeof Store === 'undefined' || !Store.poids || !Store.poids.composant) {
    return NIVEAUX_DEFAUT[cle];
  }
  if (typeof critereEstActif === 'function' && !critereEstActif('composant', cle)) return 0;
  const v = Number(Store.poids.composant[cle]);
  return (isFinite(v) && v >= 0) ? v : NIVEAUX_DEFAUT[cle];
}

/** Une ligne de cellule -> { fonction, norme, reference }. Tolérant à l'ancien format. */
function analyserComposant(texte) {
  const brut = String(texte === null || texte === undefined ? '' : texte).trim();
  if (!brut) return null;

  const parts = brut.split('|').map(function (p) { return p.trim(); });
  let fonction = parts[0] || '', norme = '', reference = '';

  if (parts.length >= 3) {
    norme = parts[1]; reference = parts.slice(2).join(' | ');
  } else if (parts.length === 2) {
    // Ancien format : « Type | Sous-type (Norme) » — la norme est entre parenthèses.
    const m = parts[1].match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (m) { norme = m[2].trim(); if (m[1].trim()) fonction = fonction + ' ' + m[1].trim(); }
    else norme = parts[1];
  } else {
    const m = fonction.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (m) { fonction = m[1].trim(); norme = m[2].trim(); }
  }
  return { fonction: fonction.trim(), norme: norme.trim(), reference: reference.trim(), brut: brut };
}

/** { fonction, norme, reference } -> la ligne à écrire dans la cellule. */
function formaterComposantStructure(c) {
  return [c.fonction || '', c.norme || '', c.reference || '']
    .map(function (x) { return String(x).trim(); })
    .join(' | ')
    .replace(/(\s\|\s)+$/, '');          // pas de « | | » traînants
}

/** Libellé lisible : la partie la plus précise en avant, le reste en retrait. */
function libelleComposant(c) {
  if (!c) return '';
  const morceaux = [c.fonction];
  if (c.norme) morceaux.push(c.norme);
  if (c.reference) morceaux.push(c.reference);
  return morceaux.filter(Boolean).join(' · ');
}

function listeComposants(valeur) {
  return valeursMulti(valeur).map(analyserComposant).filter(Boolean);
}

/** Depuis une ligne de catalogue. */
function composantDepuisCatalogue(entree) {
  return {
    fonction:  String(entree['Fonction'] || entree['Type'] || '').trim(),
    norme:     String(entree['Norme'] || entree['Norm'] || entree['Standard number'] || '').trim(),
    reference: String(entree['Référence'] || entree['Ref'] || entree['Reference'] || '').trim(),
    categorie: normaliserTexte(entree['Catégorie'] || entree['Categorie'] || '') || 'composant',
    designation: String(entree['Désignation'] || entree['Sous Type/Désignation'] || '').trim()
  };
}

// ------------------------------------------------------------
// Équivalence : les niveaux s'ADDITIONNENT, ils ne s'excluent pas
// ------------------------------------------------------------
/**
 * On ne choisit pas UN niveau, on les parcourt tous et chacun rapporte sa
 * part. Même fonction : on prend la part de la fonction. Même norme en plus :
 * on ajoute la part de la norme. Même référence en plus : on ajoute la
 * sienne, et le composant vaut alors le maximum.
 *
 * Ce qui n'est PAS renseigné sur la source sort du dénominateur. Un composant
 * décrit par sa seule fonction ne peut pas être pénalisé pour une norme qu'on
 * ne lui connaît pas : s'il trouve la même fonction, il vaut 100 % de ce
 * qu'on savait de lui. C'est la même règle que pour les critères non
 * mesurables, appliquée à l'intérieur d'un composant.
 */
function comparerComposants(source, cible) {
  let obtenu = 0, max = 0;

  const niveaux = NIVEAUX.map(function (n) {
    const s = String(source[n.cle] === undefined ? '' : source[n.cle]).trim();
    const c = String(cible[n.cle] === undefined ? '' : cible[n.cle]).trim();
    const poids = poidsNiveau(n.cle);

    if (!s) {
      return { cle: n.cle, libelle: n.libelle, etat: 'absent', poids: poids, source: s, cible: c };
    }
    if (!poids) {
      return { cle: n.cle, libelle: n.libelle, etat: 'ecarte', poids: 0, source: s, cible: c };
    }
    max += poids;
    const egal = !!c && normaliserTexte(s) === normaliserTexte(c);
    if (egal) obtenu += poids;
    return { cle: n.cle, libelle: n.libelle, etat: egal ? 'egal' : 'different',
             poids: poids, source: s, cible: c };
  });

  // La fonction est la PORTE D'ENTRÉE, pas un critère parmi d'autres : un
  // bouton poussoir n'est pas un voyant, même s'ils partagent une norme ou
  // une référence par accident. Fonctions différentes, rien n'est acquis.
  const fonction = niveaux[0];
  const incompatible = fonction.etat === 'different';
  if (incompatible) obtenu = 0;

  return { niveaux: niveaux, obtenu: obtenu, max: max,
           compatible: !incompatible,
           ratio: (!incompatible && max > 0) ? obtenu / max : 0 };
}

/**
 * Apparie chaque composant de la source au meilleur candidat de la cible.
 * On classe TOUTES les paires possibles par score décroissant avant de
 * servir : le résultat ne dépend donc pas de l'ordre de saisie, ce qu'un
 * appariement glouton naïf ne garantit pas.
 */
function apparierComposants(listeSource, listeCible) {
  const paires = [];
  listeSource.forEach(function (s, i) {
    listeCible.forEach(function (c, j) {
      const detail = comparerComposants(s, c);
      if (detail.ratio > 0) paires.push({ i: i, j: j, detail: detail });
    });
  });
  paires.sort(function (a, b) {
    return b.detail.ratio - a.detail.ratio || a.i - b.i || a.j - b.j;
  });

  const sourcePrise = {}, ciblePrise = {}, appariements = [];
  let total = 0;
  paires.forEach(function (p) {
    if (sourcePrise[p.i] || ciblePrise[p.j]) return;
    sourcePrise[p.i] = true;
    ciblePrise[p.j] = true;
    appariements.push({ source: listeSource[p.i], cible: listeCible[p.j], detail: p.detail });
    total += p.detail.ratio;
  });

  return {
    ratio: listeSource.length ? total / listeSource.length : 0,
    appariements: appariements,
    aucun: listeSource.filter(function (_, i) { return !sourcePrise[i]; }),
    enPlus: listeCible.filter(function (_, j) { return !ciblePrise[j]; }),
    nbSource: listeSource.length
  };
}
/**
 * Ce qui va avec quoi, par catégorie : fonction → normes → références.
 * Rempli par remplirListesDeSuggestion(), lu par les champs de saisie pour
 * ne proposer sous « Bouton poussoir » que les normes de boutons poussoirs.
 */
const INDEX_COMPOSANTS = {};

/**
 * Les trois listes à proposer dans un bloc de saisie, compte tenu de ce qui
 * est déjà tapé : sous « Bouton poussoir », on ne propose que les normes de
 * boutons poussoirs, et sous une norme donnée, que ses références.
 * Une fonction encore inconnue ne restreint rien : on n'empêche pas de saisir
 * un composant qui n'existe pas encore dans la base.
 */
function suggestionsComposant(categorie, fonction, norme) {
  const par = INDEX_COMPOSANTS[categorie] || INDEX_COMPOSANTS.composant || new Map();
  const fonctions = new Set(), normes = new Set(), references = new Set();

  const cleF = normaliserTexte(fonction);
  const cleN = normaliserTexte(norme);
  const fonctionConnue = !!cleF && par.has(cleF);

  par.forEach(function (bloc, cle) {
    fonctions.add(bloc.libelle);
    if (fonctionConnue && cle !== cleF) return;
    const normeConnue = !!cleN && bloc.normes.has(cleN);
    bloc.normes.forEach(function (n, cleNorme) {
      if (n.norme) normes.add(n.norme);
      if (normeConnue && cleNorme !== cleN) return;
      n.references.forEach(function (r) { references.add(r); });
    });
  });

  return { fonctions: trierFr(fonctions), normes: trierFr(normes),
           references: trierFr(references), restreint: fonctionConnue };
}

/**
 * Réécrit les listes Norme et Référence d'un bloc d'après ce qui y est déjà
 * tapé. Une valeur devenue impossible n'est pas effacée : on ne reprend pas
 * la main sur une saisie en cours, on cesse seulement de la suggérer.
 */
function resserrerBloc(bloc, categorie, uid) {
  if (!bloc || !uid) return;
  const lire = function (niveau) {
    const c = bloc.querySelector('.saisie-composant[data-niveau="' + niveau + '"]');
    return c ? c.value.trim() : '';
  };
  const sug = suggestionsComposant(categorie || 'composant', lire('fonction'), lire('norme'));
  definirHtml(uid + '-norme', optionsHtml(sug.normes));
  definirHtml(uid + '-reference', optionsHtml(sug.references));
}

function trierFr(ensemble) {
  return Array.from(ensemble).sort(function (a, b) { return String(a).localeCompare(String(b), 'fr'); });
}

/**
 * (Re)construit l'index depuis le catalogue et tout ce qui est déjà saisi.
 * Le catalogue d'abord : il porte les libellés de référence.
 */
function construireIndexComposants() {
  Object.keys(INDEX_COMPOSANTS).forEach(function (k) { delete INDEX_COMPOSANTS[k]; });
  Object.keys(CATEGORIES_COMPOSANT).forEach(function (cat) {
    INDEX_COMPOSANTS[cat] = new Map();
  });

  const relier = function (cat, c) {
    if (!c.fonction) return;
    const par = INDEX_COMPOSANTS[cat] || INDEX_COMPOSANTS.composant;
    const cle = normaliserTexte(c.fonction);
    if (!par.has(cle)) par.set(cle, { libelle: c.fonction, normes: new Map() });
    const normes = par.get(cle).normes;
    const cleNorme = normaliserTexte(c.norme);
    if (!normes.has(cleNorme)) normes.set(cleNorme, { norme: c.norme || '', references: new Set() });
    if (c.reference) normes.get(cleNorme).references.add(c.reference);
  };

  (Store.catalogue || []).forEach(function (entree) {
    const c = composantDepuisCatalogue(entree);
    relier(INDEX_COMPOSANTS[c.categorie] ? c.categorie : 'composant', c);
  });
  champsComposants().forEach(function (ch) {
    const cat = INDEX_COMPOSANTS[ch.categorie] ? ch.categorie : 'composant';
    const objets = ch.portee === 'boite'
      ? Store.boites
      : (Store.nomenclature || []).filter(function (n) { return typeDe(n).cle === ch.portee; });
    objets.forEach(function (o) {
      listeComposants(o[ch.cle]).forEach(function (c) { relier(cat, c); });
    });
  });
  return INDEX_COMPOSANTS;
}

</script>
