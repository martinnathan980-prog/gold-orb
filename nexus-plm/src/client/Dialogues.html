<script>
// ============================================================
// NEXUS — dialogues intégrés.
//
// Les fenêtres natives prompt() et confirm() sont BLOQUÉES dans l'iframe
// sandboxée d'Apps Script : le bouton « Dupliquer » ne faisait rien, et
// « Supprimer » non plus, sans le moindre message. On ne s'en remet plus au
// navigateur.
//
// Deux fonctions, toutes deux asynchrones :
//   demander({ titre, message, valeur, placeholder, bouton })  -> texte | null
//   confirmer({ titre, message, bouton, danger })              -> true | false
// ============================================================

let dialogueEnCours = null;

function ouvrirDialogue(options, avecChamp) {
  return new Promise(function (resoudre) {
    const el = parId('dialogueModal');
    if (!el) { resoudre(avecChamp ? null : false); return; }

    definirTexte('dialogueTitre', options.titre || (avecChamp ? 'Saisie' : 'Confirmer'));
    definirTexte('dialogueMessage', options.message || '');
    const champ = parId('dialogueChamp');
    const valider = parId('dialogueValider');
    champ.hidden = !avecChamp;
    champ.value = avecChamp ? (options.valeur || '') : '';
    champ.placeholder = options.placeholder || '';
    valider.textContent = options.bouton || (avecChamp ? 'Valider' : 'Confirmer');
    valider.className = 'btn-principal' + (options.danger ? ' btn-danger-plein' : '');

    let regle = false;
    const terminer = function (resultat) {
      if (regle) return;
      regle = true;
      dialogueEnCours = null;
      const m = bootstrap.Modal.getInstance(el);
      if (m) m.hide();
      resoudre(resultat);
    };
    dialogueEnCours = {
      valider: function () { terminer(avecChamp ? champ.value.trim() : true); },
      annuler: function () { terminer(avecChamp ? null : false); }
    };

    const modal = bootstrap.Modal.getOrCreateInstance(el, { backdrop: 'static' });
    el.addEventListener('hidden.bs.modal', function () { if (!regle) terminer(avecChamp ? null : false); },
                        { once: true });
    el.addEventListener('shown.bs.modal', function () {
      if (avecChamp) { champ.focus(); champ.select(); } else valider.focus();
    }, { once: true });
    modal.show();
  });
}

function demander(options)  { return ouvrirDialogue(options, true); }
function confirmer(options) { return ouvrirDialogue(options, false); }

enregistrerActions({
  'dialogue-valider': function () { if (dialogueEnCours) dialogueEnCours.valider(); },
  'dialogue-annuler': function () { if (dialogueEnCours) dialogueEnCours.annuler(); }
});

// Entrée valide, Échap annule (Bootstrap ferme déjà sur Échap, on résout).
document.addEventListener('keydown', function (e) {
  if (!dialogueEnCours) return;
  if (e.key === 'Enter' && e.target && e.target.id === 'dialogueChamp') {
    e.preventDefault();
    dialogueEnCours.valider();
  }
});
</script>
