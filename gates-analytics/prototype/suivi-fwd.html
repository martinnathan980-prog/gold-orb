      var k = vue.tri.cle, sens = vue.tri.asc ? 1 : -1;
      if (k === 'avancement') return (a._pct - b._pct) * sens || a.reference.localeCompare(b.reference);
      var va = String(a[k] == null ? '' : a[k]), vb = String(b[k] == null ? '' : b[k]);
      if (va === '' && vb === '') return 0;
      if (va === '') return 1;
      if (vb === '') return -1;
      return va.localeCompare(vb, 'fr', { numeric: true, sensitivity: 'base' }) * sens;
    });

    if (!rangs.length) {
      $('corps-tableau').innerHTML = '<tr><td colspan="' + cols.length + '"><div class="vide-message">Aucun plan ne correspond aux filtres.</div></td></tr>';
      $('compte').textContent = '0 plan';
      majOmbre();
      return;
    }

    var nFige = nbFigees(cols);
    $('corps-tableau').innerHTML = rangs.map(function (p) {
      return '<tr>' + cols.map(function (c, i) {
        var fige = classeFige(i, nFige);
        if (c.cle === 'avancement') {
          var e = ETAT_PAR_CLE[p._etat];
          var past = e.hachure ? '<span class="pastille hachure"></span>'
            : '<span class="pastille" style="background:' + e.couleur + '"></span>';
          return '<td class="' + fige + '"><span class="etat-cellule">' + past +
            (p.avancement ? '<span class="num">' + ech(p.avancement) + '</span>' : '<span class="doux">non renseigné</span>') +
            '</span></td>';
        }
        var val = p[c.cle];
        var classes = (c.classe + ' ' + fige).trim();
        if (val === '' || val == null) return '<td class="' + classes + ' doux">-</td>';
        var titre = c.classe.indexOf('large') !== -1 ? ' title="' + ech(val) + '"' : '';
        return '<td class="' + classes + '"' + titre + '>' + ech(val) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    /* « sur N » : N est la population du périmètre, pas la feuille entière. */
    var base = population().length;
    $('compte').textContent = nb(rangs.length) + (rangs.length > 1 ? ' plans' : ' plan') +
      (rangs.length !== base ? ' sur ' + nb(base) : '');
    ajusterSticky();
    majOmbre();
  }
  /* Seule la colonne d'avancement FWD interesse le suivi : une cellule vide
     ailleurs n'est pas un defaut a traquer. */
  var COLONNE_SUIVIE = 'avancement';
  /* Ce qui a bougé depuis l'import précédent. Sur 186 lignes, personne ne
     peut le voir à l'œil ; c'est pourtant la question de chaque semaine. */
  /* « un » et « des » : le libellé s'accorde au compte — « 1 passé en
     terminé », « 20 passés en terminé ». */
  var LOTS_DELTA = [
    { cle: 'termine',  un: 'passé en terminé',    des: 'passés en terminé',    etat: 'termine' },
    { cle: 'encours',  un: 'passé en cours',      des: 'passés en cours',      etat: 'encours' },
    { cle: 'afaire',   un: 'passé à faire',       des: 'passés à faire',       etat: 'afaire' },
    { cle: 'nouveaux', un: 'nouveau',             des: 'nouveaux',             etat: null },
    { cle: 'disparus', un: 'disparu',             des: 'disparus',             etat: null },
    { cle: 'indice',   un: 'changement d’indice', des: 'changements d’indice', etat: null }
  ];
  function libelleLot(l, n) { return n > 1 ? l.des : l.un; }

  function rendreComparatif() {
    var zone = $('comparatif');
    if (!COMPARATIF) {
      zone.innerHTML = '<span>Premier import : le comparatif appara\u00eetra au prochain.</span>';
      return;
    }
    var morceaux = LOTS_DELTA.filter(function (l) { return COMPARATIF[l.cle].length; }).map(function (l) {
      var actif = vue.refsLibelle === l.cle;
      var n = COMPARATIF[l.cle].length;
      var pastille = l.etat || l.cle === 'indice' ? pastilleDe(l.etat || l.cle) : '';
      return '<button class="puce-delta" type="button" data-delta="' + l.cle +
        '" aria-pressed="' + actif + '">' +
        pastille + '<b>' + nb(n) + '</b> ' + libelleLot(l, n) + '</button>';
    });
    zone.innerHTML = '<span>Depuis l\u2019import du ' + etiquette(RELEVES[RELEVES.length - 2].i) + ' :</span>' +
      (morceaux.length ? morceaux.join('') : '<span>aucun changement.</span>');
  }

  /* ============================================================
     JOURNAL DES CHANGEMENTS
     Chaque relevé archivé garde l'avancement plan par plan. Comparer deux
     relevés successifs donne, semaine par semaine, qui a bougé et dans quel
     sens — la seule chose que l'export du jour ne dira jamais.
     ============================================================ */
  /* PLAN_PAR_REF, PLAN_PAR_RACINE et JOURNAL sont dérivés dans
     chargerSource(). Les événements d'une semaine viennent d'apparier() :
     un plan réémis y est un changement d'indice, pas un disparu plus un nouveau. */
  function construireJournal() {
    var journal = [];
    for (var k = 1; k < RELEVES.length; k++) {
      var avant = RELEVES[k - 1].plans, apres = RELEVES[k].plans;
      if (!avant || !apres) continue;
      var evenements = apparier(avant, apres);
      if (evenements.length) journal.push({ i: RELEVES[k].i, evenements: evenements });
    }
    return journal.reverse();          // la semaine la plus récente en tête
  }

  /* Le plan derrière une référence, même ancienne : une référence qui n'est
     plus dans la feuille se retrouve par sa racine et sa solution — c'est le
     même plan, réémis sous un autre indice depuis. */
  function planDeRef(ref) {
    return PLAN_PAR_REF[ref] || PLAN_PAR_RACINE[clePlan(analyserUD(ref))] || null;
  }

  /* Le filtre du journal : un état d'arrivée, ou « indice ». Un changement
     d'indice qui a aussi changé l'état se range sous cet état ; sans passage,
     il ne se range sous aucun. */
  function retenuParJournal(e, filtre) {
    if (!filtre) return true;
    if (filtre === 'indice') return e.type === 'indice';
    return e.apres === filtre && (!estReemission(e) || e.avant !== e.apres);
  }
  /* Les comptes d'une liste d'événements, avec les mots du journal et de la
     bulle : passages par état d'arrivée, nouveaux, disparus, changements
     d'indice. Un plan réémis qui change d'état compte des deux côtés. */
  function comptesEvenements(evts) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0, nouveau: 0, disparu: 0, indice: 0 };
    evts.forEach(function (e) {
      if (e.type === 'nouveau') { c.nouveau++; return; }
      if (e.type === 'disparu') { c.disparu++; return; }
      if (estReemission(e)) { c[e.type]++; if (e.avant === e.apres) return; }
      c[e.apres]++;
    });
    return c;
  }

  /* La pastille d'un état — ou, hors des états, l'anneau neutre du changement
     d'indice et la pastille transparente qui tient la place des autres. */
  function pastilleDe(cle) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '<span class="pastille ' + (cle === 'indice' ? 'neutre' : 'sans') + '"></span>';
    return e.hachure
      ? '<span class="pastille hachure"></span>'
      : '<span class="pastille" style="background:' + e.couleur + '"></span>';
  }
  function etiqEtat(cle, role) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '';
    return '<span class="etiq-etat ' + (role || '') + '">' + pastilleDe(cle) + ech(e.court) + '</span>';
  }

  var MAX_JOURNAL = 12;                // lignes affichées avant « voir tout »

  /* Le journal affiché : sous un périmètre, seuls les événements des plans
     qui en font partie ; une semaine qui n'en a plus disparaît. */
  function journalAffiche() {
    if (!vue.perimetre) return JOURNAL;
    return JOURNAL.map(function (sem) {
      return { i: sem.i, evenements: sem.evenements.filter(dansPerimetreEvt) };
    }).filter(function (sem) { return sem.evenements.length > 0; });
  }

  function rendreJournal() {
    var zone = $('zone-journal');
    if (!JOURNAL.length) {
      zone.innerHTML = '<div class="journal-vide">Le journal se remplira au deuxième archivage : ' +
        'il faut deux relevés pour savoir ce qui a bougé entre les deux.</div>';
      return;
    }
    var journal = journalAffiche();
    if (!journal.length) {
      zone.innerHTML = '<div class="journal-vide">Aucun changement dans le périmètre ' +
        ech(vue.perimetre) + '.</div>';
      return;
    }
    var filtre = vue.journal;
    var visibles = 0;
    var html = journal.map(function (sem) {
      var evts = sem.evenements.filter(function (e) { return retenuParJournal(e, filtre); });
      if (!evts.length) return '';
      /* La première semaine RENDUE — pas la plus récente du journal, qui peut
         n'avoir rien à montrer sous le filtre courant. */
      var premiere = visibles++ === 0;

      var parType = comptesEvenements(evts);
      /* « passés en en cours » ne se dit pas : chaque état a sa tournure.
         Et chaque compte est un bouton : cliquer « 4 terminés » n'affiche plus
         que ceux-là, pour toutes les semaines à la fois. */
      var resume = [];
      ETATS.forEach(function (et) {
        var n = parType[et.cle];
        if (!n) return;
        var pluriel = n > 1 ? 's' : '';
        var mot;
        if (et.cle === 'termine')      mot = 'terminé' + pluriel;
        else if (et.cle === 'encours') mot = 'passé' + pluriel + ' en cours';
        else if (et.cle === 'afaire')  mot = 'repassé' + pluriel + ' à faire';
        else                           mot = 'effacé' + pluriel;
        resume.push('<button class="compte-passage" type="button" data-passage="' + et.cle +
          '" aria-pressed="' + (vue.journal === et.cle) + '" title="N\u2019afficher que ces passages, sur toutes les semaines">' +
          pastilleDe(et.cle) + '<b>' + nb(n) + '</b> ' + ech(mot) + '</button>');
      });
      if (parType.indice) {
        resume.push('<button class="compte-passage" type="button" data-passage="indice" aria-pressed="' +
          (vue.journal === 'indice') + '" title="N\u2019afficher que les changements d\u2019indice, sur toutes les semaines">' +
          pastilleDe('indice') + '<b>' + nb(parType.indice) + '</b> changement' + (parType.indice > 1 ? 's' : '') + ' d\u2019indice</button>');
      }
      if (parType.nouveau) resume.push('<span class="doux-compte"><b>' + nb(parType.nouveau) + '</b> nouveau' + (parType.nouveau > 1 ? 'x' : '') + '</span>');
      if (parType.disparu) resume.push('<span class="doux-compte"><b>' + nb(parType.disparu) + '</b> disparu' + (parType.disparu > 1 ? 's' : '') + '</span>');
      /* La ligne de couleur de la semaine : une part par compte, dans l'ordre
         du résumé, sur la largeur d'une petite jauge. */
      var totalSem = ['termine', 'encours', 'afaire', 'vide', 'indice', 'nouveau', 'disparu']
        .reduce(function (t, k) { return t + (parType[k] || 0); }, 0);
      var jauge = totalSem ? '<span class="mini-jauge" aria-hidden="true">' +
        ['termine', 'encours', 'afaire', 'vide', 'indice', 'nouveau', 'disparu'].map(function (k) {
          if (!parType[k]) return '';
          var e = ETAT_PAR_CLE[k];
          var style = 'width:' + (100 * parType[k] / totalSem).toFixed(1) + '%' + (e && !e.hachure ? ';background:' + e.couleur : '');
          return '<span class="' + k + '" style="' + style + '"></span>';
        }).join('') + '</span>' : '';

      // La première semaine affichée s'ouvre d'elle-même : c'est celle qu'on vient voir.
      var ouvert = vue.journalOuverts[sem.i] !== undefined ? vue.journalOuverts[sem.i] : premiere;
      var limite = vue.journalOuverts['tout' + sem.i] ? evts.length : MAX_JOURNAL;

      /* Rangées par état d'arrivée, puis par référence : « terminé, terminé,
         terminé, à faire, à faire » se lit, « en vrac » ne se lit pas. Les
         changements d'indice ouvrent la liste : rares, et c'est l'événement
         qu'on doit reconnaître — relégués derrière « voir les N autres », ils
         seraient les seuls invisibles sans clic. Les nouveaux et les disparus
         ferment la marche. */
      var rangEtat = { termine: 0, encours: 1, afaire: 2, vide: 3 };
      var rangType = { indice: -1, nouveau: 5, disparu: 6 };
      evts = evts.slice().sort(function (a, b) {
        var ra = rangType[a.type] !== undefined ? rangType[a.type] : rangEtat[a.apres];
        var rb = rangType[b.type] !== undefined ? rangType[b.type] : rangEtat[b.apres];
        return (ra - rb) || a.ref.localeCompare(b.ref, 'fr', { numeric: true });
      });

      var lignes = evts.slice(0, limite).map(function (e) {
        var plan = planDeRef(e.ref);
        var quoi = plan && CLE_LIBELLE ? String(plan[CLE_LIBELLE] || '') : '';
        var vers = e.type === 'nouveau'
          ? '<span class="vers"><span class="etiq-etat avant">nouveau</span>' +
            '<span class="fleche-etat">\u2192</span>' + etiqEtat(e.apres, 'apres') + '</span>'
          : e.type === 'disparu'
            ? '<span class="vers">' + etiqEtat(e.avant, 'avant') +
              '<span class="fleche-etat">\u2192</span><span class="etiq-etat apres">retiré</span></span>'
            : '<span class="vers">' + etiqEtat(e.avant, 'avant') +
              '<span class="fleche-etat">\u2192</span>' + etiqEtat(e.apres, 'apres') + '</span>';
        /* Une réémission se lit « ANCIENNE → NOUVELLE », puis l'état avant et
           après : le même plan sous deux références, et ce qu'il est devenu. */
        var reference = estReemission(e)
          ? '<span class="ref ref-indice"><span class="ancienne">' + ech(e.ancienne) + '</span>' +
            '<span class="nouvelle">\u2192 ' + ech(e.ref) + '</span></span>'
          : '<span class="ref">' + ech(e.ref) + '</span>';
        return '<li><button class="journal-ligne' + (estReemission(e) ? ' reemission ' + e.type : '') +
          '" type="button" data-ref="' + ech(e.ref) + '" data-type="' + e.type +
          '" title="N’afficher que ce plan dans le tableau">' + reference +
          '<span class="quoi">' + ech(quoi) + '</span>' + vers + '</button></li>';
      }).join('');

      var reste = evts.length - limite;
      if (reste > 0) {
        lignes += '<li><button class="journal-plus" type="button" data-tout="' + sem.i + '">' +
          'voir les ' + nb(reste) + ' autres</button></li>';
      }

      return '<div class="journal-semaine">' +
        '<span class="journal-tete">' +
        '<button class="journal-plier" type="button" data-semaine="' + sem.i + '" aria-expanded="' + ouvert +
        '" aria-label="Plier ou d\u00e9plier la semaine ' + etiquette(sem.i) + '">' +
        '<svg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '<path d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span class="sem">' + etiquette(sem.i) + '</span></button>' +
        '<span class="resume">' + resume.join('') + '</span>' + jauge + '</span>' +
        (ouvert ? '<ul class="journal-liste">' + lignes + '</ul>' : '') +
        '</div>';
    }).join('');

    zone.innerHTML = html || '<div class="journal-vide">Aucun changement de ce type dans l’historique.</div>';
  }

  /* ============================================================
     APERÇU
     Avec un seul relevé, le graphique n'a rien à tracer et personne ne voit
     à quoi servira la page. Un bouton fabrique donc un historique fictif à
     partir des comptes du jour — sous bandeau, pour qu'il soit impossible de
     le prendre pour du réel.
     ============================================================ */
  /* Un relevé complet à partir d'une carte plan par plan — les mêmes comptes,
     globaux et par dimension, que releveDepuis() tire des plans vivants. Les
     relevés fabriqués ont ainsi tout ce qu'ont les relevés archivés : la
     courbe d'un groupe, son rythme et sa fin estimée marchent à l'identique. */
  function releveDeCarte(semaine, carte) {
    var r = { semaine: semaine, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, groupes: {}, plans: carte };
    CLES_DIM.forEach(function (d) { r.groupes[d] = {}; });
    Object.keys(carte).forEach(function (ref) {
      var etat = classer(carte[ref]);
      r.total++;
      r[etat]++;
      /* Une ancienne référence retrouve son plan par la racine. */
      var p = planDeRef(ref);
      if (!p) return;
      CLES_DIM.forEach(function (d) {
        var v = String(valeurDim(p, d) || '—');
        if (!r.groupes[d][v]) r.groupes[d][v] = { total: 0, termine: 0 };
        r.groupes[d][v].total++;
        if (etat === 'termine') r.groupes[d][v].termine++;
      });
    });
    return r;
  }

  /* Neuf semaines d'historique fictif, en semaines réelles : la dernière est
     la vraie « aujourd'hui », les autres remontent d'une semaine chacune.
     Les terminés montent régulièrement jusqu'aux comptes du jour ; et les
     cartes portent, de façon déterministe par rang de plan, tout ce que le
     journal sait reconnaître — sinon l'exemple ne montrerait que des
     « passés en terminé », et la chef n'y verrait jamais un changement
     d'indice :
       · des retours en arrière : un plan en cours aujourd'hui était terminé
         jusqu'à la semaine dernière (→ passé en cours), un plan à faire était
         en cours (→ repassé à faire) ;
       · des plans apparus : absents des cartes anciennes (→ nouveaux) ;
       · des plans disparus : présents dans les cartes anciennes sous une
         référence que la feuille ne porte plus (→ disparus) ;
       · des réémissions : pour trois plans à référence UD valide, les cartes
         anciennes portent l'indice précédent (→ changements d'indice, par
         appariement de racine).
     Les écarts sont posés sur la dernière transition pour que le comparatif
     « depuis l'import » les montre tous, et quelques-uns plus tôt pour que
     le journal en ait à plusieurs semaines. */
  function relevesDExemple() {
    var c = compte(PLANS);
    var semaines = 8;
    var retours = {}, apparus = {}, reemis = {}, disparus = [];
    var nbReemis = 0;
    PLANS.forEach(function (p, i) {
      if (p._etat === 'encours' && i % 53 === 7) retours[p.reference] = { avant: 'Terminé', jusque: semaines - 1 };
      else if (p._etat === 'afaire' && i % 59 === 11) retours[p.reference] = { avant: 'En cours', jusque: semaines - 1 };
      if (i === 3 || i === 11) apparus[p.reference] = semaines - 1;
      else if (i === 19) apparus[p.reference] = semaines - 4;
      var ud = analyserUD(p.reference);
      if (ud.valide && ud.indice !== 'A' && nbReemis < 3 && i % 7 === 2) {
        reemis[p.reference] = { ancienne: ud.racine + ud.solution + String.fromCharCode(ud.indice.charCodeAt(0) - 1),
                                jusque: nbReemis === 0 ? semaines - 1 : semaines - 3 - nbReemis };
        nbReemis++;
      }
      /* Une référence que la feuille ne porte plus : les trois lettres
         changées, elle ne partage sa racine avec aucun plan — jamais appariée. */
      if (i === 5 || i === 13) disparus.push('XXX' + p.reference.slice(3));
    });
    var faux = [];
    for (var k = 0; k <= semaines; k++) {
      var part = 0.25 + (0.75 * k) / semaines;      // montée régulière jusqu'à aujourd'hui
      var termine = Math.round(c.termine * part);
      /* Un avancement plan par plan, sinon le journal resterait vide et
         l'exemple ne montrerait que la moitié de ce que fera la page. */
      var carte = {};
      var atteint = 0;
      PLANS.forEach(function (p) {
        var ref = p.reference;
        if (apparus[ref] !== undefined && k <= apparus[ref]) return;
        var valeur = (p._etat === 'termine' && atteint++ >= termine) ? 'En cours' : p.avancement;
        if (retours[ref] && k <= retours[ref].jusque) valeur = retours[ref].avant;
        carte[(reemis[ref] && k <= reemis[ref].jusque) ? reemis[ref].ancienne : ref] = valeur;
      });
      if (k < semaines) disparus.forEach(function (ref) { carte[ref] = 'En cours'; });
      faux.push(releveDeCarte(etiquetteISO(dateDeBase(BASE_REELLE, AUJ_REEL - semaines + k)), carte));
    }
    return faux;
  }

  /* Le mode « Exemple » est une source comme une autre : la source réelle,
     avec l'historique fabriqué à la place de l'archivé. Elle passe par
     chargerSource() comme le reste — c'est ce qui garantit que l'exemple
     montre exactement ce que la page fera, ni plus ni moins. */
  function basculerExemple(actif) {
    if (actif === !!vue.exemple) return;
    if (actif) {
      var exemple = {};
      Object.keys(SRC_REELLE).forEach(function (k) { exemple[k] = SRC_REELLE[k]; });
      exemple.releves = relevesDExemple();
      exemple.exemple = true;
      chargerSource(exemple);
    } else {
      chargerSource(SRC_REELLE);
    }
    remplirDims();
    rendre();
  }

  /* L'interrupteur vit en haut de page : il porte sur tout, pas sur un bloc.
     Au premier import il montre ce que la page dira plus tard ; après, il sert
     encore à l'expliquer à quelqu'un. */
  document.querySelector('#mode-donnees').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    basculerExemple(b.dataset.mode === 'exemple');
  });

  /* Le périmètre porte sur toute la page : un clic, et tout se recalcule —
     comparatif compris. Cliquer la puce déjà pressée ne change rien. */
  $('choix-perimetre').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-perimetre]');
    if (!b || b.dataset.perimetre === vue.perimetre) return;
    vue.perimetre = b.dataset.perimetre;
    rendre();
  });

  /* ============================================================
     CHANGEMENT DE CONTRAT
     Dans l'add-on, le paquet du contrat demandé vient du classeur par le pont
     SUIVI_FWD_API ; seule, la page fabrique le jeu d'exemple correspondant.
     Dans les deux cas la nouvelle source passe par chargerSource() : le
     cadrage et les filtres repartent de zéro, la disposition est conservée.
     ============================================================ */
  var demandeContrat = 0;
  function changerContrat(id) {
    if (!id || id === CONTRAT) return;
    var sel = $('select-contrat'), etat = $('etat-contrat');
    var demande = ++demandeContrat;
    function poser(paquet) {
      if (demande !== demandeContrat) return;        // une demande plus récente a pris le relais
      if (!paquet || !paquet.plans || !paquet.plans.length) {
        sel.disabled = false;
        sel.value = CONTRAT;
        etat.textContent = paquet && paquet.message ? paquet.message : 'Contrat impossible à charger.';
        return;
      }
      /* En mode « Exemple », le nouveau contrat arrive en exemple aussi —
         son historique fabriqué à lui — au lieu de rebasculer sans un mot
         sur les données réelles. */
      var exemple = !!vue.exemple;
      chargerSource(paquet);
      if (exemple) { basculerExemple(true); return; }
      remplirDims();
      rendre();
    }
    if (API && API.chargerContrat) {
      sel.disabled = true;
      etat.textContent = 'Chargement…';
      API.chargerContrat(id, poser);
    } else {
      poser(jeuDExemple(id));
    }
  }
  $('select-contrat').addEventListener('change', function (e) { changerContrat(e.target.value); });


  /* ============================================================
     LES DEUX VUES DU TABLEAU

     « Toutes les colonnes » : l'export tel quel, toutes les colonnes, dans
     l'ordre de la feuille. C'est la vue de référence — celle sur laquelle tout
     le monde parle de la même chose.

     « Vue essentielle » : la poignée de colonnes qu'on regarde vraiment, dans
     l'ordre voulu.

     Rien entre les deux, et chacune se retrouve à l'identique en revenant.
     ============================================================ */
  /* ORDRE_FEUILLE est dérivé de la source dans chargerSource(). */
  function appliquerVueTable() {
    if (vue.vueTable === 'essentielle') {
      var garder = {};
      CLES_ESSENTIELLES.forEach(function (c) { garder[c] = true; });
      vue.cachees = {};
      COLONNES.forEach(function (c) { if (!garder[c.cle]) vue.cachees[c.cle] = true; });
      vue.ordre = CLES_ESSENTIELLES.slice()
        .concat(ORDRE_FEUILLE.filter(function (c) { return CLES_ESSENTIELLES.indexOf(c) === -1; }));
    } else {
      vue.cachees = {};
      vue.ordre = ORDRE_FEUILLE.slice();
    }
  }

  /* ============================================================
     FILTRES ACTIFS
     On clique un périmètre, un état, un groupe, une ligne du journal… et plus
     personne ne sait ce qui reste posé. Le bandeau nomme chaque filtre et
     donne sa croix ; il colle en haut de la page, donc la sortie est toujours
     à portée.
     ============================================================ */
  function filtresPoses() {
    var liste = [];
    /* Le périmètre d'abord : c'est le plus large, et il se retire comme les autres. */
    if (vue.perimetre) liste.push({ cle: 'perimetre', mot: 'Périmètre', valeur: vue.perimetre });
    if (vue.etat) liste.push({ cle: 'etat', mot: 'État', valeur: ETAT_PAR_CLE[vue.etat].libelle });
    if (vue.groupe) {
      liste.push({
        cle: 'groupe',
        mot: TITRE_DIM[vue.groupe.dim] || 'Groupe',
        valeur: libelleGroupe(vue.groupe.val)
      });
    }
    if (vue.refs) {
      var n = Object.keys(vue.refs).length;
      /* Un lot du comparatif se nomme par son libellé, pas par sa clé — et au
         pluriel : le bandeau nomme une catégorie, il ne compte pas. */
      var lot = LOTS_DELTA.filter(function (l) { return l.cle === vue.refsLibelle; })[0];
      /* Un compteur du rapprochement se nomme de même, sous son propre mot :
         on sait d'où vient le filtre sans remonter le chercher. */
      var lotRapp = LOTS_RAPPROCHEMENT.filter(function (l) { return 'rapprochement:' + l.cle === vue.refsLibelle; })[0];
      if (lotRapp) liste.push({ cle: 'refs', mot: 'Rapprochement', valeur: libelleRapp(lotRapp) });
      else liste.push({ cle: 'refs', mot: 'Sélection', valeur: lot ? lot.des : (vue.refsLibelle || (n + ' plans')) });
    }
    if (vue.lotLa) {
      var lotLa = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === vue.lotLa; })[0];
      if (lotLa) liste.push({ cle: 'lotLa', mot: 'Rapprochement', valeur: libelleRapp(lotLa) });
    }
    Object.keys(vue.vides).forEach(function (k) {
      if (vue.vides[k]) liste.push({ cle: 'vide:' + k, mot: PAR_CLE[k].titre, valeur: 'non renseigné' });
    });
    Object.keys(vue.filtres).forEach(function (k) {
      if (vue.filtres[k]) liste.push({ cle: 'filtre:' + k, mot: PAR_CLE[k].titre, valeur: vue.filtres[k] });
    });
    if (vue.recherche) liste.push({ cle: 'recherche', mot: 'Recherche', valeur: vue.recherche });
    return liste;
  }

  function retirerFiltre(cle) {
    if (cle === 'etat') vue.etat = '';
    else if (cle === 'perimetre') vue.perimetre = '';
    else if (cle === 'groupe') vue.groupe = null;
    else if (cle === 'refs') { vue.refs = null; vue.refsLibelle = ''; }
    else if (cle === 'lotLa') vue.lotLa = null;
    else if (cle === 'recherche') { vue.recherche = ''; $('recherche').value = ''; }
    else if (cle.indexOf('vide:') === 0) delete vue.vides[cle.slice(5)];
    else if (cle.indexOf('filtre:') === 0) delete vue.filtres[cle.slice(7)];
  }

  function toutEffacer() {
    vue.recherche = ''; vue.etat = ''; vue.filtres = {}; vue.groupe = null; vue.vides = {};
    vue.refs = null; vue.refsLibelle = '';
    vue.perimetre = '';
    vue.lotLa = null;
    vue.seconde.recherche = ''; $('recherche-seconde').value = '';
    $('recherche').value = '';
  }

  function rendreFiltresActifs() {
    var zone = $('filtres-actifs');
    var poses = filtresPoses();
    zone.hidden = !poses.length;
    if (!poses.length) { zone.innerHTML = ''; return; }
    zone.innerHTML = '<span class="mot">Filtres</span>' +
      poses.map(function (f) {
        return '<span class="jeton">' + (f.mot ? ech(f.mot) + ' : ' : '') +
          '<b>' + ech(f.valeur) + '</b>' +
          '<button class="x" type="button" data-retirer="' + ech(f.cle) +
          '" aria-label="Retirer ce filtre" title="Retirer ce filtre">×</button></span>';
      }).join('') +
      '<button class="tout-effacer" type="button" id="tout-effacer">Tout effacer</button>';
  }

  function rendreIncomplets() {
    var col = PAR_CLE[COLONNE_SUIVIE];
    var plans = population();
    var n = 0;
    for (var i = 0; i < plans.length; i++) {
      if (String(plans[i][COLONNE_SUIVIE] == null ? '' : plans[i][COLONNE_SUIVIE]).trim() === '') n++;
    }
    /* Sans colonne d'avancement reconnue (le serveur prévient, la page
       s'affiche tout en « non renseigné »), il n'y a rien à filtrer. */
    if (!col || !n) { $('incomplets').innerHTML = ''; return; }
    $('incomplets').innerHTML =
      '<button class="puce-vide" type="button" data-vide="' + COLONNE_SUIVIE + '" aria-pressed="' + !!vue.vides[COLONNE_SUIVIE] +
      '" title="N\u2019afficher que les plans dont ' + ech(col.titre) + ' est vide">' +
      ech(col.titre) + ' non renseign\u00e9 <b>' + nb(n) + '</b></button>';
  }

  function majOmbre() {
    var d = $('defile');
    $('cadre-tableau').dataset.deborde = (d.scrollWidth - d.clientWidth - d.scrollLeft) > 4 ? 'true' : 'false';
  }

  /* La section « Rapprochement avec … » : une phrase, quatre compteurs, la
     liste dépliable de ce qui n'est pas dans le tableau, le détail des écarts.
     Absente quand la source ne décrit aucune seconde base. */
  function valeurRapp(v) {
    var s = String(v == null ? '' : v).trim();
    return s ? ech(s) : '<span class="doux">—</span>';
  }
  function pastilleVerdict(cat) {
    var classe = { identique: 'identique', emission: 'neutre', ecart: 'ecart', seul: 'seul', absentLa: 'absent' }[cat];
    if (!classe) return '<span class="pastille sans"></span>';
    return '<span class="pastille ' + classe + '"></span>';
  }
  var MOT_VERDICT = {
    identique: 'Identique des deux côtés',
    emission: 'Le même plan, sous un autre indice',
    ecart: 'Des champs diffèrent de GATES',
    seul: 'Aucun plan de GATES sous cette racine'
  };
  /* Le titre d'un segment ou la ligne de tête d'une bulle : le compte et le mot. */
  function motLotRapp(cle, n, nom) {
    var pl = n > 1;
    if (cle === 'identiques') return nb(n) + (pl ? ' identiques' : ' identique');
    if (cle === 'indiceDifferent') return nb(n) + ' sous un autre indice';
    if (cle === 'ecarts') return nb(n) + ' avec des champs différents';
    if (cle === 'absentsLa') return nb(n) + (pl ? ' absents de ' : ' absent de ') + nom;
    return nb(n) + (pl ? ' lignes seulement dans ' : ' ligne seulement dans ') + nom;
  }
  function rendreRapprochement() {
    var zone = $('rapprochement');
    if (!RAPPROCHEMENT) { zone.hidden = true; return; }
    zone.hidden = false;
    var R = RAPPROCHEMENT, rap = SRC.rapprochement, nom = nomSeconde();
    $('titre-rapprochement').textContent = 'Rapprochement avec ' + nom;
    var nL = R.nbLignes;
    $('compte-rapprochement').textContent = (nL
      ? nb(nL) + (nL > 1 ? ' lignes dans ' : ' ligne dans ') + nom + (rap.titre ? ' · extract « ' + String(rap.titre) + ' »' : '')
      : '0 ligne dans ' + nom + ' — l’extract est vide');

    /* Les comptes : un plan d'ici dans une seule case, et à part ce que la
       seconde base est seule à connaître. */
    var comptes = {};
    LOTS_RAPPROCHEMENT.forEach(function (l) { comptes[l.cle] = compteLotRapp(l.cle); });
    var nP = R.nbPlans, nId = comptes.identiques, nSeuls = comptes.absentsIci, aVerifier = nP - nId;

    /* La phrase, dans le registre de la barre du haut — jamais « terminés » ;
       dessous, ce qu'il reste à regarder. */
    if (!nP && vue.perimetre) {
      $('phrase-rapprochement').textContent = 'Aucun plan dans le périmètre ' + vue.perimetre;
      $('sous-rapprochement').textContent = '';
    } else {
      $('phrase-rapprochement').innerHTML = '<b>' + nb(nId) + '</b> sur ' + nb(nP) + (nP > 1 ? ' plans' : ' plan') +
        (vue.perimetre ? ' du périmètre ' + ech(vue.perimetre) : '') + (nP > 1 ? ' identiques' : ' identique') + ' dans ' + ech(nom);
      var seuls = nSeuls ? nb(nSeuls) + (nSeuls > 1 ? ' références que ' : ' référence que ') + nom + ' est seul à connaître' +
        (vue.perimetre ? ', sur tout le contrat' : '') : '';
      $('sous-rapprochement').textContent = !aVerifier
        ? 'Rien à vérifier : les deux bases disent la même chose' + (seuls ? ' · ' + seuls : '') + '.'
        : 'Il reste ' + nb(aVerifier) + (aVerifier > 1 ? ' plans' : ' plan') + ' à vérifier' +
          (vue.perimetre ? ' dans le périmètre' : '') + (seuls ? ' · ' + seuls : '') + '.';
    }

    /* La barre : les plans d'ici, puis, après un blanc, ce qui n'existe que
       là, à la même échelle. La part écrite dans un segment est celle des
       plans d'ici, comme dans la phrase. */
    var echelle = Math.max(nP + nSeuls, 1);
    $('barre-rapprochement').innerHTML = LOTS_RAPPROCHEMENT.map(function (l) {
      var n = comptes[l.cle];
      if (!n) return '';
      var part = 100 * n / echelle;
      var texte = l.cle !== 'absentsIci' && part >= 6 && nP ? Math.round(100 * n / nP) + '\u202f%' : '';
      return '<span class="' + l.segment + '" data-cle="' + l.cle + '" style="width:' + part.toFixed(2) + '%" title="' +
        ech(motLotRapp(l.cle, n, nom)) + '">' + texte + '</span>';
    }).join('');
    var membres = LOTS_RAPPROCHEMENT.filter(function (l) { return comptes[l.cle] && l.cle !== 'absentsIci'; })
      .map(function (l) { return motLotRapp(l.cle, comptes[l.cle], nom); });
    $('barre-rapprochement').setAttribute('aria-label', 'Rapprochement avec ' + nom + ' : ' +
      (membres.length ? membres.join(', ') + ', sur ' + nb(nP) + (nP > 1 ? ' plans' : ' plan') : 'aucun plan') +
      (nSeuls ? ' ; ' + motLotRapp('absentsIci', nSeuls, nom) : '') + '.');

    /* Les boutons : le même dessin que sous la barre du haut. Un lot à 0 se
       lit mais ne se clique pas — la rangée sert aussi de légende. */
    var actif = lotRappActif();
    $('etats-rapprochement').innerHTML = LOTS_RAPPROCHEMENT.map(function (l) {
      var n = comptes[l.cle], presse = !!n && actif === l.cle;
      var libelle = libelleRapp(l) + (vue.perimetre && l.cle === 'absentsIci' ? ' · tout le contrat' : '');
      var aide = !n ? 'Aucun' : presse ? 'Retirer le filtre'
        : l.atterrit === 'la' ? 'N’afficher que ces lignes, dans ' + nom
        : l.atterrit === 'ici' ? 'N’afficher que ces plans, dans GATES'
        : 'N’afficher que ces plans dans le tableau';
      return '<button class="etat-btn" type="button" data-cle="' + l.cle + '" data-rapp="' + l.cle + '" data-atterrit="' + l.atterrit +
        '" style="--teinte:' + l.teinte + '" aria-pressed="' + presse + '"' + (n ? '' : ' disabled') + ' title="' + ech(aide) + '">' +
        '<span class="etat-haut">' + pastilleVerdict(l.segment) + ech(libelle) + '</span>' +
        '<span class="etat-n">' + nb(n) + '</span></button>';
    }).join('');
    requestAnimationFrame(function () { alignerSousBarre('barre-rapprochement', 'filets-rapprochement', 'etats-rapprochement'); });

    var bouton = $('bouton-detail-rapprochement');
    bouton.setAttribute('aria-expanded', String(!!vue.rappDetail));
    bouton.textContent = 'détail des écarts' + (R.ecarts.length ? ' (' + nb(R.ecarts.length) + ')' : '');
    var detail = $('detail-rapprochement');
    if (!vue.rappDetail) { detail.innerHTML = ''; return; }
    if (!R.ecarts.length) {
      detail.innerHTML = '<p class="rapp-vide">Aucun champ ne diffère entre les deux bases' +
        (vue.perimetre ? ' dans ce périmètre' : '') + '.</p>';
      return;
    }
    detail.innerHTML = '<div class="feuille rapp-detail" role="region" aria-label="Détail des écarts de champ">' +
      '<div class="rapp-grille">' +
      '<div class="rapp-entete">Référence</div><div class="rapp-entete">Champ</div>' +
      '<div class="rapp-entete">GATES</div><div class="rapp-entete">' + ech(nom) + '</div>' +
      R.ecarts.map(function (e) {
        return '<div class="ref">' + ech(e.plan.reference) + '</div><div class="champ">' + ech(e.champ) + '</div>' +
          '<div>' + valeurRapp(e.ici) + '</div><div>' + valeurRapp(e.la) + '</div>';
      }).join('') + '</div></div>';
  }

  /* La bulle d'un lot : ce que c'est, combien, le détail qui aide — les
     champs comparés, la ventilation des écarts, les paires d'indices — et
     où mène le clic. Rien d'essentiel n'y vit : les comptes sont dans la
     rangée, la ventilation dans le détail des écarts. */
  var MAX_PAIRES_RAPP = 10;
  function bulleLotRapp(cle) {
    var R = RAPPROCHEMENT, rap = SRC.rapprochement, nom = nomSeconde();
    var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
    if (!lot) return '';
    var n = compteLotRapp(cle), presse = lotRappActif() === cle;
    var tete, corps = '';
    if (cle === 'identiques') {
      var champs = (Array.isArray(rap.champs) ? rap.champs : []).filter(function (c) { return c && c.la; })
        .map(function (c) { return String(c.titre || c.la); });
      tete = 'Identiques des deux côtés';
      corps = '<div class="bulle-ligne"><span class="pastille identique"></span>' + nb(n) + (n > 1 ? ' plans' : ' plan') +
        '<span class="n">' + (R.nbPlans ? Math.round(100 * n / R.nbPlans) : 0) + '\u202f%</span></div>' +
        (champs.length ? '<div class="doux">même indice, mêmes champs : ' + ech(champs.join(', ')) + '</div>' : '');
    } else if (cle === 'indiceDifferent') {
      tete = 'Le même plan, sous un autre indice';
      var paires = R.indiceDifferent.map(function (x) { return ech(x.plan.reference) + ' \u2192 ' + ech(x.ref_la.slice(-4)); });
      corps = '<div class="bulle-ligne"><span class="pastille neutre"></span>' + nb(n) + (n > 1 ? ' plans' : ' plan') + '</div>' +
        (paires.length ? '<div class="liste-refs">' + paires.slice(0, MAX_PAIRES_RAPP).join('<br>') +
          (paires.length > MAX_PAIRES_RAPP ? '<br><span class="doux">et ' + nb(paires.length - MAX_PAIRES_RAPP) + ' autres\u2026</span>' : '') + '</div>' : '');
    } else if (cle === 'ecarts') {
      tete = 'Des champs diffèrent';
      var parChamp = {}, ordre = [];
      R.ecarts.forEach(function (e) { if (!parChamp[e.champ]) { parChamp[e.champ] = 0; ordre.push(e.champ); } parChamp[e.champ]++; });
      corps = '<div class="bulle-ligne"><span class="pastille ecart"></span>' + nb(n) + (n > 1 ? ' plans' : ' plan') +
        '<span class="n">' + nb(R.ecarts.length) + (R.ecarts.length > 1 ? ' écarts' : ' écart') + '</span></div>' +
        (ordre.length ? '<div class="bulle-comptes">' + ordre.map(function (ch) {
          return '<div class="bulle-ligne"><span class="pastille sans"></span>' + ech(ch) + '<span class="n">' + nb(parChamp[ch]) + '</span></div>';
        }).join('') + '</div>' : '');
    } else if (cle === 'absentsLa') {
      tete = 'Absents de ' + nom;
      corps = '<div class="bulle-ligne"><span class="pastille absent"></span>' + nb(n) + (n > 1 ? ' plans d’ici, aucune ligne dans ' : ' plan d’ici, aucune ligne dans ') + ech(nom) + '</div>';
    } else {
      tete = 'Seulement dans ' + nom;
      corps = '<div class="bulle-ligne"><span class="pastille seul"></span>' + nb(n) + (n > 1 ? ' lignes, aucun plan d’ici sous leur racine' : ' ligne, aucun plan d’ici sous sa racine') +
        (vue.perimetre ? ' · tout le contrat' : '') + '</div>';
    }
    var fin = !n ? 'aucun' : presse ? '\u2192 retirer le filtre'
      : lot.atterrit === 'la' ? '\u2192 le tableau passe sur ' + nom
      : lot.atterrit === 'ici' ? '\u2192 le tableau passe sur GATES'
      : '\u2192 n’afficher que ceux-là dans le tableau';
    return '<div class="tete-bulle">' + ech(tete) + '</div>' + corps +
      '<div class="doux" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)">' + ech(fin) + '</div>';
  }
  function eclairerSegment(cle) {
    document.querySelectorAll('#barre-rapprochement span[data-cle]').forEach(function (seg) {
      seg.classList.toggle('survole', !!cle && seg.dataset.cle === cle);
    });
  }

  /* ============================================================
     LA SECONDE BASE, TELLE QUE SON EXTRACT
     Toutes ses colonnes, dans son ordre, sous leurs intitulés — la vue de
     référence, comme pour le tableau d'ici — et une vue essentielle si la
     source en désigne une. Le verdict du rapprochement se lit sur chaque
     ligne : la pastille dans la cellule de la référence, les cellules qui
     diffèrent d'ici sous un voile ambre. Cliquer une ligne appariée réduit
     le tableau d'ici au plan correspondant.
     ============================================================ */
  var SECONDE = null;   // { titres, cles, essentielles, vautEssentielles, premiere }
  function preparerSeconde(rap) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) { SECONDE = null; return; }
    var titres = Array.isArray(rap.colonnes) ? rap.colonnes.map(String).filter(Boolean) : [];
    if (!titres.length) {
      var vus = {};
      rap.lignes.forEach(function (l) {
        if (!l || typeof l !== 'object') return;
        Object.keys(l).forEach(function (k) { if (!vus[k]) { vus[k] = true; titres.push(k); } });
      });
    }
    var cles = [].concat(rap.cleReference).map(String);
    /* Les colonnes de la référence font toujours partie de la vue essentielle. */
    var ess = cles.filter(function (t) { return titres.indexOf(t) !== -1; });
    (Array.isArray(rap.essentielles) ? rap.essentielles : []).map(String).forEach(function (t) {
      if (titres.indexOf(t) !== -1 && ess.indexOf(t) === -1) ess.push(t);
    });
    SECONDE = {
      titres: titres, cles: cles, essentielles: ess,
      vautEssentielles: ess.length >= 2 && ess.length < titres.length - 3,
      premiere: cles[0]
    };
  }
  function lignesSecondeAffichees() {
    var R = RAPPROCHEMENT, S = vue.seconde;
    var lot = lotRappActif();
    var voulu = lot ? CATEGORIE_PAR_LOT[lot] : undefined;
    var cherche = norm(S.recherche);
    var lignes = R.lignes.filter(function (e) {
      if (e.cat === 'hors') return false;
      if (lot && (voulu === null || e.cat !== voulu)) return false;
      if (cherche && !SECONDE.titres.some(function (t) { return norm(e.ligne[t]).indexOf(cherche) !== -1; })) return false;
      return true;
    });
    if (S.tri.cle) {
      var k = S.tri.cle, sens = S.tri.asc ? 1 : -1;
      lignes = lignes.slice().sort(function (a, b) {
        var va = String(a.ligne[k] == null ? '' : a.ligne[k]), vb = String(b.ligne[k] == null ? '' : b.ligne[k]);
        if (va === '' && vb === '') return a.i - b.i;
        if (va === '') return 1;
        if (vb === '') return -1;
        return va.localeCompare(vb, 'fr', { numeric: true, sensitivity: 'base' }) * sens || a.i - b.i;
      });
    }
    return lignes;
  }
  /* L'interrupteur GATES | SEE et tout ce qui va avec : chaque outil et
     chaque tableau porte data-base, et seul ce qui appartient à la base
     montrée reste visible. Sans seconde base, l'interrupteur s'efface et le
     tableau est celui d'ici. */
  function refleterBase() {
    var laDispo = !!(RAPPROCHEMENT && SECONDE);
    if (!laDispo) vue.base = 'ici';
    var choix = $('choix-base');
    choix.hidden = !laDispo;
    $('bouton-base-la').textContent = laDispo ? nomSeconde() : 'Seconde base';
    document.querySelectorAll('#choix-base button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.base === vue.base));
    });
    document.querySelectorAll('#section-plans [data-base]:not(button)').forEach(function (el) {
      el.hidden = el.dataset.base !== vue.base ||
        (el.id === 'vue-seconde' && !(SECONDE && SECONDE.vautEssentielles));
    });
  }
  function rendreSeconde() {
    if (!RAPPROCHEMENT || !SECONDE) { $('corps-seconde').innerHTML = ''; $('tete-seconde').innerHTML = ''; return; }
    var R = RAPPROCHEMENT, S = vue.seconde, nom = nomSeconde();
    var cols = S.vueTable === 'essentielle' && SECONDE.vautEssentielles ? SECONDE.essentielles : SECONDE.titres;
    var lignes = lignesSecondeAffichees();
    var lot = lotRappActif();

    $('tete-seconde').innerHTML = '<tr class="titres-la">' + cols.map(function (t) {
      var actif = S.tri.cle === t;
      var fleche = actif ? '<svg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="' +
        (S.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      return '<th scope="col" data-cle="' + ech(t) + '" aria-sort="' + (actif ? (S.tri.asc ? 'ascending' : 'descending') : 'none') +
        '"' + (t === SECONDE.premiere ? ' class="col-fige-la"' : '') + '><button type="button" data-tri-seconde="' + ech(t) + '">' +
        ech(t) + fleche + '</button></th>';
    }).join('') + '</tr>';

    var seul = vue.refs && Object.keys(vue.refs).length === 1 ? Object.keys(vue.refs)[0] : null;
    if (!lignes.length) {
      var nAbs = R.absentsLa.length;
      $('corps-seconde').innerHTML = '<tr><td colspan="' + Math.max(cols.length, 1) + '"><div class="vide-message">' +
        (lot === 'absentsLa'
          ? 'Ces ' + nb(nAbs) + (nAbs > 1 ? ' plans n’ont pas de ligne dans ' : ' plan n’a pas de ligne dans ') + ech(nom) + '. ' +
            '<button class="lien-doux" type="button" data-aller-base="ici">Les voir dans GATES</button>'
          : 'Aucune ligne ne correspond.') +
        '</div></td></tr>';
    } else {
      $('corps-seconde').innerHTML = lignes.map(function (e) {
        var ref = e.plan ? e.plan.reference : '';
        return '<tr data-i="' + e.i + '" data-cat="' + e.cat + '"' + (ref ? ' data-plan="' + ech(ref) + '"' : '') +
          (ref && seul === ref ? ' class="choisie"' : '') +
          (ref ? ' title="' + ech(MOT_VERDICT[e.cat] || '') + ' — cliquez pour retrouver ce plan dans GATES"' : '') + '>' +
          cols.map(function (t) {
            var val = e.ligne[t], s = String(val == null ? '' : val);
            var classes = [], titre = '';
            if (t === SECONDE.premiere) classes.push('col-fige-la');
            if (e.ecarts[t] !== undefined) {
              classes.push('ecart');
              titre = ' title="Ici : ' + ech(String(e.ecarts[t] == null || e.ecarts[t] === '' ? '—' : e.ecarts[t])) + '"';
            }
            var contenu;
            if (t === SECONDE.premiere) {
              contenu = '<span class="verdict">' + pastilleVerdict(e.cat) + '<span class="ref">' + ech(s) + '</span></span>';
            } else if (s === '') { classes.push('doux'); contenu = '-'; }
            else if (estBooleen(s)) { classes.push('coche'); contenu = '<span title="' + ech(s) + '">' + (estVrai(s) ? '✓' : '–') + '</span>'; }
            else contenu = ech(s);
            return '<td' + (classes.length ? ' class="' + classes.join(' ') + '"' : '') + titre + '>' + contenu + '</td>';
          }).join('') + '</tr>';
      }).join('');
    }

    var base = R.nbLignes;
    if (vue.base === 'la') {
      $('compte').textContent = nb(lignes.length) + (lignes.length > 1 ? ' lignes' : ' ligne') +
        (lignes.length !== base ? ' sur ' + nb(base) : '');
    }
    $('legende-seconde').innerHTML = ['identique', 'emission', 'ecart', 'seul'].map(function (cat) {
      var mots = { identique: 'identique', emission: 'autre indice', ecart: 'champs différents', seul: 'seulement dans ' + nom };
      return '<span>' + pastilleVerdict(cat) + ech(mots[cat]) + '</span>';
    }).join('');
  }

  function rendre() {
    /* Le comparatif et le rapprochement dépendent du périmètre : on les
       refait avant tout le reste. */
    COMPARATIF = comparatif();
    RAPPROCHEMENT = rapprocher(SRC.rapprochement, population());
    /* Un lot posé qui n'a plus rien — autre périmètre, autre source — se
       retire de lui-même : jamais un bouton grisé qui reste pressé. */
    var lotPose = lotRappActif();
    if (lotPose && !compteLotRapp(lotPose)) poserLotRapp(lotPose);
    refleterPerimetre();
    var liste = selection();
    rendreAvancement(liste);
    rendreGraphique(liste);
    rendreJournal();
    rendreCritique(liste);
    rendreEntetes();
    rendreCorps(liste);
    rendreComparatif();
    rendreRapprochement();
    rendreSeconde();
    refleterBase();
    rendreIncomplets();
    rendreFiltresActifs();
    $('reinit').hidden = !filtreActif();
    planifierSauvegarde();
  }

  /* ============================================================ EVENEMENTS */
  var minuteur = null;
  $('recherche').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { vue.recherche = v; rendre(); }, 170);
  });

  $('etats').addEventListener('click', function (e) {
    var b = e.target.closest('.etat-btn');
    if (!b) return;
    vue.etat = vue.etat === b.dataset.etat ? '' : b.dataset.etat;
    rendre();
  });

  /* Survol d'un lot : le compte et le geste — le clic filtre le tableau, qui
     donne la liste. Pas de références ni de « et N autres » dans la bulle,
     comme pour celle du graphique. Seul le changement d'indice montre ses
     paires « ancienne → nouvelle » : c'est ce qu'il y a à reconnaître, et
     elles sont rares. */
  var MAX_PAIRES_INDICE = 10;
  $('comparatif').addEventListener('mousemove', function (e) {
    var b = e.target.closest('.puce-delta');
    var bulle = $('bulle');
    if (!b || !COMPARATIF) { bulle.dataset.visible = 'false'; return; }
    var lot = LOTS_DELTA.filter(function (l) { return l.cle === b.dataset.delta; })[0];
    var refs = COMPARATIF[b.dataset.delta];
    var paires = '';
    if (b.dataset.delta === 'indice') {
      var lignes = COMPARATIF.reemissions.filter(function (r) { return r.type === b.dataset.delta; })
        .map(function (r) { return ech(r.ancienne) + ' \u2192 ' + ech(r.ref); });
      paires = '<div class="liste-refs">' + lignes.slice(0, MAX_PAIRES_INDICE).join('<br>') +
        (lignes.length > MAX_PAIRES_INDICE ? '<br><span class="doux">et ' + nb(lignes.length - MAX_PAIRES_INDICE) + ' autres\u2026</span>' : '') +
        '</div>';
    }
    bulle.innerHTML = '<div class="tete-bulle">' + nb(refs.length) + ' ' + ech(libelleLot(lot, refs.length)) + '</div>' +
      paires +
      '<div class="doux"' + (paires ? ' style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)"' : '') + '>' +
      (vue.refsLibelle === b.dataset.delta ? 'Cliquez pour retirer le filtre' : 'Cliquez pour n\u2019afficher que ceux-l\u00e0') +
      '</div>';
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  $('comparatif').addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  $('comparatif').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-delta');
    if (!b) return;
    var cle = b.dataset.delta;
    if (vue.refsLibelle === cle) { vue.refs = null; vue.refsLibelle = ''; }
    else {
      vue.refs = {};
      COMPARATIF[cle].forEach(function (r) { vue.refs[r] = true; });
      vue.refsLibelle = cle;
    }
    rendre();
  });

  /* Les tuiles du rapprochement : les lots d'ici filtrent le tableau, comme
     les puces du comparatif ; « seulement là » filtre le tableau de là. Le
     détail se déplie à part. */
  $('rapprochement').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-rapp]');
    if (b && RAPPROCHEMENT) { poserLotRapp(b.dataset.rapp); rendre(); return; }
    var d = e.target.closest('button[data-rapp-detail]');
    if (d && RAPPROCHEMENT) { vue.rappDetail = !vue.rappDetail; rendreRapprochement(); }
  });

  /* Le tableau de la seconde base : sa recherche, ses deux vues et son tri ne
     touchent qu'à lui ; cliquer une ligne appariée réduit le tableau d'ici
     au plan correspondant, et le bandeau dit d'où vient le filtre. */
  var minuteurSeconde = null;
  $('recherche-seconde').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteurSeconde);
    minuteurSeconde = setTimeout(function () {
      vue.seconde.recherche = v;
      if (RAPPROCHEMENT) { rendreSeconde(); rendreFiltresActifs(); $('reinit').hidden = !filtreActif(); }
    }, 170);
  });
  $('vue-seconde').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vue]');
    if (!b || b.dataset.vue === vue.seconde.vueTable) return;
    vue.seconde.vueTable = b.dataset.vue;
    refleterVue();
    if (RAPPROCHEMENT) rendreSeconde();
  });
  $('tete-seconde').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tri-seconde]');
    if (!b) return;
    var t = vue.seconde.tri;
    if (t.cle === b.dataset.triSeconde) { if (t.asc) t.asc = false; else vue.seconde.tri = { cle: null, asc: true }; }
    else vue.seconde.tri = { cle: b.dataset.triSeconde, asc: true };
    if (RAPPROCHEMENT) rendreSeconde();
  });
  $('corps-seconde').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-plan]');
    if (!tr || !RAPPROCHEMENT) return;
    var ref = tr.dataset.plan;
    vue.refs = {}; vue.refs[ref] = true; vue.refsLibelle = 'plan ' + ref;
    vue.base = 'ici';
    rendre();
    var cadre = $('cadre-tableau');
    if (cadre.scrollIntoView) cadre.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  $('choix-base').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-base]');
    if (!b || b.dataset.base === vue.base) return;
    vue.base = b.dataset.base;
    rendre();
  });
  /* « Les voir dans GATES / SEE » : on change de côté sans toucher aux filtres. */
  $('section-plans').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-aller-base]');
    if (!b || b.dataset.allerBase === vue.base) return;
    vue.base = b.dataset.allerBase;
    rendre();
  });

  /* Survoler un bouton ou un segment du rapprochement éclaire le segment et
     ouvre la bulle ; le focus clavier éclaire seulement. */
  $('rapprochement').addEventListener('mousemove', function (e) {
    var cible = e.target.closest && e.target.closest('#barre-rapprochement span[data-cle], #etats-rapprochement button[data-cle]:not([disabled])');
    var bulle = $('bulle');
    eclairerSegment(cible ? cible.dataset.cle : null);
    if (!cible || !RAPPROCHEMENT) { bulle.dataset.visible = 'false'; return; }
    bulle.innerHTML = bulleLotRapp(cible.dataset.cle);
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  $('rapprochement').addEventListener('mouseleave', function () {
    eclairerSegment(null);
    $('bulle').dataset.visible = 'false';
  });
  $('etats-rapprochement').addEventListener('focusin', function (e) {
    var b = e.target.closest && e.target.closest('button[data-cle]');
    eclairerSegment(b ? b.dataset.cle : null);
  });
  $('etats-rapprochement').addEventListener('focusout', function () { eclairerSegment(null); });

  $('incomplets').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-vide');
    if (!b) return;
    var k = b.dataset.vide;
    if (vue.vides[k]) delete vue.vides[k]; else vue.vides[k] = true;
    rendre();
  });

  $('dim-critique').addEventListener('change', function (e) {
    /* Une autre dimension, d'autres noms : le filtre de la colonne de gauche
       n'aurait plus de sens, il repart à blanc. */
    vue.dimCritique = e.target.value; vue.groupe = null;
    vue.filtreGroupe = ''; $('filtre-groupe').value = '';
    rendre();
  });
  /* Le filtre de la colonne de gauche : il ne redessine que le bloc. Échap
     le vide ; le type « search » du champ fait de même par sa croix. */
  var minuteurGroupe = null;
  function poserFiltreGroupe(v) {
    clearTimeout(minuteurGroupe);
    if (v === vue.filtreGroupe) return;
    vue.filtreGroupe = v;
    rendreCritique(selection());
  }
  $('filtre-groupe').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteurGroupe);
    minuteurGroupe = setTimeout(function () { poserFiltreGroupe(v); }, 170);
  });
  $('filtre-groupe').addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    e.preventDefault();
    e.target.value = '';
    poserFiltreGroupe('');
  });
  $('zone-critique').addEventListener('click', function (e) {
    /* Un en-tete de colonne : premier clic dans le sens naturel, deuxieme dans
       l'autre, troisieme retour au classement par defaut. */
    var t = e.target.closest('button[data-trig]');
    if (t) {
      var cle = t.dataset.trig, naturel = (cle === 'nom');
      if (vue.triGroupe.cle !== cle) vue.triGroupe = { cle: cle, asc: naturel };
      else if (vue.triGroupe.asc === naturel) vue.triGroupe = { cle: cle, asc: !naturel };
      else vue.triGroupe = { cle: null, asc: false };
      planifierSauvegarde();
      rendreCritique(selection());
      var repris = document.querySelector('button[data-trig="' + cle + '"]');
      if (repris) repris.focus();
      return;
    }
    var boutonAide = e.target.closest('button[data-aide]');
    if (boutonAide) {
      vue.aideFin = !vue.aideFin;
      rendreCritique(selection());
      var repris = document.querySelector('button[data-aide]');
      if (repris) repris.focus();
      return;
    }
    var ud = e.target.closest('button[data-ud]');
    if (ud) {
      /* Une référence choisie dans la liste : le tableau se réduit à elle et
         on y descend, plutôt que de la chercher à la main. */
      vue.refs = {}; vue.refs[ud.dataset.ud] = true;
      vue.refsLibelle = 'plan ' + ud.dataset.ud;
      rendre();
      var cadre = $('cadre-tableau');
      if (cadre) cadre.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    var b = e.target.closest('.critique-ligne');
    if (!b) return;
    var meme = vue.groupe && vue.groupe.dim === vue.dimCritique && vue.groupe.val === b.dataset.groupe;
    vue.groupe = meme ? null : { dim: vue.dimCritique, val: b.dataset.groupe };
    rendre();
  });

  $('zone-journal').addEventListener('click', function (e) {
    var tout = e.target.closest('button[data-tout]');
    if (tout) {
      vue.journalOuverts['tout' + tout.dataset.tout] = true;
      rendreJournal();
      return;
    }
    var passage = e.target.closest('button[data-passage]');
    if (passage) {
      var cible = passage.dataset.passage;
      vue.journal = (vue.journal === cible) ? '' : cible;
      document.querySelectorAll('#filtre-journal button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.journal === vue.journal));
      });
      rendreJournal();
      return;
    }
    var tete = e.target.closest('button[data-semaine]');
    if (tete) {
      var i = tete.dataset.semaine;
      var ouvert = tete.getAttribute('aria-expanded') === 'true';
      vue.journalOuverts[i] = !ouvert;
      rendreJournal();
      return;
    }
    var ligne = e.target.closest('button[data-ref]');
    if (ligne) {
      /* Cliquer un plan du journal, c'est demander « lequel, exactement ? » :
         le tableau se réduit à lui, et le bandeau dit d'où vient le filtre. */
      /* Une référence d'une semaine passée peut avoir changé d'indice depuis :
         c'est le plan d'aujourd'hui, sous sa référence courante, qu'on montre. */
      var plan = planDeRef(ligne.dataset.ref);
      var ref = plan ? plan.reference : ligne.dataset.ref;
      var meme = vue.refs && Object.keys(vue.refs).length === 1 && vue.refs[ref];
      if (meme) { vue.refs = null; vue.refsLibelle = ''; }
      else {
        vue.refs = {}; vue.refs[ref] = true;
        vue.refsLibelle = 'plan ' + ref;
      }
      rendre();
      var cadre = $('cadre-tableau');
      if (cadre && !meme) cadre.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  });

  document.querySelector('#filtre-journal').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-journal]');
    if (!b) return;
    vue.journal = b.dataset.journal;
    document.querySelectorAll('#filtre-journal button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    rendreJournal();
  });

  $('filtres-actifs').addEventListener('click', function (e) {
    if (e.target.closest('#tout-effacer')) { toutEffacer(); rendre(); return; }
    var x = e.target.closest('button[data-retirer]');
    if (x) { retirerFiltre(x.dataset.retirer); rendre(); }
  });

  document.querySelector('#vue-tableau').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vue]');
    if (!b || b.dataset.vue === vue.vueTable) return;
    vue.vueTable = b.dataset.vue;
    appliquerVueTable();
    refleterVue();
    rendre();
  });

  var tete = $('tete-tableau');
  tete.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tri]');
    if (!b) return;
    if (vue.tri.cle === b.dataset.tri) vue.tri.asc = !vue.tri.asc;
    else vue.tri = { cle: b.dataset.tri, asc: true };
    rendreEntetes(); rendreCorps(selection());
    planifierSauvegarde();                  // le tri est une disposition : il survit à l'onglet
  });
  var minuteurFiltre = null;
  tete.addEventListener('input', function (e) {
    var c = e.target.closest('input[data-filtre]');
    if (!c) return;
    var cle = c.dataset.filtre, val = c.value;
    c.dataset.actif = String(!!val);
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(function () {
      if (val) vue.filtres[cle] = val; else delete vue.filtres[cle];
      var liste = selection();
      rendreAvancement(liste); rendreGraphique(liste); rendreCritique(liste); rendreCorps(liste);
      rendreFiltresActifs();                // le jeton « ATA : 21 » et sa croix
      $('reinit').hidden = !filtreActif();
    }, 170);
  });

  /* L ordre cible est calcule APRES le retrait de la colonne source,
     sinon l insertion se decale d un cran. */
  function reordonner(liste, source, cible) {
    var de = liste.indexOf(source), vers = liste.indexOf(cible);
    if (de === -1 || vers === -1 || de === vers) return liste;
    var copie = liste.slice();
    var col = copie.splice(de, 1)[0];
    var pos = copie.indexOf(cible);
    copie.splice(de < vers ? pos + 1 : pos, 0, col);
    return copie;
  }
  var cleGlissee = null;
  tete.addEventListener('dragstart', function (e) {
    var th = e.target.closest('th[draggable]');
    if (!th) return;
    cleGlissee = th.dataset.cle;
    th.classList.add('glisse');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cleGlissee);
  });
  tete.addEventListener('dragover', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee || th.dataset.cle === cleGlissee) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; th.classList.add('cible');
  });
  tete.addEventListener('dragleave', function (e) {
    var th = e.target.closest('tr.titres th');
    if (th) th.classList.remove('cible');
  });
  tete.addEventListener('drop', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee) return;
    e.preventDefault(); th.classList.remove('cible');
    vue.ordre = reordonner(vue.ordre, cleGlissee, th.dataset.cle);
    cleGlissee = null;
    rendreEntetes(); rendreCorps(selection());
    planifierSauvegarde();                  // l'ordre des colonnes aussi
  });
  tete.addEventListener('dragend', function () {
    cleGlissee = null;
    tete.querySelectorAll('.glisse, .cible').forEach(function (el) { el.classList.remove('glisse', 'cible'); });
  });

  $('reinit').addEventListener('click', function () { toutEffacer(); rendre(); });
  $('defile').addEventListener('scroll', majOmbre, { passive: true });
  document.addEventListener('keydown', function (e) {
    var champ = vue.base === 'la' ? $('recherche-seconde') : $('recherche');
    if (e.key === '/' && document.activeElement !== champ) {
      e.preventDefault(); champ.focus(); champ.select();
    }
  });
  var minuteurTaille = null;
  window.addEventListener('resize', function () {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(function () {
      rendreGraphique(selection()); ajusterSticky(); majOmbre();
      alignerSousBarre('barre', 'filets', 'etats');
      alignerSousBarre('barre-rapprochement', 'filets-rapprochement', 'etats-rapprochement');
    }, 160);
  });

  /* Exposés pour la batterie : recharger une source arbitraire — par exemple
     un jeu sans liste de contrats — sans passer par l'interface. */
  window.__jeuDExemple = jeuDExemple;
  window.__chargerSource = function (src) { chargerSource(src); remplirDims(); rendre(); };
  /* Et lire ce que la page a déduit : le journal et le comparatif, tels
     quels, pour vérifier l'appariement sans passer par le rendu. */
  window.__journal = function () { return JOURNAL; };
  window.__comparatif = function () { return COMPARATIF; };
  /* Le rapprochement tel qu'il est calculé, sur le périmètre courant. */
  window.__rapprochement = function () { return RAPPROCHEMENT; };
  /* Et le tableau de là tel qu'il est affiché : ses colonnes et ses lignes. */
  window.__secondeAffichee = function () {
    return SECONDE && RAPPROCHEMENT ? { titres: SECONDE.titres, essentielles: SECONDE.essentielles,
      lignes: lignesSecondeAffichees().map(function (e) { return { i: e.i, ref: e.ref, cat: e.cat, ecarts: Object.keys(e.ecarts) }; }) } : null;
  };
  /* Sous un périmètre : le journal tel qu'il est affiché, la série tracée et
     le domaine du plan derrière une référence — pour vérifier la dérivation. */
  window.__journalAffiche = function () { return journalAffiche(); };
  window.__serieAffichee = function () { return serieAffichee(); };
  window.__domaineDe = function (ref) { var p = planDeRef(ref); return p ? domaineDe(p) : null; };

  chargerSource(SERVEUR ? sourceDuClasseur(window.SUIVI_FWD_DONNEES) : jeuDExemple());
  chargerPrefs();
  remplirDims();
  rendre();
})();
</script>
