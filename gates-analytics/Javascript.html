<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  function ech(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/\x3C/g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /* Minuscules, sans accents, sans espaces superflus — la même réduction que
     normaliser() côté serveur (Code.gs), espaces internes comprises : un
     « Non commencé » collé depuis Excel avec une espace insécable doit se
     classer pareil des deux côtés. L'accentuation ne s'enlève que si le
     navigateur sait le faire : String.prototype.normalize est postérieur à
     ES5, et sans lui la page doit s'afficher quand même. */
  function norm(v) {
    var s = String(v == null ? '' : v).toLowerCase();
    if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return s.replace(/\s+/g, ' ').trim();
  }
  function nb(n) { return n.toLocaleString('fr-FR'); }
  /* Faire défiler jusqu'à un élément : le dictionnaire d'options est récent,
     pas la méthode — un navigateur ancien reçoit l'appel d'origine. */
  function defilerVers(el, options) {
    if (!el || !el.scrollIntoView) return;
    try { el.scrollIntoView(options); } catch (e) { el.scrollIntoView(true); }
  }
  /* Exposée pour la batterie : la même réduction que le serveur, vérifiable
     cas par cas (espace insécable, accents, espaces multiples). */
  window.__norm = norm;
  /* « 7 » → « 07 » : String.prototype.padStart n'existe pas en ES5. */
  function deuxChiffres(n) { return (n < 10 ? '0' : '') + n; }

  /* ============================================================
     SEMAINES ISO
     ============================================================ */
  function lundiDeLaSemaine(annee, semaine) {
    var jan4 = new Date(Date.UTC(annee, 0, 4));
    var jour = jan4.getUTCDay() || 7;
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jour + 1 + (semaine - 1) * 7);
    return lundi;
  }
  function etiquetteISO(d) {
    /* Minuit UTC d'abord : avec une heure dans la date, le quantième du jeudi
       devient fractionnaire et Math.ceil bascule d'une semaine — visible
       toutes les semaines des années qui commencent un vendredi (2027). */
    var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    var jour = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - jour);
    var debut = Date.UTC(t.getUTCFullYear(), 0, 1);
    var s = Math.ceil(((t.getTime() - debut) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-S' + (s < 10 ? '0' : '') + s;
  }
  /** « 2026-S34 » -> le lundi de cette semaine. null si le libellé est illisible. */
  function lundiDeLibelle(libelle) {
    var m = /^\s*(\d{4})\s*-?\s*[sS]\s*(\d{1,2})\s*$/.exec(String(libelle || ''));
    if (!m) return null;
    var s = parseInt(m[2], 10);
    if (s < 1 || s > 53) return null;
    return lundiDeLaSemaine(parseInt(m[1], 10), s);
  }

  /* ============================================================
     LES QUATRE ETATS
     << A faire >> est une valeur saisie ; << vide >> est une cellule
     non renseignee. Les confondre masquerait un defaut de saisie.
     ============================================================ */
  /* « libelle » compte des plans (« 63 Terminés »), « court » qualifie un plan
     (« À faire → Terminé ») : le pluriel n'a pas sa place dans le second. */
  var ETATS = [
    { cle: 'termine', libelle: 'Terminés',   court: 'Terminé',   couleur: 'var(--fait)',   teinte: 'var(--fait)' },
    { cle: 'encours', libelle: 'En cours',   court: 'En cours',  couleur: 'var(--cours)',  teinte: 'var(--cours)' },
    { cle: 'afaire',  libelle: 'À faire',    court: 'À faire',   couleur: 'var(--afaire)', teinte: 'var(--afaire)' },
    { cle: 'vide',    libelle: 'Non renseignés', court: 'Non renseigné', couleur: 'transparent', teinte: 'var(--filet-fort)', hachure: true }
  ];
  /* Les deux fonds soutenus portent du blanc, l'ambre garde l'encre du texte :
     c'est le couple valide par le controle de contraste. */
  function encreSegment(cle) {
    if (cle === 'termine' || cle === 'afaire') return 'var(--sur-plein)';
    return cle === 'encours' ? 'var(--sur-ambre)' : 'var(--encre)';
  }
  var ETAT_PAR_CLE = {};
  ETATS.forEach(function (e) { ETAT_PAR_CLE[e.cle] = e; });

  /* ⚠ Le COUPLE norm() + classer() existe à l'identique côté serveur
     (normaliser() + classerFWD() dans Code.gs) : le serveur s'en sert pour
     archiver les relevés, le client pour les compteurs filtrés. Toute
     modification de l'un OU de l'autre doit être reportée des deux côtés,
     sinon le dernier point de la courbe ne vaut plus la barre du jour. */
  function classer(valeur) {
    var s = norm(valeur);
    if (s === '' || s === '-') return 'vide';
    if (s.indexOf('a faire') !== -1 || s === 'non commence') return 'afaire';
    var n = parseFloat(s.replace(/[\s%]/g, '').replace(',', '.'));
    if (!isNaN(n)) {
      if (n >= 100) return 'termine';
      if (n <= 0) return 'afaire';
      return 'encours';
    }
    if (/(termine|acheve|cloture|solde|fini|ok)/.test(s)) return 'termine';
    return 'encours';
  }
  function pourcentDe(p) {
    var c = classer(p.avancement);
    if (c === 'termine') return 100;
    if (c === 'vide' || c === 'afaire') return 0;
    var n = parseFloat(norm(p.avancement).replace(/[\s%]/g, '').replace(',', '.'));
    return isNaN(n) ? 50 : n;
  }

  /* ============================================================
     REFERENCES UD
     Une référence s'écrit RACINE + INDICE + REVISION : HEL0225A017 001 A.
     La racine (3 lettres, 4 chiffres, A, 3 chiffres) est l'identité du plan ;
     la solution (3 chiffres) et l'indice (une lettre) bougent quand le plan
     est réémis. Deux relevés successifs ne portent alors plus la même chaîne
     pour le même plan : comparer les chaînes telles quelles ferait de chaque
     réémission un « disparu » plus un « nouveau ».
     ============================================================ */
  /* Une référence UD se lit par morceaux. Sur TFE2130A600001A :
       TF   le code circuit        E    toujours
       2130 l'ATA et le sous-ATA   A    toujours
       600  la séquence (600 côté pilote, 700 copilote, 800 les boîtes)
       001  la solution            A    l'indice
     La « racine » de la page va jusqu'à la séquence comprise (TFE2130A600) :
     c'est la partie qui ne bouge pas. Le gabarit ci-dessous la lit en trois
     morceaux — 3 caractères, 4 chiffres, puis 3 après le A. */
  var FORME_UD = /^([A-Z]{3})(\d{4})A(\d{3})(\d{3})([A-Z])$/;
  /* SEE écrit la même référence autrement : son A tombe un cran trop tôt —
     3 lettres, 3 chiffres, A, le reste ; GATES veut 3 lettres, 4 chiffres,
     A, le reste. GBE312A3600002B là où GATES écrit GBE3123A600002B. Les
     deux bases parlent du même plan ; on décale le A d'un cran avant de
     lire, sinon elles ne se reconnaîtraient jamais. Seul l'endroit du A
     fait la règle : ce qui suit — solution, indice — n'y entre pas, une
     solution ou un indice écrits autrement ne doivent pas empêcher les
     deux bases de se reconnaître. Une référence déjà écrite à la mode de
     GATES porte quatre chiffres avant son A : elle ne bouge pas. */
  var FORME_UD_SEE = /^[A-Z]{3}\d{3}A\d/;
  function remettreLeA(brut) {
    return FORME_UD_SEE.test(brut) ? brut.slice(0, 6) + brut.charAt(7) + 'A' + brut.slice(8) : brut;
  }
  /** L'écriture de SEE, depuis la racine de GATES : GBE3123A600 -> GBE312A3600. */
  function racineSEE(racine) {
    return /^[A-Z]{3}\d{4}A\d{3}$/.test(racine) ? racine.slice(0, 6) + 'A' + racine.charAt(6) + racine.slice(8) : racine;
  }
  /** Tolérant aux séparateurs (-, _, espace, point, /) et à la casse. Une
      référence hors format garde sa forme entière — sans espaces autour, en
      capitales — comme racine ; elle n'est jamais appariée à une autre. */
  function analyserUD(ref) {
    var brut = String(ref == null ? '' : ref).trim().toUpperCase();
    var m = FORME_UD.exec(remettreLeA(brut.replace(/[-_\s.\/]+/g, '')));
    if (!m) return { racine: brut, solution: '', indice: '', valide: false };
    return { racine: m[1] + m[2] + 'A' + m[3], solution: m[4], indice: m[5], valide: true };
  }
  /* Le rang d'une émission : sert à choisir, entre deux candidates de même
     racine, la plus proche de celle qui a disparu. */
  function rangUD(ud) { return Number(ud.solution) * 26 + (ud.indice.charCodeAt(0) - 65); }
  /* Une réémission : un changement d'indice (la lettre), le plan restant le même. */
  function estReemission(e) { return e.type === 'indice'; }
  /* L'identité d'un plan : sa racine ET sa solution. Une autre solution,
     c'est un autre plan — seul l'indice bouge sans changer de plan. */
  function clePlan(ud) { return ud.racine + ud.solution; }
  /* La clé qui sert à apparier deux bases. Une référence hors format garde sa
     chaîne entière comme racine : sans marque, « TFE2130A600001 » (illisible,
     sans indice) donnerait la même clé que le plan TFE2130A600 solution 001,
     et les deux se prendraient l'un pour l'autre. Le point d'interrogation
     range les illisibles à part : ils ne s'apparient à rien. */
  function cleAppariement(ud) { return ud.valide ? clePlan(ud) : '?' + ud.racine; }
  /* Exposée pour la batterie : une fonction pure se vérifie cas par cas. */
  window.__analyserUD = analyserUD;
  window.__racineSEE = racineSEE;

  /* Compare deux cartes plan par plan { ref: avancement } et rend les
     événements : 'change' (même référence, autre état), 'nouveau', 'disparu'
     et 'indice'. Les références qui ne se retrouvent pas telles quelles sont
     appariées par racine + solution : un plan parti d'un côté et revenu de
     l'autre sous une autre lettre est le même plan réémis — un changement
     d'indice. Une autre solution est un autre plan : rien à apparier. Quand
     plusieurs candidates se présentent, la plus proche l'emporte ; les
     autres restent nouvelles ou disparues. Une référence hors format n'a pas
     de racine au sens propre : elle n'est jamais appariée. */
  function apparier(avant, apres) {
    var a = Object.prototype.hasOwnProperty;
    var evenements = [], partis = {}, venus = {};
    Object.keys(apres).forEach(function (ref) {
      if (a.call(avant, ref)) {
        var ea = classer(avant[ref]), eb = classer(apres[ref]);
        if (ea !== eb) evenements.push({ ref: ref, type: 'change', avant: ea, apres: eb });
        return;
      }
      var ud = analyserUD(ref);
      if (ud.valide) (venus[clePlan(ud)] = venus[clePlan(ud)] || []).push({ ref: ref, rang: rangUD(ud), ud: ud });
      else evenements.push({ ref: ref, type: 'nouveau', apres: classer(apres[ref]) });
    });
    Object.keys(avant).forEach(function (ref) {
      if (a.call(apres, ref)) return;
      var ud = analyserUD(ref);
      if (ud.valide) (partis[clePlan(ud)] = partis[clePlan(ud)] || []).push({ ref: ref, rang: rangUD(ud), ud: ud });
      else evenements.push({ ref: ref, type: 'disparu', avant: classer(avant[ref]) });
    });
    Object.keys(venus).forEach(function (racine) {
      var paires = [];
      (partis[racine] || []).forEach(function (p) {
        venus[racine].forEach(function (v) { paires.push({ p: p, v: v, d: Math.abs(v.rang - p.rang) }); });
      });
      paires.sort(function (x, y) { return (x.d - y.d) || (x.p.rang - y.p.rang) || (x.v.rang - y.v.rang); });
      paires.forEach(function (pr) {
        if (pr.p.pris || pr.v.pris) return;
        pr.p.pris = pr.v.pris = true;
        evenements.push({ ref: pr.v.ref, type: 'indice', ancienne: pr.p.ref,
                          avant: classer(avant[pr.p.ref]), apres: classer(apres[pr.v.ref]) });
      });
      venus[racine].forEach(function (v) {
        if (!v.pris) evenements.push({ ref: v.ref, type: 'nouveau', apres: classer(apres[v.ref]) });
      });
    });
    Object.keys(partis).forEach(function (racine) {
      partis[racine].forEach(function (p) {
        if (!p.pris) evenements.push({ ref: p.ref, type: 'disparu', avant: classer(avant[p.ref]) });
      });
    });
    return evenements;
  }

  /* ============================================================
     ANCIENNETE
     Dimension derivee de la colonne de date : un plan cree il y a longtemps
     et toujours pas termine est celui sur lequel il faut se pencher.
     ============================================================ */
  var MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                    'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  /* Une date de création brute ferait autant de groupes que de jours : on
     regroupe au mois, ce qui se lit et se compare. */
  /* Une date arrive telle que le classeur l'affiche : « 16/07/2020 » sur une
     feuille française, « 2020-07-16 » (avec ou sans heure) ailleurs. Ne lire
     qu'un seul des deux ordres reviendrait à ne jamais trouver l'ancienneté
     sur la moitié des exports — sans que rien ne le signale. */
  function anneeEtMois(valeur) {
    var t = String(valeur == null ? '' : valeur).trim();
    var iso = /^(\d{4})[-\/.](\d{1,2})/.exec(t);
    if (iso) {
      var mi = Number(iso[2]);
      return mi >= 1 && mi <= 12 ? { annee: Number(iso[1]), mois: mi } : null;
    }
    var fr = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(t);
    if (!fr) return null;
    var an = Number(fr[3]);
    if (an < 100) an += an < 70 ? 2000 : 1900;
    /* Jour puis mois, comme en France — sauf si le premier nombre dépasse
       douze : il est alors forcément le jour, et l'autre le mois. */
    var a = Number(fr[1]), b = Number(fr[2]);
    var mois = a > 12 ? b : (b > 12 ? a : b);
    return mois >= 1 && mois <= 12 ? { annee: an, mois: mois } : null;
  }
  /* Écart en mois entre une date de cellule et une date de référence.
     `null` quand la cellule ne porte pas de date lisible. */
  function moisEntre(valeur, reference) {
    var v = anneeEtMois(valeur);
    if (!v) return null;
    return (reference.getUTCFullYear() - v.annee) * 12 +
           (reference.getUTCMonth() + 1 - v.mois);
  }
  /* Exposée pour la batterie : une fonction pure se vérifie directement, cas
     par cas, plutôt que devinée à travers l'interface. */
  window.__anneeEtMois = anneeEtMois;
  function moisDe(valeur) {
    var v = anneeEtMois(valeur);
    return v ? MOIS_COURT[v.mois - 1] + ' ' + v.annee : '\u2014';
  }
  function rangMois(nom) {
    if (nom === '\u2014') return -1;
    var bout = nom.split(' ');
    return Number(bout[1]) * 12 + MOIS_COURT.indexOf(bout[0]);
  }

  var ORDRE_ANCIENNETE = ['moins d’un mois', '1 à 3 mois', '3 à 6 mois', 'plus de 6 mois'];
  function ancienneteDepuis(valeur, reference) {
    var mois = moisEntre(valeur, reference);
    if (mois === null) return '—';
    if (mois >= 6) return 'plus de 6 mois';
    if (mois >= 3) return '3 à 6 mois';
    if (mois >= 1) return '1 à 3 mois';
    return 'moins d’un mois';
  }

  /* Un relevé : les comptes globaux, les comptes par dimension, et
     l'avancement plan par plan quand on veut pouvoir faire le comparatif. */
  function releveDepuis(plans, i, clesDim, valeurDe, avecPlans) {
    var r = { i: i, total: plans.length, termine: 0, encours: 0, afaire: 0, vide: 0, groupes: {}, plans: null };
    clesDim.forEach(function (d) { r.groupes[d] = {}; });
    plans.forEach(function (p) {
      r[p._etat]++;
      clesDim.forEach(function (d) {
        var v = String(valeurDe(p, d) || '—');
        if (!r.groupes[d][v]) r.groupes[d][v] = { total: 0, termine: 0 };
        r.groupes[d][v].total++;
        if (p._etat === 'termine') r.groupes[d][v].termine++;
      });
    });
    if (avecPlans) {
      r.plans = {};
      plans.forEach(function (p) { r.plans[p.reference] = p.avancement; });
    }
    return r;
  }

  /* ============================================================
     JEU D'EXEMPLE
     Il ne sert que lorsque la page tourne seule, sans classeur derrière.
     Dans l'application réelle, Apps Script injecte window.SUIVI_FWD_DONNEES
     avant ce script : colonnes réelles, plans, relevés archivés, jalons.
     ============================================================ */
  /* Les 138 colonnes de l'export GATES, intitulés, groupes et ordre repris à

  var COLONNES_GATES = [

    { cle: "validite_2", groupe: "HDK AA 011", titre: "Validité" },

    { cle: "avancement_definition_electrique_2", groupe: "HDK AA 011", titre: "Avancement Définition Electrique" },
    { cle: "a_traiter_par_2", groupe: "HDK AA 011", titre: "A traiter par" },

    'User Status', 'DIAGRAM TYPE', 'PRODUCT FAMILY', 'Validated', 'FG1 TAGDESCRIPTION', 'FG2 TAGDESCRIPTION',
    'SCHEMA NUMBER', 'Released Date', 'Obsolete Date', 'Validated Date', 'REDRAW', 'ARCHIVED', 'CGM', 'XPEMPTY'];
  var AVIONS_SEE = ['2851', '2860', '2874', '2902', '2915'];
  function rapprochementDExemple(plans) {
    var lignes = [];
    function ligneSEE(racine, solution, indice, i, p, enCours) {
      var l = {};
      var nom = racineSEE(racine);   // l'extract écrit le A un cran plus loin
      l['NAME'] = nom;
      l['SOL.'] = solution;
      l['Cust.V'] = indice;
      l['Int. V'] = String(1 + (i % 3));
      l['ARCHIVE FILE PREFIX'] = 'WD_' + nom + '_' + solution + indice;
      l['VALIDITY PSN FULL'] = AVIONS_SEE[i % AVIONS_SEE.length];
      l['User Status'] = enCours ? 'In Work' : 'Released';
      l['DIAGRAM TYPE'] = ['WD', 'HD', 'SD'][i % 3];
      l['PRODUCT FAMILY'] = p ? p.produit : 'SUPER PUMA';
      l['Validated'] = enCours ? 'FALSE' : 'TRUE';
      l['FG1 TAGDESCRIPTION'] = p ? p.nom_installation : 'Harnais alimentation cabine';
      l['FG2 TAGDESCRIPTION'] = i % 4 === 0 && p ? 'Zone ' + p.chapitre + p.sous_chapitre : '';
      l['SCHEMA NUMBER'] = p ? p.cc : '32499';
      l['Released Date'] = p ? p.date_creation : '2026-01-15';
      l['Obsolete Date'] = '';
      l['Validated Date'] = enCours ? '' : '2026-0' + (1 + i % 9) + '-1' + (i % 9);
      l['REDRAW'] = p && p.redraw === 'true' ? 'TRUE' : 'FALSE';
      l['ARCHIVED'] = 'FALSE';
      l['CGM'] = enCours ? 'FALSE' : 'TRUE';
      l['XPEMPTY'] = 'FALSE';
      return l;
    }
    /* Les terminés vont dans SEE, sauf quelques-uns (manque) ; parmi eux,
       quelques-uns sous une autre lettre (emission). Les autres n'y sont pas,
       sauf quelques-uns (avance) : SEE les connaît déjà, GATES ne suit pas. */
    var rangT = 0, rangA = 0, faits = { manque: 0, emission: 0, avance: 0 };
    plans.forEach(function (p, i) {
      var termine = classer(p.avancement) === 'termine';
      var ud = analyserUD(p.reference), indice = ud.indice;
      if (termine) {
        rangT++;
        if (rangT % 23 === 7 && faits.manque < CHOIX_EXEMPLE.manque) { faits.manque++; return; }
        if (rangT % 29 === 20 && faits.emission < CHOIX_EXEMPLE.emission) {
          faits.emission++; indice = String.fromCharCode(ud.indice.charCodeAt(0) + 1);
        }
        lignes.push(ligneSEE(ud.racine, ud.solution, indice, i, p, false));
      } else {
        rangA++;
        if (rangA % 13 === 3 && faits.avance < CHOIX_EXEMPLE.avance) {
          faits.avance++; lignes.push(ligneSEE(ud.racine, ud.solution, indice, i, p, true));
        }
      }
    });
    /* Ce que SEE est seul à connaître : de vraies références, d'un circuit
       (ZZ) et d'un ATA (99) que GATES n'emploie pas — elles ne peuvent donc
       s'apparier à aucun plan, sans cesser d'être bien formées. */
    for (var k = 0; k < CHOIX_EXEMPLE.seul; k++) {
      lignes.push(ligneSEE('ZZE99' + deuxChiffres(10 + k) + 'A800', '001', 'A', k, null, false));
    }
    return {
      nom: 'SEE',
      titre: 'Nommage WD BFLOW',
      cleReference: ['NAME', 'SOL.', 'Cust.V'],
      colonnes: COLONNES_SEE,
      lignes: lignes
    };
  }

  /* ============================================================
     SOURCE DES DONNEES
     Une « source » est un paquet { colonnes, plans, releves, jalons,
     contrats… } : le jeu d'exemple quand la page tourne seule, le paquet du
     classeur dans l'add-on. Tout l'état qui en découle se recalcule d'un
     bloc dans chargerSource() — le même chemin sert au premier affichage,
     au passage en mode « Exemple » et au changement de contrat, donc les
     trois offrent exactement les mêmes fonctions. Les écouteurs, eux, sont
     posés une seule fois sur les éléments fixes de la page.
     ============================================================ */
  /* Un classeur derrière la page, ou non : c'est la présence du paquet qui
     le dit, pas son contenu. Un paquet que le classeur n'a pas pu remplir
     reste un paquet du classeur — la page l'affiche vide et dit pourquoi,
     elle ne lui substitue pas la démonstration (voir sourceDuClasseur). */

  /* Pont facultatif vers le classeur : présent seulement dans l'add-on. */

  var SRC = null;                  // la source affichée : réelle, ou son exemple
  var SRC_REELLE = null;           // la dernière source réelle chargée
  var COLONNES, PAR_CLE, CLE_DATE, PLANS, RELEVES_SRC, BASE, AUJ;
  var CLES_DIM, CLE_DOMAINE, CLES_ESSENTIELLES, VAUT_ESSENTIELLES, CLE_LIBELLE;
  var RELEVES, DERNIER, EVENEMENTS_IMPORT, COMPARATIF, RAPPROCHEMENT, jalons;
  /* La figure de la comparaison s'anime une fois par source : le drapeau se
     lève au chargement, le premier rendu le consomme. */
  var ANIMER_FIGURE = false, GUETTEUR_FIGURE = null;
  /* On guette le cadre de la figure, pas son SVG : un filtre ou un
     périmètre touché avant d'arriver là redessine le SVG, et le cadre, lui,
     demeure. À l'apparition, c'est le SVG du moment qui s'anime. */
  function animerALApparition(cadre) {
    if (!cadre) return;
    if (GUETTEUR_FIGURE) { GUETTEUR_FIGURE.disconnect(); GUETTEUR_FIGURE = null; }

    if (!window.IntersectionObserver) { animer(); return; }
    var obs = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (en) {
        if (!en.isIntersecting) return;

  var DIMENSIONS, TITRE_DIM, ORDRE_FEUILLE, PLAN_PAR_REF, PLAN_PAR_RACINE, JOURNAL;
  var RELEVES_REELS, AUJ_REEL, BASE_REELLE;
  var CONTRATS, CONTRAT;
  var vue = null;

  /* La source qu'un paquet du classeur donne à la page. Complet, il passe
     tel quel. Sinon — feuille vide, contrat introuvable, erreur du script —
     une source vide qui garde ce que le paquet sait encore dire (contrats,
     jalons) et porte son message : la page s'ouvre sans plan et l'explique,
     au lieu de montrer 640 plans fictifs sous « Données réelles ». */
  function sourceDuClasseur(paquet) {
    if (paquet && paquet.ok !== false && Array.isArray(paquet.plans) && paquet.plans.length) return paquet;
    var p = paquet || {};
    return {
      colonnes: [], plans: [], releves: [],
      jalons: Array.isArray(p.jalons) ? p.jalons : [],
      contrats: Array.isArray(p.contrats) ? p.contrats : [],
      contrat: p.contrat || '',
      message: String(p.message || '') || 'Le classeur n’a renvoyé aucun plan.',
      vide: true
    };
  }

  /* Le repère temporel : la semaine du premier relevé archivé. Tout l'axe du
     graphique est un décalage en semaines par rapport à ce lundi-là. */
  function dateDe(i) { return dateDeBase(BASE, i); }
  function etiquette(i) { return etiquetteISO(dateDe(i)); }
  function indexDe(semaine) {
    var l = lundiDeLibelle(semaine);
    return l === null ? null : Math.round((l.getTime() - BASE.getTime()) / 604800000);
  }

  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
              'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  /** Le numéro de semaine, sans son zéro : « 2026-S08 » -> « 8 ». */
  function numeroSemaine(i) { return etiquette(i).slice(6).replace(/^0/, ''); }
  /** Aujourd'hui, tel que l'affiche le calendrier du poste, ramené à minuit UTC :
      les calculs de semaine se font en UTC, l'horloge de la lectrice est locale. */
  function aujourdhuiCivil() {
    var n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }
  /** L'index de la semaine où l'on est aujourd'hui — pas celle du dernier relevé. */
  function semaineDAujourdhui() {
    var i = indexDe(etiquetteISO(aujourdhuiCivil()));
    return i === null ? AUJ : i;
  }
  /* Ce que dit la ligne quand le dernier relevé n'est pas de cette semaine :
     sa semaine, son année si ce n'est plus la même, et l'âge — en semaines
     tant que le compte parle, en mois au-delà. Un relevé postérieur à
     aujourd'hui (horloge du poste en retard, semaine saisie à la main) se
     dit aussi, plutôt que de laisser la page se contredire en silence. */
  function motDuDernierReleve(iAuj) {
    if (!(RELEVES_SRC && RELEVES_SRC.length) || iAuj === AUJ) return '';
    var lib = etiquette(AUJ), annee = lib.slice(0, 4);
    var mot = 'dernier relevé : semaine ' + numeroSemaine(AUJ) +
      (annee !== etiquette(iAuj).slice(0, 4) ? ' de ' + annee : '');

    if (retard < 0) return mot + ' — à venir';
    if (retard > 8) {

  }

  /* Sous le titre : la semaine où l'on est, avec ses dates. Les chiffres de

     semaine dernière en croyant qu'ils sont d'aujourd'hui. */
  var SEMAINE_AFFICHEE = null;
  function afficherSemaine() {
    var iAuj = semaineDAujourdhui();
    SEMAINE_AFFICHEE = iAuj;
    var lundi = dateDe(iAuj);
    var dimanche = new Date(lundi.getTime()); dimanche.setUTCDate(lundi.getUTCDate() + 6);
    var m1 = MOIS[lundi.getUTCMonth()], m2 = MOIS[dimanche.getUTCMonth()];

      ? 'du ' + lundi.getUTCDate() + ' au ' + dimanche.getUTCDate() + ' ' + m2 + ' ' + dimanche.getUTCFullYear()
      : 'du ' + lundi.getUTCDate() + ' ' + m1 + ' au ' + dimanche.getUTCDate() + ' ' + m2 + ' ' + dimanche.getUTCFullYear();

    $('releve-semaine').hidden = !(RELEVES_SRC && RELEVES_SRC.length) || iAuj === AUJ;
    $('releve-semaine').textContent = motDuDernierReleve(iAuj);
  }

  function valeurDim(p, cle) {
    if (cle === '_anciennete') return ancienneteDepuis(p[CLE_DATE], dateDe(AUJ));
    if (cle === '_mois') return moisDe(p[CLE_DATE]);
    return p[cle];
  }

  /* Plusieurs colonnes de l'export sont des booléens écrits « true » / « false ».
     Le tableau les montre telles quelles — c'est l'extract. Dans le bloc
     d'analyse, où la valeur devient un nom de groupe lu par tout le monde, on
     les dit en français. Le filtrage continue de porter sur la valeur brute. */
  function libelleGroupe(v) {
    var n = norm(v);
    if (n === 'true' || n === 'vrai') return 'Oui';
    if (n === 'false' || n === 'faux') return 'Non';
    return v;
  }

  /* Les jalons d'une source, en indices de semaine. Ils sont fixes : ils
     viennent de la configuration et ne s'éditent pas à l'écran. Ceux qui ne
     tombent sur aucune semaine lisible sont écartés ; le texte est coupé à
     60 caractères, la même règle que le serveur, pour qu'une configuration
     bavarde ne fasse pas déborder la frise. Un jalon peut porter un
     périmètre — la valeur de la colonne de domaine à laquelle il s'applique
     (« Diffusion PH Perso » ne vaut que pour PERSO) ; sans périmètre, il vaut
     pour tous les plans. */
  function jalonsDe(liste) {
    return (Array.isArray(liste) ? liste : []).map(function (j) {
      if (!j) return null;
      var texte = String(j.texte || 'Jalon').trim().slice(0, 60) || 'Jalon';
      return { i: indexDe(j.semaine), texte: texte, perimetre: String(j.perimetre || '').trim().slice(0, 40) };
    }).filter(function (j) { return j && j.i !== null; })
      .sort(function (a, b) { return a.i - b.i; });
  }

  /* Un jalon compte-t-il sous le périmètre choisi ? Sans périmètre choisi

     pas. Casse et accents indifférents, comme partout ailleurs. */

    return !j.perimetre || !vue.perimetre || norm(j.perimetre) === norm(vue.perimetre);
  }

     pilote l'« effort demandé » et la droite « requis pour … ». */

      .sort(function (a, b) { return a.i - b.i; })[0];
  }

  /**
   * Dérive tout l'état de la page d'une source. Rejouable : la source

    RELEVES_SRC = (src.releves || []).filter(function (r) { return r && lundiDeLibelle(r.semaine); });
    RELEVES_SRC.sort(function (a, b) { return lundiDeLibelle(a.semaine) - lundiDeLibelle(b.semaine); });

    /* Le plafond de l'axe suit l'historique : deux ans, ou un an au-delà

    /* Sur un export de dix colonnes, une « vue essentielle » n'apporte rien :

    VAUT_ESSENTIELLES = CLES_ESSENTIELLES.length >= 2 &&
                        CLES_ESSENTIELLES.length < COLONNES.length - 3;
    /* Le libellé d'un plan : la première colonne de texte long, pour que le

    CLE_LIBELLE = null;

    }

       est passé à 100 %. L'historique ne peut donc pas être reconstitué —

    RELEVES = RELEVES_SRC.map(function (r) {

    if (dernier && dernier.i === AUJ) {

       serrés puis rien pendant quinze jours. */
    var parSemaine = {};
    RELEVES.forEach(function (r) { parSemaine[r.i] = r; });
    RELEVES = Object.keys(parSemaine)
      .map(function (k) { return parSemaine[k]; })
      .sort(function (a, b) { return a.i - b.i; });

    DERNIER = RELEVES[RELEVES.length - 1];
    $('import').textContent = 'Dernier import : semaine ' + etiquette(DERNIER.i).slice(5) + ' · ' +

    /* « Jeu d'exemple » ne se lit que dans la démonstration — seule, ou

       comparatif affiché en découle, restreint au périmètre courant. */
    EVENEMENTS_IMPORT = evenementsImport();

    /* Les jalons viennent uniquement de la source : la configuration du
       classeur dans l'add-on, des dates posées en dur dans la démonstration. */
    jalons = jalonsDe(src.jalons);

      .filter(function (c) { return c !== '_mois' && PAR_CLE[c]; })
      .map(function (c) { return PAR_CLE[c]; })

    DIMENSIONS.forEach(function (d) { TITRE_DIM[d.cle] = d.titre; });

    PLAN_PAR_RACINE = {};
    PLANS.forEach(function (p) { PLAN_PAR_REF[p.reference] = p; PLAN_PAR_RACINE[p._racine] = p; });
    MEMO_DERIVE = {};
    JOURNAL = construireJournal();

    /* Ce dont l'exemple a besoin pour se fabriquer : la vraie « aujourd'hui ». */
    if (!src.exemple) { RELEVES_REELS = RELEVES; AUJ_REEL = AUJ; BASE_REELLE = BASE; }

    CONTRATS = (Array.isArray(src.contrats) ? src.contrats : [])
      .filter(function (c) { return c && c.id !== undefined && c.id !== null && c.id !== ''; })
      .map(function (c) { return { id: String(c.id), nom: String(c.nom || c.id) }; });
    CONTRAT = (src.contrat !== undefined && src.contrat !== null && src.contrat !== '')

  }

  /* La « vue » : ce que le lecteur a posé sur la page. Les filtres, la
     sélection, le périmètre et le cadrage appartiennent à une source et
     repartent de zéro avec elle — on ouvre toujours sur « Tout » ; la
     disposition — dimension, colonnes, tris, vue du tableau — est une
     préférence qui traverse les sources, tant que la nouvelle la permet. */
  /* Le cadrage d'ouverture : aujourd'hui dans le cadre avec treize semaines
     de recul, et tous les jalons configurés dans le champ — c'est là qu'on
     regarde. Il est rejoué à chaque source ; un cadrage mémorisé ne le
     remplace que s'il montre encore aujourd'hui (voir chargerPrefs). Sans
     cela, passé quelques mois d'archivage, la page s'ouvrirait sur le passé
     seul. bornerFenetre() ramène le tout sous le plafond de l'axe. */
  function cadrageParDefaut() {
    var debut = Math.max(0, AUJ - 13);
    var dernierJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    return { debut: debut, span: Math.max(28, dernierJalon - debut + 3) };
  }

  function remettreVue() {
    var avant = vue;
    vue = {
      recherche: '', etat: '', filtres: {},
      groupe: null, refs: null, refsLibelle: '',
      vides: {}, perimetre: '',
      journal: '', journalOuverts: {}, groupesTout: false,
      aideFin: false,
      /* Plan par plan : les groupes que le lecteur a pliés ou dépliés
         lui-même ; les autres suivent la règle (à vérifier : déplié ; ce qui
         va : replié). */
      plisRapp: {},
      /* Le rapprochement : le lot « seulement là » posé sur le tableau de
         là. Rien n'est mémorisé. */
      lotLa: null,
      /* Le tableau de la seconde base : sa recherche, ses deux vues, son tri.
         Le tri vide, c'est l'ordre de l'extract. */
      seconde: { recherche: '', vueTable: 'toutes', tri: { cle: null, asc: true } },
      /* La base montrée dans le tableau : ici (GATES) ou là (la seconde). */
      base: 'ici',
      exemple: !!SRC.exemple,
      fen: cadrageParDefaut(),
      /* L'ordre de la feuille, sans exception : tout le monde doit voir le même
         tableau que l'export. Le verrouillage à gauche s'adapte à cet ordre
         plutôt que l'inverse. Et le tableau s'ouvre complet : c'est l'extract.
         La vue essentielle est là pour l'autre besoin. */
      ordre: ORDRE_FEUILLE.slice(),
      /* Les colonnes cachées : la mécanique interne de la vue essentielle,
         jamais une préférence. */
      cachees: {},
      tri: { cle: 'reference', asc: true },
      dimCritique: (SRC.dimParDefaut && CLES_DIM.indexOf(SRC.dimParDefaut) !== -1) ? SRC.dimParDefaut : (CLES_DIM[0] || ''),
      triGroupe: { cle: null, asc: false },
      /* Le filtre de la colonne de gauche du bloc : un texte cherché dans le
         nom des groupes. Ni mémorisé, ni conservé d'une dimension à l'autre. */
      filtreGroupe: '',
      /* Deux vues du tableau, et rien entre les deux : « toutes » montre l'export
         tel quel, dans son ordre ; « essentielle » ne garde que ce qu'on regarde. */
      vueTable: 'toutes'
    };
    if (!avant) return;
    appliquerDisposition(avant);
    vue.vueTable = avant.vueTable === 'essentielle' ? 'essentielle' : 'toutes';
    if (vue.vueTable === 'essentielle') appliquerVueTable();
    if (avant.seconde && avant.seconde.vueTable === 'essentielle') vue.seconde.vueTable = 'essentielle';
  }

  /* Les commandes fixes de la page reflètent la vue : le champ de recherche,
     les interrupteurs du journal, du tableau et du mode. */
  function refleterVue() {
    $('recherche').value = vue.recherche;
    $('filtre-groupe').value = vue.filtreGroupe;
    document.querySelectorAll('#filtre-journal button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.journal === vue.journal));
    });
    document.querySelectorAll('#vue-tableau button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.vueTable));
    });
    $('recherche-seconde').value = vue.seconde.recherche;
    document.querySelectorAll('#vue-seconde button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.seconde.vueTable));
    });
    afficherMode();
  }

  /* Le bandeau du haut dit dans quel mode on est. La phrase dit exactement ce
     qui est fabriqué : l'historique, pas les plans. Une phrase qui exagère se
     fait prendre en défaut et on ne croit plus rien. */
  function afficherMode() {
    var actif = !!vue.exemple;
    var demo = actif && !!(SRC && SRC.demonstration);
    document.body.dataset.exemple = String(actif);
    document.querySelectorAll('#mode-donnees button').forEach(function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.mode === 'exemple') === actif));
    });
    $('mot-mode').innerHTML = demo
      ? '\x3Cb>Démonstration\x3C/b> — le classeur n\'a pas encore de données : trois contrats fictifs, pour voir la page entière.'
      : actif
        ? '\x3Cb>Historique fabriqué\x3C/b> — un aperçu de ce que la page montrera quand les relevés se seront accumulés.'
        : SERVEUR ? '' : '\x3Cb>Démonstration\x3C/b> — trois contrats fictifs ; devant votre classeur, ce mode montre vos données.';
    /* Ce que le classeur a à dire — feuille vide, colonne d'avancement
       absente — s'affiche à côté, en alerte : hors exemple, et sous la
       démonstration aussi, puisque c'est la raison d'y être. */
    var message = SRC && SRC.message && (!actif || demo) ? String(SRC.message) : '';
    $('alerte-source').hidden = !message;
    $('alerte-source').textContent = message;
  }

  /* Le sélecteur de contrat et le rappel du contrat courant sous le titre.
     Avec un seul contrat, ni l'un ni l'autre n'a quelque chose à dire. */
  function afficherContrat() {
    var plusieurs = CONTRATS.length > 1;
    var courant = CONTRATS.filter(function (c) { return c.id === CONTRAT; })[0];
    var sel = $('select-contrat');
    $('choix-contrat').hidden = !plusieurs;
    sel.innerHTML = CONTRATS.map(function (c) {
      return '\x3Coption value="' + ech(c.id) + '">' + ech(c.nom) + '\x3C/option>';
    }).join('');
    sel.value = CONTRAT;
    sel.disabled = false;
    $('etat-contrat').textContent = '';
  }

  /* ------------------------------------------------------------
     RYTHME
     La saisie est irrégulière : une semaine on solde un lot entier,
     la suivante rien. Une moyenne sur six semaines mesure donc surtout
     la date du dernier lot, pas la cadence réelle.
     On calcule à la place TOUS les rythmes soutenus observés — depuis le
     premier relevé, depuis le deuxième, etc. jusqu'au dernier intervalle —
     et on en garde l'étendue. Chaque borne est un rythme qui a réellement
     tenu sur une période réelle ; l'écart entre les deux, c'est l'irrégularité
     elle-même, rendue visible au lieu d'être moyennée.
     ------------------------------------------------------------ */
  function rythmes(pts) {
    if (!pts || pts.length < 2) return null;
    var premier = pts[0], dernier = pts[pts.length - 1];
    var semaines = dernier.i - premier.i;
    if (semaines <= 0) return null;
    return {
      central: (dernier.termine - premier.termine) / semaines,
      gagnes: dernier.termine - premier.termine,
      semaines: semaines,
      n: pts.length
    };
  }

  /** Semaine d'arrivée à un rythme donné, ou null si ce rythme ne mène nulle part. */
  function semaineFin(atteint, total, rythme) {
    if (!rythme || rythme <= 0) return null;
    return AUJ + Math.ceil((total - atteint) / rythme);
  }

  /* Ce qui a bougé entre les deux derniers imports. Invisible à l'œil nu
     sur 186 lignes, et c'est pourtant la question de chaque semaine. */
  /* On compte les passages d'un état à l'autre, avec les mots des quatre états :
     « passés en terminé » et non « ont avancé ». */
  /* Les références sont appariées par racine (voir apparier) : un plan réémis
     va dans « changements d'indice », sous sa nouvelle référence — et aussi
     dans le lot de son état d'arrivée s'il en a changé au passage, car il
     est alors bien passé en terminé, ou en cours. Le passage à « vide » n'est
     pas un lot : une cellule effacée n'est pas un progrès à annoncer. */
  function evenementsImport() {
    if (RELEVES.length < 2) return null;
    var avant = RELEVES[RELEVES.length - 2].plans;
    if (!avant || !DERNIER.plans) return null;
    return apparier(avant, DERNIER.plans);
  }
  /* Le comparatif affiché : les mêmes événements, restreints au périmètre. */
  function comparatif() {
    if (!EVENEMENTS_IMPORT) return null;
    var d = { termine: [], encours: [], afaire: [], nouveaux: [], disparus: [], indice: [], reemissions: [] };
    EVENEMENTS_IMPORT.filter(dansPerimetreEvt).forEach(function (e) {
      if (e.type === 'nouveau') { d.nouveaux.push(e.ref); return; }
      if (e.type === 'disparu') { d.disparus.push(e.ref); return; }
      /* Un plan réémis compte une fois, sous « changement d'indice » — même
         s'il change d'état au passage : la bulle et le journal le disent. */
      if (estReemission(e)) { d.indice.push(e.ref); d.reemissions.push({ ref: e.ref, ancienne: e.ancienne, type: e.type }); return; }
      if (e.avant !== e.apres && d[e.apres]) d[e.apres].push(e.ref);
    });
    return d;
  }

  /* ============================================================
     RAPPROCHEMENT AVEC UNE SECONDE BASE
     Une autre base suit les mêmes plans sous une autre structure : d'autres
     intitulés, d'autres conventions d'écriture. La source décrit la
     correspondance — { nom, cleReference, lignes, colonnes } — et la page
     rapproche les deux par racine + solution, pour qu'un plan réémis d'un
     côté reste le même plan. Un plan présent dans la seconde base est un
     plan créé, donc terminé : le verdict croise cette présence avec
     l'avancement d'ici (classer()) — d'accord quand les deux disent terminé,
     à vérifier quand l'un le dit et pas l'autre. Sans description dans la
     source, il n'y a rien à rapprocher et la section n'existe pas.
     ============================================================ */
  /* Les lots du rapprochement, dans l'ordre de lecture : d'abord ce qui va,
     puis ce qui diffère, puis ce qui manque de chaque côté, puis ce qui
     attend. « § » se remplace par le nom de la seconde base. `segment` est
     la catégorie de la pastille (et de la part de l'anneau), `atterrit` la
     base où le tableau bascule : ce qui n'existe que d'un côté y emmène, le
     reste laisse l'interrupteur où il est. */
  var LOTS_RAPPROCHEMENT = [
    { cle: 'accord',   libelle: 'terminés et dans §',        segment: 'accord',   atterrit: '' },
    { cle: 'emission', libelle: 'autre indice',              segment: 'emission', atterrit: '' },
    { cle: 'avance',   libelle: 'dans §, pas terminés ici',  segment: 'avance',   atterrit: '' },
    { cle: 'manque',   libelle: 'terminés, absents de §',    segment: 'manque',   atterrit: 'ici' },
    { cle: 'attente',  libelle: 'pas encore dans §',         segment: 'attente',  atterrit: 'ici' },
    { cle: 'seul',     libelle: 'seulement dans §',          segment: 'seul',     atterrit: 'la' }
  ];
  /* Les lots de plans d'ici : une seule catégorie par plan (parPlan), la clé
     du lot ; « seul » compte des lignes de là. */
  var LOTS_PLANS = ['accord', 'emission', 'avance', 'manque', 'attente'];
  function compteLotRapp(cle) {
    if (!RAPPROCHEMENT) return 0;
    if (cle === 'seul') return RAPPROCHEMENT.seul.length;
    var n = 0;
    Object.keys(RAPPROCHEMENT.parPlan).forEach(function (ref) { if (RAPPROCHEMENT.parPlan[ref] === cle) n++; });
    return n;
  }
  function nomSeconde() {
    return String((SRC && SRC.rapprochement && SRC.rapprochement.nom) || 'la seconde base');
  }
  function libelleRapp(l) { return l.libelle.replace('§', nomSeconde()); }

  /* La référence d'une ligne de la seconde base : une colonne qui la porte
     entière, ou plusieurs qu'on recompose — NAME (racine), SOL. (solution) et
     Cust.V (indice) dans SEE. Un extract Excel rend volontiers « 1 » pour
     « 001 » : la solution se remet sur trois chiffres, l'indice en capitale. */
  function refDeLigne(rap, l) {
    var cle = rap.cleReference;
    if (!Array.isArray(cle)) return String(l[cle] == null ? '' : l[cle]).trim();
    var parts = cle.map(function (k) { return String(l[k] == null ? '' : l[k]).trim(); });
    if (parts.length === 3) {
      if (/^\d{1,3}$/.test(parts[1])) parts[1] = ('00' + parts[1]).slice(-3);
      parts[2] = parts[2].toUpperCase();
    }
    /* Recomposer, c'est aussi remettre le A à sa place : SEE l'écrit un cran
       plus loin que GATES, et c'est la référence de GATES qu'on montre. */
    return remettreLeA(parts.join('').toUpperCase());
  }
  /* Les cases à cocher d'un extract : TRUE / FALSE, VRAI / FAUX, oui / non… */
  var VRAI = /^(true|vrai|oui|yes|x|✓|☑)$/i, FAUX = /^(false|faux|non|no|☐)$/i;
  function estBooleen(v) { var t = String(v == null ? '' : v).trim(); return VRAI.test(t) || FAUX.test(t); }
  function estVrai(v) { return VRAI.test(String(v == null ? '' : v).trim()); }
  /**
   * Rapproche `plans` (ceux du périmètre) des lignes de la seconde base.
   * Rend null sans description exploitable. Sinon :
   *   accord   [plan]                  — terminé ici, présent là sous le même indice ;
   *   emission [{ plan, ref_la }]      — terminé ici, présent là sous un autre indice ;
   *   avance   [plan]                  — présent là, mais pas terminé ici ;
   *   manque   [plan]                  — terminé ici, absent de là ;
   *   attente  [plan]                  — pas terminé ici, absent de là : rien d'anormal ;
   *   seul     [ligne]                 — là, et aucun plan du contrat sous cette racine ;
   *   parPlan  { référence: lot }      — un seul lot par plan ;
   *   lignes   [{ ligne, ref, ud, i, cat, plan }] — chaque ligne de là avec
   *            son verdict (le lot de son plan, ou seul / hors / vide).
   *   nbPlans, nbLignes, nbTermines, total (ce qu'il y a à vérifier).
   */
  function rapprocher(rap, plans) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) return null;
    /* Les lignes de la seconde base par racine + solution : une ligne dont
       la référence est illisible garde sa chaîne entière comme racine. */
    var parRacine = Object.create(null), lignes = [];
    rap.lignes.forEach(function (l, i) {
      if (!l || typeof l !== 'object') return;
      var ref = refDeLigne(rap, l), ud = analyserUD(ref);
      var e = { ligne: l, ref: ref, ud: ud, i: i, cat: 'vide', plan: null };
      lignes.push(e);
      if (!ud.racine) return;
      var cle = cleAppariement(ud);
      (parRacine[cle] = parRacine[cle] || []).push(e);
    });
    var r = { accord: [], emission: [], avance: [], manque: [], attente: [], seul: [],
              parPlan: Object.create(null), lignes: lignes,
              nbPlans: plans.length, nbLignes: rap.lignes.length, nbTermines: 0, total: 0 };
    plans.forEach(function (p) {
      /* Une référence en double dans l'extract, c'est le même plan : il ne
         compte qu'une fois, sinon les lots ne totaliseraient plus la
         population. */
      if (r.parPlan[p.reference] !== undefined) return;
      var fini = classer(p[COLONNE_SUIVIE]) === 'termine';
      if (fini) r.nbTermines++;
      var candidates = parRacine[p._racine];
      if (!candidates) {
        r[fini ? 'manque' : 'attente'].push(p);
        r.parPlan[p.reference] = fini ? 'manque' : 'attente';
        return;
      }
      var udIci = analyserUD(p.reference);
      /* Plusieurs lignes de même racine : celle qui porte exactement la même
         émission, sinon la première. */
      var meme = candidates.filter(function (c) { return c.ud.indice === udIci.indice; })[0] || candidates[0];
      var cat;
      if (!fini) { cat = 'avance'; r.avance.push(p); }
      else if (meme.ud.indice !== udIci.indice) { cat = 'emission'; r.emission.push({ plan: p, ref_la: meme.ref, indice_la: meme.ud.indice }); }
      else { cat = 'accord'; r.accord.push(p); }
      r.parPlan[p.reference] = cat;
      meme.cat = cat; meme.plan = p;
      /* Les autres lignes du même plan : sous un autre indice. */
      candidates.forEach(function (c) { if (c !== meme && !c.plan) { c.cat = 'emission'; c.plan = p; } });
    });
    /* Une ligne n'a pas de domaine : elle est « seulement là » si aucun plan
       du contrat, périmètre ou non, ne porte sa racine et sa solution ; sous
       un périmètre, une ligne d'un plan hors périmètre est simplement hors champ. */
    var racinesIci = Object.create(null);
    PLANS.forEach(function (p) { racinesIci[p._racine] = true; });
    lignes.forEach(function (e) {
      if (e.plan || !e.ud.racine) return;
      if (racinesIci[cleAppariement(e.ud)]) { e.cat = 'hors'; return; }
      e.cat = 'seul'; r.seul.push(e.ligne);
    });
    /* Une référence en double dans l'extract ne compte qu'une fois : la
       population, c'est les références distinctes — comme les cases. */
    r.nbPlans = Object.keys(r.parPlan).length;
    /* Ce qu'il y a à vérifier : les deux bases ne disent pas la même chose.
       Les lignes seulement là portent sur tout le contrat, jamais sur le seul
       périmètre : elles se comptent à part, pour ne pas mêler les deux. */
    r.totalPerimetre = r.manque.length + r.avance.length + r.emission.length;
    r.total = r.totalPerimetre + r.seul.length;
    return r;
  }
  /* Les références du tableau derrière un lot : c'est ce que le clic pose en
     sélection — les plans de cette case, une case par plan. */
  function refsDuLotRapprochement(cle) {
    return Object.keys(RAPPROCHEMENT.parPlan).filter(function (ref) { return RAPPROCHEMENT.parPlan[ref] === cle; });
  }
  /* Poser ou retirer un lot : les lots d'ici passent par la sélection du
     tableau, comme les puces du comparatif ; le lot de là ne filtre que le
     tableau de là. Un seul lot à la fois. */
  function poserLotRapp(cle) {
    var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
    if (!lot) return;
    var deja = lotRappActif() === cle;
    if (vue.refsLibelle.indexOf('rapprochement:') === 0) { vue.refs = null; vue.refsLibelle = ''; }
    vue.lotLa = null;
    if (deja) return;
    if (lot.atterrit) vue.base = lot.atterrit;
    if (cle === 'seul') { vue.lotLa = cle; vue.clesLotLa = clesSelection(); return; }
    vue.refs = {};
    refsDuLotRapprochement(cle).forEach(function (r) { vue.refs[r] = true; });
    vue.refsLibelle = 'rapprochement:' + cle;
  }
  function lotRappActif() {
    if (vue.lotLa) return vue.lotLa;
    return vue.refs && vue.refsLibelle.indexOf('rapprochement:') === 0 ? vue.refsLibelle.slice(14) : null;
  }

  /* ----------------------------------------------------------
     Mémoire locale : cadrage et disposition survivent
     à la fermeture de l'onglet. Elle est globale : la même
     disposition suit le lecteur d'un contrat à l'autre.
     ---------------------------------------------------------- */
  /* Les seules cles de tri acceptees pour le bloc par groupe : une preference
     relue d'un ancien stockage ne doit pas pouvoir injecter n'importe quoi. */
  var TRIS_GROUPE = ['nom', 'total', 'pct', 'requis', 'tension', 'fin'];
  var CLE_PREFS = 'suivi-fwd:v1';
  var minuteurPrefs = null;
  function sauverPrefs() {
    try {
      /* L'ordre mémorisé est celui de la vue complète : en vue essentielle,
         vue.ordre porte « essentielles d'abord », qui n'est pas un ordre à
         rejouer sous « toutes les colonnes » — c'est l'extract, dans l'ordre
         de la feuille, exactement ce que rend appliquerVueTable() au retour. */
      localStorage.setItem(CLE_PREFS, JSON.stringify({
        fen: vue.fen,
        dimCritique: vue.dimCritique,
        ordre: vue.vueTable === 'essentielle' ? ORDRE_FEUILLE.slice() : vue.ordre,
        tri: vue.tri,
        triGroupe: vue.triGroupe
      }));
    } catch (e) { /* navigation privée ou stockage bloqué : sans conséquence */ }
  }
  function planifierSauvegarde() {
    clearTimeout(minuteurPrefs);
    minuteurPrefs = setTimeout(sauverPrefs, 400);
  }
  /* La disposition — dimension, ordre des colonnes du tableau, tris — se relit
     d'un stockage ou d'une vue précédente. Elle est validée contre la source
     courante : une colonne disparue ou une clé inconnue ne passe pas. Les
     colonnes cachées ne sont PAS une préférence : elles ne sont que la
     mécanique de la vue essentielle. Un ancien stockage qui en porte encore
     (« cachees ») est ignoré — rien ne peut masquer une colonne à l'ouverture. */
  function appliquerDisposition(pref) {
    if (pref.dimCritique && CLES_DIM.indexOf(pref.dimCritique) !== -1) vue.dimCritique = pref.dimCritique;
    if (Array.isArray(pref.ordre)) {
      // On ne garde que les colonnes encore presentes, et on ajoute les nouvelles.
      var valides = pref.ordre.filter(function (k) { return PAR_CLE[k]; });
      COLONNES.forEach(function (c) { if (valides.indexOf(c.cle) === -1) valides.push(c.cle); });
      vue.ordre = valides;
    }
    if (pref.tri && PAR_CLE[pref.tri.cle]) vue.tri = { cle: pref.tri.cle, asc: !!pref.tri.asc };
    if (pref.triGroupe && TRIS_GROUPE.indexOf(pref.triGroupe.cle) !== -1) {
      vue.triGroupe = { cle: pref.triGroupe.cle, asc: !!pref.triGroupe.asc };
    }
  }
  function chargerPrefs() {
    try {
      var brut = localStorage.getItem(CLE_PREFS);
      if (!brut) return;
      var pref = JSON.parse(brut);
      if (!pref || typeof pref !== 'object') return;
      /* Un ancien stockage pouvait contenir des jalons : ils ne font plus
         foi, les jalons viennent de la configuration. On les ignore. */
      /* Le cadrage ne se reprend que s'il montre encore aujourd'hui : laissé
         sur le passé, il n'est plus celui qu'on veut à l'ouverture. */
      if (pref.fen && typeof pref.fen.debut === 'number' && typeof pref.fen.span === 'number' &&
          pref.fen.debut <= AUJ && AUJ < pref.fen.debut + pref.fen.span) {
        vue.fen = { debut: pref.fen.debut, span: pref.fen.span };
      }
      appliquerDisposition(pref);
    } catch (e) { /* preferences illisibles : on repart des valeurs par defaut */ }
  }

  /* ============================================================ SELECTION */
  function selection() {
    var q = norm(vue.recherche);
    var cols = Object.keys(vue.filtres).filter(function (k) { return vue.filtres[k]; });
    return PLANS.filter(function (p) {
      if (!dansPerimetre(p)) return false;
      if (vue.etat && p._etat !== vue.etat) return false;
      if (vue.groupe && String(valeurDim(p, vue.groupe.dim)) !== vue.groupe.val) return false;
      if (vue.refs && !vue.refs[p.reference]) return false;
      for (var kv in vue.vides) {
        if (vue.vides[kv] && String(p[kv] == null ? '' : p[kv]).trim() !== '') return false;
      }
      for (var k = 0; k < cols.length; k++) {
        if (norm(p[cols[k]]).indexOf(norm(vue.filtres[cols[k]])) === -1) return false;
      }
      if (q && norm(COLONNES.map(function (c) { return p[c.cle]; }).join(' ')).indexOf(q) === -1) return false;
      return true;
    });
  }
  function compte(liste) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0 };
    liste.forEach(function (p) { c[p._etat]++; });
    c.total = liste.length;
    c.pct = c.total ? Math.round((c.termine / c.total) * 100) : 0;
    return c;
  }
  /* Les filtres « libres » — recherche, état, groupe, lot, colonnes — ne
     s'appliquent qu'aux plans du jour : un compte archivé ne se refiltre pas.
     Le périmètre, lui, se dérive des cartes plan par plan et suit l'historique ;
     filtreActif() réunit les deux pour ce qui se voit à l'écran. */
  function filtreLibre() {
    return !!(vue.recherche || vue.etat || vue.groupe || vue.refs ||
      Object.keys(vue.filtres).some(function (k) { return vue.filtres[k]; }) ||
      Object.keys(vue.vides).some(function (k) { return vue.vides[k]; }));
  }
  /* Le lot « seulement dans la seconde base » et la recherche de là ne filtrent
     pas les plans : ils comptent pour « tout réinitialiser », pas pour la phrase. */
  function filtreActif() { return !!vue.perimetre || !!vue.lotLa || !!vue.seconde.recherche || filtreLibre(); }

  /* ============================================================
     PÉRIMÈTRE
     La colonne de domaine (BASE/OPTION, PERSO…) découpe les plans en
     familles qu'on suit séparément. Le périmètre choisi en haut de page
     restreint tout : la sélection du jour, le comparatif, le journal, et les
     séries historiques — dérivées relevé par relevé de la carte plan par plan
     archivée, croisée avec le domaine COURANT de chaque plan. L'onglet
     Historique, lui, n'est jamais réécrit.
     ============================================================ */
  function domaineDe(p) {
    var v = CLE_DOMAINE ? String(p[CLE_DOMAINE] == null ? '' : p[CLE_DOMAINE]).trim() : '';
    return v || '\u2014';
  }
  function dansPerimetre(p) { return !vue.perimetre || domaineDe(p) === vue.perimetre; }
  /* Un événement du journal appartient au périmètre si le plan qu'il concerne
     — retrouvé par référence ou par racine — en fait partie aujourd'hui. Un
     plan disparu dont on ne connaît plus le domaine n'apparaît qu'en « Tout ». */
  function dansPerimetreEvt(e) {
    if (!vue || !vue.perimetre) return true;
    var p = planDeRef(e.ref);

  function population() { return vue.perimetre ? PLANS.filter(dansPerimetre) : PLANS; }

  /* Les comptes d'un relevé restreints à un périmètre, tirés de sa carte plan
     par plan : le total, les terminés, et — si une dimension est demandée —
     les mêmes par valeur. Un relevé sans carte ne donne rien : on ne devine
     pas. Mémorisé par relevé : la courbe se redessine à chaque glissement. */
  var MEMO_DERIVE = {};
  function comptesDerives(rel, perimetre, dim) {
    var cle = rel.i + '|' + perimetre + '|' + (dim || '');
    if (MEMO_DERIVE[cle]) return MEMO_DERIVE[cle];
    var c = { total: 0, termine: 0, groupes: {} };
    Object.keys(rel.plans || {}).forEach(function (ref) {
      var p = planDeRef(ref);
      if (!p || domaineDe(p) !== perimetre) return;
      var fini = classer(rel.plans[ref]) === 'termine';
      c.total++;
      if (fini) c.termine++;
      if (!dim) return;
      var v = String(valeurDim(p, dim) || '\u2014');
      if (!c.groupes[v]) c.groupes[v] = { total: 0, termine: 0 };
      c.groupes[v].total++;
      if (fini) c.groupes[v].termine++;

    return c;
  }

  /* Le sélecteur du haut : « Tout », puis une puce par domaine avec son

     ensuite. Sans colonne de domaine, il se tait. */
  function rendrePerimetre() {
    var zone = $('perimetre');
    if (!CLE_DOMAINE) { zone.hidden = true; $('choix-perimetre').innerHTML = ''; return; }
    var comptes = {};
    PLANS.forEach(function (p) { var d = domaineDe(p); comptes[d] = (comptes[d] || 0) + 1; });
    var valeurs = Object.keys(comptes).sort(function (a, b) {
      if (a === '\u2014') return 1;

      .concat(valeurs.map(function (v) {

      }));
    $('choix-perimetre').innerHTML = puces.map(function (x) {
      return '\x3Cbutton type="button" data-perimetre="' + ech(x.val) + '" aria-pressed="' +
        (vue.perimetre === x.val) + '" title="' + ech(x.aide) + '">' +
        ech(x.nom) + '\x3Cspan class="n">' + nb(x.n) + '\x3C/span>\x3C/button>';
    }).join('');

  }
  function refleterPerimetre() {
    document.querySelectorAll('#choix-perimetre button').forEach(function (b) {

    });
  }


  /* ============================================================ AVANCEMENT */

  /* Chaque chiffre se cale au centre de son segment de barre : la ligne devient
     la légende de la barre au lieu d'une rangée régulière. Les segments minces
     produisant des étiquettes qui se touchent, on les écarte après mesure
     plutôt que de deviner les largeurs à l'avance. */
  /* Les segments vides ne sont pas rendus : on releve les coupures reelles
     dans le DOM plutot que de les recalculer a partir des pourcentages. */
  /* Sous une barre, les filets prolongent ses coupures et chaque bouton se
     centre sous son segment — la barre d'avancement et celle du rapprochement
     partagent ce dessin. Les centres se lisent sur les rectangles réels des
     segments (data-cle), donc les largeurs minimales et le blanc avant
     « seulement là » sont honorés ; un bouton dont le compte vaut 0 n'a pas
     de segment : il se cale au bord droit du précédent. Puis on pousse vers
     la droite ce qui se chevauche, et on recale vers la gauche si le dernier
     sort du cadre. Sous 680 px, les boutons passent en grille : rien à poser. */
  function alignerSousBarre(idBarre, idFilets, idEtats) {
    var barre = $(idBarre), filets = $(idFilets), zone = $(idEtats);
    if (!barre || !zone) return;
    var segs = Array.prototype.slice.call(barre.querySelectorAll('span[data-cle]'));
    var boutons = Array.prototype.slice.call(zone.querySelectorAll('button[data-cle]'));
    if (filets) filets.innerHTML = '';
    if (!boutons.length) return;
    if (window.matchMedia('(max-width: 680px)').matches || barre.offsetParent === null) {
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    var base = barre.getBoundingClientRect();
    var largeur = zone.getBoundingClientRect().width;
    if (!largeur || !base.width) return;
    /* Quand les boutons, mis bout à bout, ne tiennent plus dans la rangée,
       les pousser ne suffit plus : ils passent en grille, comme sur un petit
       écran, plutôt que de se recouvrir. */
    zone.classList.remove('en-grille');          // mesurer les boutons libres, pas étirés par la grille
    var besoin = boutons.reduce(function (t, b) { return t + b.offsetWidth; }, 0) + 4 * (boutons.length - 1);
    if (besoin > largeur) {
      zone.classList.add('en-grille');
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    /* Un filet par coupure — sauf après un segment trop étroit pour que le
       trait dise encore quelque chose : entre trois plans et cinq, il ne
       ferait que hachurer les nombres. */
    if (filets && segs.length > 1) {
      filets.innerHTML = segs.slice(0, -1).map(function (seg) {
        var r = seg.getBoundingClientRect();
        if (r.width < 14) return '';
        return '\x3Ci style="left:' + (r.right - base.left + 1).toFixed(1) + 'px">\x3C/i>';
      }).join('');
    }
    var centreDe = {}, bordDe = {};
    segs.forEach(function (seg) {
      var r = seg.getBoundingClientRect();
      centreDe[seg.dataset.cle] = (r.left + r.right) / 2 - base.left;
      bordDe[seg.dataset.cle] = r.right - base.left;
    });
    var bord = 0;
    var cibles = boutons.map(function (b) {
      var c = centreDe[b.dataset.cle];
      if (c === undefined) return bord;
      bord = bordDe[b.dataset.cle];
      return c;
    });
    var gauches = boutons.map(function (b, i) { return cibles[i] - b.offsetWidth / 2; });
    for (var i = 1; i < boutons.length; i++) {
      var mini = gauches[i - 1] + boutons[i - 1].offsetWidth + 4;
      if (gauches[i] < mini) gauches[i] = mini;
    }
    var debord = gauches[boutons.length - 1] + boutons[boutons.length - 1].offsetWidth - largeur;
    for (var k = boutons.length - 1; k >= 0 && debord > 0; k--) {
      gauches[k] -= debord;
      debord = k > 0 ? Math.max(0, (gauches[k - 1] + boutons[k - 1].offsetWidth + 4) - gauches[k]) : 0;
    }
    boutons.forEach(function (b, i) { b.style.left = Math.max(0, gauches[i]).toFixed(1) + 'px'; });
  }

  function rendreAvancement(liste) {
    var c = compte(liste);
    /* Sous un périmètre seul, la phrase le nomme ; dès qu'un autre filtre
       s'ajoute, c'est une sélection. */

      (filtreLibre() ? ' dans la sélection'
                     : (vue.perimetre ? ' dans le périmètre ' + ech(vue.perimetre) : ''));

    /* Le pourcentage se lit dans la barre : les chiffres du dessous n'ont plus
       qu'un sens possible, un nombre de plans. */
    $('barre').innerHTML = ETATS.map(function (e) {
      if (!c[e.cle]) return '';
      var part = (c[e.cle] / (c.total || 1)) * 100;
      var texte = part >= 6 ? Math.round(part) + '\u202f%' : '';
      return e.hachure
        ? '\x3Cspan class="hachure" data-cle="' + e.cle + '" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
        : '\x3Cspan data-cle="' + e.cle + '" style="width:' + part.toFixed(2) + '%;background:' + e.couleur +
          ';color:' + encreSegment(e.cle) + '">' + texte + '\x3C/span>';
    }).join('');

    $('etats').innerHTML = ETATS.map(function (e) {
      var pastille = e.hachure
        ? '\x3Cspan class="pastille hachure">\x3C/span>'
        : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
      var actif = vue.etat === e.cle;
      return '\x3Cbutton class="etat-btn" type="button" data-etat="' + e.cle + '" data-cle="' + e.cle + '" style="--teinte:' + e.teinte +
        '" aria-pressed="' + actif + '" title="' + (actif ? 'Retirer le filtre' : 'N\u2019afficher que ces plans') + '">' +
        '\x3Cspan class="etat-haut">' + pastille + ech(e.libelle) + '\x3C/span>' +
        '\x3Cspan class="etat-n">' + nb(c[e.cle]) + '\x3C/span>\x3C/button>';
    }).join('');

    requestAnimationFrame(function () { alignerSousBarre('barre', 'filets', 'etats'); });
  }

  /* ============================================================ GRAPHIQUE */
  /* Série affichée : l'historique global, ou celui d'un groupe quand une ligne
     du bloc « Avancement FWD par… » est sélectionnée. Un filtre libre (recherche,
     colonne) ne peut pas s'appliquer rétroactivement à des comptes déjà archivés :
     dans ce cas le graphique reste sur l'ensemble, et le dit.
     Sous un périmètre, les comptes archivés ne servent plus : la série est
     dérivée, relevé par relevé, de la carte plan par plan — les plans de la
     carte qui appartiennent au périmètre aujourd'hui, et ceux d'entre eux
     classés terminés. Un relevé sans carte est écarté, et la note le dit. */
  function serieAffichee() {
    var groupe = (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) ? vue.groupe : null;
    var per = vue.perimetre;
    var pts, ecartes = 0;
    if (per) {
      pts = [];
      RELEVES.forEach(function (r) {
        if (!r.plans) { ecartes++; return; }
        var c = comptesDerives(r, per, groupe ? groupe.dim : null);
        var g = groupe ? (c.groupes[groupe.val] || { total: 0, termine: 0 }) : c;
        pts.push({ i: r.i, total: g.total, termine: g.termine });
      });
      if (!pts.length) pts.push({ i: AUJ, total: 0, termine: 0 });
    } else if (groupe) {
      pts = RELEVES.map(function (r) {
        var g = r.groupes[groupe.dim] && r.groupes[groupe.dim][groupe.val];
        return { i: r.i, total: g ? g.total : 0, termine: g ? g.termine : 0 };
      });
    } else {
      pts = RELEVES.map(function (r) { return { i: r.i, total: r.total, termine: r.termine }; });
    }

      ? 'de ' + groupe.val + (per ? ' dans le périmètre ' + per : '')

  }

  /* Une échelle qui se lit : quatre traits au plus, à des valeurs rondes —
     0, 200, 400 pour 640 plans, le plafond à part. */
  function pasDEchelle(total) {
    var candidats = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
    for (var i = 0; i < candidats.length; i++) if (total / candidats[i] <= 4.5) return candidats[i];
    return candidats[candidats.length - 1];
  }
  var L = 980, mG = 36, mD = 72, plotH = 176, ecart = 16, bandeH = 30, mBas = 34;
  var mHaut = 44, H = mHaut + plotH + ecart + bandeH + mBas;
  var HAUTEUR_ETIQUETTE = 23;   // un niveau de marqueurs (rayon 10) et son interligne
  /* Le texte d'un jalon ne se dessine que s'il tient, mesuré sur le dessin
     lui-même — les polices diffèrent d'un poste à l'autre, une estimation
     au caractère trompe. Il doit tenir jusqu'au marqueur du jalon visible
     suivant, jusqu'au mot « aujourd'hui » s'il vient après, et jusqu'au bord
     droit du cadre — ou, à défaut, à gauche du marqueur. Sinon il se masque :
     la légende le redit, et le survol le fait paraître. */
  /* Une police web qui arrive après le premier dessin change la largeur
     des textes : la décision « tient / ne tient pas » se rejoue alors sur
     le dessin du moment. Un seul écouteur, posé une fois. */
  var POLICES_GUETTEES = false;
  function guetterLesPolices() {
    if (POLICES_GUETTEES || !document.fonts || !document.fonts.addEventListener) return;
    POLICES_GUETTEES = true;
    document.fonts.addEventListener('loadingdone', function () {
      var svg = $('zone-graphe').querySelector('svg.graphe');
      if (svg && svg.__ajusterJalons) svg.__ajusterJalons();
    });
  }
  function ajusterTextesJalons(svg, bordGauche, bordDroit, xAuj) {
    if (!svg) return;
    var reperes = [].slice.call(svg.querySelectorAll('.jalon[data-jalon]')).map(function (g) {
      return { texte: g.querySelector('.jalon-texte'), jx: +g.querySelector('.jalon-marque').getAttribute('cx') };
    }).sort(function (a, b) { return a.jx - b.jx; });
    reperes.forEach(function (r, k) {
      var t = r.texte, largeur = 0;
      if (!t) return;
      t.classList.remove('masque');
      t.setAttribute('text-anchor', 'start'); t.setAttribute('x', (r.jx + 14).toFixed(1));
      try { largeur = t.getComputedTextLength(); } catch (e) { largeur = 0; }
      if (!(largeur > 0)) largeur = t.textContent.length * 6.1;
      var droite = bordDroit + 30;
      if (reperes[k + 1]) droite = Math.min(droite, reperes[k + 1].jx - 11);
      if (xAuj !== null && xAuj > r.jx) droite = Math.min(droite, xAuj - 72);
      if (r.jx + 14 + largeur + 6 <= droite) { r.finTexte = r.jx + 14 + largeur; return; }
      /* Pas la place à droite : à gauche, alors, s'il y tient — après le
         marqueur précédent et le texte qu'il a pu écrire à sa droite, ou
         après le trait d'aujourd'hui. */

      if (k > 0) gauche = Math.max(gauche, reperes[k - 1].finTexte !== undefined ? reperes[k - 1].finTexte + 6 : reperes[k - 1].jx + 11);
      if (xAuj !== null && xAuj < r.jx) gauche = Math.max(gauche, xAuj + 4);
      if (r.jx - 14 - largeur - 6 >= gauche) {

        return;
      }
      t.classList.add('masque');
    });
  }
  var LARGEUR = L - mG - mD;
  var MAX_IDX = 104;                       // deux ans, ou un an au-delà d'aujourd'hui : voir chargerSource()
  var derniereAnalyse = null;

  function bornerFenetre() {
    var f = vue.fen;
    f.span = Math.max(8, Math.min(f.span, MAX_IDX + 1));
    f.debut = Math.max(0, Math.min(f.debut, MAX_IDX - f.span + 1));
  }

  function rendreGraphique(liste) {
    bornerFenetre();
    var vueSerie = serieAffichee();
    var pts = vueSerie.pts;
    var dernier = pts[pts.length - 1];
    var total = Math.max(dernier.total, 1);
    var atteint = dernier.termine;
    var restants = total - atteint;
    var ryt = rythmes(pts);
    var vitesse = ryt ? ryt.central : 0;
    var projIdx = semaineFin(atteint, total, vitesse);

    var note = vueSerie.portee
      ? 'Historique ' + vueSerie.portee + ' · ' + pts.length + ' relevés' +
        (vueSerie.partiel ? ' · les autres filtres ne s’appliquent pas à l’historique' : '')
      : (vueSerie.partiel
          ? 'Historique de l’ensemble des plans : les relevés archivés ne peuvent pas être refiltrés.'
          : RELEVES.length + ' relevés depuis le premier import');
    if (vueSerie.ecartes) {
      note += ' · ' + vueSerie.ecartes + ' relevé' + (vueSerie.ecartes > 1 ? 's' : '') +
        ' sans détail plan par plan, hors périmètre';
    }
    $('note-graphe').textContent = note;
    var prochain = prochainJalon();

    var d0 = vue.fen.debut, span = vue.fen.span, d1 = d0 + span - 1;
    var pasX = LARGEUR / (span - 1);
    var x = function (i) { return mG + pasX * (i - d0); };

    /* Cinq jalons en dix semaines écrivaient les uns sur les autres. Chaque
       jalon se marque d'un numéro en tête de son trait — tous sur une même
       ligne, sauf deux marqueurs qui se toucheraient — et son texte ne
       s'écrit à côté que s'il a la place jusqu'au jalon suivant (mesuré sur
       le dessin, voir ajusterTextesJalons). La légende, sous le graphique,
       redit chaque numéro en clair. */
    var places = [];
    var xAuj = null;
    if (AUJ >= d0 && AUJ <= d1) {
      xAuj = mG + pasX * (AUJ - d0);
      places.push({ aujourdhui: true, jx: xAuj, xa: xAuj - 72, xb: xAuj - 4 });
    }
    jalons.forEach(function (j, idx) {
      if (j.i >= d0 && j.i <= d1) places.push({ j: j, idx: idx, jx: x(j.i), xa: x(j.i) - 11, xb: x(j.i) + 11 });
    });
    places.sort(function (a, b) { return a.xa - b.xa; });
    var finDeNiveau = [];
    places.forEach(function (pl) {
      var n = 0;
      while (n < finDeNiveau.length && pl.xa < finDeNiveau[n] + 4) n++;
      pl.niveau = n;
      finDeNiveau[n] = pl.xb;
    });
    var niveaux = Math.max(1, finDeNiveau.length);
    mHaut = 26 + niveaux * HAUTEUR_ETIQUETTE;
    H = mHaut + plotH + ecart + bandeH + mBas;

    var y = function (v) { return mHaut + plotH - (v / total) * plotH; };
    var yBande = mHaut + plotH + ecart;
    var basTotal = yBande + bandeH;

    var s = ['\x3Csvg class="graphe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Plans termines par semaine, historique et projection">'];
    s.push('\x3Cdefs>\x3CclipPath id="zoneTracee">\x3Crect x="' + mG + '" y="' + (mHaut - 12) + '" width="' + LARGEUR + '" height="' + (plotH + 16) + '"/>\x3C/clipPath>\x3C/defs>');

    /* L'échelle se lit d'un coup d'œil : des valeurs rondes, quatre traits au
       plus, le plafond à part et nommé. */
    var pas = pasDEchelle(total);
    for (var v = 0; v < total; v += pas) {
      if (total - v < pas * 0.5) continue;
      s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
      s.push('\x3Ctext class="grad" x="' + (mG - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + nb(v) + '\x3C/text>');
    }
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(total).toFixed(1) + '" y2="' + y(total).toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
    s.push('\x3Ctext class="grad" x="' + (L - mD + 8) + '" y="' + (y(total) + 3.5).toFixed(1) + '">' + nb(total) + ' plans\x3C/text>');

    // Tout ce qui peut sortir du cadre est decoupe a la zone tracee.
    s.push('\x3Cg clip-path="url(#zoneTracee)">');

    var visibles = pts.filter(function (pt) { return pt.i >= d0 - 2 && pt.i <= d1 + 2; });
    if (visibles.length === 1) {
      s.push('\x3Ccircle cx="' + x(visibles[0].i).toFixed(1) + '" cy="' + y(visibles[0].termine).toFixed(1) +
             '" r="4.5" fill="var(--fait)"/>');
    }
    if (visibles.length > 1) {
      var chemin = visibles.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.termine).toFixed(1); }).join(' ');
      var xa = x(visibles[0].i).toFixed(1), xb = x(visibles[visibles.length - 1].i).toFixed(1);
      s.push('\x3Cpath d="' + chemin + ' L' + xb + ' ' + y(0).toFixed(1) + ' L' + xa + ' ' + y(0).toFixed(1) + ' Z" fill="var(--fait)" opacity=".09"/>');
      s.push('\x3Cpath d="' + chemin + '" fill="none" stroke="var(--fait)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
      /* Un point par relevé, plein, cerclé de la couleur du fond pour rester
         lisible sur la courbe ; discret quand les relevés se serrent. */
      var rayon = visibles.length > 40 ? 2 : 3;
      visibles.forEach(function (pt) {
        if (pt.i === dernier.i) return;
        s.push('\x3Ccircle cx="' + x(pt.i).toFixed(1) + '" cy="' + y(pt.termine).toFixed(1) +
               '" r="' + rayon + '" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      });
    }

    var horsClip = [];
    var enRetard = false, requis = null;
    if (prochain && restants > 0) {
      requis = restants / (prochain.i - AUJ);
      enRetard = vitesse <= 0 || requis > vitesse;
      var cr = enRetard ? 'var(--alerte)' : 'var(--fait)';
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(prochain.i).toFixed(1) + ' ' + y(total).toFixed(1) + '" fill="none" stroke="' + cr + '" stroke-width="1.6"/>');
      s.push('\x3Ccircle cx="' + x(prochain.i).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="' + cr + '"/>');
    }

    if (projIdx !== null) {
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(projIdx).toFixed(1) + ' ' + y(total).toFixed(1) +
             '" fill="none" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/>');
      if (projIdx >= d0 && projIdx <= d1) {
        s.push('\x3Ccircle cx="' + x(projIdx).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="none" stroke="var(--fait)" stroke-width="1.6"/>');
        var xp = Math.max(mG + 22, Math.min(x(projIdx), L - mD - 22));
        // Sous le plafond plutot qu'au-dessus : au-dessus, elle tombait dans la
        // bande des jalons et se superposait a leurs etiquettes.
        horsClip.push('\x3Ctext class="grad" x="' + xp.toFixed(1) + '" y="' + (y(total) + 16).toFixed(1) +
                      '" text-anchor="middle">' + etiquette(projIdx) + '\x3C/text>');
      }
      if (prochain && enRetard) {
        var auJalon = atteint + vitesse * (prochain.i - AUJ);
        var manque = Math.round(total - auJalon);
        if (manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
          var xj = x(prochain.i), y1 = y(auJalon), y2 = y(total);
          s.push('\x3Cline x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
          s.push('\x3Ctext class="grad" x="' + (xj + 7).toFixed(1) + '" y="' + ((y1 + y2) / 2 + 4).toFixed(1) + '" fill="var(--alerte)" font-weight="500">-' + manque + '\x3C/text>');
        }
      }
    }
    s.push('\x3C/g>');
    horsClip.forEach(function (t) { s.push(t); });

    if (AUJ >= d0 && AUJ <= d1) {
      s.push('\x3Cline x1="' + x(AUJ).toFixed(1) + '" x2="' + x(AUJ).toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--encre-3)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      /* Le trait marque le dernier relevé. Il ne s'appelle « aujourd'hui »
         que si ce relevé est de cette semaine — sinon la page dirait deux
         « aujourd'hui » différents, l'un au titre, l'autre sur la courbe. */
      s.push('\x3Ctext class="grad repere-auj" x="' + (x(AUJ) - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="end">' +
             (AUJ === semaineDAujourdhui() ? 'aujourd’hui' : 'dernier relevé') + '\x3C/text>');
      s.push('\x3Ccircle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(atteint).toFixed(1) + '" r="4.5" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      s.push('\x3Ctext class="grad" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (y(atteint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500">' + atteint + '\x3C/text>');
    }

    /* Jalons : un trait, un triangle, une étiquette. Rien à saisir ni à
       déplacer — ils viennent de la configuration, l'outil ne fait que les
       montrer. Le survol de la semaine dessous passe par la bande cliquable,
       comme partout ailleurs sur le graphique. */
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      /* Un jalon ne se peint en rouge que s'il fait l'échéance ici : la même
         semaine que l'échéance, mais d'un autre périmètre, il reste en
         retrait. Deux jalons de la même semaine qui comptent tous deux sont
         rouges tous deux — l'un est aussi manqué que l'autre. */
      var hors = !jalonDansPerimetre(j);
      var critique = prochain && j.i === prochain.i && !hors && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-2)';
      var mention = j.perimetre
        ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) + (hors ? ' \u2014 hors du p\u00e9rim\u00e8tre choisi, ne compte pas ici' : '')
        : '';
      var yBase = mHaut - 8 - pl.niveau * HAUTEUR_ETIQUETTE;   // haut du trait pour ce niveau
      var yMarque = yBase - 9;

      s.push('\x3Cg class="jalon' + (hors ? ' hors-perimetre' : '') + (critique ? ' critique' : '') + '" data-jalon="' + idx + '" role="img" aria-label="Jalon ' + (idx + 1) + ', ' +
             ech(j.texte) + ' en ' + etiquette(j.i) + mention + '">');
      s.push('\x3Ctitle>' + (idx + 1) + ' \u2014 ' + ech(j.texte) + ' \u2014 ' + etiquette(j.i) + mention + '\x3C/title>');
      s.push('\x3Cline x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + basTotal.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>');
      s.push('\x3Ccircle class="jalon-marque" cx="' + jx.toFixed(1) + '" cy="' + yMarque.toFixed(1) + '" r="10" fill="' + couleur + '"/>');
      s.push('\x3Ctext class="jalon-num" x="' + jx.toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="middle">' + (idx + 1) + '\x3C/text>');
      /* Le texte est toujours là — la batterie et les lecteurs d'écran le
         lisent — mais ne se dessine que s'il a la place (décidé après coup,
         mesure faite). */
