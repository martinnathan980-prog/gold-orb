<script>
// ============================================================
// NEXUS PLM — fiche complète (panneau latéral).
//
// Chaque sous-ensemble n'affiche que les champs de SON type : une structure
// boîte montre sa géométrie et ses deux familles de composants, un harnais
// son PN et sa référence, une plaquette ses mots-clés. Rien n'est rendu
// « au cas où ». La boîte, elle, porte ses boutons, voyants, interrupteurs.
//
// Les champs d'édition sont relus par data-champ / data-ligne : aucun
// identifiant construit à partir d'une donnée, donc aucun nom de colonne
// ou d'ID ne peut casser un sélecteur.
// ============================================================

function estMultiBoite(champ) { return (Store.config.multiBoite || []).indexOf(champ) !== -1; }

// ------------------------------------------------------------
// Briques d'affichage
// ------------------------------------------------------------
function pucesHtml(valeurs, actionSuppr, donnees, editable, classe) {
  if (!valeurs.length) return '<span class="vide">Aucun</span>';
  return valeurs.map(function (v) {
    const suppr = editable
      ? '<button type="button" class="puce-suppr" aria-label="Retirer ' + esc(v) + '"' +
        dataAttrs(Object.assign({ action: actionSuppr, valeur: v }, donnees)) + '>&times;</button>'
      : '';
    return '<span class="puce ' + (classe || '') + '">' + esc(v) + suppr + '</span>';
  }).join('');
}

/**
 * La photo situe la pièce. Elle se pose au centre, dans un cadre de rapport
 * fixe : collée à gauche et au format de la source, elle déséquilibrait la
 * fiche et changeait de hauteur d'une boîte à l'autre.
 */
function apercuImageHtml(valeur, classe, centre) {
  const url = urlMiniature(valeur);
  if (!url) return '';
  const bouton = '<button type="button" class="vignette ' + (classe || '') + '"' +
    dataAttrs({ action: 'agrandir-image', url: url }) +
    ' aria-label="Agrandir l\'image" title="Agrandir">' +
    '<img src="' + esc(url) + '" alt="" loading="lazy">' +
  '</button>';
  return centre ? '<div class="vignette-cadre">' + bouton + '</div>' : bouton;
}

/**
 * Un repère dans une fiche longue : un filet court, un titre, une aide.
 * Discret — un trait et des capitales, pas un aplat — mais on le voit.
 */
function sectionHtml(titre, aide) {
  return '<div class="fiche-section">' +
           '<span class="fiche-section-filet" aria-hidden="true"></span>' +
           '<span class="fiche-section-titre">' + esc(titre) + '</span>' +
           (aide ? '<span class="fiche-section-aide">' + esc(aide) + '</span>' : '') +
         '</div>';
}

function ligneHtml(libelle, contenu, aide) {
  return '<div class="ligne">' +
           '<div class="ligne-cle">' + esc(libelle) +
             (aide ? '<span class="ligne-aide">' + esc(aide) + '</span>' : '') + '</div>' +
           '<div class="ligne-val">' + contenu + '</div>' +
         '</div>';
}

function saisieHtml(champ, valeur, classe, ligneId) {
  const base = ' class="saisie ' + classe + '" data-champ="' + esc(champ.cle) + '"' +
               (ligneId ? ' data-ligne="' + esc(ligneId) + '"' : '');
  if (champ.genre === GENRE.LONG) {
    return '<textarea' + base + ' rows="3">' + esc(valeur) + '</textarea>';
  }
  if (champ.genre === GENRE.NOMBRE) {
    return '<input type="text" inputmode="decimal"' + base + ' value="' + esc(valeur) + '">';
  }
  return '<input type="text"' + base +
         (champ.liste ? ' list="' + esc(champ.liste) + '"' : '') +
         ' value="' + esc(valeur) + '">';
}

/**
 * Bloc d'un champ à valeurs multiples : puces + ajout, sans passer en édition.
 * Une liste FERMÉE (champ.options) se choisit dans un menu, on ne tape pas.
 */
function blocMultiHtml(champ, valeurs, editable, actionAjout, actionSuppr, donnees, classe) {
  let ajout = '';
  if (editable && champ.options) {
    // Liste fermée : choisir, c'est vouloir. L'ajout se fait au choix, il n'y
    // a rien à confirmer derrière.
    const restantes = champ.options.filter(function (o) {
      return !valeurs.some(function (v) { return normaliserTexte(v) === normaliserTexte(o); });
    });
    ajout = restantes.length
      ? '<div class="ajout-multi">' +
          '<select class="saisie-multi saisie-multi-seule"' +
            dataAttrs(Object.assign({ ajout: actionAjout }, donnees)) +
            ' aria-label="Ajouter à ' + esc(champ.libelle) + '">' +
            '<option value="">Ajouter ' + esc(champ.libelle.toLowerCase()) + '…</option>' +
            restantes.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') +
          '</select>' +
        '</div>'
      : '';
  } else if (editable) {
    // Champ libre : Entrée pose la valeur, et choisir une suggestion de la
    // liste la pose aussi. Le bouton « Ajouter » ne servait plus qu'à être visé.
    ajout = '<div class="ajout-multi">' +
        '<input type="text" class="saisie-multi"' +
          (champ.liste ? ' list="' + esc(champ.liste) + '"' : '') +
          dataAttrs(Object.assign({ ajout: actionAjout }, donnees)) +
          ' placeholder="Ajouter…  (Entrée)" aria-label="Ajouter à ' + esc(champ.libelle) + '">' +
      '</div>';
  }
  return '<div class="ligne ligne-bloc">' +
           '<div class="ligne-cle">' + esc(champ.libelle) +
             (champ.aide ? '<span class="ligne-aide">' + esc(champ.aide) + '</span>' : '') + '</div>' +
           '<div class="ligne-val">' +
             '<div class="puces">' + pucesHtml(valeurs, actionSuppr, donnees, editable, classe) + '</div>' +
             ajout +
           '</div>' +
         '</div>';
}

/**
 * Composants à trois niveaux, en colonnes : fonction, norme, référence.
 * Toujours éditable, comme toute liste : on ajoute et on retire sans passer
 * la fiche en mode édition.
 */
let compteurBlocComposants = 0;

function blocComposantsHtml(champ, valeur, cible) {
  const composants = listeComposants(valeur);
  const categorie = champ.categorie || 'composant';
  const donnees = { portee: cible.portee, id: cible.id, champ: champ.cle };

  const lignes = composants.length
    ? composants.map(function (c) {
        const cellule = function (niveau, texte) {
          return texte
            ? '<span class="niveau-' + niveau + '">' + esc(texte) + '</span>'
            : '<span class="niveau-' + niveau + ' niveau-vide">non précisé</span>';
        };
        // Le composant mène à sa fiche dans la base : d'une boîte, on passe
        // à « où sert ce voyant, sous quelles références ».
        const composant = c.fonction
          ? '<button type="button" class="niveau-fonction niveau-lien"' +
              dataAttrs({ action: 'ouvrir-fiche-composant', categorie: categorie, fonction: c.fonction }) +
              ' title="Voir ce composant dans la base">' + esc(c.fonction) + '</button>'
          : cellule('fonction', c.fonction);
        return '<div class="composant">' +
          composant + cellule('norme', c.norme) + cellule('reference', c.reference) +
          '<button type="button" class="puce-suppr" aria-label="Retirer ' + esc(libelleComposant(c)) + '"' +
            dataAttrs(Object.assign({ action: 'supprimer-composant', valeur: c.brut }, donnees)) +
          '>&times;</button>' +
        '</div>';
      }).join('')
    : '<p class="composants-vide">Aucun composant. Ajoutez-en un ci-dessous, ou depuis le catalogue.</p>';

  // Chaque bloc porte ses propres listes de suggestion : elles se resserrent
  // au fur et a mesure de la saisie, et deux blocs ouverts ne se genent pas.
  const uid = 'cmp' + (++compteurBlocComposants);
  const saisie = function (niveau, texte) {
    return '<input type="text" class="saisie-composant" data-niveau="' + niveau + '"' +
           dataAttrs(Object.assign({ bloc: uid, categorie: categorie }, donnees)) +
           ' list="' + uid + '-' + niveau + '"' +
           ' placeholder="' + esc(texte) + '" aria-label="' + esc(texte) + '">';
  };
  const sug = suggestionsComposant(categorie, '', '');
  const listes = '<span class="listes-bloc" data-bloc="' + uid + '">' +
    '<datalist id="' + uid + '-fonction">' + optionsHtml(sug.fonctions) + '</datalist>' +
    '<datalist id="' + uid + '-norme">' + optionsHtml(sug.normes) + '</datalist>' +
    '<datalist id="' + uid + '-reference">' + optionsHtml(sug.references) + '</datalist>' +
  '</span>';

  return '<div class="ligne ligne-bloc ligne-section">' +
    sectionHtml(champ.libelle, champ.aide) +
    '<div class="ligne-val">' +
      '<div class="composants">' +
        '<div class="composants-entete"><span>Composant</span><span>Norme</span><span>Référence</span><span></span></div>' +
        lignes +
      '</div>' +
      '<div class="ajout-composant">' + listes +
        saisie('fonction', 'Composant') + saisie('norme', 'Norme') + saisie('reference', 'Référence') +
        '<button type="button" class="btn-mini"' +
          dataAttrs(Object.assign({ action: 'ajouter-composant' }, donnees)) + '>Ajouter</button>' +
      '</div>' +
      '<div class="composants-outils">' +
        '<button type="button" class="btn-lien"' +
          dataAttrs(Object.assign({ action: 'ouvrir-catalogue', categorie: categorie }, donnees)) +
          '>Choisir dans le catalogue</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ------------------------------------------------------------
// La fiche d'identité : la photo à gauche, les champs clés à droite
// ------------------------------------------------------------
/**
 * La photo situe la pièce, elle ne doit pas la dominer. À pleine largeur
 * elle repoussait la fonction et le PN sous le pli ; en colonne à gauche,
 * elle décalait toute la fiche technique. Elle se pose donc en haut à
 * droite, en timbre : les champs gardent leur place, et reprennent toute
 * la largeur dès qu'ils passent dessous.
 */
function identiteHtml(photoHtml, champsHtml) {
  if (!photoHtml) return champsHtml;
  return '<div class="fiche-identite">' +
           '<div class="fiche-photo">' + photoHtml + '</div>' +
           '<div class="fiche-champs">' + champsHtml + '</div>' +
         '</div>';
}

// ------------------------------------------------------------
// Bloc « Général » de la boîte — le parent
// ------------------------------------------------------------
function blocBoiteHtml(boite) {
  const edition = Store.enEditionBoite;
  const pn = boite[CLE_PN()];

  // Pas de duplication ici : une boîte se duplique depuis la liste.
  const actions = edition
    ? boutonHtml('sauver-boite', {}, 'Enregistrer', 'btn-valider') +
      boutonHtml('annuler-boite', {}, 'Annuler', 'btn-neutre')
    : boutonHtml('comparer-boite', { pn: pn }, 'Équivalences', 'btn-accent') +
      boutonHtml('editer-boite', {}, 'Éditer', 'btn-neutre') +
      boutonHtml('supprimer-boite', { pn: pn }, 'Supprimer', 'btn-danger');

  let html = '<section class="bloc bloc-general">' +
    '<header class="bloc-tete">' +
      '<h3>Boîte</h3>' +
      '<div class="bloc-actions"><span id="spin-boite" class="zone-spin"></span>' + actions + '</div>' +
    '</header>';

  // Les champs clés se lisent en face de la photo ; ce qui est large — les
  // composants, l'URL, les commentaires — passe dessous, à pleine largeur,
  // chacun sous son repère.
  let cles = '', larges = '', sectionFinale = false;
  const finale = function () {
    if (sectionFinale) return '';
    sectionFinale = true;
    return sectionHtml('Image et commentaires');
  };
  Store.headersBoites.forEach(function (cle) {
    const valeur = boite[cle];
    const regle = CHAMPS_BOITE[cle] || {};
    const genre = regle.genre ||
      (cle.toLowerCase().indexOf('image') !== -1 ? GENRE.IMAGE :
       cle.toLowerCase().indexOf('comment') !== -1 ? GENRE.LONG :
       estMultiBoite(cle) ? GENRE.MULTI : GENRE.TEXTE);

    if (genre === GENRE.COMPOSANTS) {
      larges += blocComposantsHtml({ cle: cle, libelle: cle, categorie: regle.categorie, aide: regle.aide },
                                   valeur, { portee: 'boite', id: null });
      return;
    }
    if (genre === GENRE.MULTI) {
      // Le porteur se choisit dans la liste fermée des porteurs Airbus Helicopters.
      const champ = { cle: cle, libelle: cle, liste: regle.liste || null,
                      options: regle.ferme ? porteursConnus() : null };
      cles += blocMultiHtml(champ, valeursMulti(valeur), true,
                            'ajouter-multi-boite', 'supprimer-multi-boite', { champ: cle },
                            regle.ferme ? 'puce-porteur' : '');
      return;
    }

    const champ = { cle: cle, libelle: genre === GENRE.IMAGE ? 'Image (URL)' : cle,
                    genre: genre === GENRE.LONG ? GENRE.LONG : GENRE.TEXTE,
                    liste: regle.liste || null };
    const large = genre === GENRE.IMAGE || genre === GENRE.LONG;

    if (edition) {
      const ligne = ligneHtml(champ.libelle, saisieHtml(champ, valeur, 'champ-boite'));
      if (large) larges += finale() + ligne; else cles += ligne;
      return;
    }
    // Hors édition, on montre TOUT ce qu'on peut éditer, l'URL comprise : un
    // champ qu'il faut passer en édition pour lire est un champ qu'on oublie.
    if (genre === GENRE.IMAGE) { larges += finale() + ligneHtml(champ.libelle, urlLisibleHtml(valeur)); return; }
    const ligne = ligneHtml(champ.libelle, valeurLisibleHtml(valeur));
    if (large) larges += finale() + ligne; else cles += ligne;
  });

  html += identiteHtml(edition ? '' : apercuImageHtml(boite['Image'], 'vignette-fiche'), cles) + larges;
  return html + '</section>';
}

/**
 * Une URL se lit ET s'ouvre. On ne l'affiche pas en entier : un lien Drive
 * fait 80 caractères et pousserait la colonne hors de la fiche.
 */
function urlLisibleHtml(valeur) {
  const url = String(valeur || '').trim();
  if (!url) return '<span class="vide">—</span>';

  // Une image embarquée fait plusieurs milliers de caractères : on dit ce
  // que c'est, on ne déverse pas la charge utile dans la fiche.
  if (/^data:/i.test(url)) {
    const type = (url.match(/^data:([a-z0-9.+-]+\/[a-z0-9.+-]+)/i) || [])[1] || 'données';
    return '<span class="lien-url lien-embarque" title="Image embarquée dans la cellule">' +
           'image intégrée (' + esc(type) + ')</span>';
  }
  if (!/^https?:\/\//i.test(url)) return valeurLisibleHtml(url);

  const court = url.length > 58 ? url.slice(0, 55) + '…' : url;
  return '<a class="lien-url" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
         ' title="' + esc(url) + '">' + esc(court) + '</a>';
}

function valeurLisibleHtml(valeur) {
  const t = txt(valeur);
  return t === '-' ? '<span class="vide">—</span>' : esc(t).replace(/\n/g, '<br>');
}

function boutonHtml(action, donnees, libelle, classe) {
  return '<button type="button" class="btn-action ' + (classe || '') + '"' +
         dataAttrs(Object.assign({ action: action }, donnees)) + '>' + esc(libelle) + '</button>';
}

// ------------------------------------------------------------
// Une branche : un sous-ensemble, replié en une ligne, déplié en fiche
// ------------------------------------------------------------
/**
 * Le résumé d'une ligne repliée : ce que le type déclare comme parlant
 * (registre `resume`), en une phrase. Deux cotes qui se suivent s'écrivent
 * « L × l mm », une masse porte son unité, des mots-clés se citent.
 */
function resumeBranche(ligne, type) {
  const cles = type.resume || [];
  const morceaux = [];
  for (let i = 0; i < cles.length; i++) {
    const cle = cles[i];
    const champ = type.champs.find(function (c) { return c.cle === cle; }) || {};
    if (champ.genre === GENRE.MOTS_CLES) {
      const mots = motsCles(ligne[cle]);
      if (mots.length) morceaux.push(mots.slice(0, 3).join(', ') + (mots.length > 3 ? '…' : ''));
      continue;
    }
    const v = txt(ligne[cle]);
    if (v === '-') continue;
    if (/Dim Long/.test(cle) && /Dim Larg/.test(cles[i + 1] || '')) {
      const l = txt(ligne[cles[i + 1]]);
      i++;
      morceaux.push(l === '-' ? v + ' mm' : v + ' × ' + l + ' mm');
      continue;
    }
    const unite = (cle.match(/\((mm|g|kg)\)/) || [])[1];
    morceaux.push(unite ? v + ' ' + unite : v);
  }
  return morceaux.join(' · ');
}

/**
 * La ligne d'une branche. Repliée, elle dit le type, le PN, un résumé, où
 * la pièce est aussi montée, et montre sa photo en timbre. C'est la vue
 * d'ensemble : trois sous-ensembles tiennent en trois lignes.
 */
function brancheHtml(ligne) {
  const id = ligne[CLE_NOM()];
  const type = typeDe(ligne);
  const edition = !!Store.enEditionNom[id];
  const ouverte = edition || !!Store.branchesDepliees[id];
  const ailleurs = boitesUtilisant(ligne['PN du type'], ligne[CLE_PN()]);
  const url = urlMiniature(ligne['Image']);
  const resume = resumeBranche(ligne, type);

  const tete = '<button type="button" class="branche-tete"' +
    dataAttrs({ action: 'deplier-branche', id: id }) +
    ' aria-expanded="' + (ouverte ? 'true' : 'false') + '"' +
    ' title="' + (ouverte ? 'Replier' : 'Déplier') + ' ce sous-ensemble">' +
    '<span class="pastille-type ' + type.teinte + '" aria-hidden="true">' + type.icone + '</span>' +
    '<span class="branche-texte">' +
      '<span class="branche-ligne">' +
        '<span class="branche-type">' + esc(type.libelle) + '</span>' +
        '<span class="branche-pn">' + esc(txt(ligne['PN du type'], 'sans PN')) + '</span>' +
      '</span>' +
      (resume ? '<span class="branche-resume">' + esc(resume) + '</span>' : '') +
    '</span>' +
    (ailleurs.length
      ? '<span class="branche-partage" title="' + esc(ailleurs.join(', ')) + '">' +
          'aussi dans ' + ailleurs.length + (ailleurs.length > 1 ? ' boîtes' : ' boîte') + '</span>'
      : '') +
    (url ? '<span class="branche-photo"><img src="' + esc(url) + '" alt="" loading="lazy"></span>' : '') +
    '<span class="branche-chevron" aria-hidden="true">›</span>' +
  '</button>';

  return '<section class="bloc bloc-branche bloc-' + type.teinte + (ouverte ? ' ouverte' : '') + '">' +
    tete +
    (ouverte ? '<div class="branche-corps">' + blocNomHtml(ligne, type, edition, ailleurs) + '</div>' : '') +
  '</section>';
}

// ------------------------------------------------------------
// Le corps d'un sous-ensemble déplié — piloté par son type
// ------------------------------------------------------------
function blocNomHtml(ligne, type, edition, ailleurs) {
  const id = ligne[CLE_NOM()];
  type = type || typeDe(ligne);
  if (edition === undefined) edition = !!Store.enEditionNom[id];
  if (!ailleurs) ailleurs = boitesUtilisant(ligne['PN du type'], ligne[CLE_PN()]);

  const actions = edition
    ? boutonHtml('sauver-nom', { id: id }, 'Enregistrer', 'btn-valider') +
      boutonHtml('annuler-nom', { id: id }, 'Annuler', 'btn-neutre')
    : boutonHtml('comparer-nom', { id: id }, 'Équivalences', 'btn-accent') +
      boutonHtml('editer-nom', { id: id }, 'Éditer', 'btn-neutre') +
      boutonHtml('supprimer-nom', { id: id }, 'Supprimer', 'btn-danger');

  let html = '<div class="bloc-actions branche-outils">' +
    '<span id="spin-nom-' + esc(id) + '" class="zone-spin"></span>' + actions + '</div>';

  let cles = '', larges = '';
  if (edition) {
    cles += ligneHtml('Type', saisieHtml({ cle: 'Type', genre: GENRE.TEXTE, liste: 'list-Type' },
                                         ligne['Type'], 'champ-nom', id),
                      'change la fiche affichée');
  } else {
    cles += ligneHtml('Type', valeurLisibleHtml(ligne['Type']));
  }

  // Réemploi : la même pièce est-elle montée ailleurs ? Une ligne comme les
  // autres, en face de la photo — plus un bandeau collé sous elle.
  if (ailleurs.length) {
    cles += ligneHtml('Aussi montée dans',
      '<div class="usages">' +
        ailleurs.map(function (pn) {
          return '<button type="button" class="usage-lien"' +
                 dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
        }).join('') +
      '</div>');
  }

  // Seuls les champs du type : c'est tout l'intérêt du registre. Quand la
  // section change, on pose un repère : une structure a beaucoup de champs,
  // ils se lisent par groupes.
  let sectionCourante = null;
  const repere = function (champ) {
    if (!champ.section || champ.section === sectionCourante) return '';
    sectionCourante = champ.section;
    return sectionHtml(champ.section);
  };
  champsDuType(type).forEach(function (champ) {
    const valeur = ligne[champ.cle];

    if (champ.genre === GENRE.COMPOSANTS) {
      larges += blocComposantsHtml(champ, valeur, { portee: 'nom', id: id });
      return;
    }

    if (champ.genre === GENRE.MULTI) {
      cles += repere(champ) + blocMultiHtml(champ, valeursMulti(valeur), true,
                            'ajouter-multi-nom', 'supprimer-multi-nom',
                            { id: id, champ: champ.cle });
      return;
    }

    if (champ.genre === GENRE.MOTS_CLES) {
      cles += repere(champ) + blocMultiHtml(champ, motsCles(valeur), true,
                            'ajouter-multi-nom', 'supprimer-multi-nom',
                            { id: id, champ: champ.cle }, 'puce-motcle');
      return;
    }

    if (champ.genre === GENRE.IMAGE) {
      larges += repere(champ) + (edition
        ? ligneHtml('Image (URL)', saisieHtml(champ, valeur, 'champ-nom', id))
        : ligneHtml('Image (URL)', urlLisibleHtml(valeur)));
      return;
    }

    const ligneChamp = edition
      ? ligneHtml(champ.libelle, saisieHtml(champ, valeur, 'champ-nom', id), champ.aide)
      : ligneHtml(champ.libelle, valeurLisibleHtml(valeur), champ.aide);
    if (champ.genre === GENRE.LONG) larges += repere(champ) + ligneChamp;
    else cles += repere(champ) + ligneChamp;
  });

  return html + identiteHtml(edition ? '' : apercuImageHtml(ligne['Image'], 'vignette-fiche'), cles) + larges;
}

// ------------------------------------------------------------
// Boîte complète
// ------------------------------------------------------------
function ficheHtml(boite) {
  if (!boite) {
    return '<div class="etat-vide">' +
             '<p>Cette boîte n\'existe plus.</p>' +
             '<p class="etat-vide-aide">Fermez le panneau : la liste est à jour.</p>' +
           '</div>';
  }

  const lignes = boite.nomenclature || [];
  const parType = new Map();
  lignes.forEach(function (l) {
    const t = typeDe(l);
    if (!parType.has(t.cle)) parType.set(t.cle, []);
    parType.get(t.cle).push(l);
  });

  // La composition se lit dans la tête de l'arbre, pas dans un bandeau à
  // part au-dessus de la boîte : c'est des sous-ensembles qu'elle parle.
  const sommaire = Array.from(parType.entries()).map(function (e) {
    const t = typeParCle(e[0]);
    return '<span class="sommaire-item ' + t.teinte + '">' + t.icone + ' ' +
           esc(t.libelle) + ' <b>' + e[1].length + '</b></span>';
  }).join('');

  // La boîte est le tronc, les sous-ensembles sont ses branches. Chacune
  // tient en une ligne tant qu'on ne l'ouvre pas : on voit d'abord tout,
  // puis on regarde une pièce.
  const branches = lignes.length
    ? '<div class="arbre-fiche">' +
        '<div class="arbre-tete">' +
          '<span class="arbre-titre">Sous-ensembles</span>' +
          '<span class="arbre-compte">' + lignes.length +
            (lignes.length > 1 ? ' montés' : ' monté') + '</span>' +
          '<nav class="sommaire" aria-label="Composition">' + sommaire + '</nav>' +
        '</div>' +
        '<div class="arbre-branches">' +
          lignes.map(function (l) {
            return '<div class="arbre-branche">' + brancheHtml(l) + '</div>';
          }).join('') +
          '<div class="arbre-branche arbre-ajout">' +
            boutonHtml('nouveau-sous-ensemble', {}, '+ Ajouter un sous-ensemble', 'btn-neutre') +
          '</div>' +
        '</div>' +
      '</div>'
    : '<div class="fiche-pied">' +
        boutonHtml('nouveau-sous-ensemble', {}, '+ Ajouter un sous-ensemble', 'btn-principal') +
      '</div>';

  return blocBoiteHtml(boite) + branches;
}

/**
 * LA FICHE D'UNE FONCTION DE COMPOSANT
 *
 * Le pendant de la fiche d'une boîte : on l'ouvre depuis la liste, dans le
 * même panneau. Une norme par bloc, ses références dessous, et la plus
 * montée marquée — c'est vers elle qu'il coûte le moins cher de converger.
 */
function ficheComposantHtml(cible) {
  // Toute la base, toujours : ouverte depuis une boîte filtrée sur sa
  // fonction, la fiche d'un voyant ne voyait plus qu'une boîte.
  const base = baseComposants(Store.boites).filter(function (c) {
    return c.categorie === cible.categorie &&
           normaliserTexte(c.fonction) === normaliserTexte(cible.fonction);
  });
  if (!base.length) {
    return '<div class="etat-vide"><p>Ce composant n\'est plus dans la base.</p>' +
           '<p class="etat-vide-aide">Fermez le panneau : la liste est à jour.</p></div>';
  }

  const parNorme = new Map();
  base.forEach(function (c) {
    const cle = normaliserTexte(c.norme) || '\u0000';
    if (!parNorme.has(cle)) parNorme.set(cle, { libelle: c.norme || 'sans norme', lignes: [] });
    parNorme.get(cle).lignes.push(c);
  });

  const montees = base.filter(function (c) { return c.nbBoites > 0; });
  const boites = new Set();
  base.forEach(function (c) { c.boites.forEach(function (b) { boites.add(b); }); });
  const maxi = base.reduce(function (m, c) { return Math.max(m, c.nbBoites); }, 1);

  // Le résumé : ce qu'on est venu savoir avant de lire le détail.
  const resume = '<div class="fc-resume">' +
    '<div class="fc-mesure"><span class="fc-n">' + parNorme.size + '</span>' +
      '<span class="fc-l">norme' + (parNorme.size > 1 ? 's' : '') + '</span></div>' +
    '<div class="fc-mesure"><span class="fc-n">' + base.length + '</span>' +
      '<span class="fc-l">référence' + (base.length > 1 ? 's' : '') + '</span></div>' +
    '<div class="fc-mesure"><span class="fc-n">' + boites.size + '</span>' +
      '<span class="fc-l">boîte' + (boites.size > 1 ? 's' : '') + '</span></div>' +
  '</div>';

  // Le plan de convergence : la cible, ce qu'on cesserait de faire vivre,
  // et les boîtes à modifier — nommées, cliquables. C'est la décision.
  // Le plan se fait SOUS UNE MÊME NORME : deux normes différentes ont en
  // général leur raison — on ne propose pas de les fondre. Il se lit en
  // trois phrases : ce qu'on a, ce qu'on garderait, ce que ça coûterait.
  const normesDispersees = Array.from(parNorme.values())
    .map(function (n) { return { norme: n, plan: planConvergence(n.lignes) }; })
    .filter(function (x) { return x.plan; })
    .sort(function (a, b) { return b.plan.economie - a.plan.economie; });
  const plan = normesDispersees.length ? normesDispersees[0].plan : null;   // le principal, pour la matrice

  const conseil = normesDispersees.map(function (x) {
    const n = x.norme, p = x.plan;
    const boitesNorme = new Set();
    n.lignes.forEach(function (c) { c.boites.forEach(function (b) { boitesNorme.add(b); }); });
    const montesNorme = n.lignes.filter(function (c) { return c.nbBoites > 0; }).length;
    return '<section class="fc-plan">' +
        '<h4 class="fc-titre">Le plan de convergence' +
          (parNorme.size > 1 ? ' — norme <span class="fc-titre-norme">' + esc(n.libelle) + '</span>' : '') + '</h4>' +
        '<p class="fc-conseil">' +
          '<b>' + montesNorme + ' références</b> sont montées sous la norme ' +
          '<span class="fc-pn">' + esc(n.libelle) + '</span> pour le même service. ' +
          'La plus répandue est <span class="fc-pn">' + esc(p.cible.reference) + '</span>, ' +
          'dans <b>' + p.cible.nbBoites + ' boîte' + (p.cible.nbBoites > 1 ? 's' : '') +
          ' sur ' + boitesNorme.size + '</b>.' +
        '</p>' +
        '<div class="fc-plan-corps">' +
          partsDetailHtml(n.lignes) +
          '<p class="fc-plan-si">Si toutes les boîtes montaient cette référence :</p>' +
          '<div class="fc-plan-chiffres">' +
            '<span class="fc-plan-mesure"><b>−' + p.economie + '</b> référence' + (p.economie > 1 ? 's' : '') + ' à faire vivre</span>' +
            '<span class="fc-plan-mesure fc-plan-cout"><b>' + p.aModifier.length + '</b> boîte' + (p.aModifier.length > 1 ? 's' : '') + ' à modifier</span>' +
          '</div>' +
          '<div class="fc-plan-boites">' +
            '<span class="fc-plan-boites-titre">' + (p.aModifier.length > 1 ? 'Les boîtes' : 'La boîte') + ' à modifier :</span>' +
            p.aModifier.map(function (pn) {
              return '<button type="button" class="usage-lien"' +
                     dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</section>';
  }).join('') +
  // Plusieurs normes, mais une référence montée par norme : rien à fondre.
  // On le dit, pour qu'on ne cherche pas un plan qui n'a pas lieu d'être.
  (parNorme.size > 1 && !normesDispersees.length && montees.length > 1
    ? '<p class="fc-note">' + parNorme.size + ' normes, une référence montée par norme : ' +
      'rien à faire converger. Deux normes différentes ont en général leur raison.</p>'
    : '');

  // Qui monte quoi : la même fonction, référence par référence, porteur par
  // porteur. C'est là qu'on voit qu'un programme s'écarte des autres.
  const porteursVus = new Set();
  montees.forEach(function (c) { c.porteurs.forEach(function (p) { porteursVus.add(p); }); });
  const matrice = montees.length > 1 && porteursVus.size > 1
    ? '<section class="fc-matrice">' +
        '<h4 class="fc-titre">Qui monte quoi</h4>' +
        '<p class="fc-lire">Le nombre de boîtes de chaque porteur qui montent chaque référence. ' +
          'Plus la case est foncée, plus c\'est monté.</p>' +
        matriceHtml(matriceEmploi(montees.slice().sort(function (a, b) { return b.nbBoites - a.nbBoites; })
          .map(function (c) { return { libelle: txt(c.reference, 'sans référence'), lignes: [c], composant: c }; })), {
          enTete: 'Référence',
          ligne: function (g) {
            const cible = normesDispersees.some(function (x) { return x.plan.cible === g.composant; });
            return '<span class="mx-ref' + (cible ? ' mx-ref-cible' : '') + '">' +
                   esc(g.libelle) + (cible ? '<span class="mx-cible-tag">cible</span>' : '') + '</span>';
          }
        }) +
      '</section>'
    : '';

  const blocs = Array.from(parNorme.values())
    .sort(function (a, b) {
      const mb = b.lignes.reduce(function (t, l) { return t + l.nbBoites; }, 0);
      const ma = a.lignes.reduce(function (t, l) { return t + l.nbBoites; }, 0);
      return mb - ma || a.libelle.localeCompare(b.libelle, 'fr');
    })
    .map(function (n) {
      n.lignes.sort(function (a, b) {
        return b.nbBoites - a.nbBoites ||
               String(a.reference).localeCompare(String(b.reference), 'fr', { numeric: true });
      });
      // La plus montée se marque PAR NORME, et seulement quand il y a de
      // quoi choisir : une référence seule sous sa norme n'est pas « la plus ».
      const planNorme = planConvergence(n.lignes);
      const majoritaire = planNorme ? planNorme.cible : null;
      return '<section class="fc-norme">' +
        '<header class="fc-norme-tete">' +
          '<span class="fc-norme-cle">Norme</span>' +
          '<span class="fc-norme-nom">' + esc(n.libelle) + '</span>' +
          '<span class="fc-norme-n">' + n.lignes.length +
            (n.lignes.length > 1 ? ' références' : ' référence') + '</span>' +
        '</header>' +
        n.lignes.map(function (c) {
          return ficheReferenceHtml(c, maxi, majoritaire && c.cle === majoritaire.cle);
        }).join('') +
      '</section>';
    }).join('');

  return resume + conseil + matrice + '<div class="fc-normes">' + blocs + '</div>';
}

/** Une référence dans la fiche d'une fonction. */
function ficheReferenceHtml(c, maxi, majoritaire) {
  const part = c.nbBoites ? Math.max(6, Math.round((c.nbBoites / (maxi || 1)) * 100)) : 0;
  const etat = c.etat === ETAT_COMPOSANT.HORS
    ? '<span class="cr-etat cr-hors" title="' + esc(AIDE_MARQUES.hors) + '">absente du catalogue</span>'
    : c.etat === ETAT_COMPOSANT.DORMANT
      ? '<span class="cr-etat cr-dormant" title="Au catalogue, montée nulle part">jamais montée</span>'
      : '';

  return '<div class="fc-ref' + (majoritaire ? ' fc-majoritaire' : '') + '">' +
    '<div class="fc-ref-tete">' +
      '<span class="fc-ref-pn">' + esc(txt(c.reference, 'sans référence')) + '</span>' +
      (majoritaire ? '<span class="fc-tag-majo">la plus montée</span>' : '') +
      etat +
    '</div>' +
    (c.designation ? '<p class="fc-ref-designation">' + esc(c.designation) + '</p>' : '') +
    '<div class="fc-ref-emploi">' +
      '<span class="lf-jauge" aria-hidden="true"><span style="width:' + part + '%"></span></span>' +
      '<span class="fc-ref-compte">' +
        (c.nbBoites
          ? c.nbBoites + (c.nbBoites > 1 ? ' boîtes' : ' boîte') +
            (c.montages > c.nbBoites ? ' · ' + c.montages + ' montages' : '')
          : 'montée nulle part') +
      '</span>' +
    '</div>' +
    (c.boites.length
      ? '<div class="fc-ref-boites">' +
          c.boites.map(function (pn) {
            return '<button type="button" class="usage-lien"' +
                   dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
          }).join('') +
        '</div>'
      : '') +
    (c.porteurs.length
      ? '<div class="fc-ref-porteurs">' +
          c.porteurs.map(function (p) {
            return '<span class="puce-porteur puce-porteur-mini">' + esc(p) + '</span>';
          }).join('') +
        '</div>'
      : '') +
  '</div>';
}

/** Le bouton « retour » du panneau : d'où l'on vient, quand on vient de quelque part. */
function rendreRetourFiche() {
  const zone = parId('slideOverRetour');
  if (!zone) return;
  const pile = Store.pileFiches || [];
  if (!pile.length) { zone.innerHTML = ''; zone.hidden = true; return; }
  const precedent = pile[pile.length - 1];
  const libelle = precedent.composant ? precedent.composant.fonction : precedent.pn;
  zone.hidden = false;
  zone.innerHTML = '<button type="button" class="panneau-retour"' +
    dataAttrs({ action: 'fiche-retour' }) + ' title="Revenir à la fiche précédente">' +
    '<span aria-hidden="true">←</span> ' + esc(txt(libelle, 'Retour')) + '</button>';
}

function rendreFiche() {
  rendreRetourFiche();
  rendreCorpsFiche();
  // Un rendu remplace le bouton qu'on vient de cliquer : le focus tombe sur
  // la page, et Échap ne ferme plus le panneau. On le rend au panneau.
  if (typeof panneauOuvert === 'function' && panneauOuvert() &&
      (!document.activeElement || document.activeElement === document.body)) {
    const panneau = parId('detailsSlideOver');
    if (panneau && typeof panneau.focus === 'function') panneau.focus();
  }
}

function rendreCorpsFiche() {
  // Le panneau sert les deux bases : une boîte, ou un composant.
  if (Store.ficheComposant) {
    const cat = CATEGORIES_COMPOSANT[Store.ficheComposant.categorie] ||
                CATEGORIES_COMPOSANT.composant;
    definirTexte('slideOverTitle', Store.ficheComposant.fonction);
    const sousC = parId('slideOverSousTitre');
    if (sousC) sousC.textContent = cat.libelle;
    definirHtml('slideOverBody', ficheComposantHtml(Store.ficheComposant));
    return;
  }

  const boite = boiteCourante();
  definirTexte('slideOverTitle', boite ? txt(boite[CLE_PN()]) : 'Fiche');
  const sous = parId('slideOverSousTitre');
  if (sous) {
    sous.textContent = boite
      ? txt(boite['Fonction'], 'sans fonction') + ' · ' +
        (boite.nomenclature || []).length + ' sous-ensemble(s)'
      : '';
  }
  definirHtml('slideOverBody', ficheHtml(boite));
}

// ------------------------------------------------------------
// Lecture des champs d'édition
// ------------------------------------------------------------
function lireChamps(classe, ligneId) {
  const modifs = {};
  document.querySelectorAll('.' + classe).forEach(function (el) {
    if (ligneId !== undefined && el.dataset.ligne !== String(ligneId)) return;
    modifs[el.dataset.champ] = el.value;
  });
  return modifs;
}

function lireSaisieMulti(champ, ligneId) {
  let trouve = null;
  document.querySelectorAll('.saisie-multi').forEach(function (el) {
    if (trouve) return;
    if (el.dataset.champ !== champ) return;
    if (ligneId !== undefined && el.dataset.id !== String(ligneId)) return;
    trouve = el;
  });
  if (!trouve) return '';
  const valeur = trouve.value.trim();
  trouve.value = '';
  return valeur;
}

/** Les trois champs d'un composant en cours de saisie -> { fonction, norme, reference } | null. */
function lireSaisieComposant(champ, ligneId) {
  const c = { fonction: '', norme: '', reference: '' };
  const trouves = [];
  document.querySelectorAll('.saisie-composant').forEach(function (el) {
    if (el.dataset.champ !== champ) return;
    if (ligneId !== undefined && ligneId !== null && el.dataset.id !== String(ligneId)) return;
    if (!ligneId && el.dataset.id) return;
    c[el.dataset.niveau] = el.value.trim();
    trouves.push(el);
  });
  if (!c.fonction) return null;
  trouves.forEach(function (el) { el.value = ''; });
  return c;
}
