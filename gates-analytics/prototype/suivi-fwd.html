<title>Suivi FWD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  --papier:     #f4f2ed;
  --surface:    #ffffff;
  --creux:      #faf9f6;
  --encre:      #191915;
  --encre-2:    #57564e;
  --encre-3:    #86847a;
  --filet:      #e5e3dc;
  --filet-fort: #cfccc2;

  --fait:   #286b45;
  --cours:  #bf7f14;
  --afaire: #71716a;
  --alerte: #a13b2a;
  /* Encre posee sur un aplat plein : claire sur les verts et gris soutenus du
     mode clair, sombre sur les memes aplats eclaircis du mode sombre. */
  --sur-plein: #ffffff;
  /* L'ambre reste clair dans les deux themes : son encre ne bascule pas. */
  --sur-ambre: #2c2208;

  /* Rampe séquentielle (clair → foncé), luminance strictement décroissante */
  --r1: #eef4f0; --r2: #d6e6dc; --r3: #b3d2c1; --r4: #86b8a0; --r5: #52997a; --r6: #286b45;

  --focus: #286b45;
  /* Le voile ambre d'une cellule qui diffère de l'autre base. */
  --voile-ecart: rgba(191, 127, 20, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0d0d0c; --surface: #16161a; --creux: #1c1c20;
    --encre: #f1f0ea; --encre-2: #a6a49a; --encre-3: #7b7970;
    --filet: #272725; --filet-fort: #3d3c37;
    --fait: #6fae82; --cours: #dda434; --afaire: #8f8f88; --alerte: #e0745c;
    --sur-plein: #11110f;
    --r1: #1a241e; --r2: #23382c; --r3: #2e4f3c; --r4: #3d6b51; --r5: #558a6b; --r6: #6fae82;
    --focus: #6fae82;
    --voile-ecart: rgba(221, 164, 52, .2);
  }
}
:root[data-theme="dark"] {
  --papier: #0d0d0c; --surface: #16161a; --creux: #1c1c20;
  --encre: #f1f0ea; --encre-2: #a6a49a; --encre-3: #7b7970;
  --filet: #272725; --filet-fort: #3d3c37;
  --fait: #6fae82; --cours: #dda434; --afaire: #8f8f88; --alerte: #e0745c;
  --sur-plein: #11110f;
  --r1: #1a241e; --r2: #23382c; --r3: #2e4f3c; --r4: #3d6b51; --r5: #558a6b; --r6: #6fae82;
  --focus: #6fae82;
  --voile-ecart: rgba(221, 164, 52, .2);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--papier); color: var(--encre);
  font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

.page { max-width: 1200px; margin: 0 auto; padding-inline: 30px; padding-block: 0 0; }
@media (max-width: 720px) { .page { padding-inline: 15px; } }

.feuille { background: var(--surface); border: 1px solid var(--filet); padding: 20px 22px 22px; }
@media (max-width: 720px) { .feuille { padding: 15px 13px 17px; } }

/* ---------------------------------------------------- Bandeau de titre */
.masthead {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 16px;
  text-align: center; padding-block: 46px 26px; border-bottom: 1px solid var(--filet-fort);
}
.masthead .titre-bloc { grid-column: 2; min-width: 0; }
@media (max-width: 900px) {
  .masthead { grid-template-columns: 1fr; row-gap: 16px; }
  .masthead .titre-bloc { grid-column: 1; }
}
@media (max-width: 720px) { .masthead { padding-block: 30px 20px; } }
.masthead h1 {
  font-family: Newsreader, Georgia, serif;
  font-weight: 300; font-size: clamp(34px, 6vw, 52px);
  letter-spacing: .015em; margin: 0 0 12px; line-height: 1.05;
}
.masthead .semaine {
  font-size: 15px; color: var(--encre-2);
  display: flex; justify-content: center; align-items: baseline; gap: 9px; flex-wrap: wrap;
}
.masthead .semaine b { font-weight: 600; color: var(--encre); }
.masthead .import {
  margin-top: 7px; font-size: 12.5px; color: var(--encre-3);
  display: inline-flex; align-items: center; gap: 7px;
}
.point-frais { width: 6px; height: 6px; border-radius: 50%; background: var(--fait); flex: none; }

/* ---------------------------------------------------- Avancement */
.avancement { padding-block: 30px 0; }
.avancement-ligne {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
}
.phrase { font-size: 20px; }
.phrase b { font-weight: 600; }

.barre { display: flex; gap: 2px; height: 26px; margin-bottom: 0; }
.barre span {
  min-width: 4px;                 /* 3 plans sur 640 restent visibles, en haut comme au rapprochement */
  transition: width .3s ease;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 11.5px; line-height: 1; white-space: nowrap;
}
/* Filets pointilles : ils prolongent les coupures de la barre pour delimiter
   les quatre zones de chiffres sans passer derriere les etiquettes. */
.filets { position: relative; height: 12px; }
/* Les traits descendent derriere les chiffres : les etiquettes, opaques, les
   interrompent proprement au lieu de se battre avec eux. */
.filets i {
  position: absolute; top: 0; width: 2px; height: 76px;
  background-image: linear-gradient(var(--encre-3) 55%, transparent 0);
  background-size: 2px 7px; background-repeat: repeat-y;
  opacity: .5;
}
@media (max-width: 680px) { .filets { display: none; } }
.hachure {
  background-image: repeating-linear-gradient(45deg, var(--filet-fort) 0 1.5px, transparent 1.5px 5px);
  border: 1px solid var(--filet-fort);
}

.etats { position: relative; height: 64px; }
.etat-btn {
  position: absolute; top: 0; left: 0;
  background: var(--papier); border: none; padding: 3px 11px; font: inherit;
  text-align: center; cursor: pointer; display: grid; gap: 1px; white-space: nowrap;
}
.etat-haut { display: flex; align-items: center; gap: 7px; color: var(--encre-2); font-size: 12.5px; }
.etat-n {
  font-family: "IBM Plex Mono", monospace; font-size: 26px; font-variant-numeric: tabular-nums;
  line-height: 1.15; font-weight: 400; color: var(--encre-3); transition: color .12s;
}
.etat-btn:hover .etat-n { color: var(--encre); }
.etat-btn[aria-pressed="true"] .etat-n { color: var(--encre); }
.etat-btn[aria-pressed="true"] .etat-haut { color: var(--encre); font-weight: 500; }
.etat-haut { justify-content: center; }
.etat-btn[aria-pressed="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--teinte);
}
.pastille { width: 9px; height: 9px; border-radius: 2px; flex: none; }
/* Un changement d'indice n'est pas un état : sa pastille est un anneau, pas
   un aplat. « sans » tient la place d'une pastille pour garder l'alignement. */
.pastille.neutre { background: transparent; box-shadow: inset 0 0 0 1.5px var(--encre-3); }
.pastille.sans { background: transparent; }
/* Sous 680 px les segments sont trop étroits pour porter une étiquette :
   on repasse à une grille régulière. */
@media (max-width: 680px) {
  .etats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 0; height: auto; }
  .etat-btn { position: static; text-align: left; padding: 3px 0; background: none; }
  .etat-haut { justify-content: flex-start; }
}

/* ---------------------------------------------------- Mode des données */
/* Un seul interrupteur, tout en haut : la page entière est réelle, ou elle est
   un exemple. Pas de demi-mesure au milieu de l'écran. */
.bandeau-mode {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 0 0;
}
.bandeau-mode .mot-mode { font-size: 12.5px; color: var(--encre-3); }
.bandeau-mode .mot-mode b { color: var(--cours); font-weight: 500; }
/* Ce que le classeur a à dire quand il n'a rien pu rendre : en rouge, à la
   place du mot de mode, et annoncé aux lecteurs d'écran. */
.bandeau-mode .alerte-source { color: var(--alerte); font-weight: 500; }
.bandeau-mode .alerte-source[hidden] { display: none; }
body[data-exemple="true"] .bandeau-mode {
  border: 1px dashed var(--cours); background: var(--creux);
  padding: 10px 13px; margin-top: 12px;
}
/* Le choix du contrat : à droite du même bandeau, dans le même registre
   discret. Il n'apparaît que s'il y a vraiment plusieurs contrats entre
   lesquels choisir — avec un seul, il n'aurait rien à dire. */
.bandeau-mode .choix-contrat {
  margin-left: auto; display: inline-flex; align-items: baseline; gap: 8px;
  font-size: 12.5px; color: var(--encre-3);
}
.bandeau-mode .choix-contrat[hidden] { display: none; }
.bandeau-mode .choix-contrat select { font-size: 13px; min-width: 64px; }
.bandeau-mode .choix-contrat select:disabled { color: var(--encre-3); cursor: progress; }
.bandeau-mode .attente { font-size: 12px; color: var(--encre-3); }
.bandeau-mode .attente:empty { display: none; }
/* Le périmètre : tout en haut, à côté du mode, parce qu'il porte sur toute la
   page — barre, courbe, journal, bloc par groupe, tableau. « Tout », puis une
   puce par valeur de la colonne de domaine, chacune avec son compte de plans.
   Sans colonne de domaine, il n'a rien à proposer et reste caché. */
/* Le périmètre vit sous le titre, au-dessus de la barre : c'est de là qu'on
   choisit ce qu'on regarde, et le bandeau du haut garde sa sobriété. */
/* Le périmètre, à droite du titre : le mot au-dessus, le choix dessous,
   alignés sur le bord droit ; sous 900 px, il passe sous le titre, centré. */
.perimetre {
  grid-column: 3; justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  font-size: 12px; color: var(--encre-3);
}
.perimetre .mot-perimetre { letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; font-weight: 500; }
@media (max-width: 900px) { .perimetre { grid-column: 1; justify-self: center; align-items: center; } }
.perimetre[hidden] { display: none; }
#choix-perimetre button { white-space: nowrap; }
#choix-perimetre .n {
  margin-left: 6px; font-family: "IBM Plex Mono", monospace;
  font-variant-numeric: tabular-nums; opacity: .75;
}
/* Trois puces et leurs comptes ne tiennent pas sur un téléphone : le groupe
   passe sur deux lignes plutôt que de faire déborder la page. */
@media (max-width: 480px) { #choix-perimetre { flex-wrap: wrap; } }


/* ---------------------------------------------------- Filtres actifs */
/* Un bandeau qui suit la page : quoi qu'on ait cliqué, la sortie est visible. */
.filtres-actifs {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 0 0 4px; padding: 9px 0;
  background: var(--papier); border-bottom: 1px solid var(--filet-fort);
}
.filtres-actifs[hidden] { display: none; }
.filtres-actifs .mot { font-size: 12px; color: var(--encre-3); letter-spacing: .05em; text-transform: uppercase; }
.jeton {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--encre); background: var(--encre); color: var(--papier);
  border-radius: 999px; padding: 4px 6px 4px 12px; font: inherit; font-size: 12.5px;
}
.jeton b { font-weight: 500; }
.jeton .x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; border-radius: 50%; border: none; padding: 0;
  background: rgba(255, 255, 255, .18); color: inherit; cursor: pointer; font: inherit; font-size: 13px; line-height: 1;
}
.jeton .x:hover { background: rgba(255, 255, 255, .35); }
.tout-effacer {
  border: 1px solid var(--filet-fort); background: none; color: var(--encre-2);
  border-radius: 999px; padding: 4px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
}
.tout-effacer:hover { border-color: var(--encre); color: var(--encre); }

/* ---------------------------------------------------- Journal */
.indice-dim { margin: -6px 0 12px; font-size: 12.5px; color: var(--encre-3); max-width: 76ch; }
.indice-dim:empty { display: none; }
/* Deux listes qui peuvent s'allonger sans fin : on leur donne une hauteur et
   un défilement, plutôt que de laisser la page grandir jusqu'à l'illisible. */
.defile-liste { max-height: 430px; overflow-y: auto; overscroll-behavior: contain; }
#zone-journal.defile-liste { max-height: 330px; }
.defile-liste::-webkit-scrollbar { width: 9px; }
.defile-liste::-webkit-scrollbar-thumb { background: var(--filet-fort); border-radius: 5px; }
.defile-liste::-webkit-scrollbar-track { background: transparent; }
@media (max-width: 720px) { .defile-liste { max-height: 380px; } }

.section-journal { margin-top: 26px; }
.titre-journal {
  font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 17px; margin: 0;
}
/* Le filtre du journal : des mots avec leur pastille, pas une barre noire.
   Le choix courant se cerne d'un filet ; le reste s'efface. */
.filtre-journal { display: inline-flex; flex-wrap: wrap; gap: 2px 4px; }
.filtre-journal button {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none;
  padding: 4px 10px; font: inherit; font-size: 12.5px; color: var(--encre-2); cursor: pointer; border-radius: 999px;
  white-space: nowrap;
}
.filtre-journal button:hover { background: var(--creux); color: var(--encre); }
.filtre-journal button[aria-pressed="true"] { border-color: var(--filet-fort); background: var(--surface); color: var(--encre); font-weight: 500; }
.filtre-journal .pastille { width: 8px; height: 8px; }
.journal-semaine {
  border-bottom: 1px solid var(--filet);
}
.journal-semaine:last-child { border-bottom: none; }
.journal-tete {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 2px;
}
.journal-plier {
  display: flex; align-items: baseline; gap: 10px; flex: none;
  background: none; border: none; font: inherit; color: var(--encre);
  padding: 2px 4px 2px 2px; cursor: pointer; border-radius: 3px;
}
.journal-plier:hover { background: var(--creux); }
.journal-tete .sem {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 13.5px; font-weight: 500; min-width: 72px; text-align: left; color: var(--encre);
}
.journal-tete .resume {
  color: var(--encre-2); font-size: 13px; flex: 1; min-width: 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
}
/* La semaine en une ligne de couleur : chaque passage y a sa part, dans
   l'ordre des comptes — on voit d'un coup quelle semaine a bougé et comment. */
.journal-tete .mini-jauge {
  display: flex; gap: 2px; height: 6px; width: 96px; flex: none; margin-left: auto;
}
.journal-tete .mini-jauge span { display: block; min-width: 2px; }
.journal-tete .mini-jauge .indice { background: transparent; box-shadow: inset 0 0 0 1.5px var(--encre-3); }
.journal-tete .mini-jauge .nouveau, .journal-tete .mini-jauge .disparu { background: var(--filet-fort); }
.journal-tete .mini-jauge .vide { background: var(--filet-fort); }
@media (max-width: 720px) { .journal-tete .mini-jauge { display: none; } }
.journal-tete .chevron { color: var(--encre-3); transition: transform .12s; flex: none; }
.journal-plier[aria-expanded="true"] .chevron { transform: rotate(90deg); }
.journal-liste { margin: 0 0 12px; padding: 0 0 0 78px; list-style: none; }
@media (max-width: 720px) { .journal-liste { padding-left: 0; } }
/* Trois colonnes alignées : la référence, ce que c'est, où ça va. Le regard
   descend une colonne au lieu de chercher la flèche au milieu du texte. */
.journal-ligne {
  display: grid; grid-template-columns: 136px minmax(0, 1fr) 190px;
  align-items: baseline; gap: 12px; width: 100%;
  background: none; border: none; font: inherit; color: inherit;
  padding: 6px 6px; text-align: left; cursor: pointer; border-radius: 3px;
}
@media (max-width: 720px) {
  .journal-ligne { grid-template-columns: 1fr auto; gap: 3px 10px; padding: 8px 4px; }
  .journal-ligne .quoi { grid-column: 1 / -1; }
}
.journal-ligne:hover { background: var(--creux); }
.journal-ligne .ref { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
/* Une réémission : l'ancienne référence au-dessus, effacée, la nouvelle dessous. */
.journal-ligne .ref-indice { display: grid; gap: 1px; }
.journal-ligne .ref-indice .ancienne { color: var(--encre-3); }
.journal-ligne .ref-indice .nouvelle { white-space: nowrap; }
.journal-ligne .quoi {
  color: var(--encre-3); font-size: 12.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Le passage : l'état de départ s'efface, seule l'arrivée porte la couleur. */
.journal-ligne .vers {
  display: grid; grid-template-columns: 1fr 12px 1fr; align-items: center; gap: 4px;
  font-size: 12px;
}
@media (max-width: 720px) { .journal-ligne .vers { justify-self: end; } }
.fleche-etat { color: var(--filet-fort); text-align: center; }
.etiq-etat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.etiq-etat.avant { color: var(--encre-3); justify-self: end; }
.etiq-etat.avant .pastille { opacity: .4; }
.etiq-etat.apres { color: var(--encre); font-weight: 500; }
/* Les compteurs du résumé sont des boutons, avec leur pastille : un clic
   isole ce passage-là sur toutes les semaines. */
.compte-passage {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent; background: none; padding: 2px 8px; margin: 0 -4px; font: inherit;
  color: inherit; cursor: pointer; border-radius: 999px; white-space: nowrap;
}
.compte-passage .pastille { width: 8px; height: 8px; }
.compte-passage b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--encre); }
.compte-passage:hover { background: var(--creux); color: var(--encre); }
.compte-passage[aria-pressed="true"] { border-color: var(--filet-fort); background: var(--surface); color: var(--encre); font-weight: 500; }
.journal-tete .resume .doux-compte { display: inline-flex; align-items: center; gap: 6px; color: var(--encre-3); white-space: nowrap; }
.journal-tete .resume .doux-compte b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; }

/* La liste des UD d'un groupe, dépliée sous sa ligne : TOUTES les références,
   en deux paquets titrés — ce qui reste à faire d'abord, puis ce qui est
   soldé. Le conteneur du bloc a sa hauteur et son défilement : deux cents
   références se parcourent, elles ne poussent pas le reste de la page. */
.groupe-refs {
  padding: 6px 0 16px 16px; border-left: 2px solid var(--filet);
  margin: 2px 0 8px 14px;
}
.groupe-refs .entete {
  font-size: 11.5px; color: var(--encre-3); margin-bottom: 4px;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.groupe-refs .sous-groupe { margin-top: 10px; }
/* La légende des pastilles, à côté du compte : les carrés ne se devinent pas. */
.groupe-refs .legende-etats { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; color: var(--encre-2); }
.groupe-refs .legende-etats span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.groupe-refs .legende-etats .pastille { width: 7px; height: 7px; }
.groupe-refs .sous-titre {
  margin: 0 0 7px; font: 500 10.5px/1.4 "IBM Plex Sans", system-ui, sans-serif;
  letter-spacing: .09em; text-transform: uppercase; color: var(--encre-2);
  display: flex; align-items: baseline; gap: 7px;
}
.groupe-refs .sous-titre .n {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  letter-spacing: 0; color: var(--encre-3);
}
.groupe-refs .grille {
  display: flex; flex-wrap: wrap; gap: 6px 7px;
}
.jeton-ud {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--filet); background: var(--surface); color: var(--encre-2);
  border-radius: 3px; padding: 3px 9px 3px 8px; font-family: "IBM Plex Mono", monospace;
  font-size: 11.5px; line-height: 1.3; cursor: pointer; white-space: nowrap;
}
.jeton-ud:hover { border-color: var(--encre-3); color: var(--encre); background: var(--creux); }
.jeton-ud .pastille { width: 7px; height: 7px; margin: 0; flex: none; }
.journal-vide { color: var(--encre-3); font-size: 13px; padding: 14px 2px; }
.journal-plus {
  background: none; border: none; font: inherit; font-size: 12.5px; color: var(--encre-3);
  cursor: pointer; padding: 5px 2px; text-decoration: underline; text-underline-offset: 3px;
}
.journal-plus:hover { color: var(--encre); }

/* ---------------------------------------------------- Sections */
.bloc { margin-top: 34px; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 13px; }
/* L'interrupteur des bases, collé au titre « Plans » ; le compte reste à droite. */
#choix-base { margin-right: auto; align-self: center; }
#choix-base[hidden] { display: none; }
#section-plans [data-base][hidden] { display: none; }
h2 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 21px; margin: 0; }
.indice { color: var(--encre-3); font-size: 12.5px; }

select.select {
  border: none; border-bottom: 1px solid var(--filet-fort); background: none;
  color: var(--encre); font: inherit; font-size: 13px; padding: 2px 18px 3px 0; cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%2386847a' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right center;
}
select.select:focus { outline: none; border-bottom-color: var(--focus); }

/* ---------------------------------------------------- Graphique */
.commandes-graphe { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.segmente { display: inline-flex; border: 1px solid var(--filet-fort); }
.segmente button {
  border: none; border-left: 1px solid var(--filet-fort); background: none;
  font: inherit; font-size: 12px; padding: 3px 10px; color: var(--encre-2); cursor: pointer;
}
.segmente button:first-child { border-left: none; }
.segmente button:hover { background: var(--creux); color: var(--encre); }
.segmente button[aria-pressed="true"] { background: var(--encre); color: var(--surface); }
/* Cinq boutons ne tiennent pas sur un téléphone : le filtre du journal passe
   sur deux lignes plutôt que de faire déborder la page. */
@media (max-width: 480px) { #filtre-journal { flex-wrap: wrap; } }

.cadre-graphe { position: relative; }
svg.graphe { width: 100%; height: auto; display: block; overflow: visible; }
svg.graphe text { font-family: "IBM Plex Sans", sans-serif; }
.grad { font-size: 11px; fill: var(--encre-3); font-family: "IBM Plex Mono", monospace; }
.cadre-graphe {
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: none;             /* sinon le navigateur prend le geste pour un defilement */
}
.cadre-graphe[data-glisse="true"] { cursor: grabbing; }
.cadre-graphe svg text { user-select: none; }
.zone-clic { cursor: inherit; }
/* Survoler une semaine l'éclaire d'une bande discrète, sous la bulle. */
.zone-clic:hover { fill: var(--filet); fill-opacity: .55; }
.annee { font-size: 10px; fill: var(--encre-3); font-family: "IBM Plex Mono", monospace; letter-spacing: .04em; }
.jalon-texte { font-size: 11.5px; fill: var(--encre-2); font-weight: 500; }

.note-graphe { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--encre-3); }
.note-graphe:empty { display: none; }

.comparatif {
  margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--filet);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 18px; font-size: 13px; color: var(--encre-3);
}
.comparatif:empty { display: none; }
.comparatif > span:first-child { color: var(--encre-2); }
.puce-delta {
  border: none; background: none; font: inherit; cursor: pointer; padding: 1px 0;
  color: var(--encre-2); border-bottom: 1px dotted var(--filet-fort);
  display: inline-flex; align-items: baseline; gap: 6px;
}
.puce-delta:hover { color: var(--encre); border-bottom-color: var(--encre); }
.puce-delta[aria-pressed="true"] { color: var(--encre); font-weight: 500; border-bottom: 1px solid var(--encre); }
.puce-delta b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; }

/* ---------------------------------------------------- Rapprochement
   Quatre compteurs dans le registre des puces du comparatif ; une liste
   sobre pour ce qui n'est pas dans le tableau ; une grille pour le détail. */
.rapprochement[hidden] { display: none; }
/* ---------------------------------------------------- Rapprochement
   La barre de l'avancement, à l'identique, pour la seconde question de la
   page : seules les classes de segment changent, une par verdict. */
.rapp-phrases { margin-bottom: 12px; }
.rapp-sous { margin: 4px 0 0; font-size: 13px; color: var(--encre-2); max-width: 90ch; }
.rapp-sous:empty { display: none; }
/* Les segments : le jeton du verdict, l'encre qui va dessus. */
.barre .identique { background: var(--fait);   color: var(--sur-plein); }
.barre .ecart     { background: var(--cours);  color: var(--sur-ambre); }
.barre .absentLa  { background: var(--alerte); color: var(--sur-plein); }
/* Un autre indice n'est pas un état : un anneau, comme sa pastille. */
.barre .emission  { background: transparent; color: var(--encre); box-shadow: inset 0 0 0 1.5px var(--encre-3); }
/* Ce que la seconde base a en plus : à part, après un blanc, en pointillé
   comme sa pastille. */
.barre .seul      { background: transparent; border: 1.5px dashed var(--encre-3); box-sizing: border-box;
                    margin-left: 10px; min-width: 12px; }
/* Survoler un bouton éclaire son segment : indispensable quand il fait 5 px. */
.barre span.survole { outline: 2px solid var(--encre); outline-offset: -2px; }
/* Un bouton à 0 se lit mais ne se clique pas. */
.etat-btn:disabled { cursor: default; }
.etat-btn:disabled:hover .etat-n { color: var(--encre-3); }
.etat-btn:disabled .pastille { opacity: .45; }
.pastille.identique { background: var(--fait); }
.pastille.ecart { background: var(--cours); }
.pastille.absent { background: var(--alerte); }
.pastille.seul { background: transparent; border: 1.5px dashed var(--encre-3); box-sizing: border-box; }
/* Le tableau de la seconde base : le verdict en pastille dans la cellule de
   la référence, les cellules qui diffèrent d'ici sous un voile ambre, avec la
   valeur d'ici en info-bulle ; les cases à cocher de l'extract en ✓ / –. */
table.plans td.ecart { background: var(--voile-ecart); box-shadow: inset 0 -1px 0 var(--cours); }
table.plans td.coche { text-align: center; color: var(--encre-2); }
table.plans .verdict { display: inline-flex; align-items: center; gap: 8px; }
table.plans tbody tr.choisie td { background: var(--creux); box-shadow: inset 0 -1px 0 var(--encre); }
table.plans tbody tr[data-plan] { cursor: pointer; }
.legende-rapp { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--encre-3); margin-left: auto; }
.legende-rapp span { display: inline-flex; align-items: center; gap: 6px; }
.legende-rapp:empty { display: none; }
.rapp-detail-bouton { margin-top: 18px; display: inline-flex; align-items: baseline; gap: 6px; }
.rapp-detail-bouton::before { content: "▸"; font-size: 10px; }
.rapp-detail-bouton[aria-expanded="true"]::before { content: "▾"; }
.rapp-detail { margin-top: 8px; max-height: 360px; overflow: auto; overscroll-behavior: contain; padding-top: 0; padding-bottom: 0; }
.rapp-grille {
  display: grid; grid-template-columns: max-content max-content minmax(90px, 1fr) minmax(90px, 1fr);
  gap: 0 18px; font-size: 12.5px; min-width: 100%;
}
.rapp-grille > div { padding: 5px 0; border-bottom: 1px solid var(--filet); min-width: 0; overflow-wrap: anywhere; }
.rapp-grille .rapp-entete {
  position: sticky; top: 0; background: var(--surface);
  font: 500 10.5px/1.4 "IBM Plex Sans", system-ui, sans-serif;
  letter-spacing: .09em; text-transform: uppercase; color: var(--encre-2);
  border-bottom-color: var(--filet-fort);
}
.rapp-grille .champ { color: var(--encre-2); }
.rapp-vide { color: var(--encre-3); font-size: 13px; padding: 8px 2px 0; }
/* Les paires « ancienne → nouvelle » d'un changement d'indice : jamais
   coupées à mi-ligne — la bulle ne liste rien d'autre. */
.bulle .liste-refs {
  font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.6;
}

.legende {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--filet);
  font-size: 12.5px; color: var(--encre-2);
}
.legende-item { display: inline-flex; align-items: center; gap: 7px; }
.legende-item span { border-bottom: 1px dotted var(--filet-fort); cursor: help; }

.bulle {
  position: fixed; z-index: 40; pointer-events: none; background: var(--surface);
  border: 1px solid var(--filet-fort); padding: 8px 10px; font-size: 12.5px; min-width: 160px;
  opacity: 0; transition: opacity .1s;
}
.bulle[data-visible="true"] { opacity: 1; }
.bulle .tete-bulle { color: var(--encre-3); font-size: 11px; margin-bottom: 5px; }
/* Les comptes de la semaine, sous les deux lignes de tête : même dessin
   qu'elles — une pastille, un mot, un nombre à droite. */
.bulle-comptes { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--filet); display: grid; gap: 1px; }
.bulle-ligne { display: flex; align-items: center; gap: 7px; }
.bulle-ligne .n { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------- Avancement par groupe */

/* Les commandes du bloc : le choix de la dimension, puis le filtre de la
   colonne de gauche — un champ compact, dérivé de la recherche du tableau
   mais plus bas et plus court, et son compte « n sur m » quand il agit. */
.commandes-groupe { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; min-width: 0; }
.recherche.recherche-groupe { flex: none; width: 200px; min-width: 0; }
.recherche-groupe input {
  height: 30px; padding: 4px 10px 4px 30px; font-size: 13px; border-radius: 15px;
}
.recherche-groupe input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.recherche-groupe svg { left: 11px; margin-top: -7px; }
.compte-groupes {
  font-size: 12px; color: var(--encre-3); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.compte-groupes:empty { display: none; }
@media (max-width: 480px) { .recherche.recherche-groupe { width: 100%; } }

/* Une seule definition de colonnes, portee par le conteneur : l'en-tete et les
   lignes ne peuvent pas diverger, et la variante sans jalon n'a qu'a la redefinir. */
#zone-critique { --cols: 96px 58px minmax(0, 1fr) 126px minmax(0, 150px); }
#zone-critique.sans-jalon { --cols: 104px 62px minmax(0, 1fr) 126px minmax(0, 150px); }
.critique-tete, .critique-ligne {
  display: grid; grid-template-columns: var(--cols);
  gap: 14px; align-items: center;
}
.critique-tete {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--encre-3);
  padding-bottom: 6px; border-bottom: 1px solid var(--filet); margin-bottom: 3px;
}
.critique-tete > span { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.critique-tete > span.a-gauche { justify-content: flex-start; }
button.tri-groupe {
  border: none; background: none; padding: 2px 0; margin: 0; color: inherit; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  display: inline-flex; align-items: center; gap: 5px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
button.tri-groupe:hover { color: var(--encre); }
button.tri-groupe[data-actif="true"] { color: var(--encre); }
button.aide {
  border: 1px solid var(--filet-fort); background: none; color: var(--encre-3);
  width: 15px; height: 15px; border-radius: 50%; padding: 0; flex: none; cursor: pointer;
  font: 500 10px/1 "IBM Plex Sans", system-ui, sans-serif; letter-spacing: 0;
}
button.aide:hover, button.aide[aria-expanded="true"] { border-color: var(--encre); color: var(--encre); }

.critique-ligne { padding: 7px 0; border: none; background: none; width: 100%; text-align: center; font: inherit; color: var(--encre); cursor: pointer; }
.critique-ligne:hover { background: var(--creux); }
.critique-ligne[aria-pressed="true"] { background: var(--creux); box-shadow: inset 3px 0 0 var(--encre); }
.critique-nom { font-size: 13px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.critique-total {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 13px; color: var(--encre-2); text-align: center;
}
.critique-effort, .critique-date { text-align: center; min-width: 0; }
.critique-effort .v, .critique-date .v { display: block; }
.critique-date .v {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px;
}

/* Le panneau d'explication : la formule, puis la meme formule avec les chiffres
   d'une ligne reelle, pour qu'on puisse la refaire de tete. */
.aide-panneau {
  margin: 10px 0 14px; padding: 15px 17px; background: var(--creux);
  border-left: 2px solid var(--filet-fort); font-size: 13px; line-height: 1.55;
}
.aide-panneau h3 { margin: 0 0 8px; font: 500 13px/1.3 "IBM Plex Sans", system-ui, sans-serif; }
.aide-panneau p { margin: 0 0 10px; color: var(--encre-2); max-width: 66ch; }
.aide-panneau p:last-child { margin-bottom: 0; }
.aide-formule {
  font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.85;
  background: var(--surface); border: 1px solid var(--filet); padding: 10px 13px;
  margin: 0 0 11px; overflow-x: auto; white-space: pre; color: var(--encre);
}
.aide-formule b { font-weight: 500; color: var(--fait); }
.aide-panneau .exemple { color: var(--encre-3); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; display: block; margin-bottom: 5px; }
/* Meme langage visuel que la barre du haut : les quatre etats, decoupes par groupe. */
.critique-barre { display: flex; gap: 2px; height: 17px; }
.critique-barre span {
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 10.5px; line-height: 1; white-space: nowrap;
}
.critique-fin {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  text-align: center; font-size: 14px; color: var(--encre);
}
.critique-ecart { font-size: 13px; color: var(--encre); line-height: 1.25; font-variant-numeric: tabular-nums; }
.critique-ecart small { display: block; font-size: 10.5px; color: var(--encre-3); margin-top: 3px; font-weight: 400; letter-spacing: .01em; }
.critique-ecart b.tard { color: var(--alerte); font-weight: 600; }
.critique-ecart.arret { color: var(--alerte); font-weight: 500; font-size: 12px; }
.critique-fin.doux, .critique-date.doux .v { color: var(--encre-3); }
@media (max-width: 720px) {
  /* En colonne, l'en-tete ne peut plus coiffer les valeurs : il se replie en
     une barre de tri, sinon le classement deviendrait inaccessible au telephone. */
  .critique-tete {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
    grid-template-columns: none; padding-bottom: 9px;
  }
  .critique-tete::before {
    content: "Trier"; color: var(--encre-3); flex: none;
  }
  .critique-tete > span, .critique-tete > span.a-gauche { justify-content: flex-start; }
  /* Chaque valeur reprend son libelle a gauche. */
  #zone-critique, #zone-critique.sans-jalon { --cols: 1fr; }
  .critique-ligne { gap: 7px; padding: 13px 0; border-bottom: 1px solid var(--filet); }
  .critique-nom { text-align: left; font-weight: 600; font-size: 15px; }
  .critique-total, .critique-fin, .critique-effort, .critique-date {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; text-align: right;
  }
  .critique-total::before, .critique-fin::before, .critique-effort::before, .critique-date::before {
    content: attr(data-libelle); flex: none;
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 11px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--encre-3);
  }
  .critique-effort .v, .critique-date .v { text-align: right; }
  .critique-ecart { text-align: right; }
}

/* ---------------------------------------------------- Point hebdo */
.point-corps {
  margin-top: 12px; padding: 14px 16px; background: var(--creux);
  border: 1px solid var(--filet); font-size: 14px; line-height: 1.65; white-space: pre-wrap;
}
.point-corps[hidden] { display: none; }
.bouton {
  border: 1px solid var(--filet-fort); background: var(--surface); color: var(--encre);
  font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
}
.bouton:hover { background: var(--creux); }
.bouton:disabled { color: var(--encre-3); cursor: default; }

/* ---------------------------------------------------- Tableau */
.outils { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-bottom: 12px; }
.recherche { position: relative; flex: 1 1 320px; min-width: 200px; }
.recherche input {
  width: 100%; border: 1px solid var(--filet-fort); border-radius: 4px;
  background: var(--surface); color: var(--encre); font: inherit; font-size: 14px;
  padding: 9px 12px 9px 36px;
}
.recherche input::placeholder { color: var(--encre-3); }
.recherche input:hover { border-color: var(--encre-3); }
.recherche input:focus { outline: none; border-color: var(--encre); box-shadow: 0 0 0 3px var(--creux); }
.recherche svg { position: absolute; left: 12px; top: 50%; margin-top: -8px; color: var(--encre-3); }
.recherche input:focus + svg, .recherche input:not(:placeholder-shown) + svg { color: var(--encre); }

.lien-doux { border: none; background: none; padding: 3px 0; font: inherit; cursor: pointer; color: var(--encre-3); text-decoration: underline; text-underline-offset: 3px; }
.lien-doux:hover { color: var(--encre); }
.lien-doux[hidden] { display: none; }

.incomplets {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  font-size: 12.5px; color: var(--encre-3); padding-bottom: 12px;
}
.incomplets:empty { display: none; }
.incomplets > span:first-child { color: var(--encre-2); }
.puce-vide {
  border: none; background: none; font: inherit; cursor: pointer; padding: 1px 0;
  color: var(--encre-2); border-bottom: 1px dotted var(--filet-fort);
  display: inline-flex; align-items: baseline; gap: 6px;
}
.puce-vide:hover { color: var(--encre); border-bottom-color: var(--encre); }
.puce-vide[aria-pressed="true"] { color: var(--encre); font-weight: 500; border-bottom: 1px solid var(--encre); }
.puce-vide b { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 500; }

.cadre-tableau { position: relative; border: 1px solid var(--filet); background: var(--surface); }
.defile { overflow: auto; max-height: 68vh; }
.ombre-defile {
  position: absolute; top: 0; right: 0; bottom: 0; width: 46px; pointer-events: none;
  background: linear-gradient(to right, transparent, var(--surface)); opacity: 0; transition: opacity .15s;
}
.cadre-tableau[data-deborde="true"] .ombre-defile { opacity: 1; }

table.plans { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.plans thead th { background: var(--surface); text-align: left; }
table.plans thead .groupes th {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--encre-3);
  font-weight: 500; padding: 9px 14px 5px; white-space: nowrap;
  position: sticky; top: 0; z-index: 4; border-bottom: 1px solid var(--filet);
}
table.plans thead .titres th, table.plans thead .titres-la th {
  font-weight: 500; font-size: 12.5px; color: var(--encre-2); padding: 6px 14px 7px;
  white-space: nowrap; border-bottom: 1px solid var(--filet-fort); position: sticky; z-index: 4;
}
/* Le tableau de la seconde base : mêmes en-têtes, mais sous d'autres noms de
   classe, pour que ce qui vise le tableau d'ici ne l'atteigne pas. Sa
   première colonne, la référence, reste collée à gauche. */
table.plans thead .titres-la th { top: 0; }
table.plans thead .titres-la th button {
  border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
table.plans thead .titres-la th button:hover { color: var(--encre); }
.col-fige-la { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: inset -1px 0 0 var(--filet-fort); }
table.plans tbody tr:hover .col-fige-la { background: var(--creux); }
table.plans thead tr th.col-fige-la { z-index: 6; }
table.plans thead .filtres th { padding: 0 14px 7px; position: sticky; z-index: 4; border-bottom: 1px solid var(--filet); }
table.plans thead .filtres input {
  width: 100%; min-width: 78px; border: none; border-bottom: 1px solid var(--filet);
  background: none; color: var(--encre); font: inherit; font-size: 12px; padding: 2px 0;
}
table.plans thead .filtres input::placeholder { color: var(--filet-fort); }
table.plans thead .filtres input:focus { outline: none; border-bottom-color: var(--focus); }
table.plans thead .filtres input[data-actif="true"] { border-bottom-color: var(--encre); color: var(--encre); }

table.plans thead .titres th.glisse { opacity: .4; }
table.plans thead .titres th.cible { box-shadow: inset 2px 0 0 var(--fait); }
table.plans thead .titres th button {
  border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
table.plans thead .titres th button:hover { color: var(--encre); }
.poignee { color: var(--filet-fort); cursor: grab; margin-right: 6px; opacity: 0; transition: opacity .12s; }
table.plans thead .titres:hover .poignee, table.plans thead .titres:focus-within .poignee { opacity: 1; }
.fleche { color: var(--encre); }

table.plans tbody td { padding: 8px 14px; border-bottom: 1px solid var(--filet); vertical-align: middle; white-space: nowrap; }
table.plans tbody tr:hover td { background: var(--creux); }

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  function ech(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /* Minuscules, sans accents, sans espaces superflus — la même réduction que
     normaliser() côté serveur (Code.gs), espaces internes comprises : un
     « Non commencé » collé depuis Excel avec une espace insécable doit se
     classer pareil des deux côtés. L'accentuation ne s'enlève que si le
     navigateur sait le faire : String.prototype.normalize est postérieur à
     ES5, et sans lui la page doit s'afficher quand même. */
  function norm(v) {
    var s = String(v == null ? '' : v).toLowerCase();
    if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return s.replace(/\s+/g, ' ').trim();
  }
  function nb(n) { return n.toLocaleString('fr-FR'); }
  /* Exposée pour la batterie : la même réduction que le serveur, vérifiable
     cas par cas (espace insécable, accents, espaces multiples). */
  window.__norm = norm;
  /* « 7 » → « 07 » : String.prototype.padStart n'existe pas en ES5. */
  function deuxChiffres(n) { return (n < 10 ? '0' : '') + n; }

  /* ============================================================
     SEMAINES ISO
     ============================================================ */
  function lundiDeLaSemaine(annee, semaine) {
    var jan4 = new Date(Date.UTC(annee, 0, 4));
    var jour = jan4.getUTCDay() || 7;
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jour + 1 + (semaine - 1) * 7);
    return lundi;
  }
  function etiquetteISO(d) {
    var t = new Date(d.getTime());
    var jour = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - jour);
    var debut = Date.UTC(t.getUTCFullYear(), 0, 1);
    var s = Math.ceil(((t.getTime() - debut) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-S' + (s < 10 ? '0' : '') + s;
  }
  /** « 2026-S34 » -> le lundi de cette semaine. null si le libellé est illisible. */
  function lundiDeLibelle(libelle) {
    var m = /^\s*(\d{4})\s*-?\s*[sS]\s*(\d{1,2})\s*$/.exec(String(libelle || ''));
    if (!m) return null;
    var s = parseInt(m[2], 10);
    if (s < 1 || s > 53) return null;
    return lundiDeLaSemaine(parseInt(m[1], 10), s);
  }

  /* ============================================================
     LES QUATRE ETATS
     << A faire >> est une valeur saisie ; << vide >> est une cellule
     non renseignee. Les confondre masquerait un defaut de saisie.
     ============================================================ */
  /* « libelle » compte des plans (« 63 Terminés »), « court » qualifie un plan
     (« À faire → Terminé ») : le pluriel n'a pas sa place dans le second. */
  var ETATS = [
    { cle: 'termine', libelle: 'Terminés',   court: 'Terminé',   couleur: 'var(--fait)',   teinte: 'var(--fait)' },
    { cle: 'encours', libelle: 'En cours',   court: 'En cours',  couleur: 'var(--cours)',  teinte: 'var(--cours)' },
    { cle: 'afaire',  libelle: 'À faire',    court: 'À faire',   couleur: 'var(--afaire)', teinte: 'var(--afaire)' },
    { cle: 'vide',    libelle: 'Non renseignés', court: 'Non renseigné', couleur: 'transparent', teinte: 'var(--filet-fort)', hachure: true }
  ];
  /* Les deux fonds soutenus portent du blanc, l'ambre garde l'encre du texte :
     c'est le couple valide par le controle de contraste. */
  function encreSegment(cle) {
    if (cle === 'termine' || cle === 'afaire') return 'var(--sur-plein)';
    return cle === 'encours' ? 'var(--sur-ambre)' : 'var(--encre)';
  }
  var ETAT_PAR_CLE = {};
  ETATS.forEach(function (e) { ETAT_PAR_CLE[e.cle] = e; });

  /* ⚠ Le COUPLE norm() + classer() existe à l'identique côté serveur
     (normaliser() + classerFWD() dans Code.gs) : le serveur s'en sert pour
     archiver les relevés, le client pour les compteurs filtrés. Toute
     modification de l'un OU de l'autre doit être reportée des deux côtés,
     sinon le dernier point de la courbe ne vaut plus la barre du jour. */
  function classer(valeur) {
    var s = norm(valeur);
    if (s === '' || s === '-') return 'vide';
    if (s.indexOf('a faire') !== -1 || s === 'non commence') return 'afaire';
    var n = parseFloat(s.replace(/[\s%]/g, '').replace(',', '.'));
    if (!isNaN(n)) {
      if (n >= 100) return 'termine';
      if (n <= 0) return 'afaire';
      return 'encours';
    }
    if (/(termine|acheve|cloture|solde|fini|ok)/.test(s)) return 'termine';
    return 'encours';
  }
  function pourcentDe(p) {
    var c = classer(p.avancement);
    if (c === 'termine') return 100;
    if (c === 'vide' || c === 'afaire') return 0;
    var n = parseFloat(norm(p.avancement).replace(/[\s%]/g, '').replace(',', '.'));
    return isNaN(n) ? 50 : n;
  }

  /* ============================================================
     REFERENCES UD
     Une référence s'écrit RACINE + INDICE + REVISION : HEL0225A017 001 A.
     La racine (3 lettres, 4 chiffres, A, 3 chiffres) est l'identité du plan ;
     la solution (3 chiffres) et l'indice (une lettre) bougent quand le plan
     est réémis. Deux relevés successifs ne portent alors plus la même chaîne
     pour le même plan : comparer les chaînes telles quelles ferait de chaque
     réémission un « disparu » plus un « nouveau ».
     ============================================================ */
  var FORME_UD = /^([A-Z]{3})(\d{4})A(\d{3})(\d{3})([A-Z])$/;
  /** Tolérant aux séparateurs (-, _, espace, point, /) et à la casse. Une
      référence hors format garde sa forme entière — épurée — comme racine. */
  function analyserUD(ref) {
    var brut = String(ref == null ? '' : ref).trim().toUpperCase();
    var m = FORME_UD.exec(brut.replace(/[-_\s.\/]+/g, ''));
    if (!m) return { racine: brut, solution: '', indice: '', valide: false };
    return { racine: m[1] + m[2] + 'A' + m[3], solution: m[4], indice: m[5], valide: true };
  }
  /* Le rang d'une émission : sert à choisir, entre deux candidates de même
     racine, la plus proche de celle qui a disparu. */
  function rangUD(ud) { return Number(ud.solution) * 26 + (ud.indice.charCodeAt(0) - 65); }
  /* Une réémission : un changement d'indice (la lettre), le plan restant le même. */
  function estReemission(e) { return e.type === 'indice'; }
  /* L'identité d'un plan : sa racine ET sa solution. Une autre solution,
     c'est un autre plan — seul l'indice bouge sans changer de plan. */
  function clePlan(ud) { return ud.racine + ud.solution; }
  /* Exposée pour la batterie : une fonction pure se vérifie cas par cas. */
  window.__analyserUD = analyserUD;

  /* Compare deux cartes plan par plan { ref: avancement } et rend les
     événements : 'change' (même référence, autre état), 'nouveau', 'disparu'
     et 'indice'. Les références qui ne se retrouvent pas telles quelles sont
     appariées par racine + solution : un plan parti d'un côté et revenu de
     l'autre sous une autre lettre est le même plan réémis — un changement
     d'indice. Une autre solution est un autre plan : rien à apparier. Quand
     plusieurs candidates se présentent, la plus proche l'emporte ; les
     autres restent nouvelles ou disparues. Une référence hors format n'a pas
     de racine au sens propre : elle n'est jamais appariée. */
  function apparier(avant, apres) {
    var a = Object.prototype.hasOwnProperty;
    var evenements = [], partis = {}, venus = {};
    Object.keys(apres).forEach(function (ref) {
      if (a.call(avant, ref)) {
        var ea = classer(avant[ref]), eb = classer(apres[ref]);
        if (ea !== eb) evenements.push({ ref: ref, type: 'change', avant: ea, apres: eb });
        return;
      }
      var ud = analyserUD(ref);
      if (ud.valide) (venus[clePlan(ud)] = venus[clePlan(ud)] || []).push({ ref: ref, rang: rangUD(ud), ud: ud });
      else evenements.push({ ref: ref, type: 'nouveau', apres: classer(apres[ref]) });
    });
    Object.keys(avant).forEach(function (ref) {
      if (a.call(apres, ref)) return;
      var ud = analyserUD(ref);
      if (ud.valide) (partis[clePlan(ud)] = partis[clePlan(ud)] || []).push({ ref: ref, rang: rangUD(ud), ud: ud });
      else evenements.push({ ref: ref, type: 'disparu', avant: classer(avant[ref]) });
    });
    Object.keys(venus).forEach(function (racine) {
      var paires = [];
      (partis[racine] || []).forEach(function (p) {
        venus[racine].forEach(function (v) { paires.push({ p: p, v: v, d: Math.abs(v.rang - p.rang) }); });
      });
      paires.sort(function (x, y) { return (x.d - y.d) || (x.p.rang - y.p.rang) || (x.v.rang - y.v.rang); });
      paires.forEach(function (pr) {
        if (pr.p.pris || pr.v.pris) return;
        pr.p.pris = pr.v.pris = true;
        evenements.push({ ref: pr.v.ref, type: 'indice', ancienne: pr.p.ref,
                          avant: classer(avant[pr.p.ref]), apres: classer(apres[pr.v.ref]) });
      });
      venus[racine].forEach(function (v) {
        if (!v.pris) evenements.push({ ref: v.ref, type: 'nouveau', apres: classer(apres[v.ref]) });
      });
    });
    Object.keys(partis).forEach(function (racine) {
      partis[racine].forEach(function (p) {
        if (!p.pris) evenements.push({ ref: p.ref, type: 'disparu', avant: classer(avant[p.ref]) });
      });
    });
    return evenements;
  }

  /* ============================================================
     ANCIENNETE
     Dimension derivee de la colonne de date : un plan cree il y a longtemps
     et toujours pas termine est celui sur lequel il faut se pencher.
     ============================================================ */
  var MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                    'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  /* Une date de création brute ferait autant de groupes que de jours : on
     regroupe au mois, ce qui se lit et se compare. */
  /* Une date arrive telle que le classeur l'affiche : « 16/07/2020 » sur une
     feuille française, « 2020-07-16 » (avec ou sans heure) ailleurs. Ne lire
     qu'un seul des deux ordres reviendrait à ne jamais trouver l'ancienneté
     sur la moitié des exports — sans que rien ne le signale. */
  function anneeEtMois(valeur) {
    var t = String(valeur == null ? '' : valeur).trim();
    var iso = /^(\d{4})[-\/.](\d{1,2})/.exec(t);
    if (iso) {
      var mi = Number(iso[2]);
      return mi >= 1 && mi <= 12 ? { annee: Number(iso[1]), mois: mi } : null;
    }
    var fr = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(t);
    if (!fr) return null;
    var an = Number(fr[3]);
    if (an < 100) an += an < 70 ? 2000 : 1900;
    /* Jour puis mois, comme en France — sauf si le premier nombre dépasse
       douze : il est alors forcément le jour, et l'autre le mois. */
    var a = Number(fr[1]), b = Number(fr[2]);
    var mois = a > 12 ? b : (b > 12 ? a : b);
    return mois >= 1 && mois <= 12 ? { annee: an, mois: mois } : null;
  }

     `null` quand la cellule ne porte pas de date lisible. */

    return (reference.getUTCFullYear() - v.annee) * 12 +

  function rangMois(nom) {
    if (nom === '\u2014') return -1;
    var bout = nom.split(' ');

      /* Les blocs par variante : quelques-uns renseignés, le reste à blanc,
         comme dans l'export. */
      colonnes.forEach(function (c) {
        if (c.groupe.indexOf('HDK AA') !== 0) return;
        if (alea() < 0.75) { p[c.cle] = '-'; return; }
        if (/^validite/.test(c.cle)) p[c.cle] = tire(['V', 'NV']);
        else if (/^quantite/.test(c.cle)) p[c.cle] = '1';
        else if (/^configuration/.test(c.cle)) p[c.cle] = tire(['EMPTY', '()']);
        else if (/^a_traiter_par/.test(c.cle)) p[c.cle] = tire(['MR', 'AB', 'CM']);
        else p[c.cle] = tire(['EMPTY', 'V']);
      });
      plans.push(p);
    }
    plans.forEach(function (x) { x._etat = classer(x.avancement); x._pct = pourcentDe(x); });

    var clesDim = ['ata', 'cc', 'ecp'];
    var refDate = lundiDeLaSemaine(2026, 38);
    function valeurDe(x, c) {
      if (c === '_anciennete') return ancienneteDepuis(x.date_creation, refDate);
      if (c === '_mois') return moisDe(x.date_creation);
      return x[c];
    }
    var clesAvecDerivees = clesDim.concat(['_anciennete', '_mois']);

    /* Plusieurs semaines d'historique, avec l'avancement plan par plan à
       chaque relevé : c'est ce qui fait vivre le journal et la bulle du
       graphique. La profondeur dépend du contrat. */
    var SEMAINES = fiche.semaines;

    /* Quelques plans ont été réémis au fil des semaines : leur référence a
       changé d'indice sans que le plan change d'identité. Six
       par contrat, à des semaines différentes ; deux d'entre eux changent
       aussi d'état à ce moment-là. Les cartes d'avant portent l'ancienne
       référence, celles d'après la nouvelle — c'est ce que le journal doit
       apparier au lieu d'y voir un disparu et un nouveau. */
    var reemissions = [];
    for (var q = 5; reemissions.length < 6 && q < plans.length; q += 53) {
      var pl = plans[q], ud = analyserUD(pl.reference), ancienne;
      if (ud.indice === 'A') { ud.indice = 'B'; pl.reference = ud.racine + ud.solution + 'B'; }
      ancienne = ud.racine + ud.solution + String.fromCharCode(ud.indice.charCodeAt(0) - 1);
      reemissions.push({ ref: pl.reference, ancienne: ancienne,
                         k: SEMAINES - reemissions.length, avecEtat: reemissions.length % 3 === 0 });
    }
    var ETAT_DAVANT = { 'Terminé': 'En cours', 'En cours': 'À faire', 'À faire': 'En cours', '': 'À faire' };

    var etatCourant = {};
    plans.forEach(function (x) { etatCourant[x.reference] = x.avancement; });
    var refs = plans.map(function (x) { return x.reference; });

    var instantanes = [];
    for (var k = SEMAINES; k >= 0; k--) {
      instantanes[k] = JSON.parse(JSON.stringify(etatCourant));
      if (k === 0) break;
      var recules = 0;
      for (var r = 0; r < refs.length && recules < 26; r++) {
        var ref = refs[(r * 17 + k * 29) % refs.length];
        var v = etatCourant[ref];
        if (v === 'Terminé') { etatCourant[ref] = 'En cours'; recules++; }
        else if (v === 'En cours' && alea() < 0.5) { etatCourant[ref] = 'À faire'; recules++; }
      }
      reemissions.forEach(function (re) {
        if (re.k !== k) return;
        /* Avant cette semaine, le plan portait l'ancienne référence — et,
           pour certains, n'était pas encore dans le même état. */
        var val = etatCourant[re.ref];
        delete etatCourant[re.ref];
        etatCourant[re.ancienne] = re.avecEtat ? ETAT_DAVANT[val] : val;
      });
      if (k === 1) { delete etatCourant[refs[3]]; delete etatCourant[refs[11]]; }
    }

    /* Une ancienne référence retrouve son plan par la racine : ses comptes
       par dimension ne doivent pas manquer dans les relevés d'avant. */
    var parRef = {}, parRacine = {};
    plans.forEach(function (x) { parRef[x.reference] = x; parRacine[clePlan(analyserUD(x.reference))] = x; });
    var releves = [];
    for (var s = 0; s <= SEMAINES; s++) {
      var carte = instantanes[s];
      var etats = { termine: 0, encours: 0, afaire: 0, vide: 0 };
      var groupes = {};
      clesAvecDerivees.forEach(function (d) { groupes[d] = {}; });
      Object.keys(carte).forEach(function (ref) {
        var etat = classer(carte[ref]);
        etats[etat]++;
        var plan = parRef[ref] || parRacine[clePlan(analyserUD(ref))];
        if (!plan) return;
        clesAvecDerivees.forEach(function (d) {
          var v = String(valeurDe(plan, d) || '—');
          if (!groupes[d][v]) groupes[d][v] = { total: 0, termine: 0 };
          groupes[d][v].total++;
          if (etat === 'termine') groupes[d][v].termine++;
        });
      });
      releves.push({
        semaine: etiquetteISO(dateDeBase(lundiDeLaSemaine(2026, 38 - SEMAINES), s)),
        total: Object.keys(carte).length,
        termine: etats.termine, encours: etats.encours, afaire: etats.afaire, vide: etats.vide,
        groupes: groupes,
        plans: carte
      });
    }

    return {
      colonnes: colonnes,
      cleDate: 'date_creation',
      cleDomaine: 'domaine',
      clesDim: clesDim,
      clesEssentielles: ['reference', 'nom_installation', 'ecp', 'ata', 'sequence',
                         'validation_definition_electrique', 'date_creation', 'avancement'],
      dimParDefaut: 'ata',
      plans: plans,
      releves: releves,
      /* Quatre jalons par contrat, relatifs à la semaine courante du contrat
         (le dernier relevé). DATES PROVISOIRES, tirées au hasard : à remplacer
         par les vraies échéances du programme quand elles seront connues. */
      jalons: [
        { semaine: etiquetteISO(dateDeBase(lundiDeLaSemaine(2026, 38 - SEMAINES), SEMAINES + 6)),  texte: 'Gel de la définition' },
        { semaine: etiquetteISO(dateDeBase(lundiDeLaSemaine(2026, 38 - SEMAINES), SEMAINES + 14)), texte: 'Revue critique' },
        { semaine: etiquetteISO(dateDeBase(lundiDeLaSemaine(2026, 38 - SEMAINES), SEMAINES + 26)), texte: 'Livraison plateau' },
        { semaine: etiquetteISO(dateDeBase(lundiDeLaSemaine(2026, 38 - SEMAINES), SEMAINES + 40)), texte: 'Premier vol' }
      ],
      /* La liste des contrats et celui-ci : c'est ce que le sélecteur affiche. */
      contrats: CONTRATS_EXEMPLE.map(function (c) { return { id: c.id, nom: c.nom }; }),
      contrat: fiche.id,
      /* La seconde base, fabriquée à partir des plans de CE contrat, une fois
         leurs références définitives (après les réémissions). */
      rapprochement: rapprochementDExemple(plans),
      info: { feuille: 'Démonstration ' + fiche.nom, message: '' }

  function dateDeBase(base, i) {

  }

  /* La seconde base, en attendant la vraie : « SEE », l'extract Excel de

     données dessous. Ses colonnes sont celles de l'extract, dans son ordre.
     La référence UD s'y lit sur trois colonnes : NAME (la racine), SOL. (la
     solution, trois chiffres) et Cust.V (l'indice, une lettre). Elle est
     construite à partir des plans du contrat avec des écarts DÉLIBÉRÉS et
     déterministes — les mêmes à chaque ouverture, pour que la section ait
     toujours quelque chose à montrer et que la batterie sache quoi attendre :
       · 5 plans absents de SEE ;
       · 5 références présentes dans SEE mais pas ici (racines inédites) ;
       · 10 plans dont un champ diffère (Validated, REDRAW, installation,
         produit, à tour de rôle) ;
       · 2 plans que SEE connaît sous un autre indice.
     Les rangs sont tous inférieurs au plus petit contrat (275 plans) : les
     trois contrats portent le même jeu d'écarts, seuls leurs plans changent.
     Les cases à cocher de l'extract s'y lisent TRUE / FALSE, comme dans un

     plan terminé ici doit être validé là, et réciproquement. */
  var ECARTS_EXEMPLE = {
    absentsLa: [7, 61, 143, 199, 250],
    indice: [50, 120],
    champs: [3, 30, 77, 110, 150, 180, 210, 230, 255, 265]

  var COLONNES_SEE = ['NAME', 'SOL.', 'Cust.V', 'Int. V', 'ARCHIVE FILE PREFIX', 'VALIDITY PSN FULL',
    'User Status', 'DIAGRAM TYPE', 'PRODUCT FAMILY', 'Validated', 'FG1 TAGDESCRIPTION', 'FG2 TAGDESCRIPTION',
    'SCHEMA NUMBER', 'Released Date', 'Obsolete Date', 'Validated Date', 'REDRAW', 'ARCHIVED', 'CGM', 'XPEMPTY'];
  var ESSENTIELLES_SEE = ['NAME', 'SOL.', 'Cust.V', 'VALIDITY PSN FULL', 'DIAGRAM TYPE', 'PRODUCT FAMILY',
    'Validated', 'Released Date', 'REDRAW'];
  var CHAMPS_RAPPROCHEMENT_EXEMPLE = [
    { ici: 'avancement',       la: 'Validated',          titre: 'Avancement / Validated' },
    { ici: 'redraw',           la: 'REDRAW',             titre: 'Redraw' },
    { ici: 'nom_installation', la: 'FG1 TAGDESCRIPTION', titre: 'Installation' },
    { ici: 'produit',          la: 'PRODUCT FAMILY',     titre: 'Produit' }
  ];
  var AVIONS_SEE = ['2851', '2860', '2874', '2902', '2915'];
  function rapprochementDExemple(plans) {
    var absents = {}, autreEmission = {}, autreChamp = {};
    ECARTS_EXEMPLE.absentsLa.forEach(function (i) { absents[i] = true; });
    ECARTS_EXEMPLE.indice.forEach(function (i, k) { autreEmission[i] = k; });
    ECARTS_EXEMPLE.champs.forEach(function (i, k) { autreChamp[i] = k; });

      var termine = !!p && classer(p.avancement) === 'termine';
      var l = {};
      l['NAME'] = racine;
      l['SOL.'] = solution;
      l['Cust.V'] = indice;
      l['Int. V'] = String(1 + (i % 3));
      l['ARCHIVE FILE PREFIX'] = 'WD_' + racine + '_' + solution + indice;
      l['VALIDITY PSN FULL'] = AVIONS_SEE[i % AVIONS_SEE.length];
      l['User Status'] = termine ? 'Released' : 'In Work';
      l['DIAGRAM TYPE'] = ['WD', 'HD', 'SD'][i % 3];
      l['PRODUCT FAMILY'] = p ? p.produit : 'SUPER PUMA';
      l['Validated'] = termine ? 'TRUE' : 'FALSE';
      l['FG1 TAGDESCRIPTION'] = p ? p.nom_installation : 'Harnais alimentation cabine';
      l['FG2 TAGDESCRIPTION'] = i % 4 === 0 && p ? 'Zone ' + p.chapitre + p.sous_chapitre : '';
      l['SCHEMA NUMBER'] = p ? p.cc : '32499';
      l['Released Date'] = p ? p.date_creation : '2026-01-15';
      l['Obsolete Date'] = '';
      l['Validated Date'] = termine ? '2026-0' + (1 + i % 9) + '-1' + (i % 9) : '';
      l['REDRAW'] = p && p.redraw === 'true' ? 'TRUE' : 'FALSE';
      l['ARCHIVED'] = 'FALSE';
      l['CGM'] = termine ? 'TRUE' : 'FALSE';
      l['XPEMPTY'] = 'FALSE';

    }

      if (absents[i]) return;

      var solution = ud.solution, indice = ud.indice;
      if (autreEmission[i] !== undefined) indice = String.fromCharCode(ud.indice.charCodeAt(0) + 1);
      var l = ligneSEE(ud.racine, solution, indice, i, p);
      if (autreChamp[i] !== undefined) {
        switch (autreChamp[i] % 4) {
          case 0: l['Validated'] = l['Validated'] === 'TRUE' ? 'FALSE' : 'TRUE'; break;
          case 1: l['REDRAW'] = l['REDRAW'] === 'TRUE' ? 'FALSE' : 'TRUE'; break;
          case 2: l['FG1 TAGDESCRIPTION'] = 'Cheminement plafond arrière'; break;
          default: l['PRODUCT FAMILY'] = p.produit === 'MK2' ? 'MK3' : 'MK2';
        }
      }
      lignes.push(l);
    });
    for (var k = 0; k < 5; k++) {
      lignes.push(ligneSEE('NEW' + (5100 + k) + 'A' + ('00' + k).slice(-3), '001', 'A', k, null));
    }
    return {
      nom: 'SEE',
      titre: 'Nommage WD BFLOW',
      cleReference: ['NAME', 'SOL.', 'Cust.V'],
      champs: CHAMPS_RAPPROCHEMENT_EXEMPLE,
      colonnes: COLONNES_SEE,
      essentielles: ESSENTIELLES_SEE,
      lignes: lignes

  }

  /* ============================================================
     SOURCE DES DONNEES
     Une « source » est un paquet { colonnes, plans, releves, jalons,
     contrats… } : le jeu d'exemple quand la page tourne seule, le paquet du
     classeur dans l'add-on. Tout l'état qui en découle se recalcule d'un
     bloc dans chargerSource() — le même chemin sert au premier affichage,
     au passage en mode « Exemple » et au changement de contrat, donc les
     trois offrent exactement les mêmes fonctions. Les écouteurs, eux, sont
     posés une seule fois sur les éléments fixes de la page.
     ============================================================ */
  /* Un classeur derrière la page, ou non : c'est la présence du paquet qui
     le dit, pas son contenu. Un paquet que le classeur n'a pas pu remplir
     reste un paquet du classeur — la page l'affiche vide et dit pourquoi,
     elle ne lui substitue pas la démonstration (voir sourceDuClasseur). */
  var SERVEUR = window.SUIVI_FWD_DONNEES !== undefined && window.SUIVI_FWD_DONNEES !== null;
  /* Pont facultatif vers le classeur : présent seulement dans l'add-on. */
  var API = window.SUIVI_FWD_API || null;

  /* L'état dérivé de la source courante. Déclaré ici, rempli par chargerSource(). */
  var SRC = null;                  // la source affichée : réelle, ou son exemple
  var SRC_REELLE = null;           // la dernière source réelle chargée
  var COLONNES, PAR_CLE, CLE_DATE, PLANS, RELEVES_SRC, BASE, AUJ;
  var CLES_DIM, CLE_DOMAINE, CLES_ESSENTIELLES, VAUT_ESSENTIELLES, CLE_LIBELLE;
  var RELEVES, DERNIER, EVENEMENTS_IMPORT, COMPARATIF, RAPPROCHEMENT, jalons;
  var DIMENSIONS, TITRE_DIM, ORDRE_FEUILLE, PLAN_PAR_REF, PLAN_PAR_RACINE, JOURNAL;
  var RELEVES_REELS, AUJ_REEL, BASE_REELLE;
  var CONTRATS, CONTRAT;
  var vue = null;

  /* La source qu'un paquet du classeur donne à la page. Complet, il passe
     tel quel. Sinon — feuille vide, contrat introuvable, erreur du script —
     une source vide qui garde ce que le paquet sait encore dire (contrats,
     jalons) et porte son message : la page s'ouvre sans plan et l'explique,
     au lieu de montrer 640 plans fictifs sous « Données réelles ». */
  function sourceDuClasseur(paquet) {
    if (paquet && paquet.ok !== false && Array.isArray(paquet.plans) && paquet.plans.length) return paquet;
    var p = paquet || {};
    return {
      colonnes: [], plans: [], releves: [],
      jalons: Array.isArray(p.jalons) ? p.jalons : [],
      contrats: Array.isArray(p.contrats) ? p.contrats : [],
      contrat: p.contrat || '',
      message: String(p.message || '') || 'Le classeur n’a renvoyé aucun plan.',
      vide: true
    };
  }

  /* Le repère temporel : la semaine du premier relevé archivé. Tout l'axe du
     graphique est un décalage en semaines par rapport à ce lundi-là. */
  function dateDe(i) { return dateDeBase(BASE, i); }
  function etiquette(i) { return etiquetteISO(dateDe(i)); }
  function indexDe(semaine) {
    var l = lundiDeLibelle(semaine);
    return l === null ? null : Math.round((l.getTime() - BASE.getTime()) / 604800000);
  }

  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
              'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function afficherSemaine() {
    var lundi = dateDe(AUJ);
    var dimanche = new Date(lundi.getTime()); dimanche.setUTCDate(lundi.getUTCDate() + 6);
    var m1 = MOIS[lundi.getUTCMonth()], m2 = MOIS[dimanche.getUTCMonth()];
    $('dates-semaine').textContent = m1 === m2
      ? 'du ' + lundi.getUTCDate() + ' au ' + dimanche.getUTCDate() + ' ' + m2 + ' ' + dimanche.getUTCFullYear()
      : 'du ' + lundi.getUTCDate() + ' ' + m1 + ' au ' + dimanche.getUTCDate() + ' ' + m2 + ' ' + dimanche.getUTCFullYear();

  }

  function valeurDim(p, cle) {

  }

  /* Plusieurs colonnes de l'export sont des booléens écrits « true » / « false ».

  }

  /* Les jalons d'une source, en indices de semaine. Ils sont fixes : ils

      .sort(function (a, b) { return a.i - b.i; });
  }

  /* Une colonne « Colonne N » — le nom que le serveur donne à une colonne sans

     l'extract que le tableau ne montre pas. */

  function colonneVideSansIntitule(col, plans) {

  }

  /**
   * Dérive tout l'état de la page d'une source. Rejouable : la source
   * initiale, l'exemple fabriqué et chaque contrat passent par ici.
   * Ne dessine rien : l'appelant enchaîne remplirDims() puis rendre().
   */
  function chargerSource(src) {
    SRC = src;
    if (!src.exemple) SRC_REELLE = src;

    PLANS = src.plans;
    /* Le tableau est l'extract, à une exception près, décidée par l'utilisateur :
       une colonne que le serveur a dû nommer lui-même (« Colonne 1 », faute
       d'intitulé) et qui ne porte AUCUNE valeur n'apporte rien à personne — elle
       est retirée. Une colonne sans intitulé mais renseignée reste. La règle
       vaut pour la démonstration comme pour le classeur : les deux montrent
       la même chose. */

      p._racine = clePlan(analyserUD(p.reference));   // racine + solution : l'identité du plan
    });

    RELEVES_SRC = (src.releves || []).filter(function (r) { return r && lundiDeLibelle(r.semaine); });

    CLES_DIM = (src.clesDim && src.clesDim.length
        ? src.clesDim.filter(function (c) { return PAR_CLE[c]; })
        : COLONNES.filter(function (c) { return c.dim; }).map(function (c) { return c.cle; }))
      .concat(CLE_DATE ? ['_mois'] : []);

    CLE_DOMAINE = (src.cleDomaine && PAR_CLE[src.cleDomaine]) ? src.cleDomaine : null;
    CLES_ESSENTIELLES = (src.clesEssentielles || []).filter(function (c) { return PAR_CLE[c]; });
    preparerSeconde(src.rapprochement);
    /* Sur un export de dix colonnes, une « vue essentielle » n'apporte rien :
       le choix ne vaut que s'il y a vraiment deux vues distinctes. */
    VAUT_ESSENTIELLES = CLES_ESSENTIELLES.length >= 2 &&
                        CLES_ESSENTIELLES.length < COLONNES.length - 3;
    /* Le libellé d'un plan : la première colonne de texte long, pour que le
       journal dise autre chose qu'une référence. */
    CLE_LIBELLE = null;
    for (var i = 0; i < COLONNES.length; i++) {
      if (!COLONNES[i].fige && /large/.test(COLONNES[i].classe || '')) { CLE_LIBELLE = COLONNES[i].cle; break; }
    }

    /* HISTORIQUE
       L'export ne contient que l'état du jour : on ne sait pas quand un plan
       est passé à 100 %. L'historique ne peut donc pas être reconstitué —
       il s'accumule, un relevé par semaine. Le dernier est recalculé à partir
       de la feuille pour que la page colle toujours à ce qu'on y lit. */
    RELEVES = RELEVES_SRC.map(function (r) {
      return {
        i: indexDe(r.semaine),
        total: r.total, termine: r.termine, encours: r.encours, afaire: r.afaire, vide: r.vide,
        groupes: r.groupes || {}, plans: r.plans || null
      };
    });
    var vivant = releveDepuis(PLANS, AUJ, CLES_DIM, valeurDim, true);
    var dernier = RELEVES[RELEVES.length - 1];
    // Le dernier relevé archivé garde son état plan par plan : c'est lui qui
    // sert de point de comparaison si la feuille a bougé depuis.
    if (dernier && dernier.i === AUJ) {
      if (RELEVES.length > 1 && !RELEVES[RELEVES.length - 2].plans) {
        RELEVES[RELEVES.length - 2].plans = dernier.plans;
      }
      RELEVES[RELEVES.length - 1] = vivant;
    } else {
      RELEVES.push(vivant);
    }
    /* Plusieurs imports dans la même semaine ne font qu'un point : le dernier
       de la semaine l'emporte. Sinon le graphique afficherait trois relevés
       serrés puis rien pendant quinze jours. */
    var parSemaine = {};
    RELEVES.forEach(function (r) { parSemaine[r.i] = r; });
    RELEVES = Object.keys(parSemaine)
      .map(function (k) { return parSemaine[k]; })
      .sort(function (a, b) { return a.i - b.i; });

    DERNIER = RELEVES[RELEVES.length - 1];
    $('import').textContent = 'Dernier import : semaine ' + etiquette(DERNIER.i).slice(5) + ' · ' +
      RELEVES.length + (RELEVES.length > 1 ? ' relevés archivés' : ' relevé archivé');
    /* « Jeu d'exemple » ne se lit que dans la démonstration : sur le classeur,
       ces chiffres sont ceux du tableur, et le pied ne doit pas dire le contraire. */
    $('avertissement-demo').hidden = SERVEUR;

    /* Ce qui a bougé entre les deux derniers imports, plan par plan. Le
       comparatif affiché en découle, restreint au périmètre courant. */
    EVENEMENTS_IMPORT = evenementsImport();

    /* Les jalons viennent uniquement de la source : la configuration du
       classeur dans l'add-on, des dates posées en dur dans la démonstration. */
    jalons = jalonsDe(src.jalons);

    DIMENSIONS = CLES_DIM
      .filter(function (c) { return c !== '_mois' && PAR_CLE[c]; })
      .map(function (c) { return PAR_CLE[c]; })
      .concat(CLE_DATE ? [{ cle: '_mois', titre: PAR_CLE[CLE_DATE].titre + ' (par mois)' }] : [])
      .sort(function (a, b) { return a.titre.localeCompare(b.titre, 'fr'); });
    TITRE_DIM = {};
    DIMENSIONS.forEach(function (d) { TITRE_DIM[d.cle] = d.titre; });

    ORDRE_FEUILLE = COLONNES.map(function (c) { return c.cle; });

    PLAN_PAR_REF = {};
    PLAN_PAR_RACINE = {};
    PLANS.forEach(function (p) { PLAN_PAR_REF[p.reference] = p; PLAN_PAR_RACINE[p._racine] = p; });
    MEMO_DERIVE = {};
    JOURNAL = construireJournal();

    /* Ce dont l'exemple a besoin pour se fabriquer : la vraie « aujourd'hui ». */
    if (!src.exemple) { RELEVES_REELS = RELEVES; AUJ_REEL = AUJ; BASE_REELLE = BASE; }

    CONTRATS = (Array.isArray(src.contrats) ? src.contrats : [])
      .filter(function (c) { return c && c.id !== undefined && c.id !== null && c.id !== ''; })
      .map(function (c) { return { id: String(c.id), nom: String(c.nom || c.id) }; });
    CONTRAT = (src.contrat !== undefined && src.contrat !== null && src.contrat !== '')
      ? String(src.contrat) : (CONTRATS.length ? CONTRATS[0].id : '');

    remettreVue();
    rendrePerimetre();
    COMPARATIF = comparatif();
    afficherContrat();
    refleterVue();
    $('bulle').dataset.visible = 'false';
  }

  /* La « vue » : ce que le lecteur a posé sur la page. Les filtres, la
     sélection, le périmètre et le cadrage appartiennent à une source et
     repartent de zéro avec elle — on ouvre toujours sur « Tout » ; la
     disposition — dimension, colonnes, tris, vue du tableau — est une
     préférence qui traverse les sources, tant que la nouvelle la permet. */
  /* Le cadrage d'ouverture : aujourd'hui dans le cadre avec treize semaines
     de recul, et tous les jalons configurés dans le champ — c'est là qu'on
     regarde. Il est rejoué à chaque source ; un cadrage mémorisé ne le
     remplace que s'il montre encore aujourd'hui (voir chargerPrefs). Sans
     cela, passé quelques mois d'archivage, la page s'ouvrirait sur le passé
     seul. bornerFenetre() ramène le tout sous le plafond de l'axe. */
  function cadrageParDefaut() {
    var debut = Math.max(0, AUJ - 13);
    var dernierJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    return { debut: debut, span: Math.max(28, dernierJalon - debut + 3) };
  }

  function remettreVue() {
    var avant = vue;
    vue = {
      recherche: '', etat: '', filtres: {},
      groupe: null, refs: null, refsLibelle: '',
      vides: {}, perimetre: '',
      journal: '', journalOuverts: {}, groupesTout: false,
      aideFin: false,
      /* Le rapprochement : le lot « seulement là » posé sur le tableau de
         là, et le détail des écarts, déplié ou non. Rien n'est mémorisé. */
      lotLa: null, rappDetail: false,
      /* Le tableau de la seconde base : sa recherche, ses deux vues, son tri.
         Le tri vide, c'est l'ordre de l'extract. */
      seconde: { recherche: '', vueTable: 'toutes', tri: { cle: null, asc: true } },
      /* La base montrée dans le tableau : ici (GATES) ou là (la seconde). */
      base: 'ici',
      exemple: !!SRC.exemple,
      fen: cadrageParDefaut(),
      /* L'ordre de la feuille, sans exception : tout le monde doit voir le même
         tableau que l'export. Le verrouillage à gauche s'adapte à cet ordre
         plutôt que l'inverse. Et le tableau s'ouvre complet : c'est l'extract.
         La vue essentielle est là pour l'autre besoin. */
      ordre: ORDRE_FEUILLE.slice(),
      /* Les colonnes cachées : la mécanique interne de la vue essentielle,
         jamais une préférence. */
      cachees: {},
      tri: { cle: 'reference', asc: true },
      dimCritique: (SRC.dimParDefaut && CLES_DIM.indexOf(SRC.dimParDefaut) !== -1) ? SRC.dimParDefaut : (CLES_DIM[0] || ''),
      triGroupe: { cle: null, asc: false },
      /* Le filtre de la colonne de gauche du bloc : un texte cherché dans le
         nom des groupes. Ni mémorisé, ni conservé d'une dimension à l'autre. */
      filtreGroupe: '',
      /* Deux vues du tableau, et rien entre les deux : « toutes » montre l'export
         tel quel, dans son ordre ; « essentielle » ne garde que ce qu'on regarde. */
      vueTable: 'toutes'
    };
    if (!avant) return;
    appliquerDisposition(avant);
    vue.vueTable = avant.vueTable === 'essentielle' ? 'essentielle' : 'toutes';
    if (vue.vueTable === 'essentielle') appliquerVueTable();
    if (avant.seconde && avant.seconde.vueTable === 'essentielle') vue.seconde.vueTable = 'essentielle';
  }

  /* Les commandes fixes de la page reflètent la vue : le champ de recherche,
     les interrupteurs du journal, du tableau et du mode. */
  function refleterVue() {
    $('recherche').value = vue.recherche;
    $('filtre-groupe').value = vue.filtreGroupe;
    document.querySelectorAll('#filtre-journal button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.journal === vue.journal));
    });
    document.querySelectorAll('#vue-tableau button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.vueTable));
    });
    $('recherche-seconde').value = vue.seconde.recherche;
    document.querySelectorAll('#vue-seconde button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.seconde.vueTable));
    });
    afficherMode();
  }

  /* Le bandeau du haut dit dans quel mode on est. La phrase dit exactement ce
     qui est fabriqué : l'historique, pas les plans. Une phrase qui exagère se
     fait prendre en défaut et on ne croit plus rien. */
  function afficherMode() {
    var actif = !!vue.exemple;
    document.body.dataset.exemple = String(actif);
    document.querySelectorAll('#mode-donnees button').forEach(function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.mode === 'exemple') === actif));
    });
    $('mot-mode').innerHTML = actif
      ? '<b>Historique fabriqué</b> — un aperçu de ce que la page montrera quand les relevés se seront accumulés.'
      : '';
    /* Hors exemple, ce que le classeur a à dire — feuille vide, colonne
       d'avancement absente — s'affiche à côté, en alerte. */
    var message = !actif && SRC && SRC.message ? String(SRC.message) : '';
    $('alerte-source').hidden = !message;
    $('alerte-source').textContent = message;
  }

  /* Le sélecteur de contrat et le rappel du contrat courant sous le titre.
     Avec un seul contrat, ni l'un ni l'autre n'a quelque chose à dire. */
  function afficherContrat() {
    var plusieurs = CONTRATS.length > 1;
    var courant = CONTRATS.filter(function (c) { return c.id === CONTRAT; })[0];
    var sel = $('select-contrat');
    $('choix-contrat').hidden = !plusieurs;
