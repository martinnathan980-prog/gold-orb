      var deux = parts.length > 1 ? ['fin ' + parts[0], parts[1]] : motLong;
      candFin = [
        { lignes: motLong, x: xP, base: yP + 18, ancre: 'middle' },
        { lignes: motLong, x: xP + 7, base: yP + 18, ancre: 'start' },
        { lignes: motLong, x: xP - 7, base: yP + 18, ancre: 'end' },
        { lignes: deux, x: xP + 7, base: yP + 18, ancre: 'start', malus: 1 },
        { lignes: deux, x: xP - 7, base: yP + 18, ancre: 'end', malus: 1 },
        { lignes: court, x: xP + 7, base: yP + 18, ancre: 'start', malus: 3 },
        { lignes: court, x: xP - 7, base: yP + 18, ancre: 'end', malus: 3 },
        { lignes: court, x: xP, base: yP + 18, ancre: 'middle', malus: 3 },
        /* Une ligne plus bas, en dernier recours : sur un cadre serré (un an
           au téléphone), le jalon, « manque N » et la fin tiennent dans
           quelques pixels, et la rangée du haut n'a plus de place libre. */
        { lignes: court, x: xP - 7, base: yP + 31, ancre: 'end', malus: 6 },
        { lignes: court, x: xP + 7, base: yP + 31, ancre: 'start', malus: 6 },
        { lignes: court, x: xP, base: yP + 31, ancre: 'middle', malus: 6 }
      ];
    }
    /* Ce qui manquerait le jour de l'échéance, au rythme tenu — le même
       nombre que la fiche. Un trait sous le point visé, et le mot. */
    var candMq = null;
    if (bilan && surLaCourbe && enRetard && bilan.manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
      var xj = x(prochain.i), y1 = y(Math.max(0, cible - bilan.manque)), y2 = y(cible);
      s.push('\x3Cline x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
      /* Hors du cadre découpé, à droite du trait, ou à gauche quand la
         droite est prise — le bord du tracé, ou le trait d'un jalon voisin
         (débrief 20 : « manque 176 » barré par les jalons 2 et 3 sur un
         écran moyen). Un liseré de la couleur du fond le garde lisible sur
         les courbes ; un fond plein quand un trait le croise malgré tout. */
      var motManque = 'manque ' + nb(bilan.manque), baseManque = (y1 + y2) / 2 + 4;
      /* Sur un cadre étroit, s'il ne tient d'aucun côté, il passe sur deux
         lignes (« manque », « 176 »), plus étroites. */
      candMq = [{ lignes: [motManque], x: xj + 7, base: baseManque, ancre: 'start', gras: true },
                { lignes: [motManque], x: xj - 7, base: baseManque, ancre: 'end', gras: true },
                { lignes: ['manque', nb(bilan.manque)], x: xj + 7, base: baseManque - 6, ancre: 'start', gras: true, malus: 1 },
                { lignes: ['manque', nb(bilan.manque)], x: xj - 7, base: baseManque - 6, ancre: 'end', gras: true, malus: 1 }];
    }
    /* « fin … » et « manque N » se cherchent une place ensemble (relecture
       du débrief 20). Posés l'un après l'autre, le premier prenait la
       meilleure place et le second, quand le jalon et la fin tombent à
       deux semaines d'écart, n'en trouvait plus et se posait par-dessus —
       et le fond plein de « fin … », toujours tracé, cachait « manque 1 ».
       On essaie donc chaque paire de places : la gêne de l'une, celle de
       l'autre, et un chevauchement entre elles compté comme avec tout autre
       mot ; on garde la paire qui gêne le moins (à égalité, la première
       essayée). Si un chevauchement reste malgré tout, « manque N » — le
       chiffre du retard — se dessine après le fond de « fin … », au-dessus :
       il n'est jamais caché. */
    var cFin = null, cMq = null;
    if (candFin && candMq) {
      var lesFins = noterMots(candFin, L - 2), lesManques = noterMots(candMq, L - mD), paire = null;
      lesFins.forEach(function (f) {
        lesManques.forEach(function (m) {
          var t = f.gene + m.gene + (seCoupent(f.boite, m.boite) ? 20 : 0);
          if (!paire || t < paire.t) paire = { t: t, f: f, m: m };
        });
      });
      cFin = paire.f; cMq = paire.m;
      if (seCoupent(cFin.boite, cMq.boite)) cMq.gene += 20;      // son fond plein, alors, par-dessus
      boites.push(cFin.boite, cMq.boite);
    } else if (candFin) cFin = placerMot(candFin, L - 2);
    else if (candMq) cMq = placerMot(candMq, L - mD);
    if (cFin) {
      horsClip.push(fondMot(cFin));
      horsClip.push(texteMot(cFin, { cls: 'fin-mot' }));
    }
    if (cMq) {
      if (cMq.gene >= 10) horsClip.push(fondMot(cMq));
      horsClip.push(texteMot(cMq, { cls: 'manque-jalon',
        plus: ' fill="var(--alerte)" font-weight="500" stroke="var(--surface)" stroke-width="4" stroke-linejoin="round" paint-order="stroke"',
        titre: '\x3Ctitle>Au rythme tenu, il manquerait ' + nb(bilan.manque) + ' plan' + (bilan.manque > 1 ? 's' : '') + ' le jour de l’échéance\x3C/title>' }));
    }
    /* Débrief 27 (X-A8, B3) : le nom de la droite « requis », écrit contre
       elle : au-dessus de son bout, à gauche (au-dessus d'une droite qui
       monte), ou à droite de son bout, ou au-dessus de son milieu, ou
       dessous à droite. Une place qui croise la droite elle-même est
       écartée d'abord : le mot ne s'écrit jamais en travers. */
    if (segRequis) {
      var motRq = 'requis ' + rythmeDit(requis) + '/sem.';
      var xS = segRequis[0], yS = segRequis[1], xE = segRequis[2], yE = segRequis[3];
      /* Le long de la droite, du bout vers le départ : au-dessus à gauche
         (au-dessus d'une droite qui monte), dessous à droite ; puis à droite
         du bout ; puis, en court, « requis » seul. */
      var candRq = [{ lignes: [motRq], x: xE - 8, base: yE - 6, ancre: 'end', gras: true },
                    { lignes: [motRq], x: xE + 8, base: yE + 4, ancre: 'start', gras: true, malus: 0.5 }];
      [0.75, 0.5, 0.3].forEach(function (t, k) {
        var xt = xS + (xE - xS) * t, yt = yS + (yE - yS) * t;
        candRq.push({ lignes: [motRq], x: xt - 6, base: yt - 7, ancre: 'end', gras: true, malus: 1 + k * 0.3 },
                    { lignes: [motRq], x: xt + 8, base: yt + 15, ancre: 'start', gras: true, malus: 1.2 + k * 0.3 });
      });
      [1, 0.5].forEach(function (t) {
        var xt = xS + (xE - xS) * t, yt = yS + (yE - yS) * t;
        candRq.push({ lignes: ['requis'], x: xt - 6, base: yt - 7, ancre: 'end', gras: true, malus: 4 },
                    { lignes: ['requis'], x: xt + 8, base: yt + 15, ancre: 'start', gras: true, malus: 4.2 });
      });
      /* Une place est exclue si le mot y croise sa droite ou le trait d'un
         jalon (même caché : il paraît au survol) ou d'aujourd'hui, couvre un
         autre mot, sort du tracé (rangée des jalons, axe, bords) ; parmi les
         autres, la moins gênée. */
      var exclue = function (bx) {
        return coupe(bx, segRequis) || bx.h < mHaut - 4 || bx.b > yBas + 2 || bx.g < mG - 5 || bx.d > L - 2 ||
          traitsX.concat(traitsCaches).some(function (tx) { return tx > bx.g - 1 && tx < bx.d + 1; }) ||
          boites.some(function (o) { return seCoupent(bx, o); });
      };
      var cRq = null;
      noterMots(candRq, L - 2).forEach(function (c) { if (!exclue(c.boite) && (!cRq || c.gene < cRq.gene)) cRq = c; });
      /* Nulle part sans couvrir un autre mot ni croiser la droite (un cadre
         de téléphone, un groupe serré) : pas de nom sur la courbe — la
         légende le porte, avec le même trait-point. */
      if (cRq) {
        boites.push(cRq.boite);
        horsClip.push(texteMot(cRq, { cls: 'requis-mot ' + (enRetard ? 'mal' : 'bon'),
          plus: ' fill="' + cr + '" font-weight="500" stroke="var(--surface)" stroke-width="4" stroke-linejoin="round" paint-order="stroke"' }));
      }
    }
    s.push('\x3C/g>');

    /* Débrief 27 (B3) : le trait d'aujourd'hui, un filet fin (--filet-fort),
       de la rangée du haut au zéro du tracé ; son mot, en tête, et la
       semaine écrite sur l'axe disent où il est. */
    if (xAuj !== null) {
      s.push('\x3Cline class="trait-auj" x1="' + xAuj.toFixed(1) + '" x2="' + xAuj.toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + yBas.toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      s.push('\x3Ctext class="grad repere-auj" x="' + (aujADroite ? xAuj + 6 : xAuj - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="' + (aujADroite ? 'start' : 'end') + '">' +
             motAuj + '\x3C/text>');
    }
    if (AUJ >= d0 && AUJ <= d1) {
      /* Sous une valeur, le point n'est celui du jour que si la courbe
         finit bien au dernier relevé ; et quand elle y descend, son nombre
         s'écrit dessous, pas en travers du trait. De même tout en haut
         (100 %) : au-dessus du point, il sortait du tracé et s'écrivait sur
         « dernier relevé ». */
      if (pointMontre) {   // auPoint, dessous : réservés plus haut
        s.push('\x3Ccircle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(auPoint).toFixed(1) + '" r="4.5" fill="' + coul + '" stroke="var(--surface)" stroke-width="2"/>');
        s.push('\x3Ctext class="grad nombre-point" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (dessous ? y(auPoint) + 16 : y(auPoint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500"' +
               ' stroke="var(--surface)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">' + auPoint + '\x3C/text>');
      }
    }

    /* Jalons : un trait, un triangle, une étiquette. Rien à saisir ni à
       déplacer — ils viennent de la configuration, l'outil ne fait que les
       montrer. Le survol de la semaine dessous passe par la bande cliquable,
       comme partout ailleurs sur le graphique. */
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      /* Un jalon ne se peint en rouge que s'il fait l'échéance ici : la même
         semaine que l'échéance, mais d'un autre périmètre, il reste en
         retrait. Deux jalons de la même semaine qui comptent tous deux sont
         rouges tous deux — l'un est aussi manqué que l'autre. */
      var hors = !jalonDansPerimetre(j);
      var critique = prochain && j.i === prochain.i && !hors && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-2)';
      var mention = (j.perimetre ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) : '') +
        (hors ? ' \u2014 ' + ech(raisonRetrait(j)) + ', ne compte pas ici' : '');
      var yBase = mHaut - 8;          // haut du trait pointillé
      var yMarque = yBase - 9;        // centre du numéro
      var cx = pl.cx;

      /* Débrief 27 (B3) : le trait pleine hauteur pour la seule prochaine
         échéance (rouge si elle est manquée) ; les autres jalons gardent
         une coche de 6 px sous leur numéro, et leur trait ne paraît, léger,
         qu'au survol du numéro ou de leur jalon dans la légende (CSS). Sept
         traits verticaux, c'était trop. */
      var plein = traitPlein(pl);
      s.push('\x3Cg class="jalon' + (hors ? ' hors-perimetre' : '') + (critique ? ' critique' : '') + (plein ? ' prochain' : '') + '" data-jalon="' + idx + '" data-i="' + j.i + '" role="img" aria-label="Jalon ' + (idx + 1) + ', ' +
             ech(j.texte) + ', ' + semaineDite(j.i) + mention + (critique ? ', en retard' : '') + '">');
      s.push('\x3Ctitle>' + (idx + 1) + ' \u2014 ' + ech(j.texte) + ' \u2014 ' + semaineDite(j.i) + mention + (critique ? ' \u2014 en retard' : '') + '\x3C/title>');
      s.push('\x3Cline class="jalon-trait" x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + yBas.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="3 4"/>');
      if (!plein) s.push('\x3Cline class="jalon-coche" x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + (yBase + 6).toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1"/>');
      if (Math.abs(cx - jx) > 0.5) {
        s.push('\x3Cline class="jalon-lien" x1="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + (yMarque + 10).toFixed(1) +
               '" stroke="' + couleur + '" stroke-width="1"/>');
      }
      s.push('\x3Ccircle class="jalon-marque" cx="' + cx.toFixed(1) + '" cy="' + yMarque.toFixed(1) + '" r="10" fill="' + couleur + '"/>');
      s.push('\x3Ctext class="jalon-num" x="' + cx.toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="middle">' + (idx + 1) + '\x3C/text>');
      /* Le nom ne s'écrit pas sur le dessin — la légende le porte. Il reste
         dans le groupe pour les lecteurs d'écran, et paraît sous la rangée
         quand on survole le jalon, centré sur son numéro sans sortir du cadre. */
      var demiLargeur = ech(j.texte).length * 3.2;
      var xTexte = Math.max(mG + demiLargeur, Math.min(cx, L - mD + 30 - demiLargeur));
      s.push('\x3Ctext class="jalon-texte masque" x="' + xTexte.toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="middle" fill="' + couleur + '">' + ech(j.texte) + '\x3C/text>');
      s.push('\x3C/g>');
    });

    if (!prochain && d1 > AUJ + 2) {
      var xv = x(AUJ + Math.round((d1 - AUJ) / 2));
      /* Un contrat sans aucun jalon (THS, débrief 17) ne dit pas « à
         venir » : on croirait ses échéances passées. */
      var motAucun = !jalons.length ? 'Aucun jalon pour ce contrat'
        : 'Aucun jalon \u00e0 venir' + (jalonsAVenirAilleurs() ? ' dans ce p\u00e9rim\u00e8tre' : '');
      /* Sur un cadre étroit, la phrase reste entière dans le tracé. */
      var demiAucun = largeurMot(motAucun) / 2;
      xv = Math.max(Math.min(xv, L - mD - demiAucun), Math.min(mG + demiAucun, mG + LARGEUR / 2));
      /* Débrief 27 : à la hauteur où aucune droite ne le barre (la
         projection passait en travers), du bas vers le haut du tracé. */
      var candAucun = [0.86, 0.62, 0.38, 0.16].map(function (f, k) {
        return { lignes: [motAucun], x: xv, base: mHaut + plotH * f, ancre: 'middle', malus: k * 0.5 };
      });
      var cAucun = placerMot(candAucun, L - mD + 4);
      s.push('\x3Ctext class="grad mot-aucun" x="' + xv.toFixed(1) + '" y="' + cAucun.base.toFixed(1) +
             '" text-anchor="middle">' + motAucun + '\x3C/text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < trace.length; k5++) {
      var dSem = trace[k5].i - trace[k5 - 1].i;
      if (dSem <= 0) continue;
      var parSem = (trace[k5].termine - trace[k5 - 1].termine) / dSem;
      for (var w = trace[k5 - 1].i + 1; w <= trace[k5].i; w++) taux.push({ i: w, v: parSem });
    }
    /* Une valeur peut aussi se vider (« À traiter » baisse quand le travail
       avance) : sa bande est alors à deux sens, le gain au-dessus d'un trait
       médian, la perte dessous. Les validés ne font que monter. */
    var deuxSens = !!vVal && taux.some(function (t) { return t.v < 0; });
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, deuxSens ? Math.abs(t.v) : t.v); });
    /* Débrief 27 (B3) : la bande a sa rangée à elle, sous l'axe — son nom
       en haut à gauche (« validés / semaine », 11 px), dessous les barres
       (10 px de large, le haut arrondi) posées sur leur propre ligne de
       base ; pour une valeur qui peut baisser, un zéro au milieu de la
       bande, la baisse dessous. Des barres plus soutenues (--barre-semaine,
       3:1 sur la surface : le vert clair d'avant faisait 2,2:1). */
    var lb = Math.min(10, Math.max(2, pasX - 2));
    var hautBarres = bandeH - 14;                      // sous le nom de la bande
    var hMax = deuxSens ? hautBarres / 2 : hautBarres, yZero = deuxSens ? basBande - hautBarres / 2 : basBande;
    var motBande = vVal ? ech('« ' + vVal.libelle + ' » : variation nette par semaine') : motFini(2) + ' / semaine';
    var motCourt = vVal ? ech('« ' + vVal.libelle + ' » par sem.') : motFini(2) + '/sem.';
    var nomEntier = largeurMot(motBande) <= LARGEUR + mG - 4;
    s.push('\x3Ctext class="grad nom-bande" x="' + mG + '" y="' + (yBande + 10).toFixed(1) + '" text-anchor="start">' +
           (nomEntier ? motBande : '\x3Ctitle>' + motBande + '\x3C/title>' + motCourt) + '\x3C/text>');
    s.push('\x3Cline class="base-bande" x1="' + mG + '" x2="' + (L - mD) + '" y1="' + yZero.toFixed(1) + '" y2="' + yZero.toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
    taux.forEach(function (t) {
      if (t.i < d0 || t.i > d1 || !t.v || (!deuxSens && t.v < 0)) return;
      var h = Math.max(1.5, (Math.abs(t.v) / maxSem) * hMax);
      var rx = Math.min(2, lb / 2, h / 2);
      var xg = x(t.i) - lb / 2, monte = t.v > 0;
      /* Le bout arrondi est toujours celui qui s'éloigne du trait de base. */
      var yh = monte ? yZero - h : yZero + h, yb = yZero, sens = monte ? 1 : -1;
      s.push('\x3Cpath class="barre-semaine' + (monte ? '' : ' perte') + '" d="M' + xg.toFixed(1) + ' ' + yb.toFixed(1) + ' V' + (yh + sens * rx).toFixed(1) +
             ' Q' + xg.toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + rx).toFixed(1) + ' ' + yh.toFixed(1) +
             ' H' + (xg + lb - rx).toFixed(1) + ' Q' + (xg + lb).toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + lb).toFixed(1) + ' ' + (yh + sens * rx).toFixed(1) +
             ' V' + yb.toFixed(1) + ' Z" fill="' + (vVal ? coul : 'var(--barre-semaine)') + '"' + (monte ? '' : ' opacity=".5"') + '/>');
    });

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    /* Une dizaine sur un grand écran, moins sur un cadre étroit : une
       graduation toutes les 60 px au plus serré, pour que « S38 » et
       l'année dessous ne se touchent jamais. */
    var saut = Math.max(1, Math.ceil(span / Math.max(2, Math.min(11, Math.floor(LARGEUR / 60)))));
    var anneeEcrite = '';
    /* Débrief 27 (B3) : la semaine d'aujourd'hui (celle du trait) s'écrit
       toujours ; celle du dernier relevé aussi, si elle n'est pas trop
       près ; une graduation régulière trop proche de l'une d'elles leur
       cède la place. L'axe est sous le tracé, la bande des semaines dessous. */
    var aujEcrit = Math.abs(AUJ - depart) * pasX >= 34;
    var forcee = function (k) { return k === depart || (k === AUJ && aujEcrit); };
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && !forcee(k3)) continue;
      if (!forcee(k3) && (Math.abs(k3 - depart) * pasX < 34 || (aujEcrit && Math.abs(k3 - AUJ) * pasX < 34))) continue;
      var lib = etiquette(k3);
      var annee = lib.slice(0, 4), semaine = 'S' + numeroSemaine(k3);
      /* À 18 px sous le zéro : la première semaine ne touche pas le « 0 » de l'échelle. */
      s.push('\x3Ctext class="grad" x="' + x(k3).toFixed(1) + '" y="' + (yBas + 18).toFixed(1) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             semaine + '\x3C/text>');
      /* L'année n'encombre pas chaque graduation : une fois, puis à chaque
         changement. */
      if (annee !== anneeEcrite) {
        /* Débrief 27 : l'année passe de 10 à 11 px (jamais moins de 11 px
           rendus) ; un pixel plus bas, elle ne touche pas la semaine. */
        s.push('\x3Ctext class="annee" x="' + x(k3).toFixed(1) + '" y="' + (yBas + 32).toFixed(1) + '" text-anchor="middle">' + annee + '\x3C/text>');
        anneeEcrite = annee;
      }
    }

    /* Les mots posés sur la courbe — « fin S9 · mars 2027 », « manque 180 »,
       le départ des projections — passent après les traits des jalons :
       leur liseré les garde lisibles au lieu d'être barrés par un
       pointillé. */
    horsClip.forEach(function (t) { s.push(t); });

    /* Le point d'une semaine se cherche par son indice, pas par sa position
       dans la série : une semaine sans relevé n'a pas de point. */
    var ptParI = {};
    trace.forEach(function (pt) { ptParI[pt.i] = pt; });
    for (var k4 = d0; k4 <= d1; k4++) {
      var ptK = ptParI[k4];
      /* Une bande par semaine : elle porte le survol (bulle) et son libellé
         pour les lecteurs d'écran. Ni bouton ni focus : rien ne se pose sur
         le graphique, et un clic n'y dessine plus de contour. */
      s.push('\x3Crect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (basBande - mHaut + 6).toFixed(1) + '" fill="transparent" role="img" data-i="' + k4 + '" ' +
             'aria-label="' + semaineDite(k4) +
             (ptK ? ' : ' + ptK.termine + (vVal ? ech(' « ' + vVal.libelle + ' »') : ' ' + motFini(2)) : k4 > depart ? ' (à venir)'
               : RELEVES.some(function (r) { return r.i === k4; }) ? ' : relevé sans détail plan par plan, hors de cette courbe' : ' : pas de relevé') + '"/>');
    }

    s.push('\x3C/svg>');
    /* Débrief 27 (D8, B7) : moins de deux points, pas de courbe — une
       grille vide avec un seul point et des commandes qui n'agissent sur
       rien. Un état calme à la place : ce qui manque et quand cela viendra ;
       les pilules, la période, la légende et les chiffres se cachent
       (.graphe-vide), les jalons restent listés dessous. */
    var vide = trace.length < 2;
    $('section-tendance').classList.toggle('graphe-vide', vide);
    cadreGraphe.tabIndex = vide ? -1 : 0;
    $('zone-graphe').innerHTML = !vide ? s.join('')
      : '\x3Cdiv class="etat-vide graphe-vide-bloc">\x3Cp class="etat-vide-phrase">La courbe commence au deuxième relevé\x3C/p>' +
        '\x3Cp class="etat-vide-detail">' + (trace.length
          ? 'Un seul relevé pour l’instant (' + ech(semaineDite(trace[0].i)) + ') : ' + nb(trace[0].termine) + ' sur ' + nb(trace[0].total) + ' plans ' + motFini(2) + '. '
          : 'Aucun relevé archivé pour l’instant. ') +
        'La courbe et le rythme se dessineront au prochain relevé archivé.\x3C/p>\x3C/div>';

    /* Débrief 27 (M3, D9) : chaque mot de la légende est un bouton qui
       déplie sa phrase sous la légende — au doigt et au clavier, plus
       seulement au survol (le soulignement pointillé promettait quelque
       chose qu'un toucher n'ouvrait pas). Un seul déplié à la fois ; un
       second appui le replie. Le survol garde son titre. */
    var phrases = {};
    var motLegende = function (cle, titre, texte) {
      phrases[cle] = titre;
      return '\x3Cbutton type="button" class="legende-mot" data-legende="' + cle + '" aria-expanded="' + (vue.legendeOuverte === cle) +
        '" aria-controls="legende-detail">\x3Cspan title="' + ech(titre) + '">' + texte + '\x3C/span>\x3C/button>';
    };
    var items = ['\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' + coul + '" stroke-width="2.2"' +
      (vVal && vVal.hachure ? ' stroke-dasharray="6 4"' : '') + '/>\x3C/svg>' +
      (vVal ? motLegende('realise', 'Plans « ' + vVal.libelle + ' », relevé après relevé. Le rythme, la fin estimée et l’échéance se lisent sur les ' + motFini(2) + '.',
                ech('« ' + vVal.libelle + ' », relevé après relevé')) + '\x3C/span>'
            : motLegende('realise', 'Plans ' + motFini(2) + ', relevé après relevé : le trait plein, un point par relevé.', 'r\u00e9alis\u00e9') + '\x3C/span>')];
    /* Les mêmes mots que la fiche et le bloc par groupe : « rythme tenu »,
       « fin », « requis » — et les mêmes nombres, tirés de bilanEcheance. */
    /* Rien de validé depuis le premier relevé : pas de projection tracée,
       donc pas de trait pointillé en légende (débrief 20 : « au rythme tenu
       (0,0/sem.) » renvoyait à une droite absente). Les mots du bloc par
       groupe, sans pastille. */
    if (ryt && restants > 0 && !vVal && projIdx === null) {
      items.push('\x3Cspan class="legende-item sans-rythme">' + motLegende('rythme', 'Aucun plan ' + motFini(1) + ' depuis le premier relevé : pas de rythme, donc pas de date d\u2019arrivée.',
        'rien de ' + motFini(1) + ' depuis le premier relevé') + '\x3C/span>');
    }
    if (ryt && restants > 0 && !vVal && projIdx !== null) {
      /* Accordé : avec deux relevés, « 7 plans validés en 1 semaine » (il
         disait « 1 semaines », débrief 17). */
      var dansSem = projIdx - depart;
      var explication = nb(ryt.gagnes) + (ryt.gagnes > 1 ? ' plans validés' : ' plan validé') + ' en ' + ryt.semaines +
        (ryt.semaines > 1 ? ' semaines' : ' semaine') + ', du premier au dernier relevé : ' +
        virgule(vitesse) + ' par semaine. ' +
        'À ce rythme, ' + (restants > 1 ? 'les ' + nb(restants) + ' restants demandent ' : 'le dernier demande ') +
        dansSem + (dansSem > 1 ? ' semaines' : ' semaine') + ' : fin ' + semaineDite(projIdx) + '.';
      items.push('\x3Cspan class="legende-item">\x3Csvg width="22" height="8" aria-hidden="true">' +
        '\x3Cline x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4"/>\x3C/svg>' +
        /* Le rythme seul (débrief 19 : « la flèche et fin juillet 2032, on
           s'en fout ») : la fin estimée reste dans le survol et sur la courbe. */
        motLegende('rythme', explication, 'au rythme tenu (' + virgule(vitesse) + '/sem.)') + '\x3C/span>');
    }
    if (requis !== null && !vVal) {
      var dom = bilan.domaine && bilan.domaine !== vue.perimetre ? bilan.domaine : '';
      var d = dateEcheance(prochain);
      /* La portée du nombre, dite quand ce n'est pas celle de la fiche : le
         groupe choisi dans le bloc. */
      var gA = groupeAffiche();
      var porteeG = gA ? nomGroupe(gA) : '';
      items.push('\x3Cspan class="legende-item">\x3Csvg width="26" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="26" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6" stroke-dasharray="8 3 2 3"/>\x3C/svg>' +
        /* Sans le nombre (débrief 19) : il est dans le survol, dans la fiche de
           l'échéance et dans le bloc par groupe. */
        motLegende('requis', nb(bilan.restants) + (bilan.restants > 1 ? ' plans' : ' plan') + ' à valider' + (dom ? ' dans ' + dom : '') +
          ' en ' + bilan.semaines + (bilan.semaines > 1 ? ' semaines' : ' semaine') + ', d\u2019ici le ' + JOURS_SEMAINE[d.getUTCDay()] + ' ' +
          d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] + ' : ' + rythmeDit(requis) + ' par semaine. En rouge quand le rythme tenu ne suffit pas.',
          'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb' + (porteeG ? ' (' + ech(porteeG) + ')' : '') +
          (dom ? ' sur ses plans ' + ech(dom) : '')) +
        (!surLaCourbe && dom ? '\x3Cbutton type="button" class="lien-doux" data-voir-perimetre="' + ech(dom) + '">voir ' + ech(dom) + '\x3C/button>' : '') +
        '\x3C/span>');
    }
    if (vue.legendeOuverte && !phrases[vue.legendeOuverte]) vue.legendeOuverte = '';
    $('legende').innerHTML = items.join('') +
      '\x3Cp class="legende-detail" id="legende-detail"' + (vue.legendeOuverte ? '' : ' hidden') + '>' +
      (vue.legendeOuverte ? ech(phrases[vue.legendeOuverte]) : '') + '\x3C/p>';
    /* La légende des jalons : chaque numéro en clair, son nom, et dessous sa
       semaine telle que la page la dit partout — « S51 · déc. 2026 ». Rien
       d'autre (débrief 13) : le périmètre, l'avancement suivi, le décompte
       en jours et la raison d'un retrait passent dans le survol et dans la
       fiche. En retrait hors périmètre, en rouge s'il est l'échéance
       manquée. Survoler un jalon ici l'éclaire sur le graphique. */
    $('legende-jalons').innerHTML = jalons.length ? '\x3Cspan class="legende-jalons-mot">Jalons\x3C/span>\x3Cdiv class="legende-jalons-grille" title="Cliquez un jalon pour le détail de son échéance">' + jalons.map(function (j, idx) {
      var hors = !jalonDansPerimetre(j), rouge = prochain && j.i === prochain.i && !hors && enRetard;
      var nj = joursAvant(j);
      var horsFenetre = j.i < d0 || j.i > d1;   // dans la légende, mais pas dans la fenêtre affichée
      return '\x3Cspan class="legende-jalon' + (hors ? ' hors-perimetre' : '') + (rouge ? ' critique' : '') + (horsFenetre ? ' hors-fenetre' : '') +
        '" data-jalon="' + idx + '" data-semaine="' + etiquette(j.i) + '"' + (j.date ? ' data-date="' + ech(j.date) + '"' : '') +
        ' tabindex="0" role="button" aria-expanded="' + (vue.echeance === idx) + '" title="' +
        ech(j.texte) + ' \u2014 ' + semaineDite(j.i) + ', ' + ech(motJours(nj)) + (j.perimetre ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) : '') +
        (hors ? ' \u2014 ' + ech(raisonRetrait(j)) : '') + (horsFenetre ? ' \u2014 hors de la fen\u00eatre affich\u00e9e' : '') + '">' +
        /* Le nom et la semaine, rien d'autre : le périmètre, l'avancement
           suivi et le décompte en jours sont dans la bulle et dans la
           fiche ; le graphique dit le reste. */
        '\x3Cb class="num">' + (idx + 1) + '\x3C/b>\x3Cspan class="mot">' + ech(j.texte) + '\x3C/span>' +
        /* Débrief 27 (X-A8) : l'échéance manquée le dit en mots, pas
           seulement en rouge. */
        '\x3Cspan class="quand">' + semaineDite(j.i) + (rouge ? '\x3Cspan class="retard"> \u00b7 en retard\x3C/span>' : '') + '\x3C/span>\x3C/span>';
    }).join('') + '\x3C/div>' + (vue.echeance !== null && jalons[vue.echeance] ? ficheEcheance(vue.echeance) : '') : '';

    /* Dessiné avant l'arrivée des polices, les mots ont été placés avec
       de la marge : une fois les polices là, le graphique se redessine au
       plus juste. Une seule fois — une police qui ne vient pas ne relance
       pas le dessin sans fin. */
    if (policeAttendue && !redessinPolices && document.fonts && document.fonts.ready) {
      redessinPolices = true;
      document.fonts.ready.then(function () { rendreGraphique(selection()); });
    }

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, trace: trace, valeur: vVal,
                        prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0,
                        bilan: bilan, ryt: ryt,
                        echelle: { d0: d0, pasX: pasX, mHaut: mHaut, plotH: plotH, haut: haut, H: H } };
    majBoutonsZoom();
    /* Débrief 27 : après un glissement ou un zoom à la main, le retour au
       cadrage d'ouverture ; la semaine montrée au doigt ou au clavier reste
       éclairée ; la phrase-résumé et, s'il est ouvert, le tableau des
       chiffres suivent la courbe. */
    var rv = $('revenir-cadrage');
    if (rv) {
      rv.hidden = !vue.fenManuelle;
      rv.style.left = (mG + 6) + 'px'; rv.style.top = (mHaut + 6) + 'px';
      if (vue.fenManuelle) rv.innerHTML = '\x3Cspan aria-hidden="true">\u21ba\x3C/span> ' +
        (!vVal && cadrageEcheances() ? 'Revenir aux échéances' : 'Revenir au cadrage de départ');
    }
    if (semaineMarquee !== null) marquerSemaine(semaineMarquee);
    rendreDonneesGraphe();
    planifierSauvegarde();
  }

  /* Débrief 27 (X-A7) : ce que dit le graphique, en mots — une phrase
     (#resume-graphe, la description du cadre et du dessin pour les
     lecteurs d'écran) et, dans « Voir les chiffres », le tableau des
     relevés : semaine, nombre, plans suivis, gain net. Le tableau ne se
     remplit qu'ouvert, et seulement s'il a changé (un glissement redessine
     la courbe à chaque semaine). */
  var CLE_DONNEES_GRAPHE = '';
  function rendreDonneesGraphe() {
    var a = derniereAnalyse, resume = $('resume-graphe');
    if (!a || !resume) return;
    var serie = a.trace || a.pts, der = serie[serie.length - 1], v = a.valeur, b = a.bilan;
    var phrase;
    if (!der) phrase = 'Aucun relevé.';
    else if (v) phrase = nb(der.termine) + ' plans « ' + v.libelle + ' » sur ' + nb(der.total) + ', en ' + semaineDite(der.i) + '.';
    else {
      phrase = nb(a.atteint) + ' ' + (a.total > 1 ? 'plans ' : 'plan ') + motFini(a.total) + ' sur ' + nb(a.total) + ', en ' + semaineDite(der.i) + '. ' +
        (a.ryt ? 'Rythme tenu : ' + virgule(a.vitesse) + ' par semaine' + (a.projIdx !== null ? ', fin estimée en ' + semaineDite(a.projIdx) : '') + '.'
               : 'Un seul relevé : pas encore de rythme.');
      if (a.prochain && b && b.restants) {
        var d = dateEcheance(a.prochain);
        phrase += ' Échéance « ' + a.prochain.texte + ' », ' + JOURS_SEMAINE[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] +
          ' : il faut ' + rythmeDit(b.requis) + ' par semaine ; ' +
          (b.rythme === null ? 'le rythme se mesurera au deuxième relevé.'
            : b.enRetard ? 'au rythme tenu, il manquera ' + nb(b.manque) + (b.manque > 1 ? ' plans.' : ' plan.') : 'au rythme tenu, elle sera tenue.');
      }
    }
    resume.textContent = phrase;
    var details = $('donnees-graphe'), corps = $('donnees-graphe-corps');
    if (!details || !corps) return;
    details.hidden = !serie.length;
    if (!details.open) return;
    var titreN = v ? '« ' + v.libelle + ' »' : majuscule(motFini(2));
    var lignes = serie.map(function (pt, k) {
      var g = k ? pt.termine - serie[k - 1].termine : null;
      return '\x3Ctr>\x3Cth scope="row">' + ech(semaineDite(pt.i)) + '\x3C/th>\x3Ctd>' + nb(pt.termine) + '\x3C/td>\x3Ctd>' + nb(pt.total) + '\x3C/td>\x3Ctd>' +
        (g === null ? TIRET_VIDE : (g > 0 ? '+' : '') + nb(g)) + '\x3C/td>\x3C/tr>';
    });
    var html = '\x3Cp>' + ech(phrase) + '\x3C/p>\x3Ctable class="table-donnees">\x3Ccaption class="masque">Relevés de la courbe, du plus ancien au plus récent\x3C/caption>' +
      '\x3Cthead>\x3Ctr>\x3Cth scope="col">Semaine\x3C/th>\x3Cth scope="col">' + ech(titreN) + '\x3C/th>\x3Cth scope="col">Plans suivis\x3C/th>\x3Cth scope="col">' +
      (v ? 'Variation nette' : 'Gain net') + '\x3C/th>\x3C/tr>\x3C/thead>\x3Ctbody>' + lignes.join('') + '\x3C/tbody>\x3C/table>';
    if (html === CLE_DONNEES_GRAPHE && corps.innerHTML) return;
    CLE_DONNEES_GRAPHE = html;
    corps.innerHTML = html;
  }

  /* « Tout » n'a pas de largeur fixe : il est pressé quand la fenêtre est
     exactement celle qu'il donnerait, et qu'aucun préréglage fixe ne l'est. */
  /* Un seul bouton pressé : « Échéances » si la fenêtre est exactement la
     sienne, sinon la durée qui a cette largeur, sinon « Tout » s'il la
     donnerait. « Échéances » s'efface quand il n'y a plus de jalon à venir. */
  function majBoutonsZoom() {
    var boutons = [].slice.call(document.querySelectorAll('.commandes-graphe .segmente button'));
    var ech = cadrageEcheances();
    var surEch = !!ech && ech.debut === vue.fen.debut && ech.span === vue.fen.span;
    var fixe = !surEch && boutons.some(function (b) { return Number(b.dataset.span) > 0 && Number(b.dataset.span) === vue.fen.span; });
    boutons.forEach(function (b) {
      var d = b.dataset.span, v = Number(d), presse;
      if (d === 'jalons') {
        /* Débrief 27 (lot H, P-F12) : sans échéance à venir, le bouton reste
           à sa place, grisé, et dit pourquoi (au clic, au toucher, au
           clavier) — il disparaissait sans un mot. */
        if (!b.hasAttribute('data-titre')) b.setAttribute('data-titre', b.title);
        if (ech) { b.removeAttribute('aria-disabled'); b.title = b.getAttribute('data-titre'); }
        else {
          b.setAttribute('aria-disabled', 'true');
          b.title = jalons.length ? 'Plus d\u2019échéance à venir pour ' + (nomAffiche(CONTRAT) || 'ce contrat') + ' : ses jalons sont passés.'
            : 'Aucun jalon pour ' + (nomAffiche(CONTRAT) || 'ce contrat') + ' : pas d\u2019échéance à montrer.';
        }
        presse = surEch;
      }
      else if (v) presse = !surEch && v === vue.fen.span;
      else presse = !surEch && !fixe && vue.fen.span === spanTout();
      b.setAttribute('aria-pressed', String(presse));
    });
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  function reglerSpan(span) {
    vue.fenAuto = false; vue.fenManuelle = false;
    vue.fen = span === 'jalons' ? (cadrageEcheances() || cadrageSur(SPAN_OUVERTURE))
            : span ? cadrageSur(span) : { debut: 0, span: spanTout() };
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;
  /* Débrief 27 (M3, D9, X-A7) : la bulle d'une semaine s'ouvre de trois
     façons. Au survol de la souris, comme avant. Au doigt : un toucher sur
     la courbe l'ouvre et la garde (elle s'effaçait 5 ms après) ; un toucher
     ailleurs, un défilement, sa croix ou Échap la ferment ; au téléphone,
     elle se pose en bas de l'écran, jamais sous le doigt. Au clavier : le
     cadre du graphique prend le focus, les flèches passent d'un relevé à
     l'autre (Début, Fin : le premier, le dernier), et la page dit la
     semaine (annoncer). modeBulle : '' (fermée, ou au survol), 'tenue'
     (au doigt), 'clavier'. */
  var modeBulle = '', semaineClavier = null, semaineMarquee = null;

  /* Le geste du graphique : le panoramique. Il part de n'importe quel point
     du cadre, frise des jalons et marge du bas comprises — le curseur y
     promet la main partout. Un clic net sur le numéro d'un jalon ouvre la
     fiche de son échéance ; ailleurs, il ne fait rien (au doigt : la bulle
     de la semaine). Débrief 27 (M2) : le cadre laisse au navigateur les
     gestes verticaux (touch-action: pan-y) — un pouce qui descend fait
     défiler la page, et le navigateur nous envoie pointercancel ; seul un
     glissement franchement horizontal déplace la courbe. */
  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    if (e.target.closest && e.target.closest('#revenir-cadrage')) return;
    glisse = { x0: e.clientX, debut0: vue.fen.debut, bouge: false, type: e.pointerType || 'mouse' };
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  /* Débrief 27 (P-F1, X-A9) : la molette seule fait défiler la page — elle
     restait coincée sur le graphique, qui zoomait à la place. Le zoom passe
     par Ctrl (⌘ sur Mac) + molette, et par le pincement d'un pavé tactile,
     qui arrive en Ctrl + molette. La première molette simple sur le
     graphique fait paraître, une fois par visite, un mot discret qui le dit. */
  var INDICE_ZOOM_VU = false;
  function montrerIndiceZoom() {
    if (INDICE_ZOOM_VU) return;
    INDICE_ZOOM_VU = true;
    try { if (sessionStorage.getItem('suivi-fwd:indice-zoom')) return; sessionStorage.setItem('suivi-fwd:indice-zoom', '1'); } catch (err) { /* stockage interdit : une fois par page */ }
    var z = $('indice-zoom');
    if (!z) return;
    var mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
    z.textContent = (mac ? '⌘' : 'Ctrl') + ' + molette pour zoomer · glisser pour se déplacer';
    z.hidden = false;
    clearTimeout(z.__minuteur);
    requestAnimationFrame(function () { z.classList.add('visible'); });
    z.__minuteur = setTimeout(function () {
      z.classList.remove('visible');
      z.__minuteur = setTimeout(function () { z.hidden = true; }, 350);
    }, 2400);
  }
  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    if (!e.ctrlKey && !e.metaKey) { if (e.deltaY) montrerIndiceZoom(); return; }
    /* Ctrl + molette : c'est pour le graphique — jamais le zoom de la page
       entière, même quand le graphique est déjà à sa limite. */
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    /* Le zoom arrière s'arrête à la largeur de « Tout » (débrief 20 : il
       allait jusqu'à deux ans, la moitié du graphique vide, les mots
       croisés). Une fenêtre déjà plus large — « 1 an » — ne s'élargit pas
       davantage, et la molette ne la rétrécit pas en zoomant arrière. */
    var plafond = Math.max(span0, spanTout());
    var span1 = Math.max(8, Math.min(plafond, MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fenAuto = false; vue.fenManuelle = true;
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));

  /* La bulle d'une semaine : son contenu, d'abord. */

  /* La bulle, montrée près du point (cx, cy, en pixels de l'écran) ; tenue

  function montrerBulleSemaine(i, mode, cx, cy) {
    var html = contenuBulleSemaine(i);

  function pointEcran(i) {

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y

  /* L'explication ne vaut que chiffrée : on reprend une ligne réelle du bloc
     et on y refait le calcul pas à pas, avec les nombres qu'elle affiche —
     les formules de bilanEcheance, écrites en clair. */
  function panneauAide(rangs, prochain) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restantsGroupe > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    var depart = semaineDepart();
    var h = '\x3Cdiv class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment se calculent la fin estimée et les rythmes">';
    /* Débrief 27 (lot C) : une croix le referme, et Échap aussi ; le focus

    h += '\x3Cdiv class="aide-panneau-tete">\x3Ch3>D’où viennent ces chiffres ?\x3C/h3>' +
         '\x3Cbutton type="button" class="fiche-plan-fermer" data-fermer-aide="1" aria-label="Fermer l’explication">×\x3C/button>\x3C/div>';
    h += '\x3Cp>GATES ne donne qu’une photo du jour, sans historique. Chaque semaine, on archive un relevé ; la page compare ' +
         'le premier relevé au dernier et prolonge la pente en ligne droite. Les semaines se comptent à partir de la ' +
         'semaine en cours, ' + ech(semaineDite(depart)) + '.\x3C/p>';

         '\x3C/div>';

    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc

  /* Débrief 27 (lot C) : o = { id, nom, filtre, limite } — l'id de la liste

    if (!plans.length) return '';
    var totalGroupe = plans.length;
    var ouverture = '\x3Cdiv class="groupe-refs"' + (o.id ? ' id="' + o.id + '"' : '') + '>';
    var filtrer = o.nom ? boutonFiltrerPage(r.nom, o.nom, o.filtre) : '';
    /* Sous une valeur choisie dans la rangée du bloc, le groupe ne montre
       qu'elle : une seule sous-liste, et l'en-tête dit sur combien. */
    if (vb) {

      plans = plans.filter(function (p) { return p._cle === vb; });
      if (!plans.length) {
        return ouverture + '\x3Cdiv class="entete">\x3Cspan>Aucun plan « ' + ech(nom) + ' » dans ce groupe (' + nb(tous) +
          ' plan' + (tous > 1 ? 's' : '') + ' en tout) — « Tout » les montre.\x3C/span>' + filtrer + '\x3C/div>\x3C/div>';
      }

    /* Une sous-liste par valeur de la colonne, dans l'ordre de la barre du
       haut — Terminé, En cours, À faire, Non renseigné, et leurs variantes —,
       chacune avec sa pastille et son compte ; dans chacune, les références

    var restants = plans.filter(function (p) { return p._etat !== 'termine'; }).length;

       les sous-listes par valeur. */
    var arrets = plans.filter(function (p) { return arretParRef[p.reference]; }).map(function (p) { return arretParRef[p.reference]; })
      .sort(function (a, b) { return (b.semaines - a.semaines) || COMPARER_REF(a.plan.reference, b.plan.reference); });
    var nArret = arrets.length;
    var parValeur = {};
    plans.forEach(function (p) {
      if (arretParRef[p.reference]) return;
      var k = cleValeur(p[CLE_SUIVIE]);
      (parValeur[k] = parValeur[k] || []).push(p);
    });
    /* Débrief 27 (lot C, D10) : la liste dépliée prend sa hauteur dans la

    var coupe = limite && !vue.refsTout ? limite : 0;
    var rang = 0;
    function jeton(p) {
      var h = jetonUD(p);
