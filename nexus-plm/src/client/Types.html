<script>
// ============================================================
// NEXUS PLM — registre des types de sous-ensembles.
//
// Pièce maîtresse : un seul endroit décrit, pour chaque type, les champs qu'il
// porte ET les critères qui servent à l'équivalence. L'affichage de la fiche,
// le moteur de scoring et l'écran de réglages sont tous générés à partir d'ici.
// Ajouter un type ou un critère ne demande de toucher à aucun autre fichier.
//
// Les types ne partagent PAS la même fiche : une structure boîte porte toute
// la géométrie, un harnais n'a qu'un PN et une référence, une plaquette
// éclairante se compare sur son numéro et ses mots-clés.
// ============================================================

const GENRE = {
  TEXTE: 'texte', NOMBRE: 'nombre', LISTE: 'liste',
  MULTI: 'multi', MOTS_CLES: 'motsCles', IMAGE: 'image', LONG: 'long',
  COMPOSANTS: 'composants'  // liste de composants à trois niveaux, avec catalogue
};

const MODE = {
  EGALITE: 'egalite',       // deux valeurs texte identiques
  NOMBRE: 'nombre',         // proximité numérique, avec tolérance
  DIMENSIONS: 'dimensions', // couple longueur x largeur
  ENSEMBLE: 'ensemble',     // recouvrement de deux listes
  MOTS_CLES: 'motsCles',    // recouvrement de vocabulaire, insensible aux accents
  COMPOSANTS: 'composants'  // appariement fonction -> norme -> référence
};

// Tous les porteurs Airbus Helicopters, et rien d'autre.
const PORTEURS = ['H125', 'H130', 'H135', 'H145', 'H145M', 'H155', 'H160', 'H160M',
                  'H175', 'H175M', 'H215', 'H215M', 'H225', 'H225M', 'NH90', 'Tigre',
                  'UH-72 Lakota'];

// Champs particuliers de la BOÎTE (le reste de ses colonnes est générique).
const CHAMPS_BOITE = {
  'Porteur':    { genre: GENRE.MULTI, liste: 'list-Porteur', ferme: true },
  'Statut':     { genre: GENRE.LISTE, liste: 'list-Statut' },
  'Composants': { genre: GENRE.COMPOSANTS, categorie: 'composant',
                  aide: 'boutons, voyants, interrupteurs — ce qui se voit et se manipule' },
  'Image':      { genre: GENRE.IMAGE },
  'Commentaires libres': { genre: GENRE.LONG }
};

// ------------------------------------------------------------
// Champs communs à tous les types
// ------------------------------------------------------------
const CHAMPS_COMMUNS = [
  { cle: 'Image', libelle: 'Image', genre: GENRE.IMAGE },
  { cle: 'Commentaires libres', libelle: 'Commentaires', genre: GENRE.LONG }
];

const CHAMPS_QUALIF = [
  { cle: 'Qualification Brouillard salin', libelle: 'Qualif. brouillard salin', genre: GENRE.MULTI, liste: 'list-Qualif' },
  { cle: 'Qualification Vibration', libelle: 'Qualif. vibration', genre: GENRE.MULTI, liste: 'list-Qualif' },
  { cle: 'Qualification Explosion', libelle: 'Qualif. explosion', genre: GENRE.MULTI, liste: 'list-Qualif' }
];

const CLES_QUALIF = CHAMPS_QUALIF.map(function (c) { return c.cle; });

// ------------------------------------------------------------
// Les types
// ------------------------------------------------------------
const TYPES = {
  structure: {
    cle: 'structure',
    libelle: 'Structure boîte',
    icone: '▤',
    teinte: 'type-structure',
    alias: ['structure boite', 'structure boîte', 'structure', 'boitier', 'boîtier'],
    resume: ['Montage', 'Dim Long (mm)', 'Masse (g)'],
    champs: [
      { cle: 'PN du type', libelle: 'PN du type', genre: GENRE.TEXTE, requis: true },
      { cle: 'Montage', libelle: 'Montage', genre: GENRE.LISTE, liste: 'list-Montage' },
      { cle: 'Nombre de pas', libelle: 'Nombre de pas', genre: GENRE.NOMBRE,
        aide: '1 pas ≈ 9,525 mm' },
      { cle: 'Dim Long (mm)', libelle: 'Longueur (mm)', genre: GENRE.NOMBRE },
      { cle: 'Dim Larg (mm)', libelle: 'Largeur (mm)', genre: GENRE.NOMBRE },
      { cle: 'Masse (g)', libelle: 'Masse (g)', genre: GENRE.NOMBRE },
      { cle: 'HL', libelle: 'HL', genre: GENRE.LISTE, liste: 'list-Niveau' },
      { cle: 'DAL', libelle: 'DAL', genre: GENRE.LISTE, liste: 'list-Niveau' }
    ].concat(CHAMPS_QUALIF, [
      // Deux familles distinctes, comparées séparément : ce qui est dur, et
      // ce qui tient les câbles. Les boutons et voyants, eux, sont sur la boîte.
      { cle: 'Structure mécanique', libelle: 'Structure mécanique', genre: GENRE.COMPOSANTS,
        categorie: 'mecanique', aide: CATEGORIES_COMPOSANT.mecanique.aide },
      { cle: 'Composants électriques', libelle: 'Composants électriques', genre: GENRE.COMPOSANTS,
        categorie: 'electrique', aide: CATEGORIES_COMPOSANT.electrique.aide }
    ], CHAMPS_COMMUNS),
    criteres: [
      { cle: 'montage', libelle: 'Montage', mode: MODE.EGALITE, champ: 'Montage', poids: 10 },
      { cle: 'pas', libelle: 'Nombre de pas', mode: MODE.NOMBRE, champ: 'Nombre de pas',
        tolerance: 0, unite: ' pas', poids: 8 },
      { cle: 'dimensions', libelle: 'Dimensions', mode: MODE.DIMENSIONS,
        champs: ['Dim Long (mm)', 'Dim Larg (mm)'], tolerance: 0.02, poids: 12 },
      { cle: 'masse', libelle: 'Masse', mode: MODE.NOMBRE, champ: 'Masse (g)',
        tolerance: 0.05, unite: ' g', poids: 8 },
      { cle: 'dal', libelle: 'DAL', mode: MODE.EGALITE, champ: 'DAL', poids: 4 },
      { cle: 'hl', libelle: 'HL', mode: MODE.EGALITE, champ: 'HL', poids: 4 },
      { cle: 'qualifications', libelle: 'Qualifications', mode: MODE.ENSEMBLE,
        champs: CLES_QUALIF, poids: 14 },
      { cle: 'mecanique', libelle: 'Structure mécanique', mode: MODE.COMPOSANTS,
        champ: 'Structure mécanique', poids: 20 },
      { cle: 'electrique', libelle: 'Composants électriques', mode: MODE.COMPOSANTS,
        champ: 'Composants électriques', poids: 20 }
    ]
  },

  harnais: {
    cle: 'harnais',
    libelle: 'Harnais',
    icone: '⌇',
    teinte: 'type-harnais',
    alias: ['harnais', 'harness', 'cablage', 'câblage', 'faisceau'],
    resume: ['Référence'],
    // Un harnais, c'est un PN et une référence. Rien d'autre n'est suivi.
    champs: [
      { cle: 'PN du type', libelle: 'PN du harnais', genre: GENRE.TEXTE, requis: true },
      { cle: 'Référence', libelle: 'Référence', genre: GENRE.TEXTE,
        aide: 'Référence de définition du harnais' }
    ].concat(CHAMPS_COMMUNS),
    // Un seul critère : l'écran de pondération le dit et n'affiche pas de curseur.
    criteres: [
      { cle: 'reference', libelle: 'Référence', mode: MODE.EGALITE, champ: 'Référence', poids: 100 }
    ]
  },

  plaquette: {
    cle: 'plaquette',
    libelle: 'Plaquette éclairante',
    icone: '▣',
    teinte: 'type-plaquette',
    alias: ['plaquette eclairante', 'plaquette éclairante', 'plaquette', 'plaque'],
    resume: ['Mots-clés'],
    // Une plaquette se retrouve par son vocabulaire, et par lui seul.
    champs: [
      { cle: 'PN du type', libelle: 'PN de la plaquette', genre: GENRE.TEXTE, requis: true },
      { cle: 'Mots-clés', libelle: 'Mots-clés', genre: GENRE.MOTS_CLES, liste: 'list-MotsCles',
        aide: 'Mission, fonction, libellés sérigraphiés' }
    ].concat(CHAMPS_COMMUNS),
    criteres: [
      { cle: 'motsCles', libelle: 'Mots-clés', mode: MODE.MOTS_CLES, champs: ['Mots-clés'], poids: 100 }
    ]
  },

  // Repli technique : une ligne dont le type n'est pas reconnu doit rester
  // lisible plutôt que de faire planter la fiche. Jamais proposé à la saisie
  // (masque: true), jamais une portée de pondération.
  autre: {
    cle: 'autre',
    libelle: 'Type non reconnu',
    icone: '◇',
    teinte: 'type-autre',
    masque: true,
    alias: [],
    resume: ['PN du type'],
    champs: [
      { cle: 'PN du type', libelle: 'PN du type', genre: GENRE.TEXTE, requis: true }
    ].concat(CHAMPS_COMMUNS),
    criteres: []
  }
};

// ------------------------------------------------------------
// Critères au niveau de la boîte
// ------------------------------------------------------------
const CRITERES_BOITE = [
  { cle: 'fonction', libelle: 'Fonction', mode: MODE.EGALITE, champ: 'Fonction', poids: 15 },
  { cle: 'qualification', libelle: 'Niveau de qualification', mode: MODE.EGALITE,
    champ: 'Niveau de qualification', poids: 10 },
  { cle: 'porteur', libelle: 'Porteur', mode: MODE.ENSEMBLE, champs: ['Porteur'], poids: 10 },
  { cle: 'architecture', libelle: 'Sous-ensembles', mode: MODE.ENSEMBLE,
    source: 'typesEnfants', poids: 25 },
  { cle: 'composants', libelle: 'Composants', mode: MODE.COMPOSANTS,
    champ: 'Composants', poids: 40 }
];

/** Tous les champs de composants, tous types confondus, avec leur catégorie. */
function champsComposants() {
  const liste = [{ portee: 'boite', cle: 'Composants', categorie: 'composant' }];
  typesProposes().forEach(function (t) {
    t.champs.forEach(function (c) {
      if (c.genre === GENRE.COMPOSANTS) liste.push({ portee: t.cle, cle: c.cle, categorie: c.categorie });
    });
  });
  return liste;
}

/** Types réellement proposés à la saisie (le repli technique est exclu). */
function typesProposes() {
  return Object.keys(TYPES).map(function (k) { return TYPES[k]; })
    .filter(function (t) { return !t.masque; });
}

/**
 * Portée INTERNE : la répartition des points entre les trois niveaux d'un
 * composant. Elle ne se compare à rien toute seule — on ne cherche pas
 * « les équivalences d'un niveau » — mais elle se pondère, et elle sert
 * partout où des composants sont comparés : sur la boîte comme sur la
 * structure. Une seule pondération pour les deux : la fonction, la norme et
 * la référence veulent dire la même chose des deux côtés.
 */
const PORTEE_COMPOSANT = {
  cle: 'composant',
  libelle: 'Niveaux de composant',
  icone: '◈',
  interne: true,
  criteres: NIVEAUX.map(function (n) {
    return { cle: n.cle, libelle: n.libelle, mode: MODE.EGALITE,
             poids: n.poids, aide: n.aide };
  })
};

const PORTEES = [{ cle: 'boite', libelle: 'Boîte', icone: '◼', criteres: CRITERES_BOITE }]
  .concat(typesProposes().map(function (t) {
    return { cle: t.cle, libelle: t.libelle, icone: t.icone, criteres: t.criteres };
  }))
  .concat([PORTEE_COMPOSANT]);

/** Les portées qu'on peut réellement comparer : l'interne n'en est pas une. */
function porteesComparables() {
  return PORTEES.filter(function (p) { return !p.interne; });
}

/** Cette portée compare-t-elle des composants ? Si oui, les niveaux se règlent. */
function porteeAvecComposants(portee) {
  return !!portee && !portee.interne &&
         portee.criteres.some(function (c) { return c.mode === MODE.COMPOSANTS; });
}

// ------------------------------------------------------------
// Résolution d'un libellé de type saisi librement
// ------------------------------------------------------------
function normaliserTexte(valeur) {
  return String(valeur === null || valeur === undefined ? '' : valeur)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')   // accents
    .toLowerCase().trim();
}

function typeDe(ligne) {
  const brut = normaliserTexte(ligne && ligne['Type']);
  if (!brut) return TYPES.autre;
  const cles = Object.keys(TYPES);
  for (let i = 0; i < cles.length; i++) {
    const t = TYPES[cles[i]];
    if (t.alias.some(function (a) { return normaliserTexte(a) === brut; })) return t;
  }
  for (let i = 0; i < cles.length; i++) {
    const t = TYPES[cles[i]];
    if (t.alias.some(function (a) { return brut.indexOf(normaliserTexte(a)) !== -1; })) return t;
  }
  return TYPES.autre;
}

function typeParCle(cle) { return TYPES[cle] || TYPES.autre; }

/** Libellé officiel à écrire dans la feuille pour un type choisi. */
function libelleType(cle) { return typeParCle(cle).libelle; }

/** Les colonnes réellement utilisées par un type (pour l'affichage). */
function champsDuType(type) { return type.champs; }

/** Toutes les colonnes possibles, tous types confondus. */
function toutesLesColonnesNom() {
  const vues = new Set(['ID_Ligne', 'PN Global', 'Type']);
  Object.keys(TYPES).forEach(function (k) {
    TYPES[k].champs.forEach(function (c) { vues.add(c.cle); });
  });
  return Array.from(vues);
}

/** Un type à un seul critère ne se pondère pas : il n'y a rien à arbitrer. */
function porteeArbitrable(portee) {
  return portee && portee.criteres.length > 1;
}

// ------------------------------------------------------------
// Mots-clés
// ------------------------------------------------------------
/** Découpe un champ de mots-clés en jetons normalisés et dédupliqués. */
function motsCles(valeur) {
  const jetons = String(valeur === null || valeur === undefined ? '' : valeur)
    .split(/[\n,;|/]+/)
    .map(function (m) { return m.trim(); })
    .filter(function (m) { return m !== ''; });
  const vus = new Set();
  const sortie = [];
  jetons.forEach(function (m) {
    const n = normaliserTexte(m);
    if (n && !vus.has(n)) { vus.add(n); sortie.push(m); }
  });
  return sortie;
}

function clesNormalisees(valeur) {
  return motsCles(valeur).map(normaliserTexte);
}
</script>
