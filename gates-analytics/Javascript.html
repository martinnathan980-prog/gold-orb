  function norm(v) {
    return String(v == null ? '' : v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  }
  function nb(n) { return n.toLocaleString('fr-FR'); }

  /* ============================================================
     SEMAINES ISO
     ============================================================ */
  function lundiDeLaSemaine(annee, semaine) {
    var jan4 = new Date(Date.UTC(annee, 0, 4));
    var jour = jan4.getUTCDay() || 7;
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jour + 1 + (semaine - 1) * 7);
    return lundi;
  }
  function etiquetteISO(d) {
    var t = new Date(d.getTime());
    var jour = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - jour);
    var debut = Date.UTC(t.getUTCFullYear(), 0, 1);
    var s = Math.ceil(((t.getTime() - debut) / 86400000 + 1) / 7);
    return t.getUTCFullYear() + '-S' + (s < 10 ? '0' : '') + s;
  }
  /** « 2026-S34 » -> le lundi de cette semaine. null si le libellé est illisible. */
  function lundiDeLibelle(libelle) {
    var m = /^\s*(\d{4})\s*-?\s*[sS]\s*(\d{1,2})\s*$/.exec(String(libelle || ''));
    if (!m) return null;
    var s = parseInt(m[2], 10);
    if (s < 1 || s > 53) return null;
    return lundiDeLaSemaine(parseInt(m[1], 10), s);
  }

     << A faire >> est une valeur saisie ; << vide >> est une cellule

  /* ⚠ Cette fonction existe à l'identique côté serveur (Code.gs) : le serveur
     s'en sert pour archiver les relevés, le client pour les compteurs filtrés.
     Toute modification doit être reportée des deux côtés. */
  function classer(valeur) {
    var s = norm(valeur);
    if (s === '' || s === '-') return 'vide';
    if (s.indexOf('a faire') !== -1 || s === 'non commence') return 'afaire';
    var n = parseFloat(s.replace(/[\s%]/g, '').replace(',', '.'));
    if (!isNaN(n)) {
      if (n >= 100) return 'termine';
      if (n <= 0) return 'afaire';
      return 'encours';
    }
    if (/(termine|acheve|cloture|solde|fini|ok)/.test(s)) return 'termine';
    return 'encours';
  }
  function pourcentDe(p) {
    var c = classer(p.avancement);
    if (c === 'termine') return 100;
    if (c === 'vide' || c === 'afaire') return 0;

     ANCIENNETE
     Dimension derivee de la colonne de date : un plan cree il y a longtemps

  /* Une date de création brute ferait autant de groupes que de jours : on

  /* Une date arrive telle que le classeur l'affiche : « 16/07/2020 » sur une
     feuille française, « 2020-07-16 » (avec ou sans heure) ailleurs. Ne lire
     qu'un seul des deux ordres reviendrait à ne jamais trouver l'ancienneté
     sur la moitié des exports — sans que rien ne le signale. */
  function anneeEtMois(valeur) {
    var t = String(valeur == null ? '' : valeur).trim();
    var iso = /^(\d{4})[-\/.](\d{1,2})/.exec(t);
    if (iso) {
      var mi = Number(iso[2]);
      return mi >= 1 && mi <= 12 ? { annee: Number(iso[1]), mois: mi } : null;
    }
    var fr = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(t);
    if (!fr) return null;
    var an = Number(fr[3]);
    if (an < 100) an += an < 70 ? 2000 : 1900;
    /* Jour puis mois, comme en France — sauf si le premier nombre dépasse
       douze : il est alors forcément le jour, et l'autre le mois. */
    var a = Number(fr[1]), b = Number(fr[2]);
    var mois = a > 12 ? b : (b > 12 ? a : b);
    return mois >= 1 && mois <= 12 ? { annee: an, mois: mois } : null;
  }
  /* Écart en mois entre une date de cellule et une date de référence.
     `null` quand la cellule ne porte pas de date lisible. */
  function moisEntre(valeur, reference) {
    var v = anneeEtMois(valeur);
    if (!v) return null;
    return (reference.getUTCFullYear() - v.annee) * 12 +

  }
  /* Exposée pour la batterie : une fonction pure se vérifie directement, cas

  window.__anneeEtMois = anneeEtMois;
  function moisDe(valeur) {
    var v = anneeEtMois(valeur);
    return v ? MOIS_COURT[v.mois - 1] + ' ' + v.annee : '\u2014';

  function rangMois(nom) {
    if (nom === '\u2014') return -1;
    var bout = nom.split(' ');
    return Number(bout[1]) * 12 + MOIS_COURT.indexOf(bout[0]);

  function ancienneteDepuis(valeur, reference) {

  function jeuDExemple() {
    function graine(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    var alea = graine(20260920);
    function tire(l) { return l[Math.floor(alea() * l.length)]; }
    function ent(a, b) { return a + Math.floor(alea() * (b - a + 1)); }

    /* Les blocs répétés par variante s'ouvrent repliés, comme dans le classeur :
       quarante-sept colonnes à l'ouverture, cent trente-huit d'un clic. */

  }
  function filtreActif() {
    return !!(vue.recherche || vue.etat || vue.groupe || vue.refs || vue.domaine || vue.reconduits ||
      Object.keys(vue.filtres).some(function (k) { return vue.filtres[k]; }) ||
      Object.keys(vue.vides).some(function (k) { return vue.vides[k]; }));
  }


  /* ============================================================ AVANCEMENT */

  /* Chaque chiffre se cale au centre de son segment de barre : la ligne devient
     la légende de la barre au lieu d'une rangée régulière. Les segments minces
     produisant des étiquettes qui se touchent, on les écarte après mesure
     plutôt que de deviner les largeurs à l'avance. */
  /* Les segments vides ne sont pas rendus : on releve les coupures reelles
     dans le DOM plutot que de les recalculer a partir des pourcentages. */
  function placerFilets() {
    var zone = $('filets'), barre = $('barre');
    if (!zone || !barre) return;
    var segs = Array.prototype.slice.call(barre.children);
    if (segs.length < 2 || window.matchMedia('(max-width: 680px)').matches) {
      zone.innerHTML = '';
      return;
    }
    var base = barre.getBoundingClientRect();
    zone.innerHTML = segs.slice(0, -1).map(function (seg) {
      var r = seg.getBoundingClientRect();
      return '\x3Ci style="left:' + (r.right - base.left + 1).toFixed(1) + 'px">\x3C/i>';
    }).join('');
  }

  function alignerEtats(c) {
    placerFilets();
    var zone = $('etats');
    var boutons = Array.prototype.slice.call(zone.querySelectorAll('.etat-btn'));
    if (!boutons.length) return;
    if (window.matchMedia('(max-width: 680px)').matches) {
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    var largeur = zone.getBoundingClientRect().width;
    if (!largeur || !c.total) return;

    var cumul = 0;
    var cibles = ETATS.map(function (e) {
      var part = (c[e.cle] / c.total) * largeur;
      var centre = cumul + part / 2;
      cumul += part;
      return centre;
    });

    // Placement au centre, puis on pousse vers la droite ce qui se chevauche…
    var gauches = boutons.map(function (b, i) { return cibles[i] - b.offsetWidth / 2; });
    for (var i = 1; i < boutons.length; i++) {
      var mini = gauches[i - 1] + boutons[i - 1].offsetWidth + 4;
      if (gauches[i] < mini) gauches[i] = mini;
    }
    // …puis on recale vers la gauche si le dernier sort du cadre.
    var debord = gauches[boutons.length - 1] + boutons[boutons.length - 1].offsetWidth - largeur;
    for (var k = boutons.length - 1; k >= 0 && debord > 0; k--) {
      gauches[k] -= debord;
      debord = k > 0 ? Math.max(0, (gauches[k - 1] + boutons[k - 1].offsetWidth + 4) - gauches[k]) : 0;
    }
    boutons.forEach(function (b, i) { b.style.left = Math.max(0, gauches[i]).toFixed(1) + 'px'; });
  }

  function rendreAvancement(liste) {
    var c = compte(liste);
    $('phrase').innerHTML = '\x3Cb>' + nb(c.termine) + '\x3C/b> sur ' + nb(c.total) + ' plans terminés' +
      (filtreActif() ? ' dans la sélection' : '');

    /* Le pourcentage se lit dans la barre : les chiffres du dessous n'ont plus
       qu'un sens possible, un nombre de plans. */
    $('barre').innerHTML = ETATS.map(function (e) {
      if (!c[e.cle]) return '';
      var part = (c[e.cle] / (c.total || 1)) * 100;
      var texte = part >= 6 ? Math.round(part) + '\u202f%' : '';
      return e.hachure
        ? '\x3Cspan class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
        : '\x3Cspan style="width:' + part.toFixed(2) + '%;background:' + e.couleur +
          ';color:' + encreSegment(e.cle) + '">' + texte + '\x3C/span>';
    }).join('');

    $('etats').innerHTML = ETATS.map(function (e) {
      var pastille = e.hachure
        ? '\x3Cspan class="pastille hachure">\x3C/span>'
        : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
      var actif = vue.etat === e.cle;
      return '\x3Cbutton class="etat-btn" type="button" data-etat="' + e.cle + '" style="--teinte:' + e.teinte +
        '" aria-pressed="' + actif + '" title="' + (actif ? 'Retirer le filtre' : 'N\u2019afficher que ces plans') + '">' +
        '\x3Cspan class="etat-haut">' + pastille + ech(e.libelle) + '\x3C/span>' +
        '\x3Cspan class="etat-n">' + nb(c[e.cle]) + '\x3C/span>\x3C/button>';
    }).join('');

    requestAnimationFrame(function () { alignerEtats(c); });
  }

  /* ============================================================ GRAPHIQUE */
  /* Série affichée : l'historique global, ou celui d'un groupe quand une ligne
     du bloc « Avancement FWD par… » est sélectionnée. Un filtre libre (recherche,
     colonne) ne peut pas s'appliquer rétroactivement à des comptes déjà archivés :
     dans ce cas le graphique reste sur l'ensemble, et le dit. */
  function serieAffichee() {
    if (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) {
      var pts = RELEVES.map(function (r) {
        var g = r.groupes[vue.groupe.dim][vue.groupe.val];
        return { i: r.i, total: g ? g.total : 0, termine: g ? g.termine : 0 };
      });
      return { pts: pts, portee: vue.groupe.val, partiel: false };
    }
    return {
      pts: RELEVES.map(function (r) { return { i: r.i, total: r.total, termine: r.termine }; }),
      portee: null,
      partiel: filtreActif()
    };
  }

  var L = 980, mG = 36, mD = 58, plotH = 160, ecart = 15, bandeH = 32, mBas = 24;
  var mHaut = 44, H = mHaut + plotH + ecart + bandeH + mBas;
  var HAUTEUR_ETIQUETTE = 17;
  var LARGEUR = L - mG - mD;
  var MAX_IDX = 104;                       // deux ans de visibilite maximum
  var derniereAnalyse = null;

  function bornerFenetre() {
    var f = vue.fen;
    f.span = Math.max(8, Math.min(f.span, MAX_IDX + 1));
    f.debut = Math.max(0, Math.min(f.debut, MAX_IDX - f.span + 1));
  }

  function rendreGraphique(liste) {
    bornerFenetre();
    var vueSerie = serieAffichee();
    var pts = vueSerie.pts;
    var dernier = pts[pts.length - 1];
    var total = Math.max(dernier.total, 1);
    var atteint = dernier.termine;
    var restants = total - atteint;
    var ryt = rythmes(pts);
    var vitesse = ryt ? ryt.central : 0;
    var projIdx = semaineFin(atteint, total, vitesse);

    $('note-graphe').textContent = vueSerie.portee
      ? 'Historique de ' + vueSerie.portee + ' · ' + RELEVES.length + ' relevés'
      : (vueSerie.partiel
          ? 'Historique de l’ensemble des plans : les relevés archivés ne peuvent pas être refiltrés.'
          : RELEVES.length + ' relevés depuis le premier import');
    var prochain = jalons.filter(function (j) { return j.i > AUJ; }).sort(function (a, b) { return a.i - b.i; })[0];

    var d0 = vue.fen.debut, span = vue.fen.span, d1 = d0 + span - 1;
    var pasX = LARGEUR / (span - 1);
    var x = function (i) { return mG + pasX * (i - d0); };

    /* Deux jalons proches ecrivaient l'un sur l'autre. On calcule l'emprise de
       chaque etiquette, puis on les repartit sur le plus petit nombre de
       niveaux ou aucune ne touche sa voisine. */
    var places = [];
    if (AUJ >= d0 && AUJ <= d1) {
      var xAuj = mG + pasX * (AUJ - d0);
      places.push({ aujourdhui: true, jx: xAuj, xa: xAuj - 72, xb: xAuj - 4 });
    }
    jalons.forEach(function (j, idx) {
      if (j.i < d0 || j.i > d1) return;
      var jx = x(j.i);
      var largeur = j.texte.length * 6.1 + 34;
      var versGauche = jx + largeur + 14 > L - mD;
      places.push({ j: j, idx: idx, jx: jx, largeur: largeur, versGauche: versGauche,
                    xa: versGauche ? jx - largeur - 4 : jx + 4,
                    xb: versGauche ? jx - 4 : jx + largeur + 4 });
    });
    places.sort(function (a, b) { return a.xa - b.xa; });
    var finDeNiveau = [];
    places.forEach(function (pl) {
      var n = 0;
      while (n < finDeNiveau.length && pl.xa < finDeNiveau[n] + 10) n++;
      pl.niveau = n;
      finDeNiveau[n] = pl.xb;
    });
    var niveaux = Math.max(1, finDeNiveau.length);
    mHaut = 26 + niveaux * HAUTEUR_ETIQUETTE;
    H = mHaut + plotH + ecart + bandeH + mBas;

    var y = function (v) { return mHaut + plotH - (v / total) * plotH; };
    var yBande = mHaut + plotH + ecart;
    var basTotal = yBande + bandeH;

    var s = ['\x3Csvg class="graphe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Plans termines par semaine, historique et projection">'];
    s.push('\x3Cdefs>\x3CclipPath id="zoneTracee">\x3Crect x="' + mG + '" y="' + (mHaut - 12) + '" width="' + LARGEUR + '" height="' + (plotH + 16) + '"/>\x3C/clipPath>\x3C/defs>');

    var pas = total <= 25 ? 5 : total <= 60 ? 20 : 50;
    for (var v = 0; v < total; v += pas) {
      if (total - v < pas * 0.5) continue;
      s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
      s.push('\x3Ctext class="grad" x="' + (mG - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + '\x3C/text>');
    }
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(total).toFixed(1) + '" y2="' + y(total).toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
    s.push('\x3Ctext class="grad" x="' + (L - mD + 8) + '" y="' + (y(total) + 3.5).toFixed(1) + '">' + nb(total) + '\x3C/text>');

    // Tout ce qui peut sortir du cadre est decoupe a la zone tracee.
    s.push('\x3Cg clip-path="url(#zoneTracee)">');

    var visibles = pts.filter(function (pt) { return pt.i >= d0 - 2 && pt.i <= d1 + 2; });
    if (visibles.length === 1) {
      s.push('\x3Ccircle cx="' + x(visibles[0].i).toFixed(1) + '" cy="' + y(visibles[0].termine).toFixed(1) +
             '" r="4.5" fill="var(--fait)"/>');
    }
    if (visibles.length > 1) {
      var chemin = visibles.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.termine).toFixed(1); }).join(' ');
      var xa = x(visibles[0].i).toFixed(1), xb = x(visibles[visibles.length - 1].i).toFixed(1);
      s.push('\x3Cpath d="' + chemin + ' L' + xb + ' ' + y(0).toFixed(1) + ' L' + xa + ' ' + y(0).toFixed(1) + ' Z" fill="var(--fait)" opacity=".11"/>');
      s.push('\x3Cpath d="' + chemin + '" fill="none" stroke="var(--fait)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>');
      visibles.forEach(function (pt) {
        if (pt.i === dernier.i) return;
        s.push('\x3Ccircle cx="' + x(pt.i).toFixed(1) + '" cy="' + y(pt.termine).toFixed(1) +
               '" r="3" fill="var(--surface)" stroke="var(--fait)" stroke-width="1.6"/>');
      });
    }

    var horsClip = [];
    var enRetard = false, requis = null;
    if (prochain && restants > 0) {
      requis = restants / (prochain.i - AUJ);
      enRetard = vitesse <= 0 || requis > vitesse;
      var cr = enRetard ? 'var(--alerte)' : 'var(--fait)';
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(prochain.i).toFixed(1) + ' ' + y(total).toFixed(1) + '" fill="none" stroke="' + cr + '" stroke-width="1.6"/>');
      s.push('\x3Ccircle cx="' + x(prochain.i).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="' + cr + '"/>');
    }

    if (projIdx !== null) {
      s.push('\x3Cpath d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(projIdx).toFixed(1) + ' ' + y(total).toFixed(1) +
             '" fill="none" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/>');
      if (projIdx >= d0 && projIdx <= d1) {
        s.push('\x3Ccircle cx="' + x(projIdx).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="none" stroke="var(--fait)" stroke-width="1.6"/>');
        var xp = Math.max(mG + 22, Math.min(x(projIdx), L - mD - 22));
        // Sous le plafond plutot qu'au-dessus : au-dessus, elle tombait dans la
        // bande des jalons et se superposait a leurs etiquettes.
        horsClip.push('\x3Ctext class="grad" x="' + xp.toFixed(1) + '" y="' + (y(total) + 16).toFixed(1) +
                      '" text-anchor="middle">' + etiquette(projIdx) + '\x3C/text>');
      }
      if (prochain && enRetard) {
        var auJalon = atteint + vitesse * (prochain.i - AUJ);
        var manque = Math.round(total - auJalon);
        if (manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
          var xj = x(prochain.i), y1 = y(auJalon), y2 = y(total);
          s.push('\x3Cline x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
          s.push('\x3Ctext class="grad" x="' + (xj + 7).toFixed(1) + '" y="' + ((y1 + y2) / 2 + 4).toFixed(1) + '" fill="var(--alerte)" font-weight="500">-' + manque + '\x3C/text>');
        }
      }
    }
    s.push('\x3C/g>');
    horsClip.forEach(function (t) { s.push(t); });

    if (AUJ >= d0 && AUJ <= d1) {
      s.push('\x3Cline x1="' + x(AUJ).toFixed(1) + '" x2="' + x(AUJ).toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--encre-3)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      s.push('\x3Ctext class="grad" x="' + (x(AUJ) - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="end">aujourd’hui\x3C/text>');
      s.push('\x3Ccircle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(atteint).toFixed(1) + '" r="4.5" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      s.push('\x3Ctext class="grad" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (y(atteint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500">' + atteint + '\x3C/text>');
    }

    // Jalons : poignee visible, deplacable a la souris, croix de suppression.
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      var critique = prochain && j.i === prochain.i && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-3)';
      var yBase = mHaut - 8 - pl.niveau * HAUTEUR_ETIQUETTE;   // haut du trait pour ce niveau
      var yTexte = yBase - 5;
      var xTexte = pl.versGauche ? jx - 10 : jx + 10;
      var xCroix = pl.versGauche ? pl.xa + 12 : pl.xb - 12;

      s.push('\x3Cg class="jalon" data-jalon="' + idx + '">');
      s.push('\x3Cline x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + basTotal.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="2 3"/>');
      s.push('\x3Cg class="jalon-poignee" data-jalon="' + idx + '" role="button" tabindex="0" aria-label="Jalon ' + ech(j.texte) + ' en ' + etiquette(j.i) + '. Fleches gauche et droite pour deplacer, Suppr pour retirer.">');
      s.push('\x3Crect class="jalon-fond" x="' + pl.xa.toFixed(1) + '" y="' + (yTexte - 12).toFixed(1) + '" width="' + pl.largeur.toFixed(1) + '" height="17" fill="var(--encre)" opacity="0" rx="2"/>');
      s.push('\x3Cpath d="M' + jx.toFixed(1) + ' ' + yBase.toFixed(1) + ' l-4 -5.5 l8 0 Z" fill="' + couleur + '"/>');
      s.push('\x3Ctext class="jalon-texte" x="' + xTexte.toFixed(1) + '" y="' + yTexte.toFixed(1) + '" text-anchor="' + (pl.versGauche ? 'end' : 'start') + '" fill="' + couleur + '">' + ech(j.texte) + '\x3C/text>');
      s.push('\x3C/g>');
      s.push('\x3Cg class="jalon-supp" data-jalon="' + idx + '" role="button" tabindex="0" aria-label="Supprimer le jalon ' + ech(j.texte) + '">');
      s.push('\x3Ccircle cx="' + xCroix.toFixed(1) + '" cy="' + (yTexte - 4).toFixed(1) + '" r="7" fill="transparent"/>');
      s.push('\x3Cpath d="M' + (xCroix - 3).toFixed(1) + ' ' + (yTexte - 7).toFixed(1) + ' l6 6 M' + (xCroix + 3).toFixed(1) + ' ' + (yTexte - 7) + ' l-6 6" stroke="' + couleur + '" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>');
      s.push('\x3C/g>\x3C/g>');
    });

    if (!prochain && d1 > AUJ + 2) {
      var xv = x(AUJ + Math.round((d1 - AUJ) / 2));
      s.push('\x3Ctext class="grad" x="' + xv.toFixed(1) + '" y="' + (mHaut + plotH * 0.86).toFixed(1) +
             '" text-anchor="middle">Aucun jalon \u00e0 venir \u2014 cliquez une semaine pour en poser un\x3C/text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < pts.length; k5++) {
      var dSem = pts[k5].i - pts[k5 - 1].i;
      if (dSem <= 0) continue;
      var parSem = (pts[k5].termine - pts[k5 - 1].termine) / dSem;
      for (var w = pts[k5 - 1].i + 1; w <= pts[k5].i; w++) taux.push({ i: w, v: parSem });
    }
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, t.v); });
    var lb = Math.min(15, pasX * 0.62);
    s.push('\x3Ctext class="grad" x="' + mG + '" y="' + (yBande - 3).toFixed(1) + '">terminés par semaine\x3C/text>');
    taux.forEach(function (t) {
      if (t.i < d0 || t.i > d1 || t.v <= 0) return;
      var h = (t.v / maxSem) * bandeH;
      s.push('\x3Crect x="' + (x(t.i) - lb / 2).toFixed(1) + '" y="' + (yBande + bandeH - h).toFixed(1) +
             '" width="' + lb.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--fait)" opacity=".42"/>');
    });
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + basTotal.toFixed(1) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    var saut = Math.max(1, Math.ceil(span / 11));
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && k3 !== AUJ) continue;
      var lib = etiquette(k3);
      s.push('\x3Ctext class="grad" x="' + x(k3).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             (lib.indexOf('2026-') === 0 ? lib.slice(5) : lib) + '\x3C/text>');
    }

    for (var k4 = d0; k4 <= d1; k4++) {
      s.push('\x3Crect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (plotH + ecart + bandeH + 6).toFixed(1) + '" fill="transparent" tabindex="0" role="button" data-i="' + k4 + '" ' +
             'aria-label="' + etiquette(k4) + (k4 <= AUJ ? ' : ' + pts[k4].termine + ' terminés' : ' (à venir)') + '. Activer pour poser un jalon."/>');
    }

    s.push('\x3C/svg>');
    $('zone-graphe').innerHTML = s.join('');

    var items = ['\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="var(--fait)" stroke-width="2.2"/>\x3C/svg>' +
      '\x3Cspan title="Nombre de plans pass\u00e9s \u00e0 100 %, cumul\u00e9 semaine apr\u00e8s semaine.">r\u00e9alis\u00e9\x3C/span>\x3C/span>'];
    if (ryt && restants > 0) {
      var explication = ryt.gagnes + ' plans termin\u00e9s en ' + ryt.semaines + ' semaines entre le premier ' +
        'et le dernier relev\u00e9, soit ' + vitesse.toFixed(1).replace('.', ',') + ' par semaine. ' +
        (projIdx !== null
          ? 'Les ' + restants + ' restants demandent ' + (projIdx - AUJ) + ' semaines de plus.'
          : 'Aucun plan sold\u00e9 sur la p\u00e9riode : pas de fin pr\u00e9visible.');
      items.push('\x3Cspan class="legende-item">\x3Csvg width="22" height="8" aria-hidden="true">' +
        '\x3Cline x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".65"/>\x3C/svg>' +
        '\x3Cspan title="' + explication + '">au rythme moyen (' + vitesse.toFixed(1).replace('.', ',') + '/sem.)' +
        (projIdx !== null ? ' \u2192 fin vers ' + etiquette(projIdx) : ' \u2014 pas de fin pr\u00e9visible') +
        '\x3C/span>\x3C/span>');
    }
    if (requis !== null) {
      items.push('\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6"/>\x3C/svg>' +
        '\x3Cspan title="' + restants + ' plans restants \u00e0 solder en ' + (prochain.i - AUJ) +
        ' semaines. Rouge si ce rythme d\u00e9passe le rythme actuel. D\u00e9placez le jalon pour recalculer.">' +
        'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb : ' +
        requis.toFixed(1).replace('.', ',') + '/sem.\x3C/span>\x3C/span>');
    }
    $('legende').innerHTML = items.join('');

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0 };
    majBoutonsZoom();
    planifierSauvegarde();
  }

  function majBoutonsZoom() {
    var boutons = document.querySelectorAll('.commandes-graphe .segmente button');
    for (var i = 0; i < boutons.length; i++) {
      var v = Number(boutons[i].dataset.span);
      boutons[i].setAttribute('aria-pressed', String(v === vue.fen.span));
    }
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  /* Poser, deplacer ou retirer un jalon change la fenetre avant echeance :
     le bloc par groupe en depend autant que la courbe. */
  function majJalons() {
    var sel = selection();
    rendreGraphique(sel);
    rendreCritique(sel);
    planifierSauvegarde();
    /* Dans le classeur, les jalons sont partagés : ils repartent au serveur,
       sinon la collègue et sa chef n'auraient pas les mêmes. */
    if (API && API.sauverJalons) {
      API.sauverJalons(jalons.map(function (j) {
        return { id: j.id || null, semaine: etiquette(j.i), texte: j.texte };
      }));
    }
  }

  function reglerSpan(span) {
    vue.fen.span = span || spanTout();
    vue.fen.debut = span ? Math.max(0, AUJ - Math.round(vue.fen.span * 0.45)) : 0;
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;

  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var supp = e.target.closest ? e.target.closest('.jalon-supp') : null;
    if (supp) {
      e.preventDefault();
      jalons.splice(Number(supp.dataset.jalon), 1);
      majJalons();
      return;
    }
    var poignee = e.target.closest ? e.target.closest('.jalon-poignee') : null;
    if (poignee) {
      e.preventDefault();
      glisse = { type: 'jalon', idx: Number(poignee.dataset.jalon), x0: e.clientX, i0: jalons[Number(poignee.dataset.jalon)].i, bouge: false };
      cadreGraphe.dataset.glisseJalon = 'true';
    } else if (!(e.target.closest && e.target.closest('#saisie-jalon'))) {
      /* Le glissement part de n'importe quel point du cadre. Le limiter aux
         bandes cliquables laissait mortes la frise des jalons en haut et la
         marge du bas, alors que le curseur y promettait deja la main. */
      var surGraphe = !!(e.target.closest && e.target.closest('svg'));
      glisse = {
        type: 'pan', x0: e.clientX, debut0: vue.fen.debut, bouge: false,
        i: surGraphe ? indexSousCurseur(e.clientX) : null
      };
    } else return;
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    var span1 = Math.max(8, Math.min(MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));
    rendreGraphique(selection());
  }, { passive: false });

  cadreGraphe.addEventListener('pointermove', function (e) {
    if (!glisse) return;
    var dx = e.clientX - glisse.x0;
    if (Math.abs(dx) > 4) glisse.bouge = true;
    if (!glisse.bouge) return;
    var semaines = dx / pxParSemaine();
    if (glisse.type === 'jalon') {
      var ni = Math.max(0, Math.min(MAX_IDX, Math.round(glisse.i0 + semaines)));
      if (jalons[glisse.idx] && jalons[glisse.idx].i !== ni &&
          !jalons.some(function (j, k) { return k !== glisse.idx && j.i === ni; })) {
        jalons[glisse.idx].i = ni;
        majJalons();
      }
    } else {
      cadreGraphe.dataset.glisse = 'true';
      var nd = Math.round(glisse.debut0 - semaines);
      if (nd !== vue.fen.debut) { vue.fen.debut = nd; rendreGraphique(selection()); }
    }
  });

  function finGlisse(e) {
    if (!glisse) return;
    var g = glisse;
    glisse = null;
    cadreGraphe.dataset.glisse = 'false';
    cadreGraphe.dataset.glisseJalon = 'false';
    if (g.type === 'jalon') {
      jalons.sort(function (a, b) { return a.i - b.i; });
      majJalons();
      return;
    }
    if (!g.bouge && g.i !== null) ouvrirSaisie(g.i, e ? e.clientX : null);
  }
  cadreGraphe.addEventListener('pointerup', finGlisse);
  cadreGraphe.addEventListener('pointercancel', function () { finGlisse(null); });

  /* Infobulle */
  cadreGraphe.addEventListener('mousemove', function (e) {
    if (glisse && glisse.bouge) { $('bulle').dataset.visible = 'false'; return; }
    if (!e.target.closest || !e.target.closest('.zone-clic')) { $('bulle').dataset.visible = 'false'; return; }
    var i = indexSousCurseur(e.clientX);
    var a = derniereAnalyse;
    if (i === null || !a) return;
    var bulle = $('bulle');
    var k = -1;
    for (var q = 0; q < a.pts.length; q++) if (a.pts[q].i === i) k = q;
    if (k !== -1) {
      var pt = a.pts[k];
      var gagne = k > 0 ? pt.termine - a.pts[k - 1].termine : null;
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">Relevé du ' + etiquette(i) + '\x3C/div>' +
        '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille" style="background:var(--fait)">\x3C/span>terminés\x3Cspan class="n">' + pt.termine + '\x3C/span>\x3C/div>' +
        '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille" style="background:var(--filet-fort)">\x3C/span>sur\x3Cspan class="n">' + pt.total + '\x3C/span>\x3C/div>' +
        (gagne !== null ? '\x3Cdiv class="bulle-ligne" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--filet)">depuis le précédent\x3Cspan class="n">' + (gagne > 0 ? '+' : '') + gagne + '\x3C/span>\x3C/div>' : '') +
        finisCetteSemaine(i);
    } else {
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">' + etiquette(i) + '\x3C/div>\x3Cdiv class="bulle-ligne">' +
        (i > AUJ ? 'À venir · cliquez pour poser un jalon' : 'Pas de relevé cette semaine-là') + '\x3C/div>';
    }
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  /* Sous la courbe, les noms. « +6 cette semaine » ne dit pas lesquels : la
     bulle donne les références passées en terminé, c'est ce qu'on vient
     chercher en pointant une semaine. */
  var MAX_BULLE = 8;
  function finisCetteSemaine(i) {
    var sem = JOURNAL.filter(function (s) { return s.i === i; })[0];
    if (!sem) return '';
    var finis = sem.evenements.filter(function (e) { return e.apres === 'termine'; });
    if (!finis.length) return '';
    var liste = finis.slice(0, MAX_BULLE).map(function (e) {
      var plan = PLAN_PAR_REF[e.ref];
      var quoi = plan && CLE_LIBELLE ? String(plan[CLE_LIBELLE] || '') : '';
      return '\x3Cdiv class="bulle-ud">\x3Cspan class="r">' + ech(e.ref) + '\x3C/span>' +
        (quoi ? '\x3Cspan class="q">' + ech(quoi) + '\x3C/span>' : '') + '\x3C/div>';
    }).join('');
    var reste = finis.length - MAX_BULLE;
    return '\x3Cdiv class="bulle-finis">\x3Cdiv class="tete-bulle">' +
      nb(finis.length) + ' pass\u00e9' + (finis.length > 1 ? 's' : '') + ' en termin\u00e9\x3C/div>' +
      liste + (reste > 0 ? '\x3Cdiv class="bulle-reste">et ' + nb(reste) + ' autre' + (reste > 1 ? 's' : '') + '\u2026\x3C/div>' : '') +
      '\x3C/div>';
  }

  cadreGraphe.addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  /* Clavier : deplacer ou supprimer un jalon sans souris */
  cadreGraphe.addEventListener('keydown', function (e) {
    var poignee = e.target.closest ? e.target.closest('.jalon-poignee') : null;
    if (poignee) {
      var idx = Number(poignee.dataset.jalon);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        var ni = Math.max(0, Math.min(MAX_IDX, jalons[idx].i + (e.key === 'ArrowRight' ? 1 : -1)));
        if (!jalons.some(function (j, k) { return k !== idx && j.i === ni; })) {
          jalons[idx].i = ni;
          majJalons();
        }
        return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault(); jalons.splice(idx, 1); majJalons(); return;
      }
    }
    var supp = e.target.closest ? e.target.closest('.jalon-supp') : null;
    if (supp && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); jalons.splice(Number(supp.dataset.jalon), 1); majJalons(); return;
    }
    var bande = e.target.closest ? e.target.closest('.zone-clic') : null;
    if (bande && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); ouvrirSaisie(Number(bande.dataset.i), null);
    }
  });

  var iSaisie = null;
  function ouvrirSaisie(i, clientX) {
    if (i === null || i < 0 || i > MAX_IDX) return;
    if (jalons.some(function (j) { return j.i === i; })) return;
    iSaisie = i;
    var boite = $('saisie-jalon');
    var cadre = cadreGraphe.getBoundingClientRect();
    $('jalon-semaine').textContent = etiquette(i);
    boite.dataset.ouvert = 'true';
    var centre = clientX !== null ? clientX - cadre.left : cadre.width / 2;
    boite.style.left = Math.max(0, Math.min(centre - boite.offsetWidth / 2, cadre.width - boite.offsetWidth)) + 'px';
    boite.style.top = (mHaut + 10) + 'px';
    $('champ-jalon').value = '';
    $('champ-jalon').focus();
  }
  function fermerSaisie() { $('saisie-jalon').dataset.ouvert = 'false'; iSaisie = null; }
  $('saisie-jalon').addEventListener('submit', function (e) {
    e.preventDefault();
    if (iSaisie === null) return;
    jalons.push({ i: iSaisie, texte: $('champ-jalon').value.trim() || 'Jalon' });
    jalons.sort(function (a, b) { return a.i - b.i; });
    fermerSaisie();
    majJalons();
  });
  $('champ-jalon').addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); fermerSaisie(); } });

  document.querySelector('.commandes-graphe .segmente').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-span]');
    if (b) reglerSpan(Number(b.dataset.span));
  });

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y
     laisse aucune trace tant que les autres avancent. On projette donc
     chaque groupe a SON rythme, et on regarde lequel arrive le dernier.
     ============================================================ */
  var FENETRE = 6;

  /* L'explication ne vaut que chiffree : on reprend une ligne reelle du bloc et
     on y refait le calcul pas a pas, plutot qu'un exemple invente. */
  function panneauAide(rangs, prochain, semainesJalon) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restants > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    function d(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
    /* Dans l'exemple, un rythme arrondi au dixieme ne redonnerait pas la date
       affichee : on garde deux decimales, sans zero inutile. */
    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

    var h = '\x3Cdiv class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment la fin estimée est calculée">';
    h += '\x3Ch3>D’où vient la fin estimée ?\x3C/h3>';
    h += '\x3Cp>GATES ne donne qu’une photo du jour, sans historique. On archive donc un relevé à chaque import, ' +
         'puis on compare le premier au dernier et on prolonge la pente en ligne droite.\x3C/p>';
    h += '\x3Cdiv class="aide-formule">' +
         'rythme   = (terminés aujourd’hui − terminés au 1\x3Csup>er\x3C/sup> relevé) ÷ semaines écoulées\n' +
         'restants = total − terminés aujourd’hui\n' +
         '\x3Cb>fin      = semaine actuelle + arrondi supérieur(restants ÷ rythme)\x3C/b>' +
         '\x3C/div>';

    if (ex) {
      var depart = ex.termine - ex.rythme.gagnes;
      var sem = ex.fin - AUJ;
      h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Exemple — ' + ech(TITRE_DIM[vue.dimCritique].replace(/ \(.*\)$/, '')) +
           ' ' + ech(ex.nom) + ', au dernier import\x3C/span>' +
           'rythme   = (' + ex.termine + ' − ' + depart + ') ÷ ' + ex.rythme.semaines + ' sem. = ' +
           d2(ex.vitesse) + ' plan par semaine\n' +
           'restants = ' + ex.total + ' − ' + ex.termine + ' = ' + ex.restants + ' plans\n' +
           '\x3Cb>fin      = ' + ex.restants + ' ÷ ' + d2(ex.vitesse) + ' = ' + sem + ' semaines → ' +
           etiquette(AUJ) + ' + ' + sem + ' = ' + etiquette(ex.fin) + '\x3C/b>' +
           '\x3C/div>';
      if (prochain && semainesJalon > 0) {
        h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Et les deux colonnes voisines, sur la même ligne\x3C/span>' +
             'à solder/sem. = restants ÷ semaines avant le jalon\n' +
             '              = ' + ex.restants + ' ÷ ' + semainesJalon + ' = ' + d(ex.requis) +
             ' → affiché ' + Math.ceil(ex.requis) + ' (on n’achève pas un demi-plan)\n' +
             'effort        = à solder/sem. ÷ rythme actuel\n' +
             '              = ' + d(ex.requis) + ' ÷ ' + d2(ex.vitesse) + ' = ×' + d(ex.tension) +
             (ex.tension > 1 ? '  → il faut aller ' + d(ex.tension) + ' fois plus vite qu’aujourd’hui'
                             : '  → le rythme actuel suffit') +
             '\x3C/div>';
      }
    } else {
      h += '\x3Cp>Aucun groupe de la sélection n’a de rythme exploitable pour l’instant : ' +
           'il faut au moins deux relevés et un plan terminé entre les deux.\x3C/p>';
    }

    h += '\x3Cp>Un groupe qui n’a rien soldé depuis le premier relevé n’a pas de rythme : sa fin reste « — ». ' +
         'La date se recalcule à chaque import et peut reculer — ce n’est pas un engagement, ' +
         'c’est ce que dit le rythme tenu jusqu’ici.\x3C/p>';
    return h + '\x3C/div>';
  }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc
     les références, les non terminées d'abord — ce sont celles sur lesquelles
     il y a quelque chose à faire. */
  var MAX_UD = 36;
  function listeUD(r) {
    var ordre = { afaire: 0, vide: 1, encours: 2, termine: 3 };
    var plans = (r.plans || []).slice().sort(function (a, b) {
      return (ordre[a._etat] - ordre[b._etat]) || a.reference.localeCompare(b.reference, 'fr', { numeric: true });
    });
    if (!plans.length) return '';
    var restants = plans.filter(function (p) { return p._etat !== 'termine'; }).length;
    var jetons = plans.slice(0, MAX_UD).map(function (p) {
      var e = ETAT_PAR_CLE[p._etat];
      var pastille = e.hachure
        ? '\x3Cspan class="pastille hachure">\x3C/span>'
        : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
      var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
      return '\x3Cbutton class="jeton-ud" type="button" data-ud="' + ech(p.reference) +
        '" title="' + ech(e.court + (quoi ? ' — ' + quoi : '')) + '">' +
        pastille + ech(p.reference) + '\x3C/button>';
    }).join('');
    var reste = plans.length - MAX_UD;
    return '\x3Cdiv class="groupe-refs">\x3Cdiv class="entete">' +
      '\x3Cspan>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (restants ? ' · \x3Cb>' + nb(restants) + '\x3C/b> pas encore terminé' + (restants > 1 ? 's' : '') : ' · tout est soldé') +
      '\x3C/span>\x3Cspan>cliquez une référence pour la retrouver dans le tableau\x3C/span>\x3C/div>' +
      '\x3Cdiv class="grille">' + jetons +
      (reste > 0 ? '\x3Cspan class="jeton-ud" style="cursor:default">et ' + nb(reste) + ' autres…\x3C/span>' : '') +
      '\x3C/div>\x3C/div>';
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    var prochain = jalons.filter(function (j) { return j.i > AUJ; })
      .sort(function (a, b) { return a.i - b.i; })[0];

    // Répartition : état du jour, filtrée comme le reste de la page.
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [] };
      groupes[k].total++;
      groupes[k][p._etat]++;
      groupes[k].plans.push(p);
    });

    /* Rythme : il vient des relevés archivés, qui portent sur l'ensemble des
       plans du groupe. Un comptage déjà figé ne peut pas être refiltré. */

    var semainesJalon = prochain ? prochain.i - AUJ : 0;
    var rangs = Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      var restants = g.total - g.termine;
      // Même méthode que la courbe : l'étendue des rythmes réellement tenus.
      var serieGroupe = RELEVES.map(function (rel) {
        var gr = rel.groupes[dim] && rel.groupes[dim][k];
        return { i: rel.i, termine: gr ? gr.termine : 0 };
      });
      var rg = rythmes(serieGroupe);
      var vitesse = rg ? rg.central : 0;
      return {
        rythme: rg,
        nom: g.nom, total: g.total, restants: restants, vitesse: vitesse, plans: g.plans,
        termine: g.termine, encours: g.encours, afaire: g.afaire, vide: g.vide,
        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restants === 0 ? AUJ : semaineFin(g.termine, g.total, vitesse),
        // L'effort demandé : combien il faut solder par semaine pour tenir le
        // jalon, et par quel facteur cela dépasse le rythme actuel du groupe.
        requis: semainesJalon > 0 ? restants / semainesJalon : 0,
        tension: (semainesJalon > 0 && vitesse > 0) ? (restants / semainesJalon) / vitesse : Infinity
      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      if (cle === 'total') return r.total;
      if (cle === 'pct') return r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'tension') return r.vitesse > 0 ? r.tension : Infinity;
      if (cle === 'fin') return r.fin === null ? Infinity : r.fin;
      return 0;
    }
    var tg = vue.triGroupe;
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {
        var x = cleTri(a, tg.cle), y = cleTri(b, tg.cle);
        if (typeof x === 'string') {
          // Les codes ATA sont des nombres ecrits en texte : on les compare comme tels.
          var nx = parseFloat(x), ny = parseFloat(y);
          if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return (nx - ny) * signe;
          return x.localeCompare(y, 'fr', { numeric: true }) * signe;
        }
        if (x === y) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        // Infinity des deux cotes : egalite, on retombe sur le nom.
        if (!isFinite(x) && !isFinite(y)) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        return (x < y ? -1 : 1) * signe;
      });
    } else {
      rangs.sort(function (a, b) {
        if ((a.restants === 0) !== (b.restants === 0)) return a.restants === 0 ? 1 : -1;
        if (prochain) return b.tension - a.tension;
        if ((a.fin === null) !== (b.fin === null)) return a.fin === null ? -1 : 1;
        return (b.fin || 0) - (a.fin || 0);
      });
    }

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucun plan dans la sélection.\x3C/div>';
      return;
    }

    function fleche(cle) {
      if (!tg || tg.cle !== cle) return '';
      return '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
    }
    function entete(cle, libelle, titre, classe) {
      var actif = !!(tg && tg.cle === cle);
      return '\x3Cspan class="' + (classe || '') + '">\x3Cbutton type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +
        (titre ? ' title="' + ech(titre) + '"' : '') + '>' + ech(libelle) + fleche(cle) + '\x3C/button>';
    }

    function aide(quoi) {
      return '\x3Cbutton type="button" class="aide" data-aide="1" aria-expanded="' + (!!vue.aideFin) +
        '" aria-controls="panneau-fin" title="Comment ' + ech(quoi) + ' se calcule">?\x3C/button>';
    }

    var html = '\x3Cdiv class="critique-tete">' +
      entete('nom', TITRE_DIM[dim].replace(/ \(.*\)$/, ''), TITRE_DIM[dim]) + '\x3C/span>' +
      entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '\x3C/span>' +
      entete('pct', 'répartition FWD', 'Trier par part de plans terminés.', 'a-gauche') + '\x3C/span>' +
      entete('fin', 'fin estimée', 'Date d’arrivée si le rythme actuel se maintient.') + aide('la fin estimée') + '\x3C/span>' +
      (prochain
        ? entete('tension', 'effort demandé', 'Ce qu\'il faudrait solder chaque semaine pour tenir le jalon, comparé au rythme réellement tenu.') + aide('l’effort demandé') + '\x3C/span>'
        : entete('tension', 'rythme actuel', 'Plans terminés par semaine depuis le premier relevé.') + aide('le rythme actuel') + '\x3C/span>') +
      '\x3C/div>';

    if (vue.aideFin) html += panneauAide(rangs, prochain, semainesJalon);

    /* Toutes les lignes sont là — « Date création par mois » peut en faire
       quatre-vingts — mais le bloc a une hauteur : on descend dedans au lieu
       de pousser le reste de la page vers le bas. */
    html += rangs.map(function (r) {
      var actif = vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom;

      /* Le pourcentage s'ecrit dans le segment quand il y tient ; en dessous
         il reste dans l'infobulle plutot que d'etre rogne. */
      var barre = ETATS.map(function (e) {
        if (!r[e.cle]) return '';
        var part = (r[e.cle] / r.total) * 100;
        var texte = part >= 11 ? Math.round(part) + ' %' : '';
        var encre = encreSegment(e.cle);
        return e.hachure
          ? '\x3Cspan class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '\x3C/span>'
          : '\x3Cspan style="width:' + part.toFixed(2) + '%;background:' + e.couleur + ';color:' + encre + '">' + texte + '\x3C/span>';
      }).join('');

      /* Une seule colonne d'appoint : l'effort demandé quand un jalon fixe une
         échéance, le rythme réellement tenu sinon. « À solder par semaine » a
         été retiré : personne ne suivait un nombre par semaine. */
      var col2;
      if (!prochain) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme actuel">\x3Cspan class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? r.vitesse.toFixed(1).replace('.', ',') + '/sem.' : 'rien de soldé') +
          '\x3C/span>\x3C/span>';
      } else if (r.restants === 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart">tout est soldé\x3C/span>\x3C/span>';
      } else if (r.vitesse <= 0) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé">\x3Cspan class="v critique-ecart arret">rien de soldé\x3Csmall>aucun rythme\x3C/small>\x3C/span>\x3C/span>';
      } else {
        col2 = '\x3Cspan class="critique-effort" data-libelle="effort demandé" title="' + r.restants +
          ' plans restants à répartir sur ' + semainesJalon + ' semaines, soit ' +
          r.requis.toFixed(1).replace('.', ',') + ' par semaine.">\x3Cspan class="v critique-ecart">' +
          (r.tension > 1 ? '\x3Cb class="tard">×' + r.tension.toFixed(1).replace('.', ',') + '\x3C/b>'
                         : '×' + r.tension.toFixed(1).replace('.', ',')) +
          '\x3Csmall>rythme ' + r.vitesse.toFixed(1).replace('.', ',') + '/sem.\x3C/small>\x3C/span>\x3C/span>';
      }

      // --- colonne chiffree 3 : la date d'arrivee au rythme actuel
      var texteFin = r.restants === 0 ? 'soldé' : (r.fin === null ? '—' : etiquette(r.fin));
      var col3 = '\x3Cspan class="critique-date' + (r.fin === null && r.restants !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" title="' +
        (r.restants === 0 ? 'Plus rien à solder dans ce groupe.'
          : r.fin === null ? 'Aucun plan terminé depuis le premier relevé : pas de rythme, donc pas de date.'
          : r.restants + ' plans restants à ' + r.vitesse.toFixed(1).replace('.', ',') +
            ' par semaine, soit ' + (r.fin - AUJ) + ' semaines.') +
        '">\x3Cspan class="v">' + texteFin + '\x3C/span>\x3C/span>';

      return '\x3Cbutton class="critique-ligne" type="button" data-groupe="' + ech(r.nom) + '" aria-pressed="' + !!actif +
        '" title="' + r.termine + ' terminés, ' + r.encours + ' en cours, ' + r.afaire + ' à faire, ' +
        r.vide + ' non renseignés — cliquez pour voir lesquels">' +
        '\x3Cspan class="critique-nom">' + ech(libelleGroupe(r.nom)) + '\x3C/span>' +
        '\x3Cspan class="critique-total" data-libelle="plans">' + r.total + '\x3C/span>' +
        '\x3Cspan class="critique-barre">' + barre + '\x3C/span>' +
        col3 + col2 + '\x3C/button>' +
        (actif ? listeUD(r) : '');
    }).join('');



    /* toggle et non className : le conteneur porte aussi « defile-liste »,
       qui lui donne sa hauteur et sa barre de défilement. */
    $('zone-critique').classList.toggle('sans-jalon', !prochain);
    $('zone-critique').innerHTML = html;
    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    $('titre-groupe').textContent = 'Avancement FWD par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '');
    $('indice-dim').textContent = NOTE_DIM(dim);

  }

  /* L'ordre du sélecteur est celui que donne la source : quand la liste est
     fixée à la main, c'est l'ordre demandé qui compte, pas celui de la feuille. */
  /* Le sélecteur est rangé par ordre alphabétique : on y cherche un nom, pas
     une position dans la feuille. */
  /* Deux dimensions viennent de la même colonne de date et se confondent
     facilement : on dit laquelle répond à quelle question. */
  function NOTE_DIM(dim) {
    var titreDate = CLE_DATE && PAR_CLE[CLE_DATE] ? PAR_CLE[CLE_DATE].titre.toLowerCase() : 'date de création';
    if (dim === '_anciennete') {
      return 'Depuis combien de temps le plan existe, en quatre tranches calculées sur « ' + titreDate +
        ' ». Répond à « qu\u2019est-ce qui traîne depuis longtemps ? ».';
    }
    if (dim === '_mois') {
      return 'Le mois où le plan a été créé, un groupe par mois, rangés dans l\u2019ordre du temps. ' +
        'Répond à « de quelle vague vient ce lot ? » \u2014 l\u2019ancienneté, elle, regroupe en tranches.';
    }
    if (dim === 'avancement') {
      return 'La valeur brute de la colonne d\u2019avancement, telle qu\u2019elle est saisie : ' +
        'd\u2019un coup d\u2019\u0153il, toutes les façons de l\u2019écrire, donc les saisies qui divergent.';
    }
    return '';
  }

  var DIMENSIONS = CLES_DIM
    .filter(function (c) { return c !== '_mois' && PAR_CLE[c]; })
    .map(function (c) { return PAR_CLE[c]; })
    .concat(CLE_DATE ? [{ cle: '_mois', titre: PAR_CLE[CLE_DATE].titre + ' (par mois)' }] : [])
    .sort(function (a, b) { return a.titre.localeCompare(b.titre, 'fr'); });
  var TITRE_DIM = {};
  DIMENSIONS.forEach(function (d) { TITRE_DIM[d.cle] = d.titre; });

  function remplirDims() {
    $('dim-critique').innerHTML = DIMENSIONS.map(function (d) {
      return '\x3Coption value="' + d.cle + '">' + ech(d.titre) + '\x3C/option>';
    }).join('');
    $('dim-critique').value = vue.dimCritique;
  }

  /* ============================================================ TABLEAU */
  function visibles() {
    return vue.ordre.filter(function (k) { return !vue.cachees[k]; }).map(function (k) { return PAR_CLE[k]; });
  }
  /* Combien de colonnes restent collees a gauche : tout ce qui precede la
     reference, plus elle. Dans l'ordre de la feuille la reference arrive en
     deuxieme ; en vue essentielle elle ouvre le tableau. Le calcul suit
     l'ordre affiche au lieu de le supposer. */
  function nbFigees(cols) {
    for (var i = 0; i < cols.length; i++) if (cols[i].fige) return i + 1;
    return 0;
  }
  function classeFige(i, n) {
    if (i >= n) return '';
    return i === n - 1 ? 'col-fige fige-fin' : 'col-fige';
  }
  function rendreEntetes() {
    var cols = visibles();
    var nFige = nbFigees(cols);
    /* Un groupe a cheval sur la limite du bloc fige est coupe en deux : la
       moitie collee garde le libelle, la suite le laisse vide pour que la
       bande se lise d'un trait. */
    var groupes = [];
    cols.forEach(function (c, i) {
      var colle = i < nFige;
      var d = groupes[groupes.length - 1];
      if (d && d.nom === c.groupe && d.fige === colle) d.n++;
      else groupes.push({ nom: c.groupe, n: 1, fige: colle, debut: i, suite: !!(d && d.nom === c.groupe) });
    });
    var html = '\x3Ctr class="groupes">' + groupes.map(function (g) {
      var cl = g.fige ? (g.debut + g.n === nFige ? 'col-fige fige-fin' : 'col-fige') : '';
      return '\x3Cth colspan="' + g.n + '" data-debut="' + g.debut + '"' + (cl ? ' class="' + cl + '"' : '') +
        '>' + ech(g.suite ? '' : g.nom) + '\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="titres">' + cols.map(function (c, i) {
      var actif = vue.tri.cle === c.cle;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (vue.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      var poignee = c.fige ? '' : '\x3Cspan class="poignee" aria-hidden="true">\x3Csvg width="7" height="12" viewBox="0 0 7 12" fill="currentColor">' +
        '\x3Ccircle cx="1.6" cy="2" r="1.1"/>\x3Ccircle cx="5.4" cy="2" r="1.1"/>\x3Ccircle cx="1.6" cy="6" r="1.1"/>' +
        '\x3Ccircle cx="5.4" cy="6" r="1.1"/>\x3Ccircle cx="1.6" cy="10" r="1.1"/>\x3Ccircle cx="5.4" cy="10" r="1.1"/>\x3C/svg>\x3C/span>';
      var cl = classeFige(i, nFige);
      return '\x3Cth scope="col" data-cle="' + c.cle + '"' + (cl ? ' class="' + cl + '"' : '') +
        (c.fige ? '' : ' draggable="true"') +
        ' aria-sort="' + (actif ? (vue.tri.asc ? 'ascending' : 'descending') : 'none') + '">' +
        poignee + '\x3Cbutton type="button" data-tri="' + c.cle + '">' + ech(c.titre) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="filtres">' + cols.map(function (c, i) {
      var val = vue.filtres[c.cle] || '';
      var cl = classeFige(i, nFige);
      return '\x3Cth' + (cl ? ' class="' + cl + '"' : '') + '>\x3Cinput type="text" data-filtre="' + c.cle + '" value="' + ech(val) +
        '" placeholder="filtrer" data-actif="' + (!!val) + '" aria-label="Filtrer ' + ech(c.titre) + '">\x3C/th>';
    }).join('') + '\x3C/tr>';
    $('tete-tableau').innerHTML = html;
    ajusterSticky();
  }
  function ajusterSticky() {
    requestAnimationFrame(function () {
      var g = document.querySelector('.groupes'), t = document.querySelector('.titres'), f = document.querySelector('.filtres');
      if (!g || !t || !f) return;
      var hg = g.getBoundingClientRect().height;
      var ht = t.getBoundingClientRect().height;
      t.querySelectorAll('th').forEach(function (th) { th.style.top = hg + 'px'; });
      f.querySelectorAll('th').forEach(function (th) { th.style.top = (hg + ht) + 'px'; });

      /* On mesure les colonnes collees et on les pose les unes apres les
         autres. Sans ce cumul, la deuxieme viendrait recouvrir la premiere. */
      var tetes = t.querySelectorAll('th');
      var gauche = [], cumul = 0;
      for (var i = 0; i < tetes.length; i++) {
        if (!tetes[i].classList.contains('col-fige')) break;
        gauche.push(cumul);
        cumul += tetes[i].getBoundingClientRect().width;
      }
      if (!gauche.length) return;
      g.querySelectorAll('th.col-fige').forEach(function (th) {
        var d = parseInt(th.dataset.debut, 10) || 0;
        th.style.left = (gauche[d] || 0) + 'px';
      });
      var lignes = [t, f].concat(Array.prototype.slice.call(document.querySelectorAll('#corps-tableau tr')));
      lignes.forEach(function (ligne) {
        var n = 0;
        ligne.querySelectorAll('.col-fige').forEach(function (c) {
          c.style.left = (gauche[n] == null ? 0 : gauche[n]) + 'px';
          n++;
        });
      });
    });
  }
  function rendreCorps(liste) {
    var cols = visibles();
    var rangs = liste.slice().sort(function (a, b) {
      var k = vue.tri.cle, sens = vue.tri.asc ? 1 : -1;
      if (k === 'avancement') return (a._pct - b._pct) * sens || a.reference.localeCompare(b.reference);
      var va = String(a[k] == null ? '' : a[k]), vb = String(b[k] == null ? '' : b[k]);
      if (va === '' && vb === '') return 0;
      if (va === '') return 1;
      if (vb === '') return -1;
      return va.localeCompare(vb, 'fr', { numeric: true, sensitivity: 'base' }) * sens;
    });

    if (!rangs.length) {
      $('corps-tableau').innerHTML = '\x3Ctr>\x3Ctd colspan="' + cols.length + '">\x3Cdiv class="vide-message">Aucun plan ne correspond aux filtres.\x3C/div>\x3C/td>\x3C/tr>';
      $('compte').textContent = '0 plan';
      majOmbre();
      return;
    }

    var nFige = nbFigees(cols);
    $('corps-tableau').innerHTML = rangs.map(function (p) {
      return '\x3Ctr>' + cols.map(function (c, i) {
        var fige = classeFige(i, nFige);
        if (c.cle === 'avancement') {
          var e = ETAT_PAR_CLE[p._etat];
          var past = e.hachure ? '\x3Cspan class="pastille hachure">\x3C/span>'
            : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
          return '\x3Ctd class="' + fige + '">\x3Cspan class="etat-cellule">' + past +
            (p.avancement ? '\x3Cspan class="num">' + ech(p.avancement) + '\x3C/span>' : '\x3Cspan class="doux">non renseigné\x3C/span>') +
            '\x3C/span>\x3C/td>';
        }
        var val = p[c.cle];
        var classes = (c.classe + ' ' + fige).trim();
        if (val === '' || val == null) return '\x3Ctd class="' + classes + ' doux">-\x3C/td>';
        var titre = c.classe.indexOf('large') !== -1 ? ' title="' + ech(val) + '"' : '';
        return '\x3Ctd class="' + classes + '"' + titre + '>' + ech(val) + '\x3C/td>';
      }).join('') + '\x3C/tr>';
    }).join('');

    $('compte').textContent = nb(rangs.length) + (rangs.length > 1 ? ' plans' : ' plan') +
      (rangs.length !== PLANS.length ? ' sur ' + nb(PLANS.length) : '');
    ajusterSticky();
    majOmbre();
  }
  function rendrePanneauColonnes() {
    var groupes = [];
    COLONNES.forEach(function (c) {
      var d = groupes.filter(function (g) { return g.nom === c.groupe; })[0];
      if (!d) { d = { nom: c.groupe, cols: [] }; groupes.push(d); }
      d.cols.push(c);
    });
    $('panneau-colonnes').innerHTML = groupes.map(function (g) {
      return '\x3Cdiv class="groupe-colonnes">\x3Cspan>' + ech(g.nom) + '\x3C/span>' + g.cols.map(function (c) {
        return '\x3Clabel class="case" data-verrou="' + !!c.fige + '">\x3Cinput type="checkbox" data-col="' + c.cle + '"' +
          (vue.cachees[c.cle] ? '' : ' checked') + (c.fige ? ' disabled' : '') + '> ' + ech(c.titre) + '\x3C/label>';
      }).join('') + '\x3C/div>';
    }).join('') + '\x3Cbutton class="lien-doux" id="tout-colonnes" type="button">tout afficher\x3C/button>';
    var caches = Object.keys(vue.cachees).filter(function (k) { return vue.cachees[k]; }).length;
    $('compteur-colonnes').textContent = caches ? '(' + (COLONNES.length - caches) + '/' + COLONNES.length + ')' : '';
  }
  /* Seule la colonne d'avancement FWD interesse le suivi : une cellule vide
     ailleurs n'est pas un defaut a traquer. */
  var COLONNE_SUIVIE = 'avancement';
  /* Ce qui a bougé depuis l'import précédent. Sur 186 lignes, personne ne
     peut le voir à l'œil ; c'est pourtant la question de chaque semaine. */
  var LOTS_DELTA = [
    { cle: 'termine',  libelle: 'passés en terminé', etat: 'termine', classe: '' },
    { cle: 'encours',  libelle: 'passés en cours',   etat: 'encours', classe: '' },
    { cle: 'afaire',   libelle: 'passés à faire',    etat: 'afaire',  classe: '' },
    { cle: 'nouveaux', libelle: 'nouveaux',          etat: null,      classe: '' },
    { cle: 'disparus', libelle: 'disparus',          etat: null,      classe: '' }
  ];

  function rendreComparatif() {
    var zone = $('comparatif');
    if (!COMPARATIF) {
      zone.innerHTML = '\x3Cspan>Premier import : le comparatif appara\u00eetra au prochain.\x3C/span>';
      return;
    }
    var morceaux = LOTS_DELTA.filter(function (l) { return COMPARATIF[l.cle].length; }).map(function (l) {
      var actif = vue.refsLibelle === l.cle;
      var e = l.etat ? ETAT_PAR_CLE[l.etat] : null;
      var pastille = !e ? ''
        : (e.hachure ? '\x3Cspan class="pastille hachure">\x3C/span>'
                     : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>');
      return '\x3Cbutton class="puce-delta ' + l.classe + '" type="button" data-delta="' + l.cle +
        '" aria-pressed="' + actif + '">' +
        pastille + '\x3Cb>' + nb(COMPARATIF[l.cle].length) + '\x3C/b> ' + l.libelle + '\x3C/button>';
    });
    zone.innerHTML = '\x3Cspan>Depuis l\u2019import du ' + etiquette(RELEVES[RELEVES.length - 2].i) + ' :\x3C/span>' +
      (morceaux.length ? morceaux.join('') : '\x3Cspan>aucun changement.\x3C/span>');
  }

  /* ============================================================
     JOURNAL DES CHANGEMENTS
     Chaque relevé archivé garde l'avancement plan par plan. Comparer deux
     relevés successifs donne, semaine par semaine, qui a bougé et dans quel
     sens — la seule chose que l'export du jour ne dira jamais.
     ============================================================ */
  var PLAN_PAR_REF = {};
  PLANS.forEach(function (p) { PLAN_PAR_REF[p.reference] = p; });

  function construireJournal() {
    var journal = [];
    for (var k = 1; k < RELEVES.length; k++) {
      var avant = RELEVES[k - 1].plans, apres = RELEVES[k].plans;
      if (!avant || !apres) continue;
      var evenements = [];
      Object.keys(apres).forEach(function (ref) {
        var brutAvant = avant[ref];
        if (brutAvant === undefined) {
          evenements.push({ ref: ref, type: 'nouveau', apres: classer(apres[ref]) });
          return;
        }
        var ea = classer(brutAvant), eb = classer(apres[ref]);
        if (ea !== eb) evenements.push({ ref: ref, type: 'change', avant: ea, apres: eb });
      });
      Object.keys(avant).forEach(function (ref) {
        if (apres[ref] === undefined) {
          evenements.push({ ref: ref, type: 'disparu', avant: classer(avant[ref]) });
        }
      });
      if (evenements.length) journal.push({ i: RELEVES[k].i, evenements: evenements });
    }
    return journal.reverse();          // la semaine la plus récente en tête
  }
  var JOURNAL = construireJournal();
  function recalculerJournal() { JOURNAL = construireJournal(); }

  /* La semaine où chaque plan est passé en terminé, pour de bon. */
  var SEMAINE_FIN = (function () {
    var f = {};
    JOURNAL.slice().reverse().forEach(function (sem) {
      sem.evenements.forEach(function (e) {
        if (e.apres === 'termine') f[e.ref] = sem.i;
        else if (e.avant === 'termine') delete f[e.ref];   // reparti en arrière
      });
    });
    return f;
  })();

  function etiqEtat(cle, role) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '';
    var pastille = e.hachure
      ? '\x3Cspan class="pastille hachure">\x3C/span>'
      : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
    return '\x3Cspan class="etiq-etat ' + (role || '') + '">' + pastille + ech(e.court) + '\x3C/span>';
  }

  var MAX_JOURNAL = 12;                // lignes affichées avant « voir tout »

  function rendreJournal() {
    var zone = $('zone-journal');
    if (!JOURNAL.length) {
      zone.innerHTML = '\x3Cdiv class="journal-vide">Le journal se remplira au deuxième archivage : ' +
        'il faut deux relevés pour savoir ce qui a bougé entre les deux.\x3C/div>';
      return;
    }
    var filtre = vue.journal;
    var html = JOURNAL.map(function (sem, rang) {
      var evts = sem.evenements.filter(function (e) {
        return !filtre || e.apres === filtre;
      });
      if (!evts.length) return '';

      var parType = { termine: 0, encours: 0, afaire: 0, vide: 0, nouveau: 0, disparu: 0 };
      evts.forEach(function (e) {
        if (e.type === 'nouveau') parType.nouveau++;
        else if (e.type === 'disparu') parType.disparu++;
        else parType[e.apres]++;
      });
      /* « passés en en cours » ne se dit pas : chaque état a sa tournure.
         Et chaque compte est un bouton : cliquer « 4 terminés » n'affiche plus
         que ceux-là, pour toutes les semaines à la fois. */
      var resume = [];
      ETATS.forEach(function (et) {
        var n = parType[et.cle];
        if (!n) return;
        var pluriel = n > 1 ? 's' : '';
        var mot;
        if (et.cle === 'termine')      mot = nb(n) + ' terminé' + pluriel;
        else if (et.cle === 'encours') mot = nb(n) + ' passé' + pluriel + ' en cours';
        else if (et.cle === 'afaire')  mot = nb(n) + ' repassé' + pluriel + ' à faire';
        else                           mot = nb(n) + ' effacé' + pluriel;
        resume.push('\x3Cbutton class="compte-passage" type="button" data-passage="' + et.cle +
          '" aria-pressed="' + (vue.journal === et.cle) + '" title="N\u2019afficher que ces passages, sur toutes les semaines">' +
          ech(mot) + '\x3C/button>');
      });
      if (parType.nouveau) resume.push('\x3Cspan>' + nb(parType.nouveau) + ' nouveau' + (parType.nouveau > 1 ? 'x' : '') + '\x3C/span>');
      if (parType.disparu) resume.push('\x3Cspan>' + nb(parType.disparu) + ' disparu' + (parType.disparu > 1 ? 's' : '') + '\x3C/span>');

      // La semaine la plus récente s'ouvre d'elle-même : c'est celle qu'on vient voir.
      var ouvert = vue.journalOuverts[sem.i] !== undefined ? vue.journalOuverts[sem.i] : (rang === 0);
      var limite = vue.journalOuverts['tout' + sem.i] ? evts.length : MAX_JOURNAL;

      /* Rangées par état d'arrivée, puis par référence : « terminé, terminé,
         terminé, à faire, à faire » se lit, « en vrac » ne se lit pas. */
      var rangEtat = { termine: 0, encours: 1, afaire: 2, vide: 3 };
      evts = evts.slice().sort(function (a, b) {
        var ra = a.type === 'disparu' ? 5 : (a.type === 'nouveau' ? 4 : rangEtat[a.apres]);
        var rb = b.type === 'disparu' ? 5 : (b.type === 'nouveau' ? 4 : rangEtat[b.apres]);
        return (ra - rb) || a.ref.localeCompare(b.ref, 'fr', { numeric: true });
      });

      var lignes = evts.slice(0, limite).map(function (e) {
        var plan = PLAN_PAR_REF[e.ref];
        var quoi = plan && CLE_LIBELLE ? String(plan[CLE_LIBELLE] || '') : '';
        var vers = e.type === 'nouveau'
          ? '\x3Cspan class="vers">\x3Cspan class="etiq-etat avant">nouveau\x3C/span>' +
            '\x3Cspan class="fleche-etat">\u2192\x3C/span>' + etiqEtat(e.apres, 'apres') + '\x3C/span>'
          : e.type === 'disparu'
            ? '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant') +
              '\x3Cspan class="fleche-etat">\u2192\x3C/span>\x3Cspan class="etiq-etat apres">retiré\x3C/span>\x3C/span>'
            : '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant') +
              '\x3Cspan class="fleche-etat">\u2192\x3C/span>' + etiqEtat(e.apres, 'apres') + '\x3C/span>';
        return '\x3Cli>\x3Cbutton class="journal-ligne" type="button" data-ref="' + ech(e.ref) +
          '" title="N’afficher que ce plan dans le tableau">' +
          '\x3Cspan class="ref">' + ech(e.ref) + '\x3C/span>' +
          '\x3Cspan class="quoi">' + ech(quoi) + '\x3C/span>' + vers + '\x3C/button>\x3C/li>';
      }).join('');

      var reste = evts.length - limite;
      if (reste > 0) {
        lignes += '\x3Cli>\x3Cbutton class="journal-plus" type="button" data-tout="' + sem.i + '">' +
          'voir les ' + nb(reste) + ' autres\x3C/button>\x3C/li>';
      }

      return '\x3Cdiv class="journal-semaine">' +
        '\x3Cspan class="journal-tete">' +
        '\x3Cbutton class="journal-plier" type="button" data-semaine="' + sem.i + '" aria-expanded="' + ouvert +
        '" aria-label="Plier ou d\u00e9plier la semaine ' + etiquette(sem.i) + '">' +
        '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' +
        '\x3Cspan class="sem">' + etiquette(sem.i) + '\x3C/span>\x3C/button>' +
        '\x3Cspan class="resume">' + resume.join(' \x3Cspan class="sep">·\x3C/span> ') + '\x3C/span>\x3C/span>' +
        (ouvert ? '\x3Cul class="journal-liste">' + lignes + '\x3C/ul>' : '') +
        '\x3C/div>';
    }).join('');

    zone.innerHTML = html || '\x3Cdiv class="journal-vide">Aucun changement de ce type dans l’historique.\x3C/div>';
  }

  /* ============================================================
     APERÇU
     Avec un seul relevé, le graphique n'a rien à tracer et personne ne voit
     à quoi servira la page. Un bouton fabrique donc un historique fictif à
     partir des comptes du jour — sous bandeau, pour qu'il soit impossible de
     le prendre pour du réel.
     ============================================================ */
  var RELEVES_REELS = RELEVES;
  var AUJ_REEL = AUJ;
  var BASE_REELLE = BASE;

  function relevesDExemple() {
    var c = compte(PLANS);
    var semaines = 8;
    var faux = [];
    for (var k = 0; k <= semaines; k++) {
      var part = 0.25 + (0.75 * k) / semaines;      // montée régulière jusqu'à aujourd'hui
      var termine = Math.round(c.termine * part);
      var glisse = c.termine - termine;
      /* Un avancement plan par plan, sinon le journal resterait vide et
         l'exemple ne montrerait que la moitié de ce que fera la page. */
      var carte = {};
      var atteint = 0;
      PLANS.forEach(function (p) {
        if (p._etat === 'termine') {
          carte[p.reference] = atteint++ < termine ? 'Terminé' : 'En cours';
        } else {
          carte[p.reference] = p.avancement;
        }
      });
      faux.push({
        i: k,
        total: c.total,
        termine: termine,
        encours: c.encours + Math.round(glisse * 0.6),
        afaire: c.afaire + (glisse - Math.round(glisse * 0.6)),
        vide: c.vide,
        groupes: {},
        plans: carte
      });
    }
    return faux;
  }

  function basculerExemple(actif) {
    vue.exemple = actif;
    if (actif) {
      RELEVES = relevesDExemple();
      AUJ = RELEVES[RELEVES.length - 1].i;
      BASE = dateDeBase(BASE_REELLE, AUJ_REEL - AUJ);   // « aujourd'hui » reste aujourd'hui
      vue.fen = { debut: 0, span: Math.max(14, AUJ + 6) };
    } else {
      RELEVES = RELEVES_REELS;
      AUJ = AUJ_REEL;
      BASE = BASE_REELLE;
      vue.fen = { debut: 0, span: 28 };
    }
    DERNIER = RELEVES[RELEVES.length - 1];
    recalculerJournal();
    document.body.dataset.exemple = String(actif);
    document.querySelectorAll('#mode-donnees button').forEach(function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.mode === 'exemple') === actif));
    });
    /* Dire exactement ce qui est fabrique : l'historique, pas les plans. Une
       phrase qui exagere se fait prendre en defaut et on ne croit plus rien. */
    $('mot-mode').innerHTML = actif
      ? '\x3Cb>Historique fabriqué\x3C/b> — un aperçu de ce que la page montrera quand les relevés se seront accumulés.'
      : '';
    rendre();
  }


  /* L'interrupteur vit en haut de page : il porte sur tout, pas sur un bloc.
     Au premier import il montre ce que la page dira plus tard ; après, il sert
     encore à l'expliquer à quelqu'un. */
  document.querySelector('#mode-donnees').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    var veutExemple = b.dataset.mode === 'exemple';
    if (veutExemple !== vue.exemple) basculerExemple(veutExemple);
  });
  document.body.dataset.exemple = 'false';


  /* ============================================================
     LES DEUX VUES DU TABLEAU

     « Toutes les colonnes » : l'export tel quel, toutes les colonnes, dans
     l'ordre de la feuille. C'est la vue de référence — celle sur laquelle tout
     le monde parle de la même chose.

     « Vue essentielle » : la poignée de colonnes qu'on regarde vraiment, dans
     l'ordre voulu.

     Rien entre les deux, et chacune se retrouve à l'identique en revenant.
     ============================================================ */
  var ORDRE_FEUILLE = COLONNES.map(function (c) { return c.cle; });

  function appliquerVueTable() {
    if (vue.vueTable === 'essentielle') {
      var garder = {};
      CLES_ESSENTIELLES.forEach(function (c) { garder[c] = true; });
      vue.cachees = {};
      COLONNES.forEach(function (c) { if (!garder[c.cle]) vue.cachees[c.cle] = true; });
      vue.ordre = CLES_ESSENTIELLES.slice()
        .concat(ORDRE_FEUILLE.filter(function (c) { return CLES_ESSENTIELLES.indexOf(c) === -1; }));
    } else {
      vue.cachees = {};
      vue.ordre = ORDRE_FEUILLE.slice();
    }
    document.querySelectorAll('#vue-tableau button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.vue === vue.vueTable));
    });
  }

  /* ============================================================
     FILTRES ACTIFS
     On clique un état, un groupe, un domaine, une ligne du journal… et plus
     personne ne sait ce qui reste posé. Le bandeau nomme chaque filtre et
     donne sa croix ; il colle en haut de la page, donc la sortie est toujours
     à portée.
     ============================================================ */
  function filtresPoses() {
    var liste = [];
    if (vue.etat) liste.push({ cle: 'etat', mot: 'État', valeur: ETAT_PAR_CLE[vue.etat].libelle });
    if (vue.domaine) liste.push({ cle: 'domaine', mot: PAR_CLE[CLE_DOMAINE].titre, valeur: vue.domaine });
    if (vue.reconduits) liste.push({ cle: 'reconduits', mot: '', valeur: 'Terminés reconduits' });
    if (vue.groupe) {
      liste.push({
        cle: 'groupe',
        mot: TITRE_DIM[vue.groupe.dim] || 'Groupe',
        valeur: libelleGroupe(vue.groupe.val)
      });
    }
    if (vue.refs) {
      var n = Object.keys(vue.refs).length;
      liste.push({ cle: 'refs', mot: 'Sélection', valeur: vue.refsLibelle || (n + ' plans') });
    }
    Object.keys(vue.vides).forEach(function (k) {
      if (vue.vides[k]) liste.push({ cle: 'vide:' + k, mot: PAR_CLE[k].titre, valeur: 'non renseigné' });
    });
    Object.keys(vue.filtres).forEach(function (k) {
      if (vue.filtres[k]) liste.push({ cle: 'filtre:' + k, mot: PAR_CLE[k].titre, valeur: vue.filtres[k] });
    });
    if (vue.recherche) liste.push({ cle: 'recherche', mot: 'Recherche', valeur: vue.recherche });
    return liste;
  }

  function retirerFiltre(cle) {
    if (cle === 'etat') vue.etat = '';
    else if (cle === 'domaine') vue.domaine = '';
    else if (cle === 'reconduits') vue.reconduits = false;
    else if (cle === 'groupe') vue.groupe = null;
    else if (cle === 'refs') { vue.refs = null; vue.refsLibelle = ''; }
    else if (cle === 'recherche') { vue.recherche = ''; $('recherche').value = ''; }
    else if (cle.indexOf('vide:') === 0) delete vue.vides[cle.slice(5)];
    else if (cle.indexOf('filtre:') === 0) delete vue.filtres[cle.slice(7)];
  }

  function toutEffacer() {
    vue.recherche = ''; vue.etat = ''; vue.filtres = {}; vue.groupe = null; vue.vides = {};
    vue.refs = null; vue.refsLibelle = '';
    vue.domaine = ''; vue.reconduits = false;
    $('recherche').value = '';
  }

  function rendreFiltresActifs() {
    var zone = $('filtres-actifs');
    var poses = filtresPoses();
    zone.hidden = !poses.length;
    if (!poses.length) { zone.innerHTML = ''; return; }
    zone.innerHTML = '\x3Cspan class="mot">Filtres\x3C/span>' +
      poses.map(function (f) {
        return '\x3Cspan class="jeton">' + (f.mot ? ech(f.mot) + ' : ' : '') +
          '\x3Cb>' + ech(f.valeur) + '\x3C/b>' +
          '\x3Cbutton class="x" type="button" data-retirer="' + ech(f.cle) +
          '" aria-label="Retirer ce filtre" title="Retirer ce filtre">×\x3C/button>\x3C/span>';
      }).join('') +
      '\x3Cbutton class="tout-effacer" type="button" id="tout-effacer">Tout effacer\x3C/button>';
  }

  function rendreIncomplets() {
    var col = PAR_CLE[COLONNE_SUIVIE];
    var n = 0;
