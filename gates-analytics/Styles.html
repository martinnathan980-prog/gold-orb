.fiche-plan-see .verdict-see.avance { color: var(--cours); }
.fiche-plan-see .verdict-see.accord { color: var(--fait); }
.fiche-plan-see .lien-doux { color: var(--encre-2); }
.fiche-plan-tete h3.mot { margin: 0; }

/* « Chercher un plan », dans le sommaire collé (P-F23) : un champ discret à
   droite sur grand écran ; en dessous de 1280 px, une loupe qui l'ouvre
   par-dessus le sommaire. La liste des plans trouvés se parcourt aux
   flèches (combobox ARIA). */
.cherche-plan { position: absolute; right: var(--retrait-panneau); top: 50%; transform: translateY(-50%); z-index: 2; display: flex; align-items: center; }
.cherche-plan-cadre { position: relative; display: flex; align-items: center; gap: 6px; width: 200px; }
.cherche-plan-cadre input {
  width: 100%; height: 28px; padding: 0 10px 0 30px; border: 1px solid var(--bord-champ); border-radius: 4px;
  background: var(--surface); color: var(--encre); font: 13px "IBM Plex Sans", system-ui, sans-serif;
}
.cherche-plan-cadre input::placeholder { color: var(--encre-3); }
.cherche-plan-cadre input:hover { border-color: var(--encre-2); }
.cherche-plan-cadre input:focus { outline: 2px solid var(--focus); outline-offset: 2px; }
.cherche-plan-cadre input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.cherche-plan-cadre .loupe { position: absolute; left: 10px; top: 50%; margin-top: -7px; color: var(--encre-3); pointer-events: none; }
.cherche-plan-ouvrir, .cherche-plan-fermer {
  display: none; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--filet-fort); border-radius: 50%; background: var(--surface); color: var(--encre-2); cursor: pointer;
}
.cherche-plan-ouvrir:hover, .cherche-plan-fermer:hover { border-color: var(--encre); color: var(--encre); }
.cherche-plan-liste {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 31; width: max(100%, 360px); max-width: calc(100vw - 32px);
  max-height: min(60vh, 420px); overflow: auto; margin: 0; padding: 4px; list-style: none;
  background: var(--releve); border: 1px solid var(--releve-bord); border-radius: 6px; box-shadow: var(--flottant-ombre);
}
.cherche-plan-liste[hidden] { display: none; }
.cherche-plan-liste li {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 2px 12px;
  padding: 7px 10px; border-radius: 4px; font-size: 13px; color: var(--encre-2); cursor: pointer;
}
.cherche-plan-liste li[aria-selected="true"] { background: var(--survol-ligne); box-shadow: inset 2px 0 0 var(--focus); color: var(--encre); }
.cherche-plan-liste li:hover { background: var(--survol-ligne); }
.cherche-plan-liste li[aria-disabled="true"] { cursor: default; background: none; box-shadow: none; grid-template-columns: 1fr; }

/* ---------------------------------------------------- Débrief 27, lot G
   L'accessibilité de toute la page (liens d'évitement, région principale),
   l'aide, le pied, l'impression, et la couche tactile commune. */

/* Les liens d'évitement : hors de vue tant qu'on ne les atteint pas au
   clavier ; au focus, une étiquette nette en haut à gauche, au-dessus de

.evitement { position: absolute; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden; }
.evitement:focus {
  position: fixed; left: 16px; top: 12px; z-index: 80; width: auto; height: auto; overflow: visible;
  padding: 9px 16px; border: 1px solid var(--encre); border-radius: 6px;
  background: var(--surface); color: var(--encre); box-shadow: var(--flottant-ombre);
  font: 500 14px/20px "IBM Plex Sans", system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px;
}
/* La région principale prend le focus de « Aller au contenu » : pas
   d'anneau autour de toute la page, le Tab suivant va au premier bouton. */

dialog.aide-page {

  margin: 20px auto auto; padding: 0;

  box-shadow: var(--panneau-ombre); overflow: hidden;
}

.aide-tete { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px 14px; border-bottom: 1px solid var(--filet); }

  background: var(--creux); color: var(--encre); font: 500 12px/18px "IBM Plex Mono", monospace; text-align: center; white-space: nowrap;

/* Le pied (B14) : deux colonnes au bord du contenu des panneaux. À gauche
   les chiffres (13 px), à droite l'aide, le lien de la vue et les infos
   techniques repliées (12 px). */
.pied { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 14px 48px; align-items: start; }
.pied p { margin: 0; }
.pied-releve { font-size: 13px; line-height: 1.7; color: var(--encre-2); }

.pied-droite { justify-self: end; text-align: right; max-width: 400px; }
.pied-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; gap: 0 10px; font-size: 13px; line-height: 1.6; }
.pied-actions .lien-doux { color: var(--encre-2); }
.pied-actions .lien-doux:hover { color: var(--encre); }
.pied-point { color: var(--encre-3); }
#mention-consultations { margin-top: 4px; line-height: 1.6; }
.pied-technique { margin-top: 6px; }
/* Rien à y lire (ni temps d'ouverture ni livraison) : pas de « Infos techniques ». */
.pied-technique:not(:has(#mesure-ouverture:not([hidden]), #livraison:not([hidden]))) { display: none; }
.pied-technique summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--encre-3); line-height: 24px; }

/* La couche tactile commune (D11, M6, M14) : au doigt, ce que les sections
   ne règlent pas elles-mêmes offre 44 px à toucher — le bouton grandit, ou
   une zone invisible (::after) l'entoure sans rien changer au dessin ; à la
   souris rien ne bouge. Tous les champs passent à 16 px : iOS ne zoome

@media (pointer: coarse) {
  .segmente button { min-width: 44px; }
  .bouton, .copier, .rapp-puce, .puce-vide, .legende-jalon, .pied-technique summary, .aide-option { min-height: 44px; }
  .copier, .rapp-puce, .puce-vide { display: inline-flex; align-items: center; }
  .lien-doux, .jeton .x, .haut-de-page, .aide-fermer { position: relative; }

/* Une rangée qui défile de côté (pastilles, sommaire au téléphone) :
   l'élément atteint au clavier s'arrête avant le fondu du bord (M13,

   replient au téléphone au lieu d'être coupées. */
.filtre-journal, .rangee-valeurs, .sommaire-liste { scroll-padding-inline: 40px; }

  }

  /* Un panneau qui tient sur une page n'y est jamais coupé (il passe à la

  .journal-grille .mot-case { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
