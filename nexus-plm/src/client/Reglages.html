<script>
// ============================================================
// NEXUS — réglage des pondérations d'équivalence.
//
// Généré à partir du registre de Types.html. Le rail de réglages s'ouvre
// DANS la comparaison, à gauche du classement : on bouge un curseur, le
// classement se recompose à droite. Il n'y a donc plus d'« aperçu » séparé,
// le résultat lui-même est l'aperçu.
//
// Deux partis pris :
//   - les parts totalisent TOUJOURS 100 %. Monter un critère fait
//     mécaniquement descendre les autres : c'est un arbitrage, pas un curseur
//     indépendant. Un total à 250 % ne voudrait rien dire.
//   - on choisit QUELS critères comparer. Un critère écarté disparaît du
//     résultat au lieu d'y figurer barré.
// ============================================================

let porteeReglee = 'boite';

function porteeCourante() { return porteeParCle(porteeReglee); }

// ------------------------------------------------------------
// Rendu
// ------------------------------------------------------------
/** Un groupe de curseurs pour une portée donnée. Les parts y font 100 %. */
function groupeReglageHtml(portee) {
  const actifs = criteresActifs(portee.cle);

  const lignes = actifs.map(function (c) {
    const part = Math.max(0, Number(Store.poids[portee.cle][c.cle]) || 0);
    const seul = actifs.length === 1;
    return '<div class="reglage">' +
      '<div class="reglage-tete">' +
        '<label for="poids-' + esc(portee.cle) + '-' + esc(c.cle) + '">' + esc(c.libelle) + '</label>' +
        '<span class="reglage-part">' + part + ' %</span>' +
        '<button type="button" class="reglage-retirer"' +
          dataAttrs({ action: 'retirer-critere', critere: c.cle, portee: portee.cle }) +
          (seul ? ' disabled title="Il faut garder au moins un critère"'
                : ' title="Retirer ce critère de la comparaison"') +
          ' aria-label="Retirer ' + esc(c.libelle) + '">−</button>' +
      '</div>' +
      (c.aide ? '<p class="reglage-aide">' + esc(c.aide) + '</p>' : '') +
      '<input type="range" min="0" max="100" step="1" value="' + part + '"' +
        ' id="poids-' + esc(portee.cle) + '-' + esc(c.cle) + '" class="curseur"' +
        ' data-portee="' + esc(portee.cle) + '" data-critere="' + esc(c.cle) + '"' +
        ' aria-label="Part de ' + esc(c.libelle) + '">' +
      '<div class="reglage-jauge"><span style="width:' + part + '%"></span></div>' +
    '</div>';
  }).join('');

  return lignes + totalHtml(portee) + critereDisponiblesHtml(portee);
}

/**
 * Les favoris de la portée : une intention posée d'un coup. Celui qui
 * correspond exactement aux parts en place est marqué — sinon on ne saurait
 * pas si on est encore dessus après avoir bougé un curseur.
 */
function favorisHtml(portee) {
  const favoris = favorisDe(portee.cle);
  if (!favoris.length) return '';

  return '<div class="favoris">' +
    '<h4>Favoris</h4>' +
    '<p class="favoris-aide">Une intention posée d\'un coup. Les curseurs ' +
      'restent réglables juste après.</p>' +
    '<div class="favoris-liste">' +
      favoris.map(function (f) {
        const actif = favoriEnPlace(portee.cle, f);
        return '<button type="button" class="favori' + (actif ? ' actif' : '') + '"' +
          dataAttrs({ action: 'appliquer-favori', portee: portee.cle, favori: f.cle }) +
          ' aria-pressed="' + actif + '" title="' + esc(f.aide) + '">' +
          '<span class="favori-nom">' + esc(f.libelle) + '</span>' +
          '<span class="favori-aide">' + esc(f.aide) + '</span>' +
        '</button>';
      }).join('') +
      '<button type="button" class="favori favori-defaut"' +
        dataAttrs({ action: 'reinitialiser-reglages' }) +
        ' title="Revenir aux parts du registre">' +
        '<span class="favori-nom">Par défaut</span>' +
        '<span class="favori-aide">les parts d\'origine</span>' +
      '</button>' +
    '</div>' +
  '</div>';
}

/** Les parts en place sont-elles exactement celles de ce favori ? */
function favoriEnPlace(portee, favori) {
  const voulus = normaliserFavori(favori);
  const actifs = criteresActifs(portee);
  if (actifs.length !== Object.keys(voulus).length) return false;
  return actifs.every(function (c) {
    return voulus[c.cle] !== undefined &&
           Math.abs((Number(tablePoids(portee)[c.cle]) || 0) - voulus[c.cle]) < 1;
  });
}

function curseursHtml() {
  const portee = porteeCourante();

  // Un seul critère possible : il n'y a rien à arbitrer, on le dit.
  let html;
  if (!porteeArbitrable(portee)) {
    const seul = portee.criteres[0];
    html = '<p class="reglage-unique">Un seul critère pour ce type : ' +
           '<b>' + esc(seul ? seul.libelle : '—') + '</b>. ' +
           'Le score en dépend entièrement, il n\'y a pas d\'arbitrage à faire.</p>';
  } else {
    html = favorisHtml(portee) + groupeReglageHtml(portee);
  }

  // Quand la portée compare des composants, on règle AUSSI la répartition
  // entre leurs trois niveaux. C'est une pondération dans la pondération :
  // elle dit ce que vaut une fonction partagée face à une référence exacte.
  if (porteeAvecComposants(portee)) {
    const niveaux = porteeParCle('composant');
    html += '<div class="sous-reglage">' +
      '<h4>Niveaux de composant</h4>' +
      '<p class="sous-reglage-aide">Les niveaux s\'additionnent : même fonction, ' +
        'puis même norme en plus, puis même référence en plus. Ce qui n\'est pas ' +
        'renseigné ne compte pas.</p>' +
      groupeReglageHtml(niveaux) +
    '</div>';
  }
  return html;
}

function totalHtml(portee) {
  const total = criteresActifs(portee.cle).reduce(function (t, c) {
    return t + (Number(Store.poids[portee.cle][c.cle]) || 0);
  }, 0);
  return '<p class="reglage-total' + (total === 100 ? '' : ' reglage-total-faux') + '"' +
         ' data-portee="' + esc(portee.cle) + '">Total ' + total + ' %</p>';
}

function critereDisponiblesHtml(portee) {
  const inactifs = portee.criteres.filter(function (c) {
    return !critereEstActif(portee.cle, c.cle);
  });
  if (!inactifs.length) return '';
  return '<div class="criteres-dispo">' +
    '<h4>Critères écartés</h4>' +
    inactifs.map(function (c) {
      return '<button type="button" class="btn-ajout-critere"' +
             dataAttrs({ action: 'ajouter-critere', critere: c.cle, portee: portee.cle }) + '>' +
             '<span aria-hidden="true">+</span> ' + esc(c.libelle) + '</button>';
    }).join('') +
  '</div>';
}

function rendreReglages() {
  const portee = porteeCourante();
  let sous = porteeArbitrable(portee)
    ? portee.libelle + ' — ' + criteresActifs(portee.cle).length + ' critère(s) retenu(s)'
    : portee.libelle;
  if (porteeAvecComposants(portee)) {
    sous += ', plus les ' + criteresActifs('composant').length + ' niveaux de composant';
  }
  definirTexte('reglagesPortee', sous);
  definirHtml('reglagesCurseurs', curseursHtml());
  definirTexte('seuilValeur', seuil() + ' %');
  const s = parId('seuilCurseur');
  if (s) s.value = seuil();
  const avert = parId('reglagesModifies');
  if (avert) avert.hidden = !poidsModifies();
}

/**
 * Redessine les parts sans reconstruire les curseurs : on garde celui que
 * l'utilisateur tient sous le doigt, mais les AUTRES doivent suivre puisqu'ils
 * viennent d'être redistribués.
 */
function rafraichirCurseurs(cleTenue) {
  document.querySelectorAll('.reglage').forEach(function (bloc) {
    const curseur = bloc.querySelector('.curseur');
    if (!curseur) return;
    const table = Store.poids[curseur.dataset.portee] || {};
    const part = Math.max(0, Number(table[curseur.dataset.critere]) || 0);
    // On ne touche pas au curseur que l'utilisateur tient sous le doigt.
    if (curseur.dataset.critere !== cleTenue) curseur.value = part;
    const etiquette = bloc.querySelector('.reglage-part');
    if (etiquette) etiquette.textContent = part + ' %';
    const jauge = bloc.querySelector('.reglage-jauge span');
    if (jauge) jauge.style.width = part + '%';
  });

  // Bouger un curseur quitte le favori : on ne prétend pas y être resté.
  document.querySelectorAll('.favori[data-favori]').forEach(function (bouton) {
    const portee = bouton.dataset.portee;
    const favori = (favorisDe(portee) || []).find(function (f) {
      return f.cle === bouton.dataset.favori;
    });
    const actif = !!favori && favoriEnPlace(portee, favori);
    bouton.classList.toggle('actif', actif);
    bouton.setAttribute('aria-pressed', String(actif));
  });

  document.querySelectorAll('.reglage-total').forEach(function (total) {
    const cle = total.dataset.portee;
    const somme = criteresActifs(cle).reduce(function (t, c) {
      return t + (Number(Store.poids[cle][c.cle]) || 0);
    }, 0);
    total.textContent = 'Total ' + somme + ' %';
    total.classList.toggle('reglage-total-faux', somme !== 100);
  });

  const avert = parId('reglagesModifies');
  if (avert) avert.hidden = !poidsModifies();
}

// ------------------------------------------------------------
// Le rail : ouvert ou fermé, à côté du classement
// ------------------------------------------------------------
function railOuvert() {
  const rail = parId('reglagesRail');
  return !!rail && !rail.hidden;
}

function afficherRail(ouvert) {
  const rail = parId('reglagesRail');
  if (!rail) return;
  rail.hidden = !ouvert;
  const corps = parId('compareCorps');
  if (corps) corps.classList.toggle('avec-reglages', ouvert);
  const bouton = parId('btnReglages');
  if (bouton) {
    bouton.setAttribute('aria-expanded', String(ouvert));
    bouton.classList.toggle('actif', ouvert);
  }
}
</script>
