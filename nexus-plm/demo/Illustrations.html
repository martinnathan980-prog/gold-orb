<script>
// ============================================================
// DÉMONSTRATION — illustrations générées.
//
// Ne fait partie d'aucune livraison. Dans l'application, les images sont des
// liens Drive collés par les utilisateurs ; ici on fabrique des vignettes
// techniques déterministes pour montrer le rendu sans dépendre d'un
// hébergeur (la politique de sécurité des Artifacts bloque les images
// externes de toute façon).
// ============================================================

const ENCRE = '#1f2d3d', TRAIT = '#8ea3bd', FOND = '#eef2f7', COTE = '#b04a2f';

function svgVersDataUri(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/\s+/g, ' ').trim());
}

/** Entier stable tiré d'une chaîne : deux appels donnent la même image. */
function graine(texte) {
  let h = 2166136261;
  for (let i = 0; i < texte.length; i++) {
    h ^= texte.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

function cadre(contenu, titre) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">' +
    '<rect width="320" height="180" fill="' + FOND + '"/>' +
    '<g stroke="' + TRAIT + '" stroke-width=".5" opacity=".45">' +
      '<path d="M0 45h320M0 90h320M0 135h320M80 0v180M160 0v180M240 0v180"/>' +
    '</g>' +
    contenu +
    '<text x="10" y="171" font-family="monospace" font-size="9" fill="' + ENCRE +
      '" opacity=".65">' + titre + '</text>' +
  '</svg>';
}

/** Structure boîte : face avant cotée, hauteur en pas. */
function imageStructure(pn, longueur, largeur, pas) {
  const g = graine(pn);
  const L = Math.max(90, Math.min(200, (Number(longueur) || 400) / 3.2));
  const H = Math.max(40, Math.min(96, (Number(pas) || 2) * 18));
  const x = 160 - L / 2, y = 96 - H / 2;
  const nbVis = 2 + (g % 3);

  let vis = '';
  for (let i = 0; i < nbVis; i++) {
    const vx = x + 10 + i * ((L - 20) / Math.max(1, nbVis - 1 || 1));
    vis += '<circle cx="' + vx.toFixed(1) + '" cy="' + (y + 9) + '" r="3" fill="none" stroke="' + ENCRE + '" stroke-width="1.2"/>' +
           '<circle cx="' + vx.toFixed(1) + '" cy="' + (y + H - 9) + '" r="3" fill="none" stroke="' + ENCRE + '" stroke-width="1.2"/>';
  }

  return svgVersDataUri(cadre(
    '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="' + H + '" rx="4" fill="#fff" stroke="' + ENCRE + '" stroke-width="1.8"/>' +
    '<rect x="' + (x + 7) + '" y="' + (y + 7) + '" width="' + (L - 14) + '" height="' + (H - 14) + '" rx="2" fill="none" stroke="' + TRAIT + '" stroke-width=".8" stroke-dasharray="3 2"/>' +
    vis +
    '<g stroke="' + COTE + '" stroke-width="1">' +
      '<path d="M' + x + ' ' + (y - 12) + 'h' + L + 'M' + x + ' ' + (y - 16) + 'v8M' + (x + L) + ' ' + (y - 16) + 'v8"/>' +
    '</g>' +
    '<text x="160" y="' + (y - 17) + '" text-anchor="middle" font-family="monospace" font-size="10" fill="' + COTE + '">' + longueur + '</text>' +
    '<text x="' + (x + L + 9) + '" y="' + (y + H / 2 + 3) + '" font-family="monospace" font-size="10" fill="' + COTE + '">' + pas + ' pas</text>',
    pn));
}

/** Harnais : cheminement et connecteurs — ni cote ni masse, comme la fiche. */
function imageHarnais(pn, reference) {
  const g = graine(pn);
  const y1 = 60 + (g % 20), y2 = 120 - (g % 25);
  const courbe = 'M42 ' + y1 + ' C110 ' + (y1 - 30) + ', 190 ' + (y2 + 34) + ', 278 ' + y2;

  const connecteur = function (cx, cy, sens) {
    return '<g transform="translate(' + cx + ',' + cy + ') scale(' + sens + ',1)">' +
      '<rect x="-16" y="-13" width="16" height="26" rx="2.5" fill="#fff" stroke="' + ENCRE + '" stroke-width="1.6"/>' +
      '<path d="M-11 -6h6M-11 0h6M-11 6h6" stroke="' + ENCRE + '" stroke-width="1.4"/>' +
    '</g>';
  };

  return svgVersDataUri(cadre(
    '<path d="' + courbe + '" fill="none" stroke="' + ENCRE + '" stroke-width="7" stroke-linecap="round" opacity=".18"/>' +
    '<path d="' + courbe + '" fill="none" stroke="' + ENCRE + '" stroke-width="2.4" stroke-linecap="round"/>' +
    '<g stroke="' + TRAIT + '" stroke-width="1.4">' +
      '<path d="M96 ' + (y1 - 16) + 'v9M160 ' + ((y1 + y2) / 2 - 6) + 'v9M224 ' + (y2 - 12) + 'v9"/>' +
    '</g>' +
    connecteur(42, y1, 1) + connecteur(294, y2, -1) +
    '<text x="160" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="' + ENCRE + '">' +
      (reference || 'harnais') + '</text>',
    pn));
}

/** Plaquette éclairante : sérigraphie rétroéclairée, mots-clés au plan. */
function imagePlaquette(pn, numero, mots) {
  const libelles = String(mots || '').split(/[,;|]/).map(function (m) { return m.trim().toUpperCase(); })
                     .filter(Boolean).slice(0, 3);
  const L = 200, H = 76, x = 60, y = 58;

  let textes = '';
  libelles.forEach(function (m, i) {
    textes += '<text x="160" y="' + (y + 24 + i * 19) + '" text-anchor="middle" ' +
              'font-family="monospace" font-size="' + (i === 0 ? 13 : 10) + '" ' +
              'fill="#f6e27a" letter-spacing="1.5">' + m.slice(0, 22) + '</text>';
  });

  return svgVersDataUri(cadre(
    '<rect x="' + (x - 5) + '" y="' + (y - 5) + '" width="' + (L + 10) + '" height="' + (H + 10) +
      '" rx="7" fill="none" stroke="' + TRAIT + '" stroke-width="1" stroke-dasharray="4 3"/>' +
    '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="' + H + '" rx="5" fill="#16202e" stroke="' + ENCRE + '" stroke-width="1.6"/>' +
    '<rect x="' + (x + 4) + '" y="' + (y + 4) + '" width="' + (L - 8) + '" height="' + (H - 8) + '" rx="3" fill="none" stroke="#f6e27a" stroke-width=".6" opacity=".4"/>' +
    textes +
    '<text x="' + (x + L - 6) + '" y="' + (y + H - 7) + '" text-anchor="end" font-family="monospace" font-size="8" fill="#f6e27a" opacity=".65">' +
      (numero || '') + '</text>',
    pn));
}

/** Assemblage : face avant du boîtier avec ses emplacements. */
function imageAssemblage(pn, fonction) {
  const g = graine(pn);
  const cases = 2 + (g % 3);
  const L = 230, H = 110, x = 160 - L / 2, y = 96 - H / 2;

  let emplacements = '';
  for (let i = 0; i < cases; i++) {
    const w = (L - 24 - (cases - 1) * 8) / cases;
    const ex = x + 12 + i * (w + 8);
    emplacements += '<rect x="' + ex.toFixed(1) + '" y="' + (y + 26) + '" width="' + w.toFixed(1) +
      '" height="' + (H - 44) + '" rx="3" fill="#dfe7f1" stroke="' + TRAIT + '" stroke-width="1"/>' +
      '<circle cx="' + (ex + w / 2).toFixed(1) + '" cy="' + (y + 26 + (H - 44) / 2) + '" r="6" fill="#fff" stroke="' + ENCRE + '" stroke-width="1.3"/>';
  }

  return svgVersDataUri(cadre(
    '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="' + H + '" rx="6" fill="#fff" stroke="' + ENCRE + '" stroke-width="2"/>' +
    '<rect x="' + x + '" y="' + y + '" width="' + L + '" height="18" rx="6" fill="' + ENCRE + '"/>' +
    '<text x="' + (x + 10) + '" y="' + (y + 13) + '" font-family="monospace" font-size="10" fill="#fff" letter-spacing="1">' +
      String(fonction || '').toUpperCase().slice(0, 18) + '</text>' +
    emplacements,
    pn));
}

function illustrationPourLigne(ligne) {
  const type = String(ligne['Type'] || '').toLowerCase();
  if (type.indexOf('harnais') !== -1) {
    return imageHarnais(ligne['PN du type'], ligne['Référence']);
  }
  if (type.indexOf('plaquette') !== -1) {
    return imagePlaquette(ligne['PN du type'], ligne['Numéro'], ligne['Mots-clés']);
  }
  if (type.indexOf('structure') !== -1) {
    return imageStructure(ligne['PN du type'], ligne['Dim Long (mm)'],
                          ligne['Dim Larg (mm)'], ligne['Nombre de pas']);
  }
  return '';
}
</script>
