};

let DONNEES = JSON.parse(JSON.stringify(BASE));
function reinitialiserDemo() { DONNEES = JSON.parse(JSON.stringify(BASE)); compteurId = 0; }

// --- Helpers, alignés sur Api.gs ---------------------------------------
function trouverBoite(pn) {
  return DONNEES.boites.find(function (b) {
    return String(b['PN Global']).trim() === String(pn).trim();
  }) || null;
}
function trouverNom(id) {
  return DONNEES.nomenclature.find(function (n) {
    return String(n['ID_Ligne']).trim() === String(id).trim();
  }) || null;
}
function exigerTexte(v, libelle) {
  const s = String(v === null || v === undefined ? '' : v).trim();
  if (!s) throw new Error(libelle + ' est obligatoire.');
  return s;
}
function exigerPnLibre(pn) {
  if (trouverBoite(pn)) throw new Error('Le PN Global "' + pn + '" existe déjà.');
}
function validerStatut(s) {
  const p = String(s || '').trim();
  if (!p) return STATUT_DEFAUT;
  const t = STATUTS_VALIDES.find(function (x) { return x.toLowerCase() === p.toLowerCase(); });
  if (!t) throw new Error('Statut invalide : "' + p + '". Attendu : ' + STATUTS_VALIDES.join(', ') + '.');
  return t;
}
function copie(o) { return JSON.parse(JSON.stringify(o)); }

// --- Implémentation des fonctions exposées -----------------------------
const SERVEUR = {
  getToutLeContenu: function () {
    return {
      boites: copie(DONNEES.boites),
      nomenclature: copie(DONNEES.nomenclature),
      headersBoites: EN_TETES_BOITES.slice(),
      headersNom: EN_TETES_NOM.slice(),
      config: {
        multiBoite: ['Porteur', 'Composants'],
        multiNom: ['Qualification Brouillard salin', 'Qualification Vibration',
                   'Qualification Explosion', 'Mots-clés',
                   'Composants mécaniques', 'Composants routing'],
        lectureSeuleNom: ['ID_Ligne', 'PN Global'],
        statuts: STATUTS_VALIDES,
        porteurs: ['Dauphin', 'H125', 'H130', 'H135', 'H145', 'H145M', 'H160', 'H160M',
                   'H175', 'H215', 'H215M', 'H225', 'H225M', 'NH90', 'Tigre']
      }
    };
  },

  getCatalogueComposants: function () { return copie(DONNEES.catalogue); },

  saveBoite: function (pn, modifications) {
    const boite = trouverBoite(pn);
    if (!boite) throw new Error('Élément introuvable (PN Global = ' + pn + '). Rechargez la page.');
    const modifs = Object.assign({}, modifications);

    const nouveauPn = modifs['PN Global'] !== undefined ? String(modifs['PN Global']).trim() : null;
    const renomme = nouveauPn !== null && nouveauPn !== String(pn).trim();
    if (renomme) { exigerTexte(nouveauPn, 'Le PN Global'); exigerPnLibre(nouveauPn); }

    if (modifs['Statut'] !== undefined) {
      const voulu = String(modifs['Statut']).trim();
      if (voulu !== String(boite['Statut']).trim()) modifs['Statut'] = validerStatut(voulu);
      else delete modifs['Statut'];
    }

    Object.keys(modifs).forEach(function (k) {
      if (EN_TETES_BOITES.indexOf(k) !== -1) boite[k] = modifs[k];
    });

    if (renomme) {
      DONNEES.nomenclature.forEach(function (n) {
        if (String(n['PN Global']).trim() === String(pn).trim()) n['PN Global'] = nouveauPn;
      });
    }
    return { ok: true, boite: copie(boite), pnPrecedent: pn };
  },

  addBoite: function (pn, fonction, dsVci) {
    const propre = exigerTexte(pn, 'Le PN Global');
    exigerPnLibre(propre);
    const b = objet(EN_TETES_BOITES, []);
    b['PN Global'] = propre;
    b['Fonction'] = String(fonction || '').trim();
    b['DS/VCI Associé'] = String(dsVci || '').trim();
    b['Statut'] = STATUT_DEFAUT;
    if (!b['Image']) b['Image'] = photoBoitier(propre, b['Fonction']);
    DONNEES.boites.push(b);
    return { ok: true, boite: copie(b) };
  },

  deleteBoiteEntiere: function (pn) {
    const boite = trouverBoite(pn);
    if (!boite) throw new Error('Assemblage introuvable : ' + pn);
    const avant = DONNEES.nomenclature.length;
    DONNEES.nomenclature = DONNEES.nomenclature.filter(function (n) {
      return String(n['PN Global']).trim() !== String(pn).trim();
    });
    DONNEES.boites = DONNEES.boites.filter(function (b) { return b !== boite; });
    return { ok: true, pnSupprime: pn, nbNomenclature: avant - DONNEES.nomenclature.length };
  },

  saveNomenclature: function (id, modifications) {
    const ligne = trouverNom(id);
    if (!ligne) throw new Error('Élément introuvable (ID_Ligne = ' + id + '). Rechargez la page.');
    Object.keys(modifications).forEach(function (k) {
      if (k === 'ID_Ligne' || k === 'PN Global') return;
      if (EN_TETES_NOM.indexOf(k) !== -1) ligne[k] = modifications[k];
    });
    return { ok: true, ligne: copie(ligne) };
  },

  addSousEnsemble: function (pn, type, pnType) {
    if (!trouverBoite(pn)) throw new Error('Assemblage introuvable : ' + pn);
    const l = objet(EN_TETES_NOM, []);
    l['ID_Ligne'] = nouvelId();
    l['PN Global'] = pn;
    l['Type'] = String(type || '').trim();
    l['PN du type'] = String(pnType || '').trim();
    l['Image'] = photoPourLigne(l);      // démo : une photo d'exemple par défaut
    DONNEES.nomenclature.push(l);
    return { ok: true, ligne: copie(l) };
  },

  deleteNomenclature: function (id) {
    const ligne = trouverNom(id);
    if (!ligne) throw new Error('Élément introuvable (ID_Ligne = ' + id + ').');
    DONNEES.nomenclature = DONNEES.nomenclature.filter(function (n) { return n !== ligne; });
    return { ok: true, idSupprime: id };
  }
};

// --- Faux google.script.run --------------------------------------------
// Même forme que le vrai : chaînage des handlers, appel asynchrone.
window.google = {
  script: {
    run: (function construire(succes, echec) {
      const runner = {
        withSuccessHandler: function (f) { return construire(f, echec); },
        withFailureHandler: function (f) { return construire(succes, f); }
      };
      Object.keys(SERVEUR).forEach(function (nom) {
        runner[nom] = function () {
          const args = Array.prototype.slice.call(arguments);
          setTimeout(function () {
            try {
              if (window.SIMULER_PANNE) {
                throw new Error('Panne simulée : le serveur est injoignable.');
              }
              const r = SERVEUR[nom].apply(null, args);
              if (succes) succes(r);
            } catch (e) {
              if (echec) echec(e);
              else console.error('Aucun gestionnaire d\'échec pour ' + nom, e);
            }
          }, LATENCE_MS);
        };
      });
      return runner;
    })(null, null)
  }
};
