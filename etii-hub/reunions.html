<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réunions — comptes-rendus — ETII Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300205b'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Comptes-rendus de réunion du service ETII et de ses trois pôles : synthèse, sujets, actions et décisions, avec sélecteur de pôle, recherche et impression.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="assets/css/polices.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/skin.css">
  <link rel="stylesheet" href="assets/css/modules.css">

  <!-- =====================================================================
       Styles propres à la page Réunions.

       Uniquement ce qu'aucune classe de base.css, components.css ou
       skin.css ne couvre : le rattachement d'un code de pôle à son jeton
       de couleur, la barre d'outils, la disposition en deux volets, l'état
       sélectionné d'une option de liste, la mise en forme du lecteur, et
       les blocs « Actions » / « Décisions » qui doivent se détacher
       nettement du corps du texte (SPEC §6.3).

       Aucune valeur brute : tout vient de tokens.css. Seuls les points de
       rupture sont exprimés en pixels, comme dans base.css — une media
       query ne peut pas lire une variable CSS.
       ===================================================================== -->
  <style>
    /* ===================================================================
       1. Couleurs de pôle
       La palette catégorielle vit dans tokens.css ; ici on se contente de
       rattacher un code de pôle à son jeton. La couleur n'est JAMAIS
       seule porteuse de sens : toute pastille teintée est accompagnée du
       code du pôle en toutes lettres.
       =================================================================== */

    [data-pole="ETII"]  { --pole-teinte: var(--pole-etii); }
    [data-pole="ETIIA"] { --pole-teinte: var(--pole-etiia); }
    [data-pole="ETIIE"] { --pole-teinte: var(--pole-etiie); }
    [data-pole="ETIII"] { --pole-teinte: var(--pole-etiii); }

    /* Point de couleur d'une puce de pôle. Purement décoratif : le
       libellé qui le suit porte seul l'information. */
    .pole-point {
      flex: none;
      inline-size: var(--e-2);
      block-size: var(--e-2);
      border-radius: var(--rayon-plein);
      background-color: var(--pole-teinte, var(--texte-doux));
    }

    /* Pastille ÉTIQUETÉE du pôle d'une réunion : un point teinté et,
       toujours, le code du pôle écrit. Elle reprend le composant .badge ;
       seules ses trois variables de teinte sont réaffectées, donc le
       contraste AA reste celui garanti par components.css. */
    .badge--pole {
      --badge-fond: transparent;
      --badge-teinte: var(--pole-teinte, var(--texte-doux));
      --badge-bordure: var(--pole-teinte, var(--bordure));
    }

    /* Intitulé de section discret (sélecteur de pôle, titre de liste). */
    .reunions__titre-section {
      margin: 0;
      font-family: var(--police-mono);
      font-size: var(--texte-xs);
      font-weight: var(--graisse-moyenne);
      letter-spacing: var(--lettrage-etiquette);
      text-transform: uppercase;
      color: var(--texte-faible);
    }

    /* ===================================================================
       2. Barre d'outils : recherche à gauche, impression à droite
       =================================================================== */

    .barre-outils {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--e-3) var(--e-4);
    }

    /* Base large : la recherche occupe la ligne entière dès qu'il manque
       de place, et le bouton passe dessous. Aucune media query requise. */
    .barre-outils__recherche {
      flex: 1 1 calc(var(--e-16) * 5);
      min-inline-size: 0;
    }

    /* ===================================================================
       3. Disposition en deux volets, à l'intérieur de chaque panneau
       Liste à gauche, lecteur à droite. Sous 900 px les deux volets
       s'empilent, et l'ordre du document donne directement l'ordre voulu.
       =================================================================== */

    .reunions {
      display: grid;
      gap: var(--e-6);
      grid-template-columns: minmax(0, calc(var(--e-16) * 5)) minmax(0, 1fr);
      align-items: start;
    }

    .reunions__volet {
      min-inline-size: 0;
    }

    /* Le volet de liste reste visible pendant la lecture d'un compte-rendu
       long. Le décalage supérieur dégage l'en-tête collant du site. */
    @media (min-width: 901px) {
      .reunions__liste {
        position: sticky;
        top: var(--e-16);
        max-block-size: calc(100svh - var(--e-16) - var(--e-6));
        overflow-y: auto;
        /* La cible d'un défilement clavier ne colle pas au bord haut. */
        scroll-padding-block: var(--e-2);
        /* Laisse respirer l'anneau de focus d'une option en bord de zone. */
        padding: var(--focus-epaisseur);
        margin: calc(var(--focus-epaisseur) * -1);
      }
    }

    @media (max-width: 900px) {
      .reunions {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* `[hidden]` doit l'emporter sur le `display` posé par les primitives
       de base.css, dont la spécificité est identique à celle de la règle
       du navigateur. Un sélecteur ciblé suffit : pas de !important. */
    .pile[hidden],
    .rangee[hidden] {
      display: none;
    }

    /* ===================================================================
       4. Options de la liste de réunions
       Ce sont de vraies options de listbox : l'état est porté par
       aria-selected, jamais par une classe posée en JavaScript.
       =================================================================== */

    .reunions__options {
      display: flex;
      flex-direction: column;
      gap: var(--e-3);
      margin: 0;
    }

    .reunion-option {
      cursor: pointer;
    }

    .reunion-option:hover {
      border-color: var(--bordure-forte);
      box-shadow: var(--ombre-md);
    }

    .reunion-option[aria-selected="true"] {
      border-color: var(--accent);
      background-color: var(--accent-doux);
      box-shadow: var(--ombre-md);
    }

    .reunion-option[aria-selected="true"] .carte__titre {
      color: var(--texte-accent);
    }

    /* Le titre d'une option reste au calibre du texte courant : la liste
       est dense, ce n'est pas une suite de titres de niveau carte. */
    .reunion-option .carte__titre {
      font-size: var(--texte-md);
      font-weight: var(--graisse-moyenne);
    }

    .reunion-option__extrait {
      margin: 0;
      font-size: var(--texte-sm);
      color: var(--texte-doux);
    }

    /* Décompte affiché sous le titre de liste, mis à jour à chaque frappe. */
    .reunions__compteur {
      font-size: var(--texte-xs);
      color: var(--texte-faible);
      margin: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .reunion-option {
        transition: border-color var(--duree-rapide) var(--courbe),
                    background-color var(--duree-rapide) var(--courbe),
                    box-shadow var(--duree-rapide) var(--courbe);
      }
    }

    /* ===================================================================
       5. Lecteur de réunion
       =================================================================== */

    .lecteur:focus {
      outline: none;
    }

    .lecteur:focus-visible {
      outline: var(--focus-epaisseur) solid var(--focus-couleur);
      outline-offset: var(--focus-decalage);
    }

    /* Fondu discret à chaque changement de réunion. Opacité seule : aucun
       déplacement, aucune machine à écrire (SPEC §2). */
    @keyframes reunion-apparition {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .lecteur__contenu {
        animation: reunion-apparition var(--duree) var(--courbe);
      }
    }

    .lecteur__titre-section {
      margin: 0;
      font-size: var(--texte-md);
      font-weight: var(--graisse-forte);
      color: var(--texte);
    }

    /* --- Sujets : titre + notes ---------------------------------------- */

    ul.sujets {
      display: flex;
      flex-direction: column;
      gap: var(--e-4);
      margin: 0;
    }

    .sujet {
      padding-inline-start: var(--e-4);
      border-inline-start: var(--e-1) solid var(--bordure);
    }

    .sujet__titre {
      margin: 0;
      font-size: var(--texte-md);
      font-weight: var(--graisse-moyenne);
      color: var(--texte);
    }

    .sujet__notes {
      margin: 0;
      max-width: var(--largeur-texte);
      color: var(--texte-doux);
    }

    /* ===================================================================
       6. Blocs « Actions » et « Décisions »
       Ils doivent se distinguer nettement du corps du texte : surface
       propre, liseré teinté, étiquette explicite et liste numérotée.
       La teinte du texte d'étiquette est rapprochée de la couleur de texte
       du thème courant — technique documentée en tête de components.css,
       qui garantit le contraste AA en clair comme en sombre.
       =================================================================== */

    .bloc-cle {
      --bloc-teinte: var(--texte-doux);
      --bloc-fond: var(--fond-enfonce);

      display: flex;
      flex-direction: column;
      gap: var(--e-3);

      padding: var(--e-4) var(--e-5);

      background-color: var(--bloc-fond);
      border: 1px solid var(--bloc-teinte);
      border-inline-start-width: var(--e-1);
      border-radius: var(--rayon-md);
    }

    .bloc-cle--actions {
      --bloc-teinte: var(--statut-alerte);
      --bloc-fond: var(--statut-alerte-fond);
    }

    .bloc-cle--decisions {
      --bloc-teinte: var(--statut-succes);
      --bloc-fond: var(--statut-succes-fond);
    }

    .bloc-cle__entete {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--e-2) var(--e-3);
    }

    .bloc-cle__titre {
      margin: 0;
      font-size: var(--texte-sm);
      font-weight: var(--graisse-extra);
      letter-spacing: calc(var(--e-1) / 2);
      text-transform: uppercase;

      color: var(--bloc-teinte);
      color: color-mix(in srgb, var(--bloc-teinte) 72%, var(--texte));
    }

    /* L'icône est purement décorative : le sens est porté par l'étiquette
       textuelle qui la suit, jamais par la seule couleur ni le seul glyphe. */
    .bloc-cle__icone {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      inline-size: var(--e-6);
      block-size: var(--e-6);

      background-color: var(--fond-eleve);
      border: 1px solid var(--bloc-teinte);
      border-radius: var(--rayon-plein);

      color: var(--bloc-teinte);
      color: color-mix(in srgb, var(--bloc-teinte) 72%, var(--texte));

      font-size: var(--texte-sm);
      line-height: 1;
    }

    /* Vraies listes numérotées : le lecteur d'écran annonce « liste de N
       éléments ». La sélection d'attribut de base.css (`ol[class]`) a la
       même spécificité ; c'est l'ordre de cascade — cette feuille venant
       après — qui rétablit le marqueur. */
    ol.bloc-cle__liste {
      margin: 0;
      padding-inline-start: var(--e-6);
      list-style: decimal;
      color: var(--texte);
    }

    ol.bloc-cle__liste li + li {
      margin-block-start: var(--e-2);
    }

    ol.bloc-cle__liste li::marker {
      color: var(--bloc-teinte);
      color: color-mix(in srgb, var(--bloc-teinte) 72%, var(--texte));
      font-weight: var(--graisse-forte);
    }

    /* ===================================================================
       7. Impression : uniquement la réunion affichée
       components.css déplie les panneaux d'onglets masqués pour les pages
       qui veulent tout imprimer ; ici c'est l'inverse qui est demandé —
       seule la réunion ouverte part à l'impression. On rétablit donc le
       masquage, et on retire tout le reste : liste latérale, barre
       d'outils, sélecteur de pôle, boutons. L'en-tête, la navigation, le
       pied de page, le dépliage des liens externes et tout ce qui porte
       `sans-impression` sont déjà traités par base.css.
       =================================================================== */

    @media print {
      /* Priorité sur la règle de dépliage de components.css. */
      .onglets__panneau[hidden] {
        display: none !important;
      }

      /* La barre d'onglets elle-même n'a pas de sens sur le papier : le
         lecteur imprimé porte déjà la nature de la réunion en badge. */
      .onglets__liste,
      .barre-outils,
      .reunions__liste {
        display: none !important;
      }

      .reunions {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }

      /* Plus de colonne collante ni de hauteur contrainte sur le papier. */
      .reunions__volet {
        position: static;
        max-block-size: none;
        overflow: visible;
      }

      .lecteur {
        border: 0;
        padding: 0;
      }

      .bloc-cle {
        border: 1px solid var(--gris-400);
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="site-entete">
    <div class="site-entete__interieur">
      <a class="site-logo" href="index.html">ETII <span>HUB</span></a>
      <nav class="site-nav" aria-label="Navigation principale">
        <ul class="site-nav__liste">
          <li><a href="index.html" aria-current="page">Tableau de bord</a></li>
          <li><a href="etiia.html" data-pole="ETIIA">ETIIA</a></li>
          <li><a href="etiie.html" data-pole="ETIIE">ETIIE</a></li>
          <li><a href="etiii.html" data-pole="ETIII">ETIII</a></li>
          <li><a href="docsearch.html">Recherche</a></li>
        </ul>
      </nav>
      <button class="palette-ouvrir" type="button" data-palette>
        <span aria-hidden="true">⌕</span>
        <span class="palette-ouvrir__libelle">Rechercher partout</span>

      </button>
      <button class="bascule-theme" type="button" data-bascule-theme
              aria-pressed="false">
        <span class="bascule-theme__icone bascule-theme__icone--clair" aria-hidden="true">☾</span>
        <span class="bascule-theme__icone bascule-theme__icone--sombre" aria-hidden="true">☀</span>
        <span class="bascule-theme__libelle">Thème sombre</span>
      </button>
    </div>
  </header>

  <main id="contenu" tabindex="-1">
    <div class="conteneur pile pile--lache">

      <!-- ==============================================================
           Titre et accroche
           ============================================================== -->
      <div class="pile pile--serree page-entete">
        <p class="page-entete__sur-titre">Service ETII</p>
        <h1>Réunions</h1>
      </div>

      <!-- ==============================================================
           Sous-navigation vers les autres pages transverses. Chaque lien
           porte le pôle actif dans son hash : reunions.js la construit,
           car elle dépend du pôle lu dans l'URL. Elle vit hors de la zone
           de données pour rester utilisable même si le fichier de
           réunions est introuvable.
           ============================================================== -->
      <nav id="reunions-sous-nav" class="sans-impression"
           aria-label="Pages du périmètre affiché"></nav>

      <!-- ==============================================================
           Zone alimentée par assets/data/reunions.json.
           Les trois états — chargement, erreur, vide — sont pris en
           charge par avecEtat() dans assets/js/reunions.js.
           ============================================================== -->
      <div id="zone-reunions" class="pile pile--lache"></div>

    </div>
  </main>

  <footer class="site-pied">
    <div class="site-pied__interieur">
      <p>ETII Hub — portail de démonstration, sans aucune dépendance externe.</p>
      <p class="site-pied__mention">
        <span aria-hidden="true">●</span>
        Toutes les données de ce site sont fictives
      </p>
    </div>
  </footer>
  <script type="module" src="assets/js/palette.js"></script>

  <script type="module" src="assets/js/reunions.js"></script>
