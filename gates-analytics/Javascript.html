     que SEE ne connaît pas), rien. */
  function etatSeeDeLigne(l) {
    var titres = SECONDE.titres, cles = SECONDE.cles;
    var voulues = SECONDE.essentielles.filter(function (t) { return cles.indexOf(t) === -1; });
    if (!voulues.length) voulues = titres.filter(function (t) { return /^(user\s*)?stat(us|ut)$|^(é|e)tat$|^validated$|^valid(é|e)$/i.test(String(t).trim()); });
    return voulues.slice(0, 3).map(function (t) {
      var v = String(l[t] == null ? '' : l[t]).trim();
      if (!v) return '';
      if (estBooleen(v)) {
        var date = titres.filter(function (d) { return norm(d) === norm(t + ' date') || norm(d) === norm('date ' + t); })[0];
        var quand = date ? String(l[date] == null ? '' : l[date]).trim() : '';
        return ech(t) + ' ' + (estVrai(v) ? '\u2713' : 'non') + (estVrai(v) && quand ? ' le ' + ech(quand) : '');
      }
      return ech(t) + ' ' + ech(v);
    }).filter(Boolean).join(' \u00b7 ');
  }
  function ligneSeePlan(p) {
    if (!RAPPROCHEMENT || !SECONDE) return '';
    var R = RAPPROCHEMENT, nom = nomSeconde(), cat = R.parPlan[p.reference];
    var lignes = R.lignes.filter(function (e) { return e.plan && e.plan.reference === p.reference; });
    var verdict = cat ? '\x3Cspan class="verdict-see ' + cat + '">\u2192 ' + ech(phraseLot(cat, 1, nom)) + '\x3C/span>' : '';
    var tete = '\x3Cdiv class="fiche-plan-see" id="fiche-plan-see">\x3Cspan class="mot-see">Dans ' + ech(nom) + '\u00a0:\x3C/span>';
    if (!lignes.length) return tete + '\x3Cspan>aucune ligne\x3C/span>' + verdict + '\x3C/div>';
    var e = lignes.filter(function (x) { return x.cat === cat; })[0] || lignes[0];
    var refLa = SECONDE.cles.map(function (t) { return String(e.ligne[t] == null ? '' : e.ligne[t]).trim(); }).filter(Boolean).join(' \u00b7 ');
    var etat = etatSeeDeLigne(e.ligne);
    return tete + '\x3Cspan class="ligne-see">' + ech(refLa || e.ref) + '\x3C/span>' +
      (etat ? '\x3Cspan>\u2014 ' + etat + '\x3C/span>' : '') + verdict +
      (lignes.length > 1 ? '\x3Cspan>(' + nb(lignes.length) + ' lignes)\x3C/span>' : '') +
      '\x3Cbutton type="button" class="lien-doux" data-voir-see="' + ech(p.reference) + '">Voir ' + (lignes.length > 1 ? 'les lignes ' : 'la ligne ') + ech(nom) + '\x3C/button>\x3C/div>';
  }

  /* À surveiller : les plans à l'arrêt du périmètre, en une puce qui les
     montre dans le tableau — un second clic retire le filtre. */
  function rendreASurveiller() {
    var zone = $('a-surveiller');
    /* Le nombre dit, c'est le nombre de lignes que le clic montrera : compté
       sur la sélection (groupe ouvert, recherche…), pas sur tout le
       périmètre. À zéro, la puce s'efface — sauf pressée, pour qu'on puisse
       la retirer. */
    var a = arretsDuClic();
    var actif = vue.refsLibelle === SEL_ARRET;
    zone.hidden = !a.length && !actif;
    if (zone.hidden) { zone.innerHTML = ''; return; }
    zone.innerHTML = '\x3Cspan>À surveiller :\x3C/span>' +
      '\x3Cbutton class="puce-delta puce-arret" type="button" data-arret="1" aria-pressed="' + actif + '" title="' +
      ech('Plans en cours dont la valeur n\u2019a pas changé depuis ' + SEMAINES_ARRET + ' semaines ou plus, relevé après relevé \u2014 ' +
        (actif ? 'cliquez pour retirer le filtre' : 'cliquez pour les voir dans le tableau')) + '">' +
      '\x3Cspan class="pastille arret">\x3C/span>\x3Cb>' + nb(a.length) + '\x3C/b> ' +
      (a.length > 1 ? 'plans en cours n\u2019ont pas bougé' : 'plan en cours n\u2019a pas bougé') +
      ' depuis ' + SEMAINES_ARRET + ' semaines ou plus\x3C/button>';
  }

  /* ============================================================
     JOURNAL DES CHANGEMENTS
     Chaque relevé archivé garde l'avancement plan par plan. Comparer deux
     relevés successifs donne, semaine par semaine, qui a bougé et dans quel
     sens — la seule chose que l'export du jour ne dira jamais.
     ============================================================ */
  /* PLAN_PAR_REF, PLAN_PAR_RACINE et JOURNAL sont dérivés dans
     chargerSource(). Les événements d'une semaine viennent d'apparier() :
     un plan réémis y est un changement d'indice, pas un disparu plus un nouveau. */
  function construireJournal() {
    var journal = [];
    RELEVES_IDENTIQUES = [];
    for (var k = 1; k < RELEVES.length; k++) {
      var avant = RELEVES[k - 1].plans, apres = RELEVES[k].plans;
      if (!avant || !apres) continue;
      var evenements = apparier(avant, apres);
      /* Débrief 27 (P-F10) : « avant », la semaine du relevé comparé — la
         ligne de la semaine en dit les deux dates. */
      if (evenements.length) journal.push({ i: RELEVES[k].i, avant: RELEVES[k - 1].i, evenements: evenements });
      else RELEVES_IDENTIQUES.push(RELEVES[k].i);
    }
    return journal.reverse();          // la semaine la plus récente en tête
  }

  /* Le plan derrière une référence, même ancienne : une référence qui n'est
     plus dans la feuille se retrouve par sa racine et sa solution — c'est le
     même plan, réémis sous un autre indice depuis. */
  function planDeRef(ref) {
    return PLAN_PAR_REF[ref] || PLAN_PAR_RACINE[clePlan(analyserUD(ref))] || null;
  }

  /* Le filtre du journal : une valeur, « reculs » ou « indice ». Sous une
     valeur, tous les plans ARRIVÉS à elle, d'où qu'ils viennent : passages,
     reculs, et réémissions qui en ont changé au passage (débrief 18 :
     « ceux qui sont devenus validés » — un plan validé l'est souvent sous
     un nouvel indice, et le filtre « Validé » ne le montrait pas). Dans la
     semaine, chaque ligne garde sa case : un plan réémis devenu « Validé »
     se compte sous « changement d'indice ». Les nouveaux et les disparus ne
     se voient que sous « Tout ». */
  function arriveA(e, cle) {
    return (e.type === 'change' || e.type === 'indice') && e.cApres === cle && e.cAvant !== cle;
  }
  function retenuParJournal(e, filtre) {
    if (!filtre) return true;
    if (filtre === 'indice') return e.type === 'indice';
    if (filtre === 'reculs') return estRecul(e);
    /* Débrief 23 : les nouveaux et les disparus se filtrent comme le reste. */
    if (filtre === 'nouveaux') return e.type === 'nouveau';
    if (filtre === 'disparus') return e.type === 'disparu';
    return arriveA(e, filtre);
  }
  /* Les comptes d'une liste d'événements, avec les mots du journal et de la
     bulle : passages par état d'arrivée, nouveaux, disparus, changements
     d'indice. Une case par événement, pour que la somme des comptes soit le
     nombre de lignes : un plan réémis compte sous « changement d'indice »,
     même s'il change d'état au passage — sa ligne montre l'état avant et après. */
  function comptesEvenements(evts) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0, recul: 0, nouveau: 0, disparu: 0, indice: 0 };
    evts.forEach(function (e) {
      if (e.type === 'nouveau') { c.nouveau++; return; }
      if (e.type === 'disparu') { c.disparu++; return; }
      if (estReemission(e)) { c.indice++; return; }
      if (estRecul(e)) { c.recul++; return; }
      c[e.apres]++;
    });
    return c;
  }

  /* La pastille d'un état — ou, hors des états, le violet du changement
     d'indice et la pastille transparente qui tient la place des autres. */
  function pastilleDe(cle) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '\x3Cspan class="pastille ' + (cle === 'indice' ? 'indice' : 'sans') + '">\x3C/span>';
    return e.hachure
      ? '\x3Cspan class="pastille hachure">\x3C/span>'
      : '\x3Cspan class="pastille" style="background:' + e.couleur + '">\x3C/span>';
  }
  /* L'étiquette d'une valeur dans le journal : sa pastille, et la valeur
     écrite comme dans l'extract (à défaut, le nom de sa famille). Une
     valeur trop longue pour sa moitié passe à la ligne après un « _ »
     (PWD_IN_ / PROGRESS), pas au milieu d'un mot ; <wbr> n'ajoute rien au
     texte. Les valeurs de GATES (15 caractères au plus) tiennent dans leur
     moitié sauf sur un écran étroit : ailleurs, elles s'écrivent d'un seul
     tenant, comme avant — une coupure possible change l'approche des
     lettres autour du « _ ». */
  var JOURNAL_ETROIT = window.matchMedia ? window.matchMedia('(max-width: 560px)') : null;
  var journalEtroit = null;            // la largeur du dernier rendu du journal
  function etiqEtat(cle, role, cleV, libelle) {
    var e = ETAT_PAR_CLE[cle];
    if (!e) return '';
    var texte = ech(libelle || e.court);
    if (journalEtroit || texte.length > 15) texte = texte.replace(/_/g, '_\x3Cwbr>');
    return '\x3Cspan class="etiq-etat ' + (role || '') + '">' + (cleV ? pastilleValeur(cleV, cle) : pastilleDe(cle)) +
      texte + '\x3C/span>';
  }

  var MAX_JOURNAL = 12;                // lignes affichées avant « voir tout »
  /* Les semaines du journal partagent une grille (subgrid) pour aligner
     leurs colonnes ; un navigateur qui ne la connaît pas garde la ligne
     libre d'avant. */
  var GRILLE_JOURNAL = !!(window.CSS && CSS.supports && CSS.supports('grid-template-columns', 'subgrid'));

  /* Le journal affiché : sous un périmètre, seuls les événements des plans
     qui en font partie ; une semaine qui n'en a plus disparaît. */
  function journalAffiche() {
    if (!vue.perimetre && !vue.groupe && !vue.refs) return JOURNAL;
    return JOURNAL.map(function (sem) {
      return { i: sem.i, avant: sem.avant, evenements: sem.evenements.filter(function (e) { return dansPerimetreEvt(e) && dansFiltresPageEvt(e); }) };
    }).filter(function (sem) { return sem.evenements.length > 0; });
  }
  /* Débrief 28 : le journal suit aussi les filtres de la page qui portent sur
     des plans — un groupe (« Filtrer la page sur ECP-2108 », un ATA…) ou une
     liste de plans : comme le reste de la page, il ne montre que leurs
     changements (Nathan : « ça filtre tout, sauf semaine par semaine »). */
  function dansFiltresPageEvt(e) {
    if (vue.refs && !vue.refs[e.ref]) return false;
    if (vue.groupe) {
      var p = planDeRef(e.ref);
      if (!p || String(valeurDim(p, vue.groupe.dim) || '\u2014') !== vue.groupe.val) return false;
    }
    return true;
  }

  /* Un journal vide, et pourquoi — la vraie raison, pas toujours « il faut
     deux relevés » (débrief 16 : deux semaines archivées, et la page disait
     encore d'attendre le deuxième relevé). Débrief 27 (D8) : en deux temps,
     comme tous les états vides de la page — une phrase courte (« phrase »),
     puis l'explication (« detail », le texte d'avant, mot pour mot). */
  function pourquoiJournalVide() {
    var enConcept = CLE_SUIVIE !== 'avancement';
    var archives = RELEVES_SRC.length, avecConcept = RELEVES_SRC.filter(function (r) { return r.plansConcept; }).length;
    var commence = 'Le journal commence au deuxième relevé';
    if (RELEVES.length < 2) {
      if (!archives) return { phrase: commence, detail: 'Le journal se remplira au deuxième relevé archivé : il faut deux relevés pour savoir ce qui a bougé entre les deux.' };
      if (enConcept && avecConcept < archives && avecConcept < 2) {
        return { phrase: 'Le journal du concept harnais commence au deuxième relevé qui l\u2019a gardé',
                 detail: 'Les relevés archivés avant le suivi du concept harnais n\u2019en gardent pas la valeur : le journal du concept se remplira à partir du deuxième relevé qui l\u2019a gardée.' };
      }
      return { phrase: commence,
               detail: 'Un seul relevé archivé pour l\u2019instant (' + semaineDite(RELEVES[0].i) + ') : le journal se remplira au suivant. ' +
        'Deux archivages dans la même semaine n\u2019en font qu\u2019un — le second remplace le premier. Si l\u2019onglet du contrat ' +
        'a été renommé depuis un archivage, son historique porte encore l\u2019ancien nom : Suivi FWD → Diagnostic le signale.' };
    }
    var comparees = 0, sansCarte = [];
    for (var k = 1; k < RELEVES.length; k++) {
      if (RELEVES[k - 1].plans && RELEVES[k].plans) comparees++;
      else sansCarte.push(semaineDite(RELEVES[(RELEVES[k - 1].plans ? k : k - 1)].i));
    }
    if (!comparees) {
      return { phrase: 'Ces relevés n\u2019ont pas le détail plan par plan',
               detail: 'Les relevés de ' + sansCarte.filter(function (x, i, t) { return t.indexOf(x) === i; }).join(', ') +
        ' n\u2019ont pas le détail plan par plan : le journal ne peut pas dire ce qui a changé. Le prochain archivage l\u2019aura.' };
    }
    var a = RELEVES[0], b = RELEVES[RELEVES.length - 1];
    return { phrase: 'Aucun plan n\u2019a changé d\u2019un relevé à l\u2019autre',
             detail: 'Aucun plan n\u2019a changé de valeur ' + (RELEVES.length > 2 ? 'd\u2019un relevé à l\u2019autre, de ' : 'entre ') +
      semaineDite(a.i) + (RELEVES.length > 2 ? ' à ' : ' et ') + semaineDite(b.i) + ' (' + nb(Object.keys(b.plans || {}).length) +
      ' plans comparés). Si des plans ont avancé entre-temps, c\u2019est sans doute le même export qui a été archivé deux fois : ' +
      'importer le dernier export de GATES (' + MENU_IMPORT + ', qui archive dans la foulée), ou le recoller puis archiver.' };
  }

  /* Débrief 27 (P-F10) — les dates d'une semaine du journal : « S43 · du
     ven. 16 au ven. 23 oct. ». Une ligne compare deux relevés : le jour où
     chacun a été archivé (la colonne « Date » de l'historique), pas le lundi
     ou le dimanche de la semaine. L'année ne s'écrit que si elle n'est pas
     celle d'aujourd'hui (ou si la semaine passe d'une année à l'autre).
     L'extract du jour, pas encore archivé, se dit « depuis le … » ; un
     relevé dont on n'a pas la date garde l'écriture d'avant, « S43 · oct.
     2026 » — on n'invente pas un jour. */
  var JOURS_COURTS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  function lireJourReleve(t) {
    var s = String(t || ''), m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s) || null, d = null;
    if (m) d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))) d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
    return d && !isNaN(d.getTime()) ? d : null;
  }
  function joursDesReleves() {
    var parSemaine = {};
    RELEVES_SRC.forEach(function (r) { var j = lireJourReleve(r.date); if (j) parSemaine[indexDe(r.semaine)] = j; });
    return parSemaine;
  }
  function datesSemaineJournal(sem, jours) {
    var num = 'S' + numeroSemaine(sem.i);
    var extrait = EXTRAIT_EN_PLUS && DERNIER && sem.i === DERNIER.i;
    var fin = extrait ? null : jours[sem.i], debut = sem.avant !== undefined ? jours[sem.avant] : null;
    var annee = aujourdhuiCivil().getUTCFullYear();
    var court = function (d, mois, an) {
      return JOURS_COURTS[d.getUTCDay()] + '\u00a0' + d.getUTCDate() + (mois ? '\u00a0' + MOIS_COURT[d.getUTCMonth()] : '') + (an ? '\u00a0' + d.getUTCFullYear() : '');
    };
    var enLettres = function (d, mois, an) {
      return JOURS_SEMAINE[d.getUTCDay()] + ' ' + d.getUTCDate() + (mois ? ' ' + MOIS[d.getUTCMonth()] : '') + (an ? ' ' + d.getUTCFullYear() : '');
    };
    if (extrait && debut) {
      var anD = debut.getUTCFullYear() !== annee;
      return { num: num, dates: 'depuis le ' + court(debut, true, anD), dit: 'semaine en cours, l\u2019extract du jour comparé au relevé du ' + enLettres(debut, true, anD) };
    }
    if (!fin) {
      var jeudi = new Date(dateDe(sem.i).getTime() + 3 * 86400000);
      return { num: num, dates: semaineDite(sem.i).replace(/^S\d+\u00a0\u00b7 /, ''),
               dit: 'semaine ' + numeroSemaine(sem.i) + ', ' + MOIS[jeudi.getUTCMonth()] + ' ' + jeudi.getUTCFullYear() };
    }
    var anF = fin.getUTCFullYear() !== annee;
    if (!debut) return { num: num, dates: 'jusqu\u2019au ' + court(fin, true, anF), dit: 'semaine jusqu\u2019au ' + enLettres(fin, true, anF) };
    var autreAn = debut.getUTCFullYear() !== fin.getUTCFullYear();
    var autreMois = autreAn || debut.getUTCMonth() !== fin.getUTCMonth();
    return { num: num,
             dates: 'du ' + court(debut, autreMois, autreAn) + ' au ' + court(fin, true, anF || autreAn),
             dit: 'semaine du ' + enLettres(debut, autreMois, autreAn) + ' au ' + enLettres(fin, true, anF || autreAn) };
  }

  /* La rangée du journal (débrief 18) : les valeurs de la colonne, dans
     l'ordre des tuiles du haut, puis celles qu'aucun plan ne porte plus mais
     vers lesquelles des plans sont passés, puis les reculs et les
     changements d'indice. Chacune dit combien de plans y sont arrivés,
     toutes semaines du périmètre confondues : exactement les lignes qu'elle
     montre. À zéro, pas de pastille (débrief 19). Réécrite à chaque rendu,
     journal vide compris : elle ne garde jamais les boutons d'un autre
     contrat ni de l'autre avancement.
     Débrief 27 (P-F3, X-A3) : deux rangées titrées qui passent à la ligne
     — « Passés à » (les valeurs) et « Mouvements » (les reculs d'abord, en
     rouge, puis les nouveaux, les disparus, les changements d'indice) —,
     « Tout » à gauche des deux. Plus rien ne se cache au bout d'une rangée
     qui défile : « Reculs », la pastille qu'on vient chercher, était hors
     du cadre, son anneau du focus avec elle. */
  function rendreFiltreJournal(journal) {
    /* Deux comptes : sur tout le journal du périmètre (il décide si le
       choix tient encore), et sous la recherche du journal — celui qui
       s'affiche : chaque pastille dit exactement les lignes qu'elle
       montrerait, et celle qui n'en montrerait aucune n'est pas posée. */
    var q = motCherche(vue.rechercheJournal);
    var total = {}, vu = {}, hier = {};
    var compter = function (k, trouve) { total[k] = (total[k] || 0) + 1; if (trouve) vu[k] = (vu[k] || 0) + 1; };
    journal.forEach(function (sem) {
      sem.evenements.forEach(function (e) {
        var trouve = !q || refCorrespond(e.ref, q) || (!!e.ancienne && refCorrespond(e.ancienne, q));
        if (e.type === 'indice') compter('\u0001indice', trouve);
        if (e.type === 'nouveau') compter('\u0001nouveaux', trouve);
        if (e.type === 'disparu') compter('\u0001disparus', trouve);
        if (estRecul(e)) compter('\u0001reculs', trouve);
        if ((e.type === 'change' || e.type === 'indice') && e.cApres && e.cApres !== e.cAvant) {
          compter(e.cApres, trouve);
          if (!valeurDeCle(e.cApres) && !hier[e.cApres]) hier[e.cApres] = { cle: e.cApres, libelle: e.vApres, famille: e.apres };
        }
      });
    });
    var dans = vue.perimetre ? ' dans le périmètre ' + vue.perimetre : '';
    var pour = q ? ' pour « ' + vue.rechercheJournal.trim() + ' »' : '';
    var item = function (v) {
      var n = vu[v.cle] || 0;
      return { cle: v.cle, famille: v.famille, libelle: v.libelle, n: n, absente: !n, total: total[v.cle] || 0,
               titre: n ? (n > 1 ? nb(n) + ' arrivées' : '1 arrivée') + ' à « ' + v.libelle + ' »' + pour + ', toutes semaines confondues' +
                          ' — passages, reculs et réémissions sous un autre indice ; un plan arrivé deux fois compte deux fois'
                        : 'Aucun plan n’est arrivé à « ' + v.libelle + ' »' + pour + dans + ' d’un relevé à l’autre' };
    };
    var valeurs = VALEURS_COLONNE.map(item).concat(Object.keys(hier).map(function (k) { return hier[k]; })
      .sort(function (a, b) { return RANG_FAMILLE[a.famille] - RANG_FAMILLE[b.famille] || COMPARER_REF(a.libelle, b.libelle); })
      .map(item));
    var nR = vu['\u0001reculs'] || 0, nI = vu['\u0001indice'] || 0, nN = vu['\u0001nouveaux'] || 0, nD = vu['\u0001disparus'] || 0;
    var mouvements = [
      { cle: 'reculs', libelle: 'Reculs', pastille: '\x3Cspan class="pastille recul">\x3C/span>', n: nR, absente: !nR, total: total['\u0001reculs'] || 0,
        titre: nR ? 'Les plans qui ont reculé' + pour + ' : validés qui ne le sont plus, en cours revenus « à faire »' : 'Aucun recul' + pour + dans },
      /* Débrief 23 : « nouveaux, supprimés… il faut un peu pour tous les filtres ». */
      { cle: 'nouveaux', libelle: 'Nouveaux', pastille: '\x3Cspan class="pastille nouveau">\x3C/span>', n: nN, absente: !nN, total: total['\u0001nouveaux'] || 0,
        titre: nN ? 'Les plans apparus dans l’extract' + pour + ' : absents du relevé précédent' : 'Aucun nouveau plan' + pour + dans },
      { cle: 'disparus', libelle: 'Disparus', pastille: '\x3Cspan class="pastille disparu">\x3C/span>', n: nD, absente: !nD, total: total['\u0001disparus'] || 0,
        titre: nD ? 'Les plans sortis de l’extract' + pour + ' : présents au relevé précédent, absents de celui-ci' : 'Aucun plan disparu' + pour + dans },
      { cle: 'indice', libelle: 'Changements d’indice', pastille: '\x3Cspan class="pastille indice">\x3C/span>', n: nI, absente: !nI, total: total['\u0001indice'] || 0,
        titre: nI ? 'Les plans réémis sous un autre indice' + pour : 'Aucun changement d’indice' + pour + dans }
    ];
    /* Un choix qui n'a plus rien à montrer dans tout le journal — l'autre
       périmètre, une valeur disparue — revient à « Tout ». La recherche,
       elle, ne le retire pas : on le garde pendant la frappe. */
    if (vue.journal && !valeurs.concat(mouvements).some(function (x) { return x.cle === vue.journal && x.total; })) vue.journal = '';
    /* Seulement les passages qu'il y a (débrief 19) : un journal vide n'a
       pas de pastille du tout, un journal de validations seules n'a que
       « Tout » et « VALIDATED » (et pas de rangée « Mouvements »). Le choix
       en cours reste, même à zéro sous la recherche : on ne le retire pas
       en douce. */
    var montres = function (liste) { return liste.filter(function (x) { return !x.absente || x.cle === vue.journal; }); };
    var passes = montres(valeurs), bouges = montres(mouvements);
    var rangee = $('filtre-journal');
    if (!passes.length && !bouges.length) {
      rangee.innerHTML = '';
      rangee.hidden = true;
      return;
    }
    /* Une pastille : sa couleur, son nom, son compte. Le nom et le compte
       portent leur version grasse en réserve (data-texte, voir la feuille de
       style) : pressée, la pastille ne s'élargit pas, et la rangée ne
       repasse pas à la ligne autrement sous le pointeur. Le lecteur d'écran
       lit « VALIDATED, 34 », pas « VALIDATED34 ». */
    var puce = function (x) {
      var n = x.n !== undefined ? nb(x.n) : '';
      return '\x3Cbutton type="button" data-journal="' + ech(x.cle) + '"' + (x.famille ? ' data-famille="' + x.famille + '"' : '') +
        (x.cle === 'reculs' && x.n ? ' class="puce-recul"' : '') +
        ' aria-pressed="' + (x.cle === vue.journal) + '"' + (x.titre ? ' title="' + ech(x.titre) + '"' : '') + '>' +
        (x.pastille === undefined ? pastilleValeur(x.cle, x.famille) : x.pastille) +
        '\x3Cspan class="libelle" data-texte="' + ech(x.libelle) + '">' + ech(x.libelle) + '\x3C/span>' +
        (n !== '' ? '\x3Cspan class="masque">, \x3C/span>\x3Cspan class="n" data-texte="' + n + '">' + n + '\x3C/span>' : '') + '\x3C/button>';
    };
    var rang = function (id, mot, liste) {
      if (!liste.length) return '';
      return '\x3Cdiv class="rang-journal" role="group" aria-labelledby="' + id + '">' +
        '\x3Cspan class="mot-rang etiquette-carte" id="' + id + '">' + mot + '\x3C/span>' +
        '\x3Cspan class="puces-rang">' + liste.map(puce).join('') + '\x3C/span>\x3C/div>';
    };
    rangee.innerHTML = '\x3Cspan class="tout-journal" style="--rangs-journal:' + ((passes.length ? 1 : 0) + (bouges.length ? 1 : 0)) + '">' +
        puce({ cle: '', libelle: 'Tout', pastille: '', titre: 'Montrer tous les changements' }) + '\x3C/span>' +
      rang('rang-journal-passes', 'Passés à', passes) + rang('rang-journal-mouvements', 'Mouvements', bouges);
    rangee.hidden = false;
  }

  /* Débrief 27 (X-A5) — dire le résultat d'un filtre du journal, une fois :
     « Journal : 34 arrivées à « VALIDATED », sur 5 semaines ». */
  var JOURNAL_VU = { lignes: 0, semaines: 0 };
  function annoncerJournal() {
    var f = vue.journal, n = JOURNAL_VU.lignes, s = JOURNAL_VU.semaines;
    var b = f ? [].filter.call($('filtre-journal').querySelectorAll('button[data-journal]'), function (x) { return x.getAttribute('data-journal') === f; })[0] : null;
    var nom = b ? b.querySelector('.libelle').textContent : '';
    var quoi = f === 'reculs' ? (n > 1 ? 'reculs' : 'recul')
      : f === 'nouveaux' ? (n > 1 ? 'nouveaux plans' : 'nouveau plan')
      : f === 'disparus' ? (n > 1 ? 'plans disparus' : 'plan disparu')
      : f === 'indice' ? (n > 1 ? 'changements d’indice' : 'changement d’indice')
      : (n > 1 ? 'arrivées à « ' : 'arrivée à « ') + nom + ' »';
    var pour = vue.rechercheJournal && motCherche(vue.rechercheJournal) ? ' pour « ' + vue.rechercheJournal.trim() + ' »' : '';
    var sur = s > 1 ? ', sur ' + s + ' semaines' : '';
    annoncer('Journal : ' + (!n ? 'aucun changement' + (f ? ' de ce type' : '') + pour
      : !f ? 'tous les changements, ' + nb(n) + pour + sur
      : nb(n) + ' ' + quoi + pour + sur));
  }

  /* Débrief 27 (D8) — un journal sans rien à montrer : un bloc calme au
     centre, une phrase puis son explication (la classe journal-vide reste
     à l'explication, mot pour mot celle d'avant). */
  function etatVideJournal(v) {
    return '\x3Cdiv class="etat-vide journal-etat-vide">\x3Cp class="etat-vide-phrase">' + ech(v.phrase) + '\x3C/p>' +
      '\x3Cp class="etat-vide-detail journal-vide">' + ech(v.detail) + '\x3C/p>\x3C/div>';
  }

  function rendreJournal() {
    var zone = $('zone-journal');
    journalEtroit = !!(JOURNAL_ETROIT && JOURNAL_ETROIT.matches);
    var journal = JOURNAL.length ? journalAffiche() : [];
    rendreFiltreJournal(journal);
    /* Débrief 27 (D8) : sans rien à montrer, les commandes qui
       n'agiraient sur rien s'effacent — la recherche du journal aussi. */
    var ligneCommandes = $('filtre-journal').closest('.ligne-filtres');
    if (ligneCommandes) ligneCommandes.hidden = !JOURNAL.length || !journal.length;
    JOURNAL_VU = { lignes: 0, semaines: 0 };
    aMesurer('journal');
    /* Un message seul n'a rien d'un tableau : la grille d'un rendu d'avant
       (l'autre avancement) le coupait au bord de la carte. */
    if (!JOURNAL.length || !journal.length) {
      zone.classList.remove('journal-grille');
      zone.style.gridTemplateColumns = '';
    }
    if (!JOURNAL.length) {
      zone.innerHTML = etatVideJournal(pourquoiJournalVide());
      return;
    }
    if (!journal.length) {
      zone.innerHTML = etatVideJournal({ phrase: 'Aucun changement dans le périmètre ' + vue.perimetre,
        detail: 'Aucun plan du périmètre ' + vue.perimetre + ' n’a changé de valeur d’un relevé à l’autre. « Tout », dans Périmètre, montre le journal entier.' });
      return;
    }
    var filtre = vue.journal;
    var q = motCherche(vue.rechercheJournal);
    var retenus = function (sem) {
      return sem.evenements.filter(function (e) {
        return retenuParJournal(e, filtre) &&
          (!q || refCorrespond(e.ref, q) || (!!e.ancienne && refCorrespond(e.ancienne, q)));
      });
    };
    /* Les colonnes du résumé : chaque sorte de ligne des semaines affichées
       a la sienne — « passés à « Terminé » », reculs, changements d'indice,
       nouveaux… —, et une semaine qui n'en a pas laisse sa case vide : les
       pastilles d'une même sorte tombent l'une sous l'autre, de semaine en
       semaine. Débrief 27 (B9) : dans l'ordre de la légende et des
       pastilles du dessus — les valeurs dans l'ordre des tuiles (VALIDATED,
       PWD_IN_PROGRESS, PWD_TO_CONTROL, TO_CONFIRM, FWD_TO_SEIZE, TO_TREAT),
       celles d'hier ensuite, puis les mouvements (reculs, nouveaux,
       disparus, changements d'indice) —, et non plus de la plus fréquente à
       la plus rare : l'œil passe de la pastille à sa colonne sans chercher. */
    var colonnes = [], vuesCol = {};
    journal.forEach(function (sem) {
      lignesResume(retenus(sem)).forEach(function (l) {
        var k = cleResume(l);
        if (!vuesCol[k]) { vuesCol[k] = l; colonnes.push(k); }
      });
    });
    colonnes.sort(function (a, b) { return comparerLignes(vuesCol[a], vuesCol[b]); });
    var rangTuile = {};
    VALEURS_COLONNE.forEach(function (v, i) { rangTuile[v.cle] = i; });
    var nPasses = colonnes.filter(function (k) { return vuesCol[k].passage; }).length;
    var enGrille = GRILLE_JOURNAL && colonnes.length > 0;
    zone.classList.toggle('journal-grille', enGrille);
    /* La dernière colonne tient la mini-jauge (72 à 96 px) ; sous 1 100 px, la
       jauge s'efface et sa colonne avec (--col-jauge-journal). */
    zone.style.gridTemplateColumns = enGrille
      ? 'max-content repeat(' + colonnes.length + ', minmax(min-content, max-content)) var(--col-jauge-journal, minmax(72px, 1fr))' : '';
    var jours = joursDesReleves();
    var html = journal.map(function (sem) {
      var evts = retenus(sem);
      if (!evts.length) return '';
      JOURNAL_VU.lignes += evts.length;
      JOURNAL_VU.semaines++;

      var parType = comptesEvenements(evts);
      /* Le résumé de la semaine : les lignes du résumé commun, les mêmes que
         la bulle du graphique. Chaque passage et les
         changements d'indice sont des boutons : cliquer « 4 passés à
         « Validé » » n'affiche plus que ceux-là, pour toutes les semaines à
         la fois — et déplie cette semaine-là (débrief 27, M10). Les
         nouveaux et les disparus aussi (débrief 23). */
      var parCle = {};
      lignesResume(evts).forEach(function (l) { parCle[cleResume(l)] = l; });
      var resume = colonnes.map(function (k) {
        var l = parCle[k];
        /* Débrief 27 (B22) : une case sans passage dit « — », en gris. */
        if (!l) return '\x3Cspan class="case-vide" aria-hidden="true">' + TIRET_VIDE + '\x3C/span>';
        /* Dans le tableau, l'en-tête nomme la colonne : la case ne porte
           que la pastille et le nombre ; les mots restent là pour les
           lecteurs d'écran et pour l'affichage en ligne des petits écrans. */
        var mot = '\x3Cspan class="mot-case"> ' + ech(libelleLot(l, l.n)) + '\x3C/span>';
        var cle = l.cle;
        return '\x3Cbutton class="compte-passage' + (cle === 'reculs' ? ' recul' : '') + '" type="button" data-passage="' + ech(cle) +
          '" aria-pressed="' + (vue.journal === cle) + '" title="' + ech(nb(l.n) + ' ' + libelleLot(l, l.n)) + ' — n’afficher que ' +
          (l.passage ? ech('les plans arrivés à « ' + l.libelle + ' », réémis et reculs compris') : cle === 'reculs' ? 'les reculs'
            : cle === 'nouveaux' ? 'les nouveaux plans' : cle === 'disparus' ? 'les plans disparus' : 'les changements d’indice') + ', sur toutes les semaines">' +
          pastilleResume(l) + '\x3Cb>' + nb(l.n) + '\x3C/b>' + mot + '\x3C/button>';
      });
      /* La ligne de couleur de la semaine : une part par compte, dans l'ordre
         du résumé, sur la largeur d'une petite jauge. */
      var totalSem = ['termine', 'encours', 'afaire', 'vide', 'recul', 'indice', 'nouveau', 'disparu']
        .reduce(function (t, k) { return t + (parType[k] || 0); }, 0);
      /* Débrief 22 : les passages s'y découpent par valeur d'arrivée, dans
         l'ordre des tuiles et à la couleur de leur pilule — quatre
         PWD_TO_CONTROL n'y sont plus peints du bleu de PWD_IN_PROGRESS. */
      var passages = lignesResume(evts).filter(function (l) { return l.passage; }).sort(function (a, b) {
        var ra = rangTuile[a.cle] === undefined ? 999 : rangTuile[a.cle], rb = rangTuile[b.cle] === undefined ? 999 : rangTuile[b.cle];
        return ra - rb || ordreDesCles(a, b);
      });
      var largeur = function (n) { return 'width:' + (100 * n / totalSem).toFixed(2) + '%'; };
      var jauge = totalSem ? '\x3Cspan class="mini-jauge" aria-hidden="true">' +
        ['termine', 'encours', 'afaire', 'vide', 'recul', 'indice', 'nouveau', 'disparu'].map(function (k) {
          if (!parType[k]) return '';
          var e = ETAT_PAR_CLE[k];
          if (!e || e.hachure) return '\x3Cspan class="' + k + '" style="' + largeur(parType[k]) + '">\x3C/span>';
          var vus = 0;
          var morceaux = passages.filter(function (l) { return l.famille === k; }).map(function (l) {
            vus += l.n;
            return '\x3Cspan class="' + k + '" data-cle="' + ech(l.cle) + '" style="' + largeur(l.n) + ';background:' + (couleurConnue(l.cle, k) || e).couleur + '">\x3C/span>';
          });
          if (parType[k] > vus) morceaux.push('\x3Cspan class="' + k + '" style="' + largeur(parType[k] - vus) + ';background:' + e.couleur + '">\x3C/span>');
          return morceaux.join('');
        }).join('') + '\x3C/span>' : '';

      /* Toutes les semaines s'ouvrent repliées : le lecteur déplie celle
         qu'il veut. Pendant une recherche, celles qui ont le plan s'ouvrent
         d'elles-mêmes, entières — c'est lui qu'on vient voir. */
      var ouvert = vue.journalOuverts[sem.i] !== undefined ? vue.journalOuverts[sem.i] : !!q;
      var limite = q || vue.journalOuverts['tout' + sem.i] ? evts.length : MAX_JOURNAL;

      /* Rangées par état d'arrivée, puis par référence : « terminé, terminé,
         terminé, à faire, à faire » se lit, « en vrac » ne se lit pas. Les
         changements d'indice ouvrent la liste : rares, et c'est l'événement
         qu'on doit reconnaître — relégués derrière « voir les N autres », ils
         seraient les seuls invisibles sans clic. Les nouveaux et les disparus
         ferment la marche. */
      /* Les reculs d'abord, en rouge : c'est ce qu'on vient chercher. */
      var rangEtat = { termine: 0, encours: 1, afaire: 2, vide: 3 };
      var rangType = { indice: -1, nouveau: 5, disparu: 6 };
      var rangEvt = function (e) { return estRecul(e) ? -2 : rangType[e.type] !== undefined ? rangType[e.type] : rangEtat[e.apres]; };
      /* Une semaine repliée ne montre ni ses lignes ni son bouton « Copier » :
         elle ne les range ni ne les écrit (débrief 23) — ils se font quand
         on la déplie. */
      if (ouvert) evts = evts.slice().sort(function (a, b) {
        var ra = rangEvt(a), rb = rangEvt(b);
        return (ra - rb) || COMPARER_NUM(a.ref, b.ref);
      });

      var lignes = !ouvert ? '' : evts.slice(0, limite).map(function (e) {
        /* La référence et son passage, rien d'autre : le libellé du plan
           (« Faisceau 417 ») n'apprenait rien ici. */
        var vers = e.type === 'nouveau'
          ? '\x3Cspan class="vers">\x3Cspan class="etiq-etat avant">nouveau\x3C/span>' +
            '\x3Cspan class="fleche-etat">→\x3C/span>' + etiqEtat(e.apres, 'apres', e.cApres, e.vApres) + '\x3C/span>'
          : e.type === 'disparu'
            ? '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant', e.cAvant, e.vAvant) +
              '\x3Cspan class="fleche-etat">→\x3C/span>\x3Cspan class="etiq-etat apres">disparu\x3C/span>\x3C/span>'
            : '\x3Cspan class="vers">' + etiqEtat(e.avant, 'avant', e.cAvant, e.vAvant) +
              '\x3Cspan class="fleche-etat">→\x3C/span>' + etiqEtat(e.apres, 'apres', e.cApres, e.vApres) + '\x3C/span>';
        /* Une réémission se lit « ANCIENNE → NOUVELLE », puis l'état avant et
           après : le même plan sous deux références, et ce qu'il est devenu. */
        var reference = estReemission(e)
          ? '\x3Cspan class="ref ref-indice">\x3Cspan class="ancienne">' + ech(e.ancienne) + '\x3C/span>' +
            '\x3Cspan class="nouvelle">→ ' + ech(e.ref) + '\x3C/span>\x3C/span>'
          : '\x3Cspan class="ref">' + ech(e.ref) + '\x3C/span>';
        return '\x3Cli>\x3Cbutton class="journal-ligne' + (estReemission(e) ? ' reemission ' + e.type : '') + (estRecul(e) ? ' recul' : '') +
          '" type="button" data-ref="' + ech(e.ref) + '" data-type="' + e.type +
          '" title="N’afficher que ce plan dans le tableau">' + reference +
          vers + '\x3C/button>\x3C/li>';
      }).join('');

      /* Copier toutes les références de la semaine — sous une pastille du
         journal ou une recherche, celles qui restent —, même au-delà des
         douze affichées. */
      if (ouvert) lignes = '\x3Cli class="journal-copier">' + boutonCopier(evts.map(function (e) { return e.ref; })) + '\x3C/li>' + lignes;
      var reste = evts.length - limite;
      /* Débrief 27 (D10) : la semaine montre ses douze premières lignes, puis
         « Voir les N autres », qui les déplie sur place, dans la page. */
      if (ouvert && reste > 0) {
        lignes += '\x3Cli>\x3Cbutton class="journal-plus" type="button" data-tout="' + sem.i + '">' +
          'Voir les ' + nb(reste) + ' autres\x3C/button>\x3C/li>';
      }

      /* Débrief 27 (P-F10) : la semaine dit ses dates — « S43 · du ven. 16
         au ven. 23 oct. » —, en toutes lettres pour un lecteur d'écran. */
      var d = datesSemaineJournal(sem, jours);
      return '\x3Cdiv class="journal-semaine' + (ouvert ? ' ouverte' : '') + '">' +
        '\x3Cspan class="journal-tete">' +
        '\x3Cbutton class="journal-plier" type="button" data-semaine="' + sem.i + '" aria-expanded="' + ouvert +
        '" aria-label="' + ech(d.num + ', ' + d.dit) + '">' +
        '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' +
        '\x3Cspan class="sem">\x3Cspan class="sem-num">' + d.num + '\x3C/span> · \x3Cspan class="sem-dates">' + d.dates + '\x3C/span>\x3C/span>\x3C/button>' +
        '\x3Cspan class="resume">' + resume.join('') + '\x3C/span>' + jauge + '\x3C/span>' +
        (ouvert ? '\x3Cul class="journal-liste">' + lignes + '\x3C/ul>' : '') +
        '\x3C/div>';
    }).join('');

    /* Débrief 27 (B9) : l'en-tête du tableau sur deux étages — « Passés à »
       au-dessus des colonnes des valeurs, « Mouvements » au-dessus des
       autres —, et sous chacun, la pastille et le nom seul : le code de
       GATES en Plex Mono 11, d'un seul tenant tant que la place le permet
       (une seule coupure possible, après son dernier « _ » : deux lignes
       au plus, jamais trois ou quatre). La semaine a son mot, la jauge
       aussi (« Répartition »). */
    var MOT_MOUVEMENT = { reculs: 'Reculs', nouveaux: 'Nouveaux', disparus: 'Disparus', indice: 'Changements d’indice' };
    var entetes = enGrille && html
      ? '\x3Cdiv class="journal-entetes" aria-hidden="true">\x3Cspan class="entete-semaine">Semaine\x3C/span>' + colonnes.map(function (k) {
          var l = vuesCol[k];
          if (!l.passage) return '\x3Cspan class="entete-col">' + pastilleResume(l) + '\x3Cspan class="mot-entete">' + MOT_MOUVEMENT[l.cle] + '\x3C/span>\x3C/span>';
          var nom = ech(l.libelle || '');
          var code = /^[A-Z0-9_]+$/.test(l.libelle || '');
          if (code) nom = nom.replace(/_(?=[^_]*$)/, '_\x3Cwbr>');
          return '\x3Cspan class="entete-col">' + pastilleResume(l) + '\x3Cspan class="' + (code ? 'code-entete' : 'mot-entete') + '">' + nom + '\x3C/span>\x3C/span>';
        }).join('') + '\x3Cspan class="entete-jauge">Répartition\x3C/span>' +
        (nPasses ? '\x3Cdiv class="entete-groupe" style="grid-column:2 / span ' + nPasses + '">Passés à\x3C/div>' : '') +
        (colonnes.length > nPasses ? '\x3Cdiv class="entete-groupe" style="grid-column:' + (2 + nPasses) + ' / span ' + (colonnes.length - nPasses) + '">Mouvements\x3C/div>' : '') +
        '\x3C/div>'
      : '';
    /* Sous une pastille, « aucun changement pour X » ferait croire le plan
       immobile : on dit parmi quoi on a cherché. */
    var choisi = filtre ? [].filter.call($('filtre-journal').querySelectorAll('button'), function (b) { return b.getAttribute('data-journal') === filtre; })[0] : null;
    var parmi = !choisi ? '' : filtre === 'reculs' ? ' parmi les reculs' : filtre === 'indice' ? ' parmi les changements d’indice'
      : filtre === 'nouveaux' ? ' parmi les nouveaux plans' : filtre === 'disparus' ? ' parmi les plans disparus'
      : ' parmi les arrivées à « ' + choisi.querySelector('.libelle').textContent + ' »';
    zone.innerHTML = entetes + html || (q
      ? '\x3Cdiv class="journal-vide">Aucun changement pour « ' + ech(vue.rechercheJournal.trim()) + ' »' + ech(parmi) + ' dans l’historique' +
        (parmi ? ' — « Tout » les cherche tous' : '') + '. Échap vide la recherche.\x3C/div>'
      : '\x3Cdiv class="journal-vide">Aucun changement de ce type dans l’historique.\x3C/div>');
  }

  /* Débrief 27 — mesuré à l'image suivante, avec les autres mesures :
     1. le tableau tient-il dans la carte ? Sinon (1 024 px avec les onze
        colonnes, un texte espacé par la lectrice), il prend la forme des
        petits écrans (journal-serre) au lieu de couper ses dernières
        colonnes au bord. On réessaie le tableau à chaque mesure : un
        filtre qui retire des colonnes, une fenêtre élargie le ramènent.
     2. la hauteur de son en-tête collé (D10) : la ligne d'une semaine
        ouverte se colle juste dessous pendant qu'on lit ses plans. */
  function poserJournal() {
    var zone = $('zone-journal');
    if (!zone) return;
    if (zone.classList.contains('journal-grille') && zone.getClientRects().length) {
      zone.classList.remove('journal-serre');
      if (zone.scrollWidth > zone.clientWidth + 1) zone.classList.add('journal-serre');
    } else zone.classList.remove('journal-serre');
    var e = zone.querySelector('.journal-entetes');
    var h = e && e.getClientRects().length ? Math.round(e.getBoundingClientRect().height) : 0;
    if (zone.style.getPropertyValue('--haut-entetes-journal') !== h + 'px') zone.style.setProperty('--haut-entetes-journal', h + 'px');
  }
  /* Le bas de ce qui est collé en haut de l'écran au-dessus d'une semaine
     du journal : le sommaire (et les filtres actifs), puis l'en-tête du
     tableau. */
  function basCollesJournal() {
    var racine = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bas-sommaire')) || 0;
    var e = $('zone-journal').querySelector('.journal-entetes');
    return racine + (e && e.getClientRects().length && getComputedStyle(e).position === 'sticky' ? e.getBoundingClientRect().height : 0);
  }
  function teteSemaineJournal(i) {
    return [].filter.call($('zone-journal').querySelectorAll('button[data-semaine]'), function (x) { return x.dataset.semaine === String(i); })[0] || null;
  }
  /* Après un rendu du journal : la ligne de la semaine touchée reste sous
     le doigt (« avant », sa position d'avant le rendu) ; si le haut de la
     semaine passe alors sous les bandeaux collés, la page remonte jusqu'à
     lui — on voit la semaine depuis son début. */
  function amenerSemaineJournal(i, avant) {
    var tete = teteSemaineJournal(i);
    if (!tete) return;

      '\x3Cspan class="indice">tout le contrat, ' + (INDICATEUR === 'concept' ? 'concept harnais' : 'définition électrique') +
        ', au dernier relevé \u2014 un clic sur un contrat l’affiche\x3C/span>' +
      '\x3Cbutton type="button" class="fiche-plan-fermer" data-fermer-ensemble="1" aria-label="Fermer la vue d’ensemble">×\x3C/button>\x3C/div>' +
      '\x3Cdiv class="defile-ensemble">\x3Ctable class="ensemble-table">\x3Ccolgroup>' +
        COLONNES_ENSEMBLE.map(function (c) { return '\x3Ccol style="width:' + c[1] + '%">'; }).join('') + '\x3C/colgroup>' +
      '\x3Cthead>\x3Ctr>' + COLONNES_ENSEMBLE.map(function (c) { return '\x3Cth scope="col">' + c[0] + '\x3C/th>'; }).join('') + '\x3C/tr>\x3C/thead>' +
      '\x3Ctbody id="ensemble-lignes">\x3C/tbody>\x3C/table>\x3C/div>' +
      '\x3Cp class="ensemble-note">\x3Cb>À l’arrêt\x3C/b> : plans en cours sans aucun changement depuis ' + SEMAINES_ARRET +
        ' semaines ou plus. \x3Cb>À l’échéance\x3C/b> : ce qui manquerait le jour de la prochaine échéance si le rythme tenu continue. ' +
        '\x3Cb>Fin au rythme actuel\x3C/b> : la semaine où tout serait validé à ce rythme.\x3C/p>';
  }
  function rendreEnsemble(resumes) {
    var corps = $('ensemble-lignes');
    if (!corps) return;
    var lignes = CONTRATS.map(function (c) {
      var r = resumes && resumes[c.id];
      var courant = c.id === CONTRAT;
      /* Débrief 29 (A-F10) : un seul nom par onglet, celui du panneau
         d'administration — « HDK › Tranche 1 », jamais « HDK » seul juste
         au-dessus de « HDK › Tranche 2 » — et « à l'écran », ses mots. */
      var tete = '\x3Ctr' + (courant ? ' class="courant"' : '') + '>\x3Cth scope="row">\x3Cbutton type="button" class="lien-doux" data-aller-contrat="' + ech(c.id) + '"' +
        (r && !r.message ? ' title="Passer à ce contrat"' : '') + '>' + ech(nomComplet(c.id)) + '\x3C/button>' + (courant ? '\x3Csmall>à l’écran\x3C/small>' : '') + '\x3C/th>';
      if (!r) {
        return tete + '\x3Ctd colspan="7" class="doux">' + (!resumes || ENSEMBLE_EN_COURS[c.id] ? 'chargement…' : ech(MESSAGES_ENSEMBLE[c.id] || 'contrat impossible à charger')) + '\x3C/td>\x3C/tr>';
      }
      if (r.message) return tete + '\x3Ctd colspan="7" class="alerte-ligne">' + ech(r.message) + '\x3C/td>\x3C/tr>';
      var e = r.echeance;
      var aLEcheance = !e ? TIRET_VIDE
        /* Débrief 29 (P-F18) : le rythme requis arrondi comme dans la fiche
           de l'échéance (« il faut 83/sem. », plus « 83,0 »). */
        : e.enRetard ? '\x3Cspan class="v tard">manque ' + nb(e.manque) + '\x3C/span>\x3Csmall>il faut ' + rythmeDit(e.requis) + '/sem.\x3C/small>'
        : '\x3Cspan class="v bon">tenue\x3C/span>' + (e.fin === 'validé' ? '\x3Csmall>tout est validé' + (e.domaine ? ' dans ' + ech(e.domaine) : '') + '\x3C/small>' : '');
      var finActuelle = e
        ? (e.fin === 'validé' ? '\x3Cspan class="v bon">tout est validé\x3C/span>'
          : '\x3Cspan class="v">' + ech(e.fin) + '\x3C/span>' + (e.domaine ? '\x3Csmall>pour ' + ech(e.domaine) + '\x3C/small>' : '') +
            (e.dernier ? '\x3Csmall>' + ech(e.dernier) + '\x3C/small>' : ''))
        : (r.fin === 'validé' ? '\x3Cspan class="v bon">tout est validé\x3C/span>' : r.fin ? '\x3Cspan class="v">' + ech(r.fin) + '\x3C/span>' : TIRET_VIDE);
      return tete +
        '\x3Ctd>\x3Cspan class="v">' + nb(r.termines) + ' / ' + nb(r.total) + '\x3C/span>\x3Csmall' + (r.aucunFini ? ' class="alerte-ligne" title="Aucune valeur de la colonne n\u2019est comptée comme « validé » : voir le haut de la page de ce contrat"' : '') + '>' +
          (r.aucunFini ? 'aucun mot « validé » reconnu' : r.pct + ' %') + '\x3C/small>' +
          '\x3Cspan class="jauge-ensemble" aria-hidden="true">\x3Ci style="width:' + Math.max(0, Math.min(100, r.pct)) + '%">\x3C/i>\x3C/span>\x3C/td>' +
        '\x3Ctd>\x3Cspan class="v">' + (r.gain === null ? TIRET_VIDE : (r.gain > 0 ? '+' : '') + nb(r.gain)) + '\x3C/span>' +
          (r.reculs ? '\x3Csmall class="recul">' + nb(r.reculs) + (r.reculs > 1 ? ' reculs' : ' recul') + '\x3C/small>' : '') + '\x3C/td>' +
        '\x3Ctd>\x3Cspan class="v">' + (r.rythme === null ? TIRET_VIDE : virgule(r.rythme) + '/sem.') + '\x3C/span>\x3C/td>' +
        '\x3Ctd>\x3Cspan class="v' + (r.arret ? ' arret' : '') + '">' + (r.arret ? nb(r.arret) : TIRET_VIDE) + '\x3C/span>\x3C/td>' +
        '\x3Ctd>' + (e ? '\x3Cspan class="v">' + ech(e.texte) + '\x3C/span>\x3Csmall>' + ech(e.quand) + ' · ' + ech(motJours(e.jours)) + '\x3C/small>'
          : '\x3Cspan class="doux">' + (r.sansJalon ? 'aucun jalon' : 'aucune à venir') + '\x3C/span>' + lienAjouterJalon(c.id, r)) + '\x3C/td>' +
        '\x3Ctd>' + aLEcheance + '\x3C/td>\x3Ctd>' + finActuelle + '\x3C/td>\x3C/tr>';
    }).join('');
    garderFocus(function () { corps.innerHTML = lignes; }, 'ensemble');
    /* Au téléphone, chaque contrat devient une carte : chaque valeur y
       reprend le nom de sa colonne à gauche (voir la feuille de style). */
    [].forEach.call(corps.querySelectorAll('tr'), function (tr) {
      [].forEach.call(tr.children, function (c, k) {
        if (c.tagName === 'TD' && c.colSpan === 1 && COLONNES_ENSEMBLE[k]) c.setAttribute('data-libelle', COLONNES_ENSEMBLE[k][0]);
      });
    });
  }
  /* Débrief 29 (A-F25, S8) : sous « aucun jalon », un administrateur de ce
     contrat trouve le geste — « + Ajouter un jalon » ouvre l'administration
     sur un jalon neuf pour ce contrat. Les lecteurs lisent « aucun jalon »,
     sans plus. */
  function lienAjouterJalon(id, r) {
    if (!r.sansJalon || !estAdmin() || DROITS.coherent === false || !peutGererContrat(id)) return '';
    return '\x3Cbutton type="button" class="lien-doux ajouter-jalon" data-ajouter-jalon="' + ech(id) + '" aria-label="Ajouter un jalon pour ' +
      ech(nomComplet(id)) + '">+ Ajouter un jalon\x3C/button>';
  }
  function ouvrirEnsemble() {
    var zone = $('ensemble');
    preparerEnsemble();
    zone.hidden = false;
    if (typeof zone.showModal === 'function') { if (!zone.open) zone.showModal(); } else zone.setAttribute('open', '');
    $('voir-ensemble').setAttribute('aria-expanded', 'true');
    /* Le focus sur le titre : un lecteur d'écran dit où l'on est. */
    try { $('ensemble-titre').focus({ preventScroll: true }); } catch (e) { $('ensemble-titre').focus(); }
    var demande = ++demandeEnsemble;
    PAQUETS[CONTRAT] = SRC;
    var manquants = CONTRATS.filter(function (c) { return !PAQUETS[c.id]; });
    ENSEMBLE_EN_COURS = {};
    manquants.forEach(function (c) { ENSEMBLE_EN_COURS[c.id] = true; });
    rendreEnsemble(null);
    function calculerDispo() {
      var dispo = {};
      CONTRATS.forEach(function (c) { if (PAQUETS[c.id]) dispo[c.id] = PAQUETS[c.id]; });
      var resumes = calculerEnsemble(dispo);
      rendre();
      return resumes;
    }
    function finir() {
      if (demande !== demandeEnsemble || zone.hidden) return;
      rendreEnsemble(calculerDispo());
    }
    if (!manquants.length) { finir(); return; }
    var restent = manquants.length;
    /* A-F25 : un réseau lent — les contrats déjà là (celui qu'on regarde)
       s'écrivent sans attendre les autres. */
    setTimeout(function () {
      if (demande !== demandeEnsemble || zone.hidden || !restent) return;
      rendreEnsemble(calculerDispo());
    }, 400);
    manquants.forEach(function (c) {
      function ranger(paquet) {
        paquet = deballerPaquet(paquet);
        if (paquet && paquet.plans && paquet.plans.length) PAQUETS[c.id] = paquet;
        else MESSAGES_ENSEMBLE[c.id] = paquet && paquet.message ? String(paquet.message) : '';
        delete ENSEMBLE_EN_COURS[c.id];
        if (--restent === 0) finir();
      }
      /* Compressé, le paquet se décode d'abord (obtenirPaquet). */
      function recevoir(recu) { obtenirPaquet(recu, ranger, function () { ranger(null); }); }
      if (API && API.chargerContrat) API.chargerContrat(c.id, recevoir);
      else recevoir(jeuDExemple(c.id));
    });
  }
  /* Fermer : la croix, Échap (l'événement « close » de la fenêtre), un clic
     à côté, ou un contrat choisi. Le focus revient au bouton. */
  function fermerEnsemble(sansFocus) {
    demandeEnsemble++;
    var zone = $('ensemble');
    if (zone.open) { if (typeof zone.close === 'function') zone.close(); else zone.removeAttribute('open'); }
    zone.hidden = true;
    zone.innerHTML = '';
    $('voir-ensemble').setAttribute('aria-expanded', 'false');
    if (!sansFocus && focusVisible($('voir-ensemble'))) { try { $('voir-ensemble').focus({ preventScroll: true }); } catch (e) { $('voir-ensemble').focus(); } }
  }
  $('voir-ensemble').addEventListener('click', function () {
    if ($('ensemble').hidden) ouvrirEnsemble(); else fermerEnsemble();
  });
  $('ensemble').addEventListener('close', function () { if (!$('ensemble').hidden) fermerEnsemble(); });
  /* Un clic sur le voile ferme la fenêtre — appuyé et relâché hors de son
     cadre (comme l'administration). */
  function horsDeLEnsemble(e) {
    var d = $('ensemble'), r = d.getBoundingClientRect();
    return e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom);
  }
  var appuiHorsEnsemble = false;
  $('ensemble').addEventListener('mousedown', function (e) { appuiHorsEnsemble = horsDeLEnsemble(e); });
  $('ensemble').addEventListener('click', function (e) {
    if (appuiHorsEnsemble && horsDeLEnsemble(e)) { appuiHorsEnsemble = false; fermerEnsemble(); return; }
    appuiHorsEnsemble = false;
    if (e.target.closest('button[data-fermer-ensemble]')) { fermerEnsemble(); return; }
    var aj = e.target.closest('button[data-ajouter-jalon]');
    if (aj) { var pour = aj.dataset.ajouterJalon; fermerEnsemble(true); ouvrirAdmin({ ajouter: pour }); return; }
    var b = e.target.closest('button[data-aller-contrat]');
    if (!b) return;
    var id = b.dataset.allerContrat;
    fermerEnsemble();
    if (id !== CONTRAT || ATTENTE_CONTRAT) {
      /* Le paquet est déjà là : pas de second aller-retour au classeur. */
      var paquet = PAQUETS[id];
      if (paquet && id !== CONTRAT) { demandeContrat++; afficherPaquetContrat(paquet); }
      else changerContrat(id);
    }
  });


  /* ============================================================
     LES DEUX VUES DU TABLEAU

     « Toutes les colonnes » : l'export tel quel, toutes les colonnes, dans
     l'ordre de la feuille. C'est la vue de référence — celle sur laquelle tout
     le monde parle de la même chose.

     « Vue essentielle » : la poignée de colonnes qu'on regarde vraiment, dans
     l'ordre voulu.

     Rien entre les deux, et chacune se retrouve à l'identique en revenant.
     ============================================================ */
  /* ORDRE_FEUILLE est dérivé de la source dans chargerSource(). */
  function appliquerVueTable() {
    if (vue.vueTable === 'essentielle') {
      var garder = {};
      CLES_ESSENTIELLES.forEach(function (c) { garder[c] = true; });
      vue.cachees = {};
      COLONNES.forEach(function (c) { if (!garder[c.cle]) vue.cachees[c.cle] = true; });
      vue.ordre = CLES_ESSENTIELLES.slice()
        .concat(ORDRE_FEUILLE.filter(function (c) { return CLES_ESSENTIELLES.indexOf(c) === -1; }));
    } else {
      vue.cachees = {};
      vue.ordre = ORDRE_FEUILLE.slice();
    }
  }

  /* ============================================================
     FILTRES ACTIFS
     On clique un périmètre, un état, un groupe, une ligne du journal… et plus
     personne ne sait ce qui reste posé. Le bandeau nomme chaque filtre et
     donne sa croix ; il colle en haut de la page, donc la sortie est toujours
     à portée.
     ============================================================ */
  function filtresPoses() {
    var liste = [];
    /* Le périmètre d'abord : c'est le plus large, et il se retire comme les autres. */
    if (vue.perimetre) liste.push({ cle: 'perimetre', mot: 'Périmètre', valeur: vue.perimetre });
    if (vue.etat) liste.push({ cle: 'etat', mot: 'État', valeur: valeurDeCle(vue.etat) ? valeurDeCle(vue.etat).libelle : vue.etat });
    if (vue.groupe) {
      liste.push({
        cle: 'groupe',
        mot: TITRE_DIM[vue.groupe.dim] || 'Groupe',
        valeur: libelleGroupe(vue.groupe.val)
      });
    }
    if (vue.refs) {
      var n = Object.keys(vue.refs).length;
      /* Un lot de la comparaison se nomme par la phrase même du verdict :
         le jeton redit ce qu'on vient de cliquer, mot pour mot. */
      var lotRapp = LOTS_RAPPROCHEMENT.filter(function (l) { return 'rapprochement:' + l.cle === vue.refsLibelle; })[0];
      if (lotRapp) liste.push({ cle: 'refs', mot: 'Comparaison', valeur: phraseLot(lotRapp.cle, compteLotRapp(lotRapp.cle), nomSeconde()) });
      else if (vue.refsLibelle === SEL_ARRET) liste.push({ cle: 'refs', mot: 'À surveiller', valeur: 'en cours sans bouger depuis ' + SEMAINES_ARRET + ' semaines ou plus' });
      else liste.push({ cle: 'refs', mot: 'Sélection', valeur: vue.refsLibelle || (n + ' plans') });
    }
    if (vue.lotLa) {
      var lotLa = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === vue.lotLa; })[0];
      if (lotLa) liste.push({ cle: 'lotLa', mot: 'Comparaison', valeur: phraseLot(lotLa.cle, compteLotRapp(lotLa.cle), nomSeconde()) });
    }
    Object.keys(vue.vides).forEach(function (k) {
      if (vue.vides[k]) liste.push({ cle: 'vide:' + k, mot: PAR_CLE[k].titre, valeur: 'non renseigné' });
    });
    Object.keys(vue.filtres).forEach(function (k) {
      if (vue.filtres[k]) liste.push({ cle: 'filtre:' + k, mot: PAR_CLE[k].titre, valeur: vue.filtres[k] });
    });
    if (vue.recherche) liste.push({ cle: 'recherche', mot: 'Recherche', valeur: vue.recherche });
    /* La recherche dans le tableau de là, posée par un clic sur une référence
       seulement là : elle se voit et se retire comme les autres. */
    if (RAPPROCHEMENT && vue.seconde.recherche) liste.push({ cle: 'rechercheLa', mot: 'Recherche dans ' + nomSeconde(), valeur: vue.seconde.recherche });
    return liste;
  }

  function retirerFiltre(cle) {
    if (cle === 'etat' || cle === 'refs') vue.etatParArret = '';
    if (cle === 'etat') vue.etat = '';
    else if (cle === 'perimetre') vue.perimetre = '';
    else if (cle === 'groupe') vue.groupe = null;
    else if (cle === 'refs') { vue.refs = null; vue.refsLibelle = ''; }
    else if (cle === 'lotLa') vue.lotLa = null;
    else if (cle === 'recherche') { vue.recherche = ''; $('recherche').value = ''; }
    else if (cle === 'rechercheLa') { vue.seconde.recherche = ''; $('recherche-seconde').value = ''; }
    else if (cle.indexOf('vide:') === 0) delete vue.vides[cle.slice(5)];
    else if (cle.indexOf('filtre:') === 0) delete vue.filtres[cle.slice(7)];
  }

  function toutEffacer() {
    vue.recherche = ''; vue.etat = ''; vue.filtres = {}; vue.groupe = null; vue.vides = {};
    vue.refs = null; vue.refsLibelle = ''; vue.etatParArret = '';
    vue.perimetre = '';
    vue.lotLa = null;
    vue.lotRappOuvert = null;         // tout effacer, c'est aussi replier la comparaison
    vue.groupeOuvert = null;          // débrief 27 (lot C) : … et la ligne dépliée du bloc par groupe
    vue.lotRappTout = {};
    vue.base = 'ici';
    vue.seconde.recherche = ''; $('recherche-seconde').value = '';
    $('recherche').value = '';
    /* Les rangées de pastilles du bloc et du graphique sont locales, comme
       le champ de gauche du bloc et la rangée du journal : la remise à zéro
       des filtres de la page ne les touche pas. */
  }

  function rendreFiltresActifs() {
    rendreEntete();
    var zone = $('filtres-actifs');
    var poses = filtresPoses();
    zone.hidden = !poses.length;
    if (!poses.length) { zone.innerHTML = ''; return; }
    /* Débrief 27 (lot H, P-F6, M5, X-A13) : une ligne (voir la feuille de
       style) ; chaque croix dit quel filtre elle retire ; le jeton dit son
       filtre entier au survol quand sa valeur est coupée (téléphone). */
    zone.innerHTML = '\x3Cdiv class="filtres-ligne">\x3Cspan class="mot">Filtres\x3C/span>\x3Cdiv class="filtres-jetons" id="filtres-jetons">' +
      poses.map(function (f) {
        var nom = (f.mot ? f.mot + ' : ' : '') + f.valeur;
        return '\x3Cspan class="jeton" title="' + ech(nom) + '">' + (f.mot ? ech(f.mot) + ' : ' : '') +
          '\x3Cb>' + ech(f.valeur) + '\x3C/b>' +
          '\x3Cbutton class="x" type="button" data-retirer="' + ech(f.cle) +
          '" aria-label="' + ech('Retirer le filtre ' + nom) + '" title="Retirer ce filtre">×\x3C/button>\x3C/span>';
      }).join('') + '\x3C/div>' +
      '\x3Cbutton class="tout-effacer" type="button" id="tout-effacer">\x3Cspan class="long">Tout effacer\x3C/span>\x3Cspan class="court">Effacer\x3C/span>\x3C/button>\x3C/div>';
    marquerDebord($('filtres-jetons'));
  }
  /* Débrief 27 (lot H, B1, P-F11) : le surtitre du titre — le contrat et
     sa tranche, l'avancement suivi, le périmètre s'il en est un — et le
     rappel du contrat dans le sommaire collé. */
  function rendreEntete() {
    var nom = CONTRATS && CONTRATS.length ? nomAffiche(CONTRAT) : '';
    var morceaux = nom ? [nom.replace(' \u203a ', ' \u00b7 ')] : [];
    morceaux.push(INDICATEUR === 'concept' ? 'Concept harnais' : 'Définition électrique');
    if (vue.perimetre) morceaux.push('Périmètre ' + vue.perimetre);
    var texte = morceaux.join(' \u00b7 ');
    if ($('contexte-page') && $('contexte-page').textContent !== texte) $('contexte-page').textContent = texte;
    majChapitresPresents();
  }

  function rendreIncomplets() {
    var col = PAR_CLE[CLE_SUIVIE];
    /* Compté sur la sélection, moins ce filtre-ci : le nombre est celui des
       lignes que le clic montrera (il comptait tout le périmètre, et un clic
       sous un groupe ouvert en montrait trois fois moins). */
    var plans = selectionSans({ vide: CLE_SUIVIE });
    var n = 0;
    for (var i = 0; i < plans.length; i++) {
      if (celluleVide(plans[i], CLE_SUIVIE)) n++;
    }
    /* Sans colonne d'avancement reconnue (le serveur prévient, la page
       s'affiche tout en « non renseigné »), il n'y a rien à filtrer. À zéro,
       la puce s'efface — sauf pressée : on doit pouvoir la retirer. */
    if (!col || (!n && !vue.vides[CLE_SUIVIE])) { $('incomplets').innerHTML = ''; return; }
    $('incomplets').innerHTML =
      '\x3Cbutton class="puce-vide" type="button" data-vide="' + CLE_SUIVIE + '" aria-pressed="' + !!vue.vides[CLE_SUIVIE] +
      '" title="N\u2019afficher que les plans dont ' + ech(col.titre) + ' est vide">' +
      ech(col.titre) + ' non renseign\u00e9 \x3Cb>' + nb(n) + '\x3C/b>\x3C/button>';
  }

  /* L'ombre du bord droit se mesure à l'image suivante, avec les autres
     mesures : lue juste après l'écriture du tableau, elle forçait le
     navigateur à tout mettre en page une fois de plus — une seconde entière
     sur un gros extract. */
  function majOmbre() { aMesurer('ombre'); }
  function lireOmbre() {
    if (tableauHorsEcran($('cadre-tableau'))) return null;
    var d = $('defile'), deborde = (d.scrollWidth - d.clientWidth - d.scrollLeft) > 4 ? 'true' : 'false';
    /* Débrief 27 (D10, B19) : et le fondu du bas, tant qu'il reste des
       lignes sous le cadre — posé au-dessus de la barre de défilement. */
    var plusBas = (d.scrollHeight - d.clientHeight - d.scrollTop) > 4 ? 'true' : 'false';
    var barre = Math.max(0, d.offsetHeight - d.clientHeight - (d.clientTop || 0) * 2);
    return function () {
      var c = $('cadre-tableau');
      c.dataset.deborde = deborde;
      c.dataset.plusBas = plusBas;
      c.style.setProperty('--barre-defile', barre + 'px');
    };
  }

  /* La section « Comparaison des bases de données » : une phrase, deux
     cercles, six verdicts, puis plan par plan. Historiquement : une phrase, quatre compteurs, la
     liste dépliable de ce qui n'est pas dans le tableau, le détail des écarts.
     Absente quand la source ne décrit aucune seconde base. */
  function pastilleVerdict(cat) {
    var classe = { accord: 'accord', emission: 'indice', avance: 'avance', manque: 'manque', attente: 'attente', seul: 'seul' }[cat];
    if (!classe) return '\x3Cspan class="pastille sans">\x3C/span>';
    return '\x3Cspan class="pastille ' + classe + '">\x3C/span>';
  }
  /* Un lot se dit partout avec la même phrase — verdicts, plan par plan,
     bulles, jeton des filtres, lignes du tableau de SEE : phraseLot, au
     singulier pour une ligne, précédée du compte pour un lot. */
  function motLotRapp(cle, n, nom) { return nb(n) + ' ' + phraseLot(cle, n, nom); }
  function majuscule(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

    zone.innerHTML = LOTS_RAPPROCHEMENT.map(function (l) {

      trouvesTotal += q ? rangees.length : 0;
      var ouvert = !!n && (q ? rangees.length > 0 : vue.lotRappOuvert === l.cle);
      return '\x3Cdiv class="verdict-bloc' + (q && !rangees.length ? ' sans-trouve' : '') + '" data-lot="' + l.cle + '" data-ouvert="' + ouvert + '">' +

        '" aria-pressed="' + presse + '" aria-expanded="' + ouvert + '"' + (n ? '' : ' disabled') + '>' +
        pastilleVerdict(l.segment) + '\x3Cspan class="verdict-n">' + nb(n) + '\x3C/span>' +

        (n ? '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
          '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '') +
        '\x3C/button>' +

      (q && !trouvesTotal ? '\x3Cdiv class="vide-message">Aucun plan de la comparaison ne contient « ' +

  /* Débrief 27 (B10) : « (rien d'anormal) » ne se coupe jamais en deux, ni

  }

  /* Le tri des références se rejoue à chaque rendu : un comparateur

     sa première colonne de référence (NAME), qui sert à la retrouver dans le

  function rangeesLotRapp(cle) {
    var R = RAPPROCHEMENT, rap = SRC.rapprochement;

      return R.lignes.filter(function (e) { return e.cat === 'seul'; }).map(function (e) {
        return { ref: e.ref, plan: null, la: String(e.ligne[premiere] == null ? '' : e.ligne[premiere]).trim() || e.ref, see: 'présent' };
      });

  /* Les plans d'un lot, dépliés sous sa ligne : une puce par plan. Sa

     part des validés, la répartition par état, le sens du lot — se lit

        var bulle = motEtat + ' \u00b7 ' + r.see + ' dans ' + nom +

          '\x3Cspan class="rapp-puce-ref">' + ech(r.ref) + '\x3C/span>' +
          (r.vers ? '\x3Cspan class="rapp-puce-vers">\u2192 ' + ech(r.vers) + '\x3C/span>' : '') + '\x3C/button>';

      (reste ? '\x3Cbutton type="button" class="rapp-voir-plus" data-rapp-plus="' + cle + '">Voir ' +
        (reste > 1 ? 'les ' + nb(reste) + ' autres' : 'l\u2019autre') + '\x3C/button>' : '') +
      '\x3C/div>';
  }
  /* La phrase en tête d'un lot déplié : ce qu'il veut dire, puis ce que
     fait un clic sur une puce. Les mêmes mots que la bulle du survol. */
  function detailLotRapp(cle, n, nom) {
    var R = RAPPROCHEMENT, pl = n > 1, sens;
    if (cle === 'accord') sens = (R.nbTermines ? Math.round(100 * n / R.nbTermines) : 0) + '\u202f% des validés de GATES, sous le même indice des deux côtés.';
    else if (cle === 'emission') sens = 'Le même plan, sous une autre lettre d\u2019indice dans ' + nom + ' : la lettre de ' + nom + ' suit la flèche.';
    else if (cle === 'avance') sens = nom + (pl ? ' les connaît' : ' le connaît') + ' : l\u2019avancement GATES est peut-être en retard.';
    else if (cle === 'manque') sens = 'À vérifier des deux côtés : un plan validé devrait être dans ' + nom + '.';
    else if (cle === 'attente') sens = 'Rien d\u2019anormal : un plan entre dans ' + nom + ' une fois validé.';

  /* La bulle d'un lot : ce que c'est, combien, le détail qui aide — la part

     répartition par état — et où mène le clic. */
  var MAX_PAIRES_RAPP = 10;
  /* Débrief 22 : la répartition se lit valeur par valeur, dans l'ordre des
     tuiles et à la couleur de chacune — le bleu de PWD_IN_PROGRESS ne
     couvre plus des PWD_TO_CONTROL et des TO_CONFIRM, comme dans la liste

  function repartitionEtats(plans) {

    }).concat(ETATS.filter(function (e) { return parFamille[e.cle]; }).map(function (e) {

    if (!lot) return '';
    var n = compteLotRapp(cle), presse = lotRappActif() === cle, pl = n > 1;

    }

    document.querySelectorAll('#venn-rapprochement [data-cle]').forEach(function (el) {

  /* La phrase d'un verdict, en français de tous les jours : le nombre est

  /* La phrase d'un lot se lit seule, derrière son nombre : plus de mot court
     en gras devant, il ne disait rien de plus. Sous un périmètre, « seulement

  function phraseLot(cle, n, nom) {
    var pl = n > 1, tout = vue.perimetre && cle === 'seul' ? ' \u2014 tout le contrat' : '';
    if (cle === 'accord') return (pl ? 'validés' : 'validé') + ' dans GATES et ' + (pl ? 'connus' : 'connu') + ' de ' + nom;
    if (cle === 'emission') return 'dans ' + nom + ' sous une autre lettre d’indice';
    if (cle === 'avance') return 'dans ' + nom + ', mais GATES ne ' + (pl ? 'les' : 'le') + ' dit pas ' + (pl ? 'validés' : 'validé');

  /* Un arc d'anneau, de l'angle a0 à l'angle a1 (en degrés, 0 en haut, sens

  function arcAnneau(cx, cy, r, a0, a1) {

    var x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));

  /* La figure du rapprochement : deux cercles qui se recouvrent, le nom et le

     que la base est seule à connaître — à gauche, les terminés que la seconde

     cercles ne sont pas à l'échelle : c'est la structure qu'on lit, les
     nombres disent le reste.

    s.push('\x3C/svg>');

       tracé étroit, un compte trop long passe à la ligne après le « · »,

      '\x3Cspan class="petit">seulement \x3Cbr>dans ' + ech(nom) + '\x3C/span>' +
      (perimetre ? ' \x3Cspan class="petit">tout le contrat\x3C/span>' : ''), T.seul));

     référence, comme pour le tableau d'ici — et une vue essentielle si la
     source en désigne une. Le verdict du rapprochement se lit sur chaque
     ligne : la pastille dans la cellule de la référence, les cellules qui

    var cherche = norm(S.recherche);

       aussi une référence écrite à la mode de GATES (ou de SEE, en entier) :
       la même clé que la comparaison — « GAE5316A600002B » trouve la ligne
       « GAE531A6600 · 002 · B ». Et un plan choisi (une seule référence
       sélectionnée) réduit ce tableau à ses lignes. */

  function rendreHaut(liste) {

  /* ============================================================
     LIVRAISON ET PANNE
     Quatre fichiers collés à la main dans Apps Script : il suffit d'en
     laisser un à la livraison d'avant pour que la page reste blanche, sans
     un mot (débrief 17 : un Index d'avant, le Javascript du jour). Chaque
     fichier porte donc sa livraison, la page les compare et nomme celui qui

     geste, au lieu d'un squelette vide.

  function ecartsDeLivraison(paquet) {
    if (EDITION === 'source') return [];
    var lues = { 'Javascript': EDITION };
    lues['Index'] = typeof window.SUIVI_FWD_LIVRAISON_INDEX === 'string' ? window.SUIVI_FWD_LIVRAISON_INDEX : '';
    try {

        .getPropertyValue('--suivi-fwd-edition').replace(/["'\s]/g, '');
    } catch (e) { lues['Styles'] = ''; }
    /* Sans paquet, les données n'ont pas été posées : rien à dire de Code. */
    if (paquet && typeof paquet === 'object') lues['Code'] = paquet.edition ? String(paquet.edition) : '';
    /* La livraison de la majorité fait foi ; à égalité, celle de ce fichier. */
    var n = {}, reference = EDITION;
    Object.keys(lues).forEach(function (f) { if (lues[f]) n[lues[f]] = (n[lues[f]] || 0) + 1; });
    Object.keys(n).forEach(function (ed) { if (n[ed] > n[reference]) reference = ed; });
    return Object.keys(lues).filter(function (f) { return lues[f] !== reference; });
  }
  function nommerFichiers(liste) {
    var noms = liste.map(function (f) { return '\x3Cb>' + f + '\x3C/b>'; });
    return noms.length > 1 ? noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1] : noms[0];
  }
  function gesteExec() {
    return 'Par un lien \x3Cb>…/exec\x3C/b> : ensuite, Déployer → Gérer les déploiements → ✏️ → ' +
      'Version : Nouvelle version → Déployer.';
  }
  function phraseEcarts(ecarts) {
    var un = ecarts.length === 1;
    return nommerFichiers(ecarts) + (un ? ' ne vient' : ' ne viennent') + ' pas de la même livraison que ' +
      (un ? 'les autres fichiers' : 'le reste') + ' : ' + (un ? 'le recoller' : 'les recoller') +
      ' depuis la dernière livraison (tout effacer, coller le .txt, Ctrl+S). ' + gesteExec();
  }
  /* Le cadre, en tête de page, en styles posés sur lui : il doit se lire
     même quand c'est Styles qui manque. */
  function cadreEnTete(html, grave) {
    var cadre = document.getElementById('suivi-fwd-panne');
    if (!cadre) {
      cadre = document.createElement('div');
      cadre.id = 'suivi-fwd-panne';
      cadre.setAttribute('role', 'alert');
      document.body.insertBefore(cadre, document.body.firstChild);
    }
    cadre.style.cssText = 'margin:16px auto;max-width:1100px;padding:14px 18px;color:#191915;' +
      'font:14px/1.55 system-ui,sans-serif;background:' + (grave ? '#fff4e5' : '#fffaf0') + ';' +
      'border-left:4px solid ' + (grave ? '#b54708' : '#bf7f14') + ';';
    cadre.innerHTML = html;
    /* Plus de « Chargement… » sous un cadre qui dit que rien ne viendra. */
    var phrase = document.getElementById('phrase');
    if (grave && phrase && /^Chargement/.test(phrase.textContent)) phrase.textContent = '\u2014';
  }
  function signalerLivraison(ecarts) {
    if (!ecarts.length) return;
    cadreEnTete('\x3Cp style="margin:0">\x3Cb>Les fichiers du tableau de bord ne concordent pas.\x3C/b> ' + phraseEcarts(ecarts) +
      ' D\u2019ici là, la page peut être incomplète ou fausse.\x3C/p>', false);
  }
  /* L'erreur elle-même, pour moi : son nom, son message sans les valeurs
     citées (une cellule n'a rien à faire à l'écran), et où elle est née. */
  function detailDePanne(e) {
    var texte = String((e && e.name) || 'Erreur') + ' : ' + String((e && e.message) || e).replace(/"[^"]*"/g, '"…"');
    var pile = String((e && e.stack) || '').split('\n').slice(1, 4).map(function (l) {
      var m = /at (?:new )?([\w$.]+) \(/.exec(l); return m ? m[1] : '';
    }).filter(Boolean);
    return texte.slice(0, 200) + (pile.length ? ' — dans ' + pile.join(' ← ') : '');
  }
  function montrerDoublon() {
    cadreEnTete('\x3Cp style="margin:0">\x3Cb>Le fichier Javascript contient deux copies\x3C/b> — collé sans tout effacer ? ' +
      'Les chiffres peuvent venir de l\u2019ancienne. Dans Apps Script : \x3Cb>Javascript\x3C/b>, Ctrl+A, Suppr, coller ' +
      '\x3Cb>Javascript.html.txt\x3C/b> en entier, Ctrl+S. ' + gesteExec() + '\x3C/p>', true);
  }
  function montrerPanne(e, ecarts) {
    poserEtatOuverture('panne');       // l'ouverture s'arrête là : qui l'attend le sait
    /* Et elle s'arrête vraiment : plus rien n'est retenu en attendant la
       synthèse — un autre contrat, la vue d'ensemble répondent, comme
       avant (débrief 23, revue : une erreur dans la synthèse de HDK figeait
       toute la page). La page reprend aussi sa hauteur. */
    OUVERTURE = null;
    rendreHauteur();
    var html = '\x3Cp style="margin:0 0 6px">\x3Cb>La page n\u2019a pas pu s\u2019afficher.\x3C/b> ' +
      (ecarts.length ? 'Cause la plus probable : ' + phraseEcarts(ecarts)
                     : 'Une erreur l\u2019a arrêtée — rien n\u2019est touché dans le classeur. Une capture de ce cadre ' +
                       'suffit pour en trouver la cause ; le menu Suivi FWD → Diagnostic dit ce que le script voit.') + '\x3C/p>' +
      '\x3Cp style="margin:0;color:#57564e;font-size:12px">Détail : ' + ech(detailDePanne(e)) + '\x3C/p>';
    cadreEnTete(html, true);
  }

  /* Le démarrage. Une erreur ici remonte au filet posé en tête du fichier,
     qui l'affiche avec la cause la plus probable. L'état de l'ouverture se
     pose d'abord : il change le style de la page, qu'on lit juste après. */
  poserEtatOuverture('chargement');
  /* Le squelette dit qu'il lit les chiffres. Le filet d'Index regarde, à la
     fin de la lecture du document, si un Javascript a démarré : « Chargement… »
     encore là, c'est qu'aucun n'a tourné. Les chiffres arrivent désormais un
     instant après (l'ouverture en deux temps) : la phrase change tout de
     suite, pour qu'il voie que celui-ci a démarré. */
  if ($('phrase') && $('phrase').textContent === 'Chargement\u2026') $('phrase').textContent = 'Chargement des chiffres\u2026';
  signalerLivraison(ecartsDeLivraison(window.SUIVI_FWD_DONNEES));
  if ($('livraison') && EDITION !== 'source') {
    $('livraison').textContent = 'Livraison ' + EDITION;
    $('livraison').hidden = false;
  }
  if ($('mention-consultations') && API && API.noterConsultation) $('mention-consultations').hidden = false;
  /* Les données (décodées s'il le faut), la synthèse, puis le reste — et
     l'ouverture comptée, sans nom ni adresse (débrief 18), une fois la page
     affichée, pour ne rien retarder. Voir « L'OUVERTURE EN DEUX TEMPS ». */
  demarrer();
})();
window.SUIVI_FWD_FIN = 'c513f1d';
</script>
