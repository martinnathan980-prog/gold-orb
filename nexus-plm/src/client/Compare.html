<script>
// ============================================================
// NEXUS PLM — moteur d'équivalences.
//
// Ne produit aucun HTML : renvoie des données, que ViewCompare affiche.
// Entièrement piloté par le registre de Types.html et par les pondérations
// vivantes du Store — changer un curseur de réglage recalcule sans rien
// reconstruire.
//
// Deux règles de fond :
//   - un critère NON MESURABLE (donnée absente d'un côté) sort du
//     dénominateur et est restitué comme tel, au lieu de retirer des points
//     en silence ;
//   - les critères non comparés sont NOMMÉS sous le résultat, pour qu'un
//     100 % obtenu sur deux critères ne se lise pas comme un 100 % obtenu
//     sur huit.
// ============================================================

const SEUIL_DEFAUT = 15;
const MM_PAR_PAS = 9.525;

const ETAT = {
  IDENTIQUE: 'identique', PARTIEL: 'partiel',
  DIFFERENT: 'different', INDISPONIBLE: 'indisponible'
};

function critere(def, etat, poids, obtenu, message, ensembles) {
  return {
    cle: def.cle, libelle: def.libelle, mode: def.mode,
    etat: etat, poids: poids, obtenu: obtenu,
    message: message || null, ensembles: ensembles || null
  };
}

function vide(v) {
  const s = String(v === null || v === undefined ? '' : v).trim();
  return s === '' || s === '-';
}

/** Part courante d'un critère, en pourcentage du score total. */
function poidsDe(portee, def) {
  const regle = Store.poids && Store.poids[portee] && Store.poids[portee][def.cle];
  return (regle === undefined || regle === null) ? def.poids : Number(regle);
}

// ------------------------------------------------------------
// Évaluateurs, un par mode
// ------------------------------------------------------------
function evalEgalite(def, poids, source, cible) {
  const s = source[def.champ], c = cible[def.champ];
  if (vide(s) || vide(c)) {
    return critere(def, ETAT.INDISPONIBLE, poids, 0,
                   vide(s) ? 'non renseigné sur la source' : 'non renseigné sur la cible');
  }
  const egal = normaliserTexte(s) === normaliserTexte(c);
  return critere(def, egal ? ETAT.IDENTIQUE : ETAT.DIFFERENT, poids, egal ? poids : 0,
                 egal ? String(s).trim()
                      : String(s).trim() + ' vs ' + String(c).trim());
}

function evalNombre(def, poids, source, cible) {
  const s = parseFloat(source[def.champ]), c = parseFloat(cible[def.champ]);
  if (isNaN(s) || isNaN(c)) {
    return critere(def, ETAT.INDISPONIBLE, poids, 0,
                   isNaN(s) ? 'non renseigné sur la source' : 'non renseigné sur la cible');
  }
  const ecart = s === 0 ? Math.abs(c) : Math.abs(s - c) / Math.abs(s);
  const tol = def.tolerance || 0;
  const proche = ecart <= tol;
  const u = def.unite || '';
  let message = proche ? s + u : s + u + ' vs ' + c + u;
  if (def.champ === 'Nombre de pas' && proche) {
    message = s + ' pas (~' + (s * MM_PAR_PAS).toFixed(1) + ' mm)';
  }
  if (!proche && tol > 0) message += ' (écart ' + Math.round(ecart * 100) + ' %)';
  return critere(def, proche ? ETAT.IDENTIQUE : ETAT.DIFFERENT, poids, proche ? poids : 0, message);
}

function evalDimensions(def, poids, source, cible) {
  const s = def.champs.map(function (c) { return parseFloat(source[c]); });
  const c = def.champs.map(function (x) { return parseFloat(cible[x]); });
  if (s.some(isNaN) || c.some(isNaN)) {
    return critere(def, ETAT.INDISPONIBLE, poids, 0,
                   s.some(isNaN) ? 'dimensions incomplètes sur la source'
                                 : 'dimensions incomplètes sur la cible');
  }
  const tol = def.tolerance || 0;
  const proche = s.every(function (v, i) {
    return v === 0 ? c[i] === 0 : Math.abs(v - c[i]) / Math.abs(v) <= tol;
  });
  const fmt = function (t) { return t.join(' × ') + ' mm'; };
  return critere(def, proche ? ETAT.IDENTIQUE : ETAT.DIFFERENT, poids, proche ? poids : 0,
                 proche ? fmt(s) : fmt(s) + ' vs ' + fmt(c));
}

/** Recouvrement de deux listes : commun / manquant / en trop. */
function comparerListes(def, poids, listeSource, listeCible, etiquette) {
  const src = Array.from(new Set(listeSource));
  const cib = Array.from(new Set(listeCible));

  if (!src.length) {
    // Sans référence côté source, le critère n'est pas mesurable : il sort du
    // dénominateur au lieu de plomber le score (c'était le bug d'origine).
    return critere(def, ETAT.INDISPONIBLE, poids, 0,
                   cib.length ? 'aucun sur la source, ' + cib.length + ' sur la cible'
                              : 'aucun de part et d\'autre',
                   { communs: [], manquants: [], enPlus: cib });
  }

  const cle = function (x) { return normaliserTexte(x); };
  const indexCible = new Set(cib.map(cle));
  const indexSource = new Set(src.map(cle));
  const communs = src.filter(function (x) { return indexCible.has(cle(x)); });
  const manquants = src.filter(function (x) { return !indexCible.has(cle(x)); });
  const enPlus = cib.filter(function (x) { return !indexSource.has(cle(x)); });

  const ratio = communs.length / src.length;
  const etat = ratio === 1 ? ETAT.IDENTIQUE : (ratio > 0 ? ETAT.PARTIEL : ETAT.DIFFERENT);
  return critere(def, etat, poids, Math.round(poids * ratio * 100) / 100,
                 communs.length + ' / ' + src.length + ' ' + (etiquette || 'en commun'),
                 { communs: communs, manquants: manquants, enPlus: enPlus });
}

function valeursDe(objet, champs) {
  const sortie = [];
  (champs || []).forEach(function (c) {
    valeursMulti(objet[c]).forEach(function (v) { sortie.push(v); });
  });
  return sortie;
}

function evalEnsemble(def, poids, source, cible, contexte) {
  if (def.source === 'typesEnfants') {
    return comparerListes(def, poids,
      (source.nomenclature || []).map(function (l) { return typeDe(l).libelle; }),
      (cible.nomenclature || []).map(function (l) { return typeDe(l).libelle; }),
      'en commun');
  }
  if (def.source === 'composantsEnfants') {
    const ramasser = function (b) {
      const t = [];
      (b.nomenclature || []).forEach(function (l) {
        valeursMulti(l[Store.config.colonneStd]).forEach(function (c) { t.push(c); });
      });
      return t;
    };
    return comparerListes(def, poids, ramasser(source), ramasser(cible), 'en commun');
  }
  return comparerListes(def, poids, valeursDe(source, def.champs), valeursDe(cible, def.champs),
                        'en commun');
}

function evalMotsCles(def, poids, source, cible) {
  const src = [], cib = [];
  (def.champs || []).forEach(function (c) {
    motsCles(source[c]).forEach(function (m) { src.push(m); });
    motsCles(cible[c]).forEach(function (m) { cib.push(m); });
  });
  return comparerListes(def, poids, src, cib, 'mots-clés partagés');
}

const EVALUATEURS = {};
EVALUATEURS[MODE.EGALITE] = evalEgalite;
EVALUATEURS[MODE.NOMBRE] = evalNombre;
EVALUATEURS[MODE.DIMENSIONS] = evalDimensions;
EVALUATEURS[MODE.ENSEMBLE] = evalEnsemble;
EVALUATEURS[MODE.MOTS_CLES] = evalMotsCles;

// ------------------------------------------------------------
// Agrégation
// ------------------------------------------------------------
function evaluer(portee, definitions, source, cible) {
  // Seuls les critères retenus par l'utilisateur sont évalués : un critère
  // écarté ne figure pas dans le résultat, il n'y apparaît pas « ignoré ».
  const retenus = (typeof critereEstActif === 'function')
    ? definitions.filter(function (def) { return critereEstActif(portee, def.cle); })
    : definitions;

  const criteres = retenus.map(function (def) {
    return (EVALUATEURS[def.mode] || evalEgalite)(def, poidsDe(portee, def), source, cible);
  });

  let obtenu = 0, max = 0;
  criteres.forEach(function (c) {
    if (c.etat !== ETAT.INDISPONIBLE) { max += c.poids; obtenu += c.obtenu; }
  });

  // Part de chaque critère dans le score effectivement calculé.
  criteres.forEach(function (c) {
    c.part = max > 0 && c.etat !== ETAT.INDISPONIBLE ? Math.round((c.poids / max) * 100) : 0;
    c.rendement = c.poids > 0 ? c.obtenu / c.poids : 0;
  });

  // On ne parle plus de « couverture » en pourcentage — personne ne sait ce
  // que vaut « 73 % d'une couverture de 100 % ». On compte simplement les
  // critères qu'on n'a PAS pu comparer, et on les nomme.
  const nonComparables = criteres.filter(function (c) { return c.etat === ETAT.INDISPONIBLE; });

  return {
    criteres: criteres,
    score: max > 0 ? Math.round((obtenu / max) * 100) : 0,
    nonComparables: nonComparables.map(function (c) { return c.libelle; }),
    mesurable: max > 0
  };
}

function comparerBoites(source, cible) {
  return evaluer('boite', CRITERES_BOITE, source, cible);
}

function comparerSousEnsembles(source, cible) {
  const type = typeDe(source);
  return evaluer(type.cle, type.criteres, source, cible);
}

// ------------------------------------------------------------
// Recherches d'équivalences
// ------------------------------------------------------------
function seuil() {
  return Store.seuilEquivalence === undefined ? SEUIL_DEFAUT : Store.seuilEquivalence;
}

function equivalencesBoite(pnSource) {
  const source = boiteParPn(pnSource);
  if (!source) return [];
  const s = seuil();
  return Store.boites
    .filter(function (b) { return String(b[CLE_PN()]).trim() !== String(pnSource).trim(); })
    .map(function (cible) {
      const r = comparerBoites(source, cible);
      return { cible: cible, score: r.score, nonComparables: r.nonComparables,
               mesurable: r.mesurable, criteres: r.criteres };
    })
    .filter(function (r) { return r.mesurable && r.score >= s; })
    .sort(function (a, b) { return b.score - a.score || a.nonComparables.length - b.nonComparables.length; });
}

function equivalencesSousEnsemble(idLigne) {
  const source = nomParId(idLigne);
  if (!source) return [];
  const type = typeDe(source);
  const s = seuil();
  // On ne compare qu'entre sous-ensembles du MÊME type : une plaquette et un
  // harnais n'ont pas les mêmes critères, les confronter n'a pas de sens.
  return Store.nomenclature
    .filter(function (n) {
      return String(n[CLE_NOM()]).trim() !== String(idLigne).trim() &&
             typeDe(n).cle === type.cle;
    })
    .map(function (cible) {
      const r = comparerSousEnsembles(source, cible);
      const parent = boiteParPn(cible[CLE_PN()]);
      return { cible: cible, score: r.score, nonComparables: r.nonComparables,
               mesurable: r.mesurable, criteres: r.criteres, type: type,
               fonctionParent: parent ? txt(parent['Fonction'], 'Inconnue') : 'Inconnue' };
    })
    .filter(function (r) { return r.mesurable && r.score >= s; })
    .sort(function (a, b) { return b.score - a.score || a.nonComparables.length - b.nonComparables.length; });
}
</script>
