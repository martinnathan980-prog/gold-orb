    function cache() { return coupe && rang >= coupe ? ' hidden' : ''; }
    function partDe(n) { return '\x3Cspan class="part">' + Math.round(100 * n / totalGroupe) + '\u202f%\x3C/span>'; }
    var html = '';
    if (nArret) {
      html += '\x3Cdiv class="sous-arret"' + cache() + '>\x3Ch3 class="titre-arret">\x3Cspan class="pastille arret">\x3C/span>À l\u2019arrêt' +
        '\x3Cspan class="n">' + nb(nArret) + '\x3C/span>' + partDe(nArret) + '\x3C/h3>' +
        '\x3Cdiv class="grille-arret">' + arrets.map(function (x) { return jeton(x.plan); }).join('') + '\x3C/div>\x3C/div>';
    }
    html += VALEURS_COLONNE.filter(function (v) { return parValeur[v.cle]; }).map(function (v) {
      var liste = parValeur[v.cle].sort(function (a, b) { return COMPARER_REF(a.reference, b.reference); });
      /* La part de la sous-liste dans le groupe (débrief 27, B25) : la
         barre ne l'écrit plus que pour les validés ; ici, toutes les parts
         se lisent, au doigt comme au clavier, et s'additionnent avec celle
         des plans à l'arrêt. */
      return '\x3Cdiv class="sous-groupe"' + cache() + '>\x3Ch3 class="sous-titre">' + pastilleValeur(v.cle, v.famille) + ech(v.libelle) +
        '\x3Cspan class="n">' + nb(liste.length) + '\x3C/span>' + partDe(liste.length) + '\x3C/h3>' +
        '\x3Cdiv class="grille">' + liste.map(jeton).join('') + '\x3C/div>\x3C/div>';
    }).join('');
    var plus = '';
    if (limite) {
      plus = '\x3Cbutton type="button" class="plus-liste" data-plus-refs="1"' + (o.id ? ' aria-controls="' + o.id + '"' : '') +
        ' aria-expanded="' + !coupe + '">' + (coupe ? 'Voir les ' + nb(rang - coupe) + ' autres plans de ce groupe' : 'Réduire la liste des plans') +
        iconeDeplier() + '\x3C/button>';
    }
    /* Copier les références du groupe déplié, dans l'ordre affiché. */
    var copie = arrets.map(function (x) { return x.plan.reference; });
    VALEURS_COLONNE.forEach(function (v) { (parValeur[v.cle] || []).forEach(function (p) { copie.push(p.reference); }); });
    return ouverture + '\x3Cdiv class="entete">' +
      '\x3Cspan>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (vb ? ' « ' + ech(valeurDeCle(vb) ? valeurDeCle(vb).libelle : vb) + ' » sur ' + nb((r.plans || []).length)
          : (restants ? ' · \x3Cb>' + nb(restants) + '\x3C/b> pas encore validé' + (restants > 1 ? 's' : '') : ' · tout est validé')) +
      (nArret ? ' · \x3Cspan class="arret-n">\x3Cspan class="pastille arret">\x3C/span>' + nb(nArret) + ' à l\u2019arrêt\x3C/span>' : '') +
      '\x3C/span>\x3C/div>' +
      /* Débrief 28 : les deux gestes du groupe ensemble, sur leur ligne —
         filtrer la page, copier ses références. */
      '\x3Cdiv class="actions-groupe">' + filtrer + boutonCopier(copie) + '\x3C/div>' + html + plus + '\x3C/div>';
  }
  /* Débrief 27 (lot C, P-F5) : « j'ai cliqué ATA 39 pour voir lesquels, et
     toute la page est devenue 6 sur 80 ». Ouvrir une ligne ne fait plus que
     la déplier ; filtrer toute la page sur ce groupe est ce bouton-ci, dit
     en toutes lettres — posé, il dit comment le retirer. */
  function boutonFiltrerPage(val, nomG, pose) {
    return '\x3Cbutton type="button" class="filtrer-page' + (pose ? ' pose' : '') + '" id="filtrer-groupe-page" data-filtrer-groupe="' + ech(val) +
      '" title="' + ech(pose ? 'La page entière revient à tous les plans' : 'Synthèse, courbe, tableau : toute la page ne montrera que les plans de ' + nomG) + '">' +
      iconeEntonnoir() + ech(pose ? 'Retirer le filtre ' + nomG + ' de la page' : 'Filtrer la page sur ' + nomG) + '\x3C/button>';
  }

  function jetonUD(p) {
    var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
    /* Un plan à l'arrêt porte un anneau ambre, et sa bulle dit depuis quand ;
       sur la puce même, « depuis S12 » — ou « depuis ≤ S26 » quand la suite
       remonte au premier relevé connu : comme la bulle (« depuis au moins
       S26 »), la puce n'affirme pas un début que les relevés ignorent. */
    var arret = RELEVES.length > 1 ? plansALArret().parRef[p.reference] : null;
    return '\x3Cbutton class="jeton-ud' + (arret ? ' arret' : '') + '" type="button" data-ud="' + ech(p.reference) +
      '" title="' + ech(libelleValeur(p[CLE_SUIVIE]) + (quoi ? ' — ' + quoi : '') + (arret ? ' — ' + motArret(arret) : '')) + '">' +
      pastilleValeur(cleValeur(p[CLE_SUIVIE]), p._etat) + ech(p.reference) +
      (arret ? '\x3Cspan class="depuis">depuis ' + (arret.auMoins ? '\u2264\u00a0' : '') + 'S' + numeroSemaine(arret.depuis) + '\x3C/span>' : '') + '\x3C/button>';
  }
  /* Un plan cherché dans ce bloc : sous le groupe qui le contient, lui seul
     — pas toute la liste du groupe. */
  function listeTrouves(trouves) {
    var n = trouves.length;
    return '\x3Cdiv class="groupe-refs trouves">\x3Cdiv class="entete">\x3Cspan>\x3Cb>' + nb(n) + '\x3C/b> plan' + (n > 1 ? 's' : '') +
      ' trouvé' + (n > 1 ? 's' : '') + ' dans ce groupe\x3C/span>\x3C/div>' +
      '\x3Cdiv class="grille">' + trouves.map(jetonUD).join('') + '\x3C/div>\x3C/div>';
  }

  /* Le filtre de la colonne de gauche : les groupes dont le nom — tel qu'il
     s'affiche, donc « Oui » pour « true » — contient le texte tapé, et ceux
     qui contiennent un plan dont la référence le contient : le même champ
     trouve un ATA ou un plan, dans ce bloc seulement. */
  function nomGroupeCorrespond(r) {
    var q = norm(vue.filtreGroupe);
    return !!q && (norm(libelleGroupe(r.nom)).indexOf(q) !== -1 || norm(r.nom).indexOf(q) !== -1);
  }
  function plansTrouvesDans(r) {
    var q = motCherche(vue.filtreGroupe);
    if (!q) return [];
    var vb = vue.valeurBloc;
    return (r.plans || []).filter(function (p) { return refCorrespond(p.reference, q) && (!vb || p._cle === vb); })
      .sort(function (a, b) { return COMPARER_REF(a.reference, b.reference); });
  }
  function retenuParFiltreGroupe(r) {
    if (!norm(vue.filtreGroupe)) return true;
    return nomGroupeCorrespond(r) || plansTrouvesDans(r).length > 0;
  }
  /* La rangée de pastilles du bloc (débrief 18) : « Tout », puis chaque
     valeur de la colonne, dans l'ordre des tuiles. Une valeur qu'aucun plan
     du bloc ne porte n'a pas de pastille (débrief 19) ; sans plan, pas de
     rangée. Rend la valeur choisie, '' pour « Tout ». */
  function rendreFiltreValeurBloc(liste, dim) {
    var z = $('filtre-valeur-groupe');
    if (vue.valeurBloc && !valeurDeCle(vue.valeurBloc)) vue.valeurBloc = '';
    if (!z || !liste) {
      /* Sans rangée — ou sous un Index d'une livraison d'avant —, pas de
         valeur choisie qu'on ne pourrait plus retirer. */
      vue.valeurBloc = '';
      if (z) { z.hidden = true; z.innerHTML = ''; }
      return '';
    }
    /* Seulement les valeurs que portent les plans du bloc (débrief 19) —
       ceux que son champ « ATA ou plan… » laisse voir, comme la rangée du
       journal suit sa recherche : un groupe trouvé par son nom montre tous
       ses plans, un groupe gardé pour un plan cherché ne montre que lui. */
    var presentes = {}, q = norm(vue.filtreGroupe), qr = motCherche(vue.filtreGroupe), nomVu = {};
    liste.forEach(function (p) {
      if (q && dim) {
        var k = String(valeurDim(p, dim) || '\u2014');
        if (nomVu[k] === undefined) nomVu[k] = nomGroupeCorrespond({ nom: k });
        if (!nomVu[k] && !(qr && refCorrespond(p.reference, qr))) return;
      }
      presentes[p._cle] = true;
    });
    z.innerHTML = boutonsPastilles('valeur-bloc', vue.valeurBloc, VALEURS_COLONNE.map(function (v) {
      return { cle: v.cle, famille: v.famille, libelle: v.libelle, absente: !presentes[v.cle],
               titre: 'Compter, dans chaque groupe, les plans « ' + v.libelle + ' »' };
    }), { libelle: 'Tout', titre: 'Tous les plans de chaque groupe' });
    z.hidden = !z.innerHTML;
    if (z.hidden) vue.valeurBloc = '';
    marquerDebord(z);
    return vue.valeurBloc;
  }
  /* Ce qui est arrivé à une valeur au dernier relevé, groupe par groupe :
     les mêmes arrivées que la rangée du journal — passages, reculs,
     réémissions —, sur les plans que compte le bloc. Rien si la semaine la
     plus récente du journal n'est pas celle du dernier relevé : rien n'y a
     bougé. */
  /* Où ces arrivées ont eu lieu, avec les mots du pied : l'extract du jour
     pas encore archivé n'est pas « le dernier relevé ». */
  function quandDesGains(i) {
    var avant = RELEVES.length > 1 ? RELEVES[RELEVES.length - 2].i : null;
    return EXTRAIT_EN_PLUS && avant !== null
      ? 'entre le dernier relevé (' + semaineDite(avant) + ') et l\u2019extract du jour'
      : 'au dernier relevé (' + semaineDite(i) + ')';
  }
  function gainsAuDernierReleve(vb, liste, dim) {
    var res = { sem: null, parGroupe: {} };
    var der = RELEVES.length ? RELEVES[RELEVES.length - 1] : null, sem = JOURNAL[0];
    if (!der || !sem || sem.i !== der.i) return res;
    res.sem = sem.i;
    var dansListe = {};
    liste.forEach(function (p) { dansListe[p.reference] = true; });
    sem.evenements.forEach(function (e) {
      if (!arriveA(e, vb)) return;
      var p = planDeRef(e.ref);
      if (!p || !dansListe[p.reference]) return;
      var k = String(valeurDim(p, dim) || '\u2014');
      res.parGroupe[k] = (res.parGroupe[k] || 0) + 1;
    });
    return res;
  }

  /* Le champ suit la dimension : « Filtrer les ATA… », « Filtrer les mois… ». */
  function libellerFiltreGroupe(dim) {
    var quoi = dim === '_mois' ? 'mois'
             : dim === '_anciennete' ? 'tranches'
             : (TITRE_DIM[dim] || 'groupes').replace(/ \(.*\)$/, '');
    $('filtre-groupe').placeholder = (TITRE_DIM[dim] ? quoi : 'Groupe') + ' ou plan…';
    $('filtre-groupe').setAttribute('aria-label', 'Filtrer les ' + quoi + ' ou chercher un plan dans ce bloc');
  }

  /* Le nom du bloc dans le sommaire : « Par ATA », « Par ECP »… La synthèse
     le pose aussi (rendreHaut) : le sommaire de la première image de
     l'ouverture est celui de la page finie (débrief 23, revue). */
  /* Débrief 27 (D6) : le surtitre du panneau dit la même chose que son
     entrée du sommaire — on clique « 04 Par ATA », on arrive sur
     « 04 · Par ATA » (il disait « Répartition »). */
  function libellerSommaireGroupe() {
    var dim = vue.dimCritique;
    var mot = dim && TITRE_DIM[dim] ? 'Par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '') : 'Répartition';
    $('sommaire-groupe').textContent = mot;
    if ($('surtitre-groupe')) $('surtitre-groupe').textContent = mot;
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    /* L'échéance — le jalon qui pilote l'effort demandé sous le périmètre
       choisi — se pose d'abord, quoi que le bloc affiche ensuite : elle ne
       dépend ni de la sélection ni de la colonne analysée. */
    var prochain = prochainJalon();
    $('zone-critique').setAttribute('data-jalon', prochain ? prochain.texte : '');
    /* Aucune colonne à analyser — source vide, ou feuille sans catégorie
       reconnue : le bloc le dit au lieu de chercher un titre qui n'existe pas. */
    if (!dim || !TITRE_DIM[dim]) {
      $('titre-groupe').textContent = motSuivi();
      $('dim-critique').hidden = true;
      ajusterChoixDim();
      libellerSommaireGroupe();
      $('indice-dim').textContent = '';
      $('compte-groupes').textContent = '';
      libellerFiltreGroupe(dim);
      rendreFiltreValeurBloc(null);
      $('zone-critique').classList.remove('sans-jalon');
      /* Débrief 27 (lot C, D8) : un bloc vide le dit calmement, et ses
         commandes, qui n'agiraient sur rien, s'effacent. */
      blocCritiqueVide(true);
      $('zone-critique').innerHTML = etatVideCritique('Aucune colonne à analyser dans cette source.',
        'Le bloc répartit les plans par ATA, ECP, séquence… ; cette feuille n’en a aucune.');
      return;
    }

    /* Répartition : état du jour, filtrée comme le reste de la page — sauf
       par le groupe choisi ici. Un groupe cliqué se déplie sur place, comme
       une semaine du journal, et les autres restent là (débrief 17) : le
       reste de la page, lui, le suit. */
    if (vue.groupe && vue.groupe.dim === dim) liste = selection(true);
    /* La rangée de pastilles se pose avant toute sortie : jamais celle d'un
       autre contrat sous une sélection vide. */
    var vb = rendreFiltreValeurBloc(liste, dim);
    var vVal = vb ? valeurDeCle(vb) : null;
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [], parValeur: {} };
      groupes[k].total++;
      groupes[k][p._etat]++;
      groupes[k].parValeur[p._cle] = (groupes[k].parValeur[p._cle] || 0) + 1;
      groupes[k].plans.push(p);
    });
    var gains = vb ? gainsAuDernierReleve(vb, liste, dim) : null;

    /* Le rythme, la fin estimée et le rythme requis d'un groupe se lisent
       sur sa série — celle que dessine le graphique quand on choisit la
       ligne, celle que lit la fiche d'échéance : les relevés archivés, sous
       le périmètre choisi. Un relevé archivé ne se refiltre pas : ces trois
       colonnes portent sur tous les plans du groupe, quels que soient les
       autres filtres, et le bloc le dit quand il y en a. */
    var per = vue.perimetre;
    var depart = semaineDepart();
    var arretParRef = RELEVES.length > 1 ? plansALArret().parRef : {};
    /* « 3 à l'arrêt » sous le compte d'un groupe est un bouton : il montre
       ces plans-là dans le tableau (« À surveiller » limité au groupe). Son
       nombre est celui des lignes que le clic montrera — la sélection, sans
       sa sélection de plans que le clic remplace, ni une tuile contraire
       qu'il retire ; sous une valeur du bloc, les plans de cette valeur. */
    var arretClic = {};
    if (RELEVES.length > 1) {
      var dansClic = {};
      selectionSans({ refs: true, groupe: true, etat: vb ? true : etatContraireALArret() })
        .forEach(function (p) { dansClic[p.reference] = true; });
      plansALArret().liste.forEach(function (x) {
        if (!dansClic[x.plan.reference] || (vb && x.plan._cle !== vb)) return;
        var kg = String(valeurDim(x.plan, dim) || '\u2014');
        arretClic[kg] = (arretClic[kg] || 0) + 1;
      });
    }
    var arretPresse = vue.refsLibelle === SEL_ARRET && vue.groupe && vue.groupe.dim === dim ? vue.groupe.val : null;
    var rangs = Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      var grp = { dim: dim, val: k };
      var serie = serieDe(per, grp).pts;
      var derG = serie[serie.length - 1];
      var restantsGroupe = Math.max(0, derG.total - derG.termine);
      var rg = rythmes(serie);
      var vitesse = rg ? rg.central : 0;
      /* Le rythme requis : la formule de la fiche (bilanEcheance), sur ce
         groupe — sous « Tout », un jalon BASE/OPTION ne lui demande que ses
         plans BASE/OPTION. */
      var b = prochain ? bilanEcheance(prochain, grp) : null;
      var nValeur = vb ? (g.parValeur[vb] || 0) : g.total;
      return {
        rythme: rg, bilan: b,
        nom: g.nom, total: g.total, restants: g.total - g.termine, restantsGroupe: restantsGroupe, vitesse: vitesse, plans: g.plans,
        parValeur: g.parValeur, nValeur: nValeur, partValeur: g.total ? nValeur / g.total : 0,
        gain: gains ? (gains.parGroupe[k] || 0) : 0,
        /* Sous une valeur, « à l'arrêt » ne compte que ses plans : on ne lit
           pas « 3 à l'arrêt » sous « Validé ». */
        arret: g.plans.filter(function (p) { return arretParRef[p.reference] && (!vb || p._cle === vb); }).length,
        arretClic: arretClic[k] || 0,
        termine: g.termine, encours: g.encours, afaire: g.afaire, vide: g.vide,
        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restantsGroupe === 0 ? depart : semaineFin(derG.termine, derG.total, vitesse),
        requis: b && b.restants ? b.requis : 0,
        /* Pour ranger : combien de fois plus vite qu'aujourd'hui il faudrait
           aller. Rien à terminer pour ce jalon : en bas. */
        tension: !b || !b.restants ? -1 : (b.rythme > 0 ? b.requis / b.rythme : Infinity)
      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      /* Sous une valeur choisie, « plans » et « répartition » rangent sur
         elle : quel ATA a le plus de « VALIDATED », la plus grande part. */
      if (cle === 'total') return vb ? r.nValeur : r.total;
      if (cle === 'pct') return vb ? r.partValeur : r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'vitesse') return r.vitesse;
      if (cle === 'tension') return r.tension;
      if (cle === 'fin') return r.fin === null ? Infinity : r.fin;
      return 0;
    }
    /* Par défaut, les groupes se rangent par leur nom — ATA 21, 24, 25…, les
       mois dans l'ordre du temps : on cherche un groupe comme dans un
       index. Un clic sur « fin estimée » ou « rythme requis » range par
       urgence. */
    var tg = vue.triGroupe && vue.triGroupe.cle ? vue.triGroupe : { cle: 'nom', asc: true, parDefaut: true };
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {
        var x = cleTri(a, tg.cle), y = cleTri(b, tg.cle);
        if (typeof x === 'string') {
          // Les codes ATA sont des nombres ecrits en texte : on les compare comme tels.
          var nx = parseFloat(x), ny = parseFloat(y);
          if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return (nx - ny) * signe;
          return COMPARER_NUM(x, y) * signe;
        }
        if (x === y) return COMPARER_NUM(a.nom, b.nom);
        // Infinity des deux cotes : egalite, on retombe sur le nom.
        if (!isFinite(x) && !isFinite(y)) return COMPARER_NUM(a.nom, b.nom);
        return (x < y ? -1 : 1) * signe;
      });
    }

    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    /* Débrief 20 : le mot de la dimension, à l'écran, c'est le menu qui suit
       le titre ; le titre le garde en texte masqué, pour qu'un lecteur
       d'écran entende la phrase entière, « Avancement FWD par ATA ». */
    $('titre-groupe').innerHTML = ech(motSuivi()) + ' par \x3Cspan class="masque">' +
      ech(TITRE_DIM[dim].replace(/ \(.*\)$/, '')) + '\x3C/span>';
    $('dim-critique').hidden = false;
    ajusterChoixDim();
    // Le sommaire dit la même chose que le titre : « Par ATA », « Par ECP »…
    libellerSommaireGroupe();
    $('indice-dim').textContent = NOTE_DIM(dim);
    libellerFiltreGroupe(dim);

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      blocCritiqueVide(!vue.filtreGroupe);
      $('zone-critique').innerHTML = filtreLibre() || vue.perimetre
        ? etatVideCritique('Aucun plan dans la sélection.',
            'Les filtres posés sur la page ne laissent aucun plan à répartir ; « Tout effacer », en haut de la page, les retire.')
        : etatVideCritique('Aucun plan à répartir.', 'Cette source n’a encore aucun plan.');
      $('compte-groupes').textContent = '';
      return;
    }
    blocCritiqueVide(false);

    /* Le filtre de la colonne de gauche ne touche qu'à ce bloc : les lignes
       qu'il écarte restent comptées partout ailleurs. Le compte dit combien
       restent sur combien tant qu'il agit. */
    var tous = rangs.length;
    rangs = rangs.filter(retenuParFiltreGroupe);
    $('compte-groupes').textContent = rangs.length === tous ? '' : nb(rangs.length) + ' sur ' + nb(tous);
    marquerDebord($('filtre-valeur-groupe'));     // le compte prend sa place sur la ligne

    var motDim = TITRE_DIM[dim].replace(/ \(.*\)$/, '');
    /* Débrief 27 (lot C, P-F17) : chaque en-tête dit qu'il trie — une double
       flèche pâle au repos, ↑ ou ↓ à l'encre sur la colonne active — et le
       dit aux lecteurs d'écran : aria-sort sur l'en-tête de colonne. */
    function fleche(cle) {
      var actif = !!(tg && tg.cle === cle);
      var trace = !actif ? 'M3 4 5 1.8 7 4M3 6l2 2.2L7 6' : (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3');
      return '\x3Csvg class="fleche' + (actif ? '' : ' repos') + '" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        trace + '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
    }
    function entete(cle, libelle, titre, classe, avant) {
      var actif = !!(tg && tg.cle === cle);
      return '\x3Cspan role="columnheader" class="' + (classe || '') + '"' +
        (actif ? ' aria-sort="' + (tg.asc ? 'ascending' : 'descending') + '"' : '') +
        '>\x3Cbutton type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +
        (titre ? ' title="' + ech(titre) + '"' : '') + '>' + (avant || '') + ech(majuscule(libelle)) + fleche(cle) + '\x3C/button>';
    }

    /* Débrief 27 (lot C, X-A13) : le « ? » dit ce qu'il explique — un
       lecteur d'écran entendait « point d'interrogation ». Chacun a sa clé
       (data-aide), pour que le focus revienne au bon après un rendu. */
    function aide(quoi, cle) {
      var nom = 'Aide : comment ' + quoi + ' est calculé' + (/^la /.test(quoi) ? 'e' : '');
      return '\x3Cbutton type="button" class="aide" data-aide="' + cle + '" aria-expanded="' + (!!vue.aideFin) +
        '" aria-controls="panneau-fin" aria-label="' + ech(nom) + '" title="' + ech(nom) + '">?\x3C/button>';
    }

    var tete = '\x3Cdiv class="critique-tete" role="row">' +
      entete('nom', motDim, TITRE_DIM[dim]) + '\x3C/span>' +
      (vVal
        ? entete('total', 'plans', 'Plans « ' + vVal.libelle + ' » du groupe dans la sélection, sur son total.', '', pastilleValeur(vb, vVal.famille)) + '\x3C/span>' +
          entete('pct', 'répartition', 'Trier par part de « ' + vVal.libelle + ' ».', 'a-gauche') + '\x3C/span>'
        : entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '\x3C/span>' +
          entete('pct', 'répartition', 'Trier par part de plans validés.', 'a-gauche') + '\x3C/span>') +
      entete('fin', 'fin estimée', 'Semaine où tout le groupe serait validé si le rythme tenu se maintient.') + aide('la fin estimée', 'fin') + '\x3C/span>' +
      (prochain
        ? entete('requis', 'rythme requis', 'Plans à valider chaque semaine pour tenir « ' + prochain.texte + ' » (' +
            semaineDite(prochain.i) + ') ; dessous, le rythme tenu et sa jauge — la part du rythme requis qu’il atteint, en rouge quand il ne suffit pas.') + aide('le rythme requis', 'requis') + '\x3C/span>'
        : entete('vitesse', 'rythme tenu', 'Plans validés par semaine, du premier au dernier relevé.') + aide('le rythme tenu', 'tenu') + '\x3C/span>') +
      '\x3C/div>';

    /* Au-dessus de la liste (débrief 27, P-F4) : les notes qui expliquent
       ses colonnes, puis le panneau « D'où viennent ces chiffres ? » quand
       un « ? » l'ouvre — il ne remplace plus la liste dans un cadre de
       430 px, il se pose devant elle, et l'en-tête reste juste dessous. */
    var html = '';
    /* Un jalon d'un seul périmètre, lu sur « Tout » : son rythme requis ne
       compte que ses plans à lui, et le bloc le dit. */
    var perJ = prochain ? perimetreEcheance(prochain) : '';
    if (prochain && perJ && perJ !== per) {
      html += '\x3Cdiv class="critique-note">Rythme requis pour « ' + ech(prochain.texte) + ' » : sur les plans ' +
        ech(perJ) + ' de chaque groupe.\x3C/div>';
    }
    /* « 1 à l'arrêt », sous le compte d'un groupe, ne s'explique pas tout
       seul (débrief 15) : le mot se définit ici, en clair, dès qu'un groupe
       en compte un. Sur le même nombre que les boutons (arretClic) : sous une
       tuile Validé, ils restent — le clic retire la tuile — et la note,
       comptée avant sur la sélection (vide de plans en cours), disparaissait
       en laissant le mot sans définition (relecture du débrief 20). */
    if (rangs.some(function (r) { return r.arretClic; })) {
      html += '\x3Cdiv class="critique-note note-arret">\x3Cspan class="pastille arret">\x3C/span>\x3Cspan>\x3Cb>à l’arrêt\x3C/b> = en cours, sans changement depuis ' +
        SEMAINES_ARRET + ' semaines ou plus. Un clic sur « à l’arrêt » ne montre qu’eux dans le tableau ; le groupe ouvert les met en tête de sa liste.\x3C/span>\x3C/div>';
    }
    /* Sous une valeur, ce que comptent les colonnes : « plans » et la
       barre suivent la valeur, la fin estimée et les rythmes restent ceux
       de tout le groupe — sinon on lirait « la fin des TO_CONFIRM ». */
    if (vVal) {
      html += '\x3Cdiv class="critique-note note-valeur">' + pastilleValeur(vb, vVal.famille) + '\x3Cspan>Plans et répartition : les plans « ' + ech(vVal.libelle) +
        ' » de chaque groupe, sur son total' + (gains && gains.sem !== null ? ', et ceux qui y sont arrivés ' + ech(quandDesGains(gains.sem)) : '') +
        '. Fin estimée et rythmes : sur tous ses plans' + (filtreHorsGroupe() ? ' — un relevé archivé ne se refiltre pas' : '') + '.\x3C/span>\x3C/div>';
    } else if (filtreHorsGroupe()) {
      /* Les autres filtres ne touchent pas l'historique : le bloc le dit. */
      html += '\x3Cdiv class="critique-note">Fin estimée et rythmes : sur tous les plans de chaque groupe — un relevé archivé ne se refiltre pas.\x3C/div>';
    }

    if (vue.aideFin) html += panneauAide(rangs, prochain);

    /* Débrief 27 (lot C, D10) : plus de cadre qui défile — la liste prend
       sa hauteur dans la page. Au-delà d'une quinzaine de groupes (huit au
       téléphone, où chaque groupe est une carte), les suivants attendent,
       cachés, derrière « Voir les N autres » ; la ligne dépliée reste
       toujours en vue. Les lignes cachées sont là (hidden) : rien ne se
       recalcule quand on les montre. */
    function estOuvert(r) { return !!(vue.groupeOuvert && vue.groupeOuvert.dim === dim && vue.groupeOuvert.val === r.nom); }
    var etroit = !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches);
    var limiteG = etroit ? 8 : 15, montres = rangs.length;
    var repliable = rangs.length > limiteG + (etroit ? 2 : 3);
    if (repliable && !vue.groupesTout) {
      montres = limiteG;
      rangs.forEach(function (r, i) { if (estOuvert(r)) montres = Math.max(montres, i + 1); });
    }
    /* Les références d'un gros groupe déplié : une douzaine de rangées de
       puces, puis « Voir les N autres plans » (D10). La rangée de puces
       compte autant de puces que la largeur en loge (colonnes de 150 px). */
    /* La largeur vient de la dernière mesure de la page (poserColonneNom,
       à l'image d'avant) : la lire ici forcerait une mise en page entière,
       tableau de 640 lignes compris, au milieu du rendu. */
    var limiteRefs = LARGEUR_LISTE ? Math.max(1, Math.floor((LARGEUR_LISTE - 32 + 7) / 157)) * 12 : 0;

    var lignes = rangs.map(function (r, i) {
      var ouvert = estOuvert(r);
      var filtrePage = !!(vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom);
      var trouves = plansTrouvesDans(r);
      var nomG = nomDuGroupe(dim, r.nom);
      var idListe = 'liste-groupe-' + i;

      /* Débrief 22 : la barre se découpe par valeur, comme la barre du
         haut — chaque valeur a sa couleur, et un segment « en cours » d'un
         seul bleu dirait PWD_IN_PROGRESS pour des PWD_TO_CONTROL.
         Débrief 27 (lot C, B25) : seule la part des validés s'écrit dans la
         barre — sous une valeur choisie, la sienne — quand elle y tient ;
         vingt-six petits pourcentages se disputaient l'œil. Les autres parts
         se lisent au survol d'un segment, dans la phrase de la ligne (lecteur
         d'écran) et, au doigt comme au clavier, en tête des sous-listes de la
         ligne dépliée. */
      var barre = VALEURS_COLONNE.map(function (v) {
        var nV = r.parValeur[v.cle];
        if (!nV) return '';
        var part = (nV / r.total) * 100;
        var eclaire = !!vVal && v.cle === vb;
        var ecrite = vVal ? eclaire : v.famille === 'termine';
        var texte = ecrite && part >= 11 ? Math.round(part) + ' %' : '';
        /* Chaque segment dit au survol sa valeur et son compte, comme la
           barre du haut — les fins segments n'ont pas d'autre texte. */
        var titre = ' title="' + ech(v.libelle + ' : ' + nb(nV) + ' sur ' + nb(r.total)) + '"';
        return v.hachure
          ? '\x3Cspan class="hachure' + (eclaire ? ' eclaire' : '') + '" data-cle="' + ech(v.cle) + '"' + titre + ' style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + (texte ? '\x3Ci class="etiq-part">' + texte + '\x3C/i>' : '') + '\x3C/span>'
          : '\x3Cspan' + (eclaire ? ' class="eclaire"' : '') + ' data-cle="' + ech(v.cle) + '"' + titre + ' style="width:' + part.toFixed(2) + '%;background:' + v.couleur + ';color:' + v.encre + '">' + texte + '\x3C/span>';
      }).join('');

      /* Une seule colonne d'appoint : le rythme requis quand un jalon fixe
         une échéance — en plans par semaine, avec le rythme tenu dessous et
         sa jauge (débrief 27, B13) —, le rythme tenu seul sinon. */
      var col2, b = r.bilan, rythmeDit;
      if (!prochain) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme tenu" aria-hidden="true">\x3Cspan class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? virgule(r.vitesse) + '/sem.' : 'rien de validé') +
          '\x3C/span>\x3C/span>';
        rythmeDit = 'Rythme tenu : ' + (r.vitesse > 0 ? virgule(r.vitesse) + ' plans par semaine.' : 'rien de validé.');
      } else if (!b.total) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis" aria-hidden="true" title="Aucun plan de ce groupe dans ' +
          ech(b.domaine) + ' : « ' + ech(prochain.texte) + ' » ne lui demande rien.">\x3Cspan class="v critique-ecart doux">—\x3C/span>\x3C/span>';
        rythmeDit = 'Rythme requis : rien, aucun plan de ce groupe dans ' + b.domaine + '.';
      } else if (!b.restants) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis" aria-hidden="true">\x3Cspan class="v critique-ecart">tout est validé\x3C/span>\x3C/span>';
        rythmeDit = 'Rythme requis : tout est validé.';
      } else {
        var atteint = b.rythme > 0 ? Math.min(1, b.rythme / b.requis) : 0;
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis" aria-hidden="true" title="' + ech(nb(b.restants) + (b.restants > 1 ? ' plans' : ' plan') +
          ' à valider' + (b.domaine && b.domaine !== per ? ' dans ' + b.domaine : '') + ' en ' + b.semaines + (b.semaines > 1 ? ' semaines' : ' semaine') +
          ' : ' + virgule(b.requis) + ' par semaine ; rythme tenu : ' + (b.rythme > 0 ? virgule(b.rythme) + ' par semaine' : 'aucun plan validé') +
          (b.enRetard ? ', il ne suffit pas.' : ', il suffit.')) +
          '">\x3Cspan class="v critique-ecart">\x3Cspan class="requis">' + virgule(b.requis) + '/sem.\x3C/span>' +
          '\x3Csmall>\x3Cspan class="jauge-rythme' + (b.enRetard ? '' : ' suffit') + '">\x3Ci style="width:' + (b.enRetard ? (100 * atteint).toFixed(1) : '100') + '%">\x3C/i>\x3C/span>' +
          (b.rythme > 0 ? 'tenu ' + virgule(b.rythme) + '/sem.' : 'rien de validé') + '\x3C/small>\x3C/span>\x3C/span>';
        rythmeDit = 'Rythme requis : ' + virgule(b.requis) + ' plans par semaine ; tenu : ' + (b.rythme > 0 ? virgule(b.rythme) : 'aucun') +
          (b.enRetard ? ', en retard.' : ', suffisant.');
      }

      // --- colonne chiffree 3 : la semaine d'arrivee au rythme tenu
      var texteFin = r.restantsGroupe === 0 ? 'validé' : (r.fin === null ? '—' : semaineDite(r.fin));
      var col3 = '\x3Cspan class="critique-date' + (r.fin === null && r.restantsGroupe !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" aria-hidden="true" title="' +
        (r.restantsGroupe === 0 ? 'Plus rien à valider dans ce groupe.'
          : r.fin === null ? 'Aucun plan validé depuis le premier relevé : pas de rythme, donc pas de date.'
          : ech(nb(r.restantsGroupe) + ' plans à valider à ' + virgule(r.vitesse) + ' par semaine : ' + (r.fin - depart) + ' semaines, fin ' + semaineDite(r.fin) + '.')) +
        '">\x3Cspan class="v">' + texteFin + '\x3C/span>\x3C/span>';

      /* Débrief 27 (lot C, X-A6) : un lecteur d'écran entendait « 21 65
         12 % 34 % 48 % S48… ». La ligne se dit maintenant en une phrase
         (masquée à l'œil), les cellules visibles lui sont cachées. */
      var detailDit = VALEURS_COLONNE.filter(function (v) { return r.parValeur[v.cle]; }).map(function (v) {
        return nb(r.parValeur[v.cle]) + ' ' + v.libelle + ' (' + Math.round(100 * r.parValeur[v.cle] / r.total) + ' %)';
      }).join(', ');
      var phrase = nomG + ', ' +
        (vVal ? nb(r.nValeur) + ' ' + vVal.libelle + ' sur ' : '') + nb(r.total) + ' plan' + (r.total > 1 ? 's' : '') +
        (vVal && r.gain ? ' (' + nb(r.gain) + (r.gain > 1 ? ' arrivés' : ' arrivé') + ' au dernier relevé)' : '') +
        ' : ' + detailDit + '. Fin estimée : ' +
        (r.restantsGroupe === 0 ? 'tout est validé' : r.fin === null ? 'aucune, rien de validé depuis le premier relevé' : semaineEnClair(r.fin)) + '. ' +
        rythmeDit + (filtrePage ? ' Filtre posé sur toute la page.' : '');

      return '\x3Cdiv class="critique-rangee" role="row"' + (i >= montres ? ' hidden' : '') + '>' +
        '\x3Cdiv class="critique-cellule" role="cell" aria-colspan="5">' +
        '\x3Cbutton class="critique-ligne' + (vVal && !r.nValeur ? ' sans-valeur' : '') + (filtrePage ? ' filtre-page' : '') + '" type="button" data-groupe="' + ech(r.nom) +
        '" aria-expanded="' + ouvert + '"' + (ouvert ? ' aria-controls="' + idListe + '"' : '') + '>' +
        '\x3Cspan class="masque">' + ech(phrase) + '\x3C/span>' +
        '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' +
        '\x3Cspan class="critique-nom" aria-hidden="true">' + ech(libelleGroupe(r.nom)) + (filtrePage ? iconeEntonnoir('marque-filtre') : '') + '\x3C/span>' +
        '\x3Cspan class="critique-plans" aria-hidden="true">\x3Cspan class="critique-total" data-libelle="plans">' + (vVal ? r.nValeur : r.total) + '\x3C/span>' +
        (vVal ? '\x3Csmall class="sur-n">sur ' + nb(r.total) + (r.gain ? ' · \x3Cb title="' + ech(nb(r.gain) + (r.gain > 1 ? ' plans arrivés' : ' plan arrivé') + ' à « ' +
          vVal.libelle + ' » ' + quandDesGains(gains.sem)) + '">+' + nb(r.gain) + '\x3C/b>' : '') + '\x3C/small>' : '') +
        /* Les plans à l'arrêt du groupe, sous son compte : en ambre, comme
           la puce « À surveiller » du haut. La ligne leur garde la place ;
           le bouton, posé juste après elle (un bouton n'en contient pas un
           autre), vient s'y loger. */
        (r.arretClic ? '\x3Csmall class="arret-n place" aria-hidden="true">' + r.arretClic + ' à l’arrêt\x3C/small>' : '') + '\x3C/span>' +
        '\x3Cspan class="critique-barre' + (vVal ? ' focalise' : '') + '" aria-hidden="true">' + barre + '\x3C/span>' +
        col3 + col2 + '\x3C/button>' +
        (r.arretClic ? '\x3Cdiv class="critique-arret">\x3Cbutton type="button" class="arret-groupe" data-arret-groupe="' + ech(r.nom) +
          '" aria-pressed="' + (arretPresse === r.nom) + '" aria-label="' + ech(nomG + ' : ' + r.arretClic + ' à l’arrêt — ne montrer qu’eux dans la page') +
          '" title="' + ech(r.arretClic + (r.arretClic > 1 ? ' plans en cours n’ont pas bougé' : ' plan en cours n’a pas bougé') +
          ' depuis ' + SEMAINES_ARRET + ' semaines ou plus — ' + (arretPresse === r.nom ? 'cliquez pour retirer le filtre' : 'cliquez pour ne voir qu’eux dans le tableau')) +
          '">' + r.arretClic + ' à l’arrêt\x3C/button>\x3C/div>' : '') +
        (ouvert ? listeUD(r, vb, { id: idListe, nom: nomG, filtre: filtrePage, limite: limiteRefs })
                : (trouves.length ? listeTrouves(trouves) : '')) +
        '\x3C/div>\x3C/div>';
    }).join('');

    html += '\x3Cdiv class="critique-table" id="table-groupes" role="table" aria-labelledby="titre-groupe">' + tete + lignes + '\x3C/div>';
    var caches = rangs.length - montres;
    if (repliable && (caches > 0 || vue.groupesTout)) {
      var motListe = motPluriel(dim);
      html += '\x3Cbutton type="button" class="plus-liste" id="plus-groupes" aria-controls="table-groupes" aria-expanded="' + !!vue.groupesTout + '">' +
        (vue.groupesTout ? 'Réduire la liste aux ' + limiteG + ' premiers ' + motListe
                         : 'Voir ' + (caches > 1 ? 'les ' + nb(caches) + ' autres ' + motListe : 'l’autre ' + motListe.replace(/^(groupe|tranche)s$/, '$1'))) +
        iconeDeplier() + '\x3C/button>';
    }

    if (!rangs.length) {
      html += '\x3Cdiv class="vide-message">Ni groupe ni plan' + (vVal ? ' « ' + ech(vVal.libelle) + ' »' : '') + ' ne contient « ' + ech(vue.filtreGroupe.trim()) +
        ' ». Échap vide le filtre.\x3C/div>';
    }

    $('zone-critique').classList.toggle('sans-jalon', !prochain);
    $('zone-critique').innerHTML = html;
    ajusterColonneNom();
  }
  /* Débrief 27 (lot C, D8) : le bloc vide — une phrase calme et son
     explication ; la ligne des pastilles et de la recherche, qui n'agirait
     sur rien, s'efface (sauf si on y a tapé un texte). */
  function etatVideCritique(phrase, detail) {
    return '\x3Cdiv class="etat-vide">\x3Cp class="etat-vide-phrase">' + ech(phrase) + '\x3C/p>' +
      (detail ? '\x3Cp class="etat-vide-detail">' + ech(detail) + '\x3C/p>' : '') + '\x3C/div>';
  }
  function blocCritiqueVide(vide) {
    var sec = $('section-repartition');
    if (sec && sec.classList.contains('bloc-vide') !== vide) sec.classList.toggle('bloc-vide', vide);
  }
  /* Débrief 27 (lot C) : le nom d'un groupe en clair — « ATA 39 »,
     « ECP-2108 » (le mot de la dimension n'est pas répété quand la valeur
     le porte déjà), « Date création avr. 2024 ». */
  function nomDuGroupe(dim, val) {
    var mot = TITRE_DIM[dim] ? TITRE_DIM[dim].replace(/ \(.*\)$/, '') : 'Groupe';
    var lib = libelleGroupe(val);
    if (lib === '—') return mot + ' (sans valeur)';
    return norm(lib).indexOf(norm(mot)) === 0 ? lib : mot + ' ' + lib;
  }
  /* Le mot de la liste pour « Voir les 7 autres ATA » : un sigle reste tel
     quel (ATA, ECP, CC), le reste se dit « groupes » — « mois » et
     « tranches » pour les deux dimensions tirées de la date. */
  function motPluriel(dim) {
    if (dim === '_mois') return 'mois';
    if (dim === '_anciennete') return 'tranches';
    var mot = TITRE_DIM[dim] ? TITRE_DIM[dim].replace(/ \(.*\)$/, '') : '';
    return mot && mot === mot.toUpperCase() && mot.length <= 5 ? mot : 'groupes';
  }
  /* « S48 · déc. 2027 » se lit « semaine 48, décembre 2027 » (phrase d'une
     ligne, pour un lecteur d'écran). */
  function semaineEnClair(i) {
    var jeudi = new Date(dateDe(i).getTime());
    jeudi.setUTCDate(jeudi.getUTCDate() + 3);
    return 'semaine ' + numeroSemaine(i) + ', ' + MOIS[jeudi.getUTCMonth()] + ' ' + jeudi.getUTCFullYear();
  }
  /* Les deux petits dessins du bloc : l'entonnoir du filtre de la page,
     le chevron de « Voir les N autres ». */
  function iconeEntonnoir(classe) {
    return '\x3Csvg' + (classe ? ' class="' + classe + '"' : '') + ' width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
      '\x3Cpath d="M1.5 2h9L7 6.2V10l-2-1.1V6.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>\x3C/svg>';
  }
  function iconeDeplier() {
    return '\x3Csvg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
      '\x3Cpath d="M2 3.5 5 6.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
  }
  /* La colonne du nom de groupe prend la largeur du plus long nom affiché
     (débrief 23 : un nom d'ECP coupé de « … » ne se lisait plus). Une seule
     mesure, tous les noms d'un coup ; au téléphone, le nom a toute la ligne.
     Elle se fait à l'image suivante, avec les autres mesures de la page. */
  function ajusterColonneNom() { aMesurer('colonneNom'); }
  /* Débrief 27 (lot C) : la largeur de la liste, relevée avec les autres
     mesures de la page ; le rendu du bloc s'en sert sans rien remesurer. */
  var LARGEUR_LISTE = 0;
  function poserColonneNom() {
    LARGEUR_LISTE = $('zone-critique') ? $('zone-critique').clientWidth : 0;
    largeurColonneNom();
    poserPartsBarre();
  }
  /* Débrief 27 (lot C, B25) : la part des validés ne s'écrit dans sa barre
     que si elle y tient en entier — à 768 px, « 12 % » se coupait en
     « 2% » dans un segment de 14 px. Sinon elle reste dans la phrase de la
     ligne, au survol et en tête de sa sous-liste. */
  function poserPartsBarre() {
    var zone = $('zone-critique');
    if (!zone) return;
    var segs = [].filter.call(zone.querySelectorAll('.critique-barre span[data-cle]'), function (x) { return !!x.textContent; });
    segs.forEach(function (x) { x.classList.remove('part-cachee'); });
    var plage = document.createRange();
    segs.filter(function (x) {
      plage.selectNodeContents(x);
      return x.clientWidth > 0 && plage.getBoundingClientRect().width + 4 > x.clientWidth;
    }).forEach(function (x) { x.classList.add('part-cachee'); });
  }
  function largeurColonneNom() {
    var zone = $('zone-critique');
    if (!zone) return;
    zone.style.removeProperty('--col-nom');
    [].forEach.call(zone.querySelectorAll('.critique-ligne.nom-dessus'), function (l) { l.classList.remove('nom-dessus'); });
    if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) return;
    var noms = zone.querySelectorAll('.critique-ligne .critique-nom');
    if (!noms.length || !zone.clientWidth) return;
    /* La largeur du texte lui-même (une plage sur le nom, écrit sur une
       ligne), plus la place du chevron : scrollWidth ne descend jamais sous
       la largeur de la colonne, il ne dirait pas qu'un nom est court. */
    zone.classList.add('mesure-nom');
    var largeurs = [], plage = document.createRange();
    var marge = parseFloat(getComputedStyle(noms[0]).paddingLeft) || 0;
    for (var i = 0; i < noms.length; i++) {
      plage.selectNodeContents(noms[i]);
      largeurs.push(plage.getBoundingClientRect().width + marge);
    }
    zone.classList.remove('mesure-nom');
    var sansJalon = zone.classList.contains('sans-jalon'), base = sansJalon ? 124 : 118;
    /* Débrief 24 : « des fois la ligne ECP est trop large ». La colonne du
       nom ne s'élargit plus que jusqu'à 240 px (moins sur un écran étroit,
       pour que la barre garde au moins 220 px). Un nom plus long que ça ne
       la pousse pas : il passe au-dessus de sa barre, sur toute la largeur,
       en entier — les barres restent larges et alignées sous leur en-tête. */
    var fixes = (sansJalon ? 62 : 58) + 140 + 160 + 4 * 14;
    var plafond = Math.max(base, Math.floor(Math.min(240, zone.clientWidth * 0.22, zone.clientWidth - fixes - 220)));
    var large = 0;
    largeurs.forEach(function (l, k) {
      if (l > plafond) noms[k].parentNode.classList.add('nom-dessus');
      else large = Math.max(large, l);
    });
    if (large <= base) return;
    zone.style.setProperty('--col-nom', Math.min(plafond, Math.ceil(large) + 2) + 'px');
  }

  /* L'ordre du sélecteur est celui que donne la source : quand la liste est
     fixée à la main, c'est l'ordre demandé qui compte, pas celui de la feuille. */
  /* Le sélecteur est rangé par ordre alphabétique : on y cherche un nom, pas
     une position dans la feuille. */
  /* Deux dimensions viennent de la même colonne de date et se confondent
     facilement : on dit laquelle répond à quelle question. */
  function NOTE_DIM(dim) {
    var titreDate = CLE_DATE && PAR_CLE[CLE_DATE] ? PAR_CLE[CLE_DATE].titre.toLowerCase() : 'date de création';
    if (dim === '_anciennete') {
      return 'Depuis combien de temps le plan existe, en quatre tranches calculées sur « ' + titreDate +
        ' ». Répond à « qu\u2019est-ce qui traîne depuis longtemps ? ».';
    }
    if (dim === '_mois') {
      return 'Le mois où le plan a été créé, un groupe par mois, rangés dans l\u2019ordre du temps. ' +
        'Répond à « de quelle vague vient ce lot ? » \u2014 l\u2019ancienneté, elle, regroupe en tranches.';
    }
    if (dim === 'avancement') {
      return 'La valeur brute de la colonne d\u2019avancement, telle qu\u2019elle est saisie : ' +
        'd\u2019un coup d\u2019\u0153il, toutes les façons de l\u2019écrire, donc les saisies qui divergent.';
    }
    return '';
  }

  /* DIMENSIONS et TITRE_DIM sont dérivés de la source dans chargerSource(). */
  function remplirDims() {
    $('dim-critique').innerHTML = DIMENSIONS.map(function (d) {
      return '\x3Coption value="' + d.cle + '">' + ech(d.titre) + '\x3C/option>';
    }).join('');
    $('dim-critique').value = vue.dimCritique;
    ajusterChoixDim();
  }

  /* Le menu de la dimension est un mot du titre : sa largeur suit le mot
     choisi, pas le plus long de la liste — sinon « par ATA » traînerait un
     grand blanc avant son chevron. Débrief 21 : plus de mesure au canevas
     (« par ECP, la flèche est cachée ») ; on recopie seulement le mot choisi
     dans sa copie invisible, et la feuille de style fait le reste
     (.choix-titre-cadre) : la largeur suit la police réellement affichée,
     avant comme après son chargement. Le cadre se cache avec le menu. */
  function ajusterChoixDim() {
    var sel = $('dim-critique'), o = sel.options[sel.selectedIndex], mesure = $('dim-critique-mesure');
    sel.style.width = '';
    var mot = o ? o.text : '';
    if (mesure.textContent !== mot) mesure.textContent = mot;
    var cadre = $('dim-critique-cadre');
    if (cadre.hidden !== sel.hidden) cadre.hidden = sel.hidden;
  }

  /* ============================================================ TABLEAU */
  /* La colonne suivie — l'avancement FWD, ou le concept harnais — se range
     juste après la référence et reste figée avec elle : l'état d'un plan se
     lit sans faire défiler cent trente colonnes. C'est la seule entorse à
     l'ordre de la feuille, dans les deux vues. */
  function visibles() {
    var cles = vue.ordre.filter(function (k) { return !vue.cachees[k] && !(VIDES[k] && !vue.videsMontrees); });
    var iSuivie = cles.indexOf(CLE_SUIVIE), iRef = -1;
    for (var i = 0; i < cles.length; i++) if (PAR_CLE[cles[i]] && PAR_CLE[cles[i]].fige) { iRef = i; break; }
    if (iSuivie !== -1 && iRef !== -1 && iSuivie !== iRef + 1) {
      cles.splice(iSuivie, 1);
      if (iSuivie < iRef) iRef--;
      cles.splice(iRef + 1, 0, CLE_SUIVIE);
    }
    return cles.map(function (k) { return PAR_CLE[k]; });
  }
  /* Combien de colonnes restent collées à gauche : tout ce qui précède la
     référence, elle, et la colonne suivie qui la suit. Le calcul suit
     l'ordre affiché au lieu de le supposer. */
  function nbFigees(cols) {
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].fige) return i + 1 + (cols[i + 1] && cols[i + 1].cle === CLE_SUIVIE ? 1 : 0);
    }
    return 0;
  }
  /* Une colonne qui ne se déplace pas : la référence et la colonne suivie. */
  function colonneFixe(c) { return !!c.fige || c.cle === CLE_SUIVIE; }
  function classeFige(i, n) {
    if (i >= n) return '';
    return i === n - 1 ? 'col-fige fige-fin' : 'col-fige';
  }
  /* Débrief 27, lot D (P-F15) : les colonnes vides de bout en bout dans la
     sélection — lignes grisées comprises — sont masquées, et la rangée
     d'outils le dit (« 4 colonnes vides masquées · Afficher »). Jamais la
     référence ni la colonne suivie, ni une colonne triée ou filtrée : on ne
     retire pas ce qu'on vient de toucher. Une sélection vide ne masque rien.
     VIDES compte aussi quand elles sont montrées : le bouton dit combien. */
  var VIDES = {};
  function majColonnesVides(liste) {
    VIDES = {};
    var rangs = vue.lotLa ? [] : liste.concat(anciensDuTableau());
    if (!rangs.length) return;
    vue.ordre.forEach(function (k) {
      var c = PAR_CLE[k];
      if (!c || vue.cachees[k] || colonneFixe(c) || vue.filtres[k] || vue.tri.cle === k) return;
      for (var i = 0; i < rangs.length; i++) {
        var v = rangs[i][k];
        if (v != null && String(v).trim() !== '') return;
      }
      VIDES[k] = true;
    });
  }
  function rendreColonnesVides() {
    var zone = $('colonnes-vides');
    if (!zone) return;
    var cles = vue.ordre.filter(function (k) { return VIDES[k]; });
    var n = cles.length;
    zone.hidden = !n || vue.base !== 'ici';
    if (zone.hidden) { zone.innerHTML = ''; return; }
    var noms = cles.map(function (k) { return PAR_CLE[k].titre; }).join(', ');
    var pl = n > 1;
    zone.innerHTML = vue.videsMontrees
      ? '\x3Cspan>' + nb(n) + (pl ? ' colonnes vides affichées' : ' colonne vide affichée') + '\x3C/span>' +
        '\x3Cbutton type="button" data-vides="masquer" title="' + ech('Masquer : ' + noms) + '">Masquer\x3C/button>'
      : '\x3Cspan>' + nb(n) + (pl ? ' colonnes vides masquées' : ' colonne vide masquée') +
        '\x3Cspan class="masque"> (' + ech(noms) + ')\x3C/span>\x3C/span>' +
        '\x3Cbutton type="button" data-vides="afficher" title="' + ech('Afficher : ' + noms) + '">Afficher\x3C/button>';
  }
  /* La rangée des filtres de colonne. Débrief 28 : elle est toujours là
     (Nathan) ; débrief 29 : le bouton qui la pliait est supprimé. */
  function filtresColonneVisibles() {
    return true;
  }
  /* Le libellé d'un groupe d'en-têtes : celui de la colonne suivie dit ce
     qu'il est (« Avancement (GATES · HDK AA 011) » — « HDK AA 011 » seul ne
     parlait à personne) ; un groupe sans nom, ou la suite d'un groupe coupé
     par le bloc figé, garde un mot pour les lecteurs d'écran (X-A11). */
  function libelleGroupeTete(g, nomSuivi) {
    var nom = g.suivie || (nomSuivi && g.nom === nomSuivi) ? 'Avancement (GATES' + (g.nom ? ' \u00b7 ' + g.nom : '') + ')' : g.nom;
    if (g.suite) return '\x3Cspan class="masque">' + ech(nom ? 'Suite de « ' + nom + ' »' : 'Autres colonnes') + '\x3C/span>';
    return nom ? ech(nom) : '\x3Cspan class="masque">Autres colonnes\x3C/span>';
  }
  function rendreEntetes() {
    var cols = visibles();
    var nFige = nbFigees(cols);
    var suivie = PAR_CLE[CLE_SUIVIE], nomSuivi = suivie ? String(suivie.groupe || '') : '';
    /* L'arrêt de tabulation des en-têtes : le dernier qu'on a touché, sinon
       le premier. */
    var repere = cols.some(function (c) { return c.cle === vue.repereTete; }) ? vue.repereTete : (cols[0] ? cols[0].cle : '');
    /* Un groupe a cheval sur la limite du bloc fige est coupe en deux : la
       moitie collee garde le libelle, la suite le laisse vide pour que la
       bande se lise d'un trait. */
    var groupes = [];
    cols.forEach(function (c, i) {
      var colle = i < nFige;
      var d = groupes[groupes.length - 1];
      if (d && d.nom === c.groupe && d.fige === colle) d.n++;
      else groupes.push(d = { nom: c.groupe, n: 1, fige: colle, debut: i, suite: !!(d && d.nom === c.groupe) });
      if (c.cle === CLE_SUIVIE) d.suivie = true;

       prises dans des groupes différents — sa rangée de groupes répétait
       « Informations principales » trois fois, coupée par les autres. Elle
       n'a plus de rangée de groupes ; « Toutes les colonnes » garde la
       sienne, telle quelle. */
    var sansGroupes = vue.vueTable === 'essentielle';
    var html = (sansGroupes ? '' : '\x3Ctr class="groupes">' + groupes.map(function (g) {
      var cl = g.fige ? (g.debut + g.n === nFige ? 'col-fige fige-fin' : 'col-fige') : '';
      return '\x3Cth colspan="' + g.n + '" data-debut="' + g.debut + '"' + (cl ? ' class="' + cl + '"' : '') +
        '>' + libelleGroupeTete(g, nomSuivi) + '\x3C/th>';
    }).join('') + '\x3C/tr>') + '\x3Ctr class="titres">' + cols.map(function (c, i) {
      var actif = vue.tri.cle === c.cle;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (vue.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      /* Débrief 27 (2.5.7) : la poignée est un bouton — un clic ouvre « ← à
         gauche / à droite → », pour qui ne peut pas glisser. Hors de la
         tabulation : au clavier, Alt + flèches sur l'en-tête. */
      var poignee = colonneFixe(c) ? '' : '\x3Cbutton type="button" class="poignee" data-menu-col="' + ech(c.cle) + '" tabindex="-1" aria-haspopup="true"' +
        ' aria-label="' + ech('Déplacer la colonne ' + c.titre) + '" title="Glisser, ou cliquer pour déplacer la colonne">\x3Csvg width="7" height="12" viewBox="0 0 7 12" fill="currentColor" aria-hidden="true">' +
        '\x3Ccircle cx="1.6" cy="2" r="1.1"/>\x3Ccircle cx="5.4" cy="2" r="1.1"/>\x3Ccircle cx="1.6" cy="6" r="1.1"/>' +
        '\x3Ccircle cx="5.4" cy="6" r="1.1"/>\x3Ccircle cx="1.6" cy="10" r="1.1"/>\x3Ccircle cx="5.4" cy="10" r="1.1"/>\x3C/svg>\x3C/button>';
      var cl = (classeFige(i, nFige) + (c.cle === 'reference' ? ' col-ref' : '')).trim();
      return '\x3Cth scope="col" data-cle="' + c.cle + '"' + (cl ? ' class="' + cl + '"' : '') +
        (colonneFixe(c) ? '' : ' draggable="true"') +
        ' aria-sort="' + (actif ? (vue.tri.asc ? 'ascending' : 'descending') : 'none') + '">' +
        poignee + '\x3Cbutton type="button" data-tri="' + c.cle + '" tabindex="' + (c.cle === repere ? 0 : -1) + '">' + ech(c.titre) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="filtres"' + (filtresColonneVisibles() ? '' : ' hidden') + '>' + cols.map(function (c, i) {
      var val = vue.filtres[c.cle] || '';
      var cl = (classeFige(i, nFige) + (c.cle === 'reference' ? ' col-ref' : '')).trim();
      return '\x3Cth' + (cl ? ' class="' + cl + '"' : '') + '>\x3Cinput type="text" data-filtre="' + c.cle + '" value="' + ech(val) +
        '" placeholder="filtrer" data-actif="' + (!!val) + '" aria-label="Filtrer ' + ech(c.titre) + '">\x3C/th>';
    }).join('') + '\x3C/tr>';
    $('tete-tableau').innerHTML = html;
    ajusterSticky();
  }
  /* Un tableau encore hors de l'écran n'est pas mis en page (content-
     visibility) : le mesurer forcerait tout le travail qu'on voulait
     s'épargner. On le mesure quand il paraît. */
  /* L'état vient du navigateur lui-même (contentvisibilityautostatechange) :
     au tout premier rendu, avant qu'il ait tranché, le tableau compte comme
     hors de l'écran. Sans content-visibility, il est toujours « à l'écran ». */
  /* Débrief 27 (X-A11) : le tableau n'a plus de content-visibility, sauf
     très lourd (data-lourd, voir marquerLourd) — alors seulement il peut
     être « hors de l'écran » pour ces mesures. */
  var CV_AUTO = !!(window.CSS && CSS.supports && CSS.supports('content-visibility', 'auto'));
  var cadresVisibles = {};
  function tableauHorsEcran(cadre) {
    return CV_AUTO && !!cadre && cadre.hasAttribute('data-lourd') && !cadresVisibles[cadre.id];
  }
  /* Le seuil : 20 000 cellules dessinées (près de 150 lignes de l'extract
     entier). En dessous — la première tranche, toujours —, les lignes
     restent dans l'arbre d'accessibilité même hors de l'écran (X-A11). */
  var SEUIL_LOURD = 20000;
  function marquerLourd() {
    var t = TRANCHES['corps-tableau'], cadre = $('cadre-tableau');
    if (!cadre) return;
    var lourd = !!t && t.montrees * t.nbCols > SEUIL_LOURD;
    if (lourd === cadre.hasAttribute('data-lourd')) return;
    if (lourd) { delete cadresVisibles['cadre-tableau']; cadre.setAttribute('data-lourd', ''); }
    else cadre.removeAttribute('data-lourd');
  }
  function ajusterSticky() { aMesurer('sticky'); }
  /* Les cellules figées du corps lisent leur décalage dans une variable du
     tableau (--fige-0, --fige-1…) : une seule écriture, au lieu d'une par
     cellule et par ligne à chaque tranche (débrief 23). Les en-têtes, peu
     nombreux, gardent le leur. On mesure tout d'abord, on pose ensuite. */
  function styleFige(i, n) { return i < n ? ' style="left:var(--fige-' + i + ',0px)"' : ''; }
  function poserColonnesFigees() {
    if (tableauHorsEcran($('cadre-tableau'))) return;
    /* Débrief 29 : la vue essentielle n'a pas de rangée de groupes (hg = 0). */
    var tete = $('tete-tableau');
    var g = tete.querySelector('tr.groupes'), t = tete.querySelector('tr.titres'), f = tete.querySelector('tr.filtres');
    if (!t || !f) return;
    var hg = g ? g.getBoundingClientRect().height : 0;
    var ht = t.getBoundingClientRect().height;
    /* On mesure les colonnes collees et on les pose les unes apres les
       autres. Sans ce cumul, la deuxieme viendrait recouvrir la premiere. */
    var tetes = t.querySelectorAll('th');
    var gauche = [], cumul = 0;
    for (var i = 0; i < tetes.length; i++) {
      if (!tetes[i].classList.contains('col-fige')) break;
      gauche.push(cumul);
      cumul += tetes[i].getBoundingClientRect().width;
    }
    t.querySelectorAll('th').forEach(function (th) { th.style.top = hg + 'px'; });
    f.querySelectorAll('th').forEach(function (th) { th.style.top = (hg + ht) + 'px'; });
    if (!gauche.length) return;
    if (g) g.querySelectorAll('th.col-fige').forEach(function (th) {
      var d = parseInt(th.dataset.debut, 10) || 0;
      th.style.left = (gauche[d] || 0) + 'px';
    });
    [t, f].forEach(function (ligne) {
      var n = 0;
      ligne.querySelectorAll('.col-fige').forEach(function (c) {
        c.style.left = (gauche[n] == null ? 0 : gauche[n]) + 'px';
        n++;
      });
    });
    var corps = $('corps-tableau');
    gauche.forEach(function (x, k) { corps.style.setProperty('--fige-' + k, x + 'px'); });
    /* Débrief 27 (X-A3) : la hauteur des en-têtes collés et la largeur des
       colonnes figées (au téléphone, la seule référence) deviennent le
       scroll-padding du cadre — une case amenée au clavier ne passe plus
       dessous. */
    var ref = t.querySelector('th.col-ref');
    var etroit = window.matchMedia && window.matchMedia('(max-width: 720px)').matches;
    var defile = $('defile');
    defile.style.setProperty('--haut-entetes', Math.round(hg + ht + f.getBoundingClientRect().height) + 'px');
    defile.style.setProperty('--larg-figees', Math.round(etroit ? (ref ? ref.getBoundingClientRect().width : 0) : cumul) + 'px');
  }
  /* Un tableau de dizaines de milliers de cellules ne se dessine pas d'un
     bloc : c'était l'essentiel du temps d'ouverture sur un gros extract. Au-
     delà d'un budget de cellules, les lignes suivantes s'ajoutent quand on
     approche du bas du cadre, ou d'un clic sur « N lignes de plus ». Les
     filtres, les tris et les comptes portent toujours sur toutes les lignes. */
  /* Débrief 18, « le site est très long à charger » : la mise en page des
     292 premières lignes de 136 colonnes (40 000 cellules) prenait l'essentiel
     de l'ouverture — 3 s sur un poste rapide, une vingtaine sur un poste
     chargé. 6 000 cellules, soit 60 lignes de l'extract entier, se posent en
     un clin d'œil ; la suite vient en descendant. */
  var BUDGET_CELLULES = typeof window.SUIVI_FWD_BUDGET === 'number' && window.SUIVI_FWD_BUDGET > 0 ? window.SUIVI_FWD_BUDGET : 3000;
  /* Débrief 23 : à l'ouverture, le tableau pose d'abord vingt lignes — un
     instant —, et complète sa première tranche dès que la page a fini de
     s'afficher : c'est le même tableau qu'avant, en deux fois. Un budget
     fixé par un test garde la tranche entière d'un coup. */
  var PREMIERE_TRANCHE = typeof window.SUIVI_FWD_BUDGET === 'number' ? 0 : 20;
  /* Débrief 27, lot D (M4) : « Tout effacer » figeait la page deux secondes
     (huit à neuf sur un téléphone moyen) — chaque rendu remettait en page des
     milliers de cellules — et le tableau n'est plus épargné hors de l'écran
     (content-visibility retiré, X-A11). Une tranche tient maintenant entre
     25 et 60 lignes, autour de 3 000 cellules : 25 lignes de l'extract
     entier, 60 de la vue essentielle ; la suite vient en descendant dans le
     cadre. Au doigt et
     sur un écran étroit, le tableau prend sa hauteur dans la page (D10) :
     30 lignes, puis un bouton « Afficher 30 lignes de plus » — la page
     continue de défiler jusqu'à la comparaison au lieu de s'allonger sans
     fin sous le pouce. Un budget fixé par un test garde l'ancienne règle
     (tout d'un coup avec un budget immense). */
  var TABLEAU_A_LA_PAGE = window.matchMedia ? window.matchMedia('(max-width: 720px), (pointer: coarse)') : null;
  function tableauALaPage() { return !!(TABLEAU_A_LA_PAGE && TABLEAU_A_LA_PAGE.matches); }
  function pasDeTranche(nbCols) {
    var parBudget = Math.floor(BUDGET_CELLULES / Math.max(1, nbCols));
    if (typeof window.SUIVI_FWD_BUDGET === 'number') return Math.max(60, parBudget);
    if (tableauALaPage()) return 30;

  var TRANCHES = {};
  function trancheHtml(t, combien) {

    return h + (reste > 0
      ? '\x3Ctr class="ligne-suite">\x3Ctd colspan="' + t.nbCols + '">\x3Cbutton type="button" class="lien-doux" data-suite="' + t.id + '">' +
        (tableauALaPage()
          ? 'Afficher ' + nb(suivant) + (suivant > 1 ? ' lignes de plus' : ' ligne de plus') + ' · ' + nb(reste) + (reste > 1 ? ' restantes' : ' restante')
          : nb(reste) + (reste > 1 ? ' lignes de plus' : ' ligne de plus') + ' — descendez, ou cliquez ici') + '\x3C/button>\x3C/td>\x3C/tr>'
      : '');
  }
  function poserTranches(corps, total, nbCols, ligneHtml, apres, premiere) {
    var t = { id: corps.id, total: total, nbCols: Math.max(1, nbCols), montrees: 0, ligneHtml: ligneHtml, apres: apres,
              pas: pasDeTranche(nbCols) };

    if (apres) apres();

  }
  /* La première tranche complétée — les lignes que l'ouverture avait

  function completerPremiereTranche(t) {

    var suite = corps.querySelector('tr.ligne-suite');
    if (suite) suite.parentNode.removeChild(suite);

    if (t.apres) t.apres();
  }
  function trancheSuivante(idCorps) {
    var t = TRANCHES[idCorps], corps = $(idCorps);
