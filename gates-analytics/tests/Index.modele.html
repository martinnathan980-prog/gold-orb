<!-- Les données sont posées dans la page au moment où le modèle est évalué :
     pas d'écran de chargement, pas d'aller-retour. -->
<script>
  window.SUIVI_FWD_DONNEES = <?!= donneesJSONPourPage() ?>;

  /* Pont vers le classeur : la page demande le paquet d'un autre contrat sans
     se recharger. Le rappel reçoit le paquet, ou null si le classeur n'a pas
     répondu — la page garde alors le contrat courant et le dit. */
  window.SUIVI_FWD_API = {
    chargerContrat: function (id, cb) {
      try {
        google.script.run
          .withSuccessHandler(cb)
          .withFailureHandler(function (e) {
            console.error('Contrat non chargé :', e && e.message);
            cb(null);
          })
          .getDonneesCompactes(id);
      } catch (e) { cb(null); /* page ouverte hors classeur : sans conséquence */ }
    }
  };
</script>
