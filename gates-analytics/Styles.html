   d'au-dessus) mais pas à droite : il ne dépasse plus du bord. */
#zone-journal.journal-serre .compte-passage { margin-right: 0; }
@media (max-width: 720px) { .journal-tete .compte-passage { margin-right: 0; } }
@media (max-width: 720px) {
  #zone-journal.journal-grille { display: block; }
  .journal-grille .journal-semaine { display: block; }
  .journal-grille .journal-tete { display: flex; flex-wrap: wrap; column-gap: 12px; }
  .journal-grille .journal-tete .resume { display: flex; flex-wrap: wrap; }
  .journal-tete .case-vide { display: none; }
  .journal-grille .journal-entetes { display: none; }
  .journal-grille .mot-case { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
}
.journal-tete .chevron { color: var(--encre-3); transition: transform .12s; flex: none; }
.journal-plier[aria-expanded="true"] .chevron { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .journal-tete .chevron { transition: none; } }
.journal-liste { margin: 0 0 12px; padding: 0 0 0 78px; list-style: none; }
@media (max-width: 720px) { .journal-liste { padding-left: 0; } }
/* Deux colonnes alignées : la référence, puis où elle va. Le regard descend
   une colonne au lieu de chercher la flèche au milieu du texte. */
.journal-ligne {
  display: grid; grid-template-columns: 150px minmax(0, 340px);
  align-items: baseline; gap: 12px; width: 100%;
  background: none; border: none; font: inherit; color: inherit;
  padding: 6px 6px; text-align: left; cursor: pointer; border-radius: 3px;
}
/* Débrief 24 (relecture) : sous 720 px aussi, la flèche tombe au même
   endroit sur toutes les lignes — les mêmes deux colonnes qu'au bureau
   (avec « 1fr auto », chaque ligne avait la largeur de ses mots). Sous
   560 px, « avant → après » passe sous la référence, sur toute la ligne :
   ses deux moitiés gardent la place d'un PWD_IN_PROGRESS en entier. */
@media (max-width: 720px) {
  .journal-ligne { gap: 3px 10px; padding: 8px 4px; }
}
@media (max-width: 560px) {
  .journal-ligne { grid-template-columns: minmax(0, 340px); }
}
.journal-ligne:hover { background: var(--creux); }
.journal-ligne .ref { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
/* Une réémission : l'ancienne référence au-dessus, effacée, la nouvelle dessous. */
.journal-ligne .ref-indice { display: grid; gap: 1px; }
.journal-ligne .ref-indice .ancienne { color: var(--encre-3); }
.journal-ligne .ref-indice .nouvelle { white-space: nowrap; color: var(--indice); }
/* Un recul : la référence et la flèche en rouge, un liseré à gauche — la
   ligne se voit dans la liste sans qu'il faille lire les états. */
.journal-ligne.recul { box-shadow: inset 2px 0 0 var(--alerte); }
.journal-ligne.recul .ref, .journal-ligne.recul .fleche-etat { color: var(--alerte); }
/* Le passage : l'état de départ s'efface, seule l'arrivée porte la couleur. */
.journal-ligne .vers {
  /* Débrief 24 : deux moitiés égales, quelle que soit la longueur des mots —
     avec 1fr, un « PWD_IN_PROGRESS » élargissait sa moitié et la flèche
     glissait : les lignes n'étaient plus droites. Un mot trop long passe à
     la ligne dans sa moitié au lieu de la pousser. */
  display: grid; grid-template-columns: minmax(0, 1fr) 12px minmax(0, 1fr); align-items: center; gap: 4px;
  font-size: 12px;
}
/* Un mot qui ne tient pas passe à la ligne après un « _ » (sur un écran
   étroit, etiqEtat y glisse une coupure possible), au milieu seulement
   s'il n'en a pas. */
.journal-ligne .vers .etiq-etat { white-space: normal; overflow-wrap: break-word; min-width: 0; }
/* Débrief 28 : les départs en colonne, alignés à gauche comme les arrivées
   (calés contre la flèche, « nouveau » ou « TO_TREAT » semblaient décalés). */
.journal-ligne .vers .etiq-etat.avant { text-align: left; justify-self: start; }
.fleche-etat { color: var(--trait-donnee); text-align: center; }
.etiq-etat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.etiq-etat.avant { color: var(--encre-3); justify-self: end; }
/* La pastille « avant » est pâlie par un voile du fond posé SOUS son liseré
   (deux ombres internes, la première se peint au-dessus) : avec opacity, le
   liseré pâlissait aussi et se perdait — invisible sur le gris de
   FWD_TO_SEIZE. Le fond reste aussi pâle, le liseré garde son encre. */
.etiq-etat.avant .pastille { box-shadow: inset 0 0 0 1px var(--encre-3), inset 0 0 0 5px var(--voile-avant); }
.etiq-etat.apres { color: var(--encre); font-weight: 500; }
/* Les compteurs du résumé sont des boutons, avec leur pastille : un clic
   isole ce passage-là sur toutes les semaines. */
.compte-passage {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent; background: none; padding: 2px 8px; margin: 0 -4px; font: inherit;
  color: inherit; cursor: pointer; border-radius: 999px; white-space: nowrap;
}
.compte-passage .pastille { width: 8px; height: 8px; }
.compte-passage b { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--encre); }
.compte-passage:hover { background: var(--creux); color: var(--encre); }
.compte-passage[aria-pressed="true"] { border-color: var(--filet-fort); background: var(--surface); color: var(--encre); font-weight: 500; }
.journal-tete .resume .doux-compte { display: inline-flex; align-items: center; gap: 6px; color: var(--encre-2); white-space: nowrap; }
.journal-tete .resume .doux-compte b { font-variant-numeric: tabular-nums; font-weight: 500; }
@media (max-width: 480px) { .compte-passage, .journal-tete .resume .doux-compte { white-space: normal; text-align: left; } }

/* La liste des UD d'un groupe, dépliée sous sa ligne : TOUTES les références,
   en deux paquets titrés — ce qui reste à faire d'abord, puis ce qui est
   soldé. Le conteneur du bloc a sa hauteur et son défilement : deux cents
   références se parcourent, elles ne poussent pas le reste de la page. */
.groupe-refs {
  padding: 6px 0 16px 16px; border-left: 2px solid var(--filet);
  margin: 2px 0 8px 14px;
}
.groupe-refs .entete {
  font-size: 12px; color: var(--encre-3); margin-bottom: 4px;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.groupe-refs .sous-groupe, .groupe-refs .sous-arret { margin-top: 10px; }
.groupe-refs .actions-groupe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 12px; }
.groupe-refs .actions-groupe:empty { display: none; }
.groupe-refs .actions-groupe .copier { min-height: 30px; padding: 0 12px; font-size: 13px; }
.groupe-refs .sous-titre, .groupe-refs .titre-arret {
  margin: 0 0 7px;
  display: flex; align-items: center; gap: 7px;
}
.groupe-refs .sous-titre .pastille, .groupe-refs .titre-arret .pastille { width: 8px; height: 8px; }
.groupe-refs .titre-arret { color: var(--cours); }
.groupe-refs .sous-titre .n, .groupe-refs .titre-arret .n {
  font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--encre-3);
}
/* Les références en colonnes régulières : même largeur, alignées de ligne
   en ligne, qu'on parcourt du regard comme une liste. */
.groupe-refs .grille {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 7px;
}
.groupe-refs .grille .jeton-ud { justify-content: flex-start; }
/* Les plans à l'arrêt, en tête du groupe déplié : la puce porte aussi
   « depuis S12 », d'où des colonnes un peu plus larges. */
.groupe-refs .grille-arret {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 6px 7px;
}
.jeton-ud .depuis { margin-left: auto; padding-left: 8px; font: 11px/1.2 "IBM Plex Sans", system-ui, sans-serif; color: var(--cours); }
.jeton-ud {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--filet); background: var(--surface); color: var(--encre-2);
  border-radius: 4px; padding: 3px 9px 3px 8px; font-family: "IBM Plex Mono", monospace;
  font-size: 12px; line-height: 1.3; cursor: pointer; white-space: nowrap;
}
.jeton-ud:hover { border-color: var(--encre-3); color: var(--encre); background: var(--creux); }
/* Un plan à l'arrêt : bord ambre, comme la puce « À surveiller ». */
.jeton-ud.arret { border-color: var(--cours); box-shadow: inset 0 0 0 1px var(--cours); }
.groupe-refs .entete .arret-n { display: inline-flex; align-items: center; gap: 5px; color: var(--cours); }
.groupe-refs .entete .arret-n .pastille { width: 8px; height: 8px; }
.jeton-ud .pastille { width: 7px; height: 7px; margin: 0; flex: none; }
.journal-vide { color: var(--encre-3); font-size: 13px; padding: 14px 2px; }
.journal-grille .journal-vide { grid-column: 1 / -1; }
/* Débrief 27 (D8) : le journal vide est un bloc calme au centre (.etat-vide) ;
   son explication garde la classe journal-vide, au gris secondaire. */
.journal-etat-vide .journal-vide { padding: 0; color: var(--encre-2); }
.journal-tete .case-vide { color: var(--encre-3); padding-left: 5px; }
.journal-plus {
  background: none; border: none; font: inherit; font-size: 13px; color: var(--encre-2);
  cursor: pointer; padding: 5px 2px; text-decoration: underline; text-underline-offset: 3px;
}
.journal-plus:hover { color: var(--encre); }

/* ---------------------------------------------------- Sections */
.bloc { margin-top: 34px; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 13px; }

/* ---------------------------------------------------- Panneaux (débrief 20) */
/* « Ça fait trop fil d'actualité » : chaque grande section devient une
   feuille bornée, posée sur le papier, avec un large blanc entre deux. On la
   reconnaît à sa structure — surtitre numéroté, titre, filet — plus qu'à une
   couleur : la page reste calme, les couleurs restent aux données. */
.page { counter-reset: panneau; }
.panneau {
  background: var(--surface); border: 1px solid var(--panneau-bord); border-radius: 10px;
  box-shadow: var(--panneau-ombre);
  padding: 22px 30px 28px; margin-top: 40px;
  counter-increment: panneau;
}
/* Débrief 21 : « aller encore plus loin pour les séparer ». Plus de blanc
   entre deux panneaux, un liseré de sa teinte en haut de chacun : on voit
   d'un coup d'œil où une étape finit et où la suivante commence.
   Débrief 27 (D6) : un liseré de 2 px (3 avant), seule trace de la teinte
   avec le numéro, son trait et l'entrée du sommaire. */
.panneau:not(.panneau-hors-suite) { border-top: 2px solid var(--accent); }
.panneau.bloc { margin-top: 40px; }
/* La vue d'ensemble s'ouvre à la demande : elle n'entre pas dans la suite
   numérotée, et elle colle au bandeau qui l'ouvre. */
.panneau.panneau-hors-suite { counter-increment: none; margin-top: 16px; }
@media (max-width: 720px) {
  .panneau { padding: 16px 14px 20px; margin-top: 26px; border-radius: 8px; }
  .panneau.bloc { margin-top: 26px; }
}
/* La teinte du panneau (voir :root) : la classe remplace l'accent ardoise
   pour tout ce qui le porte dans le panneau — numéro, amorce du filet, mot
   à choisir — et pour son entrée du sommaire. Sans classe, l'ardoise. */
.teinte-une { --accent: var(--t-une); }
.teinte-temps { --accent: var(--t-temps); }
.teinte-journal { --accent: var(--t-journal); }
.teinte-groupe { --accent: var(--t-groupe); --accent-trait: var(--t-groupe-trait); --accent-voile: var(--t-groupe-voile); --chevron-accent: var(--chevron-groupe); }
.teinte-plans { --accent: var(--t-plans); }
/* La tête du panneau (débrief 21) : son surtitre et son titre sur un fond
   à part, d'un bord à l'autre du panneau, fermé d'un filet. Le contenu
   commence dessous, sur le blanc. Débrief 27 (D6) : la même tête neutre
   pour tous les panneaux. Les rayons suivent l'intérieur du cadre (1 px de
   côté, 2 px de liseré en haut). */
.panneau-tete {
  margin: -22px -30px 20px; padding: 16px 30px 17px;
  background: var(--tete-neutre);
  border-bottom: 1px solid var(--tete-neutre-filet);
  border-radius: 9px 9px 0 0 / 8px 8px 0 0;
}
.panneau-tete > .surtitre { margin-bottom: 9px; }
.panneau-tete > .section-tete, .panneau-tete > .avancement-ligne { margin-bottom: 0; }
.panneau-tete .surtitre::after {
  background: linear-gradient(var(--accent), var(--accent)) left center / 24px 2px no-repeat,
              linear-gradient(var(--tete-neutre-filet), var(--tete-neutre-filet)) left center / 100% 1px no-repeat;
}
/* Sur la tête teintée, le survol du mot à choisir s'éclaire en blanc : son
   voile habituel s'y confondrait avec le fond. */
.panneau-tete select.choix-titre:hover, .panneau-tete select.choix-titre:focus-visible { background-color: var(--tete-survol); }
@media (max-width: 720px) {
  .panneau-tete { margin: -16px -14px 16px; padding: 12px 14px 13px; border-radius: 7px 7px 0 0 / 6px 6px 0 0; }
}
@media print { .panneau-tete { background: none; } }
/* Le surtitre : « 01 · SYNTHÈSE », en petites capitales espacées, le numéro
   dans la teinte du panneau, puis un filet qui court jusqu'au bord — ses
   24 premiers pixels, un peu plus épais, dans la teinte. C'est lui qu'on
   repère en faisant défiler. Débrief 27 (D4, D6) : le « kicker » de la page
   (Mono 11/500, capitales, .14em) ; son texte est celui de l'entrée du
   sommaire, mot pour mot (« 04 · Par ATA » suit le regroupement choisi). */
.surtitre {
  display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; line-height: 1.4;
  letter-spacing: .14em; text-transform: uppercase; color: var(--encre-2);
}
.surtitre::before {
  content: counter(panneau, decimal-leading-zero) "\00a0·";
  color: var(--accent); letter-spacing: .06em; flex: none;
}
.panneau-hors-suite .surtitre::before { content: "—"; }
.surtitre::after {
  content: ""; flex: 1 1 auto; height: 2px; min-width: 24px;
  background: linear-gradient(var(--accent), var(--accent)) left center / 24px 2px no-repeat,
              linear-gradient(var(--filet), var(--filet)) left center / 100% 1px no-repeat;
}
.panneau > .section-tete { margin-bottom: 16px; }
.panneau-tete + .ligne-filtres, .panneau-tete + .feuille { margin-top: 0; }
.panneau .cadre-tableau { border-radius: 4px; }

/* ---------------------------------------------------- Sommaire (débrief 20) */
/* Sous le titre, une ligne d'index dans la police des surtitres : chaque
   panneau, son numéro dans sa teinte. Dès qu'on descend, il reste collé en
   haut de l'écran, d'un filet souligné ; le panneau qu'on lit est écrit à
   l'encre et souligné de sa teinte. Débrief 27 (lot H) : le bandeau des
   filtres actifs colle juste dessous (--h-sommaire, posé par le script). */
/* Débrief 29 : une grille de trois colonnes — la liste au centre de la
   page quelle que soit la largeur des outils (le ⚙ qui s'efface, la marque
   collée), les outils calés au bord du contenu. Au-dessus du bandeau des
   filtres (z-index 31 contre 30) : la liste des plans trouvés et les bulles
   des icônes passaient dessous. Les deux barres ne se recouvrent jamais
   autrement. */
.sommaire {
  position: sticky; top: 0; z-index: 31;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(max-content, 1fr); column-gap: 12px;
  align-items: center; min-width: 0; margin-top: -10px;
  background: var(--papier); border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.sommaire[data-colle="true"] { border-bottom-color: var(--filet-fort); }
.sommaire-liste {
  grid-column: 2;
  list-style: none; margin: 0; padding: 0 2px; display: flex; gap: 0 28px; min-width: 0;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain;
  counter-reset: chapitre;
}
.sommaire-liste::-webkit-scrollbar { display: none; }
/* Ce qui dépasse à droite se devine par un fondu, comme les pastilles — à
   toute largeur : la barre de défilement est cachée, et un nom de dimension
   long (« Par Classification calculée… ») pousse « Plans » hors de la ligne
   bien au-delà du téléphone (relecture du débrief 20 : à 768 px, rien ne le
   disait). Le script pose la classe tant qu'il reste à faire défiler. */
.sommaire-liste.deborde-droite { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
/* Débrief 29 : et à gauche, une fois la liste défilée (au téléphone, elle
   se cale sur la section lue) — un nom coupé au bord se devine aussi. */
.sommaire-liste.deborde-gauche { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.sommaire-liste.deborde-gauche.deborde-droite {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
}
/* Un panneau absent ne compte pas ([hidden] vaut display: none, hors du
   compteur) : les numéros restent ceux des panneaux. */
.sommaire-liste li { counter-increment: chapitre; flex: none; }
.sommaire a {
  display: inline-flex; align-items: baseline; white-space: nowrap;
  padding: 11px 1px 9px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  font: 500 11px/1.4 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase;
  color: var(--encre-2); text-decoration: none;
  transition: color .15s, border-color .15s;
}
.sommaire a::before {
  content: counter(chapitre, decimal-leading-zero); margin-right: 8px;
  color: var(--accent); letter-spacing: .04em; font-variant-numeric: tabular-nums;
}
.sommaire a:hover { color: var(--encre); }
.sommaire a:focus-visible { outline-offset: -2px; }
.sommaire a[aria-current] { color: var(--encre); border-bottom-color: var(--accent); }
/* Débrief 27 (lot H, P-F12) : un panneau absent pour ce contrat (pas de
   base SEE, concept harnais…) garde son entrée, grisée : un clic ou Entrée
   dit pourquoi au lieu de mener nulle part. */
.sommaire li[data-absent] a, .sommaire li[data-absent] a::before { color: var(--encre-3); }
.sommaire li[data-absent] a { cursor: help; }
.sommaire li[data-absent] a:hover { color: var(--encre-2); }
/* La raison d'une commande ou d'une entrée indisponible, montrée au clic,
   au toucher ou au clavier (D9 : jamais au seul survol), dite aussi aux
   lecteurs d'écran. */
.raison-indispo {
  position: fixed; z-index: 70; max-width: min(320px, calc(100vw - 32px)); padding: 8px 12px;
  border: 1px solid var(--releve-bord); border-radius: 6px; background: var(--releve); color: var(--encre);
  box-shadow: var(--flottant-ombre); font-size: 13px; line-height: 1.45; text-align: left;
}
.raison-indispo[hidden] { display: none; }
/* Collé en haut, le nom de la page et du contrat se rappellent à gauche —
   posés par-dessus, sans rien pousser. Seulement quand la place est là. */
.sommaire-marque {
  position: absolute; left: var(--retrait-panneau); top: 50%; transform: translateY(-50%);
  font: 400 16px Newsreader, Georgia, serif; color: var(--encre); white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sommaire-contrat { margin-left: 8px; font: 500 12px "IBM Plex Mono", monospace; color: var(--encre-2); }
.sommaire-contrat:empty { display: none; }
.sommaire[data-colle="true"] .sommaire-marque { opacity: 1; }
@media (max-width: 1180px) { .sommaire-marque { display: none; } }
@media (max-width: 720px) {
  .sommaire { margin-top: -6px; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .sommaire-liste { grid-column: 1; gap: 0 20px; margin: 0; padding: 0; }
}
/* Débrief 29 : au téléphone, trois sections se lisent à côté des icônes —
   des noms un peu moins espacés, des icônes de 28 px serrées (leur zone de
   toucher reste de 44 px, voir pointer: coarse). */
@media (max-width: 480px) {
  .sommaire-liste { gap: 0 12px; }
  .sommaire-liste a { letter-spacing: .06em; }
  .sommaire a::before { margin-right: 6px; }
  .sommaire .outils-page { gap: 2px; }
  .sommaire .outil-page, .sommaire .cherche-plan-ouvrir { width: 28px; height: 28px; }
  .sommaire .outil-page svg { width: 15px; height: 15px; }
}
/* Débrief 29 : un contrat ou un classeur vide n'a pas de sections, mais
   garde ses outils — Vue d'ensemble (les autres contrats), Aide,
   Administration. Le sommaire ne montre plus qu'eux. */
body[data-vide="true"] .sommaire-liste, body[data-vide="true"] .cherche-plan { display: none; }
@media (prefers-reduced-motion: reduce) { .sommaire, .sommaire a, .sommaire-marque { transition: none; } }
@media print { .sommaire { display: none; } }
/* Un saut vers un panneau — ou tout ce que la page amène à l'écran —
   s'arrête sous le sommaire collé, pas derrière lui (--bas-sommaire : sa
   hauteur et celle des filtres actifs, posée par le script). */
html { scroll-padding-top: calc(var(--bas-sommaire, 40px) + 14px); }
/* Débrief 29 : un élément du sommaire ou des filtres collés est toujours à
   l'écran ; sans cela Chrome recentre la page à chaque Tab (il le croyait
   caché sous la marge du haut, où il vit). */
.sommaire a, .sommaire button, .sommaire input, .filtres-actifs button { scroll-margin-top: calc(-1 * (var(--bas-sommaire, 40px) + 14px)); }
/* Chrome n'en tient compte tout à fait que pour les liens (dans la bande
   qui défile) : pour les boutons et le champ, le script garde aussi la page
   à sa place (voir « Le focus dans les barres collées »). */

/* Le mot qu'on change dans le titre : « Avancement FWD par [ATA ▾] ». Le
   menu prend la police du titre, l'accent, un soulignement fin et un
   chevron : on voit que c'est un choix sans qu'il fasse bouton. Un nom long
   passe à la ligne, coupé au bord plutôt que de déborder.
   Débrief 21 : « par ECP, la flèche est cachée par ECP ». La largeur venait
   d'une mesure du texte au canevas, prise parfois avant l'arrivée de la
   police du titre, et sans sa taille optique : un mot large comme « ECP »
   dépassait sur le chevron. Plus de mesure : le menu est posé dans une
   petite grille, par-dessus une copie invisible du mot choisi, écrite dans
   la même police et avec la même marge à droite pour le chevron. La grille
   prend la largeur de cette copie, le menu la remplit : quelle que soit la
   police du moment, le mot finit avant la place du chevron. */
.titre-choix { min-width: 0; max-width: 100%; font-family: Newsreader, Georgia, serif; font-size: 24px; line-height: 1.3; }
.titre-choix h2 { display: inline; font-size: inherit; line-height: inherit; }
.choix-titre-cadre {
  display: inline-grid; grid-template-columns: minmax(0, max-content);
  max-width: 100%; vertical-align: baseline;
}
.choix-titre-cadre > select, .choix-titre-mesure { grid-area: 1 / 1; }
/* La copie : même police, même marge (plus 2 px de jeu pour l'arrondi des
   mesures), aucune hauteur ni couleur — elle ne fait que donner la largeur. */
.choix-titre-mesure {
  font: inherit; white-space: pre; padding: 0 30px 0 4px;
  height: 0; overflow: hidden; visibility: hidden;
}
select.choix-titre {
  appearance: none; -webkit-appearance: none;
  /* Largeur nulle pour la grille, puis toute la case : un menu compte
     d'ordinaire la largeur de sa plus longue option ; ici, seule la copie
     du mot choisi décide. */
  font: inherit; color: var(--accent); width: 0; min-width: 100%; max-width: 100%; vertical-align: baseline;
  border: none; border-radius: 3px; margin: 0; padding: 0 28px 0 4px;
  background: var(--chevron-accent) no-repeat right 7px center / 12px 12px;
  box-shadow: inset 0 -1.5px 0 var(--accent-trait);
  text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer;
  transition: background-color .15s, box-shadow .15s;
}
select.choix-titre:hover { background-color: var(--accent-voile); box-shadow: inset 0 -1.5px 0 var(--accent); }
select.choix-titre:focus { outline: none; }
select.choix-titre:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; background-color: var(--accent-voile); }
select.choix-titre[hidden] { display: none; }
/* La liste ouverte reprend la police du texte courant, à sa taille. */
select.choix-titre option { font: 14px "IBM Plex Sans", system-ui, sans-serif; color: var(--encre); }
@media (max-width: 720px) { .titre-choix { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { select.choix-titre { transition: none; } }
/* À l'impression, des cadres nets : pas d'ombre, et un surtitre jamais seul
   en bas de page, séparé de sa section. */
@media print {
  .panneau { box-shadow: none; }
  .surtitre, .panneau > .section-tete { break-after: avoid; }
}
@media (forced-colors: active) { select.choix-titre { border-bottom: 1px solid CanvasText; } }
/* L'interrupteur des bases, collé au titre « Plans » ; le compte reste à droite. */
#choix-base { margin-right: auto; align-self: center; }
#choix-base[hidden] { display: none; }
#section-plans [data-base][hidden] { display: none; }
h2 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.3; margin: 0; }
@media (max-width: 720px) { h2 { font-size: 20px; } }
.indice { color: var(--encre-3); font-size: 12px; }

/* Débrief 27 (D3) : 28 px de haut, son filet à 3:1 (--bord-champ). */
select.select {
  border: none; border-bottom: 1px solid var(--bord-champ); background: none;
  color: var(--encre); font: inherit; font-size: 13px; line-height: 19px; padding: 4px 20px 4px 0; cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%2386847a' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat; background-position: right center;
}
select.select:focus { outline: none; }
/* Au clavier, le menu Contrat (et Tranche) a un vrai anneau, comme ses voisins. */
select.select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

/* ---------------------------------------------------- Graphique */
.commandes-graphe { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-left: auto; }
/* Débrief 27 (D1) : le contrôle segmenté, partout le même — une piste
   claire (--seg-piste), des boutons sans bord, et le choix courant posé
   dessus comme une pastille levée (--seg-puce, --seg-ombre), en encre
   pleine. 28 px de haut (D3). Plus de pavé noir : l'aplat sombre
   (--principal-*) reste à la seule action principale d'un formulaire. Sans
   filet entre les boutons, un bouton caché (« Échéances » sur THS) ne
   laisse plus de double trait au bord. */
.segmente {
  display: inline-flex; align-items: center; gap: 2px; padding: 2px;
  border: 1px solid var(--filet); border-radius: 7px; background: var(--seg-piste);
}
.segmente[hidden], .segmente button[hidden] { display: none; }
.segmente button {
  border: 0; border-radius: 5px; background: none; margin: 0; white-space: nowrap;
  font: inherit; font-size: 13px; line-height: 18px; padding: 2px 11px; color: var(--encre-2); cursor: pointer;
  transition: background-color .12s, color .12s, box-shadow .12s;
}
/* Au téléphone, un mot de segment ne passe jamais sur deux lignes : les
   boutons se resserrent. */
@media (max-width: 480px) { .segmente button { padding-inline: 8px; } }
/* Débrief 27 (D11) : au doigt, chaque segment, chaque puce, chaque menu et
   chaque champ offre 44 px de haut à toucher — le bouton grandit un peu, une
   zone invisible (::after) fait le reste ; à la souris rien ne change. Les
   champs et menus passent à 16 px : iOS ne zoome plus en y entrant. */
@media (pointer: coarse) {
  .segmente button, .filtre-journal button, .tout-effacer, .echeance-titre { position: relative; min-height: 36px; }
  .segmente button::after, .filtre-journal button::after, .tout-effacer::after, .echeance-titre::after { content: ""; position: absolute; inset: -4px 0; }
  select.select { min-height: 44px; font-size: 16px; }
  .recherche input, .recherche.recherche-groupe input { min-height: 44px; font-size: 16px; }
}
.segmente button:hover { background: var(--seg-survol); color: var(--encre); }
.segmente button[aria-pressed="true"] { background: var(--seg-puce); color: var(--encre); font-weight: 500; box-shadow: var(--seg-ombre); }
/* Débrief 27 (lot H, P-F12) : un choix sans objet pour ce contrat (« Échéances »
   sans jalon à venir) reste à sa place, grisé ; un clic dit pourquoi. */
.segmente button[aria-disabled="true"], .segmente button[aria-disabled="true"]:hover { background: none; color: var(--encre-3); cursor: help; box-shadow: none; font-weight: 400; }
@media (prefers-reduced-motion: reduce) { .segmente button { transition: none; } }
/* Cinq boutons ne tiennent pas sur un téléphone : le filtre du journal passe
   sur deux lignes plutôt que de faire déborder la page. */


.cadre-graphe { position: relative; }
svg.graphe { width: 100%; height: auto; display: block; overflow: visible; }
svg.graphe text { font-family: "IBM Plex Sans", sans-serif; }
.grad { font-size: 11px; fill: var(--encre-3); font-variant-numeric: tabular-nums; }
/* Débrief 26 : la règle .grad l'emportait sur leur couleur — « manque 535 »
   et le nombre du jour s'écrivaient en gris. Et les semaines à venir de
   l'axe, pâlies, restent lisibles (4,5:1). */
.grad.manque-jalon { fill: var(--alerte); }
.grad.requis-mot.mal { fill: var(--alerte); }
.grad.requis-mot.bon { fill: var(--fait); }
.grad.nombre-point { fill: var(--encre); }
svg.graphe text.grad[opacity] { opacity: .95; }
.cadre-graphe {
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  /* Débrief 27 (M2) : le pouce qui descend fait défiler la page (le
     navigateur garde les gestes verticaux) ; seul un glissement horizontal
     déplace la courbe. touch-action: none bloquait la page sur 30 à 83 %
     de l'écran d'un téléphone. */
  touch-action: pan-y;
  border-radius: 6px;
}
.cadre-graphe[data-glisse="true"] { cursor: grabbing; }
.cadre-graphe:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.cadre-graphe svg text { user-select: none; }
.zone-clic { cursor: inherit; }
/* Survoler une semaine l'éclaire d'une bande discrète, sous la bulle ; la
   semaine montrée au doigt ou au clavier aussi (.marquee). */
.zone-clic:hover, .zone-clic.marquee { fill: var(--encre); fill-opacity: .05; }   /* débrief 27 : un voile léger, la courbe reste lisible dessous (le filet à 55 % la pâlissait) */
/* Débrief 27 (P-F1) : « Ctrl + molette pour zoomer », une fois par
   visite, au milieu du graphique, par-dessus — rien ne bouge. */
.indice-zoom {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none;
  padding: 7px 14px; border-radius: 999px; background: var(--releve); border: 1px solid var(--releve-bord);
  box-shadow: var(--flottant-ombre); color: var(--encre); font-size: 13px; white-space: nowrap;
  opacity: 0; transition: opacity .25s;
}
.indice-zoom.visible { opacity: 1; }
.indice-zoom[hidden] { display: none; }
/* Débrief 27 (M11) : après un glissement ou un zoom à la main, le retour au
   cadrage d'ouverture, en haut à gauche du graphique, par-dessus. */
/* Sa place exacte, le coin haut gauche du tracé (le plus vide d'une
   courbe qui monte), est posée par le script. */
.revenir-cadrage {
  position: absolute; left: 42px; top: 56px; z-index: 2; min-height: 28px; padding: 3px 12px; border-radius: 999px;
  border: 1px solid var(--filet-fort); background: var(--surface); color: var(--encre); font: inherit; font-size: 13px; line-height: 20px;
  cursor: pointer; box-shadow: var(--flottant-ombre);
}
.revenir-cadrage:hover { border-color: var(--encre-3); }
.revenir-cadrage[hidden] { display: none; }
@media (pointer: coarse) { .revenir-cadrage::after { content: ""; position: absolute; inset: -8px -2px; } }
@media (prefers-reduced-motion: reduce) { .indice-zoom { transition: none; } }
.annee { font-size: 11px; fill: var(--encre-3); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.jalon-texte {
  font-size: 12px; fill: var(--encre-2); font-weight: 500;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;   /* un halo : lisible sur un trait ou un marqueur voisin */
}
.jalon-texte.masque { display: none; }
.jalon-num { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; fill: var(--surface); pointer-events: none; }
/* Débrief 27 (B3) : le trait d'un jalon — plein pour la prochaine
   échéance, caché pour les autres, qui paraît léger (35 %) au survol de son
   numéro ou de son jalon dans la légende (clavier compris : focusin). */
.jalon .jalon-trait { opacity: 0; transition: opacity .15s; }
.jalon.prochain .jalon-trait { opacity: .8; }
.jalon:hover .jalon-trait, .jalon.survole .jalon-trait { opacity: .35; stroke-width: 2; }
.jalon.prochain:hover .jalon-trait, .jalon.prochain.survole .jalon-trait { opacity: 1; stroke-width: 2; }
.jalon.survole .jalon-lien, .jalon.survole .jalon-coche { stroke-width: 2; }
@media (prefers-reduced-motion: reduce) { .jalon .jalon-trait { transition: none; } }
.jalon.survole .jalon-marque { stroke: var(--encre); stroke-width: 2; }
.jalon.survole .jalon-texte.masque { display: block; transform: translateY(26px); }   /* révélé sous la rangée des numéros, pas par-dessus les voisins */
.jalon.critique .jalon-texte { fill: var(--alerte); }   /* l'échéance manquée : rouge sur le graphique comme dans la légende */
/* Les jalons se lisent sous la légende des courbes, en colonnes : un jalon
   par case, son numéro, son nom, et dessous sa semaine — plutôt qu'une
   longue ligne où tout se touche. */
.legende-jalons { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--filet); font-size: 13px; color: var(--encre-2); }
.legende-jalons:empty { display: none; }
.legende-jalons-mot { display: block; margin-bottom: 8px; }
.legende-jalons-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px 18px; }
.legende-jalon {
  display: grid; grid-template-columns: 18px 1fr; grid-template-rows: auto auto;
  column-gap: 8px; row-gap: 1px; align-items: center; cursor: pointer; border-radius: 6px;
  transition: background-color .15s, box-shadow .15s;
}
.legende-jalon:hover, .legende-jalon[aria-expanded="true"] { background: var(--creux); box-shadow: 0 0 0 6px var(--creux); }
.legende-jalon:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.legende-jalon .num {
  display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--encre-2); color: var(--surface); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums;
  grid-row: span 2; align-self: center;
}
.legende-jalon .mot { color: var(--encre); align-self: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legende-jalon .quand { grid-column: 2; color: var(--encre-2); font-size: 12px; align-self: start; white-space: normal; }
/* Hors du périmètre choisi : le numéro reste net (c'est le lien avec le
   graphique), seul le reste s'efface un peu. */
.legende-jalon.hors-perimetre .num { background: var(--surface); color: var(--encre-2); box-shadow: inset 0 0 0 1.5px var(--encre-3); }
/* Débrief 27 (X, contraste) : plus d'opacité sur le texte — elle faisait
   tomber les dates à 3,5:1 ; le gris tertiaire (4,6:1 au moins) et
   l'italique disent « en retrait ». */
.legende-jalon.hors-perimetre .mot, .legende-jalon.hors-perimetre .quand { color: var(--encre-3); font-style: italic; }
/* Hors de la fenêtre affichée : dans la légende, mais nulle part sur le
   dessin — le numéro se creuse en pointillé, le texte passe au gris
   tertiaire (il était à 55 % d'opacité, sous 4,5:1). */
.legende-jalon.hors-fenetre .mot, .legende-jalon.hors-fenetre .quand { color: var(--encre-3); }
.legende-jalon.hors-fenetre .num { background: var(--surface); color: var(--encre-2); box-shadow: none; border: 1.5px dashed var(--encre-3); }
.legende-jalon .retard { color: var(--alerte); font-weight: 500; font-style: normal; }
.legende-jalon.critique.hors-fenetre .num { background: var(--surface); color: var(--alerte); border-color: var(--alerte); }
/* Débrief 27 (D8) : la Tendance sans courbe (moins de deux relevés) — l'état
   vide à la place du dessin, et rien de ce qui n'agirait sur rien. */
.graphe-vide #filtre-valeur-graphe, .graphe-vide .commandes-graphe, .graphe-vide #legende,
.graphe-vide #note-graphe, .graphe-vide #donnees-graphe { display: none !important; }
.graphe-vide .cadre-graphe { cursor: default; }
.panneau.graphe-vide .feuille { border-top: 0; padding-top: 0; }
.legende-jalon.critique .num { background: var(--alerte); }

/* ---------------------------------------------------- Fiche d'une échéance */
.fiche-echeance {
  margin-top: 16px; border: 1px solid var(--filet); background: var(--creux); border-radius: 10px;
  padding: 16px 18px 15px; display: grid; gap: 13px; color: var(--encre); font-size: 13px;
  animation: apparaitre .2s ease-out;
}
@keyframes apparaitre { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.fiche-echeance-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fiche-echeance-tete .num {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--encre-2); color: var(--surface); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.fiche-echeance-tete .num.critique { background: var(--alerte); }
.fiche-echeance-tete h3 { margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 20px; line-height: 1.2; }
.fiche-echeance-tete .quand { color: var(--encre-2); }
.fiche-echeance-fermer {
  margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--filet-fort); padding: 0;
  background: var(--surface); color: var(--encre-2); font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
}
.fiche-echeance-fermer:hover { color: var(--encre); border-color: var(--encre-3); }
/* Débrief 27 (D7) : les trois chiffres prennent le dessin des tuiles de la
   synthèse — l'étiquette au-dessus (12 px, --encre-2), le nombre en Sans
   24/500, tuile de rayon 6. L'ordre du texte ne change pas (le nombre, puis
   son mot) : seule la mise en page pose le mot au-dessus. */
.fiche-echeance-chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fiche-echeance-chiffres > div {
  display: flex; flex-direction: column; gap: 2px;
  background: var(--releve); border: 1px solid var(--filet); border-radius: 6px; padding: 10px 12px; min-width: 0;
}
.fiche-echeance-chiffres b {
  display: block; font-size: 24px; font-weight: 500; line-height: 1.2;
  font-variant-numeric: tabular-nums; color: var(--encre);
}
.fiche-echeance-chiffres span { order: -1; color: var(--encre-2); font-size: 12px; line-height: 1.35; }
.fiche-echeance-jauge { display: flex; align-items: center; gap: 12px; color: var(--encre-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.fiche-echeance-jauge .piste { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--filet); overflow: hidden; }
.fiche-echeance-jauge .piste span { display: block; height: 100%; background: var(--fait); border-radius: 3px; }
.fiche-echeance-rythme { color: var(--encre-2); }
.fiche-echeance-rythme b { color: var(--encre); font-weight: 500; font-variant-numeric: tabular-nums; }
.fiche-echeance-verdict { display: flex; gap: 9px; align-items: baseline; font-weight: 500; }
/* Le même verdict au rythme des quatre dernières semaines, en retrait sous
   celui du rythme tenu. */
.fiche-echeance-verdict::before {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
  font-size: 11px; font-weight: 500; color: var(--sur-plein); transform: translateY(3px);
}
.fiche-echeance-verdict.bon::before { content: '\2713'; background: var(--fait); }
.fiche-echeance-verdict.mal::before { content: '!'; background: var(--alerte); }
@media (max-width: 560px) {
  .fiche-echeance-chiffres b { font-size: 20px; }
  .fiche-echeance { padding: 14px 13px 13px; }
}
@media (prefers-reduced-motion: reduce) { .fiche-echeance { animation: none; } }

/* ---------------------------------------------------- Échéance, en tête du graphique */
.echeance-titre {
  margin: 0 auto 0 4px; align-self: center; display: inline-flex; align-items: center; gap: 9px;
  border: 1px solid var(--filet-fort); background: var(--surface); color: var(--encre-2);
  border-radius: 999px; padding: 4px 14px 4px 11px; font: inherit; font-size: 13px; line-height: 18px; cursor: pointer;
  transition: border-color .15s, color .15s, transform .15s;
}
.echeance-titre:hover { border-color: var(--encre-3); color: var(--encre); }
.echeance-titre:active { transform: scale(.98); }
.echeance-titre b { color: var(--encre); font-weight: 500; }
.echeance-titre .jours { color: var(--encre); font-variant-numeric: tabular-nums; }
.echeance-titre .point { width: 8px; height: 8px; border-radius: 50%; background: var(--fait); flex: none; }
.echeance-titre.en-retard .point { background: var(--alerte); }
/* Chaque morceau reste d'un bloc : sur un téléphone, « Prochaine échéance »
   se cassait en deux lignes au milieu de la puce. */
.echeance-titre > span, .echeance-titre > b { white-space: nowrap; }
/* Le « · » qui sépare l'échéance du groupe ouvert vient du style, pas du
   texte : au téléphone, où la puce passe sur deux lignes, il ouvrait la
   seconde, seul en tête (relecture du débrief 20). */
.echeance-titre .portee::before { content: "\00b7\00a0"; }
/* Débrief 27 (P-F2, X-A8) : le verdict en mots dans la puce. */
.echeance-titre .verdict-mot { font-weight: 500; }
.echeance-titre .verdict-mot::before { content: "\00b7\00a0"; color: var(--encre-3); font-weight: 400; }
.echeance-titre .verdict-mot.mal { color: var(--alerte); }
.echeance-titre .verdict-mot.bon { color: var(--fait); }
@media (max-width: 480px) {
  /* Au téléphone, deux lignes nettes : l'échéance, puis le groupe et les
     jours, alignés sous « Prochaine échéance » — le point se pose dans la
     marge, la coupure est voulue (un élément pleine largeur entre les
     deux), et le « · » n'a plus rien à séparer. */
  .echeance-titre { flex-wrap: wrap; row-gap: 0; margin-left: 0; font-size: 12px; position: relative; padding-left: 28px; max-width: 100%; text-align: left; }
  .echeance-titre > b { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .echeance-titre .point { position: absolute; left: 11px; top: 12px; }
  .echeance-titre::before { content: ""; order: 1; flex-basis: 100%; height: 0; }
  .echeance-titre .portee, .echeance-titre .jours, .echeance-titre .verdict-mot { order: 2; }
  .echeance-titre .portee::before { content: none; }
}

/* ---------------------------------------------------- Haut de page */
/* Débrief 27, lot G (B15, M16) : le bouton ne couvre plus rien. Quand la
   marge à droite des panneaux le tient (1330 px et plus), il s'y pose, à
   16 px du panneau, et reste là. Plus étroit, il ne paraît qu'en remontant
   la page — on cherche le haut — et s'efface dès qu'on redescend ou qu'on
   tape dans un champ (majBoutonHaut) ; le pied lui garde sa place tout en
   bas. Les règles étroites viennent après la règle de base : avant, celle
   du téléphone (36 px) était déclarée avant elle, et perdait. */
.haut-de-page {
  position: fixed; right: 14px; bottom: 16px; z-index: 40; width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  border: 1px solid var(--releve-bord); background: var(--releve); color: var(--encre-2);
  box-shadow: var(--flottant-ombre); transition: color .15s, border-color .15s, transform .15s;
}
.haut-de-page:hover { color: var(--encre); border-color: var(--encre-3); transform: translateY(-2px); }
@media (min-width: 1330px) {
  .haut-de-page { right: calc((100% - 1202px) / 2 - 56px); bottom: 22px; width: 40px; height: 40px; }
}
/* Débrief 29 (B15) : de 721 à 1 329 px, la marge à droite des panneaux
   (30 px à 1 024, 39 à 1 280) tient le bouton en entier : 28 px, centré
   dans la marge — il ne touche plus le bord ni la marge intérieure des
   cartes (à 36 px, il en couvrait 11 à 20 px). La largeur des panneaux :
   1 202 px au plus, 60 px de moins que l'écran sinon. Au doigt, sa zone
   invisible garde 44 px (couche tactile commune). */
@media (min-width: 721px) and (max-width: 1329px) {
  .haut-de-page { width: 28px; height: 28px; right: max(1px, calc((100% - min(1202px, 100% - 60px)) / 4 - 14px)); }
}
@media (prefers-reduced-motion: reduce) { .haut-de-page { transition: none; } .haut-de-page:hover { transform: none; } }
@media print { .haut-de-page, .echeance-titre { display: none !important; } }
.legende-jalon.critique .mot { color: var(--alerte); }
.legende-jalon:hover .mot, .legende-jalon:focus-visible .mot { text-decoration: underline; text-underline-offset: 3px; }
/* Un jalon d'un autre périmètre que celui choisi : dessiné, mais en retrait —
   il ne fait pas l'échéance ici. Le marqueur se creuse et garde son numéro
   lisible ; le trait et le texte s'estompent. */
.jalon.hors-perimetre .jalon-lien, .jalon.hors-perimetre .jalon-coche { opacity: .35; }
.jalon.hors-perimetre .jalon-marque { fill: var(--surface); stroke: var(--encre-3); stroke-width: 1.5; }
.jalon.hors-perimetre .jalon-num { fill: var(--encre-2); }
.jalon.hors-perimetre .jalon-texte { fill: var(--encre-3); }

.note-graphe { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--encre-3); }
.note-graphe:empty { display: none; }

.puce-delta {
  border: none; background: none; font: inherit; cursor: pointer; padding: 1px 0;
  color: var(--encre-2); border-bottom: 1px dotted var(--filet-fort);
  display: inline-flex; align-items: baseline; gap: 6px;
}
.puce-delta:hover { color: var(--encre); border-bottom-color: var(--encre); }
.puce-delta[aria-pressed="true"] { color: var(--encre); font-weight: 500; border-bottom: 1px solid var(--encre); }
.puce-delta b { font-variant-numeric: tabular-nums; font-weight: 500; }
/* La vue d'ensemble des contrats. Débrief 27 (lot H, B18, P-F16) : une
   fenêtre posée en haut de l'écran (pas au centre : elle ne saute pas quand
   les chiffres arrivent), par-dessus la page, dans le dessin des panneaux ;
   au téléphone, tout l'écran. */
dialog.ensemble {
  width: min(1140px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 48px);
  margin: 24px auto auto; padding: 0;
  border: 1px solid var(--panneau-bord); border-radius: 10px; background: var(--surface); color: var(--encre);
  box-shadow: var(--panneau-ombre); overflow: hidden;
}
dialog.ensemble[open] { display: flex; flex-direction: column; }
dialog.ensemble::backdrop { background: var(--voile-dialogue); }
.ensemble-tete { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 20px 24px 14px; border-bottom: 1px solid var(--filet); }
.ensemble-tete h2 { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 24px; margin: 0; }
.ensemble-tete h2:focus { outline: none; }
.ensemble-tete h2:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ensemble-tete .indice { font-size: 12px; color: var(--encre-3); }
.ensemble-tete .fiche-plan-fermer { flex: none; align-self: flex-start; }
.defile-ensemble { overflow: auto; overscroll-behavior: contain; padding: 4px 24px 0; flex: 1 1 auto; min-height: 0; }
/* Des colonnes de largeur fixe et des lignes de deux lignes : rien ne
   bouge quand un contrat passe de « chargement… » à ses chiffres. */
.ensemble-table { width: 100%; min-width: 860px; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.ensemble-table th, .ensemble-table td { padding: 8px 10px; text-align: left; vertical-align: top; border-top: 1px solid var(--filet); overflow-wrap: anywhere; }
/* Débrief 29 (A-F25) : 64 px, la hauteur d'une ligne remplie (chiffre,
   part, jauge) — une ligne « chargement… » la garde déjà : la fenêtre ne
   grandit plus quand les autres contrats arrivent. */
.ensemble-table tbody th, .ensemble-table tbody td { height: 64px; }
.ensemble-table thead th { border-top: none; border-bottom: 1px solid var(--filet-fort); font-size: 12px; font-weight: 500; color: var(--encre-2); vertical-align: bottom; }
.ensemble-table tbody th .lien-doux { font: 500 14px "IBM Plex Sans", system-ui, sans-serif; color: var(--encre); text-align: left; }
.ensemble-table tr.courant { background: var(--creux); }
.ensemble-table .v { display: block; font-variant-numeric: tabular-nums; color: var(--encre); }
.ensemble-table small { display: block; margin-top: 2px; font-size: 11px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.ensemble-table .v.tard, .ensemble-table small.recul { color: var(--alerte); }
.ensemble-table .v.bon { color: var(--fait); }
.ensemble-table .v.arret { color: var(--cours); }
.ensemble-table .alerte-ligne { color: var(--alerte); }
/* Débrief 29 (A-F25) : « + Ajouter un jalon », sous « aucun jalon » (un
   administrateur du contrat) — 12 px, une ligne de 18 : au doigt, sa cible
   fait 44 px avec la marge des liens doux. */
.ensemble-table .ajouter-jalon { display: block; justify-self: end; margin-top: 2px; font-size: 12px; line-height: 18px; text-align: left; }
/* Sous « 53 / 634 », la part validée en une petite jauge de 60 × 4 px. */
.jauge-ensemble { display: block; width: 60px; height: 4px; margin-top: 5px; border-radius: 2px; background: var(--filet); overflow: hidden; }
.jauge-ensemble i { display: block; height: 100%; background: var(--fait); }
/* Les deux colonnes qui demandent un mot d'explication, dites en clair sous
   le tableau (« À l'arrêt » ne s'expliquait que dans une bulle). */
.ensemble-note { margin: 0; padding: 10px 24px 18px; font-size: 12px; line-height: 1.55; color: var(--encre-2); }
.ensemble-note b { font-weight: 500; color: var(--encre); }
/* Au téléphone, sept colonnes ne tiennent pas : trois restaient cachées à
   droite, sans le dire. Chaque contrat devient une carte — son nom, puis
   une ligne par valeur, le nom de la colonne à gauche et la valeur au bord
   droit, comme les lignes « par ATA ». La croix reste à côté du titre. */
@media (max-width: 720px) {
  .ensemble-tete { align-items: flex-start; padding: 16px 16px 12px; }
  .ensemble-tete h2 { flex: 1 1 0; min-width: 0; font-size: 20px; }
  .ensemble-tete .fiche-plan-fermer { flex: none; margin-top: 2px; }
  .ensemble-tete .indice { order: 3; flex-basis: 100%; }
  .defile-ensemble { overflow-x: visible; overflow-y: auto; padding: 0 16px; }
  .ensemble-note { padding: 10px 16px 16px; }
  .ensemble-table { min-width: 0; table-layout: auto; }
  .ensemble-table, .ensemble-table tbody, .ensemble-table tr { display: block; }
  .ensemble-table colgroup { display: none; }
  .ensemble-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ensemble-table tr { padding: 10px 0 8px; border-top: 1px solid var(--filet); }
  /* Le fond du contrat affiché déborde de 10 px de chaque côté sans rien
     élargir (une ombre ne compte pas dans la largeur). */
  .ensemble-table tr.courant { box-shadow: -10px 0 var(--creux), 10px 0 var(--creux); }
  .ensemble-table th, .ensemble-table td { border-top: none; padding: 3px 0; }
  .ensemble-table tbody th, .ensemble-table tbody td { height: auto; }
  .ensemble-table tbody th { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; }
  .ensemble-table tbody th small { margin-top: 0; }
  .ensemble-table td[data-libelle] { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: baseline; }
  .ensemble-table td[data-libelle]::before {
    content: attr(data-libelle); grid-column: 1; grid-row: 1 / span 3;
    font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-3);
  }
  .ensemble-table td[data-libelle] > * { grid-column: 2; text-align: right; }
  .ensemble-table td[data-libelle] > .jauge-ensemble { justify-self: end; }
  .ensemble-table td:not([data-libelle]) { display: block; }
}
@media (max-width: 560px) {
  dialog.ensemble { width: 100vw; height: 100vh; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
}
/* L'historique d'un plan, au-dessus du tableau. */
.fiche-plan { margin: 0 0 12px; padding: 12px 16px 12px; background: var(--surface); border: 1px solid var(--filet); border-radius: 6px; }
.fiche-plan[hidden] { display: none; }
.fiche-plan-tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.fiche-plan-tete .ref { font: 500 14px "IBM Plex Mono", monospace; }
.fiche-plan-tete .etat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.fiche-plan-fermer { margin-left: auto; border: 1px solid var(--filet-fort); background: none; border-radius: 50%; width: 28px; height: 28px; padding: 0; cursor: pointer; color: var(--encre-2); font: inherit; font-size: 16px; line-height: 1; }
/* Débrief 27 (D3, D11) : les croix de fermeture, des ronds de 28 px ; au
   doigt, une cible de 44 px autour, sans rien changer au dessin. */
@media (pointer: coarse) {
  .fiche-plan-fermer, .fiche-echeance-fermer, .admin-fermer { position: relative; }
  .fiche-plan-fermer::after, .fiche-echeance-fermer::after, .admin-fermer::after { content: ""; position: absolute; inset: -9px; }
}
.fiche-plan-fermer:hover { border-color: var(--encre); color: var(--encre); }
/* La frise : une case par relevé, de la couleur de la valeur ce jour-là ;
   la semaine n'est écrite qu'aux changements, au premier et au dernier. */
.fiche-plan-frise { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; margin: 12px 0 8px; }
.fiche-plan-frise .case { display: grid; gap: 4px; min-width: 0; }
.fiche-plan-frise .bande { height: 12px; border-radius: 2px; }
.fiche-plan-frise .bande.absent { background: none; border: 1px dashed var(--filet-fort); }
.fiche-plan-frise .bande.inconnu { background: var(--creux); }
.fiche-plan-frise .case.reemis .bande { box-shadow: inset 2px 0 0 var(--indice); }
.fiche-plan-frise .sem { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--encre-3); white-space: nowrap; overflow: visible; }
.fiche-plan-resume { font-size: 13px; color: var(--encre); }
.fiche-plan-resume.arret b { color: var(--cours); }
.fiche-plan-resume.doux { color: var(--encre-3); }
.fiche-plan-etapes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12px; color: var(--encre-2); }
.fiche-plan-etapes .sem { display: inline-block; min-width: 130px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--encre-3); }
.fiche-plan-etapes .indice { color: var(--indice); }
.fiche-plan-etapes .recul, .fiche-plan-etapes .mot-recul { color: var(--alerte); }
.fiche-plan-etapes .mot-recul { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
/* La référence du tableau se clique comme un lien discret. */
.ref-plan { border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
/* Débrief 27 (P-F17) : elle se voit cliquable sans la survoler — un
   pointillé au repos, un trait plein au survol de sa ligne ou au focus. */
.ref-plan { text-decoration: underline dotted var(--encre-3); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ref-plan:hover, tr:hover > td > .ref-plan, .ref-plan:focus-visible { text-decoration: underline solid var(--encre); text-decoration-thickness: 1px; }
/* À surveiller : les plans à l'arrêt, sous les états, en ambre — ce n'est pas un retard, c'est une question à poser. */
.a-surveiller { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--encre-2); }
.a-surveiller[hidden] { display: none; }
.a-surveiller .puce-arret b { color: var(--cours); }
.pastille.arret { background: transparent; border: 2px solid var(--cours); box-sizing: border-box; }
/* Les reculs en rouge, dans le comparatif comme dans le journal. */
.compte-passage.recul b { color: var(--alerte); }

/* ---------------------------------------------------- Rapprochement
   Quatre compteurs dans le registre des puces du comparatif ; une liste
   sobre pour ce qui n'est pas dans le tableau ; une grille pour le détail. */
.rapprochement[hidden] { display: none; }
/* ---------------------------------------------------- Rapprochement
   Deux bases face à face : deux cercles qui se recouvrent — ce qu'elles ont
   en commun au milieu, ce que chacune est seule à connaître sur les côtés —
   et, au cœur du recouvrement, un anneau qui dit d'un coup d'œil la part
   d'identiques. À droite, une ligne par verdict, en français, cliquable. */
.rapp-face { display: grid; grid-template-columns: minmax(0, 12fr) minmax(0, 8fr); gap: 18px 36px; align-items: start; }
/* La réponse d'abord, sous le titre : ce qu'il y a à traiter, en une
   phrase ; chaque nombre fait ce que fait sa ligne de verdict. */
.rapp-reponse { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: var(--encre-2); }
.rapp-reponse[hidden] { display: none; }
/* Débrief 27 (lot E, X, M6) : le nombre est un vrai bouton de 24 px au
   moins (44 au doigt) sans rien changer à la ligne : la marge négative rend
   à la phrase la place que le rembourrage prend. */
.rapp-reponse button {
  display: inline-block; min-width: 24px; min-height: 24px; margin: -2px -4px; padding: 2px 4px; border-radius: 4px;
  border: none; background: none; cursor: pointer; color: var(--encre); text-align: center; vertical-align: baseline;
  font: 500 14px/20px "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums;
  text-decoration: underline; text-underline-offset: 3px;
}
.rapp-reponse button:hover { background: var(--seg-survol); text-decoration-thickness: 2px; }
.rapp-reponse button[aria-pressed="true"] { text-decoration-thickness: 2px; }
@media (pointer: coarse) {
  .rapp-reponse button { position: relative; }
  .rapp-reponse button::after { content: ""; position: absolute; inset: -10px; }
}
@media (max-width: 860px) { .rapp-face { grid-template-columns: 1fr; } }
.rapp-figure { min-width: 0; }
/* Débrief 27 (lot E — P-F20, M3, M9, B24) : la figure en deux couches
   (figureRapprochement). Dessous, le dessin en SVG, qui suit la largeur ;
   dessus, ses mots en HTML, posés en pourcentage de la figure mais écrits
   à taille fixe — 12 px au moins, à toute largeur (ils tombaient à 7 px au
   téléphone). Les trois côtés sont des boutons ; les parts de l'anneau
   répondent au pointeur par leur trait invisible élargi (.donut-cible). */
.venn { position: relative; }
.venn svg { width: 100%; height: auto; display: block; overflow: visible; }
.venn .donut-seg { pointer-events: none; }
.venn .donut-cible { fill: none; stroke: transparent; pointer-events: stroke; cursor: pointer; }
.venn-base {
  position: absolute; margin: 0; transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; text-align: center;
}
.venn .base-nom { font: 500 14px/1.3 "IBM Plex Sans", system-ui, sans-serif; color: var(--encre); letter-spacing: .05em; }
.venn .base-compte { font-size: 12px; line-height: 1.35; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.venn .cote {
  position: absolute; transform: translate(-50%, -50%); margin: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 0; border-radius: 6px; background: none; padding: 6px 10px;
  font: inherit; color: var(--encre-2); text-align: center; white-space: nowrap; cursor: pointer;
}
.venn .cote:hover, .venn .cote.survole { background: var(--seg-survol); }
/* Pressé : son lot filtre le tableau — la pastille levée des contrôles
   segmentés, avec le filet encre des verdicts pressés. */
.venn .cote[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--encre), 0 1px 2px rgba(25, 25, 21, .10); }
.venn .cote:disabled { cursor: default; background: none; }
.venn .grand { font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--encre); }
.venn .petit { font-size: 13px; line-height: 1.3; color: var(--encre-2); }
.venn .moyen { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--encre); }
.venn .cote-manque .grand { color: var(--alerte); }
.venn .cote-manque.zero .grand { color: var(--encre-3); }
.venn .cote-seul .grand { color: var(--encre-2); }
.venn .cote.survole .grand, .venn .cote.survole .moyen { text-decoration: underline; text-underline-offset: 3px; }
.venn .cote.survole .petit { color: var(--encre); }
.venn .commun-n, .venn .commun-mot { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; }
.venn .commun-n.serre { font-size: 24px; }
.venn .commun-n.tres-serre { font-size: 20px; }
/* Le tracé étroit (figure de moins de 470 px) : les cercles prennent toute
   la largeur, les mots passent à 12 px (sous 380 px), le compte des « pas
   encore » sur sa ligne ; les noms des bases se calent aux coins du haut
   et peuvent passer à la ligne au « · ». */
.venn-etroit .grand { font-size: 24px; }
.venn-etroit .petit { font-size: 12px; }
.venn-etroit .cote { padding: 4px 6px; }
.venn-etroit .cote-attente .moyen { display: block; }
.venn-etroit .commun-n.serre { font-size: 20px; }
.venn-etroit .commun-n.tres-serre { font-size: 16px; }
.venn-ample .grand { font-size: 28px; }
.venn-ample .petit { font-size: 13px; }
.venn-ample .commun-n.serre { font-size: 24px; }
.venn-ample .commun-n.tres-serre { font-size: 20px; }
.venn-etroit .venn-base { white-space: normal; max-width: 47%; }
.venn-etroit .venn-base-ici { transform: none; align-items: flex-start; text-align: left; }
.venn-etroit .venn-base-la { transform: none; align-items: flex-end; text-align: right; }
.venn-base .sans-coupure { white-space: nowrap; }
.rapp-figure .cercle-ici { fill: var(--r2); fill-opacity: .5; stroke: var(--fait); stroke-width: 1.5; }
.rapp-figure .cercle-la { fill: none; stroke: var(--encre-3); stroke-width: 1.5; stroke-dasharray: 5 4; }
.rapp-figure .donut-fond { fill: none; stroke: var(--filet); stroke-width: 14; }
.rapp-figure .donut-seg { fill: none; stroke-width: 14; stroke-linecap: butt; transition: stroke-width .12s; }
.venn-etroit .donut-fond, .venn-etroit .donut-seg { stroke-width: 11; }
/* À l'apparition : les cercles s'installent, l'anneau se trace, les mots
   paraissent — le tout en 300 ms au plus (débrief 27, B24 : en sautant
   droit au 06, on voyait longtemps un anneau pâle). Rien de tout cela si
   le lecteur préfère moins de mouvement. */
.venn.anime .cercle-ici, .venn.anime .cercle-la { animation: rapp-arrive .2s ease-out both; transform-origin: center; transform-box: fill-box; }
.venn.anime .donut-seg { stroke-dasharray: 400; stroke-dashoffset: 400; animation: rapp-trace .25s cubic-bezier(.2, .7, .2, 1) .05s forwards; }
.venn.anime .venn-base, .venn.anime .cote, .venn.anime .commun-n, .venn.anime .commun-mot { animation: rapp-fondu .2s ease-out .1s both; }
@keyframes rapp-arrive { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
@keyframes rapp-trace { to { stroke-dashoffset: 0; } }
@keyframes rapp-fondu { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .venn.anime * { animation: none !important; stroke-dashoffset: 0 !important; }
  .rapp-figure .donut-seg { transition: none; }
}
.rapp-figure .donut-seg.accord { stroke: var(--fait); }
.rapp-figure .donut-seg.emission { stroke: var(--indice); }
.rapp-figure .donut-seg.avance { stroke: var(--cours); }
/* Survoler un verdict éclaire sa part de la figure. */
.rapp-figure .donut-seg.survole { stroke-width: 20; }
.venn-etroit .donut-seg.survole { stroke-width: 16; }
.verdicts { display: grid; gap: 6px; }
/* Débrief 27 (B24) : pastille, nombre, phrase, chevron — 12 | 52 | 1fr | 16,
   10 px entre chaque : la pastille touche presque son nombre (elle en
   était à 55–90 px) ; un compte à quatre chiffres élargit la colonne du
   nombre pour toutes les lignes (.larges). */
.verdict {
  display: grid; grid-template-columns: 12px 52px minmax(0, 1fr) 16px; align-items: center; column-gap: 10px;
  width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px 6px 8px;
  font: inherit; color: var(--encre-2); cursor: pointer;
}
.verdicts.larges .verdict { grid-template-columns: 12px 68px minmax(0, 1fr) 16px; }
.verdict .pastille, .verdict .chevron { justify-self: center; }
.verdict .sans-coupure { white-space: nowrap; }
@media (pointer: coarse) { .verdict { min-height: 44px; } }
/* Le chevron dit que la ligne se déplie, comme partout ailleurs sur la
   page : vers la droite fermée, vers le bas ouverte. */
.verdict .chevron { color: var(--encre-3); transition: transform .12s; }
@media (prefers-reduced-motion: reduce) { .verdict .chevron { transition: none; } }
.verdict[aria-expanded="true"] .chevron { transform: rotate(90deg); color: var(--encre); }
.verdict-bloc.sans-trouve { opacity: .45; }
/* Les plans d'un verdict, dépliés sous sa ligne : un filet à gauche les
   rattache à elle. Débrief 27 (D10, M2) : à leur hauteur naturelle — plus
   de zone qui défile et retient la molette ou le doigt ; un gros lot
   montre ses premières puces puis « Voir les N autres ». */
.verdict-corps { margin: 4px 0 8px 18px; padding: 6px 4px 2px 12px; border-left: 2px solid var(--filet-fort); }
.verdict-corps-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 4px 8px; }
/* Ce que le lot veut dire et ce que fait un clic : la bulle du survol, à
   portée du doigt et du clavier (D9). */
.rapp-detail { margin: 0 4px 8px; font-size: 13px; line-height: 1.45; color: var(--encre-2); max-width: 60ch; }
.rapp-puces-legende .n { font-weight: 500; color: var(--encre); font-variant-numeric: tabular-nums; }
.rapp-voir-plus {
  display: inline-flex; align-items: center; min-height: 28px; margin: 0 4px 10px; padding: 3px 10px;
  border: 1px solid var(--filet-fort); border-radius: 999px; background: var(--surface); color: var(--encre);
  font: 500 13px "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; cursor: pointer;
}
.rapp-voir-plus:hover { border-color: var(--encre); background: var(--creux); }
@media (pointer: coarse) {
  .rapp-voir-plus { min-height: 44px; }
  /* Les puces : 36 px, 8 px entre les rangées, et une cible invisible qui
     déborde de 4 px en haut et en bas — 44 px chacune, sans empiéter sur
     la voisine. */
  .rapp-puces { row-gap: 8px; }
  .rapp-puce { position: relative; min-height: 36px; }
  .rapp-puce::after { content: ""; position: absolute; inset: -4px 0; }
  .verdict-corps-tete .copier { position: relative; min-height: 32px; }
  .verdict-corps-tete .copier::after { content: ""; position: absolute; inset: -6px 0; }
}
.verdict:hover { background: var(--creux); color: var(--encre); }
.verdict[aria-pressed="true"] { border-color: var(--encre); background: var(--surface); color: var(--encre); }
.verdict:disabled { cursor: default; opacity: .5; }
.verdict:disabled:hover { background: none; }
.verdict .verdict-n {
  font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums;
  color: var(--encre); text-align: right; line-height: 1.1;
}
.verdict .verdict-mot { font-size: 13px; line-height: 1.35; color: var(--encre); }
.verdict .pastille { width: 9px; height: 9px; }
.rapp-sur { font-size: 12px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.rapp-puces-legende { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--encre-2); }
.rapp-puces-legende > span { display: inline-flex; align-items: center; gap: 5px; }
.rapp-puces-legende .pastille { width: 8px; height: 8px; }
/* Les puces : une référence par puce, sa pastille d'état à gauche, la
   lettre d'une réémission à droite. Elles coulent sur la ligne — douze
   plans tiennent en deux lignes, pas en douze. */
.rapp-puces { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 2px 4px 10px; }
.rapp-puce {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--filet-fort); border-radius: 999px;
  background: var(--surface); padding: 4px 11px 4px 9px; font-family: "IBM Plex Mono", monospace; font-size: 12px;
  color: var(--encre); cursor: pointer; line-height: 18px;
}
.rapp-puce:hover { border-color: var(--encre); background: var(--creux); }
.rapp-puce:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.rapp-puce .pastille { width: 8px; height: 8px; }
.rapp-puce-vers { color: var(--indice); font-weight: 500; }
/* Débrief 27 (lot E) : au téléphone, deux puces par rangée plutôt qu'une
   (dès 360 px) — le retrait du lot et le rembourrage des puces se
   resserrent. */
@media (max-width: 480px) {
  .verdict-corps { margin-left: 0; padding: 6px 0 2px 8px; }
  .rapp-puces { padding-inline: 0; }
  .verdict-corps-tete, .rapp-detail { margin-inline: 0; }
  .rapp-voir-plus { margin-left: 0; }
  .rapp-puce { padding-inline: 8px; gap: 6px; }
  .rapp-puces { column-gap: 6px; }
}
.pastille.accord { background: var(--fait); }
.pastille.avance { background: var(--cours); }
.pastille.manque { background: var(--alerte); }
.pastille.attente { background: var(--pastille-attente); }
.pastille.seul { background: transparent; border: 2px solid var(--encre-2); box-sizing: border-box; }
/* Le tableau de la seconde base : le verdict en pastille dans la cellule de
   la référence, les cases à cocher de l'extract en ✓ / –. */
table.plans td.coche { text-align: center; color: var(--encre-2); }
table.plans .verdict { display: inline-flex; align-items: center; gap: 8px; }
table.plans tbody tr.choisie td { background: var(--creux); box-shadow: inset 0 -1px 0 var(--encre); }
table.plans tbody tr[data-plan] { cursor: pointer; }
/* Débrief 25 : un ancien plan (« S » dans Validité), grisé, marqué. */
table.plans tbody tr.ancien td { color: var(--encre-3); }
table.plans tbody tr.ancien .pastille { opacity: .4; }
.marque-ancien { margin-left: 8px; padding: 0 6px; border: 1px solid var(--filet-fort); border-radius: 4px; font-size: 11px; color: var(--encre-3); white-space: nowrap; }
/* La référence d'une ligne de là est un bouton : le clavier y arrive aussi. */
.ref-lien { border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.ref-lien:hover { text-decoration: underline; }
.legende-rapp { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--encre-2); margin-left: auto; }
.legende-rapp span { display: inline-flex; align-items: center; gap: 6px; }
.legende-rapp:empty { display: none; }
/* Les paires « ancienne → nouvelle » d'un changement d'indice : jamais
   coupées à mi-ligne — la bulle ne liste rien d'autre. */
.bulle .liste-refs {
  font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.6;
}

.legende {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--filet);
  font-size: 12px; color: var(--encre-2);
}
.legende-item { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow-wrap: anywhere; }
.legende-item span { border-bottom: 1px dotted var(--filet-fort); cursor: help; }
/* Débrief 27 (M3, D9) : le mot de la légende est un bouton — il déplie sa
   phrase sous la légende (.legende-detail). */
.legende-mot { border: 0; background: none; padding: 2px 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; border-radius: 3px; }
.legende-mot span { cursor: pointer; }
.legende-mot:hover span, .legende-mot[aria-expanded="true"] span { color: var(--encre); border-bottom-color: currentColor; }
.legende-mot[aria-expanded="true"] span { border-bottom-style: solid; }
.legende-detail { flex: 1 1 100%; margin: 0; text-align: center; font-size: 13px; line-height: 1.5; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.legende-detail[hidden] { display: none; }
@media (pointer: coarse) {
  .legende-mot { position: relative; }
  .legende-mot::after { content: ""; position: absolute; inset: -12px -4px; }
}
/* Débrief 27 (X-A7) : « Voir les chiffres » — les relevés de la courbe en
   tableau, sous les jalons. Replié par défaut. */
.donnees-graphe { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--filet); font-size: 13px; color: var(--encre-2); }
.donnees-graphe > summary {
  display: inline-flex; align-items: center; gap: 7px; min-height: 28px; cursor: pointer; list-style: none;
  color: var(--encre-2); border-radius: 4px;
}
.donnees-graphe > summary::-webkit-details-marker { display: none; }
.donnees-graphe > summary::before {
  content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transition: transform .15s; margin-right: 2px;
}
.donnees-graphe[open] > summary::before { transform: rotate(45deg); }
.donnees-graphe > summary:hover { color: var(--encre); }
@media (prefers-reduced-motion: reduce) { .donnees-graphe > summary::before { transition: none; } }
@media (pointer: coarse) { .donnees-graphe > summary { min-height: 44px; } }
.donnees-graphe-corps { margin-top: 8px; overflow-x: auto; }
.donnees-graphe-corps p { margin: 0 0 10px; max-width: 70ch; line-height: 1.55; }
.table-donnees { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 320px; }
.table-donnees th, .table-donnees td { padding: 5px 16px 5px 0; text-align: right; white-space: nowrap; }
.table-donnees th:first-child, .table-donnees td:first-child { text-align: left; }
.table-donnees thead th { font-size: 12px; font-weight: 500; color: var(--encre-2); border-bottom: 1px solid var(--filet-fort); }
.table-donnees tbody th { font-weight: 400; color: var(--encre-2); }
.table-donnees td { color: var(--encre); }
.table-donnees tbody tr + tr > * { border-top: 1px solid var(--filet); }

.bulle {
  position: fixed; z-index: 40; pointer-events: none; background: var(--releve);
  border: 1px solid var(--releve-bord); box-shadow: var(--bulle-ombre); padding: 8px 10px; font-size: 12px; min-width: 160px;
  border-radius: 6px; font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity .1s;
}
.bulle[data-visible="true"] { opacity: 1; }
/* Débrief 27 (M3) : tenue au doigt, la bulle se touche (sa croix la ferme) ;
   au téléphone, elle se pose en bas de l'écran, jamais sous le doigt. */
.bulle.tenue { pointer-events: auto; padding-right: 34px; z-index: 50; }   /* au-dessus du bouton ↑ */
.bulle.tenue[data-visible="false"] { pointer-events: none; }
.bulle.en-bas { left: 12px; right: 12px; top: auto; bottom: 12px; font-size: 13px; padding: 12px 40px 12px 14px; }
.bulle-fermer {
  position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; padding: 0;
  border: 1px solid var(--filet-fort); background: var(--surface); color: var(--encre-2); font: inherit; font-size: 16px; line-height: 1; cursor: pointer;
}
.bulle-fermer::after { content: ""; position: absolute; inset: -8px; }
@media (prefers-reduced-motion: reduce) { .bulle { transition: none; } }
.bulle .tete-bulle { color: var(--encre-3); font-size: 11px; margin-bottom: 5px; }
/* Les comptes de la semaine, sous les deux lignes de tête : même dessin
   qu'elles — une pastille, un mot, un nombre à droite. */
.bulle-comptes { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--filet); display: grid; gap: 1px; }
.bulle-ligne { display: flex; align-items: center; gap: 7px; }
.bulle-ligne .n { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------- Avancement par groupe */

/* Les commandes du bloc : le choix de la dimension, puis le filtre de la
   colonne de gauche — un champ compact, dérivé de la recherche du tableau
   mais plus bas et plus court, et son compte « n sur m » quand il agit. */
.commandes-groupe { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; min-width: 0; }
.recherche.recherche-groupe { flex: none; width: 200px; min-width: 0; }
/* Débrief 27 (D3) : le champ des barres d'outils fait 28 px (la recherche
   du tableau, 36) ; deux classes, pour passer devant .recherche input. */
.recherche.recherche-groupe input {
  height: 28px; padding: 0 10px 0 30px; font-size: 13px; border-radius: 4px;
}
.recherche-groupe input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.recherche.recherche-groupe svg { left: 10px; margin-top: -7px; }
.compte-groupes {
  font-size: 12px; color: var(--encre-3); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.compte-groupes:empty { display: none; }
@media (max-width: 480px) { .recherche.recherche-groupe { width: 100%; } }

/* Une seule definition de colonnes, portee par le conteneur : l'en-tete et les
   lignes ne peuvent pas diverger, et la variante sans jalon n'a qu'a la redefinir. */
/* La première colonne loge le chevron puis le nom (débrief 21 : centré,
   « ECP-2100 » recouvrait le chevron) : le nom part après lui, à gauche. */
/* Débrief 23 : « par ECP, des fois trois petits points, la colonne ne
   s'adapte pas ». La largeur du nom (--col-nom) est posée par le script
   (ajusterColonneNom) : celle du plus long nom affiché, au moins celle
   d'avant, sans prendre à la barre de répartition ses 200 px — au-delà, le
   nom passe à la ligne, en entier, jamais coupé de points de suspension. */
#zone-critique { --cols: var(--col-nom, 118px) 58px minmax(0, 1fr) 140px minmax(0, 160px); }
#zone-critique.sans-jalon { --cols: var(--col-nom, 124px) 62px minmax(0, 1fr) 140px minmax(0, 160px); }
.critique-tete, .critique-ligne {
  display: grid; grid-template-columns: var(--cols);
  gap: 14px; align-items: center;
}
/* Débrief 27 (D4) : l'en-tête de tableau de toute la page — Sans 12/500,
   en minuscules (la première lettre posée par le script), --encre-2, un
   filet --filet-fort dessous. */
.critique-tete {
  font-size: 12px; font-weight: 500; color: var(--encre-2);
  padding-bottom: 6px; border-bottom: 1px solid var(--filet-fort); margin-bottom: 3px;
}
/* Débrief 24 : en descendant la liste, on ne savait plus quelle colonne
   était laquelle. L'en-tête reste collé en haut du cadre qui défile, comme
   celui du journal — dans la mise en page en colonnes seulement : au
   téléphone, chaque ligne reprend ses libellés, et la barre « Trier » défile
   avec la liste au lieu d'en cacher le haut. « not all and » est le
   complément exact de la requête du téléphone (min-width: 721px laisserait
   un trou aux largeurs fractionnaires). Ce qu'on amène en haut du cadre
   — ligne ouverte, focus au clavier — se pose sous lui (hautLibreCritique).
   Débrief 27 (lot C) : plus de cadre qui défile ; l'en-tête colle sous le
   sommaire (--bas-sommaire) tant qu'on lit la liste dans la page. */
@media not all and (max-width: 720px) {
  .critique-tete { position: sticky; top: var(--bas-sommaire, 0px); z-index: 3; background: var(--surface); padding-top: 6px; }
}
.critique-tete > span { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
/* Quand d'autres filtres réduisent les lignes, les colonnes tirées de
   l'historique le disent : elles portent sur tout le groupe. */
.critique-note { font-size: 12px; color: var(--encre-3); margin: 0 0 6px; line-height: 1.4; }
.critique-note.note-arret, .critique-note.note-valeur { display: flex; align-items: baseline; gap: 6px; color: var(--encre-2); }
.critique-note.note-arret .pastille, .critique-note.note-valeur .pastille { flex: none; width: 8px; height: 8px; align-self: center; }
