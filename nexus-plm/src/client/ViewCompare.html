<script>
// ============================================================
// NEXUS PLM — affichage des équivalences.
// Ne fait que mettre en forme ce que Compare.html a calculé.
//
// Chaque critère montre sa PART dans le score : c'est ce qui rend le
// résultat interprétable, et ce qui relie visiblement le rail de réglages
// (à gauche) au classement obtenu (à droite).
// ============================================================

const SIGNE_ETAT = {
  identique:    { signe: '✓', classe: 'etat-ok',      libelle: 'identique' },
  partiel:      { signe: '≈', classe: 'etat-partiel', libelle: 'partiel' },
  different:    { signe: '✗', classe: 'etat-diff',    libelle: 'différent' },
  indisponible: { signe: '–', classe: 'etat-inconnu', libelle: 'hors calcul' }
};

function listeEnsembleHtml(titre, valeurs, classe) {
  if (!valeurs || !valeurs.length) return '';
  return '<div class="ensemble ' + classe + '">' +
           '<div class="ensemble-titre">' + esc(titre) + ' (' + valeurs.length + ')</div>' +
           '<ul class="ensemble-liste">' +
             valeurs.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') +
           '</ul>' +
         '</div>';
}

// ------------------------------------------------------------
// Composants : les trois paliers d'équivalence
// ------------------------------------------------------------
function composantCourtHtml(c) {
  return '<span class="compo">' + esc(c.fonction || '?') + '</span>' +
         (c.norme ? '<span class="compo-norme">' + esc(c.norme) + '</span>' : '') +
         (c.reference ? '<span class="compo-ref">' + esc(c.reference) + '</span>' : '');
}

function palierHtml(classe, titre, sousTitre, lignes) {
  if (!lignes.length) return '';
  return '<div class="palier ' + classe + '">' +
    '<div class="palier-titre"><span>' + esc(titre) + ' (' + lignes.length + ')</span>' +
      '<small>' + esc(sousTitre) + '</small></div>' +
    '<ul class="palier-liste">' + lignes.join('') + '</ul>' +
  '</div>';
}

/**
 * Le détail d'un critère de composants : combien de composants trouvent
 * leur référence exacte, combien seulement leur norme, combien seulement
 * leur fonction, et lesquels n'ont rien trouvé.
 */
function paliersHtml(critere) {
  const p = critere.paliers;
  const vers = '<span class="vers" aria-hidden="true">→</span>';

  const reference = p.reference.map(function (a) {
    return '<li>' + composantCourtHtml(a.source) + '</li>';
  });
  const norme = p.norme.map(function (a) {
    return '<li>' + composantCourtHtml(a.source) + vers +
           '<span class="compo-ref">' + esc(a.cible.reference || 'référence non précisée') + '</span></li>';
  });
  const fonction = p.fonction.map(function (a) {
    return '<li>' + composantCourtHtml(a.source) + vers +
           '<span class="compo-norme">' + esc(a.cible.norme || 'norme non précisée') + '</span>' +
           (a.cible.reference ? '<span class="compo-ref">' + esc(a.cible.reference) + '</span>' : '') +
           '</li>';
  });
  const aucun = p.aucun.map(function (c) { return '<li>' + composantCourtHtml(c) + '</li>'; });
  const enPlus = (critere.enPlus || []).map(function (c) { return '<li>' + composantCourtHtml(c) + '</li>'; });

  return '<div class="paliers">' +
    palierHtml('palier-reference', 'Référence exacte', 'même modèle', reference) +
    palierHtml('palier-norme', 'Même norme', 'autre référence, interchangeable sous réserve', norme) +
    palierHtml('palier-fonction', 'Même fonction', 'norme différente, à requalifier', fonction) +
    palierHtml('palier-aucun', 'Sans équivalent', 'absent de la cible', aucun) +
    palierHtml('palier-plus', 'Présents en plus sur la cible', 'sans contrepartie', enPlus) +
  '</div>';
}

function critereHtml(critere) {
  const etat = SIGNE_ETAT[critere.etat] || SIGNE_ETAT.indisponible;
  const horsCalcul = critere.etat === ETAT.INDISPONIBLE;

  let html = '<div class="critere ' + (horsCalcul ? 'critere-hors' : '') + '">' +
    '<span class="critere-signe ' + etat.classe + '" aria-label="' + etat.libelle + '">' +
      etat.signe + '</span>' +
    '<div class="critere-corps">' +
      '<div class="critere-tete">' +
        '<b>' + esc(critere.libelle) + '</b>' +
        (horsCalcul
          ? '<span class="critere-part critere-part-hors">non comparable</span>'
          : '<span class="critere-part">' + critere.part + ' % du score</span>') +
      '</div>' +
      (critere.message ? '<div class="critere-message">' + esc(critere.message) + '</div>' : '') +
      (horsCalcul ? '' :
        '<div class="critere-jauge" role="img" aria-label="' +
          Math.round(critere.rendement * 100) + ' % de ce critère">' +
          '<span class="' + etat.classe + '" style="width:' +
            Math.round(critere.rendement * 100) + '%"></span>' +
        '</div>') +
    '</div>' +
  '</div>';

  if (critere.paliers) html += paliersHtml(critere);
  else if (critere.ensembles) {
    html += '<div class="ensembles">' +
      listeEnsembleHtml('En commun', critere.ensembles.communs, 'ensemble-ok') +
      listeEnsembleHtml('Absents de la cible', critere.ensembles.manquants, 'ensemble-manquant') +
      listeEnsembleHtml('Présents en plus', critere.ensembles.enPlus, 'ensemble-plus') +
    '</div>';
  }
  return html;
}

function scoreHtml(score) {
  const teinte = score >= 75 ? 'score-fort' : (score >= 40 ? 'score-moyen' : 'score-faible');
  return '<div class="score ' + teinte + '"><b>' + score + '<small>%</small></b></div>';
}

function resultatHtml(titre, sousTitreHtml, r, actions) {
  // On NOMME les critères qu'on n'a pas pu comparer, au lieu d'annoncer un
  // pourcentage de couverture que personne ne sait interpréter.
  const alerte = r.nonComparables && r.nonComparables.length
    ? '<p class="alerte-manquant">Non comparé, faute de donnée : <b>' +
      esc(r.nonComparables.join(', ')) + '</b>. Le score porte sur le reste.</p>'
    : '';
  return '<article class="resultat">' +
    '<header class="resultat-tete">' +
      '<div>' +
        '<h4>' + esc(titre) + '</h4>' +
        '<p class="resultat-sous">' + sousTitreHtml + '</p>' +
      '</div>' +
      scoreHtml(r.score) +
    '</header>' +
    alerte +
    (actions || '') +
    '<div class="criteres">' + r.criteres.map(critereHtml).join('') + '</div>' +
  '</article>';
}

/**
 * Le rappel de la pondération en tête du classement. Le bouton ouvre le
 * rail de réglages à gauche — et le referme.
 */
function barreReglageHtml(portee, libellePortee) {
  const p = porteeParCle(portee);
  const detail = porteeArbitrable(p)
    ? criteresActifs(portee).map(function (c) {
        return esc(c.libelle) + ' ' + (Number(Store.poids[portee][c.cle]) || 0) + ' %';
      }).join(' · ')
    : 'critère unique : ' + esc(p.criteres.length ? p.criteres[0].libelle : '—');
  const ouvert = typeof railOuvert === 'function' && railOuvert();

  return '<div class="rappel-reglages">' +
    '<div class="rappel-texte">' +
      '<b>Pondération ' + esc(libellePortee) + '</b>' +
      '<span>' + detail + '</span>' +
    '</div>' +
    '<button type="button" class="btn-accent btn-reglage"' +
      dataAttrs({ action: 'ouvrir-reglages', portee: portee }) + '>' +
      '<span aria-hidden="true">⚙</span> ' +
      (ouvert ? 'Masquer les réglages' : 'Régler les critères') + '</button>' +
  '</div>';
}

function aucunResultatHtml(quoi, portee) {
  return '<div class="etat-vide">' +
    '<p>Aucune équivalence au-dessus de ' + seuil() + ' %.</p>' +
    '<p class="etat-vide-aide">' + esc(quoi) + '</p>' +
    '<button type="button" class="btn-mini"' +
      dataAttrs({ action: 'ouvrir-reglages', portee: portee }) +
      '>Baisser le seuil ou ajuster les critères</button>' +
  '</div>';
}

// ------------------------------------------------------------
// Rendu du classement (sans ouvrir la modale)
// ------------------------------------------------------------
function rendreEquivalencesBoite(pn) {
  const resultats = equivalencesBoite(pn);
  definirTexte('compareTitle', 'Équivalences de ' + txt(pn));
  definirTexte('compareSousTitre', resultats.length + ' boîte(s) au-dessus du seuil');
  definirHtml('compareResult',
    barreReglageHtml('boite', 'Boîte') +
    (resultats.length
      ? resultats.map(function (r) {
          return resultatHtml(txt(r.cible[CLE_PN()]),
            'Fonction : <b>' + esc(txt(r.cible['Fonction'])) + '</b>', r,
            '<div class="resultat-actions">' +
              '<button type="button" class="btn-mini"' +
              dataAttrs({ action: 'ouvrir-fiche-depuis-compare', pn: r.cible[CLE_PN()] }) +
              '>Ouvrir cette fiche</button></div>');
        }).join('')
      : aucunResultatHtml('Essayez une autre boîte, ou assouplissez la pondération.', 'boite')));
}

function rendreEquivalencesNom(id) {
  const source = nomParId(id);
  if (!source) return;
  const type = typeDe(source);
  const resultats = equivalencesSousEnsemble(id);

  definirTexte('compareTitle', txt(source['PN du type'], type.libelle));
  definirTexte('compareSousTitre',
    type.libelle + ' · ' + resultats.length + ' pièce(s) comparable(s) au-dessus du seuil');
  definirHtml('compareResult',
    barreReglageHtml(type.cle, type.libelle) +
    (resultats.length
      ? resultats.map(function (r) {
          return resultatHtml(txt(r.cible['PN du type'], 'sans PN'),
            'Dans <b>' + esc(txt(r.cible[CLE_PN()])) + '</b> · ' + esc(r.fonctionParent), r,
            '<div class="resultat-actions">' +
              '<button type="button" class="btn-mini"' +
              dataAttrs({ action: 'ouvrir-fiche-depuis-compare', pn: r.cible[CLE_PN()] }) +
              '>Ouvrir la boîte</button></div>');
        }).join('')
      : aucunResultatHtml('Seules les pièces du même type sont comparées : ' +
                          type.libelle.toLowerCase() + '.', type.cle)));
}

// ------------------------------------------------------------
// Ouverture
// ------------------------------------------------------------
/** Le rail suit la portée de la comparaison affichée, s'il est ouvert. */
function alignerRail(portee) {
  if (typeof railOuvert !== 'function' || !railOuvert()) return;
  if (porteeReglee !== portee) { porteeReglee = portee; rendreReglages(); }
}

function afficherEquivalencesBoite(pn) {
  Store.comparaison = { sorte: 'boite', cle: pn, portee: 'boite' };
  alignerRail('boite');
  rendreEquivalencesBoite(pn);
  ouvrirModal('compareModal');
}

function afficherEquivalencesNom(id) {
  const source = nomParId(id);
  if (!source) return;
  Store.idNomCourant = id;
  const type = typeDe(source);
  Store.comparaison = { sorte: 'nom', cle: id, portee: type.cle };
  alignerRail(type.cle);
  rendreEquivalencesNom(id);
  ouvrirModal('compareModal');
}

/** Recalcul sans rouvrir : appelé quand une pondération bouge. */
function rafraichirComparaison() {
  if (!Store.comparaison) return;
  const c = Store.comparaison;
  const ouvert = parId('compareModal') && parId('compareModal').classList.contains('show');
  if (!ouvert) return;   // rien à recalculer si la comparaison n'est pas à l'écran
  if (c.sorte === 'boite') rendreEquivalencesBoite(c.cle);
  else rendreEquivalencesNom(c.cle);
}
</script>
