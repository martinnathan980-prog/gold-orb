<script>
// ============================================================
// NEXUS PLM — grille, onglets, filtres, indicateurs.
// Les fonctions *Html construisent une chaîne et ne touchent pas au DOM :
// c'est ce qui les rend testables, échappement compris.
// ============================================================

function statutSurPhotoHtml(statut) {
  const t = txt(statut, '');
  if (!t) return '';
  return '<span class="carte-statut ' + classeStatut(t) + '">' + esc(t) + '</span>';
}

function ongletsHtml(vue) {
  let html = '<button type="button" class="onglet' + (vue.onglet === 'Toutes' ? ' actif' : '') + '"' +
             dataAttrs({ action: 'changer-onglet', onglet: 'Toutes' }) +
             '>Toutes <span class="onglet-compte">' + vue.visibles.length + '</span></button>';
  Array.from(vue.parFonction.keys()).sort(function (a, b) { return a.localeCompare(b, 'fr'); })
    .forEach(function (fonction) {
      html += '<button type="button" class="onglet' +
              (vue.onglet === fonction ? ' actif' : '') + '"' +
              dataAttrs({ action: 'changer-onglet', onglet: fonction }) + '>' +
              esc(fonction) + ' <span class="onglet-compte">' +
              vue.parFonction.get(fonction).length + '</span></button>';
    });
  return html;
}

function filtresTypeHtml() {
  const repartition = repartitionTypes();
  if (!repartition.length) return '';
  return '<div class="filtres-type" role="group" aria-label="Filtrer par type de sous-ensemble">' +
    repartition.map(function (e) {
      const actif = Store.filtreTypes.indexOf(e.type.cle) !== -1;
      return '<button type="button" class="jeton ' + e.type.teinte + (actif ? ' actif' : '') + '"' +
             dataAttrs({ action: 'basculer-type', type: e.type.cle }) +
             ' aria-pressed="' + actif + '">' + esc(e.type.libelle) +
             ' <span class="jeton-compte">' + e.nombre + '</span></button>';
    }).join('') +
  '</div>';
}

/**
 * Boîtes ou pièces : deux façons de lire la même base. La grille répond
 * « que contient cette boîte », l'inventaire « où sert cette pièce ».
 */
function selecteurVueHtml() {
  if (Store.espace !== 'boites') return '';
  return '<div class="choix-vue" role="group" aria-label="Lecture de la base">' +
    [['boites', 'Boîtes'], ['pieces', 'Sous-ensembles'],
     ['standardisation', 'Standardisation']].map(function (v) {
      const actif = Store.vueMode === v[0];
      return '<button type="button" class="onglet-vue' + (actif ? ' actif' : '') + '"' +
             dataAttrs({ action: 'changer-vue', vue: v[0] }) +
             ' aria-pressed="' + actif + '">' + esc(v[1]) + '</button>';
    }).join('') +
  '</div>';
}

/**
 * LE SÉLECTEUR D'ESPACE
 * Deux bases, pas deux vues : les boîtes d'un côté, les composants de
 * l'autre. Elles ne se filtrent pas pareil et ne répondent pas aux mêmes
 * questions — il faut que ça se voie avant de cliquer.
 */
function selecteurEspaceHtml() {
  const espaces = [
    { cle: 'boites', libelle: 'Boîtes', icone: '◼',
      aide: 'assemblages, sous-ensembles, standardisation' },
    { cle: 'composants', libelle: 'Composants', icone: '⬡',
      aide: 'le référentiel des pièces montées' }
  ];
  return '<div class="choix-espace" role="tablist" aria-label="Base consultée">' +
    espaces.map(function (e) {
      const actif = Store.espace === e.cle;
      return '<button type="button" role="tab" class="espace' + (actif ? ' actif' : '') + '"' +
        dataAttrs({ action: 'changer-espace', espace: e.cle }) +
        ' aria-selected="' + actif + '">' +
        '<span class="espace-icone" aria-hidden="true">' + e.icone + '</span>' +
        '<span class="espace-texte">' +
          '<span class="espace-nom">' + esc(e.libelle) + '</span>' +
          '<span class="espace-aide">' + esc(e.aide) + '</span>' +
        '</span>' +
      '</button>';
    }).join('') +
  '</div>';
}

/** L'inventaire des sous-ensembles : une ligne par PN, les boîtes qui le montent. */
function piecesHtml(vue) {
  const pieces = inventairePieces(vue.aAfficher);
  if (!pieces.length) {
    return '<div class="etat-vide">' +
      '<p>Aucun sous-ensemble à inventorier.</p>' +
      '<p class="etat-vide-aide">Les sous-ensembles sans PN ne sont pas suivis.</p>' +
    '</div>';
  }

  return '<div class="inventaire">' +
    '<div class="inventaire-entete">' +
      '<span>Sous-ensemble</span><span>Type</span><span>Réemploi</span><span>Monté dans</span>' +
    '</div>' +
    pieces.map(function (p) {
      const partagee = p.nombre > 1;
      return '<div class="piece' + (partagee ? ' piece-partagee' : '') + '">' +
        '<span class="piece-pn">' + esc(p.pn) + '</span>' +
        '<span class="piece-type ' + p.type.teinte + '">' +
          '<span aria-hidden="true">' + p.type.icone + '</span> ' + esc(p.type.libelle) + '</span>' +
        '<span class="piece-compte' + (partagee ? ' piece-compte-fort' : '') + '">' +
          (partagee ? p.nombre + ' boîtes' : '1 boîte') + '</span>' +
        '<span class="piece-boites">' +
          p.boites.map(function (pn) {
            return '<button type="button" class="usage-lien"' +
                   dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
          }).join('') +
        '</span>' +
      '</div>';
    }).join('') +
  '</div>';
}

// ============================================================
// ESPACE COMPOSANTS — une base à part, avec ses propres filtres
// ============================================================

/** La bande de tête : ce que contient la base, et ce qui y cloche. */
function bandeComposantsHtml(bilan, total) {
  const mesure = function (n, libelle, aide, classe, action, valeur) {
    const actif = action && Store.compo[action.champ] === valeur;
    const corps =
      '<span class="cb-n">' + n + '</span>' +
      '<span class="cb-libelle">' + esc(libelle) + '</span>' +
      (aide ? '<span class="cb-aide">' + esc(aide) + '</span>' : '');
    if (!action) return '<div class="cb-mesure ' + (classe || '') + '">' + corps + '</div>';
    return '<button type="button" class="cb-mesure cb-cliquable ' + (classe || '') +
      (actif ? ' actif' : '') + '"' +
      dataAttrs({ action: 'filtrer-composants', champ: action.champ, valeur: actif ? '' : valeur }) +
      ' aria-pressed="' + actif + '">' + corps + '</button>';
  };

  return '<div class="compo-bande">' +
    mesure(bilan.references, 'références', total !== bilan.references
             ? 'sur ' + total + ' au total' : 'dans la base', 'cb-total') +
    mesure(bilan.fonctions, 'fonctions', 'services rendus') +
    mesure(bilan.normes, 'normes', 'référentiels cités') +
    mesure(bilan.montages, 'montages', 'occurrences réelles') +
    mesure(bilan.isoles, 'montée une fois', 'appro isolé', 'cb-ambre',
           { champ: 'emploi' }, 'isole') +
    mesure(bilan.hors, 'hors catalogue', 'non maîtrisées', 'cb-rouge',
           { champ: 'etat' }, ETAT_COMPOSANT.HORS) +
    mesure(bilan.dormants, 'jamais montées', 'au catalogue seul', 'cb-doux',
           { champ: 'etat' }, ETAT_COMPOSANT.DORMANT) +
  '</div>';
}

/** Le rail de gauche : les familles, puis les filtres posés. */
function railComposantsHtml(toutes) {
  const parFamille = {};
  toutes.forEach(function (c) { parFamille[c.categorie] = (parFamille[c.categorie] || 0) + 1; });

  const familles = Object.keys(CATEGORIES_COMPOSANT).map(function (cle) {
    const cat = CATEGORIES_COMPOSANT[cle];
    const actif = Store.compo.famille === cle;
    return '<button type="button" class="cf-famille' + (actif ? ' actif' : '') + '"' +
      dataAttrs({ action: 'filtrer-composants', champ: 'famille', valeur: actif ? '' : cle }) +
      ' aria-pressed="' + actif + '">' +
      '<span class="cf-pastille cf-' + esc(cle) + '" aria-hidden="true"></span>' +
      '<span class="cf-texte">' +
        '<span class="cf-nom">' + esc(cat.libelle) + '</span>' +
        '<span class="cf-aide">' + esc(cat.aide) + '</span>' +
      '</span>' +
      '<span class="cf-n">' + (parFamille[cle] || 0) + '</span>' +
    '</button>';
  }).join('');

  return '<aside class="compo-rail" aria-label="Familles de composants">' +
    '<h3 class="compo-rail-titre">Familles</h3>' +
    '<div class="cf-liste">' + familles + '</div>' +
    (filtreComposantActif()
      ? '<button type="button" class="cf-effacer"' +
        dataAttrs({ action: 'effacer-filtres-composants' }) + '>Tout réafficher</button>'
      : '') +
  '</aside>';
}

/** Une référence : la ligne la plus fine de la base. */
function ligneReferenceHtml(c, maxi) {
  const part = c.nbBoites ? Math.max(5, Math.round((c.nbBoites / (maxi || 1)) * 100)) : 0;
  const etat = c.etat === ETAT_COMPOSANT.HORS
    ? '<span class="cr-etat cr-hors" title="Monté mais absent du catalogue">hors catalogue</span>'
    : c.etat === ETAT_COMPOSANT.DORMANT
      ? '<span class="cr-etat cr-dormant" title="Au catalogue, monté nulle part">jamais montée</span>'
      : '';

  return '<div class="cr-ligne' + (c.nbBoites === 1 ? ' cr-isole' : '') + '">' +
    '<span class="cr-ref">' + esc(txt(c.reference, 'sans référence')) + '</span>' +
    '<span class="cr-designation">' + (c.designation ? esc(c.designation) : '<span class="vide">—</span>') + etat + '</span>' +
    '<span class="cr-emploi">' +
      (c.nbBoites
        ? '<span class="cr-jauge" aria-hidden="true"><span style="width:' + part + '%"></span></span>' +
          '<button type="button" class="cr-compte"' +
            dataAttrs({ action: 'deplier-composant' }) + ' aria-expanded="false"' +
            ' title="Voir les boîtes qui la montent">' +
            c.nbBoites + (c.nbBoites > 1 ? ' boîtes' : ' boîte') +
            (c.montages > c.nbBoites ? ' · ' + c.montages + ' montages' : '') +
          '</button>' +
          '<span class="cr-boites" hidden>' +
            c.boites.map(function (pn) {
              return '<button type="button" class="usage-lien"' +
                     dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
            }).join('') +
          '</span>'
        : '<span class="cr-jamais">non montée</span>') +
    '</span>' +
    '<span class="cr-porteurs">' +
      (c.porteurs.length
        ? c.porteurs.map(function (p) {
            return '<span class="puce-porteur puce-porteur-mini">' + esc(p) + '</span>';
          }).join('')
        : '<span class="vide">—</span>') +
    '</span>' +
  '</div>';
}

/** Une norme et ses références. */
function blocNormeHtml(norme, maxi) {
  const n = norme.lignes.length;
  return '<div class="cn-bloc' + (norme.dispersee ? ' cn-dispersee' : '') + '">' +
    '<div class="cn-tete">' +
      '<span class="cn-nom">' + esc(norme.libelle) + '</span>' +
      '<span class="cn-compte">' + n + (n > 1 ? ' références' : ' référence') + '</span>' +
      (norme.dispersee
        ? '<span class="cn-alerte" title="Plusieurs références montées sous la même norme">' +
          'dispersée</span>'
        : '') +
    '</div>' +
    '<div class="cn-references">' +
      '<div class="cr-entete"><span>Référence</span><span>Désignation</span>' +
        '<span>Emploi</span><span>Porteurs</span></div>' +
      norme.lignes.map(function (l) { return ligneReferenceHtml(l, maxi); }).join('') +
    '</div>' +
  '</div>';
}

/** Une fonction et ses normes. C'est le niveau auquel on cherche. */
// Tout ouvrir fait un mur ; tout replier ouvre sur une page vide. On ouvre
// donc les premières — ce sont les plus montées, elles sont triées ainsi — et
// on replie la traîne, qu'on déplie quand on la cherche.
const FONCTIONS_OUVERTES = 5;

function blocFonctionHtml(fonction, maxi, cleFamille, replieParDefaut) {
  const id = cleFamille + '::' + normaliserTexte(fonction.libelle);
  const choisi = Store.compo.deplies[id];
  const ouvert = choisi === undefined ? !replieParDefaut : choisi !== false;

  return '<section class="cfo-bloc' + (ouvert ? '' : ' replie') + '">' +
    '<button type="button" class="cfo-tete"' +
      dataAttrs({ action: 'basculer-fonction', fonction: id }) +
      ' aria-expanded="' + ouvert + '">' +
      '<span class="cfo-chevron" aria-hidden="true">' + (ouvert ? '▾' : '▸') + '</span>' +
      '<span class="cfo-nom">' + esc(fonction.libelle) + '</span>' +
      '<span class="cfo-chiffres">' +
        '<b>' + fonction.references + '</b> réf.' +
        ' · <b>' + fonction.normes.length + '</b> norme' + (fonction.normes.length > 1 ? 's' : '') +
        ' · <b>' + fonction.nbBoites + '</b> boîte' + (fonction.nbBoites > 1 ? 's' : '') +
      '</span>' +
      (fonction.dispersee
        ? '<span class="cfo-alerte" title="Plusieurs références pour le même service">à ranger</span>'
        : '') +
    '</button>' +
    (ouvert
      ? '<div class="cfo-corps">' +
          fonction.normes.map(function (n) { return blocNormeHtml(n, maxi); }).join('') +
        '</div>'
      : '') +
  '</section>';
}

/** L'espace Composants au complet. */
function composantsHtml(vue) {
  const toutes = baseComposants(vue.aAfficher);
  const retenues = composantsFiltres(vue.aAfficher);
  const bilan = bilanComposants(retenues);
  const arbre = arbreComposants(retenues);
  const maxi = retenues.reduce(function (m, c) { return Math.max(m, c.nbBoites); }, 1);

  const nbFonctions = arbre.reduce(function (t, f) { return t + f.fonctions.length; }, 0);

  // Le rang d'une fonction dans l'arbre décide de son état par défaut. Quand
  // un filtre a déjà réduit la liste, on ouvre tout : on l'a demandée.
  const rangs = {};
  let rang = 0;
  arbre.forEach(function (f) {
    f.fonctions.forEach(function (fo) {
      rangs[f.cle + '::' + normaliserTexte(fo.libelle)] = rang++;
    });
  });
  const replieParRang = function (id) {
    return nbFonctions > FONCTIONS_OUVERTES && rangs[id] >= FONCTIONS_OUVERTES;
  };
  const estOuverte = function (id) {
    const choisi = Store.compo.deplies[id];
    return choisi === undefined ? !replieParRang(id) : choisi !== false;
  };
  const ouvertes = Object.keys(rangs).filter(estOuverte).length;

  const barre = arbre.length
    ? '<div class="compo-barre">' +
        '<span class="compo-barre-compte">' +
          nbFonctions + ' fonction' + (nbFonctions > 1 ? 's' : '') +
          ' · ' + retenues.length + ' référence' + (retenues.length > 1 ? 's' : '') +
        '</span>' +
        '<button type="button" class="compo-barre-btn"' +
          dataAttrs({ action: 'deplier-tout-composants',
                      ouvrir: String(ouvertes < nbFonctions) }) + '>' +
          (ouvertes < nbFonctions ? 'Tout déplier' : 'Tout replier') +
        '</button>' +
      '</div>'
    : '';

  const corps = arbre.length
    ? arbre.map(function (f) {
        return '<section class="cfa-bloc">' +
          '<header class="cfa-tete">' +
            '<span class="cf-pastille cf-' + esc(f.cle) + '" aria-hidden="true"></span>' +
            '<h2 class="cfa-nom">' + esc(f.libelle) + '</h2>' +
            '<span class="cfa-chiffres">' +
              f.references + ' référence' + (f.references > 1 ? 's' : '') +
              ' · ' + f.fonctions.length + ' fonction' + (f.fonctions.length > 1 ? 's' : '') +
              ' · ' + f.montages + ' montage' + (f.montages > 1 ? 's' : '') +
            '</span>' +
          '</header>' +
          f.fonctions.map(function (fo) {
            const id = f.cle + '::' + normaliserTexte(fo.libelle);
            return blocFonctionHtml(fo, maxi, f.cle, replieParRang(id));
          }).join('') +
        '</section>';
      }).join('')
    : '<div class="etat-vide">' +
        '<p>Aucun composant ne correspond.</p>' +
        '<p class="etat-vide-aide">' +
        (filtreComposantActif()
          ? 'Relâchez un filtre, ou réaffichez tout.'
          : 'Renseignez le catalogue et les composants des boîtes.') +
        '</p>' +
      '</div>';

  return bandeComposantsHtml(bilan, toutes.length) +
    '<div class="compo-corps">' +
      railComposantsHtml(toutes) +
      '<div class="compo-arbre">' + barre + corps + '</div>' +
    '</div>';
}

/**
 * Les opportunités de rationalisation. Une famille = une catégorie et une
 * fonction. Quand elle porte plusieurs normes, ou plusieurs références sous
 * une même norme, c'est autant de pièces à faire vivre pour le même service.
 */
function standardisationHtml(vue) {
  const familles = opportunitesStandardisation(vue.aAfficher);

  if (!familles.length) {
    return '<div class="etat-vide">' +
      '<p>Rien à standardiser.</p>' +
      '<p class="etat-vide-aide">Chaque fonction est servie par une seule ' +
      'référence, ou il n\'y a pas encore de composant à analyser.</p>' +
    '</div>';
  }

  return '<p class="standard-intro">' + familles.length +
      ' famille(s) servies par plusieurs références. Les plus dispersées ' +
      'd\'abord : ce sont elles qui coûtent le plus à faire vivre. ' +
      'Cliquez une référence pour voir où elle sert.' +
    '</p>' +
    '<div class="familles">' + familles.map(familleHtml).join('') + '</div>';
}

/** Une référence, dépliable sur la liste des boîtes où elle sert. */
function referenceHtml(r, majoritaire) {
  return '<span class="ref-bloc">' +
    '<button type="button" class="ref' + (majoritaire ? ' ref-majoritaire' : '') + '"' +
      dataAttrs({ action: 'deplier-reference' }) + ' aria-expanded="false"' +
      ' title="Voir les boîtes concernées">' +
      '<span class="ref-pn">' + esc(r.reference || 'référence non précisée') + '</span>' +
      '<span class="ref-usage">' + r.nbBoites + (r.nbBoites > 1 ? ' boîtes' : ' boîte') + '</span>' +
    '</button>' +
    '<span class="ref-boites" hidden>' +
      r.boites.map(function (pn) {
        return '<button type="button" class="usage-lien"' +
               dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>' + esc(pn) + '</button>';
      }).join('') +
    '</span>' +
  '</span>';
}

function familleHtml(f) {
  const cat = CATEGORIES_COMPOSANT[f.categorie] || CATEGORIES_COMPOSANT.composant;
  // La référence la plus répandue est le candidat naturel à la cible.
  let meilleure = null;
  f.normes.forEach(function (n) {
    n.references.forEach(function (r) {
      if (!meilleure || r.nbBoites > meilleure.nbBoites) meilleure = r;
    });
  });

  return '<article class="famille">' +
    '<header class="famille-tete">' +
      '<div class="famille-identite">' +
        '<h3 class="famille-nom">' + esc(f.fonction) + '</h3>' +
        '<span class="famille-cat">' + esc(cat.libelle) + '</span>' +
      '</div>' +
      '<div class="famille-compte">' +
        '<span class="famille-chiffre' + (f.nbNormes > 1 ? ' famille-disperse' : '') + '">' +
          '<b>' + f.nbNormes + '</b> norme' + (f.nbNormes > 1 ? 's' : '') + '</span>' +
        '<span class="famille-chiffre famille-disperse">' +
          '<b>' + f.nbReferences + '</b> références</span>' +
      '</div>' +
    '</header>' +
    '<ul class="famille-normes">' + f.normes.map(function (n) {
      return '<li class="famille-norme">' +
        '<span class="norme-nom">' + esc(n.norme || 'norme non précisée') + '</span>' +
        '<span class="norme-refs">' + n.references.map(function (r) {
          return referenceHtml(r, meilleure && r === meilleure && f.nbReferences > 1);
        }).join('') + '</span>' +
      '</li>';
    }).join('') + '</ul>' +
  '</article>';
}

/** Le tri : un menu discret, pas un <select> planté au milieu de la page. */
function triHtml() {
  const courant = TRIS[Store.tri] || TRIS.pn;
  return '<div class="tri">' +
    '<button type="button" class="tri-bouton" id="triBouton" aria-haspopup="true"' +
      ' aria-expanded="false"' + dataAttrs({ action: 'basculer-tri' }) + '>' +
      esc(courant.libelle) + ' <span aria-hidden="true">▾</span></button>' +
    '<div class="tri-menu" id="triMenu" hidden role="menu">' +
      Object.keys(TRIS).map(function (k) {
        return '<button type="button" class="tri-option' + (Store.tri === k ? ' actif' : '') + '"' +
               ' role="menuitem"' + dataAttrs({ action: 'choisir-tri', tri: k }) + '>' +
               esc(TRIS[k].libelle) + '</button>';
      }).join('') +
    '</div>' +
  '</div>';
}

/** Composition : une barre empilée aux couleurs des types, puis la légende. */
function compositionHtml(boite) {
  const lignes = boite.nomenclature || [];
  if (!lignes.length) return '<p class="carte-vide">Boîte vide</p>';

  const compte = new Map();
  lignes.forEach(function (l) {
    const t = typeDe(l);
    compte.set(t.cle, (compte.get(t.cle) || 0) + 1);
  });

  const barre = Array.from(compte.entries()).map(function (e) {
    const part = (e[1] / lignes.length) * 100;
    return '<span class="compo-' + e[0] + '" style="width:' + part.toFixed(1) + '%"></span>';
  }).join('');

  const legende = Array.from(compte.entries()).map(function (e) {
    const t = typeParCle(e[0]);
    return '<li class="' + t.teinte + '">' + esc(t.libelle) + ' <b>' + e[1] + '</b></li>';
  }).join('');

  return '<div class="compo-barre" role="img" aria-label="' + lignes.length +
         ' sous-ensembles">' + barre + '</div>' +
         '<ul class="composition">' + legende + '</ul>';
}

function carteHtml(boite) {
  const pn = boite[CLE_PN()];
  const url = urlMiniature(boite['Image']);

  const visuel = url
    ? '<img class="carte-image" src="' + esc(url) + '" alt="Photo de ' + esc(txt(pn)) + '" loading="lazy">'
    : '<div class="carte-image carte-image-absente">' +
        '<span class="absente-icone" aria-hidden="true">⌷</span>' +
        '<span class="absente-texte">Pas de photo</span>' +
      '</div>';

  return '<article class="carte">' +
    '<div class="carte-media">' +
      '<button type="button" class="carte-visuel"' +
        dataAttrs({ action: 'ouvrir-fiche', pn: pn }) +
        ' aria-label="Ouvrir la fiche de ' + esc(txt(pn)) + '">' + visuel + '</button>' +
      statutSurPhotoHtml(boite['Statut']) +
    '</div>' +
    '<div class="carte-corps">' +
      '<div class="carte-tete">' +
        '<h3 class="carte-pn">' + esc(txt(pn)) + '</h3>' +
        '<span class="carte-fonction">' + esc(txt(boite['Fonction'], 'Non classé')) + '</span>' +
      '</div>' +
      compositionHtml(boite) +
      '<dl class="carte-meta">' +
        '<dt>DS/VCI</dt><dd>' + esc(txt(boite['DS/VCI Associé'])) + '</dd>' +
        '<dt>Porteur</dt><dd>' + esc(txt(valeursMulti(boite['Porteur']).join(', '))) + '</dd>' +
      '</dl>' +
      '<div class="carte-actions">' +
        '<button type="button" class="btn-principal"' +
          dataAttrs({ action: 'ouvrir-fiche', pn: pn }) + '>Fiche complète</button>' +
        '<button type="button" class="btn-accent"' +
          dataAttrs({ action: 'comparer-boite', pn: pn }) + '>Équivalences</button>' +
      '</div>' +
    '</div>' +
  '</article>';
}

function grilleHtml(vue) {
  if (vue.aAfficher.length) return vue.aAfficher.map(carteHtml).join('');
  return '<div class="etat-vide">' +
    '<p>' + (vue.filtre ? 'Aucune boîte ne correspond à cette recherche.'
                        : 'Aucune boîte enregistrée.') + '</p>' +
    (vue.filtre
      ? '<button type="button" class="btn-mini" data-action="tout-effacer">Effacer les filtres</button>'
      : '<button type="button" class="btn-principal" data-action="nouvelle-boite">' +
        'Créer la première boîte</button>') +
  '</div>';
}

function rendreInterface() {
  const vue = calculerVue();
  const composants = Store.espace === 'composants';
  const mode = composants ? 'composants' : Store.vueMode;

  definirHtml('zoneEspace', selecteurEspaceHtml());
  document.body.classList.toggle('espace-composants', composants);

  // L'espace Composants a ses propres filtres : ceux des boîtes ne s'y
  // appliquent pas, et les afficher laisserait croire le contraire.
  definirHtml('functionTabs', composants ? '' : ongletsHtml(vue));
  definirHtml('filtresType', composants ? '' : filtresTypeHtml());
  definirHtml('zoneVue', selecteurVueHtml());
  definirHtml('zoneTri', (!composants && mode === 'boites') ? triHtml() : '');

  const recherche = parId('searchBar');
  if (recherche) {
    recherche.placeholder = composants
      ? 'Rechercher une fonction, une norme, une référence…'
      : 'Rechercher un PN, une fonction, une référence, un mot-clé…';
    const attendue = composants ? Store.compo.recherche : Store.recherche;
    if (recherche.value !== attendue) recherche.value = attendue;
  }

  const contenant = parId('mainContainer');
  if (contenant) contenant.classList.toggle('grille', !composants && mode === 'boites');
  definirHtml('mainContainer',
    composants ? composantsHtml(vue) :
    mode === 'pieces' ? piecesHtml(vue) :
    mode === 'standardisation' ? standardisationHtml(vue) : grilleHtml(vue));

  if (composants) {
    const n = composantsFiltres(vue.aAfficher).length;
    definirTexte('bilanResultats',
                 n + (n > 1 ? ' références' : ' référence'));
  } else if (mode === 'pieces') {
    const n = inventairePieces(vue.aAfficher).length;
    definirTexte('bilanResultats',
                 n + (n > 1 ? ' sous-ensembles distincts' : ' sous-ensemble'));
  } else if (mode === 'standardisation') {
    const n = opportunitesStandardisation(vue.aAfficher).length;
    definirTexte('bilanResultats',
                 n + (n > 1 ? ' familles dispersées' : ' famille dispersée'));
  } else {
    definirTexte('bilanResultats', vue.aAfficher.length +
                 (vue.aAfficher.length > 1 ? ' boîtes' : ' boîte'));
  }
  rendreKpi(calculerKpi(vue.aAfficher), vue);
  rendreFiltreActif(vue);
  const chargement = parId('loading');
  if (chargement) chargement.hidden = true;
}

function rendreKpi(kpi, vue) {
  const filtre = !!(vue && vue.filtre);
  definirTexte('kpiBoites', String(kpi.nbBoites));
  definirTexte('kpiBoitesDetail', filtre ? 'cliquer pour tout revoir' : 'toute la base');
  definirTexte('kpiVal', kpi.nbValides + ' / ' + kpi.nbBoites);
  definirTexte('kpiValDetail', kpi.pctValides + ' % validées');
  // Compter des PN n'apprenait rien, et melangeait deux niveaux dans un seul
  // nombre. Ce qui compte, c'est ce qu'il reste a ranger.
  const dispersees = opportunitesStandardisation(vue ? vue.aAfficher : []);
  definirTexte('kpiStandard', String(dispersees.length));
  definirTexte('kpiStandardDetail', dispersees.length
    ? 'familles à plusieurs références'
    : 'une norme, une référence partout');
  const ind = parId('indStandard');
  if (ind) ind.setAttribute('aria-pressed', String(Store.vueMode === 'standardisation'));


  // L'indicateur dit s'il filtre en ce moment.
  const marquer = function (id, actif) {
    const el = parId(id);
    if (!el) return;
    el.classList.toggle('actif', !!actif);
    if (el.tagName === 'BUTTON') el.setAttribute('aria-pressed', String(!!actif));
  };
  marquer('indValidees', Store.filtreStatut && normaliserStatut(Store.filtreStatut) === 'validé');

  const doublons = compterDoublonsProbables(vue ? vue.aAfficher : Store.boites);
  definirTexte('kpiDoublons', doublons.nombre === null ? '—' : String(doublons.nombre));
  // Un « — » sans explication laisse croire qu'il n'y a rien à voir.
  definirTexte('kpiDoublonsDetail', doublons.nombre === null
    ? 'trop de pièces : filtrez d\'abord'
    : 'voir la liste');

}

function rendreFiltreActif(vue) {
  const zone = parId('filtreActif');
  if (!zone) return;
  const morceaux = [];

  Store.filtreComposants.forEach(function (c) {
    morceaux.push('<span class="filtre-jeton">Composant : ' + esc(c) +
      '<button type="button" aria-label="Retirer"' +
      dataAttrs({ action: 'retirer-filtre', valeur: c }) + '>&times;</button></span>');
  });
  Store.filtreTypes.forEach(function (t) {
    morceaux.push('<span class="filtre-jeton">Contient : ' + esc(typeParCle(t).libelle) +
      '<button type="button" aria-label="Retirer"' +
      dataAttrs({ action: 'basculer-type', type: t }) + '>&times;</button></span>');
  });
  if (Store.filtreStatut) {
    morceaux.push('<span class="filtre-jeton">Statut : ' + esc(Store.filtreStatut) +
      '<button type="button" aria-label="Retirer"' +
      dataAttrs({ action: 'filtrer-statut', statut: Store.filtreStatut }) + '>&times;</button></span>');
  }
  if (Store.recherche) {
    morceaux.push('<span class="filtre-jeton">« ' + esc(Store.recherche) + ' »' +
      '<button type="button" aria-label="Effacer la recherche"' +
      dataAttrs({ action: 'effacer-recherche' }) + '>&times;</button></span>');
  }

  zone.innerHTML = morceaux.length
    ? morceaux.join('') +
      '<button type="button" class="btn-lien" data-action="tout-effacer">Tout effacer</button>'
    : '';
}
</script>
