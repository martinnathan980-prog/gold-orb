    sel.innerHTML = CONTRATS.map(function (c) {
      return '<option value="' + ech(c.id) + '">' + ech(c.nom) + '</option>';
    }).join('');
    sel.value = CONTRAT;
    sel.disabled = false;
    $('etat-contrat').textContent = '';
  }

  /* ------------------------------------------------------------
     RYTHME
     La saisie est irrégulière : une semaine on solde un lot entier,
     la suivante rien. Une moyenne sur six semaines mesure donc surtout
     la date du dernier lot, pas la cadence réelle.
     On calcule à la place TOUS les rythmes soutenus observés — depuis le
     premier relevé, depuis le deuxième, etc. jusqu'au dernier intervalle —
     et on en garde l'étendue. Chaque borne est un rythme qui a réellement
     tenu sur une période réelle ; l'écart entre les deux, c'est l'irrégularité
     elle-même, rendue visible au lieu d'être moyennée.
     ------------------------------------------------------------ */
  function rythmes(pts) {
    if (!pts || pts.length < 2) return null;
    var premier = pts[0], dernier = pts[pts.length - 1];
    var semaines = dernier.i - premier.i;
    if (semaines <= 0) return null;
    return {
      central: (dernier.termine - premier.termine) / semaines,
      gagnes: dernier.termine - premier.termine,
      semaines: semaines,
      n: pts.length
    };
  }

  /** Semaine d'arrivée à un rythme donné, ou null si ce rythme ne mène nulle part. */
  function semaineFin(atteint, total, rythme) {
    if (!rythme || rythme <= 0) return null;
    return AUJ + Math.ceil((total - atteint) / rythme);
  }

  /* Ce qui a bougé entre les deux derniers imports. Invisible à l'œil nu
     sur 186 lignes, et c'est pourtant la question de chaque semaine. */
  /* On compte les passages d'un état à l'autre, avec les mots des quatre états :
     « passés en terminé » et non « ont avancé ». */
  /* Les références sont appariées par racine (voir apparier) : un plan réémis
     va dans « changements d'indice », sous sa nouvelle référence — et aussi
     dans le lot de son état d'arrivée s'il en a changé au passage, car il
     est alors bien passé en terminé, ou en cours. Le passage à « vide » n'est
     pas un lot : une cellule effacée n'est pas un progrès à annoncer. */
  function evenementsImport() {
    if (RELEVES.length < 2) return null;
    var avant = RELEVES[RELEVES.length - 2].plans;
    if (!avant || !DERNIER.plans) return null;
    return apparier(avant, DERNIER.plans);
  }
  /* Le comparatif affiché : les mêmes événements, restreints au périmètre. */
  function comparatif() {
    if (!EVENEMENTS_IMPORT) return null;
    var d = { termine: [], encours: [], afaire: [], nouveaux: [], disparus: [], indice: [], reemissions: [] };
    EVENEMENTS_IMPORT.filter(dansPerimetreEvt).forEach(function (e) {
      if (e.type === 'nouveau') { d.nouveaux.push(e.ref); return; }
      if (e.type === 'disparu') { d.disparus.push(e.ref); return; }
      if (estReemission(e)) { d.indice.push(e.ref); d.reemissions.push({ ref: e.ref, ancienne: e.ancienne, type: e.type }); }
      if (e.avant !== e.apres && d[e.apres]) d[e.apres].push(e.ref);
    });
    return d;
  }

  /* ============================================================
     RAPPROCHEMENT AVEC UNE SECONDE BASE
     Une autre base suit les mêmes plans sous une autre structure : d'autres
     intitulés, d'autres conventions d'écriture. La source décrit la
     correspondance — { nom, cleReference, champs: [{ ici, la, titre }],
     lignes } — et la page rapproche les deux par la RACINE d'UD, pour qu'un
     plan réémis d'un côté reste le même plan. Sur chaque paire, les champs
     déclarés se comparent après norm() ; l'avancement, lui, se compare par
     classer(), car « OK », « 100 % » et « Terminé » disent la même chose.
     Sans description dans la source, il n'y a rien à rapprocher et la
     section n'existe pas.
     ============================================================ */
  /* Les lots du rapprochement, dans l'ordre de lecture : d'abord ce qui va,
     puis ce qui diffère, puis ce qui manque de chaque côté. « § » se remplace
     par le nom de la seconde base. `segment` est la classe du segment de la
     barre (et la catégorie de la pastille), `teinte` le trait du bouton
     pressé, `atterrit` la base où le tableau bascule : ce qui n'existe que
     d'un côté y emmène, le reste laisse l'interrupteur où il est. */
  var LOTS_RAPPROCHEMENT = [
    { cle: 'identiques',      libelle: 'identiques',       segment: 'identique', teinte: 'var(--fait)',    atterrit: '' },
    { cle: 'indiceDifferent', libelle: 'autre indice',     segment: 'emission',  teinte: 'var(--encre-3)', atterrit: '' },
    { cle: 'ecarts',          libelle: 'champs différents', segment: 'ecart',    teinte: 'var(--cours)',   atterrit: '' },
    { cle: 'absentsLa',       libelle: 'absents de §',     segment: 'absentLa',  teinte: 'var(--alerte)',  atterrit: 'ici' },
    { cle: 'absentsIci',      libelle: 'seulement dans §', segment: 'seul',      teinte: 'var(--encre-3)', atterrit: 'la' }
  ];
  /* La catégorie d'une ligne de là derrière chaque lot ; null : ces plans
     n'ont pas de ligne là. Et la catégorie d'un plan d'ici (parPlan), une
     seule par plan, pour que les comptes des boutons soient ceux de la barre. */
  var CATEGORIE_PAR_LOT = { identiques: 'identique', indiceDifferent: 'emission', ecarts: 'ecart',
                            absentsLa: null, absentsIci: 'seul' };
  var CATEGORIE_PLAN_PAR_LOT = { identiques: 'identique', indiceDifferent: 'emission', ecarts: 'ecart', absentsLa: 'absentLa' };
  /* Le compte d'un lot : des plans d'ici, une case chacun ; ou des lignes
     que la seconde base est seule à connaître. */
  function compteLotRapp(cle) {
    if (!RAPPROCHEMENT) return 0;
    if (cle === 'absentsIci') return RAPPROCHEMENT.absentsIci.length;
    var cat = CATEGORIE_PLAN_PAR_LOT[cle], n = 0;
    Object.keys(RAPPROCHEMENT.parPlan).forEach(function (ref) { if (RAPPROCHEMENT.parPlan[ref] === cat) n++; });
    return n;
  }
  function nomSeconde() {
    return String((SRC && SRC.rapprochement && SRC.rapprochement.nom) || 'la seconde base');
  }
  function libelleRapp(l) { return l.libelle.replace('§', nomSeconde()); }

  /* La référence d'une ligne de la seconde base : une colonne qui la porte
     entière, ou plusieurs qu'on recompose — NAME (racine), SOL. (solution) et
     Cust.V (indice) dans SEE. Un extract Excel rend volontiers « 1 » pour
     « 001 » : la solution se remet sur trois chiffres, l'indice en capitale. */
  function refDeLigne(rap, l) {
    var cle = rap.cleReference;
    if (!Array.isArray(cle)) return String(l[cle] == null ? '' : l[cle]).trim();
    var parts = cle.map(function (k) { return String(l[k] == null ? '' : l[k]).trim(); });
    if (parts.length === 3) {
      if (/^\d{1,3}$/.test(parts[1])) parts[1] = ('00' + parts[1]).slice(-3);
      parts[2] = parts[2].toUpperCase();
    }
    return parts.join('');
  }
  /* Les cases à cocher d'un extract : TRUE / FALSE, VRAI / FAUX, oui / non… */
  var VRAI = /^(true|vrai|oui|yes|x|✓|☑)$/i, FAUX = /^(false|faux|non|no|☐)$/i;
  function estBooleen(v) { var t = String(v == null ? '' : v).trim(); return VRAI.test(t) || FAUX.test(t); }
  function estVrai(v) { return VRAI.test(String(v == null ? '' : v).trim()); }
  /* Deux valeurs disent-elles la même chose ? L'avancement se compare par
     état ; face à une case à cocher, terminé ici vaut coché là. Deux cases
     se comparent cochée à cochée ; le reste à la lettre près, après norm(). */
  function memeValeur(cle, ici, la) {
    if (cle === COLONNE_SUIVIE) {
      if (estBooleen(la)) return (classer(ici) === 'termine') === estVrai(la);
      return classer(ici) === classer(la);
    }
    if (estBooleen(ici) && estBooleen(la)) return estVrai(ici) === estVrai(la);
    return norm(ici) === norm(la);
  }
  /**
   * Rapproche `plans` (ceux du périmètre) des lignes de la seconde base.
   * Rend null sans description exploitable. Sinon :
   *   identiques      [plan]                     — même émission, mêmes champs ;
   *   indiceDifferent [{ plan, ref_la, type }]   — même plan (racine et
   *                                                 solution), autre indice ;
   *   ecarts          [{ plan, champ, ici, la }] — un champ qui ne dit pas
   *                                                 la même chose des deux côtés ;
   *   absentsLa       [plan]                     — ici, pas là ;
   *   absentsIci      [ligne]                    — là, et aucun plan du
   *                                                 contrat n'a cette racine ;
   *   parPlan         { référence: catégorie }   — une seule catégorie par
   *                                                 plan, pour la jauge ;
   *   lignes          [{ ligne, ref, ud, i, cat, plan, ecarts }] — chaque
   *                   ligne de là avec son verdict, pour le tableau de là.
   */
  function rapprocher(rap, plans) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) return null;
    var champs = (Array.isArray(rap.champs) ? rap.champs : [])
      .filter(function (c) { return c && c.ici && c.la; });
    /* Les lignes de la seconde base par racine : une ligne dont la référence
       est illisible garde sa chaîne entière comme racine, comme ici. */
    var parRacine = Object.create(null), lignes = [];
    rap.lignes.forEach(function (l, i) {
      if (!l || typeof l !== 'object') return;
      var ref = refDeLigne(rap, l), ud = analyserUD(ref);
      var e = { ligne: l, ref: ref, ud: ud, i: i, cat: 'vide', plan: null, ecarts: {} };
      lignes.push(e);
      if (!ud.racine) return;
      (parRacine[clePlan(ud)] = parRacine[clePlan(ud)] || []).push(e);
    });
    var r = { identiques: [], indiceDifferent: [], ecarts: [], absentsLa: [], absentsIci: [],
              parPlan: Object.create(null), lignes: lignes,
              nbPlans: plans.length, nbLignes: rap.lignes.length, total: 0 };
    plans.forEach(function (p) {
      var candidates = parRacine[p._racine];
      if (!candidates) { r.absentsLa.push(p); r.parPlan[p.reference] = 'absentLa'; return; }
      var udIci = analyserUD(p.reference);
      /* Plusieurs lignes de même racine : celle qui porte exactement la même
         émission, sinon la première. */
      var meme = candidates.filter(function (c) { return c.ud.indice === udIci.indice; })[0] || candidates[0];
      var cat = 'identique';
      if (meme.ud.indice !== udIci.indice) {
        r.indiceDifferent.push({ plan: p, ref_la: meme.ref, type: 'indice' });
        cat = 'emission';
      }
      champs.forEach(function (c) {
        var ici = p[c.ici], la = meme.ligne[c.la];
        if (memeValeur(c.ici, ici, la)) return;
        r.ecarts.push({ plan: p, champ: String(c.titre || c.la), ici: ici, la: la });
        meme.ecarts[c.la] = ici;
        if (cat === 'identique') cat = 'ecart';
      });
      if (cat === 'identique') r.identiques.push(p);
      r.parPlan[p.reference] = cat;
      meme.cat = cat; meme.plan = p;
      /* Les autres lignes du même plan : sous un autre indice. */
      candidates.forEach(function (c) { if (c !== meme && !c.plan) { c.cat = 'emission'; c.plan = p; } });
    });
    /* Une ligne n'a pas de domaine : elle est « seulement là » si aucun plan
       du contrat, périmètre ou non, ne porte sa racine et sa solution ; sous un périmètre,
       une ligne d'un plan hors périmètre est simplement hors champ. */
    var racinesIci = Object.create(null);
    PLANS.forEach(function (p) { racinesIci[p._racine] = true; });
    lignes.forEach(function (e) {
      if (e.plan || !e.ud.racine) return;
      if (racinesIci[clePlan(e.ud)]) { e.cat = 'hors'; return; }
      e.cat = 'seul'; r.absentsIci.push(e.ligne);
    });
    /* Les absents d'ici portent sur tout le contrat, jamais sur le seul
       périmètre : ils se comptent à part, pour ne pas mêler les deux. */
    r.totalPerimetre = r.absentsLa.length + r.indiceDifferent.length + r.ecarts.length;
    r.total = r.totalPerimetre + r.absentsIci.length;
    return r;
  }
  /* Les références du tableau derrière un lot : c'est ce que le clic pose en
     sélection — les plans de cette case, une case par plan. */
  function refsDuLotRapprochement(cle) {
    var cat = CATEGORIE_PLAN_PAR_LOT[cle];
    return Object.keys(RAPPROCHEMENT.parPlan).filter(function (ref) { return RAPPROCHEMENT.parPlan[ref] === cat; });
  }
  /* Poser ou retirer un lot : les lots d'ici passent par la sélection du
     tableau, comme les puces du comparatif ; le lot de là ne filtre que le
     tableau de là. Un seul lot à la fois. */
  function poserLotRapp(cle) {
    var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
    if (!lot) return;
    var deja = lotRappActif() === cle;
    if (vue.refsLibelle.indexOf('rapprochement:') === 0) { vue.refs = null; vue.refsLibelle = ''; }
    vue.lotLa = null;
    if (deja) return;
    if (lot.atterrit) vue.base = lot.atterrit;
    if (cle === 'absentsIci') { vue.lotLa = cle; return; }
    vue.refs = {};
    refsDuLotRapprochement(cle).forEach(function (r) { vue.refs[r] = true; });
    vue.refsLibelle = 'rapprochement:' + cle;
  }
  function lotRappActif() {
    if (vue.lotLa) return vue.lotLa;
    return vue.refs && vue.refsLibelle.indexOf('rapprochement:') === 0 ? vue.refsLibelle.slice(14) : null;
  }

  /* ----------------------------------------------------------
     Mémoire locale : cadrage et disposition survivent
     à la fermeture de l'onglet. Elle est globale : la même
     disposition suit le lecteur d'un contrat à l'autre.
     ---------------------------------------------------------- */
  /* Les seules cles de tri acceptees pour le bloc par groupe : une preference
     relue d'un ancien stockage ne doit pas pouvoir injecter n'importe quoi. */
  var TRIS_GROUPE = ['nom', 'total', 'pct', 'requis', 'tension', 'fin'];
  var CLE_PREFS = 'suivi-fwd:v1';
  var minuteurPrefs = null;
  function sauverPrefs() {
    try {
      /* L'ordre mémorisé est celui de la vue complète : en vue essentielle,
         vue.ordre porte « essentielles d'abord », qui n'est pas un ordre à
         rejouer sous « toutes les colonnes » — c'est l'extract, dans l'ordre
         de la feuille, exactement ce que rend appliquerVueTable() au retour. */
      localStorage.setItem(CLE_PREFS, JSON.stringify({
        fen: vue.fen,
        dimCritique: vue.dimCritique,
        ordre: vue.vueTable === 'essentielle' ? ORDRE_FEUILLE.slice() : vue.ordre,
        tri: vue.tri,
        triGroupe: vue.triGroupe
      }));
    } catch (e) { /* navigation privée ou stockage bloqué : sans conséquence */ }
  }
  function planifierSauvegarde() {
    clearTimeout(minuteurPrefs);
    minuteurPrefs = setTimeout(sauverPrefs, 400);
  }
  /* La disposition — dimension, ordre des colonnes du tableau, tris — se relit
     d'un stockage ou d'une vue précédente. Elle est validée contre la source
     courante : une colonne disparue ou une clé inconnue ne passe pas. Les
     colonnes cachées ne sont PAS une préférence : elles ne sont que la
     mécanique de la vue essentielle. Un ancien stockage qui en porte encore
     (« cachees ») est ignoré — rien ne peut masquer une colonne à l'ouverture. */
  function appliquerDisposition(pref) {
    if (pref.dimCritique && CLES_DIM.indexOf(pref.dimCritique) !== -1) vue.dimCritique = pref.dimCritique;
    if (Array.isArray(pref.ordre)) {
      // On ne garde que les colonnes encore presentes, et on ajoute les nouvelles.
      var valides = pref.ordre.filter(function (k) { return PAR_CLE[k]; });
      COLONNES.forEach(function (c) { if (valides.indexOf(c.cle) === -1) valides.push(c.cle); });
      vue.ordre = valides;
    }
    if (pref.tri && PAR_CLE[pref.tri.cle]) vue.tri = { cle: pref.tri.cle, asc: !!pref.tri.asc };
    if (pref.triGroupe && TRIS_GROUPE.indexOf(pref.triGroupe.cle) !== -1) {
      vue.triGroupe = { cle: pref.triGroupe.cle, asc: !!pref.triGroupe.asc };
    }
  }
  function chargerPrefs() {
    try {
      var brut = localStorage.getItem(CLE_PREFS);
      if (!brut) return;
      var pref = JSON.parse(brut);
      if (!pref || typeof pref !== 'object') return;
      /* Un ancien stockage pouvait contenir des jalons : ils ne font plus
         foi, les jalons viennent de la configuration. On les ignore. */
      /* Le cadrage ne se reprend que s'il montre encore aujourd'hui : laissé
         sur le passé, il n'est plus celui qu'on veut à l'ouverture. */
      if (pref.fen && typeof pref.fen.debut === 'number' && typeof pref.fen.span === 'number' &&
          pref.fen.debut <= AUJ && AUJ < pref.fen.debut + pref.fen.span) {
        vue.fen = { debut: pref.fen.debut, span: pref.fen.span };
      }
      appliquerDisposition(pref);
    } catch (e) { /* preferences illisibles : on repart des valeurs par defaut */ }
  }

  /* ============================================================ SELECTION */
  function selection() {
    var q = norm(vue.recherche);
    var cols = Object.keys(vue.filtres).filter(function (k) { return vue.filtres[k]; });
    return PLANS.filter(function (p) {
      if (!dansPerimetre(p)) return false;
      if (vue.etat && p._etat !== vue.etat) return false;
      if (vue.groupe && String(valeurDim(p, vue.groupe.dim)) !== vue.groupe.val) return false;
      if (vue.refs && !vue.refs[p.reference]) return false;
      for (var kv in vue.vides) {
        if (vue.vides[kv] && String(p[kv] == null ? '' : p[kv]).trim() !== '') return false;
      }
      for (var k = 0; k < cols.length; k++) {
        if (norm(p[cols[k]]).indexOf(norm(vue.filtres[cols[k]])) === -1) return false;
      }
      if (q && norm(COLONNES.map(function (c) { return p[c.cle]; }).join(' ')).indexOf(q) === -1) return false;
      return true;
    });
  }
  function compte(liste) {
    var c = { termine: 0, encours: 0, afaire: 0, vide: 0 };
    liste.forEach(function (p) { c[p._etat]++; });
    c.total = liste.length;
    c.pct = c.total ? Math.round((c.termine / c.total) * 100) : 0;
    return c;
  }
  /* Les filtres « libres » — recherche, état, groupe, lot, colonnes — ne
     s'appliquent qu'aux plans du jour : un compte archivé ne se refiltre pas.
     Le périmètre, lui, se dérive des cartes plan par plan et suit l'historique ;
     filtreActif() réunit les deux pour ce qui se voit à l'écran. */
  function filtreLibre() {
    return !!(vue.recherche || vue.etat || vue.groupe || vue.refs || vue.lotLa || vue.seconde.recherche ||
      Object.keys(vue.filtres).some(function (k) { return vue.filtres[k]; }) ||
      Object.keys(vue.vides).some(function (k) { return vue.vides[k]; }));
  }
  function filtreActif() { return !!vue.perimetre || filtreLibre(); }

  /* ============================================================
     PÉRIMÈTRE
     La colonne de domaine (BASE/OPTION, PERSO…) découpe les plans en
     familles qu'on suit séparément. Le périmètre choisi en haut de page
     restreint tout : la sélection du jour, le comparatif, le journal, et les
     séries historiques — dérivées relevé par relevé de la carte plan par plan
     archivée, croisée avec le domaine COURANT de chaque plan. L'onglet
     Historique, lui, n'est jamais réécrit.
     ============================================================ */
  function domaineDe(p) {
    var v = CLE_DOMAINE ? String(p[CLE_DOMAINE] == null ? '' : p[CLE_DOMAINE]).trim() : '';
    return v || '\u2014';
  }
  function dansPerimetre(p) { return !vue.perimetre || domaineDe(p) === vue.perimetre; }
  /* Un événement du journal appartient au périmètre si le plan qu'il concerne
     — retrouvé par référence ou par racine — en fait partie aujourd'hui. Un
     plan disparu dont on ne connaît plus le domaine n'apparaît qu'en « Tout ». */
  function dansPerimetreEvt(e) {
    if (!vue || !vue.perimetre) return true;
    var p = planDeRef(e.ref);
    return !!p && domaineDe(p) === vue.perimetre;
  }
  /* Les plans du périmètre : la population de référence des comptes. */
  function population() { return vue.perimetre ? PLANS.filter(dansPerimetre) : PLANS; }

  /* Les comptes d'un relevé restreints à un périmètre, tirés de sa carte plan
     par plan : le total, les terminés, et — si une dimension est demandée —
     les mêmes par valeur. Un relevé sans carte ne donne rien : on ne devine
     pas. Mémorisé par relevé : la courbe se redessine à chaque glissement. */
  var MEMO_DERIVE = {};
  function comptesDerives(rel, perimetre, dim) {
    var cle = rel.i + '|' + perimetre + '|' + (dim || '');
    if (MEMO_DERIVE[cle]) return MEMO_DERIVE[cle];
    var c = { total: 0, termine: 0, groupes: {} };
    Object.keys(rel.plans || {}).forEach(function (ref) {
      var p = planDeRef(ref);
      if (!p || domaineDe(p) !== perimetre) return;
      var fini = classer(rel.plans[ref]) === 'termine';
      c.total++;
      if (fini) c.termine++;
      if (!dim) return;
      var v = String(valeurDim(p, dim) || '\u2014');
      if (!c.groupes[v]) c.groupes[v] = { total: 0, termine: 0 };
      c.groupes[v].total++;
      if (fini) c.groupes[v].termine++;
    });
    MEMO_DERIVE[cle] = c;
    return c;
  }

  /* Le sélecteur du haut : « Tout », puis une puce par domaine avec son
     compte de plans. Reconstruit à chaque source ; seul l'état pressé bouge
     ensuite. Sans colonne de domaine, il se tait. */
  function rendrePerimetre() {
    var zone = $('perimetre');
    if (!CLE_DOMAINE) { zone.hidden = true; $('choix-perimetre').innerHTML = ''; return; }
    var comptes = {};
    PLANS.forEach(function (p) { var d = domaineDe(p); comptes[d] = (comptes[d] || 0) + 1; });
    var valeurs = Object.keys(comptes).sort(function (a, b) {
      if (a === '\u2014') return 1;
      if (b === '\u2014') return -1;
      return a.localeCompare(b, 'fr', { numeric: true });
    });
    var titre = PAR_CLE[CLE_DOMAINE].titre;
    var puces = [{ val: '', nom: 'Tout', n: PLANS.length,
                   aide: 'Suivre tous les plans, quel que soit le ' + titre.toLowerCase() }]
      .concat(valeurs.map(function (v) {
        return { val: v, nom: libelleGroupe(v), n: comptes[v],
                 aide: 'Ne suivre que les plans dont ' + titre + ' vaut \u00ab\u00a0' + v + '\u00a0\u00bb' };
      }));
    $('choix-perimetre').innerHTML = puces.map(function (x) {
      return '<button type="button" data-perimetre="' + ech(x.val) + '" aria-pressed="' +
        (vue.perimetre === x.val) + '" title="' + ech(x.aide) + '">' +
        ech(x.nom) + '<span class="n">' + nb(x.n) + '</span></button>';
    }).join('');
    zone.hidden = false;
  }
  function refleterPerimetre() {
    document.querySelectorAll('#choix-perimetre button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.perimetre === vue.perimetre));
    });
  }


  /* ============================================================ AVANCEMENT */

  /* Chaque chiffre se cale au centre de son segment de barre : la ligne devient
     la légende de la barre au lieu d'une rangée régulière. Les segments minces
     produisant des étiquettes qui se touchent, on les écarte après mesure
     plutôt que de deviner les largeurs à l'avance. */
  /* Les segments vides ne sont pas rendus : on releve les coupures reelles
     dans le DOM plutot que de les recalculer a partir des pourcentages. */
  /* Sous une barre, les filets prolongent ses coupures et chaque bouton se
     centre sous son segment — la barre d'avancement et celle du rapprochement
     partagent ce dessin. Les centres se lisent sur les rectangles réels des
     segments (data-cle), donc les largeurs minimales et le blanc avant
     « seulement là » sont honorés ; un bouton dont le compte vaut 0 n'a pas
     de segment : il se cale au bord droit du précédent. Puis on pousse vers
     la droite ce qui se chevauche, et on recale vers la gauche si le dernier
     sort du cadre. Sous 680 px, les boutons passent en grille : rien à poser. */
  function alignerSousBarre(idBarre, idFilets, idEtats) {
    var barre = $(idBarre), filets = $(idFilets), zone = $(idEtats);
    if (!barre || !zone) return;
    var segs = Array.prototype.slice.call(barre.querySelectorAll('span[data-cle]'));
    var boutons = Array.prototype.slice.call(zone.querySelectorAll('button[data-cle]'));
    if (filets) filets.innerHTML = '';
    if (!boutons.length) return;
    if (window.matchMedia('(max-width: 680px)').matches || barre.offsetParent === null) {
      boutons.forEach(function (b) { b.style.left = ''; });
      return;
    }
    var base = barre.getBoundingClientRect();
    var largeur = zone.getBoundingClientRect().width;
    if (!largeur || !base.width) return;
    /* Un filet par coupure — sauf après un segment trop étroit pour que le
       trait dise encore quelque chose : entre trois plans et cinq, il ne
       ferait que hachurer les nombres. */
    if (filets && segs.length > 1) {
      filets.innerHTML = segs.slice(0, -1).map(function (seg) {
        var r = seg.getBoundingClientRect();
        if (r.width < 14) return '';
        return '<i style="left:' + (r.right - base.left + 1).toFixed(1) + 'px"></i>';
      }).join('');
    }
    var centreDe = {}, bordDe = {};
    segs.forEach(function (seg) {
      var r = seg.getBoundingClientRect();
      centreDe[seg.dataset.cle] = (r.left + r.right) / 2 - base.left;
      bordDe[seg.dataset.cle] = r.right - base.left;
    });
    var bord = 0;
    var cibles = boutons.map(function (b) {
      var c = centreDe[b.dataset.cle];
      if (c === undefined) return bord;
      bord = bordDe[b.dataset.cle];
      return c;
    });
    var gauches = boutons.map(function (b, i) { return cibles[i] - b.offsetWidth / 2; });
    for (var i = 1; i < boutons.length; i++) {
      var mini = gauches[i - 1] + boutons[i - 1].offsetWidth + 4;
      if (gauches[i] < mini) gauches[i] = mini;
    }
    var debord = gauches[boutons.length - 1] + boutons[boutons.length - 1].offsetWidth - largeur;
    for (var k = boutons.length - 1; k >= 0 && debord > 0; k--) {
      gauches[k] -= debord;
      debord = k > 0 ? Math.max(0, (gauches[k - 1] + boutons[k - 1].offsetWidth + 4) - gauches[k]) : 0;
    }
    boutons.forEach(function (b, i) { b.style.left = Math.max(0, gauches[i]).toFixed(1) + 'px'; });
  }

  function rendreAvancement(liste) {
    var c = compte(liste);
    /* Sous un périmètre seul, la phrase le nomme ; dès qu'un autre filtre
       s'ajoute, c'est une sélection. */
    $('phrase').innerHTML = '<b>' + nb(c.termine) + '</b> sur ' + nb(c.total) + ' plans terminés' +
      (filtreLibre() ? ' dans la sélection'
                     : (vue.perimetre ? ' dans le périmètre ' + ech(vue.perimetre) : ''));

    /* Le pourcentage se lit dans la barre : les chiffres du dessous n'ont plus
       qu'un sens possible, un nombre de plans. */
    $('barre').innerHTML = ETATS.map(function (e) {
      if (!c[e.cle]) return '';
      var part = (c[e.cle] / (c.total || 1)) * 100;
      var texte = part >= 6 ? Math.round(part) + '\u202f%' : '';
      return e.hachure
        ? '<span class="hachure" data-cle="' + e.cle + '" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '</span>'
        : '<span data-cle="' + e.cle + '" style="width:' + part.toFixed(2) + '%;background:' + e.couleur +
          ';color:' + encreSegment(e.cle) + '">' + texte + '</span>';
    }).join('');

    $('etats').innerHTML = ETATS.map(function (e) {
      var pastille = e.hachure
        ? '<span class="pastille hachure"></span>'
        : '<span class="pastille" style="background:' + e.couleur + '"></span>';
      var actif = vue.etat === e.cle;
      return '<button class="etat-btn" type="button" data-etat="' + e.cle + '" data-cle="' + e.cle + '" style="--teinte:' + e.teinte +
        '" aria-pressed="' + actif + '" title="' + (actif ? 'Retirer le filtre' : 'N\u2019afficher que ces plans') + '">' +
        '<span class="etat-haut">' + pastille + ech(e.libelle) + '</span>' +
        '<span class="etat-n">' + nb(c[e.cle]) + '</span></button>';
    }).join('');

    requestAnimationFrame(function () { alignerSousBarre('barre', 'filets', 'etats'); });
  }

  /* ============================================================ GRAPHIQUE */
  /* Série affichée : l'historique global, ou celui d'un groupe quand une ligne
     du bloc « Avancement FWD par… » est sélectionnée. Un filtre libre (recherche,
     colonne) ne peut pas s'appliquer rétroactivement à des comptes déjà archivés :
     dans ce cas le graphique reste sur l'ensemble, et le dit.
     Sous un périmètre, les comptes archivés ne servent plus : la série est
     dérivée, relevé par relevé, de la carte plan par plan — les plans de la
     carte qui appartiennent au périmètre aujourd'hui, et ceux d'entre eux
     classés terminés. Un relevé sans carte est écarté, et la note le dit. */
  function serieAffichee() {
    var groupe = (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) ? vue.groupe : null;
    var per = vue.perimetre;
    var pts, ecartes = 0;
    if (per) {
      pts = [];
      RELEVES.forEach(function (r) {
        if (!r.plans) { ecartes++; return; }
        var c = comptesDerives(r, per, groupe ? groupe.dim : null);
        var g = groupe ? (c.groupes[groupe.val] || { total: 0, termine: 0 }) : c;
        pts.push({ i: r.i, total: g.total, termine: g.termine });
      });
      if (!pts.length) pts.push({ i: AUJ, total: 0, termine: 0 });
    } else if (groupe) {
      pts = RELEVES.map(function (r) {
        var g = r.groupes[groupe.dim] && r.groupes[groupe.dim][groupe.val];
        return { i: r.i, total: g ? g.total : 0, termine: g ? g.termine : 0 };
      });
    } else {
      pts = RELEVES.map(function (r) { return { i: r.i, total: r.total, termine: r.termine }; });
    }
    var portee = groupe
      ? 'de ' + groupe.val + (per ? ' dans le périmètre ' + per : '')
      : (per ? 'du périmètre ' + per : null);
    return { pts: pts, portee: portee, partiel: filtreLibre(), ecartes: ecartes };
  }

  /* Une échelle qui se lit : quatre traits au plus, à des valeurs rondes —
     0, 200, 400 pour 640 plans, le plafond à part. */
  function pasDEchelle(total) {
    var candidats = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
    for (var i = 0; i < candidats.length; i++) if (total / candidats[i] <= 4.5) return candidats[i];
    return candidats[candidats.length - 1];
  }
  var L = 980, mG = 36, mD = 72, plotH = 176, ecart = 16, bandeH = 30, mBas = 34;
  var mHaut = 44, H = mHaut + plotH + ecart + bandeH + mBas;
  var HAUTEUR_ETIQUETTE = 17;
  var LARGEUR = L - mG - mD;
  var MAX_IDX = 104;                       // deux ans, ou un an au-delà d'aujourd'hui : voir chargerSource()
  var derniereAnalyse = null;

  function bornerFenetre() {
    var f = vue.fen;
    f.span = Math.max(8, Math.min(f.span, MAX_IDX + 1));
    f.debut = Math.max(0, Math.min(f.debut, MAX_IDX - f.span + 1));
  }

  function rendreGraphique(liste) {
    bornerFenetre();
    var vueSerie = serieAffichee();
    var pts = vueSerie.pts;
    var dernier = pts[pts.length - 1];
    var total = Math.max(dernier.total, 1);
    var atteint = dernier.termine;
    var restants = total - atteint;
    var ryt = rythmes(pts);
    var vitesse = ryt ? ryt.central : 0;
    var projIdx = semaineFin(atteint, total, vitesse);

    var note = vueSerie.portee
      ? 'Historique ' + vueSerie.portee + ' · ' + pts.length + ' relevés' +
        (vueSerie.partiel ? ' · les autres filtres ne s’appliquent pas à l’historique' : '')
      : (vueSerie.partiel
          ? 'Historique de l’ensemble des plans : les relevés archivés ne peuvent pas être refiltrés.'
          : RELEVES.length + ' relevés depuis le premier import');
    if (vueSerie.ecartes) {
      note += ' · ' + vueSerie.ecartes + ' relevé' + (vueSerie.ecartes > 1 ? 's' : '') +
        ' sans détail plan par plan, hors périmètre';
    }
    $('note-graphe').textContent = note;
    var prochain = jalons.filter(function (j) { return j.i > AUJ; }).sort(function (a, b) { return a.i - b.i; })[0];

    var d0 = vue.fen.debut, span = vue.fen.span, d1 = d0 + span - 1;
    var pasX = LARGEUR / (span - 1);
    var x = function (i) { return mG + pasX * (i - d0); };

    /* Deux jalons proches ecrivaient l'un sur l'autre. On calcule l'emprise de
       chaque etiquette, puis on les repartit sur le plus petit nombre de
       niveaux ou aucune ne touche sa voisine. */
    var places = [];
    if (AUJ >= d0 && AUJ <= d1) {
      var xAuj = mG + pasX * (AUJ - d0);
      places.push({ aujourdhui: true, jx: xAuj, xa: xAuj - 72, xb: xAuj - 4 });
    }
    jalons.forEach(function (j, idx) {
      if (j.i < d0 || j.i > d1) return;
      var jx = x(j.i);
      var largeur = j.texte.length * 6.1 + 34;
      var versGauche = jx + largeur + 14 > L - mD;
      places.push({ j: j, idx: idx, jx: jx, largeur: largeur, versGauche: versGauche,
                    xa: versGauche ? jx - largeur - 4 : jx + 4,
                    xb: versGauche ? jx - 4 : jx + largeur + 4 });
    });
    places.sort(function (a, b) { return a.xa - b.xa; });
    var finDeNiveau = [];
    places.forEach(function (pl) {
      var n = 0;
      while (n < finDeNiveau.length && pl.xa < finDeNiveau[n] + 10) n++;
      pl.niveau = n;
      finDeNiveau[n] = pl.xb;
    });
    var niveaux = Math.max(1, finDeNiveau.length);
    mHaut = 26 + niveaux * HAUTEUR_ETIQUETTE;
    H = mHaut + plotH + ecart + bandeH + mBas;

    var y = function (v) { return mHaut + plotH - (v / total) * plotH; };
    var yBande = mHaut + plotH + ecart;
    var basTotal = yBande + bandeH;

    var s = ['<svg class="graphe" viewBox="0 0 ' + L + ' ' + H + '" role="img" aria-label="Plans termines par semaine, historique et projection">'];
    s.push('<defs><clipPath id="zoneTracee"><rect x="' + mG + '" y="' + (mHaut - 12) + '" width="' + LARGEUR + '" height="' + (plotH + 16) + '"/></clipPath></defs>');

    /* L'échelle se lit d'un coup d'œil : des valeurs rondes, quatre traits au
       plus, le plafond à part et nommé. */
    var pas = pasDEchelle(total);
    for (var v = 0; v < total; v += pas) {
      if (total - v < pas * 0.5) continue;
      s.push('<line x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
      s.push('<text class="grad" x="' + (mG - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + nb(v) + '</text>');
    }
    s.push('<line x1="' + mG + '" x2="' + (L - mD) + '" y1="' + y(total).toFixed(1) + '" y2="' + y(total).toFixed(1) + '" stroke="var(--filet-fort)" stroke-width="1"/>');
    s.push('<text class="grad" x="' + (L - mD + 8) + '" y="' + (y(total) + 3.5).toFixed(1) + '">' + nb(total) + ' plans</text>');

    // Tout ce qui peut sortir du cadre est decoupe a la zone tracee.
    s.push('<g clip-path="url(#zoneTracee)">');

    var visibles = pts.filter(function (pt) { return pt.i >= d0 - 2 && pt.i <= d1 + 2; });
    if (visibles.length === 1) {
      s.push('<circle cx="' + x(visibles[0].i).toFixed(1) + '" cy="' + y(visibles[0].termine).toFixed(1) +
             '" r="4.5" fill="var(--fait)"/>');
    }
    if (visibles.length > 1) {
      var chemin = visibles.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.termine).toFixed(1); }).join(' ');
      var xa = x(visibles[0].i).toFixed(1), xb = x(visibles[visibles.length - 1].i).toFixed(1);
      s.push('<path d="' + chemin + ' L' + xb + ' ' + y(0).toFixed(1) + ' L' + xa + ' ' + y(0).toFixed(1) + ' Z" fill="var(--fait)" opacity=".09"/>');
      s.push('<path d="' + chemin + '" fill="none" stroke="var(--fait)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
      /* Un point par relevé, plein, cerclé de la couleur du fond pour rester
         lisible sur la courbe ; discret quand les relevés se serrent. */
      var rayon = visibles.length > 40 ? 2 : 3;
      visibles.forEach(function (pt) {
        if (pt.i === dernier.i) return;
        s.push('<circle cx="' + x(pt.i).toFixed(1) + '" cy="' + y(pt.termine).toFixed(1) +
               '" r="' + rayon + '" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      });
    }

    var horsClip = [];
    var enRetard = false, requis = null;
    if (prochain && restants > 0) {
      requis = restants / (prochain.i - AUJ);
      enRetard = vitesse <= 0 || requis > vitesse;
      var cr = enRetard ? 'var(--alerte)' : 'var(--fait)';
      s.push('<path d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(prochain.i).toFixed(1) + ' ' + y(total).toFixed(1) + '" fill="none" stroke="' + cr + '" stroke-width="1.6"/>');
      s.push('<circle cx="' + x(prochain.i).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="' + cr + '"/>');
    }

    if (projIdx !== null) {
      s.push('<path d="M' + x(AUJ).toFixed(1) + ' ' + y(atteint).toFixed(1) + ' L' + x(projIdx).toFixed(1) + ' ' + y(total).toFixed(1) +
             '" fill="none" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".6"/>');
      if (projIdx >= d0 && projIdx <= d1) {
        s.push('<circle cx="' + x(projIdx).toFixed(1) + '" cy="' + y(total).toFixed(1) + '" r="3.4" fill="none" stroke="var(--fait)" stroke-width="1.6"/>');
        var xp = Math.max(mG + 22, Math.min(x(projIdx), L - mD - 22));
        // Sous le plafond plutot qu'au-dessus : au-dessus, elle tombait dans la
        // bande des jalons et se superposait a leurs etiquettes.
        horsClip.push('<text class="grad" x="' + xp.toFixed(1) + '" y="' + (y(total) + 16).toFixed(1) +
                      '" text-anchor="middle">' + etiquette(projIdx) + '</text>');
      }
      if (prochain && enRetard) {
        var auJalon = atteint + vitesse * (prochain.i - AUJ);
        var manque = Math.round(total - auJalon);
        if (manque > 0 && prochain.i >= d0 && prochain.i <= d1) {
          var xj = x(prochain.i), y1 = y(auJalon), y2 = y(total);
          s.push('<line x1="' + xj.toFixed(1) + '" x2="' + xj.toFixed(1) + '" y1="' + y1.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--alerte)" stroke-width="1" opacity=".45"/>');
          s.push('<text class="grad" x="' + (xj + 7).toFixed(1) + '" y="' + ((y1 + y2) / 2 + 4).toFixed(1) + '" fill="var(--alerte)" font-weight="500">-' + manque + '</text>');
        }
      }
    }
    s.push('</g>');
    horsClip.forEach(function (t) { s.push(t); });

    if (AUJ >= d0 && AUJ <= d1) {
      s.push('<line x1="' + x(AUJ).toFixed(1) + '" x2="' + x(AUJ).toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--encre-3)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      s.push('<text class="grad" x="' + (x(AUJ) - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="end">aujourd’hui</text>');
      s.push('<circle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(atteint).toFixed(1) + '" r="4.5" fill="var(--fait)" stroke="var(--surface)" stroke-width="2"/>');
      s.push('<text class="grad" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (y(atteint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500">' + atteint + '</text>');
    }

    /* Jalons : un trait, un triangle, une étiquette. Rien à saisir ni à
       déplacer — ils viennent de la configuration, l'outil ne fait que les
       montrer. Le survol de la semaine dessous passe par la bande cliquable,
       comme partout ailleurs sur le graphique. */
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      var critique = prochain && j.i === prochain.i && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-3)';
      var yBase = mHaut - 8 - pl.niveau * HAUTEUR_ETIQUETTE;   // haut du trait pour ce niveau
      var yTexte = yBase - 5;
      var xTexte = pl.versGauche ? jx - 10 : jx + 10;

      s.push('<g class="jalon" data-jalon="' + idx + '" role="img" aria-label="Jalon ' + ech(j.texte) + ' en ' + etiquette(j.i) + '">');
      s.push('<title>' + ech(j.texte) + ' \u2014 ' + etiquette(j.i) + '</title>');
      s.push('<line x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + basTotal.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>');
      s.push('<path d="M' + jx.toFixed(1) + ' ' + yBase.toFixed(1) + ' l-4 -5.5 l8 0 Z" fill="' + couleur + '"/>');
      s.push('<text class="jalon-texte" x="' + xTexte.toFixed(1) + '" y="' + yTexte.toFixed(1) + '" text-anchor="' + (pl.versGauche ? 'end' : 'start') + '" fill="' + couleur + '">' + ech(j.texte) + '</text>');
      s.push('</g>');
    });

    if (!prochain && d1 > AUJ + 2) {
      var xv = x(AUJ + Math.round((d1 - AUJ) / 2));
      s.push('<text class="grad" x="' + xv.toFixed(1) + '" y="' + (mHaut + plotH * 0.86).toFixed(1) +
             '" text-anchor="middle">Aucun jalon \u00e0 venir</text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < pts.length; k5++) {
      var dSem = pts[k5].i - pts[k5 - 1].i;
      if (dSem <= 0) continue;
      var parSem = (pts[k5].termine - pts[k5 - 1].termine) / dSem;
      for (var w = pts[k5 - 1].i + 1; w <= pts[k5].i; w++) taux.push({ i: w, v: parSem });
    }
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, t.v); });
    var lb = Math.min(14, Math.max(2, pasX - 2));
    s.push('<text class="grad" x="' + mG + '" y="' + (yBande - 3).toFixed(1) + '">terminés par semaine</text>');
    taux.forEach(function (t) {
      if (t.i < d0 || t.i > d1 || t.v <= 0) return;
      var h = Math.max(1.5, (t.v / maxSem) * bandeH);
      var rx = Math.min(2, lb / 2, h / 2);
      var xg = x(t.i) - lb / 2, yh = yBande + bandeH - h, yb = yBande + bandeH;
      s.push('<path d="M' + xg.toFixed(1) + ' ' + yb.toFixed(1) + ' V' + (yh + rx).toFixed(1) +
             ' Q' + xg.toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + rx).toFixed(1) + ' ' + yh.toFixed(1) +
             ' H' + (xg + lb - rx).toFixed(1) + ' Q' + (xg + lb).toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + lb).toFixed(1) + ' ' + (yh + rx).toFixed(1) +
             ' V' + yb.toFixed(1) + ' Z" fill="var(--r4)"/>');
    });
    s.push('<line x1="' + mG + '" x2="' + (L - mD) + '" y1="' + basTotal.toFixed(1) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    var saut = Math.max(1, Math.ceil(span / 11));
    var anneeEcrite = '';
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && k3 !== AUJ) continue;
      var lib = etiquette(k3);
      var annee = lib.slice(0, 4), semaine = lib.slice(5);
      s.push('<text class="grad" x="' + x(k3).toFixed(1) + '" y="' + (H - 19) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             semaine + '</text>');
      /* L'année n'encombre pas chaque graduation : une fois, puis à chaque
         changement. */
      if (annee !== anneeEcrite) {
        s.push('<text class="annee" x="' + x(k3).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + annee + '</text>');
        anneeEcrite = annee;
      }
    }

    /* Le point d'une semaine se cherche par son indice, pas par sa position
       dans la série : une semaine sans relevé n'a pas de point. */
    var ptParI = {};
    pts.forEach(function (pt) { ptParI[pt.i] = pt; });
    for (var k4 = d0; k4 <= d1; k4++) {
      var ptK = ptParI[k4];
      /* Une bande par semaine : elle porte le survol (bulle) et son libellé
         pour les lecteurs d'écran. Ni bouton ni focus : rien ne se pose sur
         le graphique, et un clic n'y dessine plus de contour. */
      s.push('<rect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (plotH + ecart + bandeH + 6).toFixed(1) + '" fill="transparent" role="img" data-i="' + k4 + '" ' +
             'aria-label="' + etiquette(k4) +
             (k4 > AUJ ? ' (à venir)' : (ptK ? ' : ' + ptK.termine + ' terminés' : ' : pas de relevé')) + '"/>');
    }

    s.push('</svg>');
    $('zone-graphe').innerHTML = s.join('');

    var items = ['<span class="legende-item"><svg width="20" height="8" aria-hidden="true"><line x1="0" y1="4" x2="20" y2="4" stroke="var(--fait)" stroke-width="2.2"/></svg>' +
      '<span title="Nombre de plans pass\u00e9s \u00e0 100 %, cumul\u00e9 semaine apr\u00e8s semaine.">r\u00e9alis\u00e9</span></span>'];
    if (ryt && restants > 0) {
      var explication = ryt.gagnes + ' plans termin\u00e9s en ' + ryt.semaines + ' semaines entre le premier ' +
        'et le dernier relev\u00e9, soit ' + vitesse.toFixed(1).replace('.', ',') + ' par semaine. ' +
        (projIdx !== null
          ? 'Les ' + restants + ' restants demandent ' + (projIdx - AUJ) + ' semaines de plus.'
          : 'Aucun plan sold\u00e9 sur la p\u00e9riode : pas de fin pr\u00e9visible.');
      items.push('<span class="legende-item"><svg width="22" height="8" aria-hidden="true">' +
        '<line x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".65"/></svg>' +
        '<span title="' + explication + '">au rythme moyen (' + vitesse.toFixed(1).replace('.', ',') + '/sem.)' +
        (projIdx !== null ? ' \u2192 fin vers ' + etiquette(projIdx) : ' \u2014 pas de fin pr\u00e9visible') +
        '</span></span>');
    }
    if (requis !== null) {
      items.push('<span class="legende-item"><svg width="20" height="8" aria-hidden="true"><line x1="0" y1="4" x2="20" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6"/></svg>' +
        '<span title="' + restants + ' plans restants \u00e0 solder en ' + (prochain.i - AUJ) +
        ' semaines. Rouge si ce rythme d\u00e9passe le rythme actuel.">' +
        'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb : ' +
        requis.toFixed(1).replace('.', ',') + '/sem.</span></span>');
    }
    $('legende').innerHTML = items.join('');

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0 };
    majBoutonsZoom();
    planifierSauvegarde();
  }

  /* « Tout » n'a pas de largeur fixe : il est pressé quand la fenêtre est
     exactement celle qu'il donnerait, et qu'aucun préréglage fixe ne l'est. */
  function majBoutonsZoom() {
    var boutons = document.querySelectorAll('.commandes-graphe .segmente button');
    var fixe = false;
    for (var i = 0; i < boutons.length; i++) {
      if (Number(boutons[i].dataset.span) === vue.fen.span) fixe = true;
    }
    for (var k = 0; k < boutons.length; k++) {
      var v = Number(boutons[k].dataset.span);
      boutons[k].setAttribute('aria-pressed', String(v ? v === vue.fen.span : !fixe && vue.fen.span === spanTout()));
    }
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  function reglerSpan(span) {
    vue.fen.span = span || spanTout();
    vue.fen.debut = span ? Math.max(0, AUJ - Math.round(vue.fen.span * 0.45)) : 0;
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;

  /* Le seul geste du graphique : le panoramique. Il part de n'importe quel
     point du cadre, frise des jalons et marge du bas comprises — le curseur
     y promet la main partout. Un clic net ne fait rien. */
  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    glisse = { x0: e.clientX, debut0: vue.fen.debut, bouge: false };
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    var span1 = Math.max(8, Math.min(MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));
    rendreGraphique(selection());
  }, { passive: false });

  cadreGraphe.addEventListener('pointermove', function (e) {
    if (!glisse) return;
    var dx = e.clientX - glisse.x0;
    if (Math.abs(dx) > 4) glisse.bouge = true;
    if (!glisse.bouge) return;
    var semaines = dx / pxParSemaine();
    cadreGraphe.dataset.glisse = 'true';
    var nd = Math.round(glisse.debut0 - semaines);
    if (nd !== vue.fen.debut) { vue.fen.debut = nd; rendreGraphique(selection()); }
  });

  function finGlisse() {
    if (!glisse) return;
    glisse = null;
    cadreGraphe.dataset.glisse = 'false';
  }
  cadreGraphe.addEventListener('pointerup', finGlisse);
  cadreGraphe.addEventListener('pointercancel', finGlisse);

  /* Infobulle */
  cadreGraphe.addEventListener('mousemove', function (e) {
    if (glisse && glisse.bouge) { $('bulle').dataset.visible = 'false'; return; }
    if (!e.target.closest || !e.target.closest('.zone-clic')) { $('bulle').dataset.visible = 'false'; return; }
    var i = indexSousCurseur(e.clientX);
    var a = derniereAnalyse;
    if (i === null || !a) return;
    var bulle = $('bulle');
    var k = -1;
    for (var q = 0; q < a.pts.length; q++) if (a.pts[q].i === i) k = q;
    if (k !== -1) {
      var pt = a.pts[k];
      var gagne = k > 0 ? pt.termine - a.pts[k - 1].termine : null;
      bulle.innerHTML = '<div class="tete-bulle">Relevé du ' + etiquette(i) + '</div>' +
        '<div class="bulle-ligne"><span class="pastille" style="background:var(--fait)"></span>terminés<span class="n">' +
          nb(pt.termine) + ' / ' + nb(pt.total) + '</span></div>' +
        (gagne !== null ? '<div class="bulle-ligne"><span class="pastille sans"></span>depuis le précédent<span class="n">' +
          (gagne > 0 ? '+' : '') + nb(gagne) + '</span></div>' : '') +
        comptesDeLaSemaine(i);
    } else {
      bulle.innerHTML = '<div class="tete-bulle">' + etiquette(i) + '</div><div class="bulle-ligne">' +
        (i > AUJ ? 'À venir' : 'Pas de relevé cette semaine-là') + '</div>';
    }
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  /* Sous les deux lignes de tête, le résumé de la semaine. « +6 » ne dit pas
     ce qui s'est passé : la bulle reprend les comptes du journal — passages,
     nouveaux, disparus, changements d'indice — une ligne par compte non nul,
     et rien d'autre : le journal, dessous, donne le détail. Quand la courbe
     est celle d'un groupe, les comptes se limitent aux plans de ce groupe. */
  var LIGNES_BULLE = [
    { cle: 'termine', un: 'passé en terminé',   des: 'passés en terminé' },
    { cle: 'encours', un: 'passé en cours',     des: 'passés en cours' },
    { cle: 'afaire',  un: 'repassé à faire',    des: 'repassés à faire' },
    { cle: 'vide',    un: 'effacé',             des: 'effacés' },
    { cle: 'nouveau', un: 'nouveau',            des: 'nouveaux' },
    { cle: 'disparu', un: 'disparu',            des: 'disparus' },
    { cle: 'indice',  un: 'changement d’indice', des: 'changements d’indice' }
  ];
  function comptesDeLaSemaine(i) {
    var sem = JOURNAL.filter(function (s) { return s.i === i; })[0];
    if (!sem) return '';
    var evts = sem.evenements.filter(dansPerimetreEvt);
    if (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) {
      evts = evts.filter(function (e) {
        var p = planDeRef(e.ref);
        return p && String(valeurDim(p, vue.groupe.dim)) === vue.groupe.val;
      });
    }
    var c = comptesEvenements(evts);
    var lignes = LIGNES_BULLE.filter(function (l) { return c[l.cle]; }).map(function (l) {
      return '<div class="bulle-ligne">' + pastilleDe(l.cle) + (c[l.cle] > 1 ? l.des : l.un) +
        '<span class="n">' + nb(c[l.cle]) + '</span></div>';
    });
    return lignes.length ? '<div class="bulle-comptes">' + lignes.join('') + '</div>' : '';
  }

  cadreGraphe.addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  document.querySelector('.commandes-graphe .segmente').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-span]');
    if (b) reglerSpan(Number(b.dataset.span));
  });

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y
     laisse aucune trace tant que les autres avancent. On projette donc
     chaque groupe a SON rythme, et on regarde lequel arrive le dernier.
     ============================================================ */
  var FENETRE = 6;

  /* L'explication ne vaut que chiffree : on reprend une ligne reelle du bloc et
     on y refait le calcul pas a pas, plutot qu'un exemple invente. */
  function panneauAide(rangs, prochain, semainesJalon) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restants > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    function d(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
    /* Dans l'exemple, un rythme arrondi au dixieme ne redonnerait pas la date
       affichee : on garde deux decimales, sans zero inutile. */
    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }

    var h = '<div class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment la fin estimée est calculée">';
    h += '<h3>D’où vient la fin estimée ?</h3>';
    h += '<p>GATES ne donne qu’une photo du jour, sans historique. On archive donc un relevé à chaque import, ' +
         'puis on compare le premier au dernier et on prolonge la pente en ligne droite.</p>';
    h += '<div class="aide-formule">' +
         'rythme   = (terminés aujourd’hui − terminés au 1<sup>er</sup> relevé) ÷ semaines écoulées\n' +
         'restants = total − terminés aujourd’hui\n' +
         '<b>fin      = semaine actuelle + arrondi supérieur(restants ÷ rythme)</b>' +
         '</div>';

    if (ex) {
      var depart = ex.termine - ex.rythme.gagnes;
      var sem = ex.fin - AUJ;
      h += '<div class="aide-formule"><span class="exemple">Exemple — ' + ech(TITRE_DIM[vue.dimCritique].replace(/ \(.*\)$/, '')) +
           ' ' + ech(ex.nom) + ', au dernier import</span>' +
           'rythme   = (' + ex.termine + ' − ' + depart + ') ÷ ' + ex.rythme.semaines + ' sem. = ' +
           d2(ex.vitesse) + ' plan par semaine\n' +
           'restants = ' + ex.total + ' − ' + ex.termine + ' = ' + ex.restants + ' plans\n' +
           '<b>fin      = ' + ex.restants + ' ÷ ' + d2(ex.vitesse) + ' = ' + sem + ' semaines → ' +
           etiquette(AUJ) + ' + ' + sem + ' = ' + etiquette(ex.fin) + '</b>' +
           '</div>';
      if (prochain && semainesJalon > 0) {
        h += '<div class="aide-formule"><span class="exemple">Et les deux colonnes voisines, sur la même ligne</span>' +
             'à solder/sem. = restants ÷ semaines avant le jalon\n' +
             '              = ' + ex.restants + ' ÷ ' + semainesJalon + ' = ' + d(ex.requis) +
             ' → affiché ' + Math.ceil(ex.requis) + ' (on n’achève pas un demi-plan)\n' +
             'effort        = à solder/sem. ÷ rythme actuel\n' +
             '              = ' + d(ex.requis) + ' ÷ ' + d2(ex.vitesse) + ' = ×' + d(ex.tension) +
             (ex.tension > 1 ? '  → il faut aller ' + d(ex.tension) + ' fois plus vite qu’aujourd’hui'
                             : '  → le rythme actuel suffit') +
             '</div>';
      }
    } else {
      h += '<p>Aucun groupe de la sélection n’a de rythme exploitable pour l’instant : ' +
           'il faut au moins deux relevés et un plan terminé entre les deux.</p>';
    }

    h += '<p>Un groupe qui n’a rien soldé depuis le premier relevé n’a pas de rythme : sa fin reste « — ». ' +
         'La date se recalcule à chaque import et peut reculer — ce n’est pas un engagement, ' +
         'c’est ce que dit le rythme tenu jusqu’ici.</p>';
    return h + '</div>';
  }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc
     TOUTES ses références, en deux paquets : ce qui n'est pas terminé — à
     faire, non renseigné, en cours, dans cet ordre, parce que c'est là qu'il
     y a quelque chose à faire — puis ce qui est soldé. Dans chaque paquet,
     les références se suivent dans l'ordre numérique. Rien n'est tronqué :
     un « et N autres » qui ne s'ouvre pas ne sert à personne. */
  function listeUD(r) {
    var ordre = { afaire: 0, vide: 1, encours: 2, termine: 3 };
    var plans = (r.plans || []).slice().sort(function (a, b) {
      return (ordre[a._etat] - ordre[b._etat]) || a.reference.localeCompare(b.reference, 'fr', { numeric: true });
    });
    if (!plans.length) return '';
    function jeton(p) {
      var e = ETAT_PAR_CLE[p._etat];
      var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
      return '<button class="jeton-ud" type="button" data-ud="' + ech(p.reference) +
        '" title="' + ech(e.court + (quoi ? ' — ' + quoi : '')) + '">' +
        pastilleDe(p._etat) + ech(p.reference) + '</button>';
    }
    function paquet(titre, liste) {
      if (!liste.length) return '';
      return '<div class="sous-groupe"><h4 class="sous-titre">' + titre +
        '<span class="n">(' + nb(liste.length) + ')</span></h4>' +
        '<div class="grille">' + liste.map(jeton).join('') + '</div></div>';
    }
    var restants = plans.filter(function (p) { return p._etat !== 'termine'; });
    var termines = plans.filter(function (p) { return p._etat === 'termine'; });
    return '<div class="groupe-refs"><div class="entete">' +
      '<span>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (restants.length ? ' · <b>' + nb(restants.length) + '</b> pas encore terminé' + (restants.length > 1 ? 's' : '')
                       : ' · tout est soldé') +
      '</span><span class="legende-etats" aria-label="Légende des pastilles">' + ETATS.map(function (et) {
        return '<span>' + pastilleDe(et.cle) + ech(et.court) + '</span>';
      }).join('') + '</span><span>cliquez une référence pour la retrouver dans le tableau</span></div>' +
      paquet('Pas encore terminés', restants) +
      paquet('Terminés', termines) +
      '</div>';
  }

  /* Le filtre de la colonne de gauche : les groupes dont le nom — tel qu'il
     s'affiche, donc « Oui » pour « true » — contient le texte tapé. */
  function retenuParFiltreGroupe(r) {
    var q = norm(vue.filtreGroupe);
    if (!q) return true;
    return norm(libelleGroupe(r.nom)).indexOf(q) !== -1 || norm(r.nom).indexOf(q) !== -1;
  }
  /* Le champ suit la dimension : « Filtrer les ATA… », « Filtrer les mois… ». */
  function libellerFiltreGroupe(dim) {
    var quoi = dim === '_mois' ? 'mois'
             : dim === '_anciennete' ? 'tranches'
             : (TITRE_DIM[dim] || 'groupes').replace(/ \(.*\)$/, '');
    $('filtre-groupe').placeholder = 'Filtrer les ' + quoi + '…';
    $('filtre-groupe').setAttribute('aria-label', 'Filtrer les ' + quoi);
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    /* Aucune colonne à analyser — source vide, ou feuille sans catégorie
       reconnue : le bloc le dit au lieu de chercher un titre qui n'existe pas. */
    if (!dim || !TITRE_DIM[dim]) {
      $('titre-groupe').textContent = 'Avancement FWD';
      $('indice-dim').textContent = '';
      $('compte-groupes').textContent = '';
      libellerFiltreGroupe(dim);
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '<div class="vide-message">Aucune colonne à analyser dans cette source.</div>';
      return;
    }
    var prochain = jalons.filter(function (j) { return j.i > AUJ; })
      .sort(function (a, b) { return a.i - b.i; })[0];

    // Répartition : état du jour, filtrée comme le reste de la page.
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [] };
      groupes[k].total++;
      groupes[k][p._etat]++;
      groupes[k].plans.push(p);
    });

    /* Rythme : il vient des relevés archivés, qui portent sur l'ensemble des
       plans du groupe. Un comptage déjà figé ne peut pas être refiltré — sauf
       par le périmètre, qui se dérive de la carte plan par plan de chaque
       relevé, comme la courbe ; un relevé sans carte est alors écarté. */
    var per = vue.perimetre;
    var relevesRythme = per ? RELEVES.filter(function (rel) { return !!rel.plans; }) : RELEVES;

    var semainesJalon = prochain ? prochain.i - AUJ : 0;
    var rangs = Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      var restants = g.total - g.termine;
      // Même méthode que la courbe : l'étendue des rythmes réellement tenus.
      var serieGroupe = relevesRythme.map(function (rel) {
        var gr = per ? comptesDerives(rel, per, dim).groupes[k]
                     : (rel.groupes[dim] && rel.groupes[dim][k]);
        return { i: rel.i, termine: gr ? gr.termine : 0 };
      });
      var rg = rythmes(serieGroupe);
      var vitesse = rg ? rg.central : 0;
      return {
        rythme: rg,
        nom: g.nom, total: g.total, restants: restants, vitesse: vitesse, plans: g.plans,
        termine: g.termine, encours: g.encours, afaire: g.afaire, vide: g.vide,
        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restants === 0 ? AUJ : semaineFin(g.termine, g.total, vitesse),
        // L'effort demandé : combien il faut solder par semaine pour tenir le
        // jalon, et par quel facteur cela dépasse le rythme actuel du groupe.
        requis: semainesJalon > 0 ? restants / semainesJalon : 0,
        tension: (semainesJalon > 0 && vitesse > 0) ? (restants / semainesJalon) / vitesse : Infinity
      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      if (cle === 'total') return r.total;
      if (cle === 'pct') return r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'tension') return r.vitesse > 0 ? r.tension : Infinity;
      if (cle === 'fin') return r.fin === null ? Infinity : r.fin;
      return 0;
    }
    var tg = vue.triGroupe;
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {
        var x = cleTri(a, tg.cle), y = cleTri(b, tg.cle);
        if (typeof x === 'string') {
          // Les codes ATA sont des nombres ecrits en texte : on les compare comme tels.
          var nx = parseFloat(x), ny = parseFloat(y);
          if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return (nx - ny) * signe;
          return x.localeCompare(y, 'fr', { numeric: true }) * signe;
        }
        if (x === y) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        // Infinity des deux cotes : egalite, on retombe sur le nom.
        if (!isFinite(x) && !isFinite(y)) return a.nom.localeCompare(b.nom, 'fr', { numeric: true });
        return (x < y ? -1 : 1) * signe;
      });
    } else {
      rangs.sort(function (a, b) {
        if ((a.restants === 0) !== (b.restants === 0)) return a.restants === 0 ? 1 : -1;
        if (prochain) return b.tension - a.tension;
        if ((a.fin === null) !== (b.fin === null)) return a.fin === null ? -1 : 1;
        return (b.fin || 0) - (a.fin || 0);
      });
    }

    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    $('titre-groupe').textContent = 'Avancement FWD par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '');
    $('indice-dim').textContent = NOTE_DIM(dim);
    libellerFiltreGroupe(dim);

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '<div class="vide-message">Aucun plan dans la sélection.</div>';
      $('compte-groupes').textContent = '';
      return;
    }

    /* Le filtre de la colonne de gauche ne touche qu'à ce bloc : les lignes
       qu'il écarte restent comptées partout ailleurs. Le compte dit combien
       restent sur combien tant qu'il agit. */
    var tous = rangs.length;
    rangs = rangs.filter(retenuParFiltreGroupe);
    $('compte-groupes').textContent = rangs.length === tous ? '' : nb(rangs.length) + ' sur ' + nb(tous);

    function fleche(cle) {
      if (!tg || tg.cle !== cle) return '';
      return '<svg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="' +
        (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function entete(cle, libelle, titre, classe) {
      var actif = !!(tg && tg.cle === cle);
      return '<span class="' + (classe || '') + '"><button type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +
        (titre ? ' title="' + ech(titre) + '"' : '') + '>' + ech(libelle) + fleche(cle) + '</button>';
    }

    function aide(quoi) {
      return '<button type="button" class="aide" data-aide="1" aria-expanded="' + (!!vue.aideFin) +
        '" aria-controls="panneau-fin" title="Comment ' + ech(quoi) + ' se calcule">?</button>';
    }

    var html = '<div class="critique-tete">' +
      entete('nom', TITRE_DIM[dim].replace(/ \(.*\)$/, ''), TITRE_DIM[dim]) + '</span>' +
      entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '</span>' +
      entete('pct', 'répartition FWD', 'Trier par part de plans terminés.', 'a-gauche') + '</span>' +
      entete('fin', 'fin estimée', 'Date d’arrivée si le rythme actuel se maintient.') + aide('la fin estimée') + '</span>' +
      (prochain
        ? entete('tension', 'effort demandé', 'Ce qu\'il faudrait solder chaque semaine pour tenir le jalon, comparé au rythme réellement tenu.') + aide('l’effort demandé') + '</span>'
        : entete('tension', 'rythme actuel', 'Plans terminés par semaine depuis le premier relevé.') + aide('le rythme actuel') + '</span>') +
      '</div>';

    if (vue.aideFin) html += panneauAide(rangs, prochain, semainesJalon);

    /* Toutes les lignes sont là — « Date création par mois » peut en faire
       quatre-vingts — mais le bloc a une hauteur : on descend dedans au lieu
       de pousser le reste de la page vers le bas. */
    html += rangs.map(function (r) {
      var actif = vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom;

      /* Le pourcentage s'ecrit dans le segment quand il y tient ; en dessous
         il reste dans l'infobulle plutot que d'etre rogne. */
      var barre = ETATS.map(function (e) {
        if (!r[e.cle]) return '';
        var part = (r[e.cle] / r.total) * 100;
        var texte = part >= 11 ? Math.round(part) + ' %' : '';
        var encre = encreSegment(e.cle);
        return e.hachure
          ? '<span class="hachure" style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + texte + '</span>'
          : '<span style="width:' + part.toFixed(2) + '%;background:' + e.couleur + ';color:' + encre + '">' + texte + '</span>';
      }).join('');

      /* Une seule colonne d'appoint : l'effort demandé quand un jalon fixe une
         échéance, le rythme réellement tenu sinon. « À solder par semaine » a
         été retiré : personne ne suivait un nombre par semaine. */
      var col2;
      if (!prochain) {
        col2 = '<span class="critique-effort" data-libelle="rythme actuel"><span class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? r.vitesse.toFixed(1).replace('.', ',') + '/sem.' : 'rien de soldé') +
          '</span></span>';
      } else if (r.restants === 0) {
        col2 = '<span class="critique-effort" data-libelle="effort demandé"><span class="v critique-ecart">tout est soldé</span></span>';
      } else if (r.vitesse <= 0) {
        col2 = '<span class="critique-effort" data-libelle="effort demandé"><span class="v critique-ecart arret">rien de soldé<small>aucun rythme</small></span></span>';
      } else {
        col2 = '<span class="critique-effort" data-libelle="effort demandé" title="' + r.restants +
          ' plans restants à répartir sur ' + semainesJalon + ' semaines, soit ' +
          r.requis.toFixed(1).replace('.', ',') + ' par semaine."><span class="v critique-ecart">' +
          (r.tension > 1 ? '<b class="tard">×' + r.tension.toFixed(1).replace('.', ',') + '</b>'
                         : '×' + r.tension.toFixed(1).replace('.', ',')) +
          '<small>rythme ' + r.vitesse.toFixed(1).replace('.', ',') + '/sem.</small></span></span>';
      }

      // --- colonne chiffree 3 : la date d'arrivee au rythme actuel
      var texteFin = r.restants === 0 ? 'soldé' : (r.fin === null ? '—' : etiquette(r.fin));
      var col3 = '<span class="critique-date' + (r.fin === null && r.restants !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" title="' +
        (r.restants === 0 ? 'Plus rien à solder dans ce groupe.'
          : r.fin === null ? 'Aucun plan terminé depuis le premier relevé : pas de rythme, donc pas de date.'
          : r.restants + ' plans restants à ' + r.vitesse.toFixed(1).replace('.', ',') +
            ' par semaine, soit ' + (r.fin - AUJ) + ' semaines.') +
        '"><span class="v">' + texteFin + '</span></span>';

      return '<button class="critique-ligne" type="button" data-groupe="' + ech(r.nom) + '" aria-pressed="' + !!actif +
        '" title="' + r.termine + ' terminés, ' + r.encours + ' en cours, ' + r.afaire + ' à faire, ' +
        r.vide + ' non renseignés — cliquez pour voir lesquels">' +
        '<span class="critique-nom">' + ech(libelleGroupe(r.nom)) + '</span>' +
        '<span class="critique-total" data-libelle="plans">' + r.total + '</span>' +
        '<span class="critique-barre">' + barre + '</span>' +
        col3 + col2 + '</button>' +
        (actif ? listeUD(r) : '');
    }).join('');

    if (!rangs.length) {
      html += '<div class="vide-message">Aucun groupe ne contient « ' + ech(vue.filtreGroupe.trim()) +
        ' ». Échap vide le filtre.</div>';
    }

    /* toggle et non className : le conteneur porte aussi « defile-liste »,
       qui lui donne sa hauteur et sa barre de défilement. */
    $('zone-critique').classList.toggle('sans-jalon', !prochain);
    $('zone-critique').innerHTML = html;
  }

  /* L'ordre du sélecteur est celui que donne la source : quand la liste est
     fixée à la main, c'est l'ordre demandé qui compte, pas celui de la feuille. */
  /* Le sélecteur est rangé par ordre alphabétique : on y cherche un nom, pas
     une position dans la feuille. */
  /* Deux dimensions viennent de la même colonne de date et se confondent
     facilement : on dit laquelle répond à quelle question. */
  function NOTE_DIM(dim) {
    var titreDate = CLE_DATE && PAR_CLE[CLE_DATE] ? PAR_CLE[CLE_DATE].titre.toLowerCase() : 'date de création';
    if (dim === '_anciennete') {
      return 'Depuis combien de temps le plan existe, en quatre tranches calculées sur « ' + titreDate +
        ' ». Répond à « qu\u2019est-ce qui traîne depuis longtemps ? ».';
    }
    if (dim === '_mois') {
      return 'Le mois où le plan a été créé, un groupe par mois, rangés dans l\u2019ordre du temps. ' +
        'Répond à « de quelle vague vient ce lot ? » \u2014 l\u2019ancienneté, elle, regroupe en tranches.';
    }
    if (dim === 'avancement') {
      return 'La valeur brute de la colonne d\u2019avancement, telle qu\u2019elle est saisie : ' +
        'd\u2019un coup d\u2019\u0153il, toutes les façons de l\u2019écrire, donc les saisies qui divergent.';
    }
    return '';
  }

  /* DIMENSIONS et TITRE_DIM sont dérivés de la source dans chargerSource(). */
  function remplirDims() {
    $('dim-critique').innerHTML = DIMENSIONS.map(function (d) {
      return '<option value="' + d.cle + '">' + ech(d.titre) + '</option>';
    }).join('');
    $('dim-critique').value = vue.dimCritique;
  }

  /* ============================================================ TABLEAU */
  function visibles() {
    return vue.ordre.filter(function (k) { return !vue.cachees[k]; }).map(function (k) { return PAR_CLE[k]; });
  }
  /* Combien de colonnes restent collees a gauche : tout ce qui precede la
     reference, plus elle. Dans l'ordre de la feuille la reference arrive en
     deuxieme ; en vue essentielle elle ouvre le tableau. Le calcul suit
     l'ordre affiche au lieu de le supposer. */
  function nbFigees(cols) {
    for (var i = 0; i < cols.length; i++) if (cols[i].fige) return i + 1;
    return 0;
  }
  function classeFige(i, n) {
    if (i >= n) return '';
    return i === n - 1 ? 'col-fige fige-fin' : 'col-fige';
  }
  function rendreEntetes() {
    var cols = visibles();
    var nFige = nbFigees(cols);
    /* Un groupe a cheval sur la limite du bloc fige est coupe en deux : la
       moitie collee garde le libelle, la suite le laisse vide pour que la
       bande se lise d'un trait. */
    var groupes = [];
    cols.forEach(function (c, i) {
      var colle = i < nFige;
      var d = groupes[groupes.length - 1];
      if (d && d.nom === c.groupe && d.fige === colle) d.n++;
      else groupes.push({ nom: c.groupe, n: 1, fige: colle, debut: i, suite: !!(d && d.nom === c.groupe) });
    });
    var html = '<tr class="groupes">' + groupes.map(function (g) {
      var cl = g.fige ? (g.debut + g.n === nFige ? 'col-fige fige-fin' : 'col-fige') : '';
      return '<th colspan="' + g.n + '" data-debut="' + g.debut + '"' + (cl ? ' class="' + cl + '"' : '') +
        '>' + ech(g.suite ? '' : g.nom) + '</th>';
    }).join('') + '</tr><tr class="titres">' + cols.map(function (c, i) {
      var actif = vue.tri.cle === c.cle;
      var fleche = actif ? '<svg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="' +
        (vue.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      var poignee = c.fige ? '' : '<span class="poignee" aria-hidden="true"><svg width="7" height="12" viewBox="0 0 7 12" fill="currentColor">' +
        '<circle cx="1.6" cy="2" r="1.1"/><circle cx="5.4" cy="2" r="1.1"/><circle cx="1.6" cy="6" r="1.1"/>' +
        '<circle cx="5.4" cy="6" r="1.1"/><circle cx="1.6" cy="10" r="1.1"/><circle cx="5.4" cy="10" r="1.1"/></svg></span>';
      var cl = classeFige(i, nFige);
      return '<th scope="col" data-cle="' + c.cle + '"' + (cl ? ' class="' + cl + '"' : '') +
        (c.fige ? '' : ' draggable="true"') +
        ' aria-sort="' + (actif ? (vue.tri.asc ? 'ascending' : 'descending') : 'none') + '">' +
        poignee + '<button type="button" data-tri="' + c.cle + '">' + ech(c.titre) + fleche + '</button></th>';
    }).join('') + '</tr><tr class="filtres">' + cols.map(function (c, i) {
      var val = vue.filtres[c.cle] || '';
      var cl = classeFige(i, nFige);
      return '<th' + (cl ? ' class="' + cl + '"' : '') + '><input type="text" data-filtre="' + c.cle + '" value="' + ech(val) +
        '" placeholder="filtrer" data-actif="' + (!!val) + '" aria-label="Filtrer ' + ech(c.titre) + '"></th>';
    }).join('') + '</tr>';
    $('tete-tableau').innerHTML = html;
    ajusterSticky();
  }
  function ajusterSticky() {
    requestAnimationFrame(function () {
      var g = document.querySelector('.groupes'), t = document.querySelector('.titres'), f = document.querySelector('.filtres');
      if (!g || !t || !f) return;
      var hg = g.getBoundingClientRect().height;
      var ht = t.getBoundingClientRect().height;
      t.querySelectorAll('th').forEach(function (th) { th.style.top = hg + 'px'; });
      f.querySelectorAll('th').forEach(function (th) { th.style.top = (hg + ht) + 'px'; });

      /* On mesure les colonnes collees et on les pose les unes apres les
         autres. Sans ce cumul, la deuxieme viendrait recouvrir la premiere. */
      var tetes = t.querySelectorAll('th');
      var gauche = [], cumul = 0;
      for (var i = 0; i < tetes.length; i++) {
        if (!tetes[i].classList.contains('col-fige')) break;
        gauche.push(cumul);
        cumul += tetes[i].getBoundingClientRect().width;
      }
      if (!gauche.length) return;
      g.querySelectorAll('th.col-fige').forEach(function (th) {
        var d = parseInt(th.dataset.debut, 10) || 0;
        th.style.left = (gauche[d] || 0) + 'px';
      });
      var lignes = [t, f].concat(Array.prototype.slice.call(document.querySelectorAll('#corps-tableau tr')));
      lignes.forEach(function (ligne) {
        var n = 0;
        ligne.querySelectorAll('.col-fige').forEach(function (c) {
          c.style.left = (gauche[n] == null ? 0 : gauche[n]) + 'px';
          n++;
        });
      });
    });
  }
  function rendreCorps(liste) {
    var cols = visibles();
    /* Le lot « seulement dans la seconde base » n'a aucun plan ici : le
       tableau de GATES le dit, et propose l'autre côté. La barre du haut, elle,
       montre toujours la sélection — ce lot n'est pas un filtre sur les plans. */
    if (vue.lotLa && RAPPROCHEMENT) {
      var nLa = RAPPROCHEMENT.absentsIci.length, nomLa = nomSeconde();
      $('corps-tableau').innerHTML = '<tr><td colspan="' + cols.length + '"><div class="vide-message">Ces ' + nb(nLa) +
        (nLa > 1 ? ' lignes n’ont pas de plan dans GATES. ' : ' ligne n’a pas de plan dans GATES. ') +
        '<button class="lien-doux" type="button" data-aller-base="la">Les voir dans ' + ech(nomLa) + '</button></div></td></tr>';
      $('compte').textContent = '0 plan sur ' + nb(population().length);
      majOmbre();
      return;
    }
    var rangs = liste.slice().sort(function (a, b) {
