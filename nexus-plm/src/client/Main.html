<script>
// ============================================================
// NEXUS PLM — contrôleur.
// Toutes les actions déclenchables sont déclarées ici et atteintes par
// délégation (data-action). Aucun gestionnaire en ligne, donc aucune donnée
// injectée dans du code.
//
// Aucun prompt() ni confirm() : ils sont bloqués dans l'iframe d'Apps Script
// et le bouton restait muet. Les questions passent par Dialogues.html.
// ============================================================

function indicateurBoite() {
  const el = parId('spin-boite');
  if (el) el.innerHTML = '<span class="mini-spinner"></span>';
}
function indicateurNom(id) {
  const el = parId('spin-nom-' + id);
  if (el) el.innerHTML = '<span class="mini-spinner"></span>';
}

function ouvrirModal(id) {
  const el = parId(id);
  if (!el) return null;
  const m = bootstrap.Modal.getOrCreateInstance(el);
  m.show();
  return m;
}
function fermerModal(id) {
  const el = parId(id);
  if (!el) return;
  const m = bootstrap.Modal.getInstance(el);
  if (m) m.hide();
}
function ouvrirPanneau() { bootstrap.Offcanvas.getOrCreateInstance(parId('detailsSlideOver')).show(); }
function fermerPanneau() {
  const i = bootstrap.Offcanvas.getInstance(parId('detailsSlideOver'));
  if (i) i.hide();
}

function rafraichir() {
  rendreInterface();
  if (Store.pnCourant) rendreFiche();
}

// ------------------------------------------------------------
// Chargement
// ------------------------------------------------------------
function chargerTout() {
  const chargement = parId('loading');
  if (chargement) chargement.hidden = false;
  return Api.chargerTout()
    .then(function (r) {
      if (!r || r.erreur) {
        throw new Error(r && r.erreur ? r.erreur : 'Réponse vide du serveur.');
      }
      chargerDonnees(r);
      rafraichir();
      remplirListesDeSuggestion();
    })
    .catch(function (e) { signalerErreur(e, 'chargement des données'); });
}

function chargerCatalogue() {
  return Api.chargerCatalogue()
    .then(function (r) {
      Store.catalogue = Array.isArray(r) ? r : [];
      if (!Array.isArray(r)) throw new Error((r && r.error) || 'Catalogue illisible.');
      remplirListesDeSuggestion();
    })
    .catch(function (e) { signalerErreur(e, 'chargement du catalogue'); });
}

function optionsHtml(valeurs) {
  return valeurs.map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('');
}

function remplirListesDeSuggestion() {
  definirHtml('datalistStds', optionsHtml(tousLesComposants()));
  definirHtml('list-MotsCles', optionsHtml(tousLesMotsCles()));
  definirHtml('list-Type', optionsHtml(typesProposes().map(function (t) { return t.libelle; })));

  // Porteurs : la liste fermée du registre, sans « Multi » ni saisie libre.
  const porteurs = porteursConnus();
  definirHtml('list-Porteur', optionsHtml(porteurs));
  definirHtml('newBoitePorteurs', porteurs.map(function (p) {
    return '<label class="jeton-porteur"><input type="checkbox" name="nouveauPorteur" value="' +
           esc(p) + '">' + esc(p) + '</label>';
  }).join(''));

  // Suggestions par niveau et par catégorie de composant : ce que le
  // catalogue connaît, plus ce qui est déjà saisi dans la base.
  const parCategorie = {};
  Object.keys(CATEGORIES_COMPOSANT).forEach(function (cat) {
    parCategorie[cat] = { fonction: new Set(), norme: new Set(), reference: new Set() };
  });
  Store.catalogue.forEach(function (entree) {
    const c = composantDepuisCatalogue(entree);
    const cible = parCategorie[c.categorie] || parCategorie.composant;
    if (c.fonction) cible.fonction.add(c.fonction);
    if (c.norme) cible.norme.add(c.norme);
    if (c.reference) cible.reference.add(c.reference);
  });
  champsComposants().forEach(function (ch) {
    const cible = parCategorie[ch.categorie] || parCategorie.composant;
    const objets = ch.portee === 'boite'
      ? Store.boites
      : Store.nomenclature.filter(function (n) { return typeDe(n).cle === ch.portee; });
    objets.forEach(function (o) {
      listeComposants(o[ch.cle]).forEach(function (c) {
        if (c.fonction) cible.fonction.add(c.fonction);
        if (c.norme) cible.norme.add(c.norme);
        if (c.reference) cible.reference.add(c.reference);
      });
    });
  });
  definirHtml('listesComposants', Object.keys(parCategorie).map(function (cat) {
    return ['fonction', 'norme', 'reference'].map(function (niveau) {
      return '<datalist id="list-' + niveau + '-' + cat + '">' +
             optionsHtml(Array.from(parCategorie[cat][niveau]).sort()) + '</datalist>';
    }).join('');
  }).join(''));
}

// ------------------------------------------------------------
// Écritures
// ------------------------------------------------------------
function sauverBoite(modifs) {
  indicateurBoite();
  return Api.sauverBoite(Store.pnCourant, modifs)
    .then(function (r) {
      appliquerBoite(r.boite, r.pnPrecedent);
      Store.enEditionBoite = false;
      rafraichir();
      remplirListesDeSuggestion();
    })
    .catch(function (e) {
      signalerErreur(e, "sauvegarde de la boîte");
      rafraichir();
    });
}

function sauverNom(id, modifs) {
  indicateurNom(id);
  return Api.sauverNom(id, modifs)
    .then(function (r) {
      appliquerNom(r.ligne);
      Store.enEditionNom[id] = false;
      rafraichir();
      remplirListesDeSuggestion();
    })
    .catch(function (e) {
      signalerErreur(e, 'sauvegarde du sous-ensemble');
      rafraichir();
    });
}

function majMultiBoite(champ, transformation) {
  const boite = boiteCourante();
  if (!boite) return;
  const modifs = {};
  modifs[champ] = transformation(valeursMulti(boite[champ])).join('\n');
  sauverBoite(modifs);
}

function majMultiNom(id, champ, transformation) {
  const ligne = nomParId(id);
  if (!ligne) return;
  const decouper = champ === 'Mots-clés' ? motsCles : valeursMulti;
  const modifs = {};
  modifs[champ] = transformation(decouper(ligne[champ])).join('\n');
  sauverNom(id, modifs);
}

/** Selon la cible (boîte ou sous-ensemble), la bonne écriture. */
function majMultiCible(cible, transformation) {
  if (cible.portee === 'boite') majMultiBoite(cible.champ, transformation);
  else majMultiNom(cible.id, cible.champ, transformation);
}

const ajouterA = function (valeur) {
  return function (liste) {
    const existe = liste.some(function (v) { return normaliserTexte(v) === normaliserTexte(valeur); });
    return existe ? liste : liste.concat([valeur]);
  };
};
const retirerDe = function (valeur) {
  return function (liste) {
    return liste.filter(function (v) { return v !== valeur; });
  };
};

// ------------------------------------------------------------
// Actions
// ------------------------------------------------------------
enregistrerActions({
  // --- navigation ---
  'changer-onglet': function (d) { Store.ongletActif = d.onglet; rendreInterface(); },
  'basculer-type': function (d) {
    const i = Store.filtreTypes.indexOf(d.type);
    Store.filtreTypes = i === -1
      ? Store.filtreTypes.concat([d.type])
      : Store.filtreTypes.filter(function (t) { return t !== d.type; });
    rendreInterface();
  },
  'changer-vue': function (d) {
    if (d.vue !== 'boites' && d.vue !== 'pieces') return;
    Store.vueMode = d.vue;
    enregistrerReglages();
    rendreInterface();
  },

  'basculer-tri': function () {
    const menu = parId('triMenu'), bouton = parId('triBouton');
    if (!menu) return;
    const ouvert = !menu.hidden;
    menu.hidden = ouvert;
    if (bouton) bouton.setAttribute('aria-expanded', String(!ouvert));
  },
  'choisir-tri': function (d) {
    Store.tri = d.tri;
    enregistrerReglages();
    rendreInterface();
  },

  // --- indicateurs : chacun est un filtre ---
  'filtrer-statut': function (d) {
    Store.filtreStatut = Store.filtreStatut === d.statut ? null : d.statut;
    rendreInterface();
  },
  'filtrer-reutilise': function () {
    Store.filtreReutilise = !Store.filtreReutilise;
    rendreInterface();
  },

  'ouvrir-doublons': function () {
    const vue = calculerVue();
    const r = compterDoublonsProbables(vue.aAfficher);
    definirTexte('doublonsSous', r.nombre === null
      ? 'Trop de pièces pour un balayage complet.'
      : r.nombre + ' paire(s) au-dessus de ' + SEUIL_DOUBLON + ' %, selon vos critères courants.');

    definirHtml('doublonsCorps', (r.paires && r.paires.length)
      ? r.paires.map(function (p) {
          return '<div class="doublon">' +
            '<div class="doublon-piece">' +
              '<div class="doublon-pn">' + esc(txt(p.a['PN du type'])) + '</div>' +
              '<button type="button" class="doublon-boite btn-lien"' +
                dataAttrs({ action: 'ouvrir-fiche-depuis-doublons', pn: p.a[CLE_PN()] }) + '>' +
                esc(txt(p.a[CLE_PN()])) + '</button>' +
            '</div>' +
            '<span class="doublon-lien" aria-hidden="true">↔</span>' +
            '<div class="doublon-piece">' +
              '<div class="doublon-pn">' + esc(txt(p.b['PN du type'])) + '</div>' +
              '<button type="button" class="doublon-boite btn-lien"' +
                dataAttrs({ action: 'ouvrir-fiche-depuis-doublons', pn: p.b[CLE_PN()] }) + '>' +
                esc(txt(p.b[CLE_PN()])) + '</button>' +
            '</div>' +
            '<span class="score ' + (p.score >= 95 ? 'score-fort' : 'score-moyen') + '">' +
              '<b>' + p.score + '<small>%</small></b></span>' +
          '</div>';
        }).join('')
      : '<div class="etat-vide"><p>Aucun doublon probable.</p>' +
        '<p class="etat-vide-aide">Deux pièces de même type, de PN différents, ' +
        'doivent dépasser ' + SEUIL_DOUBLON + ' % pour apparaître ici.</p></div>');
    ouvrirModal('doublonsModal');
  },
  'ouvrir-fiche-depuis-doublons': function (d) {
    fermerModal('doublonsModal');
    ACTIONS['ouvrir-fiche'](d);
  },

  'effacer-recherche': function () {
    Store.recherche = '';
    const c = parId('searchBar'); if (c) c.value = '';
    rendreInterface();
  },
  'tout-effacer': function () {
    Store.recherche = ''; Store.filtreComposants = []; Store.filtreTypes = [];
    Store.filtreStatut = null; Store.filtreReutilise = false;
    Store.ongletActif = 'Toutes';
    const c = parId('searchBar'); if (c) c.value = '';
    rendreInterface();
  },

  'ouvrir-fiche': function (d) {
    Store.pnCourant = d.pn;
    Store.enEditionBoite = false;
    Store.enEditionNom = {};
    rendreFiche();
    ouvrirPanneau();
  },
  'ouvrir-fiche-depuis-compare': function (d) {
    fermerModal('compareModal');
    Store.pnCourant = d.pn;
    Store.enEditionBoite = false;
    Store.enEditionNom = {};
    rendreFiche();
    ouvrirPanneau();
  },

  // --- boîte ---
  'editer-boite':  function () { Store.enEditionBoite = true;  rendreFiche(); },
  'annuler-boite': function () { Store.enEditionBoite = false; rendreFiche(); },
  'sauver-boite':  function () { sauverBoite(lireChamps('champ-boite')); },

  'supprimer-boite': function (d) {
    const boite = boiteParPn(d.pn);
    if (!boite) return;
    const nb = (boite.nomenclature || []).length;
    confirmer({
      titre: 'Supprimer la boîte ' + d.pn,
      message: 'Ses ' + nb + ' sous-ensemble(s) seront supprimés avec elle.\n' +
               'Vous pourrez annuler juste après.',
      bouton: 'Supprimer', danger: true
    }).then(function (oui) {
      if (!oui) return;
      // Capture AVANT suppression : c'est ce qui rend l'annulation possible.
      memoriserSuppression('boite', {
        boite: JSON.parse(JSON.stringify(boite)),
        lignes: JSON.parse(JSON.stringify(boite.nomenclature || []))
      });
      indicateurBoite();
      return Api.supprimerBoite(d.pn)
        .then(function (r) {
          retirerBoite(r.pnSupprime);
          fermerPanneau();
          rafraichir();
          afficherBandeauAction('Boîte ' + r.pnSupprime + ' supprimée.',
                                'Annuler', 'annuler-suppression');
        })
        .catch(function (e) {
          Store.derniereSuppression = null;
          signalerErreur(e, "suppression de la boîte");
        });
    });
  },

  'ajouter-multi-boite': function (d) {
    const v = lireSaisieMulti(d.champ);
    if (v) majMultiBoite(d.champ, ajouterA(v));
  },
  'supprimer-multi-boite': function (d) { majMultiBoite(d.champ, retirerDe(d.valeur)); },

  // --- sous-ensembles ---
  'editer-nom':  function (d) { Store.enEditionNom[d.id] = true;  rendreFiche(); },
  'annuler-nom': function (d) { Store.enEditionNom[d.id] = false; rendreFiche(); },
  'sauver-nom':  function (d) { sauverNom(d.id, lireChamps('champ-nom', d.id)); },

  'supprimer-nom': function (d) {
    const ligne = nomParId(d.id);
    if (!ligne) return;
    const nom = txt(ligne['PN du type'], typeDe(ligne).libelle);
    confirmer({
      titre: 'Supprimer « ' + nom + ' »',
      message: 'Le sous-ensemble est retiré de la boîte.\nVous pourrez annuler juste après.',
      bouton: 'Supprimer', danger: true
    }).then(function (oui) {
      if (!oui) return;
      memoriserSuppression('nomenclature', JSON.parse(JSON.stringify(ligne)));
      indicateurNom(d.id);
      return Api.supprimerNom(d.id)
        .then(function (r) {
          retirerNom(r.idSupprime);
          rafraichir();
          afficherBandeauAction('« ' + nom + ' » supprimé.', 'Annuler', 'annuler-suppression');
        })
        .catch(function (e) {
          Store.derniereSuppression = null;
          signalerErreur(e, 'suppression du sous-ensemble');
        });
    });
  },

  'annuler-suppression': function () { restaurer(); },

  'ajouter-multi-nom': function (d) {
    const v = lireSaisieMulti(d.champ, d.id);
    if (v) majMultiNom(d.id, d.champ, ajouterA(v));
  },
  'supprimer-multi-nom': function (d) { majMultiNom(d.id, d.champ, retirerDe(d.valeur)); },

  // --- composants à trois niveaux ---
  'ajouter-composant': function (d) {
    const c = lireSaisieComposant(d.champ, d.id);
    if (!c) { afficherBandeau('Indiquez au moins la fonction du composant.', 'erreur'); return; }
    majMultiCible({ portee: d.portee, id: d.id, champ: d.champ },
                  ajouterA(formaterComposantStructure(c)));
  },
  'supprimer-composant': function (d) {
    majMultiCible({ portee: d.portee, id: d.id, champ: d.champ }, retirerDe(d.valeur));
  },

  // --- équivalences ---
  'comparer-boite': function (d) { afficherEquivalencesBoite(d.pn); },
  'comparer-nom':   function (d) { afficherEquivalencesNom(d.id); },

  // --- catalogue ---
  'ouvrir-catalogue': function (d) {
    Store.cibleCatalogue = { portee: d.portee || 'nom', id: d.id || null,
                             champ: d.champ, categorie: d.categorie || 'composant' };
    Store.idNomCourant = d.id || Store.idNomCourant;
    const r = parId('catSearch'); if (r) r.value = '';
    const cat = CATEGORIES_COMPOSANT[Store.cibleCatalogue.categorie] || CATEGORIES_COMPOSANT.composant;
    definirTexte('catalogueSous', cat.libelle + ' — ' + cat.aide);
    rendreCatalogue();
    ouvrirModal('catalogueModal');
  },
  'ajouter-catalogue': function (d) {
    const entree = Store.catalogue[Number(d.index)];
    const cible = Store.cibleCatalogue;
    if (!entree || !cible) return;
    const formate = formaterComposantStructure(composantDepuisCatalogue(entree));
    if (!formate) return;
    fermerModal('catalogueModal');
    majMultiCible(cible, ajouterA(formate));
  },

  // --- création ---
  'nouvelle-boite': function () { ouvrirModal('newBoiteModal'); },
  'creer-boite': function () {
    const pn = parId('newBoitePn').value.trim();
    if (!pn) { afficherBandeau('Le PN Global est obligatoire.', 'erreur'); return; }
    fermerModal('newBoiteModal');
    // La boîte naît complète : on renseigne tout ce qui la caractérise en une
    // fois, les sous-ensembles viennent ensuite.
    const porteurs = Array.prototype.slice.call(
      document.querySelectorAll('#newBoitePorteurs input:checked')).map(function (i) { return i.value; });
    const complement = {
      'Porteur': porteurs.join('\n'),
      'Statut': parId('newBoiteStatut').value.trim(),
      'Niveau de qualification': parId('newBoiteNiveau').value.trim(),
      'Image': parId('newBoiteImage').value.trim()
    };
    Api.creerBoite(pn, parId('newBoiteFonction').value, parId('newBoiteDs').value)
      .then(function (r) {
        appliquerBoite(r.boite);
        const aEcrire = {};
        Object.keys(complement).forEach(function (k) {
          if (complement[k]) aEcrire[k] = complement[k];
        });
        if (!Object.keys(aEcrire).length) return r.boite;
        return Api.sauverBoite(r.boite[CLE_PN()], aEcrire).then(function (r2) {
          appliquerBoite(r2.boite, r2.pnPrecedent);
          return r2.boite;
        });
      })
      .then(function (boite) {
        ['newBoitePn', 'newBoiteFonction', 'newBoiteDs',
         'newBoiteNiveau', 'newBoiteImage'].forEach(function (i) { parId(i).value = ''; });
        parId('newBoiteStatut').value = 'En étude';
        document.querySelectorAll('#newBoitePorteurs input').forEach(function (i) { i.checked = false; });
        Store.pnCourant = boite[CLE_PN()];
        rafraichir();
        rendreFiche();
        ouvrirPanneau();
      })
      .catch(function (e) { signalerErreur(e, "création de la boîte"); });
  },

  'nouveau-sous-ensemble': function () {
    definirHtml('choixType', typesProposes().map(function (t, i) {
      return '<label class="choix-type ' + t.teinte + '">' +
        '<input type="radio" name="typeNouveau" value="' + esc(t.cle) + '"' +
          (i === 0 ? ' checked' : '') + '>' +
        '<span class="choix-icone" aria-hidden="true">' + t.icone + '</span>' +
        '<span class="choix-libelle">' + esc(t.libelle) + '</span>' +
        '<span class="choix-aide">' + esc(t.champs.length) + ' champs</span>' +
      '</label>';
    }).join(''));
    ouvrirModal('newSousEnsModal');
  },
  'creer-sous-ensemble': function () {
    const choisi = document.querySelector('input[name="typeNouveau"]:checked');
    if (!choisi) return;
    const pn = parId('newEnsPn').value.trim();
    fermerModal('newSousEnsModal');
    Api.creerNom(Store.pnCourant, libelleType(choisi.value), pn)
      .then(function (r) {
        appliquerNom(r.ligne);
        parId('newEnsPn').value = '';
        Store.enEditionNom[r.ligne[CLE_NOM()]] = true;   // ouvert en saisie directe
        rafraichir();
      })
      .catch(function (e) { signalerErreur(e, 'ajout du sous-ensemble'); });
  },

  // --- recherche par composants ---
  'ouvrir-multi-recherche': function () { rendreChoixComposants(); ouvrirModal('multiSearchModal'); },
  'ajouter-chip': function () {
    const champ = parId('multiSearchInputSelect');
    const v = champ.value.trim();
    if (!v || Store.filtreComposants.indexOf(v) !== -1) { champ.value = ''; return; }
    Store.filtreComposants = Store.filtreComposants.concat([v]);
    champ.value = '';
    rendreChoixComposants();
  },
  'retirer-chip': function (d) {
    Store.filtreComposants = Store.filtreComposants.filter(function (v) { return v !== d.valeur; });
    rendreChoixComposants();
  },
  'lancer-multi-recherche': function () {
    fermerModal('multiSearchModal');
    Store.ongletActif = 'Toutes';
    rendreInterface();
  },
  'retirer-filtre': function (d) {
    Store.filtreComposants = Store.filtreComposants.filter(function (v) { return v !== d.valeur; });
    rendreInterface();
  },

  // --- réglages : un rail à gauche du classement ---
  'ouvrir-reglages': function (d) {
    if (d && d.portee) porteeReglee = d.portee;
    else if (Store.comparaison) porteeReglee = Store.comparaison.portee;
    const ouvrir = !railOuvert();
    if (ouvrir) rendreReglages();
    afficherRail(ouvrir);
    rafraichirComparaison();      // le bouton du rappel change de libellé
  },
  'fermer-reglages': function () { afficherRail(false); rafraichirComparaison(); },
  'regler-portee': function (d) { porteeReglee = d.portee; rendreReglages(); },
  'ajouter-critere': function (d) {
    activerCritere(d.portee || porteeReglee, d.critere);
    rendreReglages();
    rafraichirComparaison();
  },
  'retirer-critere': function (d) {
    if (!desactiverCritere(d.portee || porteeReglee, d.critere)) {
      afficherBandeau('Il faut garder au moins un critère.', 'erreur');
      return;
    }
    rendreReglages();
    rafraichirComparaison();
  },
  'reinitialiser-reglages': function () {
    reinitialiserPoids();
    rendreReglages();
    rafraichirComparaison();
  },

  // --- divers ---
  'agrandir-image': function (d) {
    definirHtml('loupeCorps', '<img src="' + esc(d.url) + '" alt="">');
    ouvrirModal('loupeModal');
  }
});

// ------------------------------------------------------------
// Rendus secondaires
// ------------------------------------------------------------
function rendreCatalogue() {
  const requete = parId('catSearch') ? parId('catSearch').value : '';
  const categorie = Store.cibleCatalogue ? Store.cibleCatalogue.categorie : null;
  const r = filtrerCatalogue(requete, categorie);
  definirHtml('catalogueList', r.affiches.length
    ? '<div class="catalogue-entete"><span>Fonction</span><span>Norme</span><span>Référence</span><span></span></div>' +
      r.affiches.map(function (e) {
        const c = e.structure;
        return '<button type="button" class="ligne-catalogue"' +
                 dataAttrs({ action: 'ajouter-catalogue', index: e.index }) + '>' +
                 '<span class="niveau-fonction">' + esc(c.fonction) +
                   (c.designation ? '<small>' + esc(c.designation) + '</small>' : '') + '</span>' +
                 '<span class="niveau-norme">' + esc(c.norme || '—') + '</span>' +
                 '<span class="niveau-reference">' + esc(c.reference || '—') + '</span>' +
                 '<span class="ligne-catalogue-plus" aria-hidden="true">+</span>' +
               '</button>';
      }).join('')
    : '<p class="vide">Aucun composant ne correspond.</p>');
  definirTexte('catalogueInfo', r.total > r.affiches.length
    ? r.affiches.length + ' résultats affichés sur ' + r.total + ' — affinez la recherche.'
    : r.total + ' résultat' + (r.total > 1 ? 's' : ''));
}

function rendreChoixComposants() {
  definirHtml('multiSearchPillsContainer', Store.filtreComposants.length
    ? Store.filtreComposants.map(function (c) {
        return '<span class="puce">' + esc(c) +
               '<button type="button" class="puce-suppr" aria-label="Retirer"' +
               dataAttrs({ action: 'retirer-chip', valeur: c }) + '>&times;</button></span>';
      }).join('')
    : '<p class="vide">Aucun composant sélectionné.</p>');
}

// ------------------------------------------------------------
// Démarrage
// ------------------------------------------------------------
document.addEventListener('DOMContentLoaded', function () {
  chargerReglages();
  installerDelegation();

  const recherche = parId('searchBar');
  if (recherche) {
    recherche.addEventListener('input', antiRebond(function () {
      Store.recherche = recherche.value;
      rendreInterface();
    }, 180));
  }

  const cat = parId('catSearch');
  if (cat) cat.addEventListener('input', antiRebond(rendreCatalogue, 180));

  const multi = parId('multiSearchInputSelect');
  if (multi) {
    multi.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); ACTIONS['ajouter-chip'](); }
    });
  }

  // Entrée dans un champ de composant : on ajoute, sans chercher le bouton.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.classList || !e.target.classList.contains('saisie-composant')) return;
    e.preventDefault();
    const bloc = e.target.closest('.ajout-composant');
    const bouton = bloc && bloc.querySelector('[data-action="ajouter-composant"]');
    if (bouton) bouton.click();
  });

  // Curseurs de pondération : recalcul immédiat, c'est tout l'intérêt.
  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('curseur')) {
      // Poser une part redistribue les autres : le total reste à 100 %.
      reglerPoids(e.target.dataset.portee, e.target.dataset.critere, e.target.value);
      enregistrerReglages();
      rafraichirCurseurs(e.target.dataset.critere);
      rafraichirComparaison();
      return;
    }
    if (e.target.id === 'seuilCurseur') {
      Store.seuilEquivalence = Number(e.target.value);
      enregistrerReglages();
      definirTexte('seuilValeur', Store.seuilEquivalence + ' %');
      rafraichirCurseurs(null);
      rafraichirComparaison();
    }
  });

  // Le menu de tri se referme quand on clique ailleurs.
  document.addEventListener('click', function (e) {
    const menu = parId('triMenu');
    if (!menu || menu.hidden) return;
    if (e.target.closest && e.target.closest('.tri')) return;
    menu.hidden = true;
    const bouton = parId('triBouton');
    if (bouton) bouton.setAttribute('aria-expanded', 'false');
  });

  // Raccourcis : « / » pour chercher.
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement &&
        ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(document.activeElement.tagName) === -1) {
      e.preventDefault();
      const c = parId('searchBar'); if (c) c.focus();
    }
  });

  chargerTout();
  chargerCatalogue();
});
</script>
