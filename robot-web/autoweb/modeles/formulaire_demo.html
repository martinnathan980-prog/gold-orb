<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Outil démo — Gestion des plans</title>
<style>
  :root { color-scheme: light; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
  header { background: #1e3a8a; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
  section { background: white; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
  textarea { min-height: 60px; }
  button { margin-top: 16px; background: #2563eb; color: white; border: 0; padding: 10px 18px; border-radius: 4px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .alerte { margin-top: 16px; padding: 12px; border-radius: 4px; font-size: 14px; }
  .alerte-succes { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .alerte-erreur { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
  th { background: #f9fafb; }
  .case { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .case label { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Outil démo — Gestion des plans</h1>
  <span id="etat-connexion">Non connecté</span>
</header>
<main>
  <section id="connexion">
    <h2>Connexion</h2>
    <p>Cet écran simule la connexion à un outil d'entreprise. Identifiant : <b>demo</b> / mot de passe : <b>demo</b>.</p>
    <label for="utilisateur">Identifiant</label>
    <input id="utilisateur" name="utilisateur" type="text" autocomplete="off">
    <label for="mot-de-passe">Mot de passe</label>
    <input id="mot-de-passe" name="mot-de-passe" type="password" autocomplete="off">
    <button id="btn-connexion" type="button">Se connecter</button>
    <div id="message-connexion" class="alerte alerte-erreur" hidden></div>
  </section>

  <section id="application" hidden>
    <h2>Nouveau plan</h2>
    <form id="formulaire-plan" autocomplete="off">
      <label for="numero">Numéro de plan *</label>
      <input id="numero" name="numero" type="text">
      <label for="titre">Titre</label>
      <input id="titre" name="titre" type="text">
      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="">-- choisir --</option>
        <option value="ARC">Architecture</option>
        <option value="STR">Structure</option>
        <option value="ELE">Électricité</option>
        <option value="PLB">Plomberie</option>
      </select>
      <label for="date">Date du plan</label>
      <input id="date" name="date" type="text" placeholder="jj/mm/aaaa">
      <div class="case">
        <input id="urgent" name="urgent" type="checkbox">
        <label for="urgent">Urgent</label>
      </div>
      <label for="commentaire">Commentaire</label>
      <textarea id="commentaire" name="commentaire"></textarea>
      <button type="submit">Enregistrer</button>
    </form>
    <div id="message" class="alerte" hidden></div>

    <h2>Plans enregistrés</h2>
    <table id="liste">
      <thead><tr><th>Référence</th><th>Numéro</th><th>Titre</th><th>Type</th><th>Date</th><th>Urgent</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
(function () {
  var stockage = window.sessionStorage;
  function lire(cle, defaut) { try { var v = stockage.getItem(cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } }
  function ecrire(cle, valeur) { try { stockage.setItem(cle, JSON.stringify(valeur)); } catch (e) {} }

  var connecte = lire("connecte", false);
  var plans = lire("plans", []);

  function afficherEtat() {
    document.getElementById("connexion").hidden = connecte;
    document.getElementById("application").hidden = !connecte;
    document.getElementById("etat-connexion").textContent = connecte ? "Connecté : demo" : "Non connecté";
    var corps = document.querySelector("#liste tbody");
    corps.innerHTML = "";
    plans.forEach(function (p) {
      var tr = document.createElement("tr");
      [p.reference, p.numero, p.titre, p.type, p.date, p.urgent ? "oui" : "non"].forEach(function (v) {
        var td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
      });
      corps.appendChild(tr);
    });
  }

  document.getElementById("btn-connexion").addEventListener("click", function () {
    var u = document.getElementById("utilisateur").value.trim();
    var m = document.getElementById("mot-de-passe").value;
    var msg = document.getElementById("message-connexion");
    if (u === "demo" && m === "demo") {
      connecte = true; ecrire("connecte", true); msg.hidden = true; afficherEtat();
    } else {
      msg.textContent = "Identifiant ou mot de passe incorrect."; msg.hidden = false;
    }
  });

  document.getElementById("formulaire-plan").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var msg = document.getElementById("message");
    msg.hidden = true; msg.className = "alerte";
    var numero = document.getElementById("numero").value.trim();
    var bouton = this.querySelector("button[type=submit]");
    bouton.disabled = true;
    var formulaire = this;
    // délai artificiel : les vrais outils répondent rarement instantanément
    window.setTimeout(function () {
      bouton.disabled = false;
      if (!numero) {
        msg.textContent = "Le numéro de plan est obligatoire.";
        msg.className = "alerte alerte-erreur"; msg.hidden = false;
        return;
      }
      var reference = "REF-" + String(plans.length + 1).padStart(4, "0");
      var typeSelect = document.getElementById("type");
      plans.push({
        reference: reference,
        numero: numero,
        titre: document.getElementById("titre").value.trim(),
        type: typeSelect.options[typeSelect.selectedIndex].text,
        date: document.getElementById("date").value.trim(),
        urgent: document.getElementById("urgent").checked
      });
      ecrire("plans", plans);
      msg.innerHTML = "Plan enregistré sous la référence <span id=\"reference\"></span>.";
      msg.querySelector("#reference").textContent = reference;
      msg.className = "alerte alerte-succes"; msg.hidden = false;
      formulaire.reset();
      afficherEtat();
    }, 400);
  });

  afficherEtat();
})();
</script>
</body>
</html>
