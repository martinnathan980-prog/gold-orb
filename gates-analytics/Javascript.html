  function motLotRapp(cle, n, nom) { return nb(n) + ' ' + phraseLot(cle, n, nom); }
  function majuscule(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function rendreRapprochement() {
    var zone = $('rapprochement');
    if (!RAPPROCHEMENT) { zone.hidden = true; return; }
    zone.hidden = false;
    var R = RAPPROCHEMENT, rap = SRC.rapprochement, nom = nomSeconde();
    /* Le titre suffit : la phrase et le compte redisaient ce que la figure
       et les verdicts montrent, et personne ne les lisait. */
    $('titre-rapprochement').textContent = 'Comparaison des bases de données';

    /* Les comptes : un plan d'ici dans une seule case, et à part ce que la
       seconde base est seule à connaître. */
    var comptes = {};
    LOTS_RAPPROCHEMENT.forEach(function (l) { comptes[l.cle] = compteLotRapp(l.cle); });
    var nP = R.nbPlans, nSeuls = comptes.seul;

    /* La réponse, sous le titre : les deux écarts qui demandent un geste —
       des validés que SEE ne connaît pas, des plans de SEE que GATES ne dit
       pas validés. Une part à 0 se tait ; les deux à 0, la phrase aussi. */
    var actifLot = lotRappActif();
    var morceaux = [];
    if (comptes.manque) morceaux.push('\x3Cbutton type="button" data-rapp="manque" aria-pressed="' + (actifLot === 'manque') + '">' + nb(comptes.manque) + '\x3C/button> ' +
      (comptes.manque > 1 ? 'plans validés absents de ' : 'plan validé absent de ') + ech(nom));
    if (comptes.avance) morceaux.push('\x3Cbutton type="button" data-rapp="avance" aria-pressed="' + (actifLot === 'avance') + '">' + nb(comptes.avance) + '\x3C/button> ' +
      (comptes.avance > 1 ? 'plans' : 'plan') + ' dans ' + ech(nom) + ' que GATES ne dit pas ' + (comptes.avance > 1 ? 'validés' : 'validé'));
    var reponse = $('reponse-rapprochement');
    if (reponse) {
      reponse.hidden = !morceaux.length;
      reponse.innerHTML = morceaux.length ? 'À traiter\u00a0: ' + morceaux.join(' \u00b7 ') : '';
    }

    /* La figure : deux cercles, ce qu'ils ont en commun au milieu — avec un
       anneau pour la part de plans d'accord — et ce que chacun est seul à
       connaître sur les côtés. À la première apparition d'une source,
       l'anneau se trace sous les yeux du lecteur — quand la section entre
       dans l'écran, pas avant. */
    var figure = $('venn-rapprochement');
    figure.innerHTML = figureRapprochement(comptes, R, nom, !!vue.perimetre);
    if (ANIMER_FIGURE) { ANIMER_FIGURE = false; animerALApparition(figure); }
    var membres = LOTS_RAPPROCHEMENT.filter(function (l) { return comptes[l.cle] && l.cle !== 'seul'; })
      .map(function (l) { return motLotRapp(l.cle, comptes[l.cle], nom); });
    /* Les phrases des verdicts portent leurs propres virgules : à voix
       haute, les lots se séparent d'un point-virgule. */
    figure.setAttribute('aria-label', 'Comparaison GATES / ' + nom + ', sur ' + nb(nP) + (nP > 1 ? ' plans' : ' plan') + ' : ' +
      (membres.length ? membres.join(' ; ') : 'aucun plan') +
      (nSeuls ? ' ; ' + motLotRapp('seul', nSeuls, nom) : '') + '.');

    /* Les verdicts : une ligne par lot, le nombre puis la phrase, et la
       seule liste de la section (débrief 14 : plus de « plan par plan » qui
       répétait les six lignes). Un clic filtre les tableaux ET déplie les
       plans du lot sous sa ligne, comme une ligne d'ATA ; le chevron le dit.
       Un lot à 0 se lit mais ne se clique pas — la colonne sert aussi de
       légende à la figure. */
    var zone = $('verdicts-rapprochement');
    /* La liste se refait entière à chaque rendu : on retient où en était
       chaque lot déplié pour l'y remettre — sur 251 puces, un clic ne doit
       pas tout faire remonter. */
    var defilements = {};
    [].slice.call(zone.querySelectorAll('.verdict-corps[data-lot]')).forEach(function (c) {
      if (c.scrollTop) defilements[c.dataset.lot] = c.scrollTop;
    });
    var actif = lotRappActif();
    var q = motCherche(vue.rechercheRapp), trouvesTotal = 0;
    if (vue.lotRappOuvert && !comptes[vue.lotRappOuvert]) vue.lotRappOuvert = null;
    zone.innerHTML = LOTS_RAPPROCHEMENT.map(function (l) {
      var n = comptes[l.cle], presse = !!n && actif === l.cle;
      var rangees = n ? rangeesLotRapp(l.cle) : [];
      if (q) rangees = rangees.filter(function (r) { return refCorrespond(r.ref, q) || (!!r.la && refCorrespond(r.la, q)); });
      trouvesTotal += q ? rangees.length : 0;
      var ouvert = !!n && (q ? rangees.length > 0 : vue.lotRappOuvert === l.cle);
      return '\x3Cdiv class="verdict-bloc' + (q && !rangees.length ? ' sans-trouve' : '') + '" data-lot="' + l.cle + '" data-ouvert="' + ouvert + '">' +
        '\x3Cbutton class="verdict" type="button" data-cle="' + l.cle + '" data-rapp="' + l.cle + '" data-atterrit="' + l.atterrit +
        '" aria-pressed="' + presse + '" aria-expanded="' + ouvert + '"' + (n ? '' : ' disabled') + '>' +
        pastilleVerdict(l.segment) + '\x3Cspan class="verdict-n">' + nb(n) + '\x3C/span>' +
        '\x3Cspan class="verdict-mot">' + ech(phraseLot(l.cle, n, nom)) + '\x3C/span>' +
        (n ? '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
          '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '') +
        '\x3C/button>' +
        (ouvert ? corpsLotRapp(l.cle, rangees, n, nom, !!q) : '') + '\x3C/div>';
    }).join('') +
      (q && !trouvesTotal ? '\x3Cdiv class="vide-message">Aucun plan de la comparaison ne contient « ' +
        ech(vue.rechercheRapp.trim()) + ' ». Échap vide la recherche.\x3C/div>' : '');
    Object.keys(defilements).forEach(function (cle) {
      var corps = zone.querySelector('.verdict-corps[data-lot="' + cle + '"]');
      if (corps) corps.scrollTop = defilements[cle];
    });
  }

  /* Le tri des références se rejoue à chaque rendu : un comparateur
     construit une fois (Intl.Collator, quand le navigateur l'a) coûte vingt
     fois moins que localeCompare avec ses options à chaque paire. */
  var COMPARER_REF = (window.Intl && Intl.Collator)
    ? new Intl.Collator('fr', { numeric: true, sensitivity: 'base' }).compare
    : function (a, b) { return a.localeCompare(b, 'fr', { numeric: true, sensitivity: 'base' }); };
  /* Les autres tris de la page, chacun avec les options exactes de son
     localeCompare d'avant (débrief 23) : par définition (ECMA-402),
     a.localeCompare(b, l, o) EST new Intl.Collator(l, o).compare(a, b) —
     le même ordre, sans refaire le comparateur à chaque paire. */
  function comparateur(langue, options) {
    if (window.Intl && Intl.Collator) return new Intl.Collator(langue, options).compare;
    return function (a, b) { return String(a).localeCompare(String(b), langue, options); };
  }
  var COMPARER_NUM = comparateur('fr', { numeric: true });     // le journal, le bloc par groupe, le périmètre
  var COMPARER_FR = comparateur('fr');                          // les dimensions du bloc
  var COMPARER_LOCAL = comparateur();                           // la référence, sous un tri par la colonne suivie
  window.__comparateurs = function () { return { ref: COMPARER_REF, num: COMPARER_NUM, fr: COMPARER_FR, local: COMPARER_LOCAL }; };
  /* Les rangées d'un lot. Pour un plan d'ici : sa référence, son état, et
     ce que la seconde base en dit — absent, présent, ou sous quel indice.
     Pour une ligne seulement là : sa référence recomposée, et la valeur de
     sa première colonne de référence (NAME), qui sert à la retrouver dans le
     tableau de là. */
  function rangeesLotRapp(cle) {
    var R = RAPPROCHEMENT, rap = SRC.rapprochement;
    if (cle === 'seul') {
      var premiere = Array.isArray(rap.cleReference) ? rap.cleReference[0] : rap.cleReference;
      return R.lignes.filter(function (e) { return e.cat === 'seul'; }).map(function (e) {
        return { ref: e.ref, plan: null, la: String(e.ligne[premiere] == null ? '' : e.ligne[premiere]).trim() || e.ref, see: 'présent' };
      });
    }
    if (cle === 'emission') {
      return R.emission.map(function (x) {
        return { ref: x.plan.reference, plan: x.plan, vers: x.indice_la, see: 'sous l\u2019indice ' + x.indice_la + ' (' + x.ref_la + ')' };
      });
    }
    var see = cle === 'manque' || cle === 'attente' ? 'absent' : 'présent';
    return R[cle].map(function (p) { return { ref: p.reference, plan: p, see: see }; });
  }
  /* Les plans d'un lot, dépliés sous sa ligne : une puce par plan — tous,
     sans coupure. Sa pastille d'état dans GATES, sa référence, et pour une
     réémission la lettre sous laquelle la seconde base le connaît. En tête,
     la légende des pastilles (ou, pendant une recherche, combien sont
     trouvés) ; le détail tient dans la bulle du survol, un clic mène au
     tableau. Au-delà d'une hauteur, la zone défile plutôt que de pousser
     la page. */
  function corpsLotRapp(cle, rangees, n, nom, cherche) {
    rangees = rangees.slice().sort(function (a, b) { return COMPARER_REF(a.ref, b.ref); });
    /* La légende des pastilles : seulement les valeurs de la liste, écrites
       comme dans la colonne, dans l'ordre de la barre — et aucune quand il
       n'y en a qu'une (elle disait toujours « Validé · En cours · À faire ·
       Non renseigné », même sous « validés, absents de SEE »). */
    var vues = {};
    rangees.forEach(function (r) { if (r.plan) vues[cleValeur(r.plan[CLE_SUIVIE])] = r.plan; });
    var valeursListe = VALEURS_COLONNE.filter(function (v) { return vues[v.cle]; });
    var legende = valeursListe.length > 1
      ? '\x3Cspan class="rapp-puces-legende" aria-label="Pastilles : valeur du plan dans GATES">' + valeursListe.map(function (v) {
          return '\x3Cspan>' + pastilleValeur(v.cle, v.famille) + ech(libelleValeur(vues[v.cle][CLE_SUIVIE])) + '\x3C/span>';
        }).join('') + '\x3C/span>'
      : '';
    /* Copier les références de la liste, telle qu'elle s'affiche (une
       recherche n'en garde que les trouvées). */
    var copier = boutonCopier(rangees.map(function (r) { return r.ref; }));
    var tete = cherche
      ? '\x3Cspan class="rapp-sur">' + nb(rangees.length) + (rangees.length > 1 ? ' trouvés' : ' trouvé') + ' sur ' + nb(n) + '\x3C/span>'
      : (cle === 'seul'
          ? '\x3Cspan class="rapp-sur">un clic sur une ligne la montre dans le tableau de ' + ech(nom) + '\x3C/span>'
          : legende);
    tete += copier;
    return '\x3Cdiv class="verdict-corps" data-lot="' + cle + '">\x3Cdiv class="verdict-corps-tete">' + tete + '\x3C/div>\x3Cdiv class="rapp-puces">' +
      rangees.map(function (r) {
        var etat = r.plan ? r.plan._etat : '';
        var motEtat = r.plan ? (ETAT_PAR_CLE[etat] ? ETAT_PAR_CLE[etat].court : '\u2014') + ' dans GATES' : 'aucun plan dans GATES';
        var bulle = motEtat + ' \u00b7 ' + r.see + ' dans ' + nom +
          (r.plan ? ' \u2014 ne montrer que ce plan dans le tableau' : ' \u2014 voir cette ligne dans le tableau de ' + nom);
        var attrs = r.plan
          ? ' data-plan-rapp="' + ech(r.ref) + '" data-etat="' + ech(etat) + '"'
          : ' data-ligne-la="' + ech(r.la) + '"';
        return '\x3Cbutton class="rapp-puce" type="button"' + attrs + ' data-see="' + ech(r.see) + '" title="' + ech(bulle) + '">' +
          (r.plan ? pastilleValeur(cleValeur(r.plan[CLE_SUIVIE]), etat) : '') +
          '\x3Cspan class="rapp-puce-ref">' + ech(r.ref) + '\x3C/span>' +
          (r.vers ? '\x3Cspan class="rapp-puce-vers">\u2192 ' + ech(r.vers) + '\x3C/span>' : '') + '\x3C/button>';
      }).join('') + '\x3C/div>\x3C/div>';
  }

  /* La bulle d'un lot : ce que c'est, combien, le détail qui aide — la part
     des terminés, les paires « référence → solution et lettre », la
     répartition par état — et où mène le clic. */
  var MAX_PAIRES_RAPP = 10;
  /* Débrief 22 : la répartition se lit valeur par valeur, dans l'ordre des
     tuiles et à la couleur de chacune — le bleu de PWD_IN_PROGRESS ne
     couvre plus des PWD_TO_CONTROL et des TO_CONFIRM, comme dans la liste
     « plan par plan » juste dessous. Un plan dont la valeur n'a pas de
     tuile (cas d'école) reste compté avec sa famille. */
  function repartitionEtats(plans) {
    var parValeur = {}, parFamille = {};
    plans.forEach(function (p) {
      if (valeurDeCle(p._cle)) parValeur[p._cle] = (parValeur[p._cle] || 0) + 1;
      else parFamille[p._etat] = (parFamille[p._etat] || 0) + 1;
    });
    return VALEURS_COLONNE.filter(function (v) { return parValeur[v.cle]; }).map(function (v) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleValeur(v.cle, v.famille) + ech(v.libelle) + ' dans GATES\x3Cspan class="n">' + nb(parValeur[v.cle]) + '\x3C/span>\x3C/div>';
    }).concat(ETATS.filter(function (e) { return parFamille[e.cle]; }).map(function (e) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleDe(e.cle) + ech(e.libelle.toLowerCase()) + ' dans GATES\x3Cspan class="n">' + nb(parFamille[e.cle]) + '\x3C/span>\x3C/div>';
    })).join('');
  }
  function bulleLotRapp(cle) {
    var R = RAPPROCHEMENT, nom = nomSeconde();
    var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
    if (!lot) return '';
    var n = compteLotRapp(cle), presse = lotRappActif() === cle, pl = n > 1;
    var tete, corps = '';
    /* À zéro, il n'y a rien à raconter : une bulle qui décrirait l'écart
       laisserait croire qu'il existe. */
    if (!n) {
      return '\x3Cdiv class="tete-bulle">' + ech(majuscule(phraseLot(cle, 2, nom))) + '\x3C/div>' +
        '\x3Cdiv class="doux">aucun : rien à signaler de ce côté-là\x3C/div>';
    }
    /* La tête : la phrase du verdict, mot pour mot. Dessous, le détail. */
    tete = nb(n) + ' ' + phraseLot(cle, n, nom);
    if (cle === 'accord') {
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille accord">\x3C/span>part des validés de GATES' +
        '\x3Cspan class="n">' + (R.nbTermines ? Math.round(100 * n / R.nbTermines) : 0) + '\u202f%\x3C/span>\x3C/div>' +
        '\x3Cdiv class="doux">même indice des deux côtés\x3C/div>';
    } else if (cle === 'emission') {
      var paires = R.emission.map(function (x) { return ech(x.plan.reference) + ' \u2192 ' + ech(x.ref_la.slice(-4)); });
      corps = (paires.length ? '\x3Cdiv class="liste-refs">' + paires.slice(0, MAX_PAIRES_RAPP).join('\x3Cbr>') +
          (paires.length > MAX_PAIRES_RAPP ? '\x3Cbr>\x3Cspan class="doux">et ' + nb(paires.length - MAX_PAIRES_RAPP) + ' autres\u2026\x3C/span>' : '') + '\x3C/div>' : '');
    } else if (cle === 'avance') {
      corps = '\x3Cdiv class="bulle-comptes">' + repartitionEtats(R.avance) + '\x3C/div>' +
        '\x3Cdiv class="doux">' + ech(nom) + (pl ? ' les connaît' : ' le connaît') + ' : l’avancement GATES est peut-être en retard\x3C/div>';
    } else if (cle === 'manque') {
      corps = '\x3Cdiv class="doux">à vérifier des deux côtés\x3C/div>';
    } else if (cle === 'attente') {
      corps = '\x3Cdiv class="bulle-comptes">' + repartitionEtats(R.attente) + '\x3C/div>';
    } else {
      corps = '\x3Cdiv class="doux">aucun plan de GATES sous ' + (pl ? 'leur racine' : 'sa racine') + '\x3C/div>';
    }
    var fin = !n ? 'aucun' : presse ? '\u2192 retirer le filtre'
      : lot.atterrit === 'la' ? '\u2192 le tableau passe sur ' + nom
      : lot.atterrit === 'ici' ? '\u2192 le tableau passe sur GATES'
      : '\u2192 n’afficher que ceux-là dans le tableau';
    return '\x3Cdiv class="tete-bulle">' + ech(tete) + '\x3C/div>' + corps +
      '\x3Cdiv class="doux" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)">' + ech(fin) + '\x3C/div>';
  }
  function eclairerSegment(cle) {
    document.querySelectorAll('#venn-rapprochement [data-cle]').forEach(function (el) {
      var lui = !!cle && el.getAttribute('data-cle') === cle;
      if (lui) el.classList.add('survole'); else el.classList.remove('survole');
    });
  }
  /* La phrase d'un verdict, en français de tous les jours : le nombre est
     déjà écrit à gauche, la phrase dit ce qu'il compte. */
  /* La phrase d'un lot se lit seule, derrière son nombre : plus de mot court
     en gras devant, il ne disait rien de plus. Sous un périmètre, « seulement
     dans la seconde base » compte tout le contrat, et le dit. */
  function phraseLot(cle, n, nom) {
    var pl = n > 1, tout = vue.perimetre && cle === 'seul' ? ' \u2014 tout le contrat' : '';
    if (cle === 'accord') return (pl ? 'validés' : 'validé') + ' dans GATES et ' + (pl ? 'connus' : 'connu') + ' de ' + nom;
    if (cle === 'emission') return 'dans ' + nom + ' sous une autre lettre d’indice';
    if (cle === 'avance') return 'dans ' + nom + ', mais GATES ne ' + (pl ? 'les' : 'le') + ' dit pas ' + (pl ? 'validés' : 'validé');
    if (cle === 'manque') return (pl ? 'validés' : 'validé') + ' dans GATES, mais ' + nom + ' ne ' + (pl ? 'les' : 'le') + ' connaît pas';
    if (cle === 'attente') return (pl ? 'pas validés' : 'pas validé') + ', et pas encore dans ' + nom + ' : rien d’anormal';
    return (pl ? 'lignes de ' : 'ligne de ') + nom + ' sans plan dans GATES' + tout;
  }
  /* Un arc d'anneau, de l'angle a0 à l'angle a1 (en degrés, 0 en haut, sens
     horaire), au rayon r autour de (cx, cy). */
  function arcAnneau(cx, cy, r, a0, a1) {
    var rad = function (a) { return (a - 90) * Math.PI / 180; };
    var x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
    var x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
    return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
  }
  /* La figure du rapprochement : deux cercles qui se recouvrent, le nom et le
     compte de chaque base au-dessus, le nombre en commun au milieu avec son
     anneau (d'accord, autre indice, pas terminé ici), et sur chaque côté ce
     que la base est seule à connaître — à gauche, les terminés que la seconde
     base ignore, et dessous, plus discret, ce qui n'est pas encore créé. Les
     cercles ne sont pas à l'échelle : c'est la structure qu'on lit, les
     nombres disent le reste. */
  function figureRapprochement(c, R, nom, perimetre) {
    var nP = R.nbPlans, nT = R.nbTermines, nL = R.nbLignes, nCommun = c.accord + c.emission + c.avance;
    var cx1 = 206, cx2 = 344, cy = 186, r = 132, cxm = (cx1 + cx2) / 2, ra = 40;
    var s = ['\x3Csvg viewBox="0 0 550 368" aria-hidden="true">'];
    s.push('\x3Ctext class="base-nom" x="' + (cx1 - 56) + '" y="26" text-anchor="middle">GATES\x3C/text>');
    s.push('\x3Ctext class="base-compte" x="' + (cx1 - 56) + '" y="42" text-anchor="middle">' + nb(nP) + (nP > 1 ? ' plans' : ' plan') + (perimetre ? ' du périmètre' : '') +
      ' · ' + nb(nT) + (nT > 1 ? ' validés' : ' validé') + '\x3C/text>');
    s.push('\x3Ctext class="base-nom" x="' + (cx2 + 56) + '" y="26" text-anchor="middle">' + ech(nom) + '\x3C/text>');
    s.push('\x3Ctext class="base-compte" x="' + (cx2 + 56) + '" y="42" text-anchor="middle">' + nb(nL) + (nL > 1 ? ' lignes' : ' ligne') +
      (perimetre ? ' · tout le contrat' : '') + '\x3C/text>');
    s.push('\x3Ccircle class="cercle-ici" cx="' + cx1 + '" cy="' + cy + '" r="' + r + '"/>');
    s.push('\x3Ccircle class="cercle-la" cx="' + cx2 + '" cy="' + cy + '" r="' + r + '"/>');
    /* Les côtés : ce que chaque base est seule à connaître. À gauche, le
       nombre qui compte — des terminés sans plan là — et, dessous, ceux qui
       attendent simplement leur tour. */
    /* Les mots des côtés tiennent sur deux lignes, pour rester dans le
       croissant de leur cercle sans en toucher les bords. */
    s.push('\x3Cg class="cote cote-manque' + (c.manque ? '' : ' zero') + '" data-cle="manque">' +
      '\x3Ctext class="grand" x="' + (cx1 - 60) + '" y="' + (cy - 4) + '" text-anchor="middle">' + nb(c.manque) + '\x3C/text>' +
      '\x3Ctext class="petit" x="' + (cx1 - 60) + '" y="' + (cy + 16) + '" text-anchor="middle">\x3Ctspan>' + (c.manque > 1 ? 'validés ' : 'validé ') + '\x3C/tspan>' +
      '\x3Ctspan x="' + (cx1 - 60) + '" dy="15">sans ' + ech(nom) + '\x3C/tspan>\x3C/text>\x3C/g>');
    /* Ce qui attend son tour se lit dans le cercle aussi — ces plans sont
       de GATES —, sous les terminés sans SEE, plus discret : un
       renseignement, pas un écart. */
    s.push('\x3Cg class="cote cote-attente" data-cle="attente">' +
      '\x3Ctext class="petit" x="' + (cx1 - 60) + '" y="' + (cy + 62) + '" text-anchor="middle">\x3Ctspan class="moyen">' + nb(c.attente) + '\x3C/tspan>\x3Ctspan> pas encore \x3C/tspan>' +
      '\x3Ctspan x="' + (cx1 - 60) + '" dy="15">dans ' + ech(nom) + '\x3C/tspan>\x3C/text>\x3C/g>');
    s.push('\x3Cg class="cote cote-seul" data-cle="seul">' +
      '\x3Ctext class="grand" x="' + (cx2 + 60) + '" y="' + (cy - 4) + '" text-anchor="middle">' + nb(c.seul) + '\x3C/text>' +
      '\x3Ctext class="petit" x="' + (cx2 + 60) + '" y="' + (cy + 16) + '" text-anchor="middle">\x3Ctspan>seulement \x3C/tspan>' +
      '\x3Ctspan x="' + (cx2 + 60) + '" dy="15">dans ' + ech(nom) + '\x3C/tspan>\x3C/text>' +
      (perimetre ? '\x3Ctext class="petit" x="' + (cx2 + 60) + '" y="' + (cy + 47) + '" text-anchor="middle">tout le contrat\x3C/text>' : '') + '\x3C/g>');
    /* Le milieu : l'anneau des plans en commun, en trois parts. */
    s.push('\x3Ccircle class="donut-fond" cx="' + cxm + '" cy="' + cy + '" r="' + ra + '"/>');
    var parts = [['accord', 'accord'], ['emission', 'emission'], ['avance', 'avance']]
      .filter(function (p) { return c[p[0]] > 0; });
    var total = parts.reduce(function (t, p) { return t + c[p[0]]; }, 0);
    /* Une part, même d'un seul plan sur des centaines, reste visible : on lui
       garantit quelques degrés, pris sur les grandes parts. */
    var MIN = 8, portions = parts.map(function (p) { return 360 * c[p[0]] / total; });
    var manque = 0, grandes = 0;
    portions.forEach(function (q) { if (q < MIN) manque += MIN - q; else grandes += q; });
    if (manque > 0 && grandes > 0) portions = portions.map(function (q) { return q < MIN ? MIN : q - manque * q / grandes; });
    var trou = parts.length > 1 ? 3 : 0, angle = 0;          // un blanc entre les parts, comme entre les segments d'une barre
    parts.forEach(function (p, i) {
      var portion = portions[i], a0 = angle + trou / 2, a1 = angle + portion - trou / 2;
      if (a1 - a0 >= 359.9) s.push('\x3Ccircle class="donut-seg ' + p[1] + '" data-cle="' + p[0] + '" data-n="' + c[p[0]] + '" cx="' + cxm + '" cy="' + cy + '" r="' + ra + '"/>');
      else if (a1 > a0) s.push('\x3Cpath class="donut-seg ' + p[1] + '" data-cle="' + p[0] + '" data-n="' + c[p[0]] + '" d="' + arcAnneau(cxm, cy, ra, a0, a1) + '"/>');
      angle += portion;
    });
    s.push('\x3Ctext class="grand commun-n' + (nb(nCommun).length > 3 ? ' serre' : '') + '" x="' + cxm + '" y="' + (cy + (nb(nCommun).length > 3 ? 7 : 9)) + '" text-anchor="middle">' + nb(nCommun) + '\x3C/text>');
    s.push('\x3Ctext class="petit commun-mot" x="' + cxm + '" y="' + (cy + ra + 26) + '" text-anchor="middle">en commun\x3C/text>');
    s.push('\x3C/svg>');
    return s.join('');
  }

  /* ============================================================
     LA SECONDE BASE, TELLE QUE SON EXTRACT
     Toutes ses colonnes, dans son ordre, sous leurs intitulés — la vue de
     référence, comme pour le tableau d'ici — et une vue essentielle si la
     source en désigne une. Le verdict du rapprochement se lit sur chaque
     ligne : la pastille dans la cellule de la référence, les cellules qui
     diffèrent d'ici sous un voile ambre. Cliquer une ligne appariée réduit
     le tableau d'ici au plan correspondant.
     ============================================================ */
  var SECONDE = null;   // { titres, cles, essentielles, vautEssentielles, premiere }
  function preparerSeconde(rap) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) { SECONDE = null; return; }
    var titres = Array.isArray(rap.colonnes) ? rap.colonnes.map(String).filter(Boolean) : [];
    if (!titres.length) {
      var vus = {};
      rap.lignes.forEach(function (l) {
        if (!l || typeof l !== 'object') return;
        Object.keys(l).forEach(function (k) { if (!vus[k]) { vus[k] = true; titres.push(k); } });
      });
    }
    var cles = [].concat(rap.cleReference).map(String);
    /* Les colonnes de la référence font toujours partie de la vue essentielle
       — mais une vue essentielle n'existe que si la source en désigne une :
       les seules colonnes de la référence ne font pas une vue. */
    var ess = cles.filter(function (t) { return titres.indexOf(t) !== -1; });
    var voulues = (Array.isArray(rap.essentielles) ? rap.essentielles : []).map(String)
      .filter(function (t) { return titres.indexOf(t) !== -1; });
    voulues.forEach(function (t) { if (ess.indexOf(t) === -1) ess.push(t); });
    SECONDE = {
      titres: titres, cles: cles, essentielles: ess,
      vautEssentielles: voulues.length > 0 && ess.length >= 2 && ess.length < titres.length,
      premiere: cles[0]
    };
  }
  function lignesSecondeAffichees() {
    var R = RAPPROCHEMENT, S = vue.seconde;
    var lot = lotRappActif();
    var casePlan = lot && LOTS_PLANS.indexOf(lot) !== -1 ? lot : undefined;
    var cherche = norm(S.recherche);
    var lignes = R.lignes.filter(function (e) {
      if (e.cat === 'hors') return false;
      /* Sous un lot, les lignes des plans de cette case — toutes leurs lignes,
         pour que le compte du bouton et le tableau parlent des mêmes plans ;
         « seulement là » garde ses lignes à lui. */
      if (lot === 'seul') { if (e.cat !== 'seul') return false; }
      else if (lot && (!casePlan || !e.plan || R.parPlan[e.plan.reference] !== casePlan)) return false;
      if (cherche && !SECONDE.titres.some(function (t) { return norm(e.ligne[t]).indexOf(cherche) !== -1; })) return false;
      return true;
    });
    if (S.tri.cle) {
      var k = S.tri.cle, sens = S.tri.asc ? 1 : -1;
      lignes = lignes.slice().sort(function (a, b) {
        var va = String(a.ligne[k] == null ? '' : a.ligne[k]), vb = String(b.ligne[k] == null ? '' : b.ligne[k]);
        if (va === '' && vb === '') return a.i - b.i;
        if (va === '') return 1;
        if (vb === '') return -1;
        return COMPARER_REF(va, vb) * sens || a.i - b.i;
      });
    }
    return lignes;
  }
  /* L'interrupteur GATES | SEE et tout ce qui va avec : chaque outil et
     chaque tableau porte data-base, et seul ce qui appartient à la base
     montrée reste visible. Sans seconde base, l'interrupteur s'efface et le
     tableau est celui d'ici. */
  function refleterBase() {
    var laDispo = !!(RAPPROCHEMENT && SECONDE);
    if (!laDispo) vue.base = 'ici';
    var choix = $('choix-base');
    choix.hidden = !laDispo;
    $('bouton-base-la').textContent = laDispo ? nomSeconde() : 'Seconde base';
    document.querySelectorAll('#choix-base button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.base === vue.base));
    });
    document.querySelectorAll('#section-plans [data-base]:not(button)').forEach(function (el) {
      el.hidden = el.dataset.base !== vue.base ||
        (el.id === 'vue-seconde' && !(SECONDE && SECONDE.vautEssentielles));
    });
  }
  function rendreSeconde() {
    if (OUVERTURE) OUVERTURE.secondeAFaire = false;   // dessiné : l'ouverture n'a plus à le faire
    if (!RAPPROCHEMENT || !SECONDE) { $('corps-seconde').innerHTML = ''; $('tete-seconde').innerHTML = ''; return; }
    var R = RAPPROCHEMENT, S = vue.seconde, nom = nomSeconde();
    var cols = S.vueTable === 'essentielle' && SECONDE.vautEssentielles ? SECONDE.essentielles : SECONDE.titres;
    var lignes = lignesSecondeAffichees();
    var lot = lotRappActif();

    $('tete-seconde').innerHTML = '\x3Ctr class="titres-la">' + cols.map(function (t) {
      var actif = S.tri.cle === t;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (S.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      return '\x3Cth scope="col" data-cle="' + ech(t) + '" aria-sort="' + (actif ? (S.tri.asc ? 'ascending' : 'descending') : 'none') +
        '"' + (t === SECONDE.premiere ? ' class="col-fige-la"' : '') + '>\x3Cbutton type="button" data-tri-seconde="' + ech(t) + '">' +
        ech(t) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>';

    var seul = vue.refs && Object.keys(vue.refs).length === 1 ? Object.keys(vue.refs)[0] : null;
    /* Caché derrière l'interrupteur, le tableau de la seconde base n'est pas
       mis en page ; il se dessine par tranches, comme celui de GATES. */
    if (!lignes.length) {
      delete TRANCHES['corps-seconde'];
      var nAbs = compteLotRapp(lot);
      $('corps-seconde').innerHTML = '\x3Ctr>\x3Ctd colspan="' + Math.max(cols.length, 1) + '">\x3Cdiv class="vide-message">' +
        (lot === 'manque' || lot === 'attente'
          ? 'Ces ' + nb(nAbs) + (nAbs > 1 ? ' plans n’ont pas de ligne dans ' : ' plan n’a pas de ligne dans ') + ech(nom) + '. ' +
            '\x3Cbutton class="lien-doux" type="button" data-aller-base="ici">Les voir dans GATES\x3C/button>'
          : 'Aucune ligne ne correspond.') +
        '\x3C/div>\x3C/td>\x3C/tr>';
    } else {
      poserTranches($('corps-seconde'), lignes.length, cols.length, function (k) {
        var e = lignes[k];
        var ref = e.plan ? e.plan.reference : '';
        return '\x3Ctr data-i="' + e.i + '" data-cat="' + e.cat + '"' + (ref ? ' data-plan="' + ech(ref) + '"' : '') +
          (ref && seul === ref ? ' class="choisie"' : '') +
          (ref ? ' title="' + ech(e.cat && e.cat !== 'hors' ? majuscule(phraseLot(e.cat, 1, nom)) + ' — ' : '') + 'cliquez pour retrouver ce plan dans GATES"' : '') + '>' +
          cols.map(function (t) {
            var val = e.ligne[t], s = String(val == null ? '' : val);
            var classes = [], titre = '';
            if (t === SECONDE.premiere) classes.push('col-fige-la');
            var contenu;
            if (t === SECONDE.premiere) {
              contenu = '\x3Cspan class="verdict">' + pastilleVerdict(e.cat) + (ref
                ? '\x3Cbutton type="button" class="ref ref-lien" data-plan="' + ech(ref) + '" title="Retrouver ce plan dans GATES">' + ech(s) + '\x3C/button>'
                : '\x3Cspan class="ref">' + ech(s) + '\x3C/span>') + '\x3C/span>';
            } else if (s === '') { classes.push('doux'); contenu = '-'; }
            else if (estBooleen(s)) { classes.push('coche'); contenu = '\x3Cspan title="' + ech(s) + '">' + (estVrai(s) ? '✓' : '–') + '\x3C/span>'; }
            else contenu = ech(s);
            return '\x3Ctd' + (classes.length ? ' class="' + classes.join(' ') + '"' : '') + titre + '>' + contenu + '\x3C/td>';
          }).join('') + '\x3C/tr>';
      });
    }

    var base = R.nbLignes;
    if (vue.base === 'la') {
      $('compte').textContent = nb(lignes.length) + (lignes.length > 1 ? ' lignes' : ' ligne') +
        (lignes.length !== base ? ' sur ' + nb(base) : '');
    }
    $('legende-seconde').innerHTML = ['accord', 'emission', 'avance', 'seul'].map(function (cat) {
      var mots = { accord: 'validé ici', emission: 'autre indice', avance: 'pas validé ici', seul: 'seulement dans ' + nom };
      return '\x3Cspan>' + pastilleVerdict(cat) + ech(mots[cat]) + '\x3C/span>';
    }).join('');
  }

  /* Le rendu de la page, en quatre morceaux qui calculent chacun exactement
     ce qu'ils calculaient (débrief 23) : l'état (rendreEtat), la synthèse et
     la courbe (le haut), le reste (le bas), puis la fin. Un rendu complet
     les enchaîne d'un bloc ; l'ouverture peint le haut d'abord, et le bas
     juste après (voir « L'OUVERTURE EN DEUX TEMPS »). */
  function rendre() {
    /* Un rendu complet l'emporte sur ce qui restait de l'ouverture : tout est
       dessiné ici, d'un bloc, comme avant. */
    var ouverture = OUVERTURE;
    GENERATION++;
    OUVERTURE = null;
    var liste = rendreEtat();
    rendreAvancement(liste);
    rendreGraphique(liste);
    rendreEcheanceTitre();
    rendreJournal();
    rendreCritique(liste);
    rendreEntetes();
    rendreCorps(liste);
    rendreFichePlan(liste);
    rendreASurveiller();
    rendreRapprochement();
    rendreSeconde();
    rendreIncomplets();
    rendreFiltresActifs();
    rendreFin();
    if (ouverture && !DEMARRAGE_FINI) terminerOuverture();
  }
  /* Tout ce que montre la première image de l'ouverture : la synthèse
     entière — « À surveiller » en fait partie, arrivé après il poussait la
     courbe vers le bas sous les yeux (débrief 23, revue) —, la courbe,
     l'échéance, les filtres. La comparaison des bases, plus bas, se montre
     déjà (vide, « Chargement… ») : le sommaire est juste dès la première
     image, et ne gagne pas d'entrée ensuite. */
  function rendreHaut(liste) {
    rendreAvancement(liste);
    rendreGraphique(liste);
    rendreEcheanceTitre();
    rendreASurveiller();
    rendreFiltresActifs();
    libellerSommaireGroupe();
    $('rapprochement').hidden = !RAPPROCHEMENT;
  }
  function rendreFin() {
    GRAPHE_MESURE = false;
    vue.dernieresCles = clesSelection();
    planifierSauvegarde();
  }
  function rendreEtat() {
    /* La largeur du graphique, lue avant toute écriture (l'ouverture l'a
       déjà lue, avant même ses calculs). */
    if (!GRAPHE_MESURE) { mesurerGraphique(); GRAPHE_MESURE = true; }
    /* SEE ne connaît pas le concept harnais : sous lui, pas de comparaison
       des bases — ni la section, ni l'interrupteur GATES | SEE du tableau. */
    RAPPROCHEMENT = INDICATEUR === 'concept' ? null : rapprocher(SRC.rapprochement, population());
    /* Ce qui vient d'être posé décide de deux choses. Le lot « seulement dans
       la seconde base » ne survit pas à un autre geste de sélection — un
       état, un groupe, une ligne du journal, une recherche : il s'efface
       plutôt que de laisser le tableau de GATES vide sous un filtre qui ne
       le concerne pas. Et une sélection posée pendant qu'on regarde la
       seconde base ramène sur GATES, où elle a un sens — sauf un lot du
       rapprochement, qui se lit des deux côtés. */
    var cles = clesSelection();
    var ajoutees = cles.filter(function (c) { return (vue.dernieresCles || []).indexOf(c) === -1; });
    if (vue.lotLa && cles.some(function (c) { return (vue.clesLotLa || []).indexOf(c) === -1; })) vue.lotLa = null;
    if (vue.base === 'la' && vue.dernieresCles !== undefined &&
        ajoutees.some(function (c) { return c.indexOf('refs:rapprochement:') !== 0; })) vue.base = 'ici';
    /* Un lot posé suit le périmètre : ses références se relisent sur la
       population du moment ; et s'il n'a plus rien — autre périmètre, autre
       source — il se retire de lui-même, jamais un bouton grisé qui reste pressé. */
    var lotPose = lotRappActif();
    if (lotPose) {
      if (!compteLotRapp(lotPose)) poserLotRapp(lotPose);
      else if (lotPose !== 'seul') {
        vue.refs = {};
        refsDuLotRapprochement(lotPose).forEach(function (r) { vue.refs[r] = true; });
      }
    }
    /* La sélection « à l'arrêt » suit le périmètre, comme un lot posé. */
    if (vue.refsLibelle === SEL_ARRET) {
      var arret = plansALArret().liste;
      if (!arret.length) { vue.refs = null; vue.refsLibelle = ''; }
      else { vue.refs = {}; arret.forEach(function (x) { vue.refs[x.plan.reference] = true; }); }
    }
    refleterPerimetre();
    refleterIndicateur();
    if (vue.fenAuto) vue.fen = cadrageParDefaut();
    var liste = selection();
    refleterBase();                    // avant les tableaux : l'ombre du défilement se mesure sur un cadre visible
    return liste;
  }
  /* La sélection en une liste de clés — un état, un groupe, une recherche,
     chaque filtre de colonne, chaque « non renseigné », la sélection de
     plans avec son libellé. Ce qui apparaît dans la liste, c'est un geste ;
     le périmètre n'en est pas, il suit le lot posé. */
  function clesSelection() {
    var cles = [];
    if (vue.etat) cles.push('etat:' + vue.etat);
    if (vue.groupe) cles.push('groupe:' + vue.groupe.dim + '=' + vue.groupe.val);
    if (vue.recherche) cles.push('recherche:' + vue.recherche);
    Object.keys(vue.filtres).forEach(function (k) { if (vue.filtres[k]) cles.push('filtre:' + k + '=' + vue.filtres[k]); });
    Object.keys(vue.vides).forEach(function (k) { if (vue.vides[k]) cles.push('vide:' + k); });
    if (vue.refs) cles.push('refs:' + vue.refsLibelle + ':' + Object.keys(vue.refs).length);
    return cles;
  }

  /* ============================================================ EVENEMENTS */
  var minuteur = null;
  $('recherche').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { vue.recherche = v; rendre(); }, 170);
  });

  /* La barre et ses valeurs se répondent : survoler une valeur éclaire son
     segment — même fin comme un trait —, survoler un segment éclaire sa
     valeur. */
  function eclairerValeur(cle) {
    var barre = $('barre');
    barre.classList.toggle('focalise', !!cle);
    [].forEach.call(barre.querySelectorAll('span[data-cle]'), function (s) { s.classList.toggle('eclaire', s.dataset.cle === cle); });
    [].forEach.call($('etats').querySelectorAll('.etat-btn'), function (b) { b.classList.toggle('eclaire', b.dataset.cle === cle); });
  }
  ['mouseover', 'focusin'].forEach(function (ev) {
    $('etats').addEventListener(ev, function (e) {
      var b = e.target.closest('.etat-btn');
      eclairerValeur(b ? b.dataset.cle : null);
    });
    $('barre').addEventListener(ev, function (e) {
      var s = e.target.closest('span[data-cle]');
      eclairerValeur(s ? s.dataset.cle : null);
    });
  });
  ['mouseleave', 'focusout'].forEach(function (ev) {
    $('etats').addEventListener(ev, function () { eclairerValeur(null); });
    $('barre').addEventListener(ev, function () { eclairerValeur(null); });
  });
  $('etats').addEventListener('click', function (e) {
    var b = e.target.closest('.etat-btn');
    if (!b) return;
    vue.etat = vue.etat === b.dataset.etat ? '' : b.dataset.etat;
    vue.etatParArret = '';            // la tuile est à Nathan, désormais
    /* Une tuile d'une autre valeur que celle du bloc : le choix le plus
       récent l'emporte, plutôt qu'un bloc tout à zéro. */
    if (vue.etat && vue.valeurBloc && vue.valeurBloc !== vue.etat) vue.valeurBloc = '';
    /* De même pour « À surveiller » (des plans en cours) sous une tuile
       Validé ou À faire : la page ne se vide pas, la tuile l'emporte. */
    if (vue.refsLibelle === SEL_ARRET && etatContraireALArret()) { vue.refs = null; vue.refsLibelle = ''; }
    rendre();
  });

  $('corps-tableau').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ref-plan]');
    if (!b) return;
    var ref = b.dataset.refPlan;
    if (vue.refsLibelle === 'plan ' + ref) { vue.refs = null; vue.refsLibelle = ''; rendre(); return; }
    montrerCePlan(ref);
  });
  $('fiche-plan').addEventListener('click', function (e) {
    if (!e.target.closest('button[data-fermer-plan]')) return;
    vue.refs = null; vue.refsLibelle = '';
    rendre();
  });
  $('a-surveiller').addEventListener('click', function (e) {
    if (!e.target.closest('button[data-arret]')) return;
    vue.etatParArret = '';
    if (vue.refsLibelle === SEL_ARRET) { vue.refs = null; vue.refsLibelle = ''; }
    else {
      vue.refs = {};
      plansALArret().liste.forEach(function (x) { vue.refs[x.plan.reference] = true; });
      vue.refsLibelle = SEL_ARRET;
      /* Le choix le plus récent l'emporte : une tuile Validé pressée
         n'aurait laissé aucun plan à l'arrêt à l'écran. */
      if (etatContraireALArret()) vue.etat = '';
    }
    rendre();
  });

  /* Les tuiles du rapprochement : les lots d'ici filtrent le tableau ;
     « seulement là » filtre le tableau de là. Le
     détail se déplie à part. */
  $('rapprochement').addEventListener('click', function (e) {
    var pr = e.target.closest('button[data-plan-rapp]');
    if (pr && RAPPROCHEMENT) {
      /* Comme un clic sur une ligne de la seconde base : le tableau d'ici se
         réduit à ce plan, et le bandeau le dit. */
      montrerCePlan(pr.dataset.planRapp);
      return;
    }
    var la = e.target.closest('button[data-ligne-la]');
    if (la && RAPPROCHEMENT) {
      /* Une ligne que la seconde base est seule à connaître : son tableau,
         cherché sur sa référence. Un lot posé sur les plans d'ici la
         cacherait : il est retiré. Le périmètre reste. */
      if (vue.refsLibelle.indexOf('rapprochement:') === 0) { vue.refs = null; vue.refsLibelle = ''; }
      vue.lotLa = null;
      vue.base = 'la';
      vue.seconde.recherche = la.dataset.ligneLa;
      $('recherche-seconde').value = vue.seconde.recherche;
      rendre();
      allerAuTableau();
      return;
    }
    var b = e.target.closest('button[data-rapp]');
    if (b && RAPPROCHEMENT) {
      /* Un clic pose le lot sur les tableaux et le déplie ; un second clic
         sur le lot posé et déplié retire l'un et l'autre. Pendant une
         recherche, les lots trouvés sont déjà dépliés : le clic ne fait que
         poser ou retirer le filtre. */
      var cleLot = b.dataset.rapp;
      var depuisReponse = !!b.closest('#reponse-rapprochement');
      if (motCherche(vue.rechercheRapp)) poserLotRapp(cleLot);
      else if (vue.lotRappOuvert === cleLot && lotRappActif() === cleLot) { poserLotRapp(cleLot); vue.lotRappOuvert = null; }
      else { if (lotRappActif() !== cleLot) poserLotRapp(cleLot); vue.lotRappOuvert = cleLot; }
      rendre();
      /* Les boutons viennent d'être refaits : le focus revient sur le même,
         la bulle et l'éclairage repartent de zéro. */
      $('bulle').dataset.visible = 'false'; eclairerSegment(null);
      var repris = document.querySelector((depuisReponse ? '#reponse-rapprochement' : '#verdicts-rapprochement') + ' button[data-rapp="' + b.dataset.rapp + '"]');
      if (repris) repris.focus();
      return;

  /* ============================================================

  function refCherchee(t) {

  /* Le jalon éclairé passe au-dessus de ses voisins — son texte, révélé,

  var SOMMAIRE = $('sommaire'), LISTE_SOMMAIRE = $('sommaire-liste');

  function majChapitresPresents() { aMesurer('chapitres'); }
  /* Débrief 27 (lot H, P-F12) : un panneau absent pour ce contrat garde son

  function raisonAbsence(sec) {

      return SRC.rapprochement ? 'Pas de comparaison avec SEE pour ' + nom + '.' : 'Pas de base SEE pour ' + nom + ' : rien à comparer.';
    }

  function poserChapitresPresents() {
    var montrer = LIENS_SOMMAIRE.map(function (a) { return chapitreVisible(chapitreDe(a)); });
    LIENS_SOMMAIRE.forEach(function (a, i) {
      var li = a.parentNode;
      var raison = montrer[i] ? '' : raisonAbsence(chapitreDe(a));
      var cache = !montrer[i] && !raison;

  /* Le bandeau des filtres actifs est collé lui aussi, juste sous le
     sommaire (débrief 27, lot H : --h-sommaire, la hauteur du sommaire) ;

  function majHautSommaire() { aMesurer('hautSommaire'); }

    return ligne ? Math.round(ligne.getBoundingClientRect().height) : 0;

  function lireHautSommaire() {
    var h = hauteurFiltres();

    return function () {

  /* Le panneau courant : le dernier dont le haut est passé sous le sommaire.

  var chapitreCourant = null;
  function majSommaire() {
    var boite = SOMMAIRE.getBoundingClientRect();
    if (!boite.height) return;                       // classeur vide : rien à suivre
    var colle = window.scrollY > 0 && boite.top <= parseFloat(getComputedStyle(SOMMAIRE).top) + 0.5;
    if ((SOMMAIRE.getAttribute('data-colle') === 'true') !== colle) SOMMAIRE.setAttribute('data-colle', colle ? 'true' : 'false');
    // Le contrat peut changer pendant qu'on lit : relu à chaque passage.
    /* Débrief 27 (lot H) : « HDK › Tranche 1 », comme le surtitre du titre —
       la tranche 1 s'écrivait « HDK » tout court. */
    var contrat = colle && CONTRATS && CONTRATS.length ? nomAffiche(CONTRAT) : '';
    if ($('sommaire-contrat').textContent !== contrat) $('sommaire-contrat').textContent = contrat;
    var courant = null, presents = LIENS_SOMMAIRE.filter(function (a) { return !a.parentNode.hidden && !a.hasAttribute('aria-disabled'); });
    var seuil = boite.bottom + hauteurFiltres() + 40;   // débrief 27 : sous le sommaire ET les filtres collés
    presents.forEach(function (a) {
      if (chapitreDe(a).getBoundingClientRect().top <= seuil) courant = a;

    var fond = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    if (fond && presents.length && window.scrollY > 0) courant = presents[presents.length - 1];

  /* Un clic mène au panneau — en douceur, sauf si le système demande moins

  LISTE_SOMMAIRE.addEventListener('click', function (e) {

  /* La hauteur que l'en-tête du bloc, collé en haut du cadre qui défile

  $('zone-critique').addEventListener('focusin', function (e) {

      '\x3Clabel class="admin-champ">Adresse Google\x3Cinput name="email" type="email" required placeholder="prenom.nom@…" autocomplete="off" data-autofocus>\x3C/label>' +
      '\x3Clabel class="admin-champ">Sur\x3Cselect name="contrat">\x3Coption value="">Tous les contrats\x3C/option>' +
        familles.map(function (f) { return '\x3Coption value="' + ech(f) + '">' + ech(f) + ' seulement\x3C/option>'; }).join('') + '\x3C/select>\x3C/label>' +
      '\x3C/div>\x3Cdiv class="admin-form-boutons">\x3Cbutton type="submit" class="bouton principal">Nommer\x3C/button>\x3C/div>\x3C/form>' +
      (lignes ? '\x3Ctable class="admin-table">\x3Cthead>\x3Ctr>\x3Cth>Administrateur\x3C/th>\x3Cth>Sur\x3C/th>\x3Cth>\x3C/th>\x3C/tr>\x3C/thead>\x3Ctbody>' + lignes + '\x3C/tbody>\x3C/table>'
              : '\x3Cdiv class="admin-vide">Aucun administrateur pour l’instant : vous seul pouvez modifier.\x3C/div>') +
      '\x3Cdiv class="admin-note">L’adresse est celle du compte Google avec lequel la personne ouvre le tableau de bord.\x3C/div>';
  }
  function enregistrerAdmins(liste, quoi) {
    occuperAdmin(true);
    appelerServeur('adminEnregistrerAdmins', [liste], function (r) {
      occuperAdmin(false);
      ADMIN.admins = r; ADMIN.confirmer = '';
      rendreAdmin();
      messageAdmin(quoi, 'ok');
    }, function (e) { occuperAdmin(false); messageAdmin(e.message, 'erreur'); });
  }
  function nommerAdmin(form) {
    var email = form.elements.email.value.trim().toLowerCase(), contrat = form.elements.contrat.value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.elements.email.setAttribute('aria-invalid', 'true'); messageAdmin('Adresse illisible.', 'erreur'); return; }
    var liste = ADMIN.admins.admins.map(function (a) { return { email: a.email, contrats: a.contrats.slice() }; });
    var deja = liste.filter(function (a) { return a.email === email; })[0];
    if (deja && contrat && !deja.contrats.length) {
      messageAdmin(email + ' administre déjà tous les contrats : pour la limiter à « ' + contrat + ' », retirer ses droits, puis la nommer sur ce contrat.', 'erreur');
      return;
    }
    if (!deja) liste.push({ email: email, contrats: contrat ? [contrat] : [] });
    else if (!contrat) deja.contrats = [];
    else if (deja.contrats.length && deja.contrats.map(norm).indexOf(norm(contrat)) === -1) deja.contrats.push(contrat);
    enregistrerAdmins(liste, email + (contrat ? ' administre « ' + contrat + ' ».' : ' administre tous les contrats.'));
  }

  $('ouvrir-admin').addEventListener('click', ouvrirAdmin);
  $('admin-fermer').addEventListener('click', fermerAdmin);
  /* Un clic sur le voile ferme le panneau — appuyé et relâché hors de son
     cadre : un blanc à l'intérieur, ou un glissé depuis un champ, ne fait
     pas perdre une saisie. */
  function horsDuCadre(e) {
    var d = $('admin'), r = d.getBoundingClientRect();
    return e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom);
  }
  var appuiDehors = false;
  $('admin').addEventListener('mousedown', function (e) { appuiDehors = horsDuCadre(e); });
  $('admin').addEventListener('click', function (e) { if (appuiDehors && horsDuCadre(e)) fermerAdmin(); appuiDehors = false; });
  $('admin-onglets').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-onglet]');
    if (b && !ADMIN.occupe) { messageAdmin(''); choisirOngletAdmin(b.getAttribute('data-onglet')); }
  });
  $('admin-corps').addEventListener('submit', function (e) {
    e.preventDefault();
    if (ADMIN.occupe) return;
    var form = e.target, sorte = form.getAttribute('data-form');
    if (sorte === 'jalon') enregistrerJalon(form);
    else if (sorte === 'admin') nommerAdmin(form);
  });
  $('admin-corps').addEventListener('change', function (e) {
    if (e.target.getAttribute('data-admin') === 'tous-jalons') { ADMIN.tousLesJalons = e.target.checked; rendreAdmin(); }
  });
  $('admin-corps').addEventListener('click', function (e) {
    var b = e.target.closest('[data-admin]');
    if (!b || ADMIN.occupe || b.tagName === 'INPUT') return;
    var quoi = b.getAttribute('data-admin'), cle = b.getAttribute('data-cle');
    messageAdmin('');
    if (quoi === 'ajouter') { ADMIN.edition = { jalon: null }; rendreAdmin(); }
    else if (quoi === 'modifier') { ADMIN.edition = { jalon: jalonParCle(cle) }; ADMIN.confirmer = ''; rendreAdmin(); }
    else if (quoi === 'annuler') { ADMIN.edition = null; rendreAdmin(); }
    else if (quoi === 'supprimer') { ADMIN.confirmer = cle; rendreAdmin(); }
    else if (quoi === 'supprimer-non' || quoi === 'annuler-contrat') { ADMIN.confirmer = ''; rendreAdmin(); }
    else if (quoi === 'supprimer-oui') {
      var j = jalonParCle(cle);
      if (!j) return;
      occuperAdmin(true);
      appelerServeur('adminSupprimerJalon', [j.ligne, j.signature, CONTRAT], function (r) {
        occuperAdmin(false); ADMIN.confirmer = '';
        appliquerReponseJalons(r);
        messageAdmin('Jalon « ' + j.texte + ' » supprimé.', 'ok');
      }, function (err) { occuperAdmin(false); ADMIN.confirmer = ''; messageAdmin(err.message, 'erreur'); choisirOngletAdmin('jalons'); });
    }
    else if (quoi === 'retirer' || quoi === 'remettre') { ADMIN.confirmer = (quoi === 'remettre' ? 'r:' : 'a:') + b.getAttribute('data-id'); rendreAdmin(); }
    else if (quoi === 'retirer-oui' || quoi === 'remettre-oui') retirerContrat(b.getAttribute('data-id'), quoi === 'retirer-oui');
    else if (quoi === 'oter') { ADMIN.confirmer = 'x:' + b.getAttribute('data-email'); rendreAdmin(); }
    else if (quoi === 'oter-oui') {
      var qui = b.getAttribute('data-email');
      enregistrerAdmins(ADMIN.admins.admins.filter(function (a) { return a.email !== qui; }), qui + ' n’est plus administrateur.');
    }
  });

  /* L'ouverture comptée (débrief 18), avec ses durées : une seconde et
     demie après que la synthèse est à l'écran, et jamais avant la fin. */
  function planifierConsultation() {
    if (!API || !API.noterConsultation) return;
    var depuis = CHRONOS.synthese !== undefined ? CHRONO() - CHRONOS.synthese : 0;
    setTimeout(function () {
      var m = mesuresOuverture();
      montrerMesuresOuverture();
      if (GUETTEUR_TACHES) { try { GUETTEUR_TACHES.disconnect(); } catch (e) { /* déjà arrêté */ } }
      API.noterConsultation(m);
      lireDroits();
    }, Math.max(0, 1500 - depuis));
  }

  /* ============================================================
     LIVRAISON ET PANNE
     Quatre fichiers collés à la main dans Apps Script : il suffit d'en
     laisser un à la livraison d'avant pour que la page reste blanche, sans
     un mot (débrief 17 : un Index d'avant, le Javascript du jour). Chaque
     fichier porte donc sa livraison, la page les compare et nomme celui qui
     diffère ; et une erreur au démarrage s'affiche en tête de page, avec le
     geste, au lieu d'un squelette vide.
     ============================================================ */
  function ecartsDeLivraison(paquet) {
    if (EDITION === 'source') return [];
    var lues = { 'Javascript': EDITION };
    lues['Index'] = typeof window.SUIVI_FWD_LIVRAISON_INDEX === 'string' ? window.SUIVI_FWD_LIVRAISON_INDEX : '';
    try {
      lues['Styles'] = getComputedStyle(document.documentElement)
        .getPropertyValue('--suivi-fwd-edition').replace(/["'\s]/g, '');
    } catch (e) { lues['Styles'] = ''; }
    /* Sans paquet, les données n'ont pas été posées : rien à dire de Code. */
    if (paquet && typeof paquet === 'object') lues['Code'] = paquet.edition ? String(paquet.edition) : '';
    /* La livraison de la majorité fait foi ; à égalité, celle de ce fichier. */
    var n = {}, reference = EDITION;
    Object.keys(lues).forEach(function (f) { if (lues[f]) n[lues[f]] = (n[lues[f]] || 0) + 1; });
    Object.keys(n).forEach(function (ed) { if (n[ed] > n[reference]) reference = ed; });
    return Object.keys(lues).filter(function (f) { return lues[f] !== reference; });
  }
  function nommerFichiers(liste) {
    var noms = liste.map(function (f) { return '\x3Cb>' + f + '\x3C/b>'; });
    return noms.length > 1 ? noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1] : noms[0];
  }
  function gesteExec() {
    return 'Par un lien \x3Cb>…/exec\x3C/b> : ensuite, Déployer → Gérer les déploiements → ✏️ → ' +
      'Version : Nouvelle version → Déployer.';
  }
  function phraseEcarts(ecarts) {
    var un = ecarts.length === 1;
    return nommerFichiers(ecarts) + (un ? ' ne vient' : ' ne viennent') + ' pas de la même livraison que ' +
      (un ? 'les autres fichiers' : 'le reste') + ' : ' + (un ? 'le recoller' : 'les recoller') +
      ' depuis la dernière livraison (tout effacer, coller le .txt, Ctrl+S). ' + gesteExec();
  }
  /* Le cadre, en tête de page, en styles posés sur lui : il doit se lire
     même quand c'est Styles qui manque. */
  function cadreEnTete(html, grave) {
    var cadre = document.getElementById('suivi-fwd-panne');
    if (!cadre) {
      cadre = document.createElement('div');
      cadre.id = 'suivi-fwd-panne';
      cadre.setAttribute('role', 'alert');
      document.body.insertBefore(cadre, document.body.firstChild);
    }
    cadre.style.cssText = 'margin:16px auto;max-width:1100px;padding:14px 18px;color:#191915;' +
      'font:14px/1.55 system-ui,sans-serif;background:' + (grave ? '#fff4e5' : '#fffaf0') + ';' +
      'border-left:4px solid ' + (grave ? '#b54708' : '#bf7f14') + ';';
    cadre.innerHTML = html;
    /* Plus de « Chargement… » sous un cadre qui dit que rien ne viendra. */
    var phrase = document.getElementById('phrase');
    if (grave && phrase && /^Chargement/.test(phrase.textContent)) phrase.textContent = '\u2014';
  }
  function signalerLivraison(ecarts) {
    if (!ecarts.length) return;
    cadreEnTete('\x3Cp style="margin:0">\x3Cb>Les fichiers du tableau de bord ne concordent pas.\x3C/b> ' + phraseEcarts(ecarts) +
      ' D\u2019ici là, la page peut être incomplète ou fausse.\x3C/p>', false);
  }
  /* L'erreur elle-même, pour moi : son nom, son message sans les valeurs
     citées (une cellule n'a rien à faire à l'écran), et où elle est née. */
  function detailDePanne(e) {
    var texte = String((e && e.name) || 'Erreur') + ' : ' + String((e && e.message) || e).replace(/"[^"]*"/g, '"…"');
    var pile = String((e && e.stack) || '').split('\n').slice(1, 4).map(function (l) {
      var m = /at (?:new )?([\w$.]+) \(/.exec(l); return m ? m[1] : '';
    }).filter(Boolean);
    return texte.slice(0, 200) + (pile.length ? ' — dans ' + pile.join(' ← ') : '');
  }
  function montrerDoublon() {
    cadreEnTete('\x3Cp style="margin:0">\x3Cb>Le fichier Javascript contient deux copies\x3C/b> — collé sans tout effacer ? ' +
      'Les chiffres peuvent venir de l\u2019ancienne. Dans Apps Script : \x3Cb>Javascript\x3C/b>, Ctrl+A, Suppr, coller ' +
      '\x3Cb>Javascript.html.txt\x3C/b> en entier, Ctrl+S. ' + gesteExec() + '\x3C/p>', true);
  }
  function montrerPanne(e, ecarts) {
    poserEtatOuverture('panne');       // l'ouverture s'arrête là : qui l'attend le sait
    /* Et elle s'arrête vraiment : plus rien n'est retenu en attendant la
       synthèse — un autre contrat, la vue d'ensemble répondent, comme
       avant (débrief 23, revue : une erreur dans la synthèse de HDK figeait
       toute la page). La page reprend aussi sa hauteur. */
    OUVERTURE = null;
    rendreHauteur();
    var html = '\x3Cp style="margin:0 0 6px">\x3Cb>La page n\u2019a pas pu s\u2019afficher.\x3C/b> ' +
      (ecarts.length ? 'Cause la plus probable : ' + phraseEcarts(ecarts)
                     : 'Une erreur l\u2019a arrêtée — rien n\u2019est touché dans le classeur. Une capture de ce cadre ' +
                       'suffit pour en trouver la cause ; le menu Suivi FWD → Diagnostic dit ce que le script voit.') + '\x3C/p>' +
      '\x3Cp style="margin:0;color:#57564e;font-size:12px">Détail : ' + ech(detailDePanne(e)) + '\x3C/p>';
    cadreEnTete(html, true);
  }

  /* Le démarrage. Une erreur ici remonte au filet posé en tête du fichier,
     qui l'affiche avec la cause la plus probable. L'état de l'ouverture se
     pose d'abord : il change le style de la page, qu'on lit juste après. */
  poserEtatOuverture('chargement');
  /* Le squelette dit qu'il lit les chiffres. Le filet d'Index regarde, à la
     fin de la lecture du document, si un Javascript a démarré : « Chargement… »
     encore là, c'est qu'aucun n'a tourné. Les chiffres arrivent désormais un
     instant après (l'ouverture en deux temps) : la phrase change tout de
     suite, pour qu'il voie que celui-ci a démarré. */
  if ($('phrase') && $('phrase').textContent === 'Chargement\u2026') $('phrase').textContent = 'Chargement des chiffres\u2026';
  signalerLivraison(ecartsDeLivraison(window.SUIVI_FWD_DONNEES));
  if ($('livraison') && EDITION !== 'source') {
    $('livraison').textContent = 'Livraison ' + EDITION;
    $('livraison').hidden = false;
  }
  if ($('mention-consultations') && API && API.noterConsultation) $('mention-consultations').hidden = false;
  /* Les données (décodées s'il le faut), la synthèse, puis le reste — et
     l'ouverture comptée, sans nom ni adresse (débrief 18), une fois la page
     affichée, pour ne rien retarder. Voir « L'OUVERTURE EN DEUX TEMPS ». */
  demarrer();
})();
window.SUIVI_FWD_FIN = '0e5f128';
</script>
