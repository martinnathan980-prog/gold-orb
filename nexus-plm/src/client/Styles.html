<style>
/* ============================================================
   NEXUS — design system.

   Parti pris : fond blanc, filets fins, beaucoup d'air. Une seule teinte de
   marque, un bleu marine profond, réservée aux actions principales et aux
   états actifs — jamais en aplat de fond. La couleur ne sert que lorsqu'elle
   porte une information : trois teintes de type (structure / harnais /
   plaquette), trois teintes de statut, trois niveaux d'équivalence.

   Typographie : Archivo très tracké pour le titre, à la manière d'une plaque
   d'aéronef ; IBM Plex Mono pour les PN, qui sont de la donnée et s'alignent
   en colonne ; Instrument Sans pour le reste.
   ============================================================ */

:root {
  color-scheme: light;

  /* Le sol est blanc : c'est ce qui donne l'impression de propreté. La
     couleur est portée par les OBJETS posés dessus — les cartes, la barre
     d'action — et non par le fond. */
  --sol: #ffffff;
  --sol-2: #f5f8fc;
  --surface: #edf3fb;        /* les cartes, teintées */
  --surface-2: #ffffff;      /* ce qui se saisit reste blanc */
  --surface-3: #dde6f3;
  --encre: #0f1929;
  --encre-2: #465268;
  --encre-3: #78859b;
  --trait: #d2dcec;
  --trait-fort: #b3c2d9;

  /* La barre d'action, au milieu de la page : la seule zone franchement
     teintée, elle sépare l'en-tête du catalogue et porte les deux entrées. */
  --bande: #d2e0f2;
  --bande-2: #c6d7ed;

  /* La marque : un marine, pour les actions principales seulement. */
  --marque: #00205b;
  --marque-2: #0b2f7a;
  --marque-voile: #dbe6f7;
  --sur-marque: #ffffff;

  /* Types de sous-ensembles — sémantiques */
  --t-structure: #3f5a86; --t-structure-voile: #edf1f8; --t-structure-trait: #c5d1e4;
  --t-harnais:   #9a5a1e; --t-harnais-voile:   #f8f0e6; --t-harnais-trait:   #e3ceb3;
  --t-plaquette: #146b64; --t-plaquette-voile: #e6f2f0; --t-plaquette-trait: #b7d9d4;
  --t-autre:     #6b6b6b; --t-autre-voile:     #f1f1f1; --t-autre-trait:     #d6d6d6;

  /* Statuts — sémantiques */
  --vert: #2f6b43;  --vert-voile: #e9f2ec;  --vert-trait: #bcd8c5;
  --ambre: #90620b; --ambre-voile: #f8f1e0; --ambre-trait: #e6d3a8;
  --rouge: #a32020; --rouge-voile: #f8eaea; --rouge-trait: #e6bdbd;

  --r-s: 6px; --r-m: 10px; --r-l: 16px;
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 24px; --e-6: 36px; --e-7: 56px;
  --large: 1340px;

  --ombre-1: 0 1px 2px rgba(16,26,46,.05), 0 1px 3px rgba(16,26,46,.04);
  --ombre-2: 0 2px 6px rgba(16,26,46,.06), 0 10px 26px rgba(16,26,46,.08);
  --ombre-3: 0 24px 60px rgba(16,26,46,.22);

  --police: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --police-titre: "Archivo", "Instrument Sans", -apple-system, sans-serif;
  --police-data: "IBM Plex Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sol: #0e131b; --sol-2: #121924;
    --surface: #18202c; --surface-2: #202937; --surface-3: #26303f;
    --encre: #e8ebf1; --encre-2: #aeb8c8; --encre-3: #7f8b9d;
    --trait: #29333f; --trait-fort: #394656;
    --bande: #16202f; --bande-2: #1a2637;
    --marque: #8fb0f0; --marque-2: #a8c2f5; --marque-voile: #1b2740; --sur-marque: #0f1522;

    --t-structure: #8fabd6; --t-structure-voile: #1b2436; --t-structure-trait: #35476b;
    --t-harnais:   #d9a06a; --t-harnais-voile:   #2c2118; --t-harnais-trait:   #5d4327;
    --t-plaquette: #59c2b6; --t-plaquette-voile: #122b29; --t-plaquette-trait: #24544e;
    --t-autre:     #a6a6a6; --t-autre-voile:     #24262a; --t-autre-trait:     #43464c;

    --vert: #6ec78d;  --vert-voile: #162c1f;  --vert-trait: #2b5639;
    --ambre: #dfae5d; --ambre-voile: #2e2413; --ambre-trait: #60471d;
    --rouge: #ee8484; --rouge-voile: #331a1a; --rouge-trait: #65302f;

    --ombre-1: 0 1px 2px rgba(0,0,0,.45);
    --ombre-2: 0 2px 8px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.38);
    --ombre-3: 0 24px 60px rgba(0,0,0,.65);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --sol: #0e131b; --sol-2: #121924;
  --surface: #18202c; --surface-2: #202937; --surface-3: #26303f;
  --encre: #e8ebf1; --encre-2: #aeb8c8; --encre-3: #7f8b9d;
  --trait: #29333f; --trait-fort: #394656;
  --bande: #16202f; --bande-2: #1a2637;
  --marque: #8fb0f0; --marque-2: #a8c2f5; --marque-voile: #1b2740; --sur-marque: #0f1522;

  --t-structure: #8fabd6; --t-structure-voile: #1b2436; --t-structure-trait: #35476b;
  --t-harnais:   #d9a06a; --t-harnais-voile:   #2c2118; --t-harnais-trait:   #5d4327;
  --t-plaquette: #59c2b6; --t-plaquette-voile: #122b29; --t-plaquette-trait: #24544e;
  --t-autre:     #a6a6a6; --t-autre-voile:     #24262a; --t-autre-trait:     #43464c;

  --vert: #6ec78d;  --vert-voile: #162c1f;  --vert-trait: #2b5639;
  --ambre: #dfae5d; --ambre-voile: #2e2413; --ambre-trait: #60471d;
  --rouge: #ee8484; --rouge-voile: #331a1a; --rouge-trait: #65302f;

  --ombre-1: 0 1px 2px rgba(0,0,0,.45);
  --ombre-2: 0 2px 8px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.38);
  --ombre-3: 0 24px 60px rgba(0,0,0,.65);
}

/* ---------------- socle ---------------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--sol); color: var(--encre);
  font-family: var(--police); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--police-titre); margin: 0; text-wrap: balance; letter-spacing: -.012em; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--marque); outline-offset: 2px; border-radius: 3px; }
.enveloppe { max-width: var(--large); margin-inline: auto; padding-inline: var(--e-4); }
.vide { color: var(--encre-3); font-size: 13px; }

/* ---------------- bandeau de titre ---------------- */
.entete { background: var(--sol); border-bottom: 1px solid var(--trait); padding-block: var(--e-6) var(--e-5); }
.entete-corps { text-align: center; }
.marque { display: flex; flex-direction: column; align-items: center; gap: var(--e-2); }
.marque h1 {
  font-family: var(--police-titre); font-weight: 800;
  font-size: clamp(38px, 8vw, 72px); line-height: .95;
  letter-spacing: .24em; text-indent: .24em;   /* le tracking décale, on recentre */
  color: var(--marque);
}
/* Un filet marine sous le titre : une plaque, pas un logo. */
.marque::after { content: ""; width: 56px; height: 3px; background: var(--marque); border-radius: 2px; margin-top: var(--e-2); }

/* ---------------- indicateurs ---------------- */
/* Une ligne continue, cadrée par deux filets, chaque mesure séparée de la
   suivante par un trait fin. Pas de cartes : les chiffres se lisent d'une
   traite, comme une plaque de relevés. Chacun reste un filtre. */
.indicateurs {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0;
  margin-top: var(--e-6);
  border-top: 1px solid var(--trait); border-bottom: 1px solid var(--trait);
}
.indicateur {
  flex: 1 1 150px; min-width: 130px; padding: var(--e-3) var(--e-4);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: 0; color: var(--encre); position: relative;
  transition: background .15s;
}
.indicateur + .indicateur::before {
  content: ""; position: absolute; left: 0; top: 22%; bottom: 22%;
  width: 1px; background: var(--trait);
}
button.indicateur:hover { background: var(--sol-2); }
button.indicateur:hover .indicateur-valeur { text-decoration: underline; text-underline-offset: 4px; }
.indicateur.actif { background: var(--marque-voile); }
.indicateur.actif .indicateur-libelle { color: var(--marque); }
.indicateur-libelle {
  font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--encre-3); font-weight: 600; text-align: center;
}
.indicateur-valeur {
  font-family: var(--police-titre); font-size: 28px; font-weight: 700;
  line-height: 1.05; font-variant-numeric: tabular-nums;
}
.indicateur-detail { font-size: 11.5px; color: var(--encre-3); text-align: center; }
.indicateur-valide .indicateur-valeur { color: var(--vert); }
.indicateur-alerte .indicateur-valeur { color: var(--ambre); }
.indicateur-standard .indicateur-valeur { color: var(--marque); }
.indicateur[aria-pressed="true"] { background: var(--marque-voile); }
.indicateur[aria-pressed="true"] .indicateur-libelle { color: var(--marque); }

/* ---------------- barre d'action ---------------- */
/* Pleine largeur, teintée, filet marine au-dessus : elle coupe la page en
   deux et réunit les deux façons d'entrer dans les données, chercher ou
   créer. Le bouton de création n'a rien à faire à côté du titre. */
.bande-action {
  background: linear-gradient(180deg, var(--bande), var(--bande-2));
  border-top: 3px solid var(--marque);
  border-bottom: 1px solid var(--trait-fort);
}
.bande-corps {
  display: flex; align-items: center; gap: var(--e-3);
  padding-block: var(--e-4);
}
/* Arrondi, comme il l'était : c'est une invitation, pas un bouton de
   formulaire. Seule sa place a changé.
   Qualifié par .bande-corps : à spécificité égale, .btn-principal, déclarée
   plus bas, l'emportait et rendait le bouton carré. */
.bande-corps .btn-creer {
  flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
  background: var(--marque); color: var(--sur-marque); border: 1px solid var(--marque);
  border-radius: 999px; padding: 11px 22px; font-size: 13px; font-weight: 600;
  box-shadow: var(--ombre-1); transition: background .15s;
}
.bande-corps .btn-creer:hover { background: var(--marque-2); }

.contenu { padding-block: var(--e-5) var(--e-7); }
.champ-recherche {
  display: flex; align-items: center; gap: var(--e-2);
  flex: 1; min-width: 0; background: var(--surface-2);
  border: 1px solid var(--trait-fort); border-radius: 999px;
  padding: 2px 6px 2px var(--e-4); box-shadow: var(--ombre-1); transition: box-shadow .15s, border-color .15s;
}
.champ-recherche:focus-within { border-color: var(--marque); box-shadow: var(--ombre-2); }
.champ-recherche-icone { color: var(--encre-3); font-size: 17px; }
.champ-recherche input {
  flex: 1; border: 0; background: transparent; color: var(--encre);
  padding: 13px 0; font-size: 15px; outline: none; min-width: 0;
}
.champ-recherche input::placeholder { color: var(--encre-3); }
/* La recherche par composant vit DANS le champ : c'est une autre façon de
   chercher, pas une fonction annexe posée à côté. */
.btn-dans-champ {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--sol); color: var(--encre-2); border: 1px solid var(--trait);
  border-radius: 999px; padding: 8px 15px; font-size: 12.5px; font-weight: 600;
}
.btn-dans-champ:hover, .btn-dans-champ.actif { background: var(--marque); color: var(--sur-marque); border-color: var(--marque); }

/* ---------------- barre d'outils ---------------- */
/* Dans l'espace composants, la bande de tete dit tout ce que cette barre
   disait : on ne repete pas le meme compte a deux endroits. */
body.espace-composants .outils { display: none; }
.outils {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--e-3); flex-wrap: wrap; margin-bottom: var(--e-3);
  padding-bottom: var(--e-3); border-bottom: 1px solid var(--trait);
}
.outils-gauche, .outils-droite { display: flex; align-items: center; gap: var(--e-2); flex-wrap: wrap; }
/* Le sélecteur de vue n'est pas un filtre : on l'en sépare à l'oeil. */
.outils-gauche > #zoneVue { margin-right: var(--e-3); padding-right: var(--e-3); border-right: 1px solid var(--trait); }
@media (max-width: 620px) { .outils-gauche > #zoneVue { border-right: 0; margin-right: 0; padding-right: 0; } }
.outils-bilan { font-size: 12.5px; color: var(--encre-3); font-variant-numeric: tabular-nums; }

.filtres-type { display: flex; flex-wrap: wrap; gap: 6px; }
.jeton {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--trait-fort);
  border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 500;
  color: var(--encre-2); transition: .14s;
}
.jeton::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
.jeton.type-structure { color: var(--t-structure); border-color: var(--t-structure-trait); }
.jeton.type-harnais   { color: var(--t-harnais);   border-color: var(--t-harnais-trait); }
.jeton.type-plaquette { color: var(--t-plaquette); border-color: var(--t-plaquette-trait); }
.jeton.type-autre     { color: var(--t-autre);     border-color: var(--t-autre-trait); }
.jeton:hover { background: var(--surface-2); }
.jeton-compte { font-variant-numeric: tabular-nums; opacity: .65; font-size: 11.5px; }
.jeton.actif { color: #fff; }
.jeton.type-structure.actif { background: var(--t-structure); border-color: var(--t-structure); }
.jeton.type-harnais.actif   { background: var(--t-harnais);   border-color: var(--t-harnais); }
.jeton.type-plaquette.actif { background: var(--t-plaquette); border-color: var(--t-plaquette); }
.jeton.type-autre.actif     { background: var(--t-autre);     border-color: var(--t-autre); }

/* Le tri : un menu discret, pas un <select> planté dans la page. */
.tri { position: relative; }
.tri-bouton {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; color: var(--encre-2);
  font-size: 12.5px; font-weight: 600; padding: 4px 2px;
  border-bottom: 1px solid var(--trait-fort);
}
.tri-bouton:hover { color: var(--marque); border-color: var(--marque); }
.tri-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: var(--r-m); box-shadow: var(--ombre-2); padding: 4px; min-width: 210px;
}
.tri-menu[hidden] { display: none; }
.tri-option {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px 12px; border-radius: var(--r-s); font-size: 13px; color: var(--encre-2);
}
.tri-option:hover { background: var(--surface-3); color: var(--encre); }
.tri-option.actif { background: var(--marque); color: var(--sur-marque); font-weight: 600; }

.filtres-actifs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filtres-actifs:not(:empty) { margin-bottom: var(--e-3); }
.filtre-jeton {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--marque); color: var(--sur-marque); border-radius: 999px;
  padding: 3px 5px 3px 12px; font-size: 12px; font-weight: 500;
}
.filtre-jeton button {
  border: 0; background: rgba(255,255,255,.18); color: inherit; border-radius: 50%;
  width: 18px; height: 18px; font-size: 13px; line-height: 1; padding: 0;
}
.filtre-jeton button:hover { background: rgba(255,255,255,.34); }

/* Onglets de fonction : soulignés, pas des pastilles pleines. */
.onglets { display: flex; gap: var(--e-4); overflow-x: auto; padding-bottom: 2px; margin-bottom: var(--e-5); }
.onglets::-webkit-scrollbar { height: 2px; }
.onglets::-webkit-scrollbar-thumb { background: var(--trait-fort); }
.onglet {
  display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 6px 0; font-size: 13px; font-weight: 600; color: var(--encre-3);
  letter-spacing: .02em;
}
.onglet:hover { color: var(--encre); }
.onglet-compte { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .7; font-weight: 500; }
.onglet.actif { color: var(--marque); border-bottom-color: var(--marque); }

.chargement {
  display: flex; align-items: center; justify-content: center; gap: var(--e-3);
  padding: var(--e-7) 0; color: var(--encre-3);
}

/* ---------------- choix de la vue ---------------- */
/* Un segmenté court : deux lectures de la même base, pas un menu. */
.choix-vue {
  display: inline-flex; flex-wrap: wrap; max-width: 100%;
  background: var(--surface-3); border: 1px solid var(--trait);
  border-radius: 999px; padding: 2px;
}
.onglet-vue {
  background: none; border: 0; border-radius: 999px; padding: 5px 14px;
  font-size: 12.5px; font-weight: 600; color: var(--encre-3); transition: .14s;
  white-space: nowrap;
}
/* À quatre lectures, la pilule ne tient plus sur une ligne de téléphone :
   on resserre plutôt que de laisser la page déborder sur le côté. */
@media (max-width: 520px) {
  .choix-vue { border-radius: var(--r-m); }
  .onglet-vue { padding: 5px 9px; font-size: 11.5px; border-radius: var(--r-s); }
}
.onglet-vue:hover { color: var(--encre); }
.onglet-vue.actif { background: var(--marque); color: var(--sur-marque); box-shadow: var(--ombre-1); }

/* ---------------- inventaire des pièces ---------------- */
/* Une nomenclature lue par l'autre bout : la pièce d'abord, les boîtes après.
   Les pièces partagées portent un filet marine : c'est ce qu'on cherche. */
.inventaire { display: flex; flex-direction: column; border: 1px solid var(--trait); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.inventaire-entete, .piece {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr) 108px minmax(0, 1.6fr);
  gap: var(--e-3); align-items: center; padding: 10px var(--e-4);
}
.inventaire-entete {
  background: var(--surface-3); border-bottom: 1px solid var(--trait);
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--encre-3); font-weight: 700;
}
.piece { border-bottom: 1px solid var(--surface-3); border-left: 3px solid transparent; }
.piece:last-child { border-bottom: 0; }
.piece:hover { background: var(--sol-2); }
.piece-partagee { border-left-color: var(--marque); }
.piece-pn { font-family: var(--police-data); font-size: 13px; font-weight: 600; color: var(--encre); overflow-wrap: anywhere; }
.piece-type { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
.piece-type.type-structure { color: var(--t-structure); }
.piece-type.type-harnais   { color: var(--t-harnais); }
.piece-type.type-plaquette { color: var(--t-plaquette); }
.piece-type.type-autre     { color: var(--t-autre); }
.piece-compte {
  font-size: 12px; font-weight: 600; color: var(--encre-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  background: var(--surface-3); border-radius: 999px; padding: 3px 10px; text-align: center;
}
.piece-compte-fort { background: var(--marque-voile); color: var(--marque); }
.piece-boites { display: flex; flex-wrap: wrap; gap: 5px; }

@media (max-width: 860px) {
  .inventaire-entete { display: none; }
  .piece { grid-template-columns: 1fr; gap: 6px; padding: var(--e-3) var(--e-4); }
  .piece-compte { justify-self: start; }
}

/* ---------------- standardisation ---------------- */
/* Une famille par bloc : la fonction, puis ses normes, puis les références
   sous chacune. Ce qui se disperse est chiffré en tête. */
.standard-intro { font-size: 13px; color: var(--encre-2); margin-bottom: var(--e-3); max-width: 70ch; }
.familles { display: flex; flex-direction: column; gap: var(--e-2); }
.famille { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); overflow: hidden; }
.famille-tete {
  display: flex; align-items: center; justify-content: space-between; gap: var(--e-3);
  flex-wrap: wrap; padding: 10px var(--e-4);
  background: var(--surface-3); border-bottom: 1px solid var(--trait);
}
.famille-identite { display: flex; align-items: baseline; gap: var(--e-2); flex-wrap: wrap; min-width: 0; }
.famille-nom { font-size: 14px; font-weight: 700; }
.famille-cat { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-3); font-weight: 600; }
.famille-compte { display: flex; gap: 6px; flex-shrink: 0; }
.famille-chiffre {
  font-size: 11.5px; color: var(--encre-2); background: var(--surface-2);
  border: 1px solid var(--trait); border-radius: 999px; padding: 2px 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.famille-chiffre b { font-weight: 700; }
.famille-disperse { background: var(--ambre-voile); border-color: var(--ambre-trait); color: var(--ambre); }
.famille-normes { list-style: none; margin: 0; padding: 0; }
.famille-norme {
  display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--e-3);
  align-items: baseline; padding: 8px var(--e-4); border-bottom: 1px solid var(--surface-3);
}
.famille-norme:last-child { border-bottom: 0; }
.norme-nom { font-size: 12.5px; font-weight: 600; color: var(--encre-2); overflow-wrap: anywhere; }
.norme-refs { display: flex; flex-wrap: wrap; gap: 6px; }
.ref-bloc { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ref {
  display: inline-flex; align-items: baseline; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--trait);
  border-radius: var(--r-s); padding: 3px 9px; transition: .14s;
}
.ref:hover { border-color: var(--marque); }
.ref.actif { background: var(--marque-voile); border-color: var(--marque); }
/* La plus répandue : le candidat naturel si l'on doit n'en garder qu'une. */
.ref-majoritaire { border-color: var(--vert-trait); background: var(--vert-voile); }
.ref-majoritaire .ref-pn { color: var(--vert); }
.ref-pn { font-family: var(--police-data); font-size: 11.5px; color: var(--encre); }
.ref-usage { font-size: 10.5px; color: var(--encre-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ref-boites { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 2px; }
.ref-boites[hidden] { display: none; }

@media (max-width: 620px) {
  .famille-norme { grid-template-columns: 1fr; gap: 4px; }
}

/* ================= ESPACE COMPOSANTS =================
   Une base a part, pas une lecture de plus : elle a son propre selecteur,
   sa propre bande de tete, son rail de familles et son arbre. */

/* Le selecteur d'espace : meme pilule que les lectures, deux segments de
   meme taille, pose plus haut. Pas un aplat bleu de plus. */
.choix-espace {
  display: inline-flex; background: var(--surface-3); border: 1px solid var(--trait);
  border-radius: 999px; padding: 3px; margin-bottom: var(--e-4);
}
.onglet-espace {
  background: none; border: 0; border-radius: 999px; padding: 7px 26px;
  font-size: 13px; font-weight: 700; letter-spacing: .01em;
  color: var(--encre-3); transition: background .14s, color .14s;
  min-width: 140px;
}
.onglet-espace:hover { color: var(--encre); }
.onglet-espace.actif { background: var(--marque); color: var(--sur-marque); box-shadow: var(--ombre-1); }
@media (max-width: 520px) {
  .choix-espace { display: flex; width: 100%; }
  .onglet-espace { flex: 1; min-width: 0; padding: 7px 10px; }
}

.indicateur-isole .indicateur-valeur { color: var(--ambre); }

/* Le corps : rail des familles a gauche, arbre a droite. */
.compo-corps { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: var(--e-4); align-items: start; }
@media (max-width: 860px) { .compo-corps { grid-template-columns: 1fr; } }

.compo-rail {
  position: sticky; top: var(--e-3);
  border: 1px solid var(--trait); border-radius: var(--r-m);
  background: var(--surface); padding: var(--e-3);
}
@media (max-width: 860px) { .compo-rail { position: static; } }
.compo-rail-titre {
  margin: 0 0 var(--e-2); font-size: 10.5px; letter-spacing: .13em;
  text-transform: uppercase; color: var(--encre-3); font-weight: 700;
}
.cf-liste { display: flex; flex-direction: column; gap: 3px; }
.cf-famille {
  display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
  padding: 7px 9px; border: 1px solid transparent; border-radius: var(--r-s);
  background: none; color: var(--encre); transition: background .13s, border-color .13s;
}
.cf-famille:hover { background: var(--surface-3); }
.cf-famille.actif { background: var(--marque-voile); border-color: var(--marque); }
.cf-pastille { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--trait-fort); }
.cf-composant  { background: var(--t-plaquette); }
.cf-mecanique  { background: var(--t-structure); }
.cf-electrique { background: var(--t-harnais); }
.cf-texte { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.cf-nom { font-size: 12.5px; font-weight: 600; }
.cf-aide { font-size: 10.5px; color: var(--encre-3); line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; }
.cf-n { font-family: var(--police-data); font-size: 11.5px; color: var(--encre-3);
  font-variant-numeric: tabular-nums; flex: none; }
.cf-famille.actif .cf-n { color: var(--marque); font-weight: 600; }
.compo-rail-titre-2 { margin-top: var(--e-4); }
.cf-etat {
  display: flex; align-items: center; gap: 8px; text-align: left; width: 100%;
  padding: 5px 9px; border: 1px solid transparent; border-radius: var(--r-s);
  background: none; color: var(--encre-2); font-size: 12px;
  transition: background .13s, border-color .13s, color .13s;
}
.cf-etat:hover { background: var(--surface-3); color: var(--encre); }
.cf-etat.actif { background: var(--marque-voile); border-color: var(--marque); color: var(--marque); }
.cf-etat-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-etat.actif .cf-n { color: var(--marque); font-weight: 600; }

.cf-effacer {
  margin-top: var(--e-3); width: 100%; padding: 6px; font-size: 12px;
  border: 1px dashed var(--trait-fort); border-radius: var(--r-s);
  background: none; color: var(--encre-2);
}
.cf-effacer:hover { background: var(--surface-3); color: var(--encre); }

/* L'arbre : famille, fonction, norme, reference. */
.compo-arbre { display: flex; flex-direction: column; gap: var(--e-4); min-width: 0; }
.arbre-barre {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--e-3); flex-wrap: wrap;
  padding-bottom: var(--e-2); border-bottom: 1px solid var(--trait);
}
.arbre-barre-compte { font-size: 12px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.arbre-barre-btn {
  font-size: 12px; padding: 5px 12px; border: 1px solid var(--trait-fort);
  border-radius: 999px; background: var(--surface); color: var(--encre-2);
}
.arbre-barre-btn:hover { background: var(--surface-3); color: var(--encre); }
.cfa-bloc { display: flex; flex-direction: column; gap: var(--e-2); min-width: 0; }
.cfa-tete { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  padding-bottom: 6px; border-bottom: 2px solid var(--encre); }
.cfa-tete .cf-pastille { align-self: center; }
.cfa-nom { margin: 0; font-family: var(--police-titre); font-size: 17px; font-weight: 700; }
.cfa-chiffres { font-size: 11.5px; color: var(--encre-3); font-variant-numeric: tabular-nums;
  margin-left: auto; }

.cfo-bloc { border: 1px solid var(--trait); border-radius: var(--r-m);
  background: var(--surface); overflow: hidden; }
.cfo-tete {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 10px 13px; border: 0; background: none; color: var(--encre);
  border-bottom: 1px solid var(--trait);
}
.cfo-bloc.replie .cfo-tete { border-bottom: 0; }
.cfo-tete:hover { background: var(--surface-3); }
.cfo-chevron { color: var(--encre-3); font-size: 11px; flex: none; width: 10px; }
.cfo-nom { font-size: 14px; font-weight: 700; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfo-chiffres { font-size: 11.5px; color: var(--encre-3); margin-left: auto;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.cfo-chiffres b { font-family: var(--police-data); color: var(--encre-2); font-weight: 600; }
.cfo-alerte, .cn-alerte {
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none;
  background: var(--ambre-voile); color: var(--ambre); border: 1px solid var(--ambre-trait);
}
.cfo-corps { display: flex; flex-direction: column; }

/* La norme est un bandeau ; ses references vivent en retrait, sous un filet
   vertical qui rend la hierarchie lisible meme a vingt normes d'affilee. */
.cn-bloc { margin-top: 2px; }
.cn-tete {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 13px 6px 26px; background: var(--sol-2);
  border-top: 1px solid var(--trait); border-bottom: 1px solid var(--surface-3);
  position: relative;
}
.cn-puce {
  position: absolute; left: 14px; top: 50%; width: 6px; height: 6px;
  margin-top: -3px; border-radius: 1px; background: var(--trait-fort);
}
.cn-nom { font-family: var(--police-data); font-size: 12px; font-weight: 700; color: var(--marque); }
.cn-compte { font-size: 11px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.cn-dispersee .cn-tete { background: var(--ambre-voile); }
.cn-dispersee .cn-puce { background: var(--ambre); }
.cn-dispersee .cn-nom { color: var(--ambre); }
.cn-references {
  padding: 2px 13px 6px 26px; position: relative;
}
/* Le filet qui relie les references a leur norme. */
.cn-references::before {
  content: ""; position: absolute; left: 16px; top: 0; bottom: 8px;
  width: 1px; background: var(--trait);
}
.cn-dispersee .cn-references::before { background: var(--ambre-trait); }

.cr-entete, .cr-ligne {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.25fr) 172px minmax(0, .85fr);
  gap: var(--e-3); align-items: center;
}
.cr-entete {
  font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-3);
  font-weight: 600; padding: 7px 13px 5px 26px; border-bottom: 1px solid var(--trait);
  background: var(--surface);
}
.cr-ligne { padding: 6px 0; border-bottom: 1px solid var(--surface-3); }
.cr-ligne:last-child { border-bottom: 0; }
.cr-isole .cr-ref::before {
  content: ""; display: inline-block; width: 3px; height: 11px; margin-right: 6px;
  background: var(--ambre); vertical-align: -1px; border-radius: 1px;
}
.cr-ref { font-family: var(--police-data); font-size: 12px; font-weight: 600;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cr-designation { font-size: 12px; color: var(--encre-2); min-width: 0;
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.cr-etat {
  font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.cr-hors { background: var(--rouge-voile); color: var(--rouge); border: 1px solid var(--rouge-trait); }
.cr-dormant { background: var(--surface-3); color: var(--encre-3); border: 1px solid var(--trait); }
.cr-emploi { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cr-jauge { display: block; height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.cr-jauge span { display: block; height: 100%; background: var(--marque); border-radius: 2px; }
.cr-isole .cr-jauge span { background: var(--ambre); }
.cr-compte {
  border: 0; background: none; padding: 0; text-align: left;
  font-family: var(--police-data); font-size: 11px; color: var(--encre-2);
  font-variant-numeric: tabular-nums; text-decoration: underline;
  text-decoration-style: dotted; text-underline-offset: 3px;
}
.cr-compte:hover, .cr-compte.actif { color: var(--marque); }
.cr-jamais { font-size: 11px; color: var(--encre-3); font-style: italic; }
.cr-boites { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 2px; }
.cr-boites[hidden] { display: none; }
.cr-porteurs { display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
.puce-porteur-mini { font-size: 10px; padding: 1px 6px; }

@media (max-width: 760px) {
  .cr-entete { display: none; }
  .cr-ligne { grid-template-columns: 1fr; gap: 4px; padding: 10px 0; }
  .cfo-chiffres { margin-left: 0; width: 100%; }
}

/* ---------------- cartes ---------------- */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); gap: var(--e-4); }
.carte {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--trait);
  border-radius: var(--r-l); box-shadow: var(--ombre-1);
  transition: box-shadow .22s cubic-bezier(.2,.7,.3,1), transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s;
}
.carte:hover { box-shadow: var(--ombre-2); border-color: var(--trait-fort); transform: translateY(-3px); }
.carte-media { position: relative; overflow: hidden; background: var(--surface-3); }
.carte-visuel { display: block; border: 0; padding: 0; background: none; width: 100%; }
.carte-image {
  display: block; width: 100%; aspect-ratio: 4 / 3; max-width: 100%;
  object-fit: cover; transition: transform .45s cubic-bezier(.2,.7,.3,1);
}
.carte:hover .carte-image { transform: scale(1.045); }
.carte-image-absente {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  color: var(--encre-3); background: repeating-linear-gradient(45deg, var(--surface-3) 0 10px, var(--surface-2) 10px 20px);
}
.absente-icone { font-size: 24px; opacity: .5; }
.absente-texte { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

/* Le statut se lit sur la photo, en pastille : on sait d'un coup d'œil. */
.carte-statut {
  position: absolute; top: 10px; left: 10px;
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.93); backdrop-filter: blur(6px);
  border-radius: 999px; padding: 4px 11px 4px 8px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  box-shadow: var(--ombre-1);
}
.carte-statut::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status-valide   { color: var(--vert); }
.status-etude    { color: var(--ambre); }
.status-obsolete { color: var(--rouge); }

.carte-corps { display: flex; flex-direction: column; gap: var(--e-3); padding: var(--e-4); flex: 1; }
.carte-tete { display: flex; align-items: baseline; justify-content: space-between; gap: var(--e-2); }
.carte-pn { font-family: var(--police-data); font-size: 15px; font-weight: 600; color: var(--encre); word-break: break-all; line-height: 1.3; }
.carte-fonction { font-size: 10.5px; font-weight: 700; color: var(--encre-3); text-transform: uppercase; letter-spacing: .14em; }
.carte-vide { font-size: 12.5px; color: var(--encre-3); font-style: italic; }

/* Composition : une barre empilée aux couleurs des types, puis la légende. */
.compo-barre { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--surface-3); }
.compo-barre span { display: block; }
.compo-structure { background: var(--t-structure); }
.compo-harnais   { background: var(--t-harnais); }
.compo-plaquette { background: var(--t-plaquette); }
.compo-autre     { background: var(--t-autre); }
.composition { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.composition li { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--encre-2); }
.composition li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.composition .type-structure { color: var(--t-structure); }
.composition .type-harnais   { color: var(--t-harnais); }
.composition .type-plaquette { color: var(--t-plaquette); }
.composition .type-autre     { color: var(--t-autre); }
.composition li b { color: var(--encre-2); font-variant-numeric: tabular-nums; }

.carte-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--e-3); margin: 0; font-size: 12px; }
.carte-meta dt { color: var(--encre-3); }
.carte-meta dd { margin: 0; text-align: right; font-family: var(--police-data); font-size: 11.5px; color: var(--encre-2); word-break: break-word; }
.carte-actions { display: flex; gap: var(--e-2); margin-top: auto; padding-top: var(--e-2); }
.carte-actions > * { flex: 1; white-space: nowrap; padding-inline: 10px; }

/* ---------------- boutons ---------------- */
.btn-principal, .btn-neutre, .btn-accent, .btn-mini, .btn-lien, .btn-action {
  border-radius: var(--r-s); border: 1px solid transparent; font-weight: 600;
  transition: background .15s, color .15s, border-color .15s; text-align: center;
}
.btn-principal { background: var(--marque); color: var(--sur-marque); padding: 9px 16px; font-size: 13px; }
.btn-principal:hover { background: var(--marque-2); }
.btn-neutre { background: var(--surface); color: var(--encre); border-color: var(--trait-fort); padding: 8px 14px; font-size: 13px; }
.btn-neutre:hover { background: var(--surface-3); }
.btn-neutre.actif { background: var(--marque-voile); color: var(--marque); border-color: var(--marque); }
.btn-accent { background: var(--surface); color: var(--marque); border-color: var(--marque); padding: 9px 16px; font-size: 13px; }
.btn-accent:hover { background: var(--marque); color: var(--sur-marque); }
.btn-mini { background: var(--surface-3); color: var(--encre-2); padding: 5px 11px; font-size: 12px; border-color: var(--trait); }
.btn-mini:hover { background: var(--trait); color: var(--encre); }
.btn-lien { background: none; border: 0; color: var(--encre-2); padding: 4px 6px; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
.btn-lien:hover { color: var(--marque); }
.btn-action { padding: 5px 11px; font-size: 12px; background: var(--surface-3); color: var(--encre-2); border-color: var(--trait); }
.btn-action:hover { background: var(--trait); color: var(--encre); }
.btn-valider { background: var(--vert); color: #fff; border-color: var(--vert); }
.btn-valider:hover { background: var(--vert); filter: brightness(1.08); color: #fff; }
.btn-danger  { background: var(--rouge-voile); color: var(--rouge); border-color: var(--rouge-trait); }
.btn-danger:hover { background: var(--rouge); color: #fff; }
.btn-danger-plein { background: var(--rouge); color: #fff; border-color: var(--rouge); }
.btn-danger-plein:hover { background: var(--rouge); filter: brightness(1.1); }

/* ---------------- panneau (fiche) ---------------- */
.panneau { width: min(720px, 100vw) !important; background: var(--sol-2); color: var(--encre); border-left: 1px solid var(--trait); }
.panneau-tete { background: var(--surface); border-bottom: 1px solid var(--trait); align-items: flex-start; gap: var(--e-3); }
.panneau-tete .offcanvas-title { font-family: var(--police-data); font-size: 17px; font-weight: 600; word-break: break-all; }
.panneau-sous { font-size: 12.5px; color: var(--encre-3); margin-top: 2px; }
.panneau-actions { display: flex; align-items: center; gap: var(--e-2); flex-shrink: 0; }
.offcanvas-body { padding: var(--e-4); }

.sommaire { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--e-4); }
.sommaire-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: 999px; border: 1px solid; }
.sommaire-item b { font-variant-numeric: tabular-nums; }
.sommaire-item.type-structure { background: var(--t-structure-voile); color: var(--t-structure); border-color: var(--t-structure-trait); }
.sommaire-item.type-harnais   { background: var(--t-harnais-voile);   color: var(--t-harnais);   border-color: var(--t-harnais-trait); }
.sommaire-item.type-plaquette { background: var(--t-plaquette-voile); color: var(--t-plaquette); border-color: var(--t-plaquette-trait); }
.sommaire-item.type-autre     { background: var(--t-autre-voile);     color: var(--t-autre);     border-color: var(--t-autre-trait); }

.bloc { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); padding: var(--e-4); margin-bottom: var(--e-3); }
.bloc-general { border-left: 3px solid var(--marque); }
.bloc-type-structure { border-left: 3px solid var(--t-structure); }
.bloc-type-harnais   { border-left: 3px solid var(--t-harnais); }
.bloc-type-plaquette { border-left: 3px solid var(--t-plaquette); }
.bloc-type-autre     { border-left: 3px solid var(--t-autre); }
.bloc-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-3); padding-bottom: var(--e-3); margin-bottom: var(--e-3); border-bottom: 1px solid var(--trait); flex-wrap: wrap; }
.bloc-tete h3 { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.bloc-identite { display: flex; gap: var(--e-3); align-items: center; }
.bloc-pn { font-family: var(--police-data); font-size: 12.5px; color: var(--encre-3); word-break: break-all; }
.pastille-type { display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: var(--r-s); font-size: 14px; border: 1px solid; }
.pastille-type.type-structure { background: var(--t-structure-voile); color: var(--t-structure); border-color: var(--t-structure-trait); }
.pastille-type.type-harnais   { background: var(--t-harnais-voile);   color: var(--t-harnais);   border-color: var(--t-harnais-trait); }
.pastille-type.type-plaquette { background: var(--t-plaquette-voile); color: var(--t-plaquette); border-color: var(--t-plaquette-trait); }
.pastille-type.type-autre     { background: var(--t-autre-voile);     color: var(--t-autre);     border-color: var(--t-autre-trait); }
.bloc-actions { display: flex; align-items: center; gap: var(--e-1); flex-wrap: wrap; }
.zone-spin { display: inline-flex; width: 16px; }

.ligne { display: flex; gap: var(--e-3); padding: 8px 0; border-bottom: 1px solid var(--surface-3); align-items: flex-start; }
.ligne:last-child { border-bottom: 0; }
.ligne-bloc { flex-direction: column; gap: var(--e-2); }
.ligne-cle { flex: 0 0 38%; font-size: 12.5px; color: var(--encre-3); font-weight: 500; }
.ligne-bloc .ligne-cle { flex: none; }
.lien-url {
  font-family: var(--police-data); font-size: 11.5px; color: var(--marque);
  text-decoration: underline; text-underline-offset: 3px; word-break: break-all;
}
.lien-url:hover { color: var(--marque-2); }
.lien-embarque { color: var(--encre-3); text-decoration: none; font-style: italic; }
.ligne-aide { display: block; font-size: 11px; color: var(--encre-3); opacity: .8; font-weight: 400; }
.ligne-val { flex: 1; font-size: 13px; min-width: 0; word-break: break-word; width: 100%; }

/* Où cette pièce est-elle montée : la question clé d'un outil de réemploi. */
.usages { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: var(--e-2); }
.usages-titre { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--encre-3); font-weight: 600; }
.usage-lien { font-family: var(--police-data); font-size: 11.5px; background: var(--surface-3); border: 1px solid var(--trait); border-radius: var(--r-s); padding: 3px 9px; color: var(--encre-2); }
.usage-lien:hover { background: var(--marque); color: var(--sur-marque); border-color: var(--marque); }

.saisie { width: 100%; background: var(--surface-2); color: var(--encre); border: 1px solid var(--trait-fort); border-radius: var(--r-s); padding: 7px 10px; font-size: 13px; font-family: inherit; }
.saisie:focus { outline: none; border-color: var(--marque); background: var(--surface); }
.saisie-pleine { width: 100%; background: var(--surface-2); color: var(--encre); border: 1px solid var(--trait-fort); border-radius: var(--r-s); padding: 9px 12px; font-size: 13.5px; margin-bottom: var(--e-3); }
.saisie-pleine:focus { outline: none; border-color: var(--marque); }
.champ-libelle { display: block; font-size: 12px; font-weight: 600; color: var(--encre-2); margin-bottom: 4px; }
.champ-libelle span { color: var(--rouge); font-weight: 500; }
.champ-paire { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
@media (max-width: 520px) { .champ-paire { grid-template-columns: 1fr; } }

/* Porteurs : une liste fermée, on coche. */
.choix-porteurs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--e-3); }
.jeton-porteur { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--trait-fort); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 500; color: var(--encre-2); cursor: pointer; background: var(--surface); transition: .14s; }
.jeton-porteur input { position: absolute; opacity: 0; width: 0; height: 0; }
.jeton-porteur:hover { border-color: var(--marque); color: var(--marque); }
.jeton-porteur:has(input:checked) { background: var(--marque); color: var(--sur-marque); border-color: var(--marque); }
.jeton-porteur:has(input:focus-visible) { outline: 2px solid var(--marque); outline-offset: 2px; }

.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-3); color: var(--encre-2); border: 1px solid var(--trait); border-radius: var(--r-s); padding: 3px 4px 3px 9px; font-size: 12px; font-weight: 500; }
.puce-motcle { background: var(--t-plaquette-voile); color: var(--t-plaquette); border-color: var(--t-plaquette-trait); }
.puce-porteur { background: var(--marque-voile); color: var(--marque); border-color: var(--trait-fort); font-family: var(--police-data); }
.puce-suppr { border: 0; background: transparent; color: inherit; font-size: 14px; line-height: 1; padding: 0 3px; opacity: .55; }
.puce-suppr:hover { opacity: 1; color: var(--rouge); }
/* Au doigt, la croix faisait 14 px de côté : on vise à côté une fois sur
   deux. On agrandit la zone atteignable sans grossir le signe. */
@media (pointer: coarse) {
  .puce-suppr {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; min-height: 26px; margin: -6px -4px -6px 0; padding: 0;
  }
  .composant .puce-suppr { margin: 0; }
}
.ajout-multi { display: flex; gap: 6px; margin-top: 6px; }
.ajout-multi .saisie-multi {
  flex: 0 1 auto; min-width: 0; max-width: 260px;
  background: var(--surface-2); color: var(--encre);
  border: 1px solid var(--trait-fort); border-radius: var(--r-s);
  padding: 6px 10px; font-size: 12.5px;
}
/* Une liste fermee se dimensionne sur son contenu : « Ajouter un porteur… »
   n'a aucune raison de barrer la fiche sur toute sa largeur. */
.ajout-multi .saisie-multi-seule { flex: 0 0 auto; width: auto; max-width: 100%; }
.zone-puces { display: flex; flex-wrap: wrap; gap: 6px; min-height: 54px; padding: var(--e-3); background: var(--surface-2); border: 1px solid var(--trait); border-radius: var(--r-s); margin-bottom: var(--e-3); }

/* Composants à trois niveaux : fonction, norme, référence — en colonnes,
   comme une nomenclature, pas en puces qu'il faudrait décoder. */
.composants { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr) 22px; gap: 0 10px; border: 1px solid var(--trait); border-radius: var(--r-s); overflow: hidden; }
.composants-entete, .composant { display: contents; }
.composants-entete > span { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--encre-3); font-weight: 700; padding: 6px 0 4px; background: var(--surface-2); border-bottom: 1px solid var(--trait); }
.composants-entete > span:first-child, .composant > span:first-child { padding-left: 10px; }
.composant > span, .composant > button { padding: 6px 0; border-bottom: 1px solid var(--surface-3); align-self: center; min-width: 0; overflow-wrap: anywhere; }
.composant:last-child > span, .composant:last-child > button { border-bottom: 0; }
.niveau-fonction { font-size: 12.5px; font-weight: 600; }
.niveau-norme { font-size: 12.5px; color: var(--encre-2); }
.niveau-reference { font-family: var(--police-data); font-size: 11.5px; color: var(--encre); }
.niveau-vide { color: var(--encre-3); font-style: italic; font-weight: 400; font-family: var(--police); }
.composant .puce-suppr { justify-self: center; }
.composants-vide { font-size: 12.5px; color: var(--encre-3); padding: 8px 10px; grid-column: 1 / -1; }
.ajout-composant { display: grid; grid-template-columns: 1.2fr 1fr 1.1fr auto; gap: 6px; margin-top: 8px; }
.ajout-composant .saisie-composant { min-width: 0; background: var(--surface-2); color: var(--encre); border: 1px solid var(--trait-fort); border-radius: var(--r-s); padding: 6px 9px; font-size: 12.5px; }
.ajout-composant .saisie-composant:focus { outline: none; border-color: var(--marque); }
.composants-outils { display: flex; justify-content: flex-end; margin-top: 6px; }
@media (max-width: 560px) { .ajout-composant { grid-template-columns: 1fr 1fr; } }

/* La photo situe la piece, elle n'est pas le sujet de la fiche : on la pose
   en vignette, et un clic l'agrandit pour qui veut vraiment la voir. */
.vignette { display: block; border: 1px solid var(--trait); border-radius: var(--r-s);
  overflow: hidden; padding: 0; background: var(--surface-3); margin-bottom: var(--e-3);
  width: 100%; max-width: 260px; }
.vignette img { display: block; width: 100%; max-width: 100%; max-height: 120px; object-fit: cover; }
.vignette-large { max-width: 320px; }
.vignette-large img { max-height: 150px; }
.loupe img { width: 100%; max-width: 100%; border-radius: var(--r-s); }
.fiche-pied { padding: var(--e-4) 0 var(--e-7); text-align: center; }
.fiche-pied .btn-principal { width: 100%; max-width: 380px; }

/* ---------------- modales ---------------- */
.boite-modale { background: var(--surface); color: var(--encre); border: 1px solid var(--trait); border-radius: var(--r-l); }
.boite-modale .modal-header { border-bottom: 1px solid var(--trait); align-items: flex-start; gap: var(--e-3); }
.boite-modale .modal-title { font-size: 16px; font-weight: 700; }
.modale-sous { font-size: 12.5px; color: var(--encre-3); margin-top: 2px; }
.modale-outils { display: flex; align-items: center; gap: var(--e-3); flex-shrink: 0; }
.ligne-saisie { display: flex; gap: var(--e-2); margin-bottom: var(--e-3); }
.ligne-saisie input { flex: 1; min-width: 0; background: var(--surface-2); color: var(--encre); border: 1px solid var(--trait-fort); border-radius: var(--r-s); padding: 8px 12px; font-size: 13px; }
:root[data-theme="dark"] .btn-close { filter: invert(1) grayscale(1) brightness(1.7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-close { filter: invert(1) grayscale(1) brightness(1.7); } }

.liste-catalogue { display: flex; flex-direction: column; }
.ligne-catalogue { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr) 18px; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--trait); padding: 9px 8px; font-size: 13px; color: var(--encre); }
.ligne-catalogue:hover { background: var(--surface-3); }
.ligne-catalogue small { display: block; font-size: 11px; color: var(--encre-3); font-weight: 400; }
.ligne-catalogue-plus { color: var(--vert); font-weight: 700; font-size: 16px; }
.catalogue-entete { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr) 18px; gap: 10px; padding: 0 8px 4px; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--encre-3); font-weight: 700; }

.choix-types { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--e-2); margin-bottom: var(--e-4); }
.choix-type { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: var(--e-3); border: 1px solid var(--trait); border-radius: var(--r-m); cursor: pointer; background: var(--surface-2); transition: .15s; }
.choix-type input { position: absolute; opacity: 0; width: 0; height: 0; }
.choix-type:has(input:checked) { border-width: 2px; }
.choix-type.type-structure:has(input:checked) { border-color: var(--t-structure); background: var(--t-structure-voile); }
.choix-type.type-harnais:has(input:checked)   { border-color: var(--t-harnais);   background: var(--t-harnais-voile); }
.choix-type.type-plaquette:has(input:checked) { border-color: var(--t-plaquette); background: var(--t-plaquette-voile); }
.choix-type:has(input:focus-visible) { outline: 2px solid var(--marque); outline-offset: 2px; }
.choix-icone { font-size: 21px; }
.choix-libelle { font-size: 13px; font-weight: 600; }
.choix-aide { font-size: 11px; color: var(--encre-3); }

/* ---------------- dialogue ---------------- */
/* Au-dessus du panneau de fiche (1045) et des autres modales (1055). */
.dialogue { --bs-modal-zindex: 1080; z-index: 1080; }
.dialogue-boite { max-width: 440px; }
.dialogue-titre { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.dialogue-message { font-size: 13.5px; color: var(--encre-2); white-space: pre-line; margin-bottom: var(--e-3); }
.dialogue-actions { display: flex; justify-content: flex-end; gap: var(--e-2); margin-top: var(--e-2); }

/* ---------------- équivalences : rail de réglages + classement ---------------- */
.compare-dialogue { max-width: min(1240px, calc(100vw - 32px)); }
.compare-corps { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e-4); align-items: start; padding: var(--e-4); }
.compare-corps.avec-reglages { grid-template-columns: 300px minmax(0, 1fr); }
.compare-resultats { min-width: 0; }
.reglages-rail {
  position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--e-3);
  background: var(--surface-2); border: 1px solid var(--trait); border-radius: var(--r-m);
  padding: var(--e-4); max-height: calc(100vh - 220px); overflow: auto;
}
.reglages-rail[hidden] { display: none; }
.rail-tete {
  position: sticky; top: calc(var(--e-4) * -1); z-index: 2;
  margin: calc(var(--e-4) * -1) calc(var(--e-4) * -1) 0;
  padding: var(--e-4) var(--e-4) var(--e-2);
  background: var(--surface-2); border-bottom: 1px solid var(--trait);
}
.rail-tete h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--encre-3); }
.btn-reglage { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.reglage { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-s); padding: 8px 10px; margin-bottom: 6px; }
.reglage-tete { display: flex; align-items: center; gap: var(--e-2); }
.reglage-tete label { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; }
.reglage-part { font-family: var(--police-data); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
.reglage-retirer { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--trait); color: var(--encre-3); font-size: 14px; line-height: 1; }
.reglage-retirer:hover:not(:disabled) { background: var(--rouge-voile); color: var(--rouge); border-color: var(--rouge-trait); }
.reglage-retirer:disabled { opacity: .35; cursor: not-allowed; }
.curseur, .curseur-seuil { width: 100%; accent-color: var(--marque); margin-top: 4px; }
.reglage-jauge { height: 4px; background: var(--surface-3); border-radius: 3px; margin-top: 2px; overflow: hidden; }
.reglage-jauge span { display: block; height: 100%; background: var(--marque); border-radius: 3px; transition: width .1s; }
.reglage-total { text-align: right; font-size: 12px; font-weight: 600; color: var(--encre-3); font-variant-numeric: tabular-nums; margin-top: 2px; }
.reglage-total-faux { color: var(--rouge); }
.reglage-unique { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-s); padding: var(--e-3); font-size: 12.5px; color: var(--encre-2); }
.criteres-dispo { border-top: 1px dashed var(--trait-fort); padding-top: var(--e-3); margin-top: var(--e-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.criteres-dispo h4 { width: 100%; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--encre-3); font-weight: 700; }
.btn-ajout-critere { background: var(--surface); border: 1px dashed var(--trait-fort); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 500; color: var(--encre-2); }
.btn-ajout-critere:hover { border-style: solid; border-color: var(--marque); color: var(--marque); }
.seuil { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-s); padding: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px var(--e-2); align-items: center; }
.seuil label { font-size: 12.5px; font-weight: 600; }
.seuil output { font-family: var(--police-data); font-size: 12.5px; font-weight: 600; }
.seuil .curseur-seuil { grid-column: 1 / -1; }
.seuil-aide { grid-column: 1 / -1; font-size: 11px; color: var(--encre-3); }
.avertissement { font-size: 11.5px; color: var(--ambre); background: var(--ambre-voile); border: 1px solid var(--ambre-trait); border-radius: var(--r-s); padding: 6px 10px; }

.rappel-reglages { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); background: var(--surface-2); border: 1px solid var(--trait); border-radius: var(--r-m); padding: 10px 14px; margin-bottom: var(--e-4); flex-wrap: wrap; }
.rappel-texte { display: flex; flex-direction: column; min-width: 0; }
.rappel-texte b { font-size: 13px; }
.rappel-texte span { font-size: 11.5px; color: var(--encre-3); overflow-wrap: anywhere; }

.resultat { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-m); padding: var(--e-4); margin-bottom: var(--e-3); }
.resultat-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-3); padding-bottom: var(--e-3); margin-bottom: var(--e-3); border-bottom: 1px solid var(--trait); }
.resultat-tete h4 { font-family: var(--police-data); font-size: 15px; font-weight: 600; word-break: break-all; }
.resultat-sous { font-size: 12.5px; color: var(--encre-3); margin-top: 3px; }
.resultat-actions { margin-bottom: var(--e-3); }
.score { text-align: center; padding: 8px 16px; border-radius: var(--r-s); border: 1px solid; flex-shrink: 0; }
.score b { display: block; font-family: var(--police-titre); font-size: 22px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score b small { font-size: 12px; font-weight: 600; }
.score-fort   { background: var(--vert-voile);  color: var(--vert);  border-color: var(--vert-trait); }
.score-moyen  { background: var(--ambre-voile); color: var(--ambre); border-color: var(--ambre-trait); }
.score-faible { background: var(--surface-3);   color: var(--encre-3); border-color: var(--trait); }
.alerte-manquant { font-size: 12px; color: var(--ambre); background: var(--ambre-voile); border: 1px solid var(--ambre-trait); border-radius: var(--r-s); padding: 7px 11px; margin-bottom: var(--e-3); }

.criteres { display: flex; flex-direction: column; gap: var(--e-2); }
.critere { display: flex; gap: var(--e-2); align-items: flex-start; }
.critere-hors { opacity: .65; }
.critere-signe { font-size: 14px; font-weight: 700; line-height: 1.4; flex-shrink: 0; width: 16px; text-align: center; }
.etat-ok { color: var(--vert); } .etat-partiel { color: var(--ambre); }
.etat-diff { color: var(--rouge); } .etat-inconnu { color: var(--encre-3); }
.critere-corps { flex: 1; min-width: 0; }
.critere-tete { display: flex; align-items: baseline; justify-content: space-between; gap: var(--e-2); font-size: 13px; }
.critere-part { font-size: 11px; color: var(--encre-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.critere-message { font-size: 12.5px; color: var(--encre-2); word-break: break-word; }
.critere-jauge { width: 100%; max-width: 190px; height: 5px; border-radius: 3px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
.critere-jauge span { display: block; height: 100%; border-radius: 3px; background: currentColor; }

.ensembles { display: grid; gap: 6px; margin: 6px 0 6px 24px; }
.ensemble { border-radius: var(--r-s); padding: 7px 10px; border: 1px solid; }
.ensemble-titre { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.ensemble-liste { list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.ensemble-ok { background: var(--vert-voile); border-color: var(--vert-trait); color: var(--vert); }
.ensemble-manquant { background: var(--ambre-voile); border-color: var(--ambre-trait); color: var(--ambre); }
.ensemble-plus { background: var(--surface-3); border-color: var(--trait); color: var(--encre-2); }

/* Paliers d'équivalence des composants : référence exacte, même norme, même
   fonction, sans équivalent. Trois niveaux de confiance, trois teintes. */
.paliers { display: grid; gap: 6px; margin: 6px 0 6px 24px; }
.palier { border-radius: var(--r-s); padding: 7px 10px; border: 1px solid; }
.palier-titre { display: flex; justify-content: space-between; gap: var(--e-2); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.palier-titre small { font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .85; }
.palier-liste { list-style: none; margin: 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.palier-liste li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.palier-liste .compo { font-weight: 600; }
.palier-liste .compo-norme { opacity: .85; }
.palier-liste .compo-ref { font-family: var(--police-data); font-size: 11.5px; }
.palier-liste .vers { opacity: .6; }
.palier-apparies { background: var(--surface-2); border-color: var(--trait); color: var(--encre-2); }
