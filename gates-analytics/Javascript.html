    var see = cle === 'manque' || cle === 'attente' ? 'absent' : 'présent';
    return R[cle].map(function (p) { return { ref: p.reference, plan: p, see: see }; });
  }
  function rendreListeRapprochement(comptes, nom) {
    var zone = $('liste-rapprochement');
    var total = ORDRE_LISTE_RAPP.reduce(function (t, cle) { return t + (comptes[cle] || 0); }, 0);
    /* La liste se refait entière à chaque rendu : on retient où en était
       chaque lot déplié pour l'y remettre — sur 251 puces, un clic ne doit
       pas tout faire remonter. */
    var defilements = {};
    [].slice.call(zone.querySelectorAll('.rapp-groupe[data-cle]')).forEach(function (g) {
      var corps = g.querySelector('.rapp-groupe-corps');
      if (corps && corps.scrollTop) defilements[g.dataset.cle] = corps.scrollTop;
    });
    if (!total) { zone.innerHTML = ''; return; }
    /* En tête : le titre, le mode d'emploi en un mot, et la légende des
       pastilles d'état — la pastille de chaque puce dit l'état du plan dans
       GATES, il faut pouvoir la lire sans survoler. */
    var html = '\x3Cdiv class="rapp-liste-tete">\x3Ch3 class="rapp-liste-titre">Plan par plan\x3C/h3>' +
      '\x3Cspan class="indice">d\u2019abord ce qui est \u00e0 v\u00e9rifier, puis ce qui va \u2014 un clic sur une r\u00e9f\u00e9rence la montre dans le tableau\x3C/span>' +
      '\x3Cspan class="rapp-puces-legende" aria-label="Pastilles : \u00e9tat du plan dans GATES">' + ETATS.map(function (e) {
        return '\x3Cspan>' + pastilleDe(e.cle) + ech(e.court) + '\x3C/span>';
      }).join('') + '\x3C/span>\x3C/div>';
    ORDRE_LISTE_RAPP.forEach(function (cle) {
      var n = comptes[cle];
      if (!n) return;
      var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
      var ouvert = groupeRappOuvert(cle);
      html += '\x3Cdiv class="rapp-groupe" data-cle="' + cle + '" data-ouvert="' + ouvert + '">' +
        '\x3Cbutton class="rapp-groupe-tete" type="button" data-plier="' + cle + '" aria-expanded="' + ouvert + '">' +
        pastilleVerdict(lot.segment) + '\x3Cb>' + nb(n) + '\x3C/b>' +
        '\x3Cspan class="rapp-groupe-phrase">' + ech(phraseLot(cle, n, nom)) + '\x3C/span>' +
        '\x3Cspan class="chevron" aria-hidden="true">\x3C/span>\x3C/button>';
      if (ouvert) {
        var rangees = rangeesLotRapp(cle).sort(function (a, b) { return COMPARER_REF(a.ref, b.ref); });
        /* Une puce par plan — tous, sans coupure : un lot déplié montre ce
           qu'il contient. Sa pastille d'état, sa référence, et pour une
           réémission la lettre sous laquelle SEE le connaît. Le détail tient
           dans la bulle du survol ; un clic mène au tableau. Au-delà de la
           hauteur d'un écran, la zone défile plutôt que de pousser la page. */
        html += '\x3Cdiv class="rapp-groupe-corps">\x3Cdiv class="rapp-puces">' +
          rangees.map(function (r) {
            var etat = r.plan ? r.plan._etat : '';
            var motEtat = r.plan ? (ETAT_PAR_CLE[etat] ? ETAT_PAR_CLE[etat].court : '\u2014') + ' dans GATES' : 'aucun plan dans GATES';
            var bulle = motEtat + ' \u00b7 ' + r.see + ' dans ' + nom +
              (r.plan ? ' \u2014 ne montrer que ce plan dans le tableau' : ' \u2014 voir cette ligne dans le tableau de ' + nom);
            var attrs = r.plan
              ? ' data-plan-rapp="' + ech(r.ref) + '" data-etat="' + ech(etat) + '"'
              : ' data-ligne-la="' + ech(r.la) + '"';
            return '\x3Cbutton class="rapp-puce" type="button"' + attrs + ' data-see="' + ech(r.see) + '" title="' + ech(bulle) + '">' +
              (r.plan ? pastilleDe(etat) : '') +
              '\x3Cspan class="rapp-puce-ref">' + ech(r.ref) + '\x3C/span>' +
              (r.vers ? '\x3Cspan class="rapp-puce-vers">\u2192 ' + ech(r.vers) + '\x3C/span>' : '') + '\x3C/button>';
          }).join('') + '\x3C/div>\x3C/div>';
      }
      html += '\x3C/div>';
    });
    zone.innerHTML = html;
    Object.keys(defilements).forEach(function (cle) {
      var corps = zone.querySelector('.rapp-groupe[data-cle="' + cle + '"] .rapp-groupe-corps');
      if (corps) corps.scrollTop = defilements[cle];
    });
  }

  /* La bulle d'un lot : ce que c'est, combien, le détail qui aide — la part
     des terminés, les paires « référence → solution et lettre », la
     répartition par état — et où mène le clic. */
  var MAX_PAIRES_RAPP = 10;
  function repartitionEtats(plans) {
    var comptes = {};
    plans.forEach(function (p) { comptes[p._etat] = (comptes[p._etat] || 0) + 1; });
    return ETATS.filter(function (e) { return comptes[e.cle]; }).map(function (e) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleDe(e.cle) + ech(e.libelle.toLowerCase()) + ' dans GATES\x3Cspan class="n">' + nb(comptes[e.cle]) + '\x3C/span>\x3C/div>';
    }).join('');
  }
  function bulleLotRapp(cle) {
    var R = RAPPROCHEMENT, nom = nomSeconde();
    var lot = LOTS_RAPPROCHEMENT.filter(function (l) { return l.cle === cle; })[0];
    if (!lot) return '';
    var n = compteLotRapp(cle), presse = lotRappActif() === cle, pl = n > 1;
    var tete, corps = '';
    /* À zéro, il n'y a rien à raconter : une bulle qui décrirait l'écart
       laisserait croire qu'il existe. */
    if (!n) {
      return '\x3Cdiv class="tete-bulle">' + ech(libelleRapp(lot)) + '\x3C/div>' +
        '\x3Cdiv class="doux">aucun : rien à signaler de ce côté-là\x3C/div>';
    }
    if (cle === 'accord') {
      tete = 'Terminés ici, connus de ' + nom;
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille accord">\x3C/span>' + nb(n) + (pl ? ' plans' : ' plan') +
        '\x3Cspan class="n">' + (R.nbTermines ? Math.round(100 * n / R.nbTermines) : 0) + '\u202f% des terminés\x3C/span>\x3C/div>' +
        '\x3Cdiv class="doux">même indice des deux côtés\x3C/div>';
    } else if (cle === 'emission') {
      tete = 'Le même plan, sous un autre indice';
      var paires = R.emission.map(function (x) { return ech(x.plan.reference) + ' \u2192 ' + ech(x.ref_la.slice(-4)); });
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille indice">\x3C/span>' + nb(n) + (pl ? ' plans' : ' plan') + '\x3C/div>' +
        (paires.length ? '\x3Cdiv class="liste-refs">' + paires.slice(0, MAX_PAIRES_RAPP).join('\x3Cbr>') +
          (paires.length > MAX_PAIRES_RAPP ? '\x3Cbr>\x3Cspan class="doux">et ' + nb(paires.length - MAX_PAIRES_RAPP) + ' autres\u2026\x3C/span>' : '') + '\x3C/div>' : '');
    } else if (cle === 'avance') {
      tete = 'Dans ' + nom + ', mais pas terminés dans GATES';
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille avance">\x3C/span>' + nb(n) + (pl ? ' plans' : ' plan') + '\x3C/div>' +
        '\x3Cdiv class="bulle-comptes">' + repartitionEtats(R.avance) + '\x3C/div>' +
        '\x3Cdiv class="doux">' + ech(nom) + (pl ? ' les connaît' : ' le connaît') + ' : l’avancement GATES est peut-être en retard\x3C/div>';
    } else if (cle === 'manque') {
      tete = 'Terminés ici, inconnus de ' + nom;
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille manque">\x3C/span>' + nb(n) + (pl ? ' plans' : ' plan') + '\x3C/div>' +
        '\x3Cdiv class="doux">GATES ' + (pl ? 'les dit terminés' : 'le dit terminé') + ', ' + ech(nom) + ' n’a pas ' + (pl ? 'leur plan' : 'son plan') + ' : à vérifier des deux côtés\x3C/div>';
    } else if (cle === 'attente') {
      tete = 'Pas encore dans ' + nom;
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille attente">\x3C/span>' + nb(n) + (pl ? ' plans' : ' plan') + '\x3C/div>' +
        '\x3Cdiv class="bulle-comptes">' + repartitionEtats(R.attente) + '\x3C/div>' +
        '\x3Cdiv class="doux">pas terminés, pas encore créés dans ' + ech(nom) + ' : rien d’anormal\x3C/div>';
    } else {
      tete = 'Seulement dans ' + nom;
      corps = '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille seul">\x3C/span>' + nb(n) + (pl ? ' lignes, aucun plan d’ici sous leur racine' : ' ligne, aucun plan d’ici sous sa racine') +
        (vue.perimetre ? ' · tout le contrat' : '') + '\x3C/div>';
    }
    var fin = !n ? 'aucun' : presse ? '\u2192 retirer le filtre'
      : lot.atterrit === 'la' ? '\u2192 le tableau passe sur ' + nom
      : lot.atterrit === 'ici' ? '\u2192 le tableau passe sur GATES'
      : '\u2192 n’afficher que ceux-là dans le tableau';
    return '\x3Cdiv class="tete-bulle">' + ech(tete) + '\x3C/div>' + corps +
      '\x3Cdiv class="doux" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)">' + ech(fin) + '\x3C/div>';
  }
  function eclairerSegment(cle) {
    document.querySelectorAll('#venn-rapprochement [data-cle]').forEach(function (el) {
      var lui = !!cle && el.getAttribute('data-cle') === cle;
      if (lui) el.classList.add('survole'); else el.classList.remove('survole');
    });
  }
  /* La phrase d'un verdict, en français de tous les jours : le nombre est
     déjà écrit à gauche, la phrase dit ce qu'il compte. */
  /* La phrase d'un lot se lit seule, derrière son nombre : plus de mot court
     en gras devant, il ne disait rien de plus. Sous un périmètre, « seulement
     dans la seconde base » compte tout le contrat, et le dit. */
  function phraseLot(cle, n, nom) {
    var pl = n > 1, tout = vue.perimetre && cle === 'seul' ? ' \u2014 tout le contrat' : '';
    if (cle === 'accord') return (pl ? 'terminés' : 'terminé') + ' dans GATES et ' + (pl ? 'connus' : 'connu') + ' de ' + nom;
    if (cle === 'emission') return 'dans ' + nom + ' sous une autre lettre d’indice';
    if (cle === 'avance') return 'dans ' + nom + ', mais GATES ne ' + (pl ? 'les' : 'le') + ' dit pas ' + (pl ? 'terminés' : 'terminé');
    if (cle === 'manque') return (pl ? 'terminés' : 'terminé') + ' dans GATES, mais ' + nom + ' ne ' + (pl ? 'les' : 'le') + ' connaît pas';
    if (cle === 'attente') return (pl ? 'pas terminés' : 'pas terminé') + ', et pas encore dans ' + nom + ' : rien d’anormal';
    return (pl ? 'lignes de ' : 'ligne de ') + nom + ' sans plan dans GATES' + tout;
  }
  /* Un arc d'anneau, de l'angle a0 à l'angle a1 (en degrés, 0 en haut, sens
     horaire), au rayon r autour de (cx, cy). */
  function arcAnneau(cx, cy, r, a0, a1) {
    var rad = function (a) { return (a - 90) * Math.PI / 180; };
    var x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
    var x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
    return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
  }
  /* La figure du rapprochement : deux cercles qui se recouvrent, le nom et le
     compte de chaque base au-dessus, le nombre en commun au milieu avec son
     anneau (d'accord, autre indice, pas terminé ici), et sur chaque côté ce
     que la base est seule à connaître — à gauche, les terminés que la seconde
     base ignore, et dessous, plus discret, ce qui n'est pas encore créé. Les
     cercles ne sont pas à l'échelle : c'est la structure qu'on lit, les
     nombres disent le reste. */
  function figureRapprochement(c, R, nom, perimetre) {
    var nP = R.nbPlans, nT = R.nbTermines, nL = R.nbLignes, nCommun = c.accord + c.emission + c.avance;
    var cx1 = 206, cx2 = 344, cy = 186, r = 132, cxm = (cx1 + cx2) / 2, ra = 40;
    var s = ['\x3Csvg viewBox="0 0 550 368" aria-hidden="true">'];
    s.push('\x3Ctext class="base-nom" x="' + (cx1 - 56) + '" y="26" text-anchor="middle">GATES\x3C/text>');
    s.push('\x3Ctext class="base-compte" x="' + (cx1 - 56) + '" y="42" text-anchor="middle">' + nb(nP) + (nP > 1 ? ' plans' : ' plan') + (perimetre ? ' du périmètre' : '') +
      ' · ' + nb(nT) + (nT > 1 ? ' terminés' : ' terminé') + '\x3C/text>');
    s.push('\x3Ctext class="base-nom" x="' + (cx2 + 56) + '" y="26" text-anchor="middle">' + ech(nom) + '\x3C/text>');
    s.push('\x3Ctext class="base-compte" x="' + (cx2 + 56) + '" y="42" text-anchor="middle">' + nb(nL) + (nL > 1 ? ' lignes' : ' ligne') +
      (perimetre ? ' · tout le contrat' : '') + '\x3C/text>');
    s.push('\x3Ccircle class="cercle-ici" cx="' + cx1 + '" cy="' + cy + '" r="' + r + '"/>');
    s.push('\x3Ccircle class="cercle-la" cx="' + cx2 + '" cy="' + cy + '" r="' + r + '"/>');
    /* Les côtés : ce que chaque base est seule à connaître. À gauche, le
       nombre qui compte — des terminés sans plan là — et, dessous, ceux qui
       attendent simplement leur tour. */
    /* Les mots des côtés tiennent sur deux lignes, pour rester dans le
       croissant de leur cercle sans en toucher les bords. */
    s.push('\x3Cg class="cote cote-manque' + (c.manque ? '' : ' zero') + '" data-cle="manque">' +
      '\x3Ctext class="grand" x="' + (cx1 - 60) + '" y="' + (cy - 4) + '" text-anchor="middle">' + nb(c.manque) + '\x3C/text>' +
      '\x3Ctext class="petit" x="' + (cx1 - 60) + '" y="' + (cy + 16) + '" text-anchor="middle">\x3Ctspan>' + (c.manque > 1 ? 'terminés ' : 'terminé ') + '\x3C/tspan>' +
      '\x3Ctspan x="' + (cx1 - 60) + '" dy="15">sans ' + ech(nom) + '\x3C/tspan>\x3C/text>\x3C/g>');
    /* Ce qui attend son tour se lit dans le cercle aussi — ces plans sont
       de GATES —, sous les terminés sans SEE, plus discret : un
       renseignement, pas un écart. */
    s.push('\x3Cg class="cote cote-attente" data-cle="attente">' +
      '\x3Ctext class="petit" x="' + (cx1 - 60) + '" y="' + (cy + 62) + '" text-anchor="middle">\x3Ctspan class="moyen">' + nb(c.attente) + '\x3C/tspan>\x3Ctspan> pas encore \x3C/tspan>' +
      '\x3Ctspan x="' + (cx1 - 60) + '" dy="15">dans ' + ech(nom) + '\x3C/tspan>\x3C/text>\x3C/g>');
    s.push('\x3Cg class="cote cote-seul" data-cle="seul">' +
      '\x3Ctext class="grand" x="' + (cx2 + 60) + '" y="' + (cy - 4) + '" text-anchor="middle">' + nb(c.seul) + '\x3C/text>' +
      '\x3Ctext class="petit" x="' + (cx2 + 60) + '" y="' + (cy + 16) + '" text-anchor="middle">\x3Ctspan>seulement \x3C/tspan>' +
      '\x3Ctspan x="' + (cx2 + 60) + '" dy="15">dans ' + ech(nom) + '\x3C/tspan>\x3C/text>' +
      (perimetre ? '\x3Ctext class="petit" x="' + (cx2 + 60) + '" y="' + (cy + 47) + '" text-anchor="middle">tout le contrat\x3C/text>' : '') + '\x3C/g>');
    /* Le milieu : l'anneau des plans en commun, en trois parts. */
    s.push('\x3Ccircle class="donut-fond" cx="' + cxm + '" cy="' + cy + '" r="' + ra + '"/>');
    var parts = [['accord', 'accord'], ['emission', 'emission'], ['avance', 'avance']]
      .filter(function (p) { return c[p[0]] > 0; });
    var total = parts.reduce(function (t, p) { return t + c[p[0]]; }, 0);
    /* Une part, même d'un seul plan sur des centaines, reste visible : on lui
       garantit quelques degrés, pris sur les grandes parts. */
    var MIN = 8, portions = parts.map(function (p) { return 360 * c[p[0]] / total; });
    var manque = 0, grandes = 0;
    portions.forEach(function (q) { if (q < MIN) manque += MIN - q; else grandes += q; });
    if (manque > 0 && grandes > 0) portions = portions.map(function (q) { return q < MIN ? MIN : q - manque * q / grandes; });
    var trou = parts.length > 1 ? 3 : 0, angle = 0;          // un blanc entre les parts, comme entre les segments d'une barre
    parts.forEach(function (p, i) {
      var portion = portions[i], a0 = angle + trou / 2, a1 = angle + portion - trou / 2;
      if (a1 - a0 >= 359.9) s.push('\x3Ccircle class="donut-seg ' + p[1] + '" data-cle="' + p[0] + '" data-n="' + c[p[0]] + '" cx="' + cxm + '" cy="' + cy + '" r="' + ra + '"/>');
      else if (a1 > a0) s.push('\x3Cpath class="donut-seg ' + p[1] + '" data-cle="' + p[0] + '" data-n="' + c[p[0]] + '" d="' + arcAnneau(cxm, cy, ra, a0, a1) + '"/>');
      angle += portion;
    });
    s.push('\x3Ctext class="grand commun-n' + (nb(nCommun).length > 3 ? ' serre' : '') + '" x="' + cxm + '" y="' + (cy + (nb(nCommun).length > 3 ? 7 : 9)) + '" text-anchor="middle">' + nb(nCommun) + '\x3C/text>');
    s.push('\x3Ctext class="petit commun-mot" x="' + cxm + '" y="' + (cy + ra + 26) + '" text-anchor="middle">en commun\x3C/text>');
    s.push('\x3C/svg>');
    return s.join('');
  }

  /* ============================================================
     LA SECONDE BASE, TELLE QUE SON EXTRACT
     Toutes ses colonnes, dans son ordre, sous leurs intitulés — la vue de
     référence, comme pour le tableau d'ici — et une vue essentielle si la
     source en désigne une. Le verdict du rapprochement se lit sur chaque
     ligne : la pastille dans la cellule de la référence, les cellules qui
     diffèrent d'ici sous un voile ambre. Cliquer une ligne appariée réduit
     le tableau d'ici au plan correspondant.
     ============================================================ */
  var SECONDE = null;   // { titres, cles, essentielles, vautEssentielles, premiere }
  function preparerSeconde(rap) {
    if (!rap || !Array.isArray(rap.lignes) || !rap.cleReference) { SECONDE = null; return; }
    var titres = Array.isArray(rap.colonnes) ? rap.colonnes.map(String).filter(Boolean) : [];
    if (!titres.length) {
      var vus = {};
      rap.lignes.forEach(function (l) {
        if (!l || typeof l !== 'object') return;
        Object.keys(l).forEach(function (k) { if (!vus[k]) { vus[k] = true; titres.push(k); } });
      });
    }
    var cles = [].concat(rap.cleReference).map(String);
    /* Les colonnes de la référence font toujours partie de la vue essentielle
       — mais une vue essentielle n'existe que si la source en désigne une :
       les seules colonnes de la référence ne font pas une vue. */
    var ess = cles.filter(function (t) { return titres.indexOf(t) !== -1; });
    var voulues = (Array.isArray(rap.essentielles) ? rap.essentielles : []).map(String)
      .filter(function (t) { return titres.indexOf(t) !== -1; });
    voulues.forEach(function (t) { if (ess.indexOf(t) === -1) ess.push(t); });
    SECONDE = {
      titres: titres, cles: cles, essentielles: ess,
      vautEssentielles: voulues.length > 0 && ess.length >= 2 && ess.length < titres.length,
      premiere: cles[0]
    };
  }
  function lignesSecondeAffichees() {
    var R = RAPPROCHEMENT, S = vue.seconde;
    var lot = lotRappActif();
    var casePlan = lot && LOTS_PLANS.indexOf(lot) !== -1 ? lot : undefined;
    var cherche = norm(S.recherche);
    var lignes = R.lignes.filter(function (e) {
      if (e.cat === 'hors') return false;
      /* Sous un lot, les lignes des plans de cette case — toutes leurs lignes,
         pour que le compte du bouton et le tableau parlent des mêmes plans ;
         « seulement là » garde ses lignes à lui. */
      if (lot === 'seul') { if (e.cat !== 'seul') return false; }
      else if (lot && (!casePlan || !e.plan || R.parPlan[e.plan.reference] !== casePlan)) return false;
      if (cherche && !SECONDE.titres.some(function (t) { return norm(e.ligne[t]).indexOf(cherche) !== -1; })) return false;
      return true;
    });
    if (S.tri.cle) {
      var k = S.tri.cle, sens = S.tri.asc ? 1 : -1;
      lignes = lignes.slice().sort(function (a, b) {
        var va = String(a.ligne[k] == null ? '' : a.ligne[k]), vb = String(b.ligne[k] == null ? '' : b.ligne[k]);
        if (va === '' && vb === '') return a.i - b.i;
        if (va === '') return 1;
        if (vb === '') return -1;
        return va.localeCompare(vb, 'fr', { numeric: true, sensitivity: 'base' }) * sens || a.i - b.i;
      });
    }
    return lignes;
  }
  /* L'interrupteur GATES | SEE et tout ce qui va avec : chaque outil et
     chaque tableau porte data-base, et seul ce qui appartient à la base
     montrée reste visible. Sans seconde base, l'interrupteur s'efface et le
     tableau est celui d'ici. */
  function refleterBase() {
    var laDispo = !!(RAPPROCHEMENT && SECONDE);
    if (!laDispo) vue.base = 'ici';
    var choix = $('choix-base');
    choix.hidden = !laDispo;
    $('bouton-base-la').textContent = laDispo ? nomSeconde() : 'Seconde base';
    document.querySelectorAll('#choix-base button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.base === vue.base));
    });
    document.querySelectorAll('#section-plans [data-base]:not(button)').forEach(function (el) {
      el.hidden = el.dataset.base !== vue.base ||
        (el.id === 'vue-seconde' && !(SECONDE && SECONDE.vautEssentielles));
    });
  }
  function rendreSeconde() {
    if (!RAPPROCHEMENT || !SECONDE) { $('corps-seconde').innerHTML = ''; $('tete-seconde').innerHTML = ''; return; }
    var R = RAPPROCHEMENT, S = vue.seconde, nom = nomSeconde();
    var cols = S.vueTable === 'essentielle' && SECONDE.vautEssentielles ? SECONDE.essentielles : SECONDE.titres;
    var lignes = lignesSecondeAffichees();
    var lot = lotRappActif();

    $('tete-seconde').innerHTML = '\x3Ctr class="titres-la">' + cols.map(function (t) {
      var actif = S.tri.cle === t;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (S.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      return '\x3Cth scope="col" data-cle="' + ech(t) + '" aria-sort="' + (actif ? (S.tri.asc ? 'ascending' : 'descending') : 'none') +
        '"' + (t === SECONDE.premiere ? ' class="col-fige-la"' : '') + '>\x3Cbutton type="button" data-tri-seconde="' + ech(t) + '">' +
        ech(t) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>';

    var seul = vue.refs && Object.keys(vue.refs).length === 1 ? Object.keys(vue.refs)[0] : null;
    if (!lignes.length) {
      var nAbs = compteLotRapp(lot);
      $('corps-seconde').innerHTML = '\x3Ctr>\x3Ctd colspan="' + Math.max(cols.length, 1) + '">\x3Cdiv class="vide-message">' +
        (lot === 'manque' || lot === 'attente'
          ? 'Ces ' + nb(nAbs) + (nAbs > 1 ? ' plans n’ont pas de ligne dans ' : ' plan n’a pas de ligne dans ') + ech(nom) + '. ' +
            '\x3Cbutton class="lien-doux" type="button" data-aller-base="ici">Les voir dans GATES\x3C/button>'
          : 'Aucune ligne ne correspond.') +
        '\x3C/div>\x3C/td>\x3C/tr>';
    } else {
      $('corps-seconde').innerHTML = lignes.map(function (e) {
        var ref = e.plan ? e.plan.reference : '';
        return '\x3Ctr data-i="' + e.i + '" data-cat="' + e.cat + '"' + (ref ? ' data-plan="' + ech(ref) + '"' : '') +
          (ref && seul === ref ? ' class="choisie"' : '') +
          (ref ? ' title="' + ech(MOT_VERDICT[e.cat] || '') + ' — cliquez pour retrouver ce plan dans GATES"' : '') + '>' +
          cols.map(function (t) {
            var val = e.ligne[t], s = String(val == null ? '' : val);
            var classes = [], titre = '';
            if (t === SECONDE.premiere) classes.push('col-fige-la');
            var contenu;
            if (t === SECONDE.premiere) {
              contenu = '\x3Cspan class="verdict">' + pastilleVerdict(e.cat) + (ref
                ? '\x3Cbutton type="button" class="ref ref-lien" data-plan="' + ech(ref) + '" title="Retrouver ce plan dans GATES">' + ech(s) + '\x3C/button>'
                : '\x3Cspan class="ref">' + ech(s) + '\x3C/span>') + '\x3C/span>';
            } else if (s === '') { classes.push('doux'); contenu = '-'; }
            else if (estBooleen(s)) { classes.push('coche'); contenu = '\x3Cspan title="' + ech(s) + '">' + (estVrai(s) ? '✓' : '–') + '\x3C/span>'; }
            else contenu = ech(s);
            return '\x3Ctd' + (classes.length ? ' class="' + classes.join(' ') + '"' : '') + titre + '>' + contenu + '\x3C/td>';
          }).join('') + '\x3C/tr>';
      }).join('');
    }

    var base = R.nbLignes;
    if (vue.base === 'la') {
      $('compte').textContent = nb(lignes.length) + (lignes.length > 1 ? ' lignes' : ' ligne') +
        (lignes.length !== base ? ' sur ' + nb(base) : '');
    }
    $('legende-seconde').innerHTML = ['accord', 'emission', 'avance', 'seul'].map(function (cat) {
      var mots = { accord: 'terminé ici', emission: 'autre indice', avance: 'pas terminé ici', seul: 'seulement dans ' + nom };
      return '\x3Cspan>' + pastilleVerdict(cat) + ech(mots[cat]) + '\x3C/span>';
    }).join('');
  }

  function rendre() {
    /* Le comparatif et le rapprochement dépendent du périmètre : on les
       refait avant tout le reste. */
    COMPARATIF = comparatif();
    RAPPROCHEMENT = rapprocher(SRC.rapprochement, population());
    /* Ce qui vient d'être posé décide de deux choses. Le lot « seulement dans
       la seconde base » ne survit pas à un autre geste de sélection — un
       état, un groupe, une ligne du journal, une recherche : il s'efface
       plutôt que de laisser le tableau de GATES vide sous un filtre qui ne
       le concerne pas. Et une sélection posée pendant qu'on regarde la
       seconde base ramène sur GATES, où elle a un sens — sauf un lot du
       rapprochement, qui se lit des deux côtés. */
    var cles = clesSelection();
    var ajoutees = cles.filter(function (c) { return (vue.dernieresCles || []).indexOf(c) === -1; });
    if (vue.lotLa && cles.some(function (c) { return (vue.clesLotLa || []).indexOf(c) === -1; })) vue.lotLa = null;
    if (vue.base === 'la' && vue.dernieresCles !== undefined &&
        ajoutees.some(function (c) { return c.indexOf('refs:rapprochement:') !== 0; })) vue.base = 'ici';
    /* Un lot posé suit le périmètre : ses références se relisent sur la
       population du moment ; et s'il n'a plus rien — autre périmètre, autre
       source — il se retire de lui-même, jamais un bouton grisé qui reste pressé. */
    var lotPose = lotRappActif();
    if (lotPose) {
      if (!compteLotRapp(lotPose)) poserLotRapp(lotPose);
      else if (lotPose !== 'seul') {
        vue.refs = {};
        refsDuLotRapprochement(lotPose).forEach(function (r) { vue.refs[r] = true; });
      }
    }
    refleterPerimetre();
    var liste = selection();
    refleterBase();                    // avant les tableaux : l'ombre du défilement se mesure sur un cadre visible
    rendreAvancement(liste);
    rendreGraphique(liste);
    rendreJournal();
    rendreCritique(liste);
    rendreEntetes();
    rendreCorps(liste);
    rendreComparatif();
    rendreRapprochement();
    rendreSeconde();
    rendreIncomplets();
    rendreFiltresActifs();
    $('reinit').hidden = !filtreActif();
    vue.dernieresCles = clesSelection();
    planifierSauvegarde();
  }
  /* La sélection en une liste de clés — un état, un groupe, une recherche,
     chaque filtre de colonne, chaque « non renseigné », la sélection de
     plans avec son libellé. Ce qui apparaît dans la liste, c'est un geste ;
     le périmètre n'en est pas, il suit le lot posé. */
  function clesSelection() {
    var cles = [];
    if (vue.etat) cles.push('etat:' + vue.etat);
    if (vue.groupe) cles.push('groupe:' + vue.groupe.dim + '=' + vue.groupe.val);
    if (vue.recherche) cles.push('recherche:' + vue.recherche);
    Object.keys(vue.filtres).forEach(function (k) { if (vue.filtres[k]) cles.push('filtre:' + k + '=' + vue.filtres[k]); });
    Object.keys(vue.vides).forEach(function (k) { if (vue.vides[k]) cles.push('vide:' + k); });
    if (vue.refs) cles.push('refs:' + vue.refsLibelle + ':' + Object.keys(vue.refs).length);
    return cles;
  }

  /* ============================================================ EVENEMENTS */
  var minuteur = null;
  $('recherche').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { vue.recherche = v; rendre(); }, 170);
  });

  $('etats').addEventListener('click', function (e) {
    var b = e.target.closest('.etat-btn');
    if (!b) return;
    vue.etat = vue.etat === b.dataset.etat ? '' : b.dataset.etat;
    rendre();
  });

  /* Survol d'un lot : le compte et le geste — le clic filtre le tableau, qui
     donne la liste. Pas de références ni de « et N autres » dans la bulle,
     comme pour celle du graphique. Seul le changement d'indice montre ses
     paires « ancienne → nouvelle » : c'est ce qu'il y a à reconnaître, et
     elles sont rares. */
  var MAX_PAIRES_INDICE = 10;
  $('comparatif').addEventListener('mousemove', function (e) {
    var b = e.target.closest('.puce-delta');
    var bulle = $('bulle');
    if (!b || !COMPARATIF) { bulle.dataset.visible = 'false'; return; }
    var lot = LOTS_DELTA.filter(function (l) { return l.cle === b.dataset.delta; })[0];
    var refs = COMPARATIF[b.dataset.delta];
    var paires = '';
    if (b.dataset.delta === 'indice') {
      var lignes = COMPARATIF.reemissions.filter(function (r) { return r.type === b.dataset.delta; })
        .map(function (r) { return ech(r.ancienne) + ' \u2192 ' + ech(r.ref); });
      paires = '\x3Cdiv class="liste-refs">' + lignes.slice(0, MAX_PAIRES_INDICE).join('\x3Cbr>') +
        (lignes.length > MAX_PAIRES_INDICE ? '\x3Cbr>\x3Cspan class="doux">et ' + nb(lignes.length - MAX_PAIRES_INDICE) + ' autres\u2026\x3C/span>' : '') +
        '\x3C/div>';
    }
    bulle.innerHTML = '\x3Cdiv class="tete-bulle">' + nb(refs.length) + ' ' + ech(libelleLot(lot, refs.length)) + '\x3C/div>' +
      paires +
      '\x3Cdiv class="doux"' + (paires ? ' style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)"' : '') + '>' +
      (vue.refsLibelle === b.dataset.delta ? 'Cliquez pour retirer le filtre' : 'Cliquez pour n\u2019afficher que ceux-l\u00e0') +
      '\x3C/div>';
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  $('comparatif').addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  $('comparatif').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-delta');
    if (!b) return;
    var cle = b.dataset.delta;
    if (vue.refsLibelle === cle) { vue.refs = null; vue.refsLibelle = ''; }
    else {
      vue.refs = {};
      COMPARATIF[cle].forEach(function (r) { vue.refs[r] = true; });
      vue.refsLibelle = cle;
    }
    rendre();
  });

  /* Les tuiles du rapprochement : les lots d'ici filtrent le tableau, comme
     les puces du comparatif ; « seulement là » filtre le tableau de là. Le
     détail se déplie à part. */
  $('rapprochement').addEventListener('click', function (e) {
    var pli = e.target.closest('button[data-plier]');
    if (pli && RAPPROCHEMENT) {
      vue.plisRapp[pli.dataset.plier] = !groupeRappOuvert(pli.dataset.plier);
      rendreRapprochement();
      var repli = document.querySelector('#liste-rapprochement button[data-plier="' + pli.dataset.plier + '"]');
      if (repli) repli.focus();
      return;
    }
    var pr = e.target.closest('button[data-plan-rapp]');
    if (pr && RAPPROCHEMENT) {
      /* Comme un clic sur une ligne de la seconde base : le tableau d'ici se
         réduit à ce plan, et le bandeau le dit. */
      montrerCePlan(pr.dataset.planRapp);
      return;
    }
    var la = e.target.closest('button[data-ligne-la]');
    if (la && RAPPROCHEMENT) {
      /* Une ligne que la seconde base est seule à connaître : son tableau,
         cherché sur sa référence. Un lot posé sur les plans d'ici la
         cacherait : il est retiré. Le périmètre reste. */
      if (vue.refsLibelle.indexOf('rapprochement:') === 0) { vue.refs = null; vue.refsLibelle = ''; }
      vue.lotLa = null;
      vue.base = 'la';
      vue.seconde.recherche = la.dataset.ligneLa;
      $('recherche-seconde').value = vue.seconde.recherche;
      rendre();
      allerAuTableau();
      return;
    }
    var b = e.target.closest('button[data-rapp]');
    if (b && RAPPROCHEMENT) {
      poserLotRapp(b.dataset.rapp); rendre();
      /* Les boutons viennent d'être refaits : le focus revient sur le même,
         la bulle et l'éclairage repartent de zéro. */
      $('bulle').dataset.visible = 'false'; eclairerSegment(null);
      var repris = document.querySelector('#verdicts-rapprochement button[data-rapp="' + b.dataset.rapp + '"]');
      if (repris) repris.focus();
      return;
    }
  });

  /* Le tableau de la seconde base : sa recherche, ses deux vues et son tri ne
     touchent qu'à lui ; cliquer une ligne appariée réduit le tableau d'ici
     au plan correspondant, et le bandeau dit d'où vient le filtre. */
  var minuteurSeconde = null;
  $('recherche-seconde').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteurSeconde);
    minuteurSeconde = setTimeout(function () {
      vue.seconde.recherche = v;
      if (RAPPROCHEMENT) { rendreSeconde(); rendreFiltresActifs(); $('reinit').hidden = !filtreActif(); }
    }, 170);
  });
  $('vue-seconde').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vue]');
    if (!b || b.dataset.vue === vue.seconde.vueTable) return;
    vue.seconde.vueTable = b.dataset.vue;
    refleterVue();
    if (RAPPROCHEMENT) rendreSeconde();
  });
  $('tete-seconde').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tri-seconde]');
    if (!b) return;
    var t = vue.seconde.tri;
    if (t.cle === b.dataset.triSeconde) { if (t.asc) t.asc = false; else vue.seconde.tri = { cle: null, asc: true }; }
    else vue.seconde.tri = { cle: b.dataset.triSeconde, asc: true };
    if (RAPPROCHEMENT) rendreSeconde();
  });
  $('corps-seconde').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-plan]');
    if (!tr || !RAPPROCHEMENT) return;
    montrerCePlan(tr.dataset.plan);
  });
  /* Ne montrer que ce plan dans le tableau d'ici : les filtres libres — état,
     groupe, recherche, colonnes — s'effacent, sinon un plan terminé sous le
     filtre « En cours » donnerait un tableau vide malgré la promesse ; le
     périmètre, lui, reste. Puis on descend au tableau, et le focus se pose
     sur le bouton de base, qui survit au rendu. */
  function montrerCePlan(ref) {
    vue.etat = ''; vue.groupe = null; vue.filtres = {}; vue.vides = {};
    vue.recherche = ''; $('recherche').value = '';
    vue.refs = {}; vue.refs[ref] = true; vue.refsLibelle = 'plan ' + ref;
    vue.lotLa = null; vue.base = 'ici';
    rendre();
    allerAuTableau();
  }
  function allerAuTableau() {
    var cadre = $(vue.base === 'la' ? 'cadre-seconde' : 'cadre-tableau');
    defilerVers(cadre, { block: 'nearest', behavior: 'smooth' });
    var bouton = document.querySelector('#choix-base button[data-base="' + vue.base + '"]');
    if (bouton && !bouton.closest('[hidden]')) bouton.focus();
  }
  $('choix-base').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-base]');
    if (!b || b.dataset.base === vue.base) return;
    vue.base = b.dataset.base;
    rendre();
  });
  /* « Les voir dans GATES / SEE » : on change de côté sans toucher aux filtres. */
  $('section-plans').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-aller-base]');
    if (!b || b.dataset.allerBase === vue.base) return;
    vue.base = b.dataset.allerBase;
    rendre();
    var cible = document.querySelector('#choix-base button[data-base="' + vue.base + '"]');
    if (cible) cible.focus();
  });

  /* Survoler un bouton ou un segment du rapprochement éclaire le segment et
     ouvre la bulle ; le focus clavier éclaire seulement. */
  /* Survoler un jalon dans la légende l'éclaire sur le graphique, et fait
     paraître son texte s'il était masqué faute de place. */
  /* Le jalon éclairé passe au-dessus de ses voisins — son texte, révélé,
     ne doit pas se lire sous leurs marqueurs — et reprend sa place ensuite,
     pour que l'ordre du dessin reste celui des jalons. */
  function eclairerJalon(idx, allume) {
    var g = document.querySelector('svg.graphe .jalon[data-jalon="' + idx + '"]');
    if (!g) return;
    if (allume) {
      g.classList.add('survole');
      if (!g.__suivant) { g.__suivant = g.nextSibling; g.parentNode.appendChild(g); }
    } else {
      g.classList.remove('survole');
      if (g.__suivant !== undefined) { g.parentNode.insertBefore(g, g.__suivant); g.__suivant = undefined; }
    }
  }
  ['mouseover', 'focusin'].forEach(function (ev) {
    $('legende-jalons').addEventListener(ev, function (e) {
      var el = e.target.closest('[data-jalon]');
      if (el) eclairerJalon(el.dataset.jalon, true);
    });
  });
  ['mouseout', 'focusout'].forEach(function (ev) {
    $('legende-jalons').addEventListener(ev, function (e) {
      var el = e.target.closest('[data-jalon]');
      if (el) eclairerJalon(el.dataset.jalon, false);
    });
  });

  $('rapprochement').addEventListener('mousemove', function (e) {
    var cible = e.target.closest && e.target.closest('#venn-rapprochement [data-cle], #verdicts-rapprochement button[data-cle]:not([disabled])');
    var cle = cible ? cible.getAttribute('data-cle') : null;
    var bulle = $('bulle');
    eclairerSegment(cle);
    if (!cle || !RAPPROCHEMENT) { bulle.dataset.visible = 'false'; return; }
    bulle.innerHTML = bulleLotRapp(cle);
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  $('rapprochement').addEventListener('mouseleave', function () {
    eclairerSegment(null);
    $('bulle').dataset.visible = 'false';
  });
  $('verdicts-rapprochement').addEventListener('focusin', function (e) {
    var b = e.target.closest && e.target.closest('button[data-cle]');
    eclairerSegment(b ? b.dataset.cle : null);
  });
  $('verdicts-rapprochement').addEventListener('focusout', function () { eclairerSegment(null); });

  $('incomplets').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-vide');
    if (!b) return;
    var k = b.dataset.vide;
    if (vue.vides[k]) delete vue.vides[k]; else vue.vides[k] = true;
    rendre();
  });

  $('dim-critique').addEventListener('change', function (e) {
    /* Une autre dimension, d'autres noms : le filtre de la colonne de gauche
       n'aurait plus de sens, il repart à blanc. */
    vue.dimCritique = e.target.value; vue.groupe = null;
    vue.filtreGroupe = ''; $('filtre-groupe').value = '';
    rendre();
  });
  /* Le filtre de la colonne de gauche : il ne redessine que le bloc. Échap
     le vide ; le type « search » du champ fait de même par sa croix. */
  var minuteurGroupe = null;
  function poserFiltreGroupe(v) {
    clearTimeout(minuteurGroupe);
    if (v === vue.filtreGroupe) return;
    vue.filtreGroupe = v;
    rendreCritique(selection());
  }
  $('filtre-groupe').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteurGroupe);
    minuteurGroupe = setTimeout(function () { poserFiltreGroupe(v); }, 170);
  });
  $('filtre-groupe').addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    e.preventDefault();
    e.target.value = '';
    poserFiltreGroupe('');
  });
  $('zone-critique').addEventListener('click', function (e) {
    /* Un en-tete de colonne : premier clic dans le sens naturel, deuxieme dans
       l'autre, troisieme retour au classement par defaut. */
    var t = e.target.closest('button[data-trig]');
    if (t) {
      var cle = t.dataset.trig, naturel = (cle === 'nom');
      if (vue.triGroupe.cle !== cle) vue.triGroupe = { cle: cle, asc: naturel };
      else if (vue.triGroupe.asc === naturel) vue.triGroupe = { cle: cle, asc: !naturel };
      else vue.triGroupe = { cle: null, asc: false };
      planifierSauvegarde();
      rendreCritique(selection());
      var repris = document.querySelector('button[data-trig="' + cle + '"]');
      if (repris) repris.focus();
      return;
    }
    var boutonAide = e.target.closest('button[data-aide]');
    if (boutonAide) {
      vue.aideFin = !vue.aideFin;
      rendreCritique(selection());
      var repris = document.querySelector('button[data-aide]');
      if (repris) repris.focus();
      return;
    }
    var ud = e.target.closest('button[data-ud]');
    if (ud) {
      /* Une référence choisie dans la liste : le tableau se réduit à elle et
         on y descend, plutôt que de la chercher à la main. */
      vue.refs = {}; vue.refs[ud.dataset.ud] = true;
      vue.refsLibelle = 'plan ' + ud.dataset.ud;
      rendre();
      var cadre = $('cadre-tableau');
      defilerVers(cadre, { behavior: 'smooth', block: 'center' });
      return;
    }
    var b = e.target.closest('.critique-ligne');
    if (!b) return;
    var meme = vue.groupe && vue.groupe.dim === vue.dimCritique && vue.groupe.val === b.dataset.groupe;
    vue.groupe = meme ? null : { dim: vue.dimCritique, val: b.dataset.groupe };
    rendre();
  });

  $('zone-journal').addEventListener('click', function (e) {
    var tout = e.target.closest('button[data-tout]');
    if (tout) {
      vue.journalOuverts['tout' + tout.dataset.tout] = true;
      rendreJournal();
      return;
    }
    var passage = e.target.closest('button[data-passage]');
    if (passage) {
      var cible = passage.dataset.passage;
      vue.journal = (vue.journal === cible) ? '' : cible;
      document.querySelectorAll('#filtre-journal button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.dataset.journal === vue.journal));
      });
      rendreJournal();
      return;
    }
    var tete = e.target.closest('button[data-semaine]');
    if (tete) {
      var i = tete.dataset.semaine;
      var ouvert = tete.getAttribute('aria-expanded') === 'true';
      vue.journalOuverts[i] = !ouvert;
      rendreJournal();
      return;
    }
    var ligne = e.target.closest('button[data-ref]');
    if (ligne) {
      /* Cliquer un plan du journal, c'est demander « lequel, exactement ? » :
         le tableau se réduit à lui, et le bandeau dit d'où vient le filtre. */
      /* Une référence d'une semaine passée peut avoir changé d'indice depuis :
         c'est le plan d'aujourd'hui, sous sa référence courante, qu'on montre. */
      var plan = planDeRef(ligne.dataset.ref);
      var ref = plan ? plan.reference : ligne.dataset.ref;
      var meme = vue.refs && Object.keys(vue.refs).length === 1 && vue.refs[ref];
      if (meme) { vue.refs = null; vue.refsLibelle = ''; }
      else {
        vue.refs = {}; vue.refs[ref] = true;
        vue.refsLibelle = 'plan ' + ref;
      }
      rendre();
      var cadre = $('cadre-tableau');
      if (!meme) defilerVers(cadre, { behavior: 'smooth', block: 'center' });
      return;
    }
  });

  document.querySelector('#filtre-journal').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-journal]');
    if (!b) return;
    vue.journal = b.dataset.journal;
    document.querySelectorAll('#filtre-journal button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    rendreJournal();
  });

  $('filtres-actifs').addEventListener('click', function (e) {
    if (e.target.closest('#tout-effacer')) { toutEffacer(); rendre(); return; }
    var x = e.target.closest('button[data-retirer]');
    if (x) { retirerFiltre(x.dataset.retirer); rendre(); }
  });

  document.querySelector('#vue-tableau').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-vue]');
    if (!b || b.dataset.vue === vue.vueTable) return;
    vue.vueTable = b.dataset.vue;
    appliquerVueTable();
    refleterVue();
    rendre();
  });

  var tete = $('tete-tableau');
  tete.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tri]');
    if (!b) return;
    if (vue.tri.cle === b.dataset.tri) vue.tri.asc = !vue.tri.asc;
    else vue.tri = { cle: b.dataset.tri, asc: true };
    rendreEntetes(); rendreCorps(selection());
    planifierSauvegarde();                  // le tri est une disposition : il survit à l'onglet
  });
  var minuteurFiltre = null;
  tete.addEventListener('input', function (e) {
    var c = e.target.closest('input[data-filtre]');
    if (!c) return;
    var cle = c.dataset.filtre, val = c.value;
    c.dataset.actif = String(!!val);
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(function () {
      if (val) vue.filtres[cle] = val; else delete vue.filtres[cle];
      var liste = selection();
      rendreAvancement(liste); rendreGraphique(liste); rendreCritique(liste); rendreCorps(liste);
      rendreFiltresActifs();                // le jeton « ATA : 21 » et sa croix
      $('reinit').hidden = !filtreActif();
    }, 170);
  });

  /* L ordre cible est calcule APRES le retrait de la colonne source,
     sinon l insertion se decale d un cran. */
  function reordonner(liste, source, cible) {
    var de = liste.indexOf(source), vers = liste.indexOf(cible);
    if (de === -1 || vers === -1 || de === vers) return liste;
    var copie = liste.slice();
    var col = copie.splice(de, 1)[0];
    var pos = copie.indexOf(cible);
    copie.splice(de < vers ? pos + 1 : pos, 0, col);
    return copie;
  }
  var cleGlissee = null;
  tete.addEventListener('dragstart', function (e) {
    var th = e.target.closest('th[draggable]');
    if (!th) return;
    cleGlissee = th.dataset.cle;
    th.classList.add('glisse');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cleGlissee);
  });
  tete.addEventListener('dragover', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee || th.dataset.cle === cleGlissee) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; th.classList.add('cible');
  });
  tete.addEventListener('dragleave', function (e) {
    var th = e.target.closest('tr.titres th');
    if (th) th.classList.remove('cible');
  });
  tete.addEventListener('drop', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee) return;
    e.preventDefault(); th.classList.remove('cible');
    vue.ordre = reordonner(vue.ordre, cleGlissee, th.dataset.cle);
    cleGlissee = null;
    rendreEntetes(); rendreCorps(selection());
    planifierSauvegarde();                  // l'ordre des colonnes aussi
  });
  tete.addEventListener('dragend', function () {
    cleGlissee = null;
    tete.querySelectorAll('.glisse, .cible').forEach(function (el) { el.classList.remove('glisse', 'cible'); });
  });

  $('reinit').addEventListener('click', function () { toutEffacer(); rendre(); });
  $('defile').addEventListener('scroll', majOmbre, { passive: true });
  document.addEventListener('keydown', function (e) {
    var champ = vue.base === 'la' ? $('recherche-seconde') : $('recherche');
    if (e.key === '/' && document.activeElement !== champ) {
      e.preventDefault(); champ.focus(); champ.select();
    }
  });
  var minuteurTaille = null;
  window.addEventListener('resize', function () {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(function () {
      rendreGraphique(selection()); ajusterSticky(); majOmbre();
      alignerSousBarre('barre', 'filets', 'etats');
    }, 160);
  });

  /* Une page de consultation reste ouverte des jours durant : la semaine se
     reprend au retour sur l'onglet et une fois par heure, et quand elle a
     changé, la page entière se redessine — sinon le titre dirait lundi et
     la courbe vendredi. */
  function reprendreLaSemaine() {
    if (!BASE) return;
    var avant = SEMAINE_AFFICHEE;
    afficherSemaine();
    if (avant !== null && SEMAINE_AFFICHEE !== avant) rendre();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) reprendreLaSemaine(); });
  setInterval(reprendreLaSemaine, 3600000);

  /* Exposés pour la batterie : recharger une source arbitraire — par exemple
     un jeu sans liste de contrats — sans passer par l'interface. */
  window.__jeuDExemple = jeuDExemple;
  window.__chargerSource = function (src) { chargerSource(src); remplirDims(); rendre(); };
  /* Et lire ce que la page a déduit : le journal et le comparatif, tels
     quels, pour vérifier l'appariement sans passer par le rendu. */

  window.__etiquetteISO = function (d) { return etiquetteISO(d); };
  window.__phraseLot = function (cle, n) { return phraseLot(cle, n, nomSeconde()); };
  window.__reprendreLaSemaine = function () { reprendreLaSemaine(); };
  window.__semaineDuTitre = function () {
    return { num: $('num-semaine').textContent, dates: $('dates-semaine').textContent,
             releve: $('releve-semaine').textContent, cache: $('releve-semaine').hidden,
             iAuj: semaineDAujourdhui(), auj: AUJ, etiquetteAuj: etiquette(AUJ) };
  };
  window.__journal = function () { return JOURNAL; };
  window.__comparatif = function () { return COMPARATIF; };
  /* Le rapprochement tel qu'il est calculé, sur le périmètre courant. */
  window.__rapprochement = function () { return RAPPROCHEMENT; };
  /* Et le tableau de là tel qu'il est affiché : ses colonnes et ses lignes. */
  window.__secondeAffichee = function () {
    return SECONDE && RAPPROCHEMENT ? { titres: SECONDE.titres, essentielles: SECONDE.essentielles,
      lignes: lignesSecondeAffichees().map(function (e) { return { i: e.i, ref: e.ref, cat: e.cat }; }) } : null;
  };
  /* Sous un périmètre : le journal tel qu'il est affiché, la série tracée et
     le domaine du plan derrière une référence — pour vérifier la dérivation. */
  window.__journalAffiche = function () { return journalAffiche(); };
  window.__serieAffichee = function () { return serieAffichee(); };
  window.__domaineDe = function (ref) { var p = planDeRef(ref); return p ? domaineDe(p) : null; };
  /* L'échéance courante — le jalon qui pilote l'effort demandé sous le
     périmètre choisi. */
  window.__prochainJalon = function () {
    var j = prochainJalon();
    return j ? { texte: j.texte, semaine: etiquette(j.i), perimetre: j.perimetre } : null;
  };

  chargerSource(SERVEUR ? sourceDuClasseur(window.SUIVI_FWD_DONNEES) : jeuDExemple());
  chargerPrefs();
  remplirDims();
  rendre();
  /* Quand le classeur n'a encore rien donné, la page s'ouvre sur la
     démonstration plutôt que vide : on voit ce qu'elle sera, et l'alerte dit
     ce qui manque. */
  if (SERVEUR && !PLANS.length) basculerExemple(true);
})();
</script>
