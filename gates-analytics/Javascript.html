       deux semaines d'écart, n'en trouvait plus et se posait par-dessus —
       et le fond plein de « fin … », toujours tracé, cachait « manque 1 ».
       On essaie donc chaque paire de places : la gêne de l'une, celle de
       l'autre, et un chevauchement entre elles compté comme avec tout autre
       mot ; on garde la paire qui gêne le moins (à égalité, la première
       essayée). Si un chevauchement reste malgré tout, « manque N » — le
       chiffre du retard — se dessine après le fond de « fin … », au-dessus :
       il n'est jamais caché. */
    var cFin = null, cMq = null;
    if (candFin && candMq) {
      var lesFins = noterMots(candFin, L - 2), lesManques = noterMots(candMq, L - mD), paire = null;
      lesFins.forEach(function (f) {
        lesManques.forEach(function (m) {
          var t = f.gene + m.gene + (seCoupent(f.boite, m.boite) ? 20 : 0);
          if (!paire || t < paire.t) paire = { t: t, f: f, m: m };
        });
      });
      cFin = paire.f; cMq = paire.m;
      if (seCoupent(cFin.boite, cMq.boite)) cMq.gene += 20;      // son fond plein, alors, par-dessus
      boites.push(cFin.boite, cMq.boite);
    } else if (candFin) cFin = placerMot(candFin, L - 2);
    else if (candMq) cMq = placerMot(candMq, L - mD);
    if (cFin) {
      horsClip.push(fondMot(cFin));
      horsClip.push(texteMot(cFin, { cls: 'fin-mot' }));
    }
    if (cMq) {
      if (cMq.gene >= 10) horsClip.push(fondMot(cMq));
      horsClip.push(texteMot(cMq, { cls: 'manque-jalon',
        plus: ' fill="var(--alerte)" font-weight="500" stroke="var(--surface)" stroke-width="4" stroke-linejoin="round" paint-order="stroke"',
        titre: '\x3Ctitle>Au rythme tenu, il manquerait ' + nb(bilan.manque) + ' plan' + (bilan.manque > 1 ? 's' : '') + ' le jour de l’échéance\x3C/title>' }));
    }
    s.push('\x3C/g>');

    if (AUJ >= d0 && AUJ <= d1) {
      s.push('\x3Cline x1="' + x(AUJ).toFixed(1) + '" x2="' + x(AUJ).toFixed(1) + '" y1="' + (mHaut - 6) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--encre-3)" stroke-width="1"/>');
      var plAuj = places.filter(function (q) { return q.aujourdhui; })[0];
      var yAuj = mHaut - 13 - (plAuj ? plAuj.niveau : 0) * HAUTEUR_ETIQUETTE;
      /* Le trait marque le dernier relevé. Il ne s'appelle « aujourd'hui »
         que si ce relevé est de cette semaine — sinon la page dirait deux
         « aujourd'hui » différents, l'un au titre, l'autre sur la courbe. */
      s.push('\x3Ctext class="grad repere-auj" x="' + (aujADroite ? x(AUJ) + 6 : x(AUJ) - 6).toFixed(1) + '" y="' + yAuj.toFixed(1) + '" text-anchor="' + (aujADroite ? 'start' : 'end') + '">' +
             motAuj + '\x3C/text>');
      /* Sous une valeur, le point n'est celui du jour que si la courbe
         finit bien au dernier relevé ; et quand elle y descend, son nombre
         s'écrit dessous, pas en travers du trait. De même tout en haut
         (100 %) : au-dessus du point, il sortait du tracé et s'écrivait sur
         « dernier relevé ». */
      var auPoint = vVal ? dernierT.termine : atteint;
      if (!vVal || dernierT.i === AUJ) {
        var dessous = (!!vVal && trace.length > 1 && trace[trace.length - 2].termine > auPoint) || y(auPoint) < mHaut + 12;
        s.push('\x3Ccircle cx="' + x(AUJ).toFixed(1) + '" cy="' + y(auPoint).toFixed(1) + '" r="4.5" fill="' + coul + '" stroke="var(--surface)" stroke-width="2"/>');
        s.push('\x3Ctext class="grad nombre-point" x="' + (x(AUJ) - 9).toFixed(1) + '" y="' + (dessous ? y(auPoint) + 16 : y(auPoint) - 8).toFixed(1) + '" text-anchor="end" fill="var(--encre)" font-weight="500"' +
               ' stroke="var(--surface)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">' + auPoint + '\x3C/text>');
      }
    }

    /* Jalons : un trait, un triangle, une étiquette. Rien à saisir ni à
       déplacer — ils viennent de la configuration, l'outil ne fait que les
       montrer. Le survol de la semaine dessous passe par la bande cliquable,
       comme partout ailleurs sur le graphique. */
    places.forEach(function (pl) {
      if (pl.aujourdhui) return;
      var j = pl.j, idx = pl.idx, jx = pl.jx;
      /* Un jalon ne se peint en rouge que s'il fait l'échéance ici : la même
         semaine que l'échéance, mais d'un autre périmètre, il reste en
         retrait. Deux jalons de la même semaine qui comptent tous deux sont
         rouges tous deux — l'un est aussi manqué que l'autre. */
      var hors = !jalonDansPerimetre(j);
      var critique = prochain && j.i === prochain.i && !hors && enRetard;
      var couleur = critique ? 'var(--alerte)' : 'var(--encre-2)';
      var mention = (j.perimetre ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) : '') +
        (hors ? ' \u2014 ' + ech(raisonRetrait(j)) + ', ne compte pas ici' : '');
      var yBase = mHaut - 8;          // haut du trait pointillé
      var yMarque = yBase - 9;        // centre du numéro
      var cx = pl.cx;

      s.push('\x3Cg class="jalon' + (hors ? ' hors-perimetre' : '') + (critique ? ' critique' : '') + '" data-jalon="' + idx + '" data-i="' + j.i + '" role="img" aria-label="Jalon ' + (idx + 1) + ', ' +
             ech(j.texte) + ', ' + semaineDite(j.i) + mention + '">');
      s.push('\x3Ctitle>' + (idx + 1) + ' \u2014 ' + ech(j.texte) + ' \u2014 ' + semaineDite(j.i) + mention + '\x3C/title>');
      s.push('\x3Cline x1="' + jx.toFixed(1) + '" x2="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" y2="' + basTotal.toFixed(1) +
             '" stroke="' + couleur + '" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>');
      if (Math.abs(cx - jx) > 0.5) {
        s.push('\x3Cline class="jalon-lien" x1="' + jx.toFixed(1) + '" y1="' + yBase.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + (yMarque + 10).toFixed(1) +
               '" stroke="' + couleur + '" stroke-width="1"/>');
      }
      s.push('\x3Ccircle class="jalon-marque" cx="' + cx.toFixed(1) + '" cy="' + yMarque.toFixed(1) + '" r="10" fill="' + couleur + '"/>');
      s.push('\x3Ctext class="jalon-num" x="' + cx.toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="middle">' + (idx + 1) + '\x3C/text>');
      /* Le nom ne s'écrit pas sur le dessin — la légende le porte. Il reste
         dans le groupe pour les lecteurs d'écran, et paraît sous la rangée

      var demiLargeur = ech(j.texte).length * 3.2;
      var xTexte = Math.max(mG + demiLargeur, Math.min(cx, L - mD + 30 - demiLargeur));
      s.push('\x3Ctext class="jalon-texte masque" x="' + xTexte.toFixed(1) + '" y="' + (yMarque + 4).toFixed(1) + '" text-anchor="middle" fill="' + couleur + '">' + ech(j.texte) + '\x3C/text>');
      s.push('\x3C/g>');
    });

    if (!prochain && d1 > AUJ + 2) {

      /* Sur un cadre étroit, la phrase reste entière dans le tracé. */
      var demiAucun = largeurMot(motAucun) / 2;
      xv = Math.max(Math.min(xv, L - mD - demiAucun), Math.min(mG + demiAucun, mG + LARGEUR / 2));
      s.push('\x3Ctext class="grad" x="' + xv.toFixed(1) + '" y="' + (mHaut + plotH * 0.86).toFixed(1) +
             '" text-anchor="middle">' + motAucun + '\x3C/text>');
    }

    // Rythme hebdomadaire
    /* Une barre par semaine, pas par relevé : quand deux relevés sont séparés
       de trois semaines, le gain est réparti sur les trois. Les hauteurs
       restent comparables quelle que soit la cadence des imports. */
    var taux = [];
    for (var k5 = 1; k5 < trace.length; k5++) {
      var dSem = trace[k5].i - trace[k5 - 1].i;
      if (dSem <= 0) continue;

    /* Une valeur peut aussi se vider (« À traiter » baisse quand le travail
       avance) : sa bande est alors à deux sens, le gain au-dessus d'un trait
       médian, la perte dessous. Les validés ne font que monter. */
    var deuxSens = !!vVal && taux.some(function (t) { return t.v < 0; });
    var maxSem = 1;
    taux.forEach(function (t) { maxSem = Math.max(maxSem, deuxSens ? Math.abs(t.v) : t.v); });
    var lb = Math.min(14, Math.max(2, pasX - 2));
    var hMax = deuxSens ? bandeH / 2 : bandeH, yZero = yBande + (deuxSens ? bandeH / 2 : bandeH);
    /* Le nom de la bande, à gauche ; sur un cadre étroit, le trait du
       dernier relevé le barrerait : il passe alors à sa droite, ou s'écrit

       juste avant le trait, et sur un fond plein en dernier recours. */
    var motBande = vVal ? ech('« ' + vVal.libelle + ' » : variation nette par semaine') : 'validés par semaine';
    var motCourt = vVal ? ech('« ' + vVal.libelle + ' » par sem.') : 'validés/sem.';
    var candBande = [{ lignes: [motBande], x: mG, base: yBande - 3, ancre: 'start' }];

    candBande.push({ lignes: [motCourt], x: mG, base: yBande - 3, ancre: 'start', malus: 3, court: true });
    if (xAuj !== null) candBande.push({ lignes: [motCourt], x: xAuj - 6, base: yBande - 3, ancre: 'end', malus: 3, court: true });
    /* À gauche, il peut mordre sur la marge jusqu'aux nombres de

    if (cBande.gene >= 10) s.push(fondMot(cBande));
    /* En court, le nom entier reste au survol. */
    s.push(texteMot(cBande, cBande.court ? { titre: '\x3Ctitle>' + motBande + '\x3C/title>' } : {}));
    if (deuxSens) {
      s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + yZero.toFixed(1) + '" y2="' + yZero.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');
    }

      if (t.i < d0 || t.i > d1 || !t.v || (!deuxSens && t.v < 0)) return;

      var rx = Math.min(2, lb / 2, h / 2);

      s.push('\x3Cpath class="barre-semaine' + (monte ? '' : ' perte') + '" d="M' + xg.toFixed(1) + ' ' + yb.toFixed(1) + ' V' + (yh + sens * rx).toFixed(1) +
             ' Q' + xg.toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + rx).toFixed(1) + ' ' + yh.toFixed(1) +
             ' H' + (xg + lb - rx).toFixed(1) + ' Q' + (xg + lb).toFixed(1) + ' ' + yh.toFixed(1) + ' ' + (xg + lb).toFixed(1) + ' ' + (yh + sens * rx).toFixed(1) +

    });
    s.push('\x3Cline x1="' + mG + '" x2="' + (L - mD) + '" y1="' + basTotal.toFixed(1) + '" y2="' + basTotal.toFixed(1) + '" stroke="var(--filet)" stroke-width="1"/>');

    // Graduations : espacees pour tenir une dizaine d etiquettes quel que soit le zoom
    /* Une dizaine sur un grand écran, moins sur un cadre étroit : une
       graduation toutes les 60 px au plus serré, pour que « S38 » et
       l'année dessous ne se touchent jamais. */
    var saut = Math.max(1, Math.ceil(span / Math.max(2, Math.min(11, Math.floor(LARGEUR / 60)))));
    var anneeEcrite = '';
    for (var k3 = d0; k3 <= d1; k3++) {
      if ((k3 - d0) % saut !== 0 && k3 !== AUJ) continue;
      // La semaine d'aujourd'hui s'écrit toujours ; une graduation régulière trop proche lui cède la place.
      if (k3 !== AUJ && Math.abs(k3 - AUJ) * pasX < 34) continue;
      var lib = etiquette(k3);
      var annee = lib.slice(0, 4), semaine = 'S' + numeroSemaine(k3);
      s.push('\x3Ctext class="grad" x="' + x(k3).toFixed(1) + '" y="' + (H - 19) + '" text-anchor="middle"' + (k3 > AUJ ? ' opacity=".7"' : '') + '>' +
             semaine + '\x3C/text>');
      /* L'année n'encombre pas chaque graduation : une fois, puis à chaque
         changement. */
      if (annee !== anneeEcrite) {
        /* Débrief 27 : l'année passe de 10 à 11 px (jamais moins de 11 px
           rendus) ; un pixel plus bas, elle ne touche pas la semaine. */
        s.push('\x3Ctext class="annee" x="' + x(k3).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + annee + '\x3C/text>');
        anneeEcrite = annee;
      }
    }

    /* Les mots posés sur la courbe — « fin S9 · mars 2027 », « manque 180 »,
       le départ des projections — passent après les traits des jalons :
       leur liseré les garde lisibles au lieu d'être barrés par un
       pointillé. */
    horsClip.forEach(function (t) { s.push(t); });

    /* Le point d'une semaine se cherche par son indice, pas par sa position
       dans la série : une semaine sans relevé n'a pas de point. */
    var ptParI = {};
    trace.forEach(function (pt) { ptParI[pt.i] = pt; });
    for (var k4 = d0; k4 <= d1; k4++) {
      var ptK = ptParI[k4];
      /* Une bande par semaine : elle porte le survol (bulle) et son libellé
         pour les lecteurs d'écran. Ni bouton ni focus : rien ne se pose sur
         le graphique, et un clic n'y dessine plus de contour. */
      s.push('\x3Crect class="zone-clic" x="' + (x(k4) - pasX / 2).toFixed(1) + '" y="' + (mHaut - 6) + '" width="' + pasX.toFixed(1) +
             '" height="' + (plotH + ecart + bandeH + 6).toFixed(1) + '" fill="transparent" role="img" data-i="' + k4 + '" ' +
             'aria-label="' + semaineDite(k4) +
             (ptK ? ' : ' + ptK.termine + (vVal ? ech(' « ' + vVal.libelle + ' »') : ' validés') : k4 > depart ? ' (à venir)'
               : RELEVES.some(function (r) { return r.i === k4; }) ? ' : relevé sans détail plan par plan, hors de cette courbe' : ' : pas de relevé') + '"/>');
    }

    s.push('\x3C/svg>');
    $('zone-graphe').innerHTML = s.join('');

    var items = ['\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' + coul + '" stroke-width="2.2"' +
      (vVal && vVal.hachure ? ' stroke-dasharray="6 4"' : '') + '/>\x3C/svg>' +
      (vVal ? '\x3Cspan title="' + ech('Plans « ' + vVal.libelle + ' », relevé après relevé. Le rythme, la fin estimée et l’échéance se lisent sur les validés.') + '">' +
                ech('« ' + vVal.libelle + ' », relevé après relevé') + '\x3C/span>\x3C/span>'
            : '\x3Cspan title="Plans validés, relevé après relevé.">r\u00e9alis\u00e9\x3C/span>\x3C/span>')];
    /* Les mêmes mots que la fiche et le bloc par groupe : « rythme tenu »,
       « fin », « requis » — et les mêmes nombres, tirés de bilanEcheance. */
    /* Rien de validé depuis le premier relevé : pas de projection tracée,
       donc pas de trait pointillé en légende (débrief 20 : « au rythme tenu
       (0,0/sem.) » renvoyait à une droite absente). Les mots du bloc par
       groupe, sans pastille. */
    if (ryt && restants > 0 && !vVal && projIdx === null) {
      items.push('\x3Cspan class="legende-item sans-rythme">\x3Cspan title="Aucun plan validé depuis le premier relevé : pas de rythme, donc pas de date d\u2019arrivée.">' +
        'rien de validé depuis le premier relevé\x3C/span>\x3C/span>');
    }
    if (ryt && restants > 0 && !vVal && projIdx !== null) {
      /* Accordé : avec deux relevés, « 7 plans validés en 1 semaine » (il
         disait « 1 semaines », débrief 17). */
      var dansSem = projIdx - depart;
      var explication = nb(ryt.gagnes) + (ryt.gagnes > 1 ? ' plans validés' : ' plan validé') + ' en ' + ryt.semaines +
        (ryt.semaines > 1 ? ' semaines' : ' semaine') + ', du premier au dernier relevé : ' +
        virgule(vitesse) + ' par semaine. ' +
        'À ce rythme, ' + (restants > 1 ? 'les ' + nb(restants) + ' restants demandent ' : 'le dernier demande ') +
        dansSem + (dansSem > 1 ? ' semaines' : ' semaine') + ' : fin ' + semaineDite(projIdx) + '.';
      items.push('\x3Cspan class="legende-item">\x3Csvg width="22" height="8" aria-hidden="true">' +
        '\x3Cline x1="0" y1="4" x2="22" y2="4" stroke="var(--fait)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".65"/>\x3C/svg>' +
        /* Le rythme seul (débrief 19 : « la flèche et fin juillet 2032, on
           s'en fout ») : la fin estimée reste dans le survol et sur la courbe. */
        '\x3Cspan title="' + ech(explication) + '">au rythme tenu (' + virgule(vitesse) + '/sem.)\x3C/span>\x3C/span>');
    }
    if (requis !== null && !vVal) {
      var dom = bilan.domaine && bilan.domaine !== vue.perimetre ? bilan.domaine : '';
      var d = dateEcheance(prochain);
      /* La portée du nombre, dite quand ce n'est pas celle de la fiche : le
         groupe choisi dans le bloc. */
      var gA = groupeAffiche();
      var porteeG = gA ? nomGroupe(gA) : '';
      items.push('\x3Cspan class="legende-item">\x3Csvg width="20" height="8" aria-hidden="true">\x3Cline x1="0" y1="4" x2="20" y2="4" stroke="' +
        (enRetard ? 'var(--alerte)' : 'var(--fait)') + '" stroke-width="1.6"/>\x3C/svg>' +
        '\x3Cspan title="' + ech(nb(bilan.restants) + (bilan.restants > 1 ? ' plans' : ' plan') + ' à valider' + (dom ? ' dans ' + dom : '') +
          ' en ' + bilan.semaines + (bilan.semaines > 1 ? ' semaines' : ' semaine') + ', d\u2019ici le ' + JOURS_SEMAINE[d.getUTCDay()] + ' ' +
          d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] + ' : ' + virgule(requis) + ' par semaine. En rouge quand le rythme tenu ne suffit pas.') + '">' +
        /* Sans le nombre (débrief 19) : il est dans le survol, dans la fiche de
           l'échéance et dans le bloc par groupe. */
        'requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb' + (porteeG ? ' (' + ech(porteeG) + ')' : '') +
        (dom ? ' sur ses plans ' + ech(dom) : '') + '\x3C/span>' +
        (!surLaCourbe && dom ? '\x3Cbutton type="button" class="lien-doux" data-voir-perimetre="' + ech(dom) + '">voir ' + ech(dom) + '\x3C/button>' : '') +
        '\x3C/span>');
    }
    $('legende').innerHTML = items.join('');
    /* La légende des jalons : chaque numéro en clair, son nom, et dessous sa
       semaine telle que la page la dit partout — « S51 · déc. 2026 ». Rien
       d'autre (débrief 13) : le périmètre, l'avancement suivi, le décompte
       en jours et la raison d'un retrait passent dans le survol et dans la
       fiche. En retrait hors périmètre, en rouge s'il est l'échéance
       manquée. Survoler un jalon ici l'éclaire sur le graphique. */
    $('legende-jalons').innerHTML = jalons.length ? '\x3Cspan class="legende-jalons-mot">Jalons\x3C/span>\x3Cdiv class="legende-jalons-grille" title="Cliquez un jalon pour le détail de son échéance">' + jalons.map(function (j, idx) {
      var hors = !jalonDansPerimetre(j), rouge = prochain && j.i === prochain.i && !hors && enRetard;
      var nj = joursAvant(j);
      var horsFenetre = j.i < d0 || j.i > d1;   // dans la légende, mais pas dans la fenêtre affichée
      return '\x3Cspan class="legende-jalon' + (hors ? ' hors-perimetre' : '') + (rouge ? ' critique' : '') + (horsFenetre ? ' hors-fenetre' : '') +
        '" data-jalon="' + idx + '" data-semaine="' + etiquette(j.i) + '"' + (j.date ? ' data-date="' + ech(j.date) + '"' : '') +
        ' tabindex="0" role="button" aria-expanded="' + (vue.echeance === idx) + '" title="' +
        ech(j.texte) + ' \u2014 ' + semaineDite(j.i) + ', ' + ech(motJours(nj)) + (j.perimetre ? ' \u00b7 p\u00e9rim\u00e8tre ' + ech(j.perimetre) : '') +
        (hors ? ' \u2014 ' + ech(raisonRetrait(j)) : '') + (horsFenetre ? ' \u2014 hors de la fen\u00eatre affich\u00e9e' : '') + '">' +
        /* Le nom et la semaine, rien d'autre : le périmètre, l'avancement
           suivi et le décompte en jours sont dans la bulle et dans la
           fiche ; le graphique dit le reste. */
        '\x3Cb class="num">' + (idx + 1) + '\x3C/b>\x3Cspan class="mot">' + ech(j.texte) + '\x3C/span>' +
        '\x3Cspan class="quand">' + semaineDite(j.i) + '\x3C/span>\x3C/span>';
    }).join('') + '\x3C/div>' + (vue.echeance !== null && jalons[vue.echeance] ? ficheEcheance(vue.echeance) : '') : '';

    /* Dessiné avant l'arrivée des polices, les mots ont été placés avec
       de la marge : une fois les polices là, le graphique se redessine au
       plus juste. Une seule fois — une police qui ne vient pas ne relance
       pas le dessin sans fin. */
    if (policeAttendue && !redessinPolices && document.fonts && document.fonts.ready) {
      redessinPolices = true;
      document.fonts.ready.then(function () { rendreGraphique(selection()); });
    }

    derniereAnalyse = { pts: pts, total: total, atteint: atteint, restants: restants, vitesse: vitesse,
                        projIdx: projIdx, trace: trace, valeur: vVal,
                        prochain: prochain, requis: requis, enRetard: enRetard, span: span, d0: d0 };
    majBoutonsZoom();
    planifierSauvegarde();
  }

  /* « Tout » n'a pas de largeur fixe : il est pressé quand la fenêtre est
     exactement celle qu'il donnerait, et qu'aucun préréglage fixe ne l'est. */
  /* Un seul bouton pressé : « Échéances » si la fenêtre est exactement la
     sienne, sinon la durée qui a cette largeur, sinon « Tout » s'il la
     donnerait. « Échéances » s'efface quand il n'y a plus de jalon à venir. */
  function majBoutonsZoom() {
    var boutons = [].slice.call(document.querySelectorAll('.commandes-graphe .segmente button'));
    var ech = cadrageEcheances();
    var surEch = !!ech && ech.debut === vue.fen.debut && ech.span === vue.fen.span;
    var fixe = !surEch && boutons.some(function (b) { return Number(b.dataset.span) > 0 && Number(b.dataset.span) === vue.fen.span; });
    boutons.forEach(function (b) {
      var d = b.dataset.span, v = Number(d), presse;
      if (d === 'jalons') {
        /* Débrief 27 (lot H, P-F12) : sans échéance à venir, le bouton reste
           à sa place, grisé, et dit pourquoi (au clic, au toucher, au
           clavier) — il disparaissait sans un mot. */
        if (!b.hasAttribute('data-titre')) b.setAttribute('data-titre', b.title);
        if (ech) { b.removeAttribute('aria-disabled'); b.title = b.getAttribute('data-titre'); }
        else {
          b.setAttribute('aria-disabled', 'true');
          b.title = jalons.length ? 'Plus d\u2019échéance à venir pour ' + (nomAffiche(CONTRAT) || 'ce contrat') + ' : ses jalons sont passés.'
            : 'Aucun jalon pour ' + (nomAffiche(CONTRAT) || 'ce contrat') + ' : pas d\u2019échéance à montrer.';
        }
        presse = surEch;
      }
      else if (v) presse = !surEch && v === vue.fen.span;
      else presse = !surEch && !fixe && vue.fen.span === spanTout();
      b.setAttribute('aria-pressed', String(presse));
    });
  }

  function spanTout() {
    var a = derniereAnalyse;
    var maxJalon = jalons.reduce(function (m, j) { return Math.max(m, j.i); }, AUJ);
    var maxProj = a && a.projIdx !== null ? a.projIdx : AUJ;
    return Math.min(MAX_IDX + 1, Math.max(maxJalon, maxProj, AUJ) + 3);
  }

  function reglerSpan(span) {
    vue.fenAuto = false;
    vue.fen = span === 'jalons' ? (cadrageEcheances() || cadrageSur(SPAN_OUVERTURE))
            : span ? cadrageSur(span) : { debut: 0, span: spanTout() };
    rendreGraphique(selection());
  }

  /* ---- Index de semaine sous le curseur ---- */
  function indexSousCurseur(clientX) {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return null;
    var r = svg.getBoundingClientRect();
    if (!r.width) return null;
    var xv = (clientX - r.left) * (L / r.width);
    return Math.round(vue.fen.debut + (xv - mG) / (LARGEUR / (vue.fen.span - 1)));
  }
  function pxParSemaine() {
    var svg = $('zone-graphe').querySelector('svg');
    if (!svg) return 1;
    var r = svg.getBoundingClientRect();
    return (r.width / L) * (LARGEUR / (vue.fen.span - 1));
  }

  /* ---- Interactions : les ecouteurs vivent sur le conteneur, donc ils
          survivent au redessin du SVG ---- */
  var cadreGraphe = $('cadre-graphe');
  var glisse = null;

  /* Le geste du graphique : le panoramique. Il part de n'importe quel point
     du cadre, frise des jalons et marge du bas comprises — le curseur y
     promet la main partout. Un clic net sur le numéro d'un jalon ouvre la
     fiche de son échéance ; ailleurs, il ne fait rien. */
  cadreGraphe.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    glisse = { x0: e.clientX, debut0: vue.fen.debut, bouge: false };
    cadreGraphe.setPointerCapture(e.pointerId);
  });

  cadreGraphe.addEventListener('wheel', function (e) {
    if (!e.target.closest || !e.target.closest('svg')) return;
    e.preventDefault();
    var i = indexSousCurseur(e.clientX);
    if (i === null) return;
    var span0 = vue.fen.span;
    /* Le zoom arrière s'arrête à la largeur de « Tout » (débrief 20 : il
       allait jusqu'à deux ans, la moitié du graphique vide, les mots
       croisés). Une fenêtre déjà plus large — « 1 an » — ne s'élargit pas
       davantage, et la molette ne la rétrécit pas en zoomant arrière. */
    var plafond = Math.max(span0, spanTout());
    var span1 = Math.max(8, Math.min(plafond, MAX_IDX + 1, Math.round(span0 * (e.deltaY > 0 ? 1.18 : 1 / 1.18))));
    if (span1 === span0) return;
    // La semaine sous le curseur reste au meme endroit a l'ecran.
    var part = (i - vue.fen.debut) / (span0 - 1);
    vue.fenAuto = false;
    vue.fen.span = span1;
    vue.fen.debut = Math.round(i - part * (span1 - 1));
    /* Arrivé au plafond en zoomant arrière : exactement la fenêtre de
       « Tout », qui se marque pressé. */
    if (e.deltaY > 0 && span1 === spanTout()) vue.fen.debut = 0;
    rendreGraphique(selection());
  }, { passive: false });

  cadreGraphe.addEventListener('pointermove', function (e) {
    if (!glisse) return;
    var dx = e.clientX - glisse.x0;
    if (Math.abs(dx) > 4) glisse.bouge = true;
    if (!glisse.bouge) return;
    var semaines = dx / pxParSemaine();
    cadreGraphe.dataset.glisse = 'true';
    var nd = Math.round(glisse.debut0 - semaines);
    if (nd !== vue.fen.debut) { vue.fenAuto = false; vue.fen.debut = nd; rendreGraphique(selection()); }
  });

  function finGlisse() {
    if (!glisse) return;
    glisse = null;
    cadreGraphe.dataset.glisse = 'false';
  }
  cadreGraphe.addEventListener('pointerup', function (e) {
    var net = !!glisse && !glisse.bouge;
    finGlisse();
    if (!net) return;
    /* Le cadre a capturé le pointeur : la cible se retrouve sous le doigt. */
    var sous = document.elementFromPoint(e.clientX, e.clientY);
    var g = sous && sous.closest && sous.closest('.jalon[data-jalon]');
    if (g) ouvrirEcheance(+g.getAttribute('data-jalon'), true);
  });
  cadreGraphe.addEventListener('pointercancel', finGlisse);

  /* Infobulle */
  cadreGraphe.addEventListener('mousemove', function (e) {
    if (glisse && glisse.bouge) { $('bulle').dataset.visible = 'false'; return; }
    if (!e.target.closest || !e.target.closest('.zone-clic')) { $('bulle').dataset.visible = 'false'; return; }
    var i = indexSousCurseur(e.clientX);
    var a = derniereAnalyse;
    if (i === null || !a) return;
    var bulle = $('bulle');
    var k = -1, serie = a.trace || a.pts, v = a.valeur;
    for (var q = 0; q < serie.length; q++) if (serie[q].i === i) k = q;
    /* Le relevé d'avant dans RELEVES, pour dire si le point précédent de la
       courbe est bien lui (une courbe de valeur écarte les relevés sans
       carte plan par plan). */
    var iReleve = -1;
    for (var q2 = 0; q2 < RELEVES.length; q2++) if (RELEVES[q2].i === i) iReleve = q2;
    if (k !== -1) {
      var pt = serie[k];
      var gagne = k > 0 ? pt.termine - serie[k - 1].termine : null;
      var surPrecedent = k > 0 && iReleve > 0 && RELEVES[iReleve - 1].i === serie[k - 1].i;
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">Relevé de ' + semaineDite(i) + '\x3C/div>' +
        '\x3Cdiv class="bulle-ligne">' + (v ? pastilleValeur(v.cle, v.famille) + ech(v.libelle) : '\x3Cspan class="pastille" style="background:var(--fait)">\x3C/span>validés') +
          '\x3Cspan class="n">' + nb(pt.termine) + ' / ' + nb(pt.total) + '\x3C/span>\x3C/div>' +
        (gagne !== null ? '\x3Cdiv class="bulle-ligne">\x3Cspan class="pastille sans">\x3C/span>' + (v ? 'variation nette' : 'gain net') +
          (surPrecedent ? ' sur le relevé précédent' : ' depuis le relevé de ' + semaineDite(serie[k - 1].i)) + '\x3Cspan class="n">' +
          (gagne > 0 ? '+' : '') + nb(gagne) + '\x3C/span>\x3C/div>' : '') +
        comptesDeLaSemaine(i);
    } else {
      var depart = semaineDepart();
      bulle.innerHTML = '\x3Cdiv class="tete-bulle">' + semaineDite(i) + '\x3C/div>\x3Cdiv class="bulle-ligne">' +
        (i > depart ? 'À venir' : i === depart && i > AUJ ? 'Semaine en cours : pas encore de relevé archivé'
          : iReleve !== -1 ? 'Relevé sans détail plan par plan : hors de cette courbe' : 'Pas de relevé cette semaine-là') + '\x3C/div>';
    }
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  /* Sous les deux lignes de tête, le résumé de la semaine — les lignes du
     journal, mot pour mot : « +6 » ne dit pas ce qui s'est passé. Quand la
     courbe est celle d'un groupe, les comptes se limitent à ses plans. */
  function comptesDeLaSemaine(i) {
    var sem = JOURNAL.filter(function (s) { return s.i === i; })[0];
    if (!sem) return '';
    var evts = sem.evenements.filter(dansPerimetreEvt);
    if (vue.groupe && CLES_DIM.indexOf(vue.groupe.dim) !== -1) {
      evts = evts.filter(function (e) {
        var p = planDeRef(e.ref);
        return p && String(valeurDim(p, vue.groupe.dim) || '\u2014') === vue.groupe.val;
      });
    }
    var lignes = resumeEvenements(evts).map(function (l) {
      return '\x3Cdiv class="bulle-ligne">' + pastilleResume(l) + ech(libelleLot(l, l.n)) +
        '\x3Cspan class="n">' + nb(l.n) + '\x3C/span>\x3C/div>';
    });
    return lignes.length ? '\x3Cdiv class="bulle-comptes">' + lignes.join('') + '\x3C/div>' : '';
  }

  cadreGraphe.addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  document.querySelector('.commandes-graphe .segmente').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-span]');
    if (b && b.getAttribute('aria-disabled') === 'true') { montrerRaison(b, b.title); return; }
    if (b) reglerSpan(b.dataset.span === 'jalons' ? 'jalons' : Number(b.dataset.span));
  });

  /* ============================================================
     CHEMIN CRITIQUE
     La courbe globale masque l'essentiel : un groupe a l'arret n'y
     laisse aucune trace tant que les autres avancent. On projette donc
     chaque groupe a SON rythme, et on regarde lequel arrive le dernier.
     ============================================================ */

  /* L'explication ne vaut que chiffrée : on reprend une ligne réelle du bloc
     et on y refait le calcul pas à pas, avec les nombres qu'elle affiche —
     les formules de bilanEcheance, écrites en clair. */
  function panneauAide(rangs, prochain) {
    var ex = null;
    for (var i = 0; i < rangs.length; i++) {
      if (rangs[i].restantsGroupe > 0 && rangs[i].vitesse > 0 && rangs[i].fin !== null && rangs[i].rythme) { ex = rangs[i]; break; }
    }
    var depart = semaineDepart();
    var h = '\x3Cdiv class="aide-panneau" id="panneau-fin" role="region" aria-label="Comment se calculent la fin estimée et les rythmes">';
    h += '\x3Ch3>D’où viennent ces chiffres ?\x3C/h3>';
    h += '\x3Cp>GATES ne donne qu’une photo du jour, sans historique. Chaque semaine, on archive un relevé ; la page compare ' +
         'le premier relevé au dernier et prolonge la pente en ligne droite. Les semaines se comptent à partir de la ' +
         'semaine en cours, ' + ech(semaineDite(depart)) + '.\x3C/p>';
    h += '\x3Cdiv class="aide-formule">' +
         'rythme tenu   = validés gagnés du premier au dernier relevé ÷ semaines entre les deux\n' +
         'à valider    = plans − validés\n' +
         '\x3Cb>fin estimée   = semaine en cours + arrondi supérieur(à valider ÷ rythme tenu)\x3C/b>' +
         (prochain ? '\n\x3Cb>rythme requis = à valider ÷ semaines d’ici « ' + ech(prochain.texte) + ' »\x3C/b>' : '') +
         '\x3C/div>';

    /* Dans l'exemple, un rythme arrondi au dixième ne redonnerait pas la
       semaine affichée : on garde deux décimales, sans zéro inutile. */
    function d2(n) { return String(Math.round(n * 100) / 100).replace('.', ','); }
    if (ex) {
      var sem = ex.fin - depart;
      h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Exemple — ' + ech(TITRE_DIM[vue.dimCritique].replace(/ \(.*\)$/, '')) +
           ' ' + ech(libelleGroupe(ex.nom)) + '\x3C/span>' +
           'rythme tenu   = ' + nb(ex.rythme.gagnes) + ' ÷ ' + ex.rythme.semaines + ' sem. = ' + d2(ex.vitesse) + ' par semaine (affiché ' + virgule(ex.vitesse) + ')\n' +
           'à valider    = ' + nb(ex.restantsGroupe) + ' plans\n' +
           '\x3Cb>fin estimée   = ' + ex.restantsGroupe + ' ÷ ' + d2(ex.vitesse) + ' = ' + sem + ' semaines après ' + ech(semaineDite(depart)) +
           ' → ' + ech(semaineDite(ex.fin)) + '\x3C/b>\x3C/div>';
      var b = ex.bilan;
      if (prochain && b && b.restants) {
        h += '\x3Cdiv class="aide-formule">\x3Cspan class="exemple">Et la colonne voisine, sur la même ligne\x3C/span>' +
             '\x3Cb>rythme requis = ' + b.restants + ' ÷ ' + b.semaines + ' sem. = ' + virgule(b.requis) + ' par semaine\x3C/b>' +
             (b.domaine && b.domaine !== vue.perimetre ? '  (ses plans ' + ech(b.domaine) + ')' : '') +
             (b.enRetard ? '\n              → plus que le rythme tenu : il manquerait ' + nb(b.manque) + ' plans le jour de l’échéance'
                         : '\n              → le rythme tenu suffit') +
             '\x3C/div>';
      }
    } else {
      h += '\x3Cp>Aucun groupe de la sélection n’a de rythme exploitable pour l’instant : ' +
           'il faut au moins deux relevés et un plan validé entre les deux.\x3C/p>';
    }

    h += '\x3Cp>Un groupe qui n’a rien validé depuis le premier relevé n’a pas de rythme : sa fin reste « — ». ' +
         'Les dates se recalculent à chaque relevé et peuvent reculer — ce n’est pas un engagement, ' +
         'c’est ce que dit le rythme tenu jusqu’ici.\x3C/p>';
    return h + '\x3C/div>';
  }

  /* « Plus de 6 mois : 42 » ne dit pas lesquels. Choisir une ligne déplie donc
     TOUTES ses références. Rien n'est tronqué : un « et N autres » qui ne
     s'ouvre pas ne sert à personne. */
  function listeUD(r, vb) {
    var plans = (r.plans || []).slice();
    if (!plans.length) return '';
    /* Sous une valeur choisie dans la rangée du bloc, le groupe ne montre
       qu'elle : une seule sous-liste, et l'en-tête dit sur combien. */
    if (vb) {
      var v0 = valeurDeCle(vb), nom = v0 ? v0.libelle : vb, tous = plans.length;
      plans = plans.filter(function (p) { return p._cle === vb; });
      if (!plans.length) {
        return '\x3Cdiv class="groupe-refs">\x3Cdiv class="entete">\x3Cspan>Aucun plan « ' + ech(nom) + ' » dans ce groupe (' + nb(tous) +
          ' plan' + (tous > 1 ? 's' : '') + ' en tout) — « Tout » les montre.\x3C/span>\x3C/div>\x3C/div>';
      }
    }
    /* Une sous-liste par valeur de la colonne, dans l'ordre de la barre du
       haut — Terminé, En cours, À faire, Non renseigné, et leurs variantes —,
       chacune avec sa pastille et son compte ; dans chacune, les références
       dans l'ordre. Plus de tas « pas encore terminés » où les états se
       mêlaient. */
    var restants = plans.filter(function (p) { return p._etat !== 'termine'; }).length;
    var arretParRef = RELEVES.length > 1 ? plansALArret().parRef : {};
    /* Les plans à l'arrêt d'abord, sous leur propre titre, chacun avec la
       semaine depuis laquelle il ne bouge plus — c'est souvent là que sont
       les blocages ; les plus anciens en tête. Ils ne se répètent pas dans
       les sous-listes par valeur. */
    var arrets = plans.filter(function (p) { return arretParRef[p.reference]; }).map(function (p) { return arretParRef[p.reference]; })
      .sort(function (a, b) { return (b.semaines - a.semaines) || COMPARER_REF(a.plan.reference, b.plan.reference); });
    var nArret = arrets.length;
    var parValeur = {};
    plans.forEach(function (p) {
      if (arretParRef[p.reference]) return;
      var k = cleValeur(p[CLE_SUIVIE]);
      (parValeur[k] = parValeur[k] || []).push(p);
    });
    var html = (nArret ? '\x3Cdiv class="sous-arret">\x3Ch4 class="titre-arret">\x3Cspan class="pastille arret">\x3C/span>À l\u2019arrêt' +
        '\x3Cspan class="n">' + nb(nArret) + '\x3C/span>\x3C/h4>' +
        '\x3Cdiv class="grille-arret">' + arrets.map(function (x) { return jetonUD(x.plan); }).join('') + '\x3C/div>\x3C/div>' : '') +
      VALEURS_COLONNE.filter(function (v) { return parValeur[v.cle]; }).map(function (v) {
      var liste = parValeur[v.cle].sort(function (a, b) { return COMPARER_REF(a.reference, b.reference); });
      return '\x3Cdiv class="sous-groupe">\x3Ch4 class="sous-titre">' + pastilleValeur(v.cle, v.famille) + ech(v.libelle) +
        '\x3Cspan class="n">' + nb(liste.length) + '\x3C/span>\x3C/h4>' +

    }).join('');
    /* Copier les références du groupe déplié, dans l'ordre affiché. */
    var copie = arrets.map(function (x) { return x.plan.reference; });
    VALEURS_COLONNE.forEach(function (v) { (parValeur[v.cle] || []).forEach(function (p) { copie.push(p.reference); }); });
    return '\x3Cdiv class="groupe-refs">\x3Cdiv class="entete">' +
      '\x3Cspan>' + nb(plans.length) + ' plan' + (plans.length > 1 ? 's' : '') +
      (vb ? ' « ' + ech(valeurDeCle(vb) ? valeurDeCle(vb).libelle : vb) + ' » sur ' + nb((r.plans || []).length)

      '\x3C/span>' + boutonCopier(copie) + '\x3Cspan>cliquez une référence pour la retrouver dans le tableau\x3C/span>\x3C/div>' + html + '\x3C/div>';
  }

  function jetonUD(p) {
    var quoi = CLE_LIBELLE ? String(p[CLE_LIBELLE] || '') : '';
    /* Un plan à l'arrêt porte un anneau ambre, et sa bulle dit depuis quand ;
       sur la puce même, « depuis S12 » — ou « depuis ≤ S26 » quand la suite
       remonte au premier relevé connu : comme la bulle (« depuis au moins
       S26 »), la puce n'affirme pas un début que les relevés ignorent. */
    var arret = RELEVES.length > 1 ? plansALArret().parRef[p.reference] : null;

      '" title="' + ech(libelleValeur(p[CLE_SUIVIE]) + (quoi ? ' — ' + quoi : '') + (arret ? ' — ' + motArret(arret) : '')) + '">' +
      pastilleValeur(cleValeur(p[CLE_SUIVIE]), p._etat) + ech(p.reference) +

  /* Un plan cherché dans ce bloc : sous le groupe qui le contient, lui seul

    return '\x3Cdiv class="groupe-refs trouves">\x3Cdiv class="entete">\x3Cspan>\x3Cb>' + nb(n) + '\x3C/b> plan' + (n > 1 ? 's' : '') +
      ' trouvé' + (n > 1 ? 's' : '') + ' dans ce groupe\x3C/span>' +
      '\x3Cspan>cliquez une référence pour la retrouver dans le tableau\x3C/span>\x3C/div>' +
      '\x3Cdiv class="grille">' + trouves.map(jetonUD).join('') + '\x3C/div>\x3C/div>';
  }

  /* Le filtre de la colonne de gauche : les groupes dont le nom — tel qu'il
     s'affiche, donc « Oui » pour « true » — contient le texte tapé, et ceux
     qui contiennent un plan dont la référence le contient : le même champ
     trouve un ATA ou un plan, dans ce bloc seulement. */
  function nomGroupeCorrespond(r) {
    var q = norm(vue.filtreGroupe);
    return !!q && (norm(libelleGroupe(r.nom)).indexOf(q) !== -1 || norm(r.nom).indexOf(q) !== -1);
  }
  function plansTrouvesDans(r) {
    var q = motCherche(vue.filtreGroupe);
    if (!q) return [];
    var vb = vue.valeurBloc;
    return (r.plans || []).filter(function (p) { return refCorrespond(p.reference, q) && (!vb || p._cle === vb); })
      .sort(function (a, b) { return COMPARER_REF(a.reference, b.reference); });
  }
  function retenuParFiltreGroupe(r) {
    if (!norm(vue.filtreGroupe)) return true;

  }
  /* La rangée de pastilles du bloc (débrief 18) : « Tout », puis chaque
     valeur de la colonne, dans l'ordre des tuiles. Une valeur qu'aucun plan
     du bloc ne porte n'a pas de pastille (débrief 19) ; sans plan, pas de
     rangée. Rend la valeur choisie, '' pour « Tout ». */
  function rendreFiltreValeurBloc(liste, dim) {
    var z = $('filtre-valeur-groupe');
    if (vue.valeurBloc && !valeurDeCle(vue.valeurBloc)) vue.valeurBloc = '';
    if (!z || !liste) {
      /* Sans rangée — ou sous un Index d'une livraison d'avant —, pas de
         valeur choisie qu'on ne pourrait plus retirer. */
      vue.valeurBloc = '';
      if (z) { z.hidden = true; z.innerHTML = ''; }
      return '';
    }
    /* Seulement les valeurs que portent les plans du bloc (débrief 19) —
       ceux que son champ « ATA ou plan… » laisse voir, comme la rangée du
       journal suit sa recherche : un groupe trouvé par son nom montre tous

    var presentes = {}, q = norm(vue.filtreGroupe), qr = motCherche(vue.filtreGroupe), nomVu = {};
    liste.forEach(function (p) {
      if (q && dim) {
        var k = String(valeurDim(p, dim) || '\u2014');
        if (nomVu[k] === undefined) nomVu[k] = nomGroupeCorrespond({ nom: k });
        if (!nomVu[k] && !(qr && refCorrespond(p.reference, qr))) return;
      }
      presentes[p._cle] = true;
    });
    z.innerHTML = boutonsPastilles('valeur-bloc', vue.valeurBloc, VALEURS_COLONNE.map(function (v) {
      return { cle: v.cle, famille: v.famille, libelle: v.libelle, absente: !presentes[v.cle],
               titre: 'Compter, dans chaque groupe, les plans « ' + v.libelle + ' »' };
    }), { libelle: 'Tout', titre: 'Tous les plans de chaque groupe' });
    z.hidden = !z.innerHTML;
    if (z.hidden) vue.valeurBloc = '';
    marquerDebord(z);
    return vue.valeurBloc;
  }
  /* Ce qui est arrivé à une valeur au dernier relevé, groupe par groupe :
     les mêmes arrivées que la rangée du journal — passages, reculs,
     réémissions —, sur les plans que compte le bloc. Rien si la semaine la
     plus récente du journal n'est pas celle du dernier relevé : rien n'y a
     bougé. */
  /* Où ces arrivées ont eu lieu, avec les mots du pied : l'extract du jour
     pas encore archivé n'est pas « le dernier relevé ». */
  function quandDesGains(i) {
    var avant = RELEVES.length > 1 ? RELEVES[RELEVES.length - 2].i : null;
    return EXTRAIT_EN_PLUS && avant !== null
      ? 'entre le dernier relevé (' + semaineDite(avant) + ') et l\u2019extract du jour'
      : 'au dernier relevé (' + semaineDite(i) + ')';
  }
  function gainsAuDernierReleve(vb, liste, dim) {
    var res = { sem: null, parGroupe: {} };
    var der = RELEVES.length ? RELEVES[RELEVES.length - 1] : null, sem = JOURNAL[0];
    if (!der || !sem || sem.i !== der.i) return res;
    res.sem = sem.i;
    var dansListe = {};
    liste.forEach(function (p) { dansListe[p.reference] = true; });
    sem.evenements.forEach(function (e) {
      if (!arriveA(e, vb)) return;
      var p = planDeRef(e.ref);
      if (!p || !dansListe[p.reference]) return;
      var k = String(valeurDim(p, dim) || '\u2014');
      res.parGroupe[k] = (res.parGroupe[k] || 0) + 1;

  }

  /* Le champ suit la dimension : « Filtrer les ATA… », « Filtrer les mois… ». */
  function libellerFiltreGroupe(dim) {

    $('filtre-groupe').placeholder = (TITRE_DIM[dim] ? quoi : 'Groupe') + ' ou plan…';
    $('filtre-groupe').setAttribute('aria-label', 'Filtrer les ' + quoi + ' ou chercher un plan dans ce bloc');
  }

  /* Le nom du bloc dans le sommaire : « Par ATA », « Par ECP »… La synthèse
     le pose aussi (rendreHaut) : le sommaire de la première image de
     l'ouverture est celui de la page finie (débrief 23, revue). */
  /* Débrief 27 (D6) : le surtitre du panneau dit la même chose que son
     entrée du sommaire — on clique « 04 Par ATA », on arrive sur
     « 04 · Par ATA » (il disait « Répartition »). */
  function libellerSommaireGroupe() {
    var dim = vue.dimCritique;
    var mot = dim && TITRE_DIM[dim] ? 'Par ' + TITRE_DIM[dim].replace(/ \(.*\)$/, '') : 'Répartition';
    $('sommaire-groupe').textContent = mot;
    if ($('surtitre-groupe')) $('surtitre-groupe').textContent = mot;
  }

  function rendreCritique(liste) {
    var dim = vue.dimCritique;
    /* L'échéance — le jalon qui pilote l'effort demandé sous le périmètre
       choisi — se pose d'abord, quoi que le bloc affiche ensuite : elle ne
       dépend ni de la sélection ni de la colonne analysée. */
    var prochain = prochainJalon();
    $('zone-critique').setAttribute('data-jalon', prochain ? prochain.texte : '');
    /* Aucune colonne à analyser — source vide, ou feuille sans catégorie
       reconnue : le bloc le dit au lieu de chercher un titre qui n'existe pas. */
    if (!dim || !TITRE_DIM[dim]) {
      $('titre-groupe').textContent = motSuivi();
      $('dim-critique').hidden = true;
      ajusterChoixDim();
      libellerSommaireGroupe();
      $('indice-dim').textContent = '';
      $('compte-groupes').textContent = '';
      libellerFiltreGroupe(dim);
      rendreFiltreValeurBloc(null);
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucune colonne à analyser dans cette source.\x3C/div>';

    }

    /* Répartition : état du jour, filtrée comme le reste de la page — sauf
       par le groupe choisi ici. Un groupe cliqué se déplie sur place, comme
       une semaine du journal, et les autres restent là (débrief 17) : le
       reste de la page, lui, le suit. */
    if (vue.groupe && vue.groupe.dim === dim) liste = selection(true);
    /* La rangée de pastilles se pose avant toute sortie : jamais celle d'un
       autre contrat sous une sélection vide. */
    var vb = rendreFiltreValeurBloc(liste, dim);
    var vVal = vb ? valeurDeCle(vb) : null;
    var groupes = {};
    liste.forEach(function (p) {
      var k = String(valeurDim(p, dim) || '\u2014');
      if (!groupes[k]) groupes[k] = { nom: k, total: 0, termine: 0, encours: 0, afaire: 0, vide: 0, plans: [], parValeur: {} };
      groupes[k].total++;
      groupes[k][p._etat]++;

      groupes[k].plans.push(p);
    });
    var gains = vb ? gainsAuDernierReleve(vb, liste, dim) : null;

    /* Le rythme, la fin estimée et le rythme requis d'un groupe se lisent

       ligne, celle que lit la fiche d'échéance : les relevés archivés, sous
       le périmètre choisi. Un relevé archivé ne se refiltre pas : ces trois
       colonnes portent sur tous les plans du groupe, quels que soient les
       autres filtres, et le bloc le dit quand il y en a. */
    var per = vue.perimetre;
    var depart = semaineDepart();
    var arretParRef = RELEVES.length > 1 ? plansALArret().parRef : {};
    /* « 3 à l'arrêt » sous le compte d'un groupe est un bouton : il montre
       ces plans-là dans le tableau (« À surveiller » limité au groupe). Son
       nombre est celui des lignes que le clic montrera — la sélection, sans
       sa sélection de plans que le clic remplace, ni une tuile contraire
       qu'il retire ; sous une valeur du bloc, les plans de cette valeur. */
    var arretClic = {};
    if (RELEVES.length > 1) {
      var dansClic = {};
      selectionSans({ refs: true, groupe: true, etat: vb ? true : etatContraireALArret() })
        .forEach(function (p) { dansClic[p.reference] = true; });
      plansALArret().liste.forEach(function (x) {
        if (!dansClic[x.plan.reference] || (vb && x.plan._cle !== vb)) return;
        var kg = String(valeurDim(x.plan, dim) || '\u2014');
        arretClic[kg] = (arretClic[kg] || 0) + 1;
      });
    }
    var arretPresse = vue.refsLibelle === SEL_ARRET && vue.groupe && vue.groupe.dim === dim ? vue.groupe.val : null;
    var rangs = Object.keys(groupes).map(function (k) {

      var derG = serie[serie.length - 1];
      var restantsGroupe = Math.max(0, derG.total - derG.termine);
      var rg = rythmes(serie);
      var vitesse = rg ? rg.central : 0;
      /* Le rythme requis : la formule de la fiche (bilanEcheance), sur ce

        nom: g.nom, total: g.total, restants: g.total - g.termine, restantsGroupe: restantsGroupe, vitesse: vitesse, plans: g.plans,
        parValeur: g.parValeur, nValeur: nValeur, partValeur: g.total ? nValeur / g.total : 0,
        gain: gains ? (gains.parGroupe[k] || 0) : 0,

        arret: g.plans.filter(function (p) { return arretParRef[p.reference] && (!vb || p._cle === vb); }).length,
        arretClic: arretClic[k] || 0,

        pct: g.total ? Math.round((g.termine / g.total) * 100) : 0,
        fin: restantsGroupe === 0 ? depart : semaineFin(derG.termine, derG.total, vitesse),
        requis: b && b.restants ? b.requis : 0,

      };
    });

    /* Tri : par defaut on met en tete ce qu'il faut pousser le plus fort (ou la
       fin la plus lointaine sans jalon). Un clic sur un en-tete prend le relais. */
    function cleTri(r, cle) {
      /* Les dimensions dérivées du temps se rangent dans l'ordre du temps :
         « avr. 2024 » ne vient pas avant « mai 2020 » parce que A précède M. */
      if (cle === 'nom' && dim === '_mois') return rangMois(r.nom);
      if (cle === 'nom' && dim === '_anciennete') return ORDRE_ANCIENNETE.indexOf(r.nom);
      if (cle === 'nom') return r.nom;
      /* Sous une valeur choisie, « plans » et « répartition » rangent sur
         elle : quel ATA a le plus de « VALIDATED », la plus grande part. */
      if (cle === 'total') return vb ? r.nValeur : r.total;
      if (cle === 'pct') return vb ? r.partValeur : r.pct;
      if (cle === 'requis') return r.requis;
      if (cle === 'vitesse') return r.vitesse;
      if (cle === 'tension') return r.tension;

    var tg = vue.triGroupe && vue.triGroupe.cle ? vue.triGroupe : { cle: 'nom', asc: true, parDefaut: true };
    if (tg && tg.cle) {
      var signe = tg.asc ? 1 : -1;
      rangs.sort(function (a, b) {

          var nx = parseFloat(x), ny = parseFloat(y);

        }
        if (x === y) return COMPARER_NUM(a.nom, b.nom);
        // Infinity des deux cotes : egalite, on retombe sur le nom.

      });
    }

    // « par groupe » ne parlait à personne : le titre nomme la dimension choisie.
    /* Débrief 20 : le mot de la dimension, à l'écran, c'est le menu qui suit
       le titre ; le titre le garde en texte masqué, pour qu'un lecteur
       d'écran entende la phrase entière, « Avancement FWD par ATA ». */
    $('titre-groupe').innerHTML = ech(motSuivi()) + ' par \x3Cspan class="masque">' +
      ech(TITRE_DIM[dim].replace(/ \(.*\)$/, '')) + '\x3C/span>';
    $('dim-critique').hidden = false;
    ajusterChoixDim();
    // Le sommaire dit la même chose que le titre : « Par ATA », « Par ECP »…
    libellerSommaireGroupe();
    $('indice-dim').textContent = NOTE_DIM(dim);
    libellerFiltreGroupe(dim);

    if (!rangs.length) {
      $('zone-critique').classList.remove('sans-jalon');
      $('zone-critique').innerHTML = '\x3Cdiv class="vide-message">Aucun plan dans la sélection.\x3C/div>';
      $('compte-groupes').textContent = '';

    }

    /* Le filtre de la colonne de gauche ne touche qu'à ce bloc : les lignes
       qu'il écarte restent comptées partout ailleurs. Le compte dit combien
       restent sur combien tant qu'il agit. */
    var tous = rangs.length;
    rangs = rangs.filter(retenuParFiltreGroupe);
    $('compte-groupes').textContent = rangs.length === tous ? '' : nb(rangs.length) + ' sur ' + nb(tous);
    marquerDebord($('filtre-valeur-groupe'));     // le compte prend sa place sur la ligne

    function fleche(cle) {
      if (!tg || tg.cle !== cle) return '';
      return '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (tg.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>';
    }

      var actif = !!(tg && tg.cle === cle);
      return '\x3Cspan class="' + (classe || '') + '">\x3Cbutton type="button" class="tri-groupe" data-trig="' + cle +
        '" data-actif="' + actif + '" aria-label="Trier par ' + ech(libelle) + '"' +

    }

    function aide(quoi) {
      return '\x3Cbutton type="button" class="aide" data-aide="1" aria-expanded="' + (!!vue.aideFin) +

    }

    var html = '\x3Cdiv class="critique-tete">' +
      entete('nom', TITRE_DIM[dim].replace(/ \(.*\)$/, ''), TITRE_DIM[dim]) + '\x3C/span>' +
      (vVal
        ? entete('total', 'plans', 'Plans « ' + vVal.libelle + ' » du groupe dans la sélection, sur son total.', '', pastilleValeur(vb, vVal.famille)) + '\x3C/span>' +
          entete('pct', 'répartition', 'Trier par part de « ' + vVal.libelle + ' ».', 'a-gauche') + '\x3C/span>'
        : entete('total', 'plans', 'Nombre de plans du groupe dans la sélection courante.') + '\x3C/span>' +
          entete('pct', 'répartition', 'Trier par part de plans validés.', 'a-gauche') + '\x3C/span>') +
      entete('fin', 'fin estimée', 'Semaine où tout le groupe serait validé si le rythme tenu se maintient.') + aide('la fin estimée') + '\x3C/span>' +
      (prochain
        ? entete('requis', 'rythme requis', 'Plans à valider chaque semaine pour tenir \u00ab\u00a0' + prochain.texte + '\u00a0\u00bb (' +
            semaineDite(prochain.i) + ') ; dessous, le rythme tenu. En rouge quand le rythme tenu ne suffit pas.') + aide('le rythme requis') + '\x3C/span>'
        : entete('vitesse', 'rythme tenu', 'Plans validés par semaine, du premier au dernier relevé.') + aide('le rythme tenu') + '\x3C/span>') +
      '\x3C/div>';
    /* Un jalon d'un seul périmètre, lu sur « Tout » : son rythme requis ne
       compte que ses plans à lui, et le bloc le dit. */
    var perJ = prochain ? perimetreEcheance(prochain) : '';
    if (prochain && perJ && perJ !== per) {
      html += '\x3Cdiv class="critique-note">Rythme requis pour \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb : sur les plans ' +
        ech(perJ) + ' de chaque groupe.\x3C/div>';
    }
    /* « 1 à l'arrêt », sous le compte d'un groupe, ne s'explique pas tout
       seul (débrief 15) : le mot se définit ici, en clair, dès qu'un groupe
       en compte un. Sur le même nombre que les boutons (arretClic) : sous une
       tuile Validé, ils restent — le clic retire la tuile — et la note,
       comptée avant sur la sélection (vide de plans en cours), disparaissait
       en laissant le mot sans définition (relecture du débrief 20). */
    if (rangs.some(function (r) { return r.arretClic; })) {
      html += '\x3Cdiv class="critique-note note-arret">\x3Cspan class="pastille arret">\x3C/span>\x3Cspan>\x3Cb>à l\u2019arrêt\x3C/b> = en cours, sans changement depuis ' +
        SEMAINES_ARRET + ' semaines ou plus. Un clic sur « à l\u2019arrêt » ne montre qu\u2019eux dans le tableau ; le groupe ouvert les met en tête de sa liste.\x3C/span>\x3C/div>';
    }
    /* Sous une valeur, ce que comptent les colonnes : « plans » et la
       barre suivent la valeur, la fin estimée et les rythmes restent ceux
       de tout le groupe — sinon on lirait « la fin des TO_CONFIRM ». */
    if (vVal) {
      html += '\x3Cdiv class="critique-note note-valeur">' + pastilleValeur(vb, vVal.famille) + '\x3Cspan>Plans et répartition : les plans « ' + ech(vVal.libelle) +
        ' » de chaque groupe, sur son total' + (gains && gains.sem !== null ? ', et ceux qui y sont arrivés ' + ech(quandDesGains(gains.sem)) : '') +
        '. Fin estimée et rythmes : sur tous ses plans' + (filtreHorsGroupe() ? ' — un relevé archivé ne se refiltre pas' : '') + '.\x3C/span>\x3C/div>';
    } else if (filtreHorsGroupe()) {
      /* Les autres filtres ne touchent pas l'historique : le bloc le dit. */
      html += '\x3Cdiv class="critique-note">Fin estimée et rythmes : sur tous les plans de chaque groupe — un relevé archivé ne se refiltre pas.\x3C/div>';
    }

    if (vue.aideFin) html += panneauAide(rangs, prochain);

    /* Toutes les lignes sont là — « Date création par mois » peut en faire
       quatre-vingts — mais le bloc a une hauteur : on descend dedans au lieu
       de pousser le reste de la page vers le bas. */
    html += rangs.map(function (r) {
      var actif = vue.groupe && vue.groupe.dim === dim && vue.groupe.val === r.nom;
      var trouves = plansTrouvesDans(r);

      /* Le pourcentage s'ecrit dans le segment quand il y tient ; en dessous
         il reste dans l'infobulle plutot que d'etre rogne. Débrief 22 : la
         barre se découpe par valeur, comme la barre du haut — chaque valeur
         a sa couleur, et un segment « en cours » d'un seul bleu dirait
         PWD_IN_PROGRESS pour des PWD_TO_CONTROL. Sous une valeur choisie,
         seule la sienne s'éclaire et porte sa part. */
      var barre = VALEURS_COLONNE.map(function (v) {
        var nV = r.parValeur[v.cle];
        if (!nV) return '';
        var part = (nV / r.total) * 100;
        var eclaire = !!vVal && v.cle === vb;
        var texte = (!vVal || eclaire) && part >= 11 ? Math.round(part) + '\u202f%' : '';
        /* Chaque segment dit au survol sa valeur et son compte, comme la
           barre du haut — les fins segments n'ont pas d'autre texte. */
        var titre = ' title="' + ech(v.libelle + ' : ' + nb(nV) + ' sur ' + nb(r.total)) + '"';
        return v.hachure
          ? '\x3Cspan class="hachure' + (eclaire ? ' eclaire' : '') + '" data-cle="' + ech(v.cle) + '"' + titre + ' style="width:' + part.toFixed(2) + '%;color:var(--encre-2)">' + (texte ? '\x3Ci class="etiq-part">' + texte + '\x3C/i>' : '') + '\x3C/span>'
          : '\x3Cspan' + (eclaire ? ' class="eclaire"' : '') + ' data-cle="' + ech(v.cle) + '"' + titre + ' style="width:' + part.toFixed(2) + '%;background:' + v.couleur + ';color:' + v.encre + '">' + texte + '\x3C/span>';
      }).join('');
      /* L'infobulle de la ligne (sa description pour un lecteur d'écran)
         reprend la barre valeur par valeur, dans son ordre : le « 35 % »
         écrit dans le bleu s'y retrouve, à côté de son mot. */
      var detail = VALEURS_COLONNE.filter(function (v) { return r.parValeur[v.cle]; }).map(function (v) {
        return nb(r.parValeur[v.cle]) + ' « ' + v.libelle + ' » (' + Math.round(100 * r.parValeur[v.cle] / r.total) + '\u202f%)';
      }).join(', ');

      /* Une seule colonne d'appoint : le rythme requis quand un jalon fixe
         une échéance — en plans par semaine, avec le rythme tenu dessous —,
         le rythme tenu seul sinon. */
      var col2, b = r.bilan;
      if (!prochain) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme tenu">\x3Cspan class="v critique-ecart' +
          (r.vitesse > 0 ? '' : ' arret') + '">' +
          (r.vitesse > 0 ? virgule(r.vitesse) + '/sem.' : 'rien de validé') +
          '\x3C/span>\x3C/span>';
      } else if (!b.total) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis" title="Aucun plan de ce groupe dans ' +
          ech(b.domaine) + ' : \u00ab\u00a0' + ech(prochain.texte) + '\u00a0\u00bb ne lui demande rien.">\x3Cspan class="v critique-ecart doux">\u2014\x3C/span>\x3C/span>';
      } else if (!b.restants) {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis">\x3Cspan class="v critique-ecart">tout est validé\x3C/span>\x3C/span>';
      } else {
        col2 = '\x3Cspan class="critique-effort" data-libelle="rythme requis" title="' + ech(nb(b.restants) + (b.restants > 1 ? ' plans' : ' plan') +
          ' à valider' + (b.domaine && b.domaine !== per ? ' dans ' + b.domaine : '') + ' en ' + b.semaines + (b.semaines > 1 ? ' semaines' : ' semaine') +
          ' : ' + virgule(b.requis) + ' par semaine ; rythme tenu : ' + (b.rythme > 0 ? virgule(b.rythme) + ' par semaine.' : 'aucun plan validé.')) +
          '">\x3Cspan class="v critique-ecart">' +
          (b.enRetard ? '\x3Cb class="tard">' + virgule(b.requis) + '/sem.\x3C/b>' : virgule(b.requis) + '/sem.') +
          '\x3Csmall>' + (b.rythme > 0 ? 'tenu ' + virgule(b.rythme) + '/sem.' : 'rien de validé') + '\x3C/small>\x3C/span>\x3C/span>';
      }

      // --- colonne chiffree 3 : la semaine d'arrivee au rythme tenu
      var texteFin = r.restantsGroupe === 0 ? 'validé' : (r.fin === null ? '—' : semaineDite(r.fin));
      var col3 = '\x3Cspan class="critique-date' + (r.fin === null && r.restantsGroupe !== 0 ? ' doux' : '') +
        '" data-libelle="fin estimée" title="' +
        (r.restantsGroupe === 0 ? 'Plus rien à valider dans ce groupe.'
          : r.fin === null ? 'Aucun plan validé depuis le premier relevé : pas de rythme, donc pas de date.'
          : ech(nb(r.restantsGroupe) + ' plans à valider à ' + virgule(r.vitesse) + ' par semaine : ' + (r.fin - depart) + ' semaines, fin ' + semaineDite(r.fin) + '.')) +
        '">\x3Cspan class="v">' + texteFin + '\x3C/span>\x3C/span>';

      return '\x3Cbutton class="critique-ligne' + (vVal && !r.nValeur ? ' sans-valeur' : '') + '" type="button" data-groupe="' + ech(r.nom) + '" aria-pressed="' + !!actif +
        '" title="' + (vVal ? ech(nb(r.nValeur) + ' « ' + vVal.libelle + ' » sur ' + nb(r.total)) + ' \u2014 ' : '') +
        ech(detail) + ' — cliquez pour voir lesquels">' +
        '\x3Csvg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
        '\x3Cpath d="m3.5 1.5 3.5 3.5-3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' +
        '\x3Cspan class="critique-nom">' + ech(libelleGroupe(r.nom)) + '\x3C/span>' +
        '\x3Cspan class="critique-plans">\x3Cspan class="critique-total" data-libelle="plans">' + (vVal ? r.nValeur : r.total) + '\x3C/span>' +
        (vVal ? '\x3Csmall class="sur-n">sur ' + nb(r.total) + (r.gain ? ' · \x3Cb title="' + ech(nb(r.gain) + (r.gain > 1 ? ' plans arrivés' : ' plan arrivé') + ' à « ' +
          vVal.libelle + ' » ' + quandDesGains(gains.sem)) + '">+' + nb(r.gain) + '\x3C/b>' : '') + '\x3C/small>' : '') +
        /* Les plans à l'arrêt du groupe, sous son compte : en ambre, comme
           la puce « À surveiller » du haut. La ligne leur garde la place ;
           le bouton, posé juste après elle (un bouton n'en contient pas un
           autre), vient s'y loger. */
        (r.arretClic ? '\x3Csmall class="arret-n place" aria-hidden="true">' + r.arretClic + ' à l\u2019arrêt\x3C/small>' : '') + '\x3C/span>' +
        '\x3Cspan class="critique-barre' + (vVal ? ' focalise' : '') + '">' + barre + '\x3C/span>' +
        col3 + col2 + '\x3C/button>' +
        (r.arretClic ? '\x3Cdiv class="critique-arret">\x3Cbutton type="button" class="arret-groupe" data-arret-groupe="' + ech(r.nom) +
          '" aria-pressed="' + (arretPresse === r.nom) + '" title="' + ech(r.arretClic + (r.arretClic > 1 ? ' plans en cours n\u2019ont pas bougé' : ' plan en cours n\u2019a pas bougé') +
          ' depuis ' + SEMAINES_ARRET + ' semaines ou plus \u2014 ' + (arretPresse === r.nom ? 'cliquez pour retirer le filtre' : 'cliquez pour ne voir qu\u2019eux dans le tableau')) +
          '">' + r.arretClic + ' à l\u2019arrêt\x3C/button>\x3C/div>' : '') +
        (actif ? listeUD(r, vb) : (trouves.length ? listeTrouves(trouves) : ''));
    }).join('');

    if (!rangs.length) {
      html += '\x3Cdiv class="vide-message">Ni groupe ni plan' + (vVal ? ' « ' + ech(vVal.libelle) + ' »' : '') + ' ne contient « ' + ech(vue.filtreGroupe.trim()) +
        ' ». Échap vide le filtre.\x3C/div>';
    }

    /* toggle et non className : le conteneur porte aussi « defile-liste »,
       qui lui donne sa hauteur et sa barre de défilement. */
    $('zone-critique').classList.toggle('sans-jalon', !prochain);
    $('zone-critique').innerHTML = html;
    ajusterColonneNom();
  }
  /* La colonne du nom de groupe prend la largeur du plus long nom affiché
     (débrief 23 : un nom d'ECP coupé de « … » ne se lisait plus). Une seule
     mesure, tous les noms d'un coup ; au téléphone, le nom a toute la ligne.
     Elle se fait à l'image suivante, avec les autres mesures de la page. */
  function ajusterColonneNom() { aMesurer('colonneNom'); }
  function poserColonneNom() {
    var zone = $('zone-critique');
    if (!zone) return;
    zone.style.removeProperty('--col-nom');
    [].forEach.call(zone.querySelectorAll('.critique-ligne.nom-dessus'), function (l) { l.classList.remove('nom-dessus'); });
    if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) return;
    var noms = zone.querySelectorAll('.critique-ligne .critique-nom');
    if (!noms.length || !zone.clientWidth) return;
    /* La largeur du texte lui-même (une plage sur le nom, écrit sur une
       ligne), plus la place du chevron : scrollWidth ne descend jamais sous
       la largeur de la colonne, il ne dirait pas qu'un nom est court. */
    zone.classList.add('mesure-nom');
    var largeurs = [], plage = document.createRange();
    var marge = parseFloat(getComputedStyle(noms[0]).paddingLeft) || 0;
    for (var i = 0; i < noms.length; i++) {
      plage.selectNodeContents(noms[i]);
      largeurs.push(plage.getBoundingClientRect().width + marge);
    }
    zone.classList.remove('mesure-nom');
    var sansJalon = zone.classList.contains('sans-jalon'), base = sansJalon ? 124 : 118;
    /* Débrief 24 : « des fois la ligne ECP est trop large ». La colonne du
       nom ne s'élargit plus que jusqu'à 240 px (moins sur un écran étroit,
       pour que la barre garde au moins 220 px). Un nom plus long que ça ne
       la pousse pas : il passe au-dessus de sa barre, sur toute la largeur,
       en entier — les barres restent larges et alignées sous leur en-tête. */
    var fixes = (sansJalon ? 62 : 58) + 140 + 160 + 4 * 14;
    var plafond = Math.max(base, Math.floor(Math.min(240, zone.clientWidth * 0.22, zone.clientWidth - fixes - 220)));
    var large = 0;
    largeurs.forEach(function (l, k) {
      if (l > plafond) noms[k].parentNode.classList.add('nom-dessus');
      else large = Math.max(large, l);
    });
    if (large <= base) return;
    zone.style.setProperty('--col-nom', Math.min(plafond, Math.ceil(large) + 2) + 'px');
  }

  /* L'ordre du sélecteur est celui que donne la source : quand la liste est
     fixée à la main, c'est l'ordre demandé qui compte, pas celui de la feuille. */
  /* Le sélecteur est rangé par ordre alphabétique : on y cherche un nom, pas
     une position dans la feuille. */
  /* Deux dimensions viennent de la même colonne de date et se confondent
     facilement : on dit laquelle répond à quelle question. */
  function NOTE_DIM(dim) {
    var titreDate = CLE_DATE && PAR_CLE[CLE_DATE] ? PAR_CLE[CLE_DATE].titre.toLowerCase() : 'date de création';
    if (dim === '_anciennete') {
      return 'Depuis combien de temps le plan existe, en quatre tranches calculées sur « ' + titreDate +
        ' ». Répond à « qu\u2019est-ce qui traîne depuis longtemps ? ».';
    }
    if (dim === '_mois') {
      return 'Le mois où le plan a été créé, un groupe par mois, rangés dans l\u2019ordre du temps. ' +
        'Répond à « de quelle vague vient ce lot ? » \u2014 l\u2019ancienneté, elle, regroupe en tranches.';
    }
    if (dim === 'avancement') {
      return 'La valeur brute de la colonne d\u2019avancement, telle qu\u2019elle est saisie : ' +
        'd\u2019un coup d\u2019\u0153il, toutes les façons de l\u2019écrire, donc les saisies qui divergent.';
    }
    return '';
  }

  /* DIMENSIONS et TITRE_DIM sont dérivés de la source dans chargerSource(). */
  function remplirDims() {
    $('dim-critique').innerHTML = DIMENSIONS.map(function (d) {
      return '\x3Coption value="' + d.cle + '">' + ech(d.titre) + '\x3C/option>';
    }).join('');
    $('dim-critique').value = vue.dimCritique;
    ajusterChoixDim();
  }

  /* Le menu de la dimension est un mot du titre : sa largeur suit le mot
     choisi, pas le plus long de la liste — sinon « par ATA » traînerait un
     grand blanc avant son chevron. Débrief 21 : plus de mesure au canevas
     (« par ECP, la flèche est cachée ») ; on recopie seulement le mot choisi
     dans sa copie invisible, et la feuille de style fait le reste
     (.choix-titre-cadre) : la largeur suit la police réellement affichée,
     avant comme après son chargement. Le cadre se cache avec le menu. */
  function ajusterChoixDim() {
    var sel = $('dim-critique'), o = sel.options[sel.selectedIndex], mesure = $('dim-critique-mesure');
    sel.style.width = '';
    var mot = o ? o.text : '';
    if (mesure.textContent !== mot) mesure.textContent = mot;
    var cadre = $('dim-critique-cadre');
    if (cadre.hidden !== sel.hidden) cadre.hidden = sel.hidden;
  }

  /* ============================================================ TABLEAU */
  /* La colonne suivie — l'avancement FWD, ou le concept harnais — se range
     juste après la référence et reste figée avec elle : l'état d'un plan se
     lit sans faire défiler cent trente colonnes. C'est la seule entorse à
     l'ordre de la feuille, dans les deux vues. */
  function visibles() {
    var cles = vue.ordre.filter(function (k) { return !vue.cachees[k]; });
    var iSuivie = cles.indexOf(CLE_SUIVIE), iRef = -1;
    for (var i = 0; i < cles.length; i++) if (PAR_CLE[cles[i]] && PAR_CLE[cles[i]].fige) { iRef = i; break; }
    if (iSuivie !== -1 && iRef !== -1 && iSuivie !== iRef + 1) {
      cles.splice(iSuivie, 1);
      if (iSuivie < iRef) iRef--;
      cles.splice(iRef + 1, 0, CLE_SUIVIE);
    }
    return cles.map(function (k) { return PAR_CLE[k]; });
  }
  /* Combien de colonnes restent collées à gauche : tout ce qui précède la
     référence, elle, et la colonne suivie qui la suit. Le calcul suit
     l'ordre affiché au lieu de le supposer. */
  function nbFigees(cols) {
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].fige) return i + 1 + (cols[i + 1] && cols[i + 1].cle === CLE_SUIVIE ? 1 : 0);
    }
    return 0;
  }
  /* Une colonne qui ne se déplace pas : la référence et la colonne suivie. */
  function colonneFixe(c) { return !!c.fige || c.cle === CLE_SUIVIE; }
  function classeFige(i, n) {
    if (i >= n) return '';
    return i === n - 1 ? 'col-fige fige-fin' : 'col-fige';
  }
  function rendreEntetes() {
    var cols = visibles();
    var nFige = nbFigees(cols);
    /* Un groupe a cheval sur la limite du bloc fige est coupe en deux : la
       moitie collee garde le libelle, la suite le laisse vide pour que la
       bande se lise d'un trait. */
    var groupes = [];
    cols.forEach(function (c, i) {
      var colle = i < nFige;
      var d = groupes[groupes.length - 1];
      if (d && d.nom === c.groupe && d.fige === colle) d.n++;
      else groupes.push({ nom: c.groupe, n: 1, fige: colle, debut: i, suite: !!(d && d.nom === c.groupe) });
    });
    var html = '\x3Ctr class="groupes">' + groupes.map(function (g) {
      var cl = g.fige ? (g.debut + g.n === nFige ? 'col-fige fige-fin' : 'col-fige') : '';
      return '\x3Cth colspan="' + g.n + '" data-debut="' + g.debut + '"' + (cl ? ' class="' + cl + '"' : '') +
        '>' + ech(g.suite ? '' : g.nom) + '\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="titres">' + cols.map(function (c, i) {
      var actif = vue.tri.cle === c.cle;
      var fleche = actif ? '\x3Csvg class="fleche" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">\x3Cpath d="' +
        (vue.tri.asc ? 'M5 8.5V1.5M2 4.5 5 1.5l3 3' : 'M5 1.5v7M2 5.5 5 8.5l3-3') +
        '" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>\x3C/svg>' : '';
      var poignee = colonneFixe(c) ? '' : '\x3Cspan class="poignee" aria-hidden="true">\x3Csvg width="7" height="12" viewBox="0 0 7 12" fill="currentColor">' +
        '\x3Ccircle cx="1.6" cy="2" r="1.1"/>\x3Ccircle cx="5.4" cy="2" r="1.1"/>\x3Ccircle cx="1.6" cy="6" r="1.1"/>' +
        '\x3Ccircle cx="5.4" cy="6" r="1.1"/>\x3Ccircle cx="1.6" cy="10" r="1.1"/>\x3Ccircle cx="5.4" cy="10" r="1.1"/>\x3C/svg>\x3C/span>';
      var cl = classeFige(i, nFige);
      return '\x3Cth scope="col" data-cle="' + c.cle + '"' + (cl ? ' class="' + cl + '"' : '') +
        (colonneFixe(c) ? '' : ' draggable="true"') +
        ' aria-sort="' + (actif ? (vue.tri.asc ? 'ascending' : 'descending') : 'none') + '">' +
        poignee + '\x3Cbutton type="button" data-tri="' + c.cle + '">' + ech(c.titre) + fleche + '\x3C/button>\x3C/th>';
    }).join('') + '\x3C/tr>\x3Ctr class="filtres">' + cols.map(function (c, i) {
      var val = vue.filtres[c.cle] || '';
      var cl = classeFige(i, nFige);
      return '\x3Cth' + (cl ? ' class="' + cl + '"' : '') + '>\x3Cinput type="text" data-filtre="' + c.cle + '" value="' + ech(val) +
        '" placeholder="filtrer" data-actif="' + (!!val) + '" aria-label="Filtrer ' + ech(c.titre) + '">\x3C/th>';
    }).join('') + '\x3C/tr>';
    $('tete-tableau').innerHTML = html;
    ajusterSticky();
  }
  /* Un tableau encore hors de l'écran n'est pas mis en page (content-
     visibility) : le mesurer forcerait tout le travail qu'on voulait
     s'épargner. On le mesure quand il paraît. */
  /* L'état vient du navigateur lui-même (contentvisibilityautostatechange) :
     au tout premier rendu, avant qu'il ait tranché, le tableau compte comme
     hors de l'écran. Sans content-visibility, il est toujours « à l'écran ». */
  var CV_AUTO = !!(window.CSS && CSS.supports && CSS.supports('content-visibility', 'auto'));
  var cadresVisibles = {};
  function tableauHorsEcran(cadre) {
    return CV_AUTO && !!cadre && !cadresVisibles[cadre.id];
  }
  function ajusterSticky() { aMesurer('sticky'); }
  /* Les cellules figées du corps lisent leur décalage dans une variable du
     tableau (--fige-0, --fige-1…) : une seule écriture, au lieu d'une par
     cellule et par ligne à chaque tranche (débrief 23). Les en-têtes, peu
     nombreux, gardent le leur. On mesure tout d'abord, on pose ensuite. */
  function styleFige(i, n) { return i < n ? ' style="left:var(--fige-' + i + ',0px)"' : ''; }
  function poserColonnesFigees() {
    if (tableauHorsEcran($('cadre-tableau'))) return;
    var g = document.querySelector('.groupes'), t = document.querySelector('.titres'), f = document.querySelector('.filtres');
    if (!g || !t || !f) return;
    var hg = g.getBoundingClientRect().height;
    var ht = t.getBoundingClientRect().height;
    /* On mesure les colonnes collees et on les pose les unes apres les
       autres. Sans ce cumul, la deuxieme viendrait recouvrir la premiere. */
    var tetes = t.querySelectorAll('th');
    var gauche = [], cumul = 0;
    for (var i = 0; i < tetes.length; i++) {
      if (!tetes[i].classList.contains('col-fige')) break;
      gauche.push(cumul);
      cumul += tetes[i].getBoundingClientRect().width;
    }
    t.querySelectorAll('th').forEach(function (th) { th.style.top = hg + 'px'; });
    f.querySelectorAll('th').forEach(function (th) { th.style.top = (hg + ht) + 'px'; });
    if (!gauche.length) return;
    g.querySelectorAll('th.col-fige').forEach(function (th) {
      var d = parseInt(th.dataset.debut, 10) || 0;
      th.style.left = (gauche[d] || 0) + 'px';
    });

  /* Un tableau de dizaines de milliers de cellules ne se dessine pas d'un

     approche du bas du cadre, ou d'un clic sur « N lignes de plus ». Les

  /* Débrief 18, « le site est très long à charger » : la mise en page des
     292 premières lignes de 136 colonnes (40 000 cellules) prenait l'essentiel
     de l'ouverture — 3 s sur un poste rapide, une vingtaine sur un poste

  var BUDGET_CELLULES = typeof window.SUIVI_FWD_BUDGET === 'number' && window.SUIVI_FWD_BUDGET > 0 ? window.SUIVI_FWD_BUDGET : 6000;
  /* Débrief 23 : à l'ouverture, le tableau pose d'abord vingt lignes — un

  var PREMIERE_TRANCHE = typeof window.SUIVI_FWD_BUDGET === 'number' ? 0 : 20;

  function trancheHtml(t, combien) {

  function poserTranches(corps, total, nbCols, ligneHtml, apres, premiere) {

  function rendreCorps(liste, premiere) {

  /* Seule la colonne d'avancement FWD interesse le suivi : une cellule vide

  /* Ce qui a bougé depuis l'import précédent. Sur 186 lignes, personne ne

  /* « un » et « des » : le libellé s'accorde au compte — « 1 passé en
     terminé », « 20 passés en terminé ». */
  function libelleLot(l, n) { return n > 1 ? l.des : l.un; }
  /* La pastille d'une valeur : la couleur que lui donne la barre ; absente
     du jour, celle de son mot (couleurConnue). */
  function pastilleValeur(cle, famille) {

  }
  /* Une rangée de pastilles (débrief 18), la même pour le journal, le bloc

     elle en a un. Débrief 19 : seulement les valeurs qu'il y a — une valeur
     absente (« absente ») n'a pas de pilule, sauf le choix en cours, qu'on

  function boutonsPastilles(attr, actif, items, premier) {
    var bouton = function (x) {
      return '\x3Cbutton type="button" data-' + attr + '="' + ech(x.cle) + '"' + (x.famille ? ' data-famille="' + x.famille + '"' : '') +

  /* « Copier (n) » : les références d'une liste, une par ligne, pour les

  function boutonCopier(refs) {
    if (!refs || !refs.length) return '';
    return '\x3Cbutton type="button" class="copier" data-copier="' + ech(refs.join('\n')) + '" title="' +

  /* Le presse-papiers : la voie moderne d'abord ; dans le cadre d'Apps

  function copierTexte(texte, fini) {
    function secours() {
      var zone = document.createElement('textarea');
      zone.value = texte;
      zone.setAttribute('readonly', '');
      zone.style.position = 'fixed'; zone.style.top = '-1000px'; zone.style.opacity = '0';
      var avant = document.activeElement;
      document.body.appendChild(zone);
      zone.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(zone);
      if (avant && avant.focus) avant.focus({ preventScroll: true });
      fini(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texte).then(function () { fini(true); }, secours);
        return;

    secours();

    copierTexte(b.getAttribute('data-copier'), function (ok) {

         « Copier (41) » à chaque semaine ouverte) ; la page dit ce qui s'est

      var n = b.getAttribute('data-copier').split('\n').length;

  function marquerDebord(rangee) {

  /* Le bouton d'une rangée, retrouvé après qu'elle a été réécrite : par

  /* L'historique d'un plan, au-dessus du tableau quand il n'en montre qu'un :

  function fondValeur(h) {
    var v = valeurDeCle(h.cle);
    if (v) return v.hachure ? { cls: 'hachure', style: '' } : { cls: '', style: 'background:' + v.couleur };
    var e = ETAT_PAR_CLE[h.famille];

  }
  function rendreFichePlan(liste) {
    var zone = $('fiche-plan');
    var p = liste.length === 1 && vue.base === 'ici' ? liste[0] : null;
    zone.hidden = !p;
    if (!p) { zone.innerHTML = ''; return; }
    var h = historiquePlan(p);

    var dern = h[h.length - 1];

      ? ech(libelleValeur(p[CLE_SUIVIE])) + ' depuis ' + (d.auMoins ? 'au moins ' : '') + ech(semaineDite(d.depuis)) +

    for (var k = 1; k < h.length; k++) {

      if (!a.absent && b.absent) { etapes.push('\x3Cli>' + sem + 'n\u2019est plus dans l\u2019extract\x3C/li>'); continue; }

        (!!h[k - 1] && (!!h[k - 1].absent !== !!c.absent));
      var f = c.inconnu || c.absent ? { cls: c.inconnu ? 'inconnu' : 'absent', style: '' } : fondValeur(c);

      return '\x3Cspan class="case' + (reemis ? ' reemis' : '') + '" title="' + ech(titre) + '">' +
        '\x3Cspan class="bande ' + f.cls + '" style="' + f.style + '">\x3C/span>' +
        '\x3Cspan class="sem">' + (change ? 'S' + numeroSemaine(c.i) : '') + '\x3C/span>\x3C/span>';

    zone.innerHTML = '\x3Cdiv class="fiche-plan-tete">\x3Cspan class="mot">Historique du plan\x3C/span>' +
      '\x3Cb class="ref">' + ech(p.reference) + '\x3C/b>' +
      '\x3Cspan class="etat">' + pastilleValeur(cleValeur(p[CLE_SUIVIE]), p._etat) + ech(libelleValeur(p[CLE_SUIVIE])) + '\x3C/span>' + fermer + '\x3C/div>' +
      (h.length > 1
        ? '\x3Cdiv class="fiche-plan-frise" style="--n:' + h.length + '">' + cases + '\x3C/div>' +
          '\x3Cdiv class="fiche-plan-resume' + (arret ? ' arret' : '') + '">' + resume + (arret ? ' \u2014 \x3Cb>à l\u2019arrêt\x3C/b>' : '') + '.\x3C/div>' +
          (etapes.length ? '\x3Col class="fiche-plan-etapes">' + etapes.join('') + '\x3C/ol>'
            : '\x3Cdiv class="fiche-plan-resume doux">Aucun changement sur les ' + h.length + ' relevés.\x3C/div>')
        : '\x3Cdiv class="fiche-plan-resume doux">Un seul relevé pour l\u2019instant : l\u2019historique se remplira relevé après relevé.\x3C/div>');
  }

  /* À surveiller : les plans à l'arrêt du périmètre, en une puce qui les

  function rendreASurveiller() {
    var zone = $('a-surveiller');
    /* Le nombre dit, c'est le nombre de lignes que le clic montrera : compté
