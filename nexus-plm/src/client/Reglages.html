<script>
// ============================================================
// NEXUS — réglage des pondérations d'équivalence.
//
// Généré à partir du registre de Types.html. Le rail de réglages s'ouvre
// DANS la comparaison, à gauche du classement : on bouge un curseur, le
// classement se recompose à droite. Il n'y a donc plus d'« aperçu » séparé,
// le résultat lui-même est l'aperçu.
//
// Deux partis pris :
//   - les parts totalisent TOUJOURS 100 %. Monter un critère fait
//     mécaniquement descendre les autres : c'est un arbitrage, pas un curseur
//     indépendant. Un total à 250 % ne voudrait rien dire.
//   - on choisit QUELS critères comparer. Un critère écarté disparaît du
//     résultat au lieu d'y figurer barré.
// ============================================================

let porteeReglee = 'boite';

function porteeCourante() { return porteeParCle(porteeReglee); }

// ------------------------------------------------------------
// Rendu
// ------------------------------------------------------------
function curseursHtml() {
  const portee = porteeCourante();

  // Un seul critère possible : il n'y a rien à arbitrer, on le dit.
  if (!porteeArbitrable(portee)) {
    const seul = portee.criteres[0];
    return '<p class="reglage-unique">Un seul critère pour ce type : ' +
           '<b>' + esc(seul ? seul.libelle : '—') + '</b>. ' +
           'Le score en dépend entièrement, il n\'y a pas d\'arbitrage à faire.</p>';
  }

  const actifs = criteresActifs(portee.cle);

  const lignes = actifs.map(function (c) {
    const part = Math.max(0, Number(Store.poids[portee.cle][c.cle]) || 0);
    const seul = actifs.length === 1;
    return '<div class="reglage">' +
      '<div class="reglage-tete">' +
        '<label for="poids-' + esc(c.cle) + '">' + esc(c.libelle) + '</label>' +
        '<span class="reglage-part">' + part + ' %</span>' +
        '<button type="button" class="reglage-retirer"' +
          dataAttrs({ action: 'retirer-critere', critere: c.cle }) +
          (seul ? ' disabled title="Il faut garder au moins un critère"'
                : ' title="Retirer ce critère de la comparaison"') +
          ' aria-label="Retirer ' + esc(c.libelle) + '">−</button>' +
      '</div>' +
      '<input type="range" min="0" max="100" step="1" value="' + part + '"' +
        ' id="poids-' + esc(c.cle) + '" class="curseur"' +
        ' data-portee="' + esc(portee.cle) + '" data-critere="' + esc(c.cle) + '"' +
        ' aria-label="Part de ' + esc(c.libelle) + '">' +
      '<div class="reglage-jauge"><span style="width:' + part + '%"></span></div>' +
    '</div>';
  }).join('');

  return lignes + totalHtml(portee) + critereDisponiblesHtml(portee);
}

function totalHtml(portee) {
  const total = criteresActifs(portee.cle).reduce(function (t, c) {
    return t + (Number(Store.poids[portee.cle][c.cle]) || 0);
  }, 0);
  return '<p class="reglage-total' + (total === 100 ? '' : ' reglage-total-faux') + '">' +
         'Total ' + total + ' %</p>';
}

function critereDisponiblesHtml(portee) {
  const inactifs = portee.criteres.filter(function (c) {
    return !critereEstActif(portee.cle, c.cle);
  });
  if (!inactifs.length) return '';
  return '<div class="criteres-dispo">' +
    '<h4>Critères écartés</h4>' +
    inactifs.map(function (c) {
      return '<button type="button" class="btn-ajout-critere"' +
             dataAttrs({ action: 'ajouter-critere', critere: c.cle }) + '>' +
             '<span aria-hidden="true">+</span> ' + esc(c.libelle) + '</button>';
    }).join('') +
  '</div>';
}

function rendreReglages() {
  const portee = porteeCourante();
  definirTexte('reglagesPortee', porteeArbitrable(portee)
    ? portee.libelle + ' — ' + criteresActifs(portee.cle).length + ' critère(s) retenu(s)'
    : portee.libelle);
  definirHtml('reglagesCurseurs', curseursHtml());
  definirTexte('seuilValeur', seuil() + ' %');
  const s = parId('seuilCurseur');
  if (s) s.value = seuil();
  const avert = parId('reglagesModifies');
  if (avert) avert.hidden = !poidsModifies();
}

/**
 * Redessine les parts sans reconstruire les curseurs : on garde celui que
 * l'utilisateur tient sous le doigt, mais les AUTRES doivent suivre puisqu'ils
 * viennent d'être redistribués.
 */
function rafraichirCurseurs(cleTenue) {
  const portee = porteeCourante();
  document.querySelectorAll('.reglage').forEach(function (bloc) {
    const curseur = bloc.querySelector('.curseur');
    if (!curseur) return;
    const part = Math.max(0, Number(Store.poids[portee.cle][curseur.dataset.critere]) || 0);
    if (curseur.dataset.critere !== cleTenue) curseur.value = part;
    const etiquette = bloc.querySelector('.reglage-part');
    if (etiquette) etiquette.textContent = part + ' %';
    const jauge = bloc.querySelector('.reglage-jauge span');
    if (jauge) jauge.style.width = part + '%';
  });
  const total = parId('reglagesCurseurs') && parId('reglagesCurseurs').querySelector('.reglage-total');
  if (total) {
    const somme = criteresActifs(portee.cle).reduce(function (t, c) {
      return t + (Number(Store.poids[portee.cle][c.cle]) || 0);
    }, 0);
    total.textContent = 'Total ' + somme + ' %';
    total.classList.toggle('reglage-total-faux', somme !== 100);
  }
  const avert = parId('reglagesModifies');
  if (avert) avert.hidden = !poidsModifies();
}

// ------------------------------------------------------------
// Le rail : ouvert ou fermé, à côté du classement
// ------------------------------------------------------------
function railOuvert() {
  const rail = parId('reglagesRail');
  return !!rail && !rail.hidden;
}

function afficherRail(ouvert) {
  const rail = parId('reglagesRail');
  if (!rail) return;
  rail.hidden = !ouvert;
  const corps = parId('compareCorps');
  if (corps) corps.classList.toggle('avec-reglages', ouvert);
  const bouton = parId('btnReglages');
  if (bouton) {
    bouton.setAttribute('aria-expanded', String(ouvert));
    bouton.classList.toggle('actif', ouvert);
  }
}
</script>
