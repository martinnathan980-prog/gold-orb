        '" aria-pressed="' + actif + '">' +
        pastille + '<b>' + nb(COMPARATIF[l.cle].length) + '</b> ' + l.libelle + '</button>';
    });
    zone.innerHTML = '<span>Depuis l\u2019import du ' + etiquette(RELEVES[RELEVES.length - 2].i) + ' :</span>' +
      (morceaux.length ? morceaux.join('') : '<span>aucun changement.</span>');
  }

  function rendreIncomplets() {
    var col = PAR_CLE[COLONNE_SUIVIE];
    var n = 0;
    for (var i = 0; i < PLANS.length; i++) {
      if (String(PLANS[i][COLONNE_SUIVIE] == null ? '' : PLANS[i][COLONNE_SUIVIE]).trim() === '') n++;
    }
    if (!n) { $('incomplets').innerHTML = ''; return; }
    $('incomplets').innerHTML =
      '<button class="puce-vide" type="button" data-vide="' + COLONNE_SUIVIE + '" aria-pressed="' + !!vue.vides[COLONNE_SUIVIE] +
      '" title="N\u2019afficher que les plans dont ' + ech(col.titre) + ' est vide">' +
      ech(col.titre) + ' non renseign\u00e9 <b>' + nb(n) + '</b></button>';
  }

  function majOmbre() {
    var d = $('defile');
    $('cadre-tableau').dataset.deborde = (d.scrollWidth - d.clientWidth - d.scrollLeft) > 4 ? 'true' : 'false';
  }

  function rendre() {
    var liste = selection();
    rendreAvancement(liste);
    rendreGraphique(liste);
    rendreCritique(liste);
    rendreEntetes();
    rendreCorps(liste);
    rendrePanneauColonnes();
    rendreComparatif();
    rendreIncomplets();
    $('reinit').hidden = !filtreActif();
    planifierSauvegarde();
  }

  /* ============================================================ EVENEMENTS */
  var minuteur = null;
  $('recherche').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(function () { vue.recherche = v; rendre(); }, 170);
  });

  $('etats').addEventListener('click', function (e) {
    var b = e.target.closest('.etat-btn');
    if (!b) return;
    vue.etat = vue.etat === b.dataset.etat ? '' : b.dataset.etat;
    rendre();
  });

  /* Survol : on voit tout de suite lesquels, sans avoir à filtrer. */
  var MAX_APERCU = 12;
  $('comparatif').addEventListener('mousemove', function (e) {
    var b = e.target.closest('.puce-delta');
    var bulle = $('bulle');
    if (!b || !COMPARATIF) { bulle.dataset.visible = 'false'; return; }
    var lot = LOTS_DELTA.filter(function (l) { return l.cle === b.dataset.delta; })[0];
    var refs = COMPARATIF[b.dataset.delta];
    bulle.innerHTML = '<div class="tete-bulle">' + nb(refs.length) + ' ' + ech(lot.libelle) + '</div>' +
      '<div class="liste-refs">' + refs.slice(0, MAX_APERCU).map(ech).join('<br>') +
      (refs.length > MAX_APERCU ? '<br><span class="doux">et ' + nb(refs.length - MAX_APERCU) + ' autres\u2026</span>' : '') +
      '</div><div class="doux" style="margin-top:6px;padding-top:5px;border-top:1px solid var(--filet)">' +
      (vue.refsLibelle === b.dataset.delta ? 'Cliquez pour retirer le filtre' : 'Cliquez pour n\u2019afficher que ceux-l\u00e0') +
      '</div>';
    bulle.dataset.visible = 'true';
    bulle.style.left = Math.min(e.clientX + 14, window.innerWidth - bulle.offsetWidth - 12) + 'px';
    bulle.style.top = Math.min(e.clientY + 16, window.innerHeight - bulle.offsetHeight - 12) + 'px';
  });
  $('comparatif').addEventListener('mouseleave', function () { $('bulle').dataset.visible = 'false'; });

  $('comparatif').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-delta');
    if (!b) return;
    var cle = b.dataset.delta;
    if (vue.refsLibelle === cle) { vue.refs = null; vue.refsLibelle = ''; }
    else {
      vue.refs = {};
      COMPARATIF[cle].forEach(function (r) { vue.refs[r] = true; });
      vue.refsLibelle = cle;
    }
    rendre();
  });

  $('incomplets').addEventListener('click', function (e) {
    var b = e.target.closest('.puce-vide');
    if (!b) return;
    var k = b.dataset.vide;
    if (vue.vides[k]) delete vue.vides[k]; else vue.vides[k] = true;
    rendre();
  });

  $('dim-critique').addEventListener('change', function (e) {
    vue.dimCritique = e.target.value; vue.groupe = null; rendre();
  });
  $('zone-critique').addEventListener('click', function (e) {
    /* Un en-tete de colonne : premier clic dans le sens naturel, deuxieme dans
       l'autre, troisieme retour au classement par defaut. */
    var t = e.target.closest('button[data-trig]');
    if (t) {
      var cle = t.dataset.trig, naturel = (cle === 'nom');
      if (vue.triGroupe.cle !== cle) vue.triGroupe = { cle: cle, asc: naturel };
      else if (vue.triGroupe.asc === naturel) vue.triGroupe = { cle: cle, asc: !naturel };
      else vue.triGroupe = { cle: null, asc: false };
      planifierSauvegarde();
      rendreCritique(selection());
      var repris = document.querySelector('button[data-trig="' + cle + '"]');
      if (repris) repris.focus();
      return;
    }
    if (e.target.closest('#aide-fin')) {
      vue.aideFin = !vue.aideFin;
      rendreCritique(selection());
      var bouton = $('aide-fin');
      if (bouton) bouton.focus();
      return;
    }
    var b = e.target.closest('.critique-ligne');
    if (!b) return;
    var meme = vue.groupe && vue.groupe.dim === vue.dimCritique && vue.groupe.val === b.dataset.groupe;
    vue.groupe = meme ? null : { dim: vue.dimCritique, val: b.dataset.groupe };
    rendre();
  });

  $('bascule-colonnes').addEventListener('click', function (e) {
    e.stopPropagation();
    var p = $('panneau-colonnes');
    p.hidden = !p.hidden;
    $('bascule-colonnes').setAttribute('aria-expanded', String(!p.hidden));
  });
  document.addEventListener('click', function (e) {
    if (!$('panneau-colonnes').hidden && !e.target.closest('#panneau-colonnes') && !e.target.closest('#bascule-colonnes')) {
      $('panneau-colonnes').hidden = true;
      $('bascule-colonnes').setAttribute('aria-expanded', 'false');
    }
    if ($('saisie-jalon').dataset.ouvert === 'true' && !e.target.closest('#cadre-graphe')) fermerSaisie();
  });
  $('panneau-colonnes').addEventListener('change', function (e) {
    var c = e.target.closest('input[data-col]');
    if (!c) return;
    if (c.checked) delete vue.cachees[c.dataset.col]; else vue.cachees[c.dataset.col] = true;
    rendreEntetes(); rendreCorps(selection()); rendrePanneauColonnes();
  });
  $('panneau-colonnes').addEventListener('click', function (e) {
    if (!e.target.closest('#tout-colonnes')) return;
    vue.cachees = {};
    rendreEntetes(); rendreCorps(selection()); rendrePanneauColonnes();
  });

  var tete = $('tete-tableau');
  tete.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tri]');
    if (!b) return;
    if (vue.tri.cle === b.dataset.tri) vue.tri.asc = !vue.tri.asc;
    else vue.tri = { cle: b.dataset.tri, asc: true };
    rendreEntetes(); rendreCorps(selection());
  });
  var minuteurFiltre = null;
  tete.addEventListener('input', function (e) {
    var c = e.target.closest('input[data-filtre]');
    if (!c) return;
    var cle = c.dataset.filtre, val = c.value;
    c.dataset.actif = String(!!val);
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(function () {
      if (val) vue.filtres[cle] = val; else delete vue.filtres[cle];
      var liste = selection();
      rendreAvancement(liste); rendreGraphique(liste); rendreCritique(liste); rendreCorps(liste);
      $('reinit').hidden = !filtreActif();
    }, 170);
  });

  /* L ordre cible est calcule APRES le retrait de la colonne source,
     sinon l insertion se decale d un cran. */
  function reordonner(liste, source, cible) {
    var de = liste.indexOf(source), vers = liste.indexOf(cible);
    if (de === -1 || vers === -1 || de === vers) return liste;
    var copie = liste.slice();
    var col = copie.splice(de, 1)[0];
    var pos = copie.indexOf(cible);
    copie.splice(de < vers ? pos + 1 : pos, 0, col);
    return copie;
  }
  var cleGlissee = null;
  tete.addEventListener('dragstart', function (e) {
    var th = e.target.closest('th[draggable]');
    if (!th) return;
    cleGlissee = th.dataset.cle;
    th.classList.add('glisse');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cleGlissee);
  });
  tete.addEventListener('dragover', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee || th.dataset.cle === cleGlissee) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; th.classList.add('cible');
  });
  tete.addEventListener('dragleave', function (e) {
    var th = e.target.closest('tr.titres th');
    if (th) th.classList.remove('cible');
  });
  tete.addEventListener('drop', function (e) {
    var th = e.target.closest('tr.titres th');
    if (!th || !cleGlissee) return;
    e.preventDefault(); th.classList.remove('cible');
    vue.ordre = reordonner(vue.ordre, cleGlissee, th.dataset.cle);
    cleGlissee = null;
    rendreEntetes(); rendreCorps(selection());
  });
  tete.addEventListener('dragend', function () {
    cleGlissee = null;
    tete.querySelectorAll('.glisse, .cible').forEach(function (el) { el.classList.remove('glisse', 'cible'); });
  });

  $('reinit').addEventListener('click', function () {
    vue.recherche = ''; vue.etat = ''; vue.filtres = {}; vue.groupe = null; vue.vides = {};
    vue.refs = null; vue.refsLibelle = '';
    $('recherche').value = '';
    rendre();
  });
  $('defile').addEventListener('scroll', majOmbre, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') fermerSaisie();
    if (e.key === '/' && document.activeElement !== $('recherche')) {
      e.preventDefault(); $('recherche').focus(); $('recherche').select();
    }
  });
  var minuteurTaille = null;
  window.addEventListener('resize', function () {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(function () {
      fermerSaisie(); rendreGraphique(selection()); ajusterSticky(); majOmbre();
      alignerEtats(compte(selection()));
    }, 160);
  });

  chargerPrefs();
  remplirDims();
  rendre();
})();
</script>
